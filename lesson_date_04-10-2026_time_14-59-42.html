w I can't keep track of where I put them.","It's difficult to keep track of everything happening in the news lately.","Can you keep track of the time while I'm busy in the kitchen?"],"synonyms":["monitor","follow","keep tabs on","observe","stay updated on","trace","supervise"],"antonyms":["lose track of"],"gap":{"sentence":"Since I have so many different projects running at once, I need a system to _____ their progress.","answer":"keep track of","options":["keep track of","take part in","get ahead of","look forward to"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/173655-174119.webm","at":1736.7,"dur":4.64}},{"term":"downside","pos":"noun","definition":"A negative aspect, disadvantage, or drawback of a situation or plan.","time":1865.1,"lesson":"We can start with one disadvantage and then talk about another important downside.","examples":[{"sentence":"The main downside of living in a big city is the high cost of rent.","pattern":"The main downside of [-ing/noun]"},{"sentence":"One potential downside to this plan is that it might take longer than expected.","pattern":"potential downside to [noun]"},{"sentence":"Every investment has its downsides; you have to weigh the risks carefully.","pattern":"have its downsides (plural)"},{"sentence":"The downside is that we won't have enough time to finish the project today.","pattern":"The downside is that [clause]"}],"countable":[{"meaning":"A negative aspect, disadvantage, or drawback of a situation or plan.","example":"We can start with one disadvantage and then talk about another important downside.","lesson":true}],"uncountable":[],"more_examples":["The only downside to the new job is the long commute.","Is there any downside to switching to a paperless system?","One downside of social media is that it can be very addictive."],"synonyms":["disadvantage","drawback","con","shortcoming","pitfall","liability"],"antonyms":["advantage","benefit","merit","upside"],"gap":{"sentence":"Working from home is very convenient, but the only _____ is feeling a bit isolated from my colleagues.","answer":"downside","options":["downside","benefit","advantage","plus"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/186226-186881.webm","at":1862.4,"dur":6.55}},{"term":"that being said","pos":"expression","definition":"used to introduce a statement that contrasts with or modifies what was just mentioned.","time":1922.5,"lesson":"Well, that being said, one noticeable downside is... Can you shift the emphasis here?","examples":[{"sentence":"The hotel is quite expensive; that being said, the service is world-class.","pattern":"Sentence A; that being said, Sentence B"},{"sentence":"I know you're tired. That being said, we really need to finish this project tonight.","pattern":"That being said, + clause"},{"sentence":"The new software has some bugs. That being said, it is much faster than the old version.","pattern":""},{"sentence":"He is very young for the role. That being said, he has a lot of experience.","pattern":"That being said, + subject + verb"}],"more_examples":["The restaurant is quite small. That being said, the food is absolutely delicious.","I don't have much experience in marketing. That being said, I'm a very quick learner.","The commute to the city is long. That being said, the salary makes it worth it."],"synonyms":["having said that","even so","nevertheless","nonetheless","all the same","still","in spite of that"],"antonyms":["therefore","consequently","as a result","thus","so","accordingly"],"gap":{"sentence":"The apartment is quite small and lacks natural light; _____, it is located in a very convenient neighborhood.","answer":"that being said","options":["that being said","for example","consequently","specifically"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/192632-192845.webm","at":1926.5,"dur":2.13}},{"term":"shift the emphasis","pos":"expression","definition":"To change the focus or importance of a specific part of a sentence or idea.","time":1934.8,"lesson":"Can you shift the emphasis somehow here to this? Let's just use the word 'important' here instead.","examples":[{"sentence":"The report needs to shift the emphasis from the costs to the potential benefits.","pattern":"shift the emphasis from [A] to [B]"},{"sentence":"By using the word 'critical,' you shift the emphasis toward the urgency of the situation.","pattern":"shift the emphasis toward [something]"},{"sentence":"The director wanted to shift the emphasis of the movie toward the characters' emotions.","pattern":"shift the emphasis of [something] toward [something]"},{"sentence":"Can we shift the emphasis slightly to make the conclusion sound more positive?","pattern":"shift the emphasis + adverb (slightly/slightly)"}],"more_examples":["We need to shift the emphasis from the technical specifications to the user experience.","The marketing team suggested shifting the emphasis toward the brand's sustainability efforts.","Instead of focusing on the problem, let's shift the emphasis to the solution."],"synonyms":["reframe","reposition","change the focus","reorient","redirect the attention"],"antonyms":["maintain the focus","keep the emphasis"],"gap":{"sentence":"The marketing team needs to _____ from the product's technical features to how it actually improves the user's daily life.","answer":"shift the emphasis","options":["shift the emphasis","keep the focus","ignore the details","repeat the facts"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/193620-194089.webm","at":1936.4,"dur":4.69}},{"term":"open to discussion","pos":"expression","definition":"willing to listen to other opinions or consider different suggestions before making a final decision.","time":2047.9,"lesson":"Let's see. I am open to a discussion regarding which phrasing is better.","examples":[{"sentence":"The final date for the project is still open to discussion.","pattern":"subject + is/are + open to discussion"},{"sentence":"I'm open to di .","pattern":"fluctuate between [X] and [Y]"},{"sentence":"The company's profits have fluctuated wildly since the new policy was introduced.","pattern":"have fluctuated"},{"sentence":"The exchange rate fluctuates depending on the global economy.","pattern":"fluctuate depending on"}],"more_examples":["The number of people attending the festival fluctuates depending on the weather.","My energy levels fluctuate throughout the afternoon, so I need a coffee break.","The demand for the product fluctuates based on seasonal trends."],"synonyms":["vary","ebb and flow","shift","oscillate","swing","move up and down"],"antonyms":["stabilize","remain steady","stay constant","level off"],"gap":{"sentence":"The electricity bill _____ every month because our energy consumption changes depending on the weather.","answer":"fluctuates","options":["fluctuates","remains","stabilizes","stagnates"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/419315-419717.webm","at":4193.3,"dur":4.02}},{"term":"over the course of","pos":"expression","definition":"during the period of time that something is happening or continuing.","time":4193.0,"lesson":"This figure has been fluctuating over the course of the period.","examples":[{"sentence":"The company's profits grew steadily over the course of the year.","pattern":"over the course of + [time period]"},{"sentence":"She gained a lot of experience over the course of her internship.","pattern":"over the course of + [event/experience]"},{"sentence":"The temperature dropped significantly over the course of the night.","pattern":"over the course of + [time of day]"},{"sentence":"Many changes occurred over the course of the decade.","pattern":"over the course of + [long duration]"}],"more_examples":["The old building was slowly demolished over the course of several months.","He managed to learn basic conversational Spanish over the course of his summer vacation.","The marathon runners lost a lot of weight over the course of the training program."],"synonyms":["during","throughout","during the period of","through","over"],"antonyms":["at the beginning of","at the end of"],"gap":{"sentence":"The project was quite complex, but the team managed to complete every stage _____ three months.","answer":"over the course of","options":["over the course of","at the start of","instead of","regardless of"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/419315-419717.webm","at":4193.3,"dur":4.02}}],"dialogues":[{"title":"Dancing, drinking, and accents","lines":[{"speaker":"A","text":"The previous parties were well-promoted on social media. Since the whole Latino community in Nizhny Novgorod knows each other, everyone just shows up.","highlights":["shows up"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/000678-001832.webm","at":6.9,"dur":11.54}]},{"speaker":"B","text":"Did you have to pay for a ticket to get into the bar?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/003340-004076.webm","at":33.6,"dur":7.36}]},{"speaker":"A","text":"It was only 300, which is fine. I usually don't buy drinks there because everyone brings their own alcohol and leaves it outside.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/004088-004472.webm","at":41.1,"dur":3.84},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/006826-007893.webm","at":68.5,"dur":10.67}]},{"speaker":"B","text":"I'm actually a dancer. I haven't been to a class in a long time, but I used to dance regularly for about 15 years.","highlights":["in a long time"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/009950-010847.webm","at":99.7,"dur":8.97},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/012942-013371.webm","at":129.6,"dur":4.29}]},{"speaker":"B","text":"I gave it up when I started university, but I still love to improvise to Afro or Latino music. I can do Bachata and Merengue too.","highlights":["gave it up"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/013752-015198.webm","at":137.6,"dur":14.46}]},{"speaker":"A","text":"I've never really learned how to dance, but I realized a few years ago that I love it, especially for the sheer joy of expressing myself.","highlights":["sheer joy"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/019020-020404.webm","at":190.4,"dur":13.84}]},{"speaker":"A","text":"It's always just improvisation. It looks a bit crazy, but if everyone is a little drunk, people enjoy it.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/023040-023651.webm","at":230.5,"dur":6.11},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/024572-025475.webm","at":245.9,"dur":9.03}]},{"speaker":"A","text":"Lately, I've found it hard to speak English when I'm drunk. I struggle to move my tongue to make the right sounds.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/025712-026215.webm","at":257.3,"dur":5.03},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/027275-027816.webm","at":272.9,"dur":5.41}]},{"speaker":"B","text":"Maybe you'll lose the accent, but you'll still have that Russian sound. Sometimes that happens to me too.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/028204-029503.webm","at":283.0,"dur":12.99}]},{"speaker":"B","text":"People actually ask me to crank up my Russian accent because they find it sexy. I don't have it naturally; I'm just wearing it.","highlights":["crank up"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/030470-031845.webm","at":304.9,"dur":13.75}]}],"time":6.9,"topic":0},{"title":"Accent practice, technical issues, and essay feedback","lines":[{"speaker":"A","text":"I feel a bit uncomfortable speaking with such a strong Russian accent. I need to focus more on my pronunciation, but it feels more natural to just speak as I normally do.","highlights":["natural to just speak"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/033932-035212.webm","at":339.5,"dur":12.8}]},{"speaker":"B","text":"I noticed that I have a specific flow. My brain automatically picks up certain patterns, but other sounds still sound recognizably Russian. Did you learn to speak with an American accent through shadowing?","highlights":["automatically picks up"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/038240-038673.webm","at":382.6,"dur":4.33},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/039106-040573.webm","at":391.3,"dur":14.67}]},{"speaker":"A","text":"I've always shadowed, but not for a specific purpose. I just listen to a person and try to mimic them. I've actually never spoken to any native speakers.","highlights":["mimic them"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/041338-042798.webm","at":413.6,"dur":14.6}]},{"speaker":"B","text":"How are you feeling right now? Are you hungover?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/045052-046139.webm","at":450.7,"dur":10.87}]},{"speaker":"A","text":"Not really. I wasn't super drunk, but I found it really difficult to wake up. I'm just starving because I didn't have time to eat before class.","highlights":["difficult to wake up"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/046186-046518.webm","at":462.1,"dur":3.32},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/047014-047768.webm","at":470.3,"dur":7.54}]},{"speaker":"B","text":"Well, you had time to put on makeup, but not to eat? I just used some concealer to hide my dark circles and some mascara so I'd look a bit more alive.","highlights":["dark circles"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/049204-050563.webm","at":492.1,"dur":13.59}]},{"speaker":"A","text":"I'm not sure why the connection keeps freezing. Maybe it's my internet. It was getting stuck yesterday too, so I might switch to a different connection.","highlights":["getting stuck"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/052286-053538.webm","at":523.0,"dur":12.52}]},{"speaker":"B","text":"You should buy a LAN cable. It's a must-have for anyone who works remotely. You connect it to your router and your connection will get ten times better.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/054504-055988.webm","at":545.2,"dur":14.84},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/055318-056701.webm","at":556.5,"dur":13.83}]},{"speaker":"A","text":"I've connected it now. Thank you. Can we start? I saw the link you sent.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/059964-061293.webm","at":599.7,"dur":13.29}]},{"speaker":"B","text":"I've noticed your essays are getting better and better. I've updated the examples for advantages and disadvantages because there were too many without explanations.","highlights":["getting better and better"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/063088-063821.webm","at":631.1,"dur":7.33},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/065912-066898.webm","at":659.2,"dur":9.86}]},{"speaker":"A","text":"I was thinking for ages about the idea for the second paragraph regarding how national identity is becoming less important.","highlights":["thinking for ages"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/067798-068013.webm","at":678.1,"dur":2.15},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/068958-069427.webm","at":689.8,"dur":4.69}]}],"time":339.5,"topic":1},{"title":"Refining a text about traditions","lines":[{"speaker":"A","text":"I actually came up with the idea myself, but I asked my sister to help me brainstorm. Let's see if this is a good idea or not.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/069438-070262.webm","at":694.6,"dur":8.24}]},{"speaker":"B","text":"Our national identity is becoming... we need to use the present tense here.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/072314-072861.webm","at":723.3,"dur":5.47}]},{"speaker":"A","text":"When you're writing, it's really important to look back at the title and check it against what you're actually writing.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/073690-074621.webm","at":737.0,"dur":9.31}]},{"speaker":"B","text":"I don't really like the word 'strange' in this example. I wrote it down intending to correct it later, but I completely forgot.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/077156-078146.webm","at":771.7,"dur":9.9}]},{"speaker":"A","text":"Maybe 'harmful' would work? Oh, wait, you've already used 'harmful' at the end of the text.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/078916-079355.webm","at":789.4,"dur":4.39}]},{"speaker":"B","text":"The idea is good, but it's complex. We need to be careful when we are communicating this.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/082450-083461.webm","at":824.6,"dur":10.11}]},{"speaker":"A","text":"Your definition of arranged marriages doesn't really fit the word 'strange'. What's your attitude towards this tradition?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/084996-086199.webm","at":850.1,"dur":12.03}]},{"speaker":"B","text":"I'm not a supporter of it. It feels wild and outdated. 'Harmful' is accurate, but since you used that already, 'outdated' works well here.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/087788-088939.webm","at":878.1,"dur":11.51},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/089740-091143.webm","at":897.6,"dur":14.03}]},{"speaker":"A","text":"You claim traditions disappear, but they don't disappear in the home country. They disappear among immigrants. Is 'among immigrants' clear enough?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/094234-095187.webm","at":942.4,"dur":9.53}]},{"speaker":"B","text":"I think 'that disappear among immigrants' is fine. Or we could say 'that immigrants stop following.'","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/102103-102847.webm","at":1021.1,"dur":7.44},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/104708-105315.webm","at":1047.3,"dur":6.07}]},{"speaker":"A","text":"I'm losing track of what we're doing. We could say 'traditions are neglected by immigrants.'","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/111796-114147.webm","at":1118.2,"dur":23.51},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/113912-114364.webm","at":1139.3,"dur":4.52}]},{"speaker":"B","text":"Does 'follow the custom' work? I'm looking for a synonym for tradition.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/114934-116010.webm","at":1149.5,"dur":10.76}]},{"speaker":"A","text":"You could say 'obey the custom' or 'adhere to customs.' 'Adhere' is a great verb.","highlights":["adhere to customs"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/116146-117624.webm","at":1161.7,"dur":14.78}]}],"time":694.6,"topic":2},{"title":"Using surveys to strengthen arguments","lines":[{"speaker":"A","text":"I'm really glad this word will definitely show up in the review.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/121090-121585.webm","at":1211.1,"dur":4.95}]},{"speaker":"B","text":"I'm actually more interested in what you think of my second example, to be honest.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/125524-125948.webm","at":1255.5,"dur":4.24}]},{"speaker":"A","text":"If you had more friends, you'd have to look after your liver much better!","highlights":["look after"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/126523-127259.webm","at":1265.4,"dur":7.36}]},{"speaker":"B","text":"I'm happy I'm not that close to many people, honestly. Also, mentioning public service isn't that important here.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/127680-128735.webm","at":1277.0,"dur":10.55}]},{"speaker":"A","text":"Examples need to be convincing. We only use surveys when the argument sounds a bit weak without them.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/130164-131529.webm","at":1301.7,"dur":13.65}]},{"speaker":"B","text":"Right. For instance, the fact that there are millions of illegal immigrants in Europe is well known.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/135660-136660.webm","at":1356.8,"dur":10.0}]},{"speaker":"A","text":"But the statement about 30% of young men under 25 not dating in the last two years definitely needs proof.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/136942-138329.webm","at":1369.6,"dur":13.87}]},{"speaker":"B","text":"Exactly. It's not obvious. So, I can use a survey just to make the argument sound more convincing.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/134004-134862.webm","at":1340.2,"dur":8.58}]},{"speaker":"A","text":"Since it's obvious that Moroccans live in Spain and their traditions die out, we don't need commas here.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/143326-144379.webm","at":1433.5,"dur":10.53}]},{"speaker":"B","text":"So the sentence is: 'Nevertheless, grandchildren of immigrants from Northern Africa who live in Spain don't follow their customs.'","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/148768-149207.webm","at":1487.9,"dur":4.39}]},{"speaker":"A","text":"Since they don't feel related, they don't follow the customs. We should use 'therefore' as a logical connector.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/158108-158939.webm","at":1581.3,"dur":8.31}]},{"speaker":"B","text":"Perfect. The example makes sense. Let's move on to the second body paragraph.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/160140-160970.webm","at":1601.6,"dur":8.3}]}],"time":1211.1,"topic":2},{"title":"Discussing scholarship types and essay structure","lines":[{"speaker":"A","text":"That's the only normal thing that came to my mind. I've seen tons of these scholarships while researching European universities.","highlights":["came to my mind"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/163852-165302.webm","at":1638.7,"dur":14.5}]},{"speaker":"B","text":"Tell me more. What kind of scholarships are there? You can usually find financial aid, especially for people from specific backgrounds.","highlights":["financial aid"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/166806-168140.webm","at":1668.3,"dur":13.34}]},{"speaker":"A","text":"Wait, did you say 'financial aid'? Like, we give money to people or pay off mortgages? No, it's 'aid' with a 'D' at the end.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/168120-168407.webm","at":1681.3,"dur":2.87},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/170975-171285.webm","at":1709.9,"dur":3.1}]},{"speaker":"B","text":"Right, 'aid'. Anyway, about the scholarships, there are many types: some for students from China, some for EU citizens, or even for people from Latin America, India, Pakistan, or Ethiopia.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/176674-178134.webm","at":1766.8,"dur":14.6}]},{"speaker":"A","text":"I see. But our ideas aren't there. If your body paragraph is about scholarships, that example should be in your prototype.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/180142-181607.webm","at":1801.5,"dur":14.65}]},{"speaker":"B","text":"Is it possible to use a different example? I usually do that. But wait, I forgot to update the introduction; it still mentions two ideas while this paragraph only has one.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/182006-182923.webm","at":1820.3,"dur":9.17}]},{"speaker":"A","text":"That's fine. We can start with one disadvantage and then move to another important downside. However, the emphasis feels a bit off because of the wording.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/185896-186881.webm","at":1859.2,"dur":9.85},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/187460-187656.webm","at":1874.8,"dur":1.96}]},{"speaker":"B","text":"Can we shift the emphasis? Let's just use 'important' here and 'another noticeable downside' there. Also, this sentence sounds a bit Russian; we should change 'for application applicants' to 'for applicants'.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/196030-196485.webm","at":1960.4,"dur":4.55},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/201378-202334.webm","at":2014.0,"dur":9.56}]},{"speaker":"A","text":"Where should we put that? Maybe 'applicants from certain countries'? Or 'based on applicants' nationality'? The second choice is more natural and immediately clear.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/202372-203480.webm","at":2023.9,"dur":11.08},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/209276-209681.webm","at":2093.0,"dur":4.05}]},{"speaker":"B","text":"I think I'll go with that, but I'd make it slightly more specific. For example, 'because European universities' works well.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/215104-216564.webm","at":2151.2,"dur":14.6}]}],"time":1638.7,"topic":2},{"title":"Criteria for good examples and essay writing","lines":[{"speaker":"A","text":"I feel like 'European universities' sounds a bit better than just 'Italian universities.'","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/216554-217303.webm","at":2165.6,"dur":7.49}]},{"speaker":"A","text":"It's not about the number of facts. It has to satisfy certain criteria: it must be convincing, representative of a large group, and actually prove your point.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/220046-221349.webm","at":2200.7,"dur":13.03}]},{"speaker":"B","text":"I'm sorry, the connection cut out for a second. Were you saying that the example needs to be representative?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/225890-226893.webm","at":2259.1,"dur":10.03}]},{"speaker":"A","text":"Yes, exactly. It's not about how many names or specific universities you list. It just needs to be self-explanatory and represent a large enough group.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/228054-229500.webm","at":2286.1,"dur":14.46}]},{"speaker":"B","text":"I see. I also realized I need to include the disadvantages. It's hard to paraphrase 'disadvantages' into nouns like 'unification' or 'elimination.'","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/235660-236559.webm","at":2356.8,"dur":8.99},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/237828-238668.webm","at":2378.5,"dur":8.4}]},{"speaker":"A","text":"The term 'disappearance' feels too strong. The title says identity is becoming less important, but you're implying it will vanish completely.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/240732-242015.webm","at":2407.4,"dur":12.83}]},{"speaker":"B","text":"I'm trying to find the right word. 'Destructive' is okay, but maybe 'neglect' is better? I'm struggling to find the right adjective.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/242312-244073.webm","at":2425.8,"dur":17.61},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/243466-244153.webm","at":2446.2,"dur":6.87}]},{"speaker":"A","text":"You're doing great, but you're overthinking. This is the struggle you face every single sentence when writing an essay.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/249168-249625.webm","at":2491.8,"dur":4.57},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/250998-252965.webm","at":2518.5,"dur":19.67}]},{"speaker":"B","text":"Right. If you can't find the perfect synonym, you have to figure out how to paraphrase the entire sentence.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/253058-254384.webm","at":2530.8,"dur":13.26}]}],"time":2165.6,"topic":2},{"title":"Paraphrasing national identity and learning insults","lines":[{"speaker":"A","text":"To make a sentence work, you can often rephrase it so you don't need the specific word anymore. I'm a master at paraphrasing.","highlights":["rephrase it"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/254380-255315.webm","at":2543.9,"dur":9.35}]},{"speaker":"B","text":"True, but for some difficult terms, we can just use the full form or try to simplify them a bit.","highlights":["full form"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/258224-260130.webm","at":2582.4,"dur":19.06}]},{"speaker":"A","text":"Regarding national identity, it doesn't have to revolve around that specific phrase. We can talk about what happens when people pay less attention to it.","highlights":["pay less attention"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/260950-262477.webm","at":2609.6,"dur":15.27}]},{"speaker":"B","text":"What does national identity mean exactly? Is it just where you come from, your race, or your mindset? It's all bundled together.","highlights":["bundled together"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/265513-267075.webm","at":2655.3,"dur":15.62}]},{"speaker":"A","text":"I don't really feel my national identity anymore. From now on, I feel Latina. I'm only going to speak Spanish!","highlights":["from now on"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/273190-274049.webm","at":2732.0,"dur":8.59},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/274238-274809.webm","at":2742.6,"dur":5.71}]},{"speaker":"A","text":"Spanish has so many juicy swear words. English could never insult you the way Spanish can.","highlights":["juicy swear words"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/280620-281835.webm","at":2806.4,"dur":12.15}]},{"speaker":"B","text":"So you think English lacks sophisticated insults? As a teacher, I should probably swear more to help you expand your vocabulary.","highlights":["expand your vocabulary"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/284592-286026.webm","at":2846.1,"dur":14.34},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/285236-287117.webm","at":2860.1,"dur":18.81}]},{"speaker":"A","text":"Send me a list of your favorite insults; that will be our next issue. It will be your homework to send me that list.","highlights":["next issue"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/288420-289733.webm","at":2884.6,"dur":13.13}]},{"speaker":"B","text":"How should we correct the sentence? We can say: 'While people pay less attention to national identity, it can bring unification and the elimination of destructive traditions.'","highlights":["pay less attention"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/293316-293615.webm","at":2933.4,"dur":2.99},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/294186-294674.webm","at":2942.1,"dur":4.88}]}],"time":2543.7,"topic":3},{"title":"Refining essay structure and swearing in English","lines":[{"speaker":"A","text":"We should use 'neglect' here because it refers specifically to the neglect of traditions, whereas 'unification' is more general.","highlights":["refers specifically to"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/304158-305767.webm","at":3041.7,"dur":16.09}]},{"speaker":"B","text":"That makes sense. We also need a word to introduce a contrast between the two ideas.","highlights":["makes sense"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/310484-311379.webm","at":3105.0,"dur":8.95}]},{"speaker":"A","text":"We could say 'it also comes with the fact that immigrants stop speaking their mother tongue.'","highlights":["mother tongue"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/322497-322901.webm","at":3225.1,"dur":4.04}]},{"speaker":"B","text":"That sentence feels a bit clunky. Let's just end the sentence at 'mother tongue' and start a new one with 'Moreover.'","highlights":["a bit clunky"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/324652-325371.webm","at":3246.7,"dur":7.19}]},{"speaker":"A","text":"I'm actually struggling to paraphrase 'you little twat' into Russian. It's a tricky word to translate.","highlights":["struggling to"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/329608-330396.webm","at":3296.3,"dur":7.88}]},{"speaker":"B","text":"In Russian, 'oi' is something I can't control; it just comes out automatically, even when I'm speaking English.","highlights":["comes out automatically"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/337094-338399.webm","at":3371.1,"dur":13.05}]},{"speaker":"A","text":"Could you find a course on how to swear in English nicely? You can't be considered an educated person without knowing how to swear.","highlights":["considered an educated person"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/342538-342801.webm","at":3425.6,"dur":2.63},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/344228-344699.webm","at":3442.4,"dur":4.71}]},{"speaker":"B","text":"That's a bloody great idea! By the way, you've written quite a lot of advantage-disadvantage essays so far.","highlights":["bloody great"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/344838-345786.webm","at":3450.2,"dur":9.48},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/346654-347965.webm","at":3469.1,"dur":13.11}]},{"speaker":"A","text":"The more essays you write, the more you realize that there are universal elements to every essay with only slight variations.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/349673-351221.webm","at":3496.9,"dur":15.48}]}],"time":3041.7,"topic":3},{"title":"Improving essay writing and time management","lines":[{"speaker":"A","text":"It doesn't matter if I have to write a discussion essay or an advantage-disadvantage opinion piece. My main concern is being given a topic I'm uncomfortable with.","highlights":["opinion piece"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/351795-353214.webm","at":3518.1,"dur":14.19}]},{"speaker":"B","text":"I can see your ideas are improving. It's all about the logical connection between those ideas. You can't just memorize facts and magically come up with great examples; it takes practice.","highlights":["come up with"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/354596-356087.webm","at":3546.2,"dur":14.91}]},{"speaker":"A","text":"I hear you. It seems like we're solving the same set of problems in every sentence, like paraphrasing or finding ways to connect thoughts.","highlights":["set of problems"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/359268-360530.webm","at":3592.9,"dur":12.62}]},{"speaker":"B","text":"Exactly. You can do it if you're given enough time. It's like learning a language. At first, it feels like an endless list of new grammar patterns and words.","highlights":["endless list"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/364611-366094.webm","at":3646.3,"dur":14.83}]},{"speaker":"A","text":"Right, but eventually you realize you know the fundamentals. From that point on, it's less about grinding new words and more about getting comfortable with what you already know.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/367838-368477.webm","at":3678.6,"dur":6.39},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/368680-369446.webm","at":3687.0,"dur":7.66}]},{"speaker":"B","text":"That's usually when people stop hating essays and start finding them interesting. You have all the pieces of the puzzle; now you just need to learn how to connect them faster.","highlights":["pieces of the puzzle"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/373396-374854.webm","at":3734.1,"dur":14.58}]},{"speaker":"A","text":"So you think I'm ready to start paying more attention to the clock?","highlights":["paying more attention"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/375813-376383.webm","at":3758.3,"dur":5.7}]},{"speaker":"B","text":"Yes, it's time to introduce a time limit. Start easy. If you're comfortable with 80 minutes, try to do it in 70. You need to challenge yourself a little bit.","highlights":["challenge yourself"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/376742-377503.webm","at":3767.6,"dur":7.61},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/378080-379518.webm","at":3781.0,"dur":14.38}]},{"speaker":"A","text":"Will we continue writing essays? Is there anything else we haven't looked at yet?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/381814-382613.webm","at":3818.3,"dur":7.99}]},{"speaker":"B","text":"I wouldn't say you're an expert in every sphere yet. There are still about 15 or 20 elements that make a good essay writer.","highlights":["every sphere"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/383302-384839.webm","at":3833.2,"dur":15.37}]}],"time":3518.1,"topic":3},{"title":"Improving essay writing and speaking skills","lines":[{"speaker":"A","text":"You're showing progress, but you'd still struggle in a real exam room. When the clock is ticking, your ideas might just disappear.","highlights":["clock is ticking"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/385444-386799.webm","at":3854.6,"dur":13.55}]},{"speaker":"B","text":"I feel that way too. The structure is clear now, but I still need more time to make my ideas convincing.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/393382-394619.webm","at":3934.0,"dur":12.37}]},{"speaker":"A","text":"A real sign of progress is when you can come up with your own examples without me having to rewrite everything from scratch.","highlights":["from scratch"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/397622-398351.webm","at":3976.4,"dur":7.29},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/398640-399701.webm","at":3986.6,"dur":10.61}]},{"speaker":"A","text":"Exactly. Next, we'll tackle 'advantages outweigh disadvantages.' It has many moving parts, so I'll provide the structure and a sample first.","highlights":["moving parts"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/402646-404108.webm","at":4026.6,"dur":14.62}]},{"speaker":"A","text":"We'll also incorporate some speaking practice. It's all about whether you can develop a good counter-argument to move beyond a mediocre essay.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/408971-410490.webm","at":4089.9,"dur":15.19}]},{"speaker":"B","text":"I've seen some really nasty tasks for writing part one. I'm honestly sick of dealing with these graphs.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/413032-414103.webm","at":4130.5,"dur":10.71}]},{"speaker":"A","text":"Trust me, once you get through writing part one, you'll start begging me to let you write essays again.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/415702-416772.webm","at":4157.2,"dur":10.7}]},{"speaker":"B","text":"I've been watching reels on how to describe trends, like how a figure has been fluctuating over the course of the period.","highlights":["over the course of"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/418020-418965.webm","at":4180.3,"dur":9.45},{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/419200-419717.webm","at":4192.2,"dur":5.17}]},{"speaker":"A","text":"Enjoy your day off! I hope you have a lovely day despite the terrible weather.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/420082-421532.webm","at":4201.0,"dur":14.5}]}],"time":3854.6,"topic":4}]};

                    if (w.endsWith(suffix) && w.length - suffix.length >= 3) { w = w.slice(0, -suffix.length); break; }

                return w.replace(/e+$/, '');
            }

            function playButton(text, label) {
                return `<button class="play" type="button" data-say="${esc(text)}" aria-label="${esc(label || 'Listen')}" data-no-speech>${icons.play}</button>`;
            }

            // A clip of the lesson recording: a pill with the time it was said,
            // which opens into a small player when tapped.
            function clipHtml(clip, label) {
                if (!clip || !clip.src) return '';
                const at = clock(clip.at);
                return `<span class="clip" data-src="${esc(clip.src)}" data-no-speech>`
                    + `<button class="clip-main" type="button" title="${esc(label)}" aria-label="${esc(label)}, ${at}">${icons.clipPlay}${icons.clipPause}<span>${at}</span></button>`
                    + '<span class="clip-more">'
                    + `<button class="clip-skip" type="button" data-skip="-3" title="Back 3 seconds" aria-label="Back 3 seconds">${icons.back3}</button>`
                    + '<span class="clip-bar" role="slider" tabindex="0" aria-label="Position in the clip" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="clip-fill"></span></span>'
                    + `<button class="clip-skip" type="button" data-skip="3" title="Forward 3 seconds" aria-label="Forward 3 seconds">${icons.forward3}</button>`
                    + '</span></span>';
            }

            // Word diff (longest common subsequence) between what was said and the fix.
            function diff(before, after) {
                const a = before.split(/\s+/).filter(Boolean);
                const b = after.split(/\s+/).filter(Boolean);
                const n = a.length, m = b.length;
                const table = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
                for (let i = n - 1; i >= 0; i--) {
                    for (let j = m - 1; j >= 0; j--) {
                        table[i][j] = norm(a[i]) === norm(b[j]) ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
                    }
                }
                const left = [], right = [];
                let i = 0, j = 0;
                while (i < n || j < m) {
                    if (i < n && j < m && norm(a[i]) === norm(b[j])) {
                        left.push({ word: a[i++], kind: 'same' });
                        right.push({ word: b[j++], kind: 'same' });
                    } else if (j >= m || (i < n && table[i + 1][j] >= table[i][j + 1])) {
                        const word = a[i];
                        const previous = i > 0 ? norm(a[i - 1]) : '';
                        const noise = FILLERS.has(norm(word)) || norm(word) === previous || !norm(word);
                        left.push({ word, kind: noise ? 'same' : 'del' });
                        i++;
                    } else {
                        // Mark where a missing word belongs, unless a deletion already shows the spot.
                        const last = left[left.length - 1];
                        if (!last || (last.kind !== 'del' && last.kind !== 'gap')) left.push({ kind: 'gap' });
                        right.push({ word: b[j++], kind: 'ins' });
                    }
                }
                const render = (tokens, tag) => tokens.map(t => {
                    if (t.kind === 'gap') return '<span class="gap" aria-hidden="true"></span>';
                    return t.kind === 'same' ? esc(t.word) : `<${tag} class="w">${esc(t.word)}</${tag}>`;
                }).join(' ').replace(/<\/(del|ins)> <\1 class="w">/g, ' ');
                return { said: render(left, 'del'), fixed: render(right, 'ins') };
            }

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {
                    if (!hit[index] && functional.has(norm(part))) {
                        const near = [index - 2, index + 2].some(k => hit[k]);
                        if (near) hit[index] = true;
                    }
                });
                return parts.map((part, index) => {
                    if (!hit[index]) return esc(part);
                    // Underline the word itself, not quotes or punctuation stuck to it.
                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                    return `${esc(before)}<b class="hl">${esc(core)}</b>${esc(after)}`;
                }).join('');
            }

            // link(phrase): the vocabulary entry of a highlighted phrase, or -1.
            function highlightPhrases(text, phrases, link) {
                const lower = text.toLowerCase();
                const ranges = [];
                (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length, phrase]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end, phrase]) => {
                    const word = link ? link(phrase) : -1;
                    const opens = word >= 0 ? ` data-vocab="${word}" title="${esc(`See “${vocabulary[word].term}” in Vocabulary`)}"` : '';
                    html += esc(text.slice(cursor, start)) + `<mark class="expr"${opens}>${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {
                    if (value === undefined) return window.localStorage.getItem(key);
                    window.localStorage.setItem(key, value);
                } catch (_error) {
                    return null;
                }
                return null;
            }

            // ---------------------------------------------------------- header
            document.getElementById('title').textContent = meta.title || 'Lesson review';

            // The lesson time in Moscow time (meta.start_utc: when the lesson
            // began, in seconds since 1970). A tap shows it in the reader's own
            // time zone instead, remembered on the phone. Older pages have no
            // start_utc: the date and time as recorded, with no zone.
            const eyebrow = document.getElementById('eyebrow');
            const lessonStart = typeof meta.start_utc === 'number' && isFinite(meta.start_utc) ? new Date(meta.start_utc * 1000) : null;
            let lessonTimes = null;
            let ownZone = storage('lesson-time-zone') === 'own';

            function zoneTime(zone) {
                const date = { day: 'numeric', month: 'long', year: 'numeric' };
                const time = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
                if (zone) { date.timeZone = zone; time.timeZone = zone; }
                return {
                    date: new Intl.DateTimeFormat('en-GB', date).format(lessonStart),
                    time: new Intl.DateTimeFormat('en-GB', time).format(lessonStart)
                };
            }

            function offsetName(minutes) {
                const size = Math.abs(minutes);
                if (!size) return 'GMT';
                return 'GMT' + (minutes < 0 ? '-' : '+') + Math.floor(size / 60) + (size % 60 ? ':' + String(size % 60).padStart(2, '0') : '');
            }

            if (lessonStart) {
                try {
                    const moscow = zoneTime('Europe/Moscow');
                    const own = zoneTime(null);
                    lessonTimes = {
                        moscow: Object.assign(moscow, { zone: 'MSK', name: 'Moscow time' }),
                        own: Object.assign(own, { zone: offsetName(-lessonStart.getTimezoneOffset()), name: 'your time' }),
                        differ: moscow.date !== own.date || moscow.time !== own.time
                    };
                } catch (_error) {
                    lessonTimes = null;  // no time zones in this browser: the time as recorded
                }
            }

            function showLessonTime() {
                let date = meta.date;
                if (!lessonTimes) {
                    eyebrow.textContent = ['English lesson', meta.date, meta.time].filter(Boolean).join(' · ');
                } else {
                    const shown = lessonTimes.differ && ownZone ? lessonTimes.own : lessonTimes.moscow;
                    const other = shown === lessonTimes.own ? lessonTimes.moscow : lessonTimes.own;
                    const time = `${esc(shown.time)} <span class="tz">${esc(shown.zone)}</span>`;
                    date = shown.date;
                    eyebrow.innerHTML = `English lesson · ${esc(shown.date)} · `
                        + (lessonTimes.differ
                            ? `<button class="tz-btn" type="button" title="Show ${esc(other.name)} (${esc(other.zone)})" aria-label="${esc(`${shown.time} ${shown.name}. Show ${other.name}, ${other.zone}`)}">${time}</button>`
                            : `<span class="tz-time">${time}</span>`);
                }
                document.title = (meta.title ? meta.title + ' · ' : '') + 'English lesson' + (date ? ' · ' + date : '');
            }
            showLessonTime();
            eyebrow.addEventListener('click', event => {
                if (!event.target.closest('.tz-btn')) return;
                ownZone = !ownZone;
                storage('lesson-time-zone', ownZone ? 'own' : 'moscow');
                showLessonTime();
                const button = eyebrow.querySelector('.tz-btn');
                if (button && event.detail === 0) button.focus();  // kept for the keyboard
            });

            document.getElementById('count-mistakes').textContent = mistakes.length;
            document.getElementById('count-vocabulary').textContent = vocabulary.length;
            document.getElementById('count-dialogues').textContent = dialogues.length;

            // -------------------------------------------------------- mistakes
            const topics = lesson.topics || [];
            // Each mistake example, word and dialogue line can be found by the timeline.
            const exampleIds = new Map();
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => exampleIds.set(example, `m-${c}-${e}`)));
            let showAllMistakes = () => {};
            let vocabularyToWords = () => {};
            // What "Go back" needs to put a section back as it was.
            let mistakeFilter = () => 'all';
            let setMistakeFilter = () => {};
            let vocabularyView = () => 'words';
            let setVocabularyView = () => {};

            function clock(seconds) {
                if (seconds === null || seconds === undefined) return '';
                const total = Math.max(0, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const rest = String(total % 60).padStart(2, '0');
                return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
            }

            function plain(text) {
                return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
            }

            // One example: when it was said, the full sentence(s) as said and
            // corrected, and (where it adds something) its own explanation.
            function exampleHtml(example, options) {
                const before = example.context || example.quote;
                const after = example.context_fix || example.fix;
                const d = diff(before, after);
                // The clip pill needs no separator: it stays apart from the topic when the line wraps.
                const pill = clipHtml(example.clip, 'Hear what was said');
                // The letters beside the time open the same moment in the other sections.
                const jumps = jumpsHtml('mistakes', example.clip ? example.clip.at : example.time);
                const facts = [];
                if (!pill && example.time !== null && example.time !== undefined) facts.push(`<span class="clock">${clock(example.time)}</span>${jumps}`);
                if (options.showTopic && topics[example.topic]) facts.push(`<span>${esc(topics[example.topic].title)}</span>`);
                let html = `<div class="pair" data-item="${exampleIds.get(example) || ''}"${options.hidden ? ' hidden' : ''}>`;
                const separator = jumps && !pill ? '' : '<span class="sep">·</span>';
                if (pill || facts.length) html += `<div class="ex-meta" data-no-speech>${pill}${pill ? jumps : ''}${facts.join(separator)}</div>`;
                html += `<div class="said"><span class="mark-icon" aria-label="What was said" data-no-speech>✗</span><span class="txt">${d.said}</span></div>`;
                html += `<div class="fixed"><span class="mark-icon" aria-label="Better" data-no-speech>✓</span><span class="txt">${d.fixed}</span>${playButton(after, 'Listen to the correct version')}</div>`;
                if (options.why) html += `<p class="ex-why">${esc(options.why)}</p>`;
                return html + '</div>';
            }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
                    html += items.map(item => `<li><span class="meaning">${esc(item.meaning)}</span><span class="m-ex">${highlightTerm(item.example, entry.term)}`
                        + (item.lesson ? ' <span class="from-lesson" data-no-speech>from the lesson</span>' : '') + '</span></li>').join('');
                    return html + '</ol></div>';
                };
                return '<div class="forms">'
                    + column('Countable', 'a / an, plural', entry.countable || [])
                    + column('Uncountable', 'no a / an, no plural', entry.uncountable || [])
                    + '</div>';
            }

            function relatedHtml(entry) {
                const row = (title, words) => (words || []).length
                    ? `<div class="rel"><p class="part-title" data-no-speech>${title}</p><span class="rel-words">${words.map(w => `<span class="rel-word">${esc(w)}</span>`).join('<span class="sep" data-no-speech> · </span>')}</span></div>`
                    : '';
                return row('Synonyms', entry.synonyms) + row('Antonyms', entry.antonyms);
            }

            // Visible: when it was said, the word, the meaning, the lesson's own
            // words and at least three examples. The rest opens on request.
            function wordCardHtml(entry, index) {
                const term = entry.term || '';
                let html = `<article class="card word" id="word-${index}"><div class="w-head">`;
                if (entry.clip) html += clipHtml(entry.clip, 'Hear it in the lesson');
                else if (entry.time !== null && entry.time !== undefined) html += `<span class="clock" data-no-speech>${clock(entry.time)}</span>`;
                html += jumpsHtml('vocabulary', entry.clip ? entry.clip.at : entry.time);
                // The word, its kind and its speaker stay together (a new row when
                // they do not fit); the kind and the speaker never part.
                html += `<div class="w-title"><h3 class="w-term">${esc(term)}</h3><span class="w-side">`;
                if (entry.pos) html += `<span class="w-pos" data-no-speech>${esc(entry.pos)}</span>`;
                html += playButton(term, 'Listen to ' + term) + '</span></div></div>';
                if (entry.definition) html += `<p class="def">${esc(entry.definition)}</p>`;
                const passage = entry.lesson || entry.lesson_example;
                if (passage) {
                    html += `<div class="lesson-ex"><div class="txt"><span class="src" data-no-speech>From the lesson</span>${highlightTerm(passage, term)}</div>${playButton(passage, 'Listen')}</div>`;
                }
                const examples = exampleItems(entry);
                if (examples.length) {
                    html += '<ul class="examples">' + examples.map(example => '<li>'
                        + (example.pattern ? `<span class="pat" data-no-speech>${esc(example.pattern)}</span> ` : '')
                        + highlightTerm(example.sentence, term) + '</li>').join('') + '</ul>';
                }
                if (entry.note) html += `<p class="note">${icons.bulb}<span>${esc(entry.note)}</span></p>`;

                const parts = [];
                if ((entry.countable || []).length || (entry.uncountable || []).length) parts.push(['forms', 'Countable / uncountable', formsHtml(entry)]);
                if ((entry.more_examples || []).length) {
                    parts.push(['more', 'More examples', '<p class="part-title" data-no-speech>More examples</p><ul class="examples">'
                        + entry.more_examples.map(s => `<li>${highlightTerm(s, term)}</li>`).join('') + '</ul>']);
                }
                const related = relatedHtml(entry);
                if (related) parts.push(['related', 'Synonyms & antonyms', related]);
                if (parts.length) {
                    html += '<div class="more-bar" data-no-speech>'
                        + parts.map(([id, name]) => `<button class="more-btn" type="button" data-part="${id}" aria-expanded="false">${name}</button>`).join('')
                        + '<button class="more-btn more-hide" type="button">Hide</button></div>';
                    html += parts.map(([id, , body]) => `<div class="more-part" data-part="${id}" hidden>${body}</div>`).join('');
                }
                return html + '</article>';
            }

            // Matching pairs: all the words, shuffled into rounds of about six;
            // the meanings are shuffled separately.
            function renderMatch(game) {
                const pool = shuffled(matchable);
                const roundCount = Math.ceil(pool.length / 6);
                const rounds = [];
                for (let r = 0, cursor = 0; r < roundCount; r++) {
                    const size = Math.floor(pool.length / roundCount) + (r < pool.length % roundCount ? 1 : 0);
                    rounds.push(pool.slice(cursor, cursor + size));
                    cursor += size;
                }
                let round = 0, misses = 0, picked = null;
                const missText = () => misses === 1 ? '1 mistake' : `${misses} mistakes`;

                function draw() {
                    const ids = rounds[round];
                    let html = `<div class="game-head" data-no-speech><span>Round ${round + 1} of ${rounds.length}</span><span class="game-score">${missText()}</span></div>`;
                    html += '<p class="game-hint" data-no-speech>Tap a word, then its meaning.</p>';
                    html += '<div class="match-board" data-no-speech><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile term" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].term)}</button>`).join('');
                    html += '</div><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile meaning" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].definition)}</button>`).join('');
                    html += '</div></div><div class="game-foot" data-no-speech></div>';
                    game.innerHTML = html;
                    picked = null;
                }

                function roundDone() {
                    const foot = game.querySelector('.game-foot');
                    if (round + 1 < rounds.length) {
                        foot.innerHTML = `<p>Round complete!</p><button class="game-btn" type="button" data-action="next-round">Next round</button>`;
                    } else {
                        foot.innerHTML = `<div class="summary"><p class="big">All ${pool.length} words matched</p><p>${missText()}</p>`
                            + '<button class="game-btn" type="button" data-action="restart">Play again</button></div>';
                    }
                    foot.querySelector('button').focus({ preventScroll: true });
                }

                game.addEventListener('click', event => {
                    const tile = event.target.closest('.tile');
                    if (tile && !tile.disabled) {
                        const side = tile.classList.contains('term') ? 'term' : 'meaning';
                        if (picked === tile) {
                            tile.setAttribute('aria-pressed', 'false');
                            picked = null;
                        } else if (!picked || picked.classList.contains(side)) {
                            if (picked) picked.setAttribute('aria-pressed', 'false');
                            picked = tile;
                            tile.setAttribute('aria-pressed', 'true');
                        } else {
                            const other = picked;
                            picked = null;
                            other.setAttribute('aria-pressed', 'false');
                            if (other.dataset.id === tile.dataset.id) {
                                [other, tile].forEach(t => { t.classList.add('done'); t.disabled = true; });
                                speak(vocabulary[Number(tile.dataset.id)].term);
                                if (!game.querySelector('.tile:not(.done)')) roundDone();
                            } else {
                                misses++;
                                game.querySelector('.game-score').textContent = missText();
                                [other, tile].forEach(t => {
                                    t.classList.remove('wrong');
                                    void t.offsetWidth; // restart the shake
                                    t.classList.add('wrong');
                                    setTimeout(() => t.classList.remove('wrong'), 450);
                                });
                            }
                        }
                        return;
                    }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next-round') { round++; draw(); }
                    if (action.dataset.action === 'restart') renderMatch(freshGame());
                });
                draw();
            }

            // Fill the gap: a new sentence, the word hidden, four options.
            function renderGap(game) {
                const order = shuffled(gapItems);
                let position = 0, score = 0;
                const missed = [];

                function draw() {
                    const { entry } = order[position];
                    const [before, after] = entry.gap.sentence.split(/_{3,}/);
                    let html = `<div class="game-head" data-no-speech><span>${position + 1} of ${order.length}</span><span class="game-score">${score} correct</span></div>`;
                    html += `<div class="card"><p class="gap-sentence">${esc(before)}<span class="blank" data-no-speech>&nbsp;</span>${esc(after || '')}</p>`;
                    html += '<div class="options" data-no-speech>'
                        + shuffled(entry.gap.options).map(o => `<button class="option" type="button" data-option="${esc(o)}">${esc(o)}</button>`).join('')
                        + '</div><div class="gap-result" hidden></div></div>';
                    game.innerHTML = html;
                }

                function answer(button) {
                    const { entry, index } = order[position];
                    const right = button.dataset.option === entry.gap.answer;
                    game.querySelectorAll('.option').forEach(b => {
                        b.disabled = true;
                        if (b.dataset.option === entry.gap.answer) b.classList.add('right');
                    });
                    if (right) score++;
                    else { button.classList.add('wrong'); missed.push(index); }
                    game.querySelector('.game-score').textContent = `${score} correct`;
                    const blank = game.querySelector('.blank');
                    blank.textContent = entry.gap.answer;
                    blank.classList.add('filled');
                    blank.removeAttribute('data-no-speech');
                    const full = entry.gap.sentence.replace(/_{3,}/, entry.gap.answer);
                    const last = position + 1 >= order.length;
                    const result = game.querySelector('.gap-result');
                    result.innerHTML = `<p class="verdict ${right ? 'ok' : 'no'}" data-no-speech>${right ? '✓ Correct' : `✗ The answer is “${esc(entry.gap.answer)}”`}</p>`
                        + `<p class="gap-def"><b>${esc(entry.term)}</b>: ${esc(entry.definition)}</p>`
                        + `<div class="gap-actions" data-no-speech>${playButton(full, 'Listen to the sentence')}`
                        + `<button class="game-btn secondary" type="button" data-word="${index}">See the word</button>`
                        + `<button class="game-btn" type="button" data-action="${last ? 'finish' : 'next'}">${last ? 'Finish' : 'Next'}</button></div>`;
                    result.hidden = false;
                    result.querySelector('[data-action]').focus({ preventScroll: true });
                }

                function finish() {
                    let html = `<div class="card summary"><p class="big">${score} of ${order.length}</p><p>${score === order.length ? 'Perfect!' : 'Words to review:'}</p>`;
                    if (missed.length) {
                        html += '<div class="missed" data-no-speech>' + missed.map(i => `<button class="chip" type="button" data-word="${i}">${esc(vocabulary[i].term)}</button>`).join('') + '</div>';
                    }
