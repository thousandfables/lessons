<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        /* Mistake grades, 1 (gravest) to 7: warm colours where the listener
           had trouble understanding (1-4), cool ones where the meaning was
           clear (5-7). The grade's number is always shown with its colour. */
        :root, :root[data-theme="light"], :root[data-theme="sepia"], :root[data-theme="mint"] {
            --g1: #b3261e; --g2: #d9480f; --g3: #c56200; --g4: #a67c00; --g5: #2a62a8; --g6: #5b7fa6; --g7: #5f6673;
        }

        @media (prefers-color-scheme: dark) {
            :root { --g1: #ff6b6b; --g2: #ff8547; --g3: #ffa23a; --g4: #f2c14e; --g5: #6ea8ff; --g6: #9bb3d4; --g7: #a3aabb; }
        }

        :root[data-theme="dark"], :root[data-theme="black"] {
            --g1: #ff6b6b; --g2: #ff8547; --g3: #ffa23a; --g4: #f2c14e; --g5: #6ea8ff; --g6: #9bb3d4; --g7: #a3aabb;
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        /* The section's symbol before its name, in the section's colour. */
        .tab-sym { flex: none; width: 16px; height: 16px; margin-right: -1px; color: var(--lane); }

        .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ---------------------------------------------------- mistake grades */
        .gr1 { --grade: var(--g1); } .gr2 { --grade: var(--g2); } .gr3 { --grade: var(--g3); } .gr4 { --grade: var(--g4); }
        .gr5 { --grade: var(--g5); } .gr6 { --grade: var(--g6); } .gr7 { --grade: var(--g7); }

        /* Marks (numbers, stripes) use the grade's colour; its words use a
           deeper "ink" of it, mixed toward the theme's text so they stay readable. */
        .gr {
            --grade-soft: color-mix(in srgb, var(--grade) 14%, var(--surface));
            --grade-ink: color-mix(in srgb, var(--grade) 66%, var(--text));
        }

        .mistake.gr { --sev: var(--grade); }

        /* The grade's number on its colour. */
        .grade-num {
            display: inline-grid;
            flex: none;
            place-items: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--grade);
            color: var(--surface);
            font-size: 0.7rem;
            font-style: normal;
            font-weight: 800;
            line-height: 1;
        }

        .absent .grade-num, .grade-num.absent { background: transparent; box-shadow: inset 0 0 0 1.5px var(--grade); color: var(--grade); }

        /* On a card: the number and the grade's name, in its colour. */
        .grade-badge {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            padding: 1px 9px 1px 2px;
            border-radius: 999px;
            background: var(--grade-soft);
            color: var(--grade-ink);
            font-size: 0.8rem;
            font-weight: 750;
            line-height: 1.35;
        }

        /* The scale, at the top of the section: every grade (the ones this
           lesson does not have are faded); "Hide" keeps only the numbers. */
        .grades { margin: -6px 0 14px; padding: 0 0 8px; border-bottom: 1px solid var(--border); }

        .grades-head { display: flex; gap: 8px; align-items: center; min-height: 28px; }

        .grades-title { color: var(--muted); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }

        .grades-short, .grades.closed .grades-long { display: none; }

        .grades.closed .grades-short { display: inline; }

        .grades-strip { display: none; flex-wrap: wrap; gap: 3px; }

        .grades.closed .grades-strip { display: inline-flex; }

        .grades-toggle { margin: -4px -4px -4px auto; padding: 4px 6px; border: 0; background: none; color: var(--accent); font: inherit; font-size: 0.8rem; font-weight: 650; cursor: pointer; }

        .grades-list { margin: 2px 0 0; padding: 0; list-style: none; }

        .grades.closed .grades-list, .grades.closed .grades-note { display: none; }

        .grades.closed { padding-bottom: 6px; }

        .grade-row { display: grid; grid-template-columns: 18px 1fr; gap: 7px; align-items: start; margin: 0 0 3px; color: var(--muted); font-size: 0.76rem; line-height: 1.4; }

        .grade-row .grade-num { margin-top: 0.5px; }

        .grade-row span b { color: var(--grade-ink); font-weight: 750; }

        .grade-row.absent { opacity: 0.55; }

        .grades-note { margin: 2px 0 2px 26px; color: var(--faint); font-size: 0.74rem; }

        /* Filters: All, then one chip per grade the lesson has (number and count). */
        .grade-chip { gap: 5px; padding-left: 6px; }

        .grade-chip[aria-pressed="true"] { border-color: var(--grade); background: var(--grade-soft); color: var(--text); }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .w-title { display: flex; flex: 1 1 auto; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-width: 0; }

        .w-side { display: flex; flex: 1 0 auto; gap: 8px; align-items: center; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;
            font-weight: 650;
            cursor: pointer;
        }

        .orig-toggle:hover { color: var(--accent); }

        .orig { margin: 6px 0 0; padding: 6px 9px; border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 0.88rem; font-style: italic; }

        .dialogue-tools { margin: 0 0 14px; }

        /* ------------------------------------------ mistake views and times */
        .viewbar { display: inline-flex; flex-wrap: wrap; gap: 2px; margin: 0 0 12px; padding: 3px; border-radius: 12px; background: var(--surface-2); }

        .view { min-height: 34px; padding: 4px 14px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-size: 0.88rem; font-weight: 650; cursor: pointer; }

        .view[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .ex-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 5px; color: var(--muted); font-size: 0.8rem; font-weight: 600; }

        .clock { padding: 0 6px; border-radius: 5px; background: var(--surface); color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }

        .sep { color: var(--faint); }

        .ex-why { margin: 6px 0 0 24px; color: var(--muted); font-size: 0.9rem; }

        .topic-head { display: flex; gap: 8px; align-items: center; margin: 24px 0 10px; font-size: 1.02rem; }

        .topic-head .clock { background: var(--surface-2); }

        .topic-count { margin-left: auto; color: var(--faint); font-size: 0.8rem; }

        /* ---------------------------------------------------- lesson audio */
        /* A clip of the recording: a small "▶ 4:02" pill that opens into a
           one-row player (pause, back 3 s, position, forward 3 s). */
        .clip {
            display: inline-flex;
            flex: none;
            align-items: center;
            max-width: 100%;
            height: 30px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            vertical-align: middle;
        }

        .clip button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 30px;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .clip button:hover { background: var(--accent-hover); }

        .clip button:focus-visible, .clip-bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

        .clip .clip-main { gap: 5px; padding: 0 10px 0 9px; font-size: 0.8rem; font-weight: 750; font-variant-numeric: tabular-nums; }

        .clip-main svg { width: 12px; height: 12px; }

        .clip .i-pause, .clip.playing .i-play { display: none; }

        .clip.playing .i-pause { display: block; }

        .clip-more { display: none; align-items: center; padding-right: 3px; }

        .clip.open .clip-more { display: inline-flex; }

        .clip .clip-skip { width: 30px; }

        .clip-skip svg { width: 20px; height: 20px; }

        .clip-bar { position: relative; flex: none; width: 76px; height: 30px; margin: 0 3px; cursor: pointer; touch-action: none; }

        .clip-bar::before, .clip-fill { content: ""; position: absolute; top: 13px; left: 0; height: 4px; border-radius: 2px; }

        .clip-bar::before { right: 0; background: var(--accent); opacity: 0.22; }

        .clip-fill { width: 0; background: var(--accent); }

        .clip-fill::after { content: ""; position: absolute; top: -3px; right: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

        .clip.failed { opacity: 0.45; }

        .clip-note {
            position: fixed;
            right: 16px;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            z-index: 9;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--text);
            color: var(--bg);
            font-size: 0.88rem;
            box-shadow: 0 6px 22px rgba(20, 28, 51, 0.3);
        }

        .clip-note[hidden] { display: none; }

        .line-tools { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 6px 0 0; }

        .d-head { margin: 0 0 12px; }

        .dialogue .d-head h3 { margin: 0 0 4px; }

        .d-head .ex-meta { margin: 0; }

        .d-head .clock { background: var(--surface-2); }

        .back-to-quiz {
            position: fixed;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            z-index: 6;
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 44px;
            padding: 8px 18px 8px 14px;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: var(--on-accent);
            box-shadow: 0 6px 22px rgba(20, 28, 51, 0.28);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            transform: translateX(-50%);
            cursor: pointer;
        }

        .back-to-quiz[hidden] { display: none; }

        .back-to-quiz svg { width: 18px; height: 18px; }

        /* Double-tap selects a word (below), so it must not zoom the page. */
        body { touch-action: manipulation; }

        /* ---------------------------------------------------------- themes */
        .hero-top { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin: 0 0 6px; }

        .hero-top .eyebrow { margin: 0; }

        .theme-btn {
            display: inline-flex;
            flex: none;
            gap: 5px;
            align-items: center;
            min-height: 30px;
            padding: 3px 10px 3px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.78rem;
            font-weight: 650;
            cursor: pointer;
        }

        .theme-btn svg { width: 15px; height: 15px; }

        .theme-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }

        .themes { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }

        .themes[hidden] { display: none; }

        .theme {
            display: inline-flex;
            gap: 7px;
            align-items: center;
            min-height: 34px;
            padding: 3px 11px 3px 5px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .theme[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }

        .swatch { position: relative; width: 22px; height: 22px; border-radius: 50%; background: var(--sw-bg); box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.35); }

        .swatch::after { content: ""; position: absolute; right: 1px; bottom: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--sw-accent); }

        /* ------------------------------------------------- word-card parts */
        .more-part { scroll-margin-top: 84px; }

        .more-bar.open .more-btn::after { content: none; }

        .more-hide { display: none; }

        .more-bar.open .more-hide { display: inline-flex; align-items: center; color: var(--muted); }

        .more-bar.open .more-hide::after { content: " \25B4"; }

        .tl-flash { animation: flash 1.4s ease-out; border-radius: 10px; }

        /* A card keeps its own rounded corners while it lights up. */
        .card.tl-flash { border-radius: var(--radius); }

        /* ----------------------------------------------------- word cards */
        /* Each word starts with a tinted title bar, the word itself the
           largest text on the card; cards stand clearly apart. */
        #panel-vocabulary .word {
            --card-side: 16px;
            margin-bottom: 18px;
            padding-top: 0;
            padding-right: var(--card-side);
            padding-left: var(--card-side);
            overflow: hidden;
            border-color: var(--border);
            border-color: color-mix(in srgb, var(--border) 65%, var(--accent) 35%);
        }

        #panel-vocabulary .word .w-head {
            margin: 0 calc(-1 * var(--card-side)) 12px;
            padding: 10px var(--card-side);
            border-bottom: 1px solid var(--border);
            background: var(--accent-soft);
        }

        #panel-vocabulary .w-term { color: var(--accent); font-size: 1.32rem; font-weight: 800; letter-spacing: -0.005em; }

        #panel-vocabulary .w-head .clip { background: var(--surface); }

        @media (max-width: 520px) {
            #panel-vocabulary .word { --card-side: 10px; margin-bottom: 16px; }
            #panel-vocabulary .word .w-head { margin-bottom: 10px; padding-top: 9px; padding-bottom: 9px; }
            #panel-vocabulary .w-term { font-size: 1.24rem; }
        }

        /* ------------------------------------------------------- timeline */
        /* A thin bar a little in from the right edge (phone screens curve at
           the edge): the lesson's time from top to bottom. It starts under
           the section names (the page sets --tl-top to follow the tabs) and
           ends above "Go back" while that is shown. */
        .timeline { --tl-top: 72px; --tl-bottom: 14px; --tl-inset: 10px; }

        .timeline.has-back { --tl-bottom: 54px; }

        [data-lane="mistakes"] { --lane: var(--major); }
        [data-lane="vocabulary"] { --lane: var(--accent); }
        [data-lane="dialogues"] { --lane: var(--ins-text); }

        .tl-rail {
            position: fixed;
            top: var(--tl-top);
            right: var(--tl-inset);
            bottom: calc(var(--tl-bottom) + env(safe-area-inset-bottom, 0px));
            z-index: 8;
            width: 30px;
            cursor: ns-resize;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .tl-axis { position: absolute; top: 32px; bottom: 10px; left: 50%; width: 10px; margin-left: -5px; }

        .tl-axis::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; border-radius: 1px; background: var(--border); }

        .tl-ticks i { position: absolute; left: 1px; width: 8px; height: 2px; margin-top: -1px; border-radius: 1px; background: var(--lane, var(--faint)); opacity: 0.6; }

        .tl-here { position: absolute; left: 0; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }

        .tl-here[hidden] { display: none; }

        /* Held: one narrow bar per section, the open section on the right, under the finger. */
        .tl-panel {
            position: fixed;
            top: var(--tl-top);
            right: calc(var(--tl-inset) - 5px);
            bottom: calc(var(--tl-bottom) + env(safe-area-inset-bottom, 0px));
            z-index: 7;
            display: flex;
            gap: 1px;
            width: 120px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--border);
            box-shadow: -8px 0 26px rgba(20, 28, 51, 0.18);
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .tl-panel[hidden] { display: none; }

        .tl-lane { position: relative; flex: 1 1 0; min-width: 0; border-radius: 13px; background: var(--surface); }

        .tl-lane.target { background: var(--accent-soft); }

        .tl-name { position: absolute; top: 7px; left: 50%; display: grid; place-items: center; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--lane); color: var(--surface); font-size: 0.66rem; font-weight: 800; }

        .tl-name .sym { width: 12px; height: 12px; }

        .tl-mark { position: absolute; left: -2px; width: 14px; height: 14px; margin-top: -7px; border: 2px solid var(--surface); border-radius: 50%; background: var(--lane); box-shadow: 0 1px 4px rgba(20, 28, 51, 0.3); }

        .tl-mark[hidden] { display: none; }

        /* Over the bars (their flex order also sets the order they are painted in). */
        .tl-guide, .tl-thumb, .tl-time { z-index: 2; }

        .tl-guide { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed var(--accent); opacity: 0.6; }

        .tl-thumb { position: absolute; width: 22px; height: 22px; border: 3px solid var(--surface); border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(20, 28, 51, 0.35); }

        /* The time under the finger, just above the fingertip. */
        .tl-time {
            position: absolute;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--on-accent);
            font-size: 0.8rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            box-shadow: 0 3px 10px rgba(20, 28, 51, 0.3);
        }

        /* While the panel is held, the section narrows to fit beside it. */
        html.tl-open main { padding-right: var(--tl-room, 0px); }

        .tl-rail, .tl-panel { transition: bottom 0.18s ease-out; }

        /* ------------------------------------------------------- go back */
        /* Under the timeline's end, in the same lane: back to the section
           (and the exact place) the reader came from. Its small badge is
           the section it goes back to. */
        .go-back {
            position: fixed;
            right: calc(var(--tl-inset, 10px) - 1px);
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            z-index: 8;
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--surface);
            color: var(--accent);
            box-shadow: 0 2px 10px rgba(20, 28, 51, 0.22);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .go-back[hidden] { display: none; }

        .go-back svg { width: 18px; height: 18px; }

        .go-back::before { content: ""; position: absolute; inset: -4px -6px -8px -10px; }

        .go-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .go-to {
            position: absolute;
            top: -7px;
            left: -8px;
            display: grid;
            place-items: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--lane, var(--accent));
            color: var(--surface);
            box-shadow: 0 0 0 2px var(--bg);
        }

        .go-to .sym { width: 11px; height: 11px; }

        /* ------------------------------------------ jumps between sections */
        /* Beside a time: the same moment in the other two sections, marked
           with their symbols and colours (as on the tabs and the held
           timeline), the section's letter small in a corner. */
        .jump-set { display: inline-flex; flex: none; gap: 9px; align-items: center; margin-left: 2px; vertical-align: middle; }

        .jump-btn .sym { width: 15px; height: 15px; }

        .jump-letter {
            position: absolute;
            right: -5px;
            bottom: -4px;
            min-width: 11px;
            height: 11px;
            padding: 0 2px;
            border-radius: 4px;
            background: var(--surface);
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--lane) 45%, transparent);
            color: var(--lane);
            font-size: 7.5px;
            font-weight: 800;
            line-height: 11px;
            text-align: center;
        }

        .jump-btn {
            position: relative;
            display: inline-grid;
            place-items: center;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1.5px solid var(--lane);
            border-color: color-mix(in srgb, var(--lane) 55%, transparent);
            border-radius: 50%;
            background: var(--surface);
            color: var(--lane);
            font: inherit;
            font-size: 0.7rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .jump-btn::before { content: ""; position: absolute; inset: -4px -3px; }

        .jump-btn:hover { background: color-mix(in srgb, var(--lane) 12%, var(--surface)); }

        .jump-btn:focus-visible { outline: 2px solid var(--lane); outline-offset: 1px; }

        /* A highlighted phrase that has its own word card: tap to open it. */
        mark.expr[data-vocab] {
            cursor: pointer;
            text-decoration-line: underline;
            text-decoration-style: dotted;
            text-decoration-color: var(--accent);
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
            -webkit-tap-highlight-color: transparent;
        }

        mark.expr.pressing { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }

        /* The lesson time in the header: a tap switches Moscow time / own time. */
        .tz-btn {
            display: inline-block;
            margin: -1px 0;
            padding: 0 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: inherit;
            font: inherit;
            letter-spacing: inherit;
            text-transform: inherit;
            line-height: 1.45;
            white-space: nowrap;
            cursor: pointer;
        }

        .tz-btn .tz { color: var(--accent); }

        .tz-time { white-space: nowrap; }

        /* A lane on the right for the timeline, so it never covers the page. */
        @media (max-width: 860px) {
            .page { padding-right: 48px; }
        }

        /* Phones: less space lost on the left, where nothing needs it. */
        @media (max-width: 520px) {
            .page { padding-left: 8px; }
            .tabs { margin: 14px -48px 0 -8px; padding: 10px 8px; }
            .card { padding: 12px 10px; }
            .mistake { border-left-width: 3px; }
            .pair { padding: 8px; }
            .said, .fixed { gap: 5px; }
            .mark-icon { width: 13px; }
            .ex-why { margin-left: 18px; }
            .word { padding: 12px 10px; }
        }

        @media (max-width: 520px) {
            body { font-size: 16px; }
            .card { padding: 14px; }
            #panel-vocabulary { font-size: 15px; }
            .word { padding: 12px; }
            .w-term { font-size: 1.08rem; }
            .bubble { max-width: 94%; }
            .tab { font-size: 0.88rem; }
        }

        /* Phones: the three tabs, with their symbols and counts, stay in one
           row inside the screen (a wider row makes the phone zoom the page out). */

    <script>
        const LESSON = {"version":4,"meta":{"title":"Dance, Traditions, and Exam Success","topics":["Dancing experiences and styles","Speaking with accents and fluency","Reviewing an essay on traditions","Criteria for a good example","Time management and exam pressure","Future essay types and speaking section"],"date":"4 October 2026","time":"14:59","start_utc":1791100782},"topics":[{"title":"Dancing experiences and styles","at":0,"time":0.0},{"title":"Speaking with accents and fluency","at":548,"time":253.7},{"title":"Reviewing an essay on traditions","at":1347,"time":628.5},{"title":"Criteria for a good example","at":3739,"time":2191.8},{"title":"Time management and exam pressure","at":6450,"time":3757.6},{"title":"Future essay types and speaking section","at":6941,"time":3966.7}],"mistakes":[{"grade":3,"severity":"high","label":"Word choice","rule":"While similar, 'complex' describes something with many interconnected parts, whereas 'complicated' often implies something is unnecessarily difficult or confusing.","examples":[{"quote":"not complex, it's complex","fix":"not complicated, it's complex","context":"This idea is good, but it's complicated and not complex, it's complex. This idea is complex and we need to be careful when communicating.","context_fix":"This idea is good, but it's complicated and not complicated, it's complex. This idea is complex and we need to be careful when communicating.","why":"While similar, 'complex' describes something with many interconnected parts, whereas 'complicated' often implies something is unnecessarily difficult or confusing.","time":818.7,"at":1651,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/082450-083461.webm","at":824.6,"dur":10.11}}]},{"grade":3,"severity":"high","label":"Word choice","rule":"The phrase 'lead to' requires a noun. Since 'unhappy' is an adjective, you should use the noun 'unhappiness' instead.","examples":[{"quote":"which can lead to an unhappy","fix":"can lead to unhappiness","context":"For example, arranged marriages which can lead to an unhappy.","context_fix":"For example, arranged marriages can lead to unhappiness.","why":"The phrase 'lead to' requires a noun. Since 'unhappy' is an adjective, you should use the noun 'unhappiness' instead.","time":1169.3,"at":2136,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/116858-117238.webm","at":1168.8,"dur":3.8}}]},{"grade":4,"severity":"high","label":"Sentence structure","rule":"The standard idiom is 'that being said.' Adding 'one of' makes the transition grammatically incorrect and unnatural.","examples":[{"quote":"one of That being said","fix":"That being said","context":"Here you say noticeable disadvantage. One of That being said, one noticeable downside is.","context_fix":"Here you say noticeable disadvantage. That being said, one noticeable downside is.","why":"The standard idiom is 'that being said.' Adding 'one of' makes the transition grammatically incorrect and unnatural.","time":1923.2,"at":3463,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/191388-192845.webm","at":1914.1,"dur":14.57}}]},{"grade":4,"severity":"high","label":"Word order","rule":"The phrase 'make it can be' is grammatically incorrect. You should use 'can be' directly to describe the possibility.","examples":[{"quote":"like make it can be expressed","fix":"can be expressed","context":"While people pay less attention to identity, national identity like make it can be expressed using other words.","context_fix":"While people pay less attention to identity, national identity can be expressed using other words.","why":"The phrase 'make it can be' is grammatically incorrect. You should use 'can be' directly to describe the possibility.","time":2650.9,"at":4603,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/263754-265510.webm","at":2637.7,"dur":17.56}}]},{"grade":4,"severity":"high","label":"Tense","rule":"In English, questions usually require an auxiliary verb like 'are' before the subject to be grammatically correct.","examples":[{"quote":"well, you thinking that English lacks","fix":"Are you thinking that English lacks","context":"This is what I should pay more attention to. Well, you thinking that English lacks all the sophisticated insults?","context_fix":"This is what I should pay more attention to. Are you thinking that English lacks all the sophisticated insults?","why":"In English, questions usually require an auxiliary verb like 'are' before the subject to be grammatically correct.","time":2845.4,"at":4907,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/284034-286026.webm","at":2840.4,"dur":19.92}}]},{"grade":5,"severity":"medium","label":"Article","rule":"Use an article before singular countable nouns.","examples":[{"quote":"all Latino community of Nizhny Novgorod","fix":"the whole Latino community of Nizhny Novgorod","context":"They had social media and they filmed some content telling people about their upcoming parties. I guess all Latino community of Nizhny Novgorod came there.","context_fix":"They had social media and they filmed some content telling people about their upcoming parties. I guess the whole Latino community of Nizhny Novgorod came there.","why":"When referring to a specific group, use 'the'. Adding 'whole' makes it sound more natural when describing a large community.","time":14.9,"at":43,"topic":0,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/000678-001832.webm","at":6.9,"dur":11.54}},{"quote":"when I'm in normal condition","fix":"when I'm in a normal condition","context":"It was always so easy, even better than when I'm in normal condition. But the past two times, it was so hard for me to make my tongue move and make English sounds.","context_fix":"It was always so easy, even better than when I'm in a normal condition. But the past two times, it was so hard for me to make my tongue move and make English sounds.","why":"In this context, 'condition' is a countable noun, so you need to use the indefinite article 'a' before it.","time":266.7,"at":573,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/026226-027816.webm","at":262.5,"dur":15.9}},{"quote":"strong Russian accent","fix":"a strong Russian accent","context":"I feel really uncomfortable speaking with such a strong Russian accent. If we speak about strong Russian accent, it requires some effort for me.","context_fix":"I feel really uncomfortable speaking with such a strong Russian accent. If we speak about a strong Russian accent, it requires some effort for me.","why":"In this context, 'accent' is a countable noun, so it needs the indefinite article 'a' before the adjective.","time":351.4,"at":781,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/035336-035817.webm","at":353.5,"dur":4.81}},{"quote":"example should be convincing","fix":"An example should be convincing","context":"Usually that's my pain in the ass to think about like, what can it be based on? Example should be convincing.","context_fix":"Usually that's my pain in the ass to think about like, what can it be based on? An example should be convincing.","why":"In English, singular countable nouns like 'example' usually require an article (a, an, the) or a determiner.","time":1301.0,"at":2392,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/129304-130301.webm","at":1293.1,"dur":9.97}},{"quote":"collection is also very radical term","fix":"collection is also a very radical term","context":"I gave it up myself. Neglect? Well, the collection is also very radical term.","context_fix":"I gave it up myself. Neglect? Well, the collection is also a very radical term.","why":"The word 'term' is a countable noun, so it requires an article like 'a' before the adjective.","time":2439.7,"at":4216,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/242796-245576.webm","at":2430.6,"dur":27.8}}]},{"grade":5,"severity":"medium","label":"Pronoun","rule":"Use pronouns that agree with the number of the noun.","examples":[{"quote":"that are neglected by immigrants","fix":"Those are neglected by immigrants","context":"Another key upside is harmful traditions that immigrants stop following. That are neglected by immigrants.","context_fix":"Another key upside is harmful traditions that immigrants stop following. Those are neglected by immigrants.","why":"Since 'traditions' is a plural noun, you should use the plural pronoun 'those' instead of the singular 'that'.","time":1141.9,"at":2078,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/112158-114364.webm","at":1121.8,"dur":22.06}},{"quote":"that's","fix":"it's","context":"It's already obvious that Moroccans live in Spain, and that's also obvious that their traditions die.","context_fix":"It's already obvious that Moroccans live in Spain, and it's also obvious that their traditions die.","why":"You need the dummy subject 'it' to introduce the second clause. 'And that's also obvious' is grammatically incorrect here.","time":1439.4,"at":2666,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/143630-144379.webm","at":1436.4,"dur":7.49}},{"quote":"What kind of scholarships are that?","fix":"What kind of scholarships are they","context":"I have seen a lot of these scholarships when I was researching European unis. What kind of scholarships are that?","context_fix":"I have seen a lot of these scholarships when I was researching European unis. What kind of scholarships are they?","why":"Since 'scholarships' is plural, you should use 'they' instead of 'that' to refer back to them.","time":1663.8,"at":2983,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/164816-167288.webm","at":1648.4,"dur":24.72}},{"quote":"that I need to connect it","fix":"that I need to connect them","context":"I have all the pieces of this puzzle, and now I have everything within my reach that I need to connect it and I just need to do it faster.","context_fix":"I have all the pieces of this puzzle, and now I have everything within my reach that I need to connect them and I just need to do it faster.","why":"Since you are referring to 'pieces' (plural), you should use 'them' instead of 'it' to maintain agreement.","time":3747.1,"at":6426,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/373562-375155.webm","at":3735.7,"dur":15.93}}]},{"grade":5,"severity":"medium","label":"Countable/plural","rule":"Distinguish between countable and uncountable nouns.","examples":[{"quote":"efforts","fix":"effort","context":"It's more comfortable for me to speak just how I speak right now. But if we speak about a strong Russian accent, it requires some efforts for me.","context_fix":"It's more comfortable for me to speak just how I speak right now. But if we speak about a strong Russian accent, it requires some effort for me.","why":"In this context, 'effort' is an uncountable noun referring to the general energy or exertion needed to do something.","time":353.6,"at":788,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/034868-035817.webm","at":348.8,"dur":9.49}},{"quote":"survey","fix":"a survey","context":"Only if the argument itself is rather weak, I can use survey just to make it sound more convincing.","context_fix":"Only if the argument itself is rather weak, I can use a survey just to make it sound more convincing.","why":"The word 'survey' is a countable noun. In this context, it needs an article like 'a' or should be plural.","time":1341.8,"at":2482,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/134004-134862.webm","at":1340.2,"dur":8.58}},{"quote":"much more swear words","fix":"many more swear words","context":"Because there are much more swear words in Spanish and they sound juicy. English could never insult you in the way Spanish can.","context_fix":"Because there are many more swear words in Spanish and they sound juicy. English could never insult you in the way Spanish can.","why":"We use 'many' for countable nouns like 'words' and 'much' for uncountable nouns.","time":2806.9,"at":4824,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/280620-281835.webm","at":2806.4,"dur":12.15}}]},{"grade":5,"severity":"medium","label":"Sentence structure","rule":"After 'why' in a question or rhetorical statement, use the base form of the verb (pay) instead of the -ing form.","examples":[{"quote":"paying for overpriced cocktails","fix":"pay for overpriced cocktails","context":"Everybody always brings alcohol themselves and so they just leave it outside the bar. So why paying for overpriced cocktails?","context_fix":"Everybody always brings alcohol themselves and so they just leave it outside the bar. So why pay for overpriced cocktails?","why":"After 'why' in a question or rhetorical statement, use the base form of the verb (pay) instead of the -ing form.","time":79.0,"at":186,"topic":0,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/006826-008217.webm","at":68.5,"dur":13.91}}]},{"grade":5,"severity":"medium","label":"Tense","rule":"Use the past simple 'I danced' to describe a completed habit over a period of time in the past.","examples":[{"quote":"was dancing regularly","fix":"danced regularly","context":"I was dancing regularly for I think 15 years of my life. Every year, every studying year, I went to classes regularly.","context_fix":"I danced regularly for I think 15 years of my life. Every year, every studying year, I went to classes regularly.","why":"Use the past simple 'I danced' to describe a completed habit over a period of time in the past.","time":129.4,"at":283,"topic":0,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/012942-013772.webm","at":129.6,"dur":8.3}}]},{"grade":5,"severity":"medium","label":"Sentence structure","rule":"When using 'or' to negate an adjective like 'good', we use 'not' to form the negative option.","examples":[{"quote":"something good or no","fix":"something good or not","context":"I asked my sister to help me come up with an idea, and then something came to my mind. So let's see if it is something good or no.","context_fix":"I asked my sister to help me come up with an idea, and then something came to my mind. So let's see if it is something good or not.","why":"When using 'or' to negate an adjective like 'good', we use 'not' to form the negative option.","time":709.6,"at":1510,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/069438-071177.webm","at":694.6,"dur":17.39}}]},{"grade":5,"severity":"medium","label":"Tense","rule":"Since you are referring to a previous action in the conversation, the past tense 'said' is required.","examples":[{"quote":"say","fix":"said","context":"I thought I used this phrase, like following traditions, somewhere before. I already say following here.","context_fix":"I thought I used this phrase, like following traditions, somewhere before. I already said following here.","why":"Since you are referring to a previous action in the conversation, the past tense 'said' is required.","time":1145.4,"at":2088,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/110538-110869.webm","at":1105.6,"dur":3.31}}]},{"grade":5,"severity":"medium","label":"Sentence structure","rule":"The verb 'remain' is a stative verb and is not used in the passive voice. Use 'should remain' instead.","examples":[{"quote":"everything should be remained here","fix":"everything should remain here","context":"That's the point of the sentence, right? So everything should be remained here.","context_fix":"That's the point of the sentence, right? So everything should remain here.","why":"The verb 'remain' is a stative verb and is not used in the passive voice. Use 'should remain' instead.","time":1530.9,"at":2811,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/152658-153371.webm","at":1526.8,"dur":7.13}}]},{"grade":5,"severity":"medium","label":"Tense","rule":"Since you are describing general criteria for a good example, use the present tense 'gives' instead of the past tense 'gave'.","examples":[{"quote":"she gave some proof","fix":"she gives some proof","context":"The example that you put should be convincing. It is either obvious or self-explanatory or she gave some proof that this is the way it is.","context_fix":"The example that you put should be convincing. It is either obvious or self-explanatory or she gives some proof that this is the way it is.","why":"Since you are describing general criteria for a good example, use the present tense 'gives' instead of the past tense 'gave'.","time":2221.9,"at":3818,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/221025-223280.webm","at":2210.4,"dur":22.55}}]},{"grade":5,"severity":"medium","label":"Tense","rule":"After the auxiliary verb 'did' or 'didn't', you must use the base form of the verb (hear) instead of the -ing form.","examples":[{"quote":"didn't hearing","fix":"didn't hear","context":"You were talking about following criteria and I actually didn't hearing.","context_fix":"You were talking about following criteria and I actually didn't hear.","why":"After the auxiliary verb 'did' or 'didn't', you must use the base form of the verb (hear) instead of the -ing form.","time":2275.5,"at":3950,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/227598-228074.webm","at":2276.2,"dur":4.76}}]},{"grade":5,"severity":"medium","label":"Sentence structure","rule":"The word 'how' is redundant when used with 'the way'. You should use either 'the way' or 'how' to express this.","examples":[{"quote":"in the way how Spanish can","fix":"in the way Spanish can","context":"English could never insult you in the way how Spanish can. That is the reason why I love Spanish so much.","context_fix":"English could never insult you in the way Spanish can. That is the reason why I love Spanish so much.","why":"The word 'how' is redundant when used with 'the way'. You should use either 'the way' or 'how' to express this.","time":2815.8,"at":4845,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/281261-281835.webm","at":2812.7,"dur":5.74}}]},{"grade":5,"severity":"medium","label":"Sentence structure","rule":"The verb 'replace' needs an object. Adding 'it' clarifies that you are replacing the phrase you aren't comfortable with.","examples":[{"quote":"replace if I'm not comfortable","fix":"replace it if I'm not comfortable","context":"We have to solve the same set of problems: how to paraphrase, how to connect with a previous idea, and how to replace if I'm not comfortable with a certain phrase.","context_fix":"We have to solve the same set of problems: how to paraphrase, how to connect with a previous idea, and how to replace it if I'm not comfortable with a certain phrase.","why":"The verb 'replace' needs an object. Adding 'it' clarifies that you are replacing the phrase you aren't comfortable with.","time":3597.5,"at":6095,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/358732-360130.webm","at":3587.4,"dur":13.98}}]},{"grade":5,"severity":"medium","label":"Sentence structure","rule":"The word 'something' is singular, so it requires the singular verb 'is' instead of the plural 'are'.","examples":[{"quote":"are there something","fix":"Is there something","context":"Will we continue writing essays? Are there something that we haven't looked at yet?","context_fix":"Will we continue writing essays? Is there something that we haven't looked at yet?","why":"The word 'something' is singular, so it requires the singular verb 'is' instead of the plural 'are'.","time":3819.3,"at":6566,"topic":4,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/381814-382613.webm","at":3818.3,"dur":7.99}}]},{"grade":5,"severity":"medium","label": x for most people.","Designing a city's public transport system is a complex task.","The relationship between the two companies is quite complex."],"synonyms":["complicated","intricate","convoluted","elaborate","multifaceted","involved","knotty"],"antonyms":["simple","straightforward","easy","basic","uncomplicated"],"gap":{"sentence":"The tax laws are so _____ that most people have to hire a professional to help them.","answer":"complex","options":["complex","simple","straightforward","easy"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/083150-083461.webm","at":831.6,"dur":3.11}},{"term":"ambiguous","pos":"adjective","definition":"Having more than one possible meaning or not being clear enough.","time":959.7,"lesson":"Don't use the phrase 'with the immigrant' because that sounds a little ambiguous. It could imply that the more immigrants arrive, the fewer people practice the traditions in Morocco.","examples":[{"sentence":"The ending of the movie was very ambiguous, leaving the audience to decide what happened.","pattern":"very ambiguous"},{"sentence":"His instructions were ambiguous, so I wasn't sure how to complete the task.","pattern":"ambiguous + noun"},{"sentence":"The law is written in ambiguous language, which leads to many different interpretations.","pattern":"ambiguous language"}],"more_examples":["The company's response to the rumors was ambiguous, which frustrated the investors.","I'm sorry, but your request is a bit ambiguous; could you please clarify what you need?","The signs in the park were ambiguous, and we ended up getting lost."],"synonyms":["unclear","vague","equivocal","uncertain","obscure","open to interpretation","noncommittal"],"antonyms":["clear","unambiguous","explicit","definite","precise","specific","obvious","plain"],"gap":{"sentence":"The manager's feedback was so _____ that the team members were confused about which parts of the project needed improvement.","answer":"ambiguous","options":["ambiguous","explicit","transparent","coherent"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/096258-096681.webm","at":962.8,"dur":4.23}},{"term":"among","pos":"preposition","definition":"In the middle of or part of a group of people or things.","time":981.8,"lesson":"Traditions don't disappear in the original country; they disappear among immigrants. Should I add the phrase 'among immigrants' to the text?","examples":[{"sentence":"The secret was shared among the three best friends.","pattern":"shared among + [plural noun]"},{"sentence":"He felt like a stranger among his own family.","pattern":"among + [group of people]"},{"sentence":"You can find many different types of food among the stalls.","pattern":"among + [objects/things]"},{"sentence":"The news spread quickly among the students.","pattern":"spread among + [group]"}],"more_examples":["I found my keys hidden among the cushions of the sofa.","The thief hid the stolen goods among a pile of old clothes.","She felt comfortable talking about her problems among her coworkers."],"synonyms":["amid","in the middle of","surrounded by"],"antonyms":[],"gap":{"sentence":"It is often difficult to keep a secret when you are surrounded by many people, especially _____ your closest friends.","answer":"among","options":["among","between","beside","behind"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/098108-098617.webm","at":981.3,"dur":5.09}},{"term":"neglect","pos":"verb","definition":"To fail to care for, follow, or attend to something properly.","time":1106.0,"lesson":"We can say that immigrants neglect traditions. Some harmful traditions are neglected by immigrants.","examples":[{"sentence":"He neglected to lock the door before leaving the house.","pattern":"neglect + to + verb"},{"sentence":"The garden was completely neglected for several months.","pattern":"passive voice (be neglected)"},{"sentence":"You shouldn't neglect your health while you are working so hard.","pattern":"neglect + noun"},{"sentence":"The old building has been neglected by the city for years.","pattern":"neglect + by + agent"}],"more_examples":["She neglected to mention that she would be late for the meeting.","The company was accused of neglecting its safety responsibilities.","Don't neglect your studies just because you have a part-time job."],"synonyms":["ignore","disregard","overlook","fail to","abandon","mismanage"],"antonyms":["attend to","care for","maintain","look after","nurture","protect","observe"],"gap":{"sentence":"The house became very messy and dusty because the owner _____ to clean it for weeks.","answer":"neglected","options":["neglected","organized","decorated","renovated"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/110538-110869.webm","at":1105.6,"dur":3.31}},{"term":"lose track of","pos":"expression","definition":"To stop being able to remember or follow what is happening or what was being discussed.","time":1113.4,"lesson":"Wait, I lost track of where we were doing. We were discussing how immigrants might neglect certain traditions.","examples":[{"sentence":"I'm sorry, I lost track of what you were saying because of the loud noise.","pattern":"lose track of + [something/someone]"},{"sentence":"It's easy to lose track of time when you are watching a movie.","pattern":"lose track of + time"},{"sentence":"I lost track of the conversation and didn't know how to join back in.","pattern":"lose track of + the conversation"},{"sentence":"He had been working for so long that he lost track of the day.","pattern":"lose track of + the day"}],"more_examples":["I'm sorry, I lost track of the thread of the argument for a moment.","It's easy to lose track of your goals when you're overwhelmed by small tasks.","I lost track of what we were planning to do for dinner."],"synonyms":["get confused","get distracted"],"antonyms":["keep track of","stay focused"],"gap":{"sentence":"The lecture was so long and complicated that I eventually _____ the main point.","answer":"los ___, so I didn't need to read the manual to understand how to use them.","answer":"self-explanatory","options":["self-explanatory","complicated","confusing","vague"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/139672-140172.webm","at":1396.9,"dur":5.0}},{"term":"financial aid","pos":"noun phrase","definition":"Money given by an organization or government to help students pay for their education.","time":1667.2,"lesson":"You can usually find financial aid, especially for people who come from certain backgrounds.","examples":[{"sentence":"The university offers financial aid to students who cannot afford the tuition fees.","pattern":"offer + financial aid + to + [someone]"},{"sentence":"I applied for financial aid to help cover my living expenses while studying abroad.","pattern":"apply for + financial aid"},{"sentence":"Does the scholarship package include any financial aid?","pattern":"include + financial aid"},{"sentence":"Many students rely on financial aid to complete their degrees.","pattern":"rely on + financial aid"}],"countable":[],"uncountable":[{"meaning":"Money given by an organization or government to help students pay for their education.","example":"You can usually find financial aid, especially for people who come from certain backgrounds.","lesson":true}],"more_examples":["The college's financial aid office will review your application next week.","Is there any financial aid available for international students?","She received a significant amount of financial aid to pay for her master's degree."],"synonyms":["grants","scholarships","subsidies","funding","educational assistance"],"antonyms":["tuition fees"],"gap":{"sentence":"Because my family couldn't afford the high cost of college, I had to apply for _____ to attend.","answer":"financial aid","options":["financial aid","medical insurance","legal advice","travel agency"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_14-59-42/167378-167759.webm","at":1674.0,"dur":3.81}
