<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;

ore.","examples":[{"sentence":"We got lost and ended up staying at a hotel for the night.","pattern":"end up + -ing"},{"sentence":"If you don't study, you might end up failing the exam.","pattern":"end up + [-ing / adjective / prepositional phrase]"},{"sentence":"They took a wrong turn and ended up in a completely different town.","pattern":"end up in [place]"},{"sentence":"I didn't mean to spend so much money, but I ended up buying the most expensive one.","pattern":""}],"more_examples":["We were looking for a cheap restaurant but ended up eating at a fancy bistro.","He started out as a waiter but ended up becoming the owner of the cafe.","I thought I'd just watch one episode, but I ended up binge-watching the whole season."],"synonyms":["wind up","eventually reach"],"antonyms":[],"gap":{"sentence":"I only intended to watch one episode, but I _____ staying up until 3 a.m. watching the whole season.","answer":"ended up","options":["ended up","decided","planned","offered"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/162360-163127.webm","at":1623.7,"dur":7.67}},{"term":"longevity","pos":"noun","definition":"the state of living for a long time or the fact of staying alive.","time":1669.5,"lesson":"For example, in Moscow, there is a policy regarding longevity. I know that they have different initiatives in terms of nutrition.","examples":[{"sentence":"Advances in medical technology have significantly increased human longevity.","pattern":""},{"sentence":"A healthy diet and regular exercise are key factors in ensuring longevity.","pattern":""},{"sentence":"The government is introducing new policies to promote longevity among the elderly.","pattern":""},{"sentence":"Some people believe that meditation can contribute to greater longevity.","pattern":""}],"countable":[{"meaning":"the state of living for a long time or the fact of staying alive.","example":"For example, in Moscow, there is a policy regarding longevity.","lesson":true}],"uncountable":[{"  city is very beautiful, but it is quite expensive _____ the cost of living.","answer":"in terms of","options":["in terms of","despite","instead of","unlike"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/167540-168003.webm","at":1675.5,"dur":4.63}},{"term":"take measures","pos":"expression","definition":"To take specific actions or steps to achieve a goal or solve a problem.","time":1699.0,"lesson":"Your example could work really well if the title was something like 'the government should take measures.' For instance, educating the public is a measure they are taking.","examples":[{"sentence":"The government needs to take measures to reduce carbon emissions by next year.","pattern":"take measures + to + verb"},{"sentence":"The school is taking measures to ensure the safety of all students.","pattern":"taking measures (present continuous)"},{"sentence":"What measures are being taken to improve the local healthcare system?","pattern":"passive voice: measures are being taken"},{"sentence":"The company took strict measures to prevent data breaches.","pattern":"take strict measures"}],"more_examples":["The city is taking measures to clear the homeless encampments from the park.","We need to take measures to ensure that the project stays under budget.","The restaurant took measures to improve hygiene standards after the inspection."],"synonyms":["take action","take steps","take precautions","implement measures"],"antonyms":["take no action","do nothing","ignore the problem","remain inactive"],"gap":{"sentence":"The restaurant had to _____ to improve the service because customers were complaining about the long wait times.","answer":"take measures","options":["take measures","give opinions","keep secrets","tell stories"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/170236-170559.webm","at":1702.5,"dur":3.23}},{"term":"yield","pos":"verb","definition":"To produce or provide a particular result, profit, or outcome.","time":1787.3,"lesson":"I don't know whether it yielded any positive results because I'm not a scientist. We don't need prior academic knowledge to write a good essay.","examples":[{"sentence":"The new marketing campaign yielded a 20% increase in sales.","pattern":"yield + [noun/result]"},{"sentence":"The investment is expected to yield high returns over the next five years.","pattern":"yield + [adjective] + [noun]"},{"sentence":"Did the experiment yield the data we were looking for?","pattern":"Did [subject] yield...?"},{"sentence":"The heavy rains yielded very little water for the reservoir.","pattern":"yield + [quantity/amount]"}],"more_examples":["The negotiations yielded a compromise that both sides could accept.","The new training program yielded significant improvements in employee productivity.","The research project yielded some unexpected insights into consumer behavior."],"synonyms":["produce","generate","provide","bring forth","create","give"],"antonyms":[],"gap":{"sentence":"The intensive training program _____ significant improvements in the team's performance after only three months.","answer":"yielded","options":["yielded","started","avoided","stopped"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/178364-179393.webm","at":1783.7,"dur":10.29}},{"term":"prior knowledge","pos":"noun phrase","definition":"Information or skills that a person already knows before starting a new task or activity.","time":1794.0,"lesson":"We don't need any prior academic knowledge to write a good essay. We can base our examples on real facts but modify some details to suit our needs.","examples":[{"sentence":"The test is designed to assess your prior knowledge of basic algebra.","pattern":"prior knowledge of + [subject]"},{"sentence":"The teacher asked the students what prior knowledge they had regarding the French Revolution.","pattern":"have prior knowledge regarding"},{"sentence":"You don't need any prior knowledge of coding to start this introductory course.","patter asy series.","pattern":"make up + a fictional [noun]"},{"sentence":"Don't make up stories; it's important to tell the truth during the interview.","pattern":"Don't + make up + [noun]"}],"more_examples":["He told his boss he was sick, but he actually just made up a reason to stay home.","I'm not really a creative person, so I find it hard to make up stories for my kids.","The witness was accused of making up details to please the police."],"synonyms":["fabricate","concoct","invent","falsify","forge","cook up","fake"],"antonyms":["tell the truth"],"gap":{"sentence":"Since he didn't actually see the movie, he had to _____ when his friend asked for a review.","answer":"make something up","options":["make something up","take a photo","buy a ticket","watch a film"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/180040-180548.webm","at":1800.6,"dur":5.08}},{"term":"come up with","pos":"phrasal verb","definition":"To produce, create, or suggest a new idea, plan, or example.","time":1850.0,"lesson":"I am telling you this because you have a hard time generating ideas. You need to practice coming up with examples.","examples":[{"sentence":"We need to come up with a plan to increase our sales by next month.","pattern":"come up with + noun (plan/idea)"},{"sentence":"How did you come up with such a creative solution to the problem?","pattern":"question form: How did you come up with...?"},{"sentence":"The marketing team is struggling to come up with a catchy slogan.","pattern":""},{"sentence":"If you can't come up with an answer right now, we can discuss it later.","pattern":"if + can't come up with"}],"more_examples":["I'm trying to come up with a way to save money on my electricity bill.","Can you come up with some names for our new puppy?","The architect had to come up with a design that fits the small space."],"synonyms":["think of","devise","create","generate","produce","formulate","dream up","conceive","propose"],"antonyms":[],"gap":{"sentence":"I need to _____ a unique gift for my sister's birthday because she already has everything.","answer":"come up with","options":["come up with","bring about","get along","go over"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/184986-185358.webm","at":1850.1,"dur":3.72}},{"term":"willy-nilly","pos":"adverb","definition":"Doing something in a disorganized way, without a clear plan or purpose.","time":1869.0,"lesson":"Many people make the mistake of just coming up with statistics willy-nilly. This is typical of someone who doesn't really know what they are doing.","examples":[{"sentence":"You can't just throw ideas together willy-nilly; you need a structured plan.","pattern":"do something + willy-nilly"},{"sentence":"The supplies were distributed willy-nilly across the different departments.","pattern":""},{"sentence":"He tends to make decisions willy-nilly rather than considering the long-term consequences.","pattern":""},{"sentence":"The furniture was arranged willy-nilly, making the room feel very cluttered.","pattern":"past participle + willy-nilly"}],"more_examples":["Don't just go around spending money willy-nilly; we need to stick to the budget.","The team was working willy-nilly, and as a result, they missed the deadline.","You shouldn't just click on every link willy-nilly; it's not safe for your computer."],"synonyms":["haphazardly","randomly","aimlessly","at random","chaotically","indiscriminately","without method"],"antonyms":["systematically","methodically","deliberately","purposefully","intentionally"],"gap":{"sentence":"Because she didn't have a shopping list, she ended up buying items _____ and spent way too much money.","answer":"willy-nilly","options":["willy-nilly","efficiently","purposefully","systematically"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/186838-187418.webm","at":1868.5,"dur":5.8}},{"term":"fact-checking","pos":"noun","definition":"The process of verifying that information or statistics are accurate and true.","time":1897.0,"lesson":"It doesn't make any sense. An examiner is not going to do any fact-checking on your writing, but it is obvious if your information is incorrect.","examples":[{"sentence":"The news agency hired a team for fact-checking before publishing the article.","pattern":"do fact-checking"},{"sentence":"You should always do some fact-checking before citing statistics in your essay.","pattern":"do some fact-checking"},{"sentence":"The politician's claims were put through a rigorous fact-checking process.","pattern":"put through a fact-checking process"},{"sentence":"Fact-checking is essential to ensure that the data presented is reliable.","pattern":"Fact-checking is + adjective"}],"countable":[],"uncountable":[{"meaning":"The process of verifying that information or statistics are accurate and true.","example":"An examiner is not going to do any fact-checking on your writing, but it is obvious if your information is incorrect.","lesson":true}],"more_examples":["The social media platform introduced a new tool for automated fact-checking of viral posts.","Before making a final decision, the company spent weeks on fact-checking the market research.","Journalists are often criticized for failing to do proper fact-checking before breaking a story."],"synonyms":["verification","validation","corroboration","authentication","checking of facts"],"antonyms":[],"gap":{"sentence":"Before sharing the viral post on social media, I did some _____ to ensure the information wasn't fake.","answer":"fact-checking","options":["fact-checking","storytelling","advertising","negotiating"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/190120-190506.webm","at":1901.4,"dur":3.86}},{"term":"addiction","pos":"noun","definition":"A state where someone feels a strong need or desire to keep doing something.","time":2023.0,"lesson":"I don't have any addictions to certain products. For example, I don't need to eat chocolate every day.","examples":[{"sentence":
