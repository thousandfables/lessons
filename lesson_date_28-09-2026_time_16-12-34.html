ue to you.","examples":[{"sentence":"The survey results are representative of the entire population.","pattern":"representative of [something]"},{"sentence":"We need a representative sample of students to conduct this study.","pattern":"representative sample"},{"sentence":"Is this case representative of the problems the company faces?","pattern":"representative of [a situation/problem]"},{"sentence":"The small shop is representative of the traditional style found in this village.","pattern":"representative of [a style/type]"}],"more_examples":["The protest was representative of the growing public frustration with the new law.","The museum's collection is representative of the art movement of the 1920s."],"synonyms":["typical","characteristic","prototypical","standard","common"],"antonyms":["atypical","unrepresentative","anomalous"],"gap":{"sentence":"The complaints from these three customers are _____ of the issues many people face with the new app.","answer":"representative","options":["representative","individual","private","unique"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/205056-205516.webm","at":2050.8,"dur":4.6}},{"term":"formulate","pos":"verb","definition":"To clearly express or define a specific idea, plan, or group of people.","time":2081.0,"lesson":"We need to formulate this group first. We need to think of a specific group for whom this is true in a certain context.","examples":[{"sentence":"The government is trying to formulate a new policy on climate change.","pattern":"formulate + noun (plan/policy)"},{"sentence":"I need some time to formulate my thoughts before I speak in the meeting.","pattern":"formulate + my thoughts"},{"sentence":"The scientists are working to formulate a hypothesis based on the new data.","pattern":"formulate a hypothesis"},{"sentence":"Can you formulate a clear request so that the team knows exactly what to do?","pattern":"formulate + adjective + noun"}],"more_examples":["The marketing team needs to formulate a strategy to reach younger customers.","It took her a while to formulate a coherent response to the interviewer's question.","The committee is meeting to formulate a plan for the upcoming festival."],"synonyms":["develop","devise","draft","frame","construct","outline","work out"],"antonyms":[],"gap":{"sentence":"The marketing team needs to _____ a clear strategy before they can launch the new product next month.","answer":"formulate","options":["formulate","ignore","forget","delete"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/208248-208465.webm","at":2082.6,"dur":2.17}},{"term":"in a certain context","pos":"expression","definition":"under specific circumstances or in a particular situation.","time":2085.0,"lesson":"We need to think of a specific group for whom this is also true in a certain context. Can you think of a group that we can articulate?","examples":[{"sentence":"The word 'bank' can have different meanings in a certain context, such as finance or geography.","pattern":""},{"sentence":"That joke might be funny in a certain context, but it's inappropriate here.","pattern":"might be [adjective] in a certain context"},{"sentence":"The rule applies to everyone, but it might change in a certain context.","pattern":"apply... but... in a certain context"},{"sentence":"In a certain context, his silence was interpreted as agreement.","pattern":"In a certain context, [subject] + [verb]"}],"more_examples":["The policy is quite flexible and can be adjusted in a certain context.","Some behaviors that are normal in one country might be offensive in a certain context."],"synonyms":["depending on the situation","given the circumstances","under specific conditions","in a particular setting","contingent on the situation"],"antonyms":["in all cases","regardless of context","universally","at all times","in every situation"],"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/208786-209302.webm","at":2088.0,"dur":5.16}},{"term":"articulate","pos":"verb","definition":"To clearly express or describe a specific idea, group, or concept in words.","time":2093.5,"lesson":"Can you think of a group that we can articulate? We need to think of a specific group for which this is also true in a certain context.","examples":[{"sentence":"It is often difficult to articulate exactly how you feel during a crisis.","pattern":"difficult to articulate"},{"sentence":"The CEO was able to articulate the company's vision for the next five years.","pattern":"be able to articulate"},{"sentence":"I have a vague idea, but I can't quite articulate it into a plan.","pattern":"articulate + object"},{"sentence":"She spoke with such clarity that she articulated the complex problem perfectly.","pattern":"articulate + object + adverb"}],"more_examples":["It's hard to articulate the difference between these two similar products.","The witness struggled to articulate what he saw during the accident.","You need to be able to articulate your goals if you want to succeed."],"synonyms":["express","put into words","voice","state","convey","explain","formulate","communicate"],"antonyms":["conceal","withhold"],"gap":{"sentence":"The instructions were so confusing that I struggled to _____ exactly what the team needed to do.","answer":"articulate","options":["articulate","ignore","hide","forget"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/209302-209617.webm","at":2093.1,"dur":3.15}},{"term":"lessen","pos":"verb","definition":"To reduce the amount, degree, or intensity of something.","time":2099.0,"lesson":"Can it be a group of my friends that I encourage to lessen the amount of sugar they eat? Or would that group be too small?","examples":[{"sentence":"The new medication is designed to lessen the pain of chronic back issues.","pattern":"lessen + noun"},{"sentence":"We need to find ways to lessen the impact of the budget cuts on the staff.","pattern":"lessen the impact of"},{"sentence":"The heavy rain helped to lessen the intensity of the heat.","pattern":"lessen + the intensity of"},{"sentence":"Taking a deep breath can help lessen your anxiety before a presentation.","pattern":""}],"more_examples":["The government is trying to lessen the risk of future economic recessions.","You can use a humidifier to lessen the dryness of the air in your bedroom.","The new noise-canceling headphones significantly lessen the sound of the engine."],"synonyms":["reduce","decrease","diminish","ease","alleviate","mitigate","moderate","curb","dampen","tone down"],"antonyms":["increase","heighten","intensify","amplify","augment","magnify","boost"],"gap":{"sentence":"The company decided to shorten the work week in order to _____ the stress on their employees.","answer":"lessen","options":["lessen","increase","strengthen","improve"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/210454-210748.webm","at":2104.6,"dur":2.94}},{"term":"objective measurement","pos":"noun phrase","definition":"A piece of data or a result based on facts and observable evidence rather than feelings.","time":2303.0,"lesson":"These are the measurements that we can actually call objective. For example, if you lost three pounds, that is an objective measurement.","examples":[{"sentence":"Weight and blood pressure are considered objective measurements of a person's health.","pattern":"subject + are considered + objective measurements"},{"sentence":"The researchers used objective measurements to track the students' progress.","pattern":"use + objective measurements + to + verb"},{"sentence":"While self-reported happiness is subjective, your heart rate is an objective measurement.","pattern":""},{"sentence":"We need to base our final decision on objective measurements rather than opinions.","pattern":"base + decision + on + objective measurements"}],"countable":[{"meaning":"A piece of data or a result based on facts and observable evidence rather than feelings.","example":"For example, if you lost three pounds, that is an objective measurement.","lesson":true}],"uncountable":[],"more_examples":["The app provides an objective measurement of your daily steps.","We need objective measurements to determine if the new drug is effective.","The thermometer provides an objective measurement of the room's temperature."],"synonyms":["empirical data","quantifiable data","hard data","measurable fact","concrete evidence","verifiable data"],"antonyms":["subjective opinion","personal feeling","anecdotal evidence","subjective assessment","qualitative judgment"],"gap":{"sentence":"To ensure the competition is fair, the winner must be chosen based on an _____ rather than personal feelings.","answer":"objective measurement","options":["objective measurement","subjective opinion","personal preference","random guess"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/230812-231331.webm","at":2308.3,"dur":5.19}},{"term":"in a nutshell","pos":"idiom","definition":"To describe something in a very brief, concise, or summarized way.","time":2473.0,"lesson":"I want you to first write this idea in a nutshell. In a very short way, what is your second idea about?","examples":[{"sentence":"Can you tell me what the plan is in a nutshell?","pattern":"tell me [something] in a nutshell"},{"sentence":"In a nutshell, the project failed because we ran out of funding.","pattern":"In a nutshell, [clause]"},{"sentence":"The CEO explained the new strategy in a nutshell during the meeting.","pattern":"explain [something] in a nutshell"},{"sentence":"If you need the story in a nutshell, it's a tale of survival.","pattern":"if you need [something] in a nutshell"}],"more_examples":["The movie is about a man who travels through time; in a nutshell, it's a sci-fi drama.","I don't have time to give you the full report, but in a nutshell, we are over budget."],"synonyms":["in short","briefly","to put it simply","in a word"],"antonyms":["in great detail","at length","elaborately","extensively"],"gap":{"sentence":"The movie was three hours long, but if you want the plot _____, a hero saves the world.","answer":"in a nutshell","options":["in a nutshell","in detail","specifically","eventually"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/247284-247665.webm","at":2473.0,"dur":3.81}},{"term":"collocate","pos":"verb","definition":"To occur together with another word or phrase in a natural way.","time":3038.4,"lesson":"Collocate is a fancy word that means a native speaker would never combine those words; they simply don't work together. This is a very good example of a vocabulary mistake because these two words do not collocate.","examples":[{"sentence":"The words 'make' and 'decision' collocate perfectly.","pattern":"collocate + with"},{"sentence":"Do these two adjectives collocate in this context?","pattern":""},{"sentence":"The student struggled to find words that collocate naturally with 'fast'.","pattern":"collocate + naturally"}],"more_examples":["The verb 'commit' usually collocates with 'crime' or 'offense'.","In linguistics, we study which adjectives collocate with specific nouns.","Does 'heavy' collocate with 'rain' in this specific region?"],"synonyms":["go together","pair with","accompany"],"antonyms":["clash"],"gap":{"sentence":"Because the words 'heavy' and 'rain' _____ so naturally, they are very common in everyday English descriptions of weather.","answer":"collocate","options":["collocate","ignore","describe","explain"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/303766-304055.webm","at":3037.9,"dur":2.89}},{"term":"tricky question","pos":"noun phrase","definition":"A question that is difficult to answer or has no simple, clear solution.","time":3351.5,"lesson":"It is not just about being inside the building itself. I don't know; it is a tricky question.","examples":[{"sentence":"The interviewer asked me a very tricky question about my past failures.","pattern":"a very tricky question"},{"sentence":"Whether we should prioritize speed or quality is a tricky question to answer.","pattern":"tricky question to [verb]"},{"sentence":"I'm sorry, that's a bit of a tricky question; can I have a moment to think?","pattern":"a bit of a tricky question"},{"sentence":"The math exam included several tricky questions designed to confuse the students.","pattern":"tricky questions + [past participle]"}],"countable":[{"meaning":"A question that is difficult to answer or has no simple, clear solution.","example":"I don't know; it is a tricky question.","lesson":true}],"uncountable":[],"more_examples":["The politician struggled to respond to the journalist's tricky question about his tax records.","I'm not sure how to handle that tricky question regarding the budget cuts.","The puzzle was simple, but the final tricky question kept everyone guessing for hours."],"synonyms":["tough question","difficult question","complex question","thorny question","hard question","challenging question"],"antonyms":["easy question","straightforward question","simple question","obvious answer"],"gap":{"sentence":"When I asked my boss if I should work longer hours or take more breaks, she said it was a _____.","answer":"tricky question","options":["tricky question","simple answer","short response","clear instruction"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/336554-337182.webm","at":3365.7,"dur":6.28}},{"term":"do an experiment","pos":"expression","definition":"To perform a scientific test or practical investigation to discover something.","time":3574.5,"lesson":"What word do we usually use with the word experiment? We usually say 'do an experiment.'","examples":[{"sentence":"The scientists are doing an experiment to see how the new drug affects cell growth.","pattern":""},{"sentence":"We need to do an experiment before we can confirm these results.","pattern":"need to + do an experiment"},{"sentence":"I'm doing an experiment with my coffee recipe to find the perfect flavor.","pattern":"doing an experiment (ongoing action)"}],"more_examples":["The students have to do an experiment to test the pH levels of the water.","I want to do an experiment by changing my sleep schedule for a week.","The engineers are doing an experiment to see if the bridge can withstand high winds."],"synonyms":["conduct an experiment","run an experiment","carry out an experiment","perform an experiment","test","try out"],"antonyms":[],"gap":{"sentence":"Since we aren't sure if the new fertilizer actually helps plants grow faster, we should _____ next week.","answer":"do an experiment","options":["do an experiment","take a photo","give a presentation","pay a bill"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/357856-358081.webm","at":3578.8,"dur":2.25}},{"term":"conduct an experiment","pos":"expression","definition":"To organize and carry out a scientific test or study to discover information.","time":3591.2,"lesson":"If you want a very formal word, we can say 'conducted.' For example, 'The university conducted an experiment.'","examples":[{"sentence":"The scientists conducted an experiment to test the new drug's effectiveness.","pattern":""},{"sentence":"The lab is currently conducting an experiment on plant growth.","pattern":"be + conducting + an experiment"},{"sentence":"They conducted several experiments before reaching a final conclusion.","pattern":"conduct + [number] + experiments"}],"more_examples":["The marketing team is conducting an experiment to see which ad performs better.","We need to conduct an experiment to determine the best temperature for the reaction.","The school plans to conduct an experiment involving student behavior and social media use."],"synonyms":["run an experiment","carry out an experiment","perform an experiment","undertake an experiment"],"antonyms":["halt an experiment","stop an experiment","cancel an experiment"],"gap":{"sentence":"Before the company launched the new app, the engineering team had to _____ to see how users would react to the interface.","answer":"conduct an experiment","options":["conduct an experiment","buy a product","clean a room","cook a meal"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/359658-359861.webm","at":3596.8,"dur":2.03}},{"term":"have zero clue","pos":"expression","definition":"to have no idea or no understanding about something at all.","time":3700.6,"lesson":"On the test day, you might have zero clue whether your spelling is incorrect. It is very important to learn how to avoid making simple typos.","examples":[{"sentence":"I have zero clue how to fix this software bug.","pattern":"have zero clue + how to + verb"},{"sentence":"Do you have zero clue why the meeting was canceled?","pattern":"interrogative: Do you have zero clue...?"},{"sentence":"I had zero clue that she was planning a surprise party.","pattern":"past tense: had zero clue"},{"sentence":"He looked at the complex math equation and had zero clue what it meant.","pattern":"have zero clue + [that] + clause"}],"more_examples":["I have zero clue where I left my car keys.","She had zero clue that the restaurant was closed on Mondays.","Do you have zero clue how much this renovation is going to cost?"],"synonyms":["have no idea","not have a clue","be clueless","be at a loss","be in the dark"],"antonyms":["know exactly","be fully aware","have a clear idea","understand perfectly"],"gap":{"sentence":"I've never tried to cook Thai food before, so I _____ how to make a proper curry.","answer":"have zero clue","options":["have zero clue","have great skill","have plenty of","have many"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/370294-370633.webm","at":3703.1,"dur":3.39}},{"term":"blood sugar level","pos":"noun phrase","definition":"The amount of glucose present in the bloodstream at a specific time.","time":3751.2,"lesson":"Researchers measured the blood sugar level and gave the participants sleep trackers.","examples":[{"sentence":"You should monitor your blood sugar level regularly if you have diabetes.","pattern":""},{"sentence":"A high blood sugar level can be caused by eating too many sugary snacks.","pattern":""},{"sentence":"The doctor asked me to check my blood sugar level before the next appointment.","pattern":""},{"sentence":"Exercise is a great way to keep your blood sugar level stable.","pattern":""}],"countable":[],"uncountable":[{"meaning":"The amount of glucose present in the bloodstream at a specific time.","example":"Researchers measured the blood sugar level and gave the participants sleep trackers.","lesson":true}],"more_examples":["The nurse checked my blood sugar level right after I finished the meal.","It is important to know how your blood sugar level reacts to different types of fruit.","If your blood sugar level drops too low, you might feel dizzy or faint."],"synonyms":["glucose level","blood glucose","blood glucose concentration"],"antonyms":[],"gap":{"sentence":"After eating that large bowl of pasta, I noticed my _____ was much higher than usual.","answer":"blood sugar level","options":["blood sugar level","oxygen supply","muscle mass","skin texture"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/375458-376032.webm","at":3754.7,"dur":5.74}},{"term":"possessive case","pos":"noun phrase","definition":"The grammatical form used to show ownership or belonging, often using an apostrophe and s.","time":3885.6,"lesson":"When you use an apostrophe and s, that is called the possessive case. It is a broad topic, but the general rules are as follows.","examples":[{"sentence":"In English, the possessive case is usually formed by adding an apostrophe and an 's' to a noun.","pattern":"use the possessive case"},{"sentence":"The teacher explained how to use the possessive case when talking about multiple owners.","pattern":"use the possessive case + when"},{"sentence":"You need to be careful with the possessive case when the name ends in 's'.","pattern":"careful with the possessive case"},{"sentence":"Is 'the dog's bone' an example of the possessive case?","pattern":"example of the possessive case"}],"countable":[{"meaning":"The grammatical form used to show ownership or belonging, often using an apostrophe and s.","example":"When you use an apostrophe and s, that is called the possessive case.","lesson":true}],"uncountable":[],"more_examples":["Does the possessive case change when the word is plural?","I'm confused about whether to use a possessive case or a contraction.","The textbook has a specific chapter dedicated to the possessive case."],"synonyms":["genitive case"],"antonyms":[],"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/388490-388830.webm","at":3885.1,"dur":3.4}},{"term":"clear up","pos":"phrasal verb","definition":"To make something easier to understand or to remove confusion from your mind.","time":4191.9,"lesson":"Gaita, has the approach to generating ideas cleared up in your head a little bit? I now understand how to do this.","examples":[{"sentence":"I need to clear up some confusion regarding the new project deadlines.","pattern":"clear up + noun (confusion/misunderstanding)"},{"sentence":"Could you clear that up for me? I'm still a bit confused.","pattern":"clear + something + up"},{"sentence":"The explanation helped clear up my doubts about the exam results.","pattern":"clear up + doubts/questions"},{"sentence":"Let's have a meeting to clear up any remaining issues.","pattern":"clear up + issues"}],"more_examples":["I'm sorry for the misunderstanding; let me clear up the situation.","Could you clear up the confusion regarding who is responsible for the booking?","I need to clear up a few points before we sign the contract."],"synonyms":["clarify","explain","straighten out","resolve","sort out","simplify"],"antonyms":[],"gap":{"sentence":"I was really confused by the complicated directions, so I asked the manager to _____ the situation.","answer":"clear up","options":["clear up","fill up","set up","keep up"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/420076-420397.webm","at":4200.9,"dur":3.21}},{"term":"given the fact that","pos":"expression","definition":"considering that a specific situation or piece of information is true.","time":4354.0,"lesson":"Usually, I recommend taking two classes per week. Given the fact that you have only one month before the test, you might consider taking three classes per week if you want to study very intensely.","examples":[{"sentence":"Given the fact that it is raining, we should probably stay inside.","pattern":"Given the fact that + clause"},{"sentence":"Given the fact that she is still learning, we should be patient with her.","pattern":"Given the fact that + subject + verb"},{"sentence":"He decided to buy the car, given the fact that it was on sale.","pattern":"comma + given the fact that"},{"sentence":"Given the fact that the deadline is tomorrow, we need to work quickly.","pattern":"Given the fact that + time expression"}],"more_examples":["Given the fact that we are on a tight budget, we should look for cheaper accommodations.","I don't think we can go hiking tomorrow, given the fact that the trail is closed for maintenance.","Given the fact that he has experience in marketing, he should be a good fit for the role."],"synonyms":["considering that","since","because","seeing as","in light of","taking into account that","as"],"antonyms":["despite","in spite of","regardless of","notwithstanding"],"gap":{"sentence":"They decided to hire a professional photographer, _____ the wedding was a very important event.","answer":"given the fact that","options":["given the fact that","despite the fact that","even though","although"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/435340-435761.webm","at":4353.6,"dur":4.21}}],"dialogues":[{"title":"Coffee preferences and life in Moscow","lines":[{"speaker":"A","text":"Hi there! You're in a very interesting place. Are you outside?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/005642-006965.webm","at":56.6,"dur":13.23}]},{"speaker":"B","text":"Yes, I'm at Serf Coffee. It's a beautiful coffee shop near my house with a pretty good Wi-Fi connection.","highlights":["pretty good"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/007986-009496.webm","at":80.1,"dur":15.1}]},{"speaker":"A","text":"I can hear you quite well. Where do you live exactly?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/009998-010506.webm","at":100.2,"dur":5.08}]},{"speaker":"B","text":"I live in the Khoroshovo district in Moscow. It's a very nice, quiet area.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/011634-012317.webm","at":116.5,"dur":6.83}]},{"speaker":"A","text":"Do you like coffee? Is Serf your favorite spot? I think mine is Kuratov.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/013194-014472.webm","at":132.1,"dur":12.78}]},{"speaker":"B","text":"I usually drink cappuccino in the morning because I need milk. In the afternoon, I prefer an Americano for the energy boost.","highlights":["energy boost"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/016536-018070.webm","at":165.5,"dur":15.34}]},{"speaker":"A","text":"I used to love filtered coffee, but I've stopped drinking it because it's so addictive.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/023392-024473.webm","at":234.1,"dur":10.81}]},{"speaker":"B","text":"I realized I couldn't function without that caffeine boost, so I decided to quit.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/025330-025785.webm","at":253.5,"dur":4.55},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/026500-027483.webm","at":265.2,"dur":9.83}]},{"speaker":"A","text":"Are you working or studying? I'm taking a gap year because I was exhausted from my medical studies.","highlights":["gap year"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/028556-030119.webm","at":285.7,"dur":15.63}]},{"speaker":"B","text":"I've heard that being a doctor is insane because you have to work night shifts and have no days off.","highlights":["night shifts"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/034384-035875.webm","at":344.0,"dur":14.91}]},{"speaker":"A","text":"That's true, you have no free time. What about your job at the restaurant? What is your position?","highlights":["free time"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/036256-037204.webm","at":362.7,"dur":9.48},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/038602-039128.webm","at":386.1,"dur":5.26}]},{"speaker":"B","text":"I'm a waiter. It's a hard job, but I enjoy it because my team is very polite and it gives me energy.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/040198-041552.webm","at":402.1,"dur":13.54}]}],"time":31.9,"topic":0},{"title":"Dining in Moscow and IELTS preparation","lines":[{"speaker":"A","text":"So, there's this really popular place in Moscow called Salone. It's a pasta and butter bar.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/043338-043867.webm","at":433.6,"dur":5.29}]},{"speaker":"B","text":"Oh, I found the one in St. Petersburg on the Fontanka River. It's the first restaurant in that group.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/046440-046805.webm","at":464.6,"dur":3.65}]},{"speaker":"A","text":"The Moscow location has two floors and is beautiful. Interestingly, the chef is Russian, Andrey Polishev.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/047716-048147.webm","at":477.4,"dur":4.31},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/048906-049366.webm","at":489.3,"dur":4.6}]},{"speaker":"B","text":"I know him! He works at Probka. They just opened a new spot on Malenikitskaya since Full Moon closed.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/049504-050716.webm","at":495.2,"dur":12.12}]},{"speaker":"A","text":"It's a shame about Full Moon, but I guess a big fish eats a small fish. Anyway, are you ready to take the test?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/054116-055445.webm","at":541.3,"dur":13.29},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/055592-055911.webm","at":556.1,"dur":3.19}]},{"speaker":"B","text":"My plan is to go to Turkey in late October to rest with my mom. I'll take the test then just to get a feel for the exam structure.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/056450-056880.webm","at":564.7,"dur":4.3},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/058080-058403.webm","at":580.9,"dur":3.23}]},{"speaker":"A","text":"And then you'll try again in January? Are you planning to study for a master's degree?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/058403-058914.webm","at":584.2,"dur":5.11},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/061014-061925.webm","at":610.3,"dur":9.11}]},{"speaker":"B","text":"Actually, I want to do a bachelor's degree in Austria or Italy. I have the two years of education they require.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/063640-064475.webm","at":636.5,"dur":8.35}]},{"speaker":"A","text":"You've done some mock tests, but have you ever sat a full one?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/064768-065821.webm","at":647.9,"dur":10.53}]},{"speaker":"B","text":"I've done sections like listening and reading. I used ChatGPT to check my writing, but never a full test.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/066487-067769.webm","at":665.0,"dur":12.82}]},{"speaker":"A","text":"Using ChatGPT for writing isn't ideal because it's not optimized for the specific criteria. Let's go over the sections.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/067906-069054.webm","at":679.3,"dur":11.48}]},{"speaker":"B","text":"I usually score between 6.5 and 7 in listening. I listen to a lot of podcasts, so it's not too hard for me.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/071344-072234.webm","at":713.6,"dur":8.9}]},{"speaker":"A","text":"What's the toughest part? Is it the speed or missing key words?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/072268-072655.webm","at":722.9,"dur":3.87},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/073854-074565.webm","at":738.7,"dur":7.11}]},{"speaker":"B","text":"I struggle with academic vocabulary. I can get the general idea, but I miss specific words.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/080086-080938.webm","at":801.1,"dur":8.52}]},{"speaker":"A","text":"If you're struggling with academic words, you'll likely have more trouble with the fourth part than the second.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/081494-081941.webm","at":815.1,"dur":4.47}]}],"time":433.6,"topic":1},{"title":"IELTS Preparation and Writing Practice","lines":[{"speaker":"A","text":"I'm struggling with the second and fourth parts of the listening section, even though I practiced three weeks ago.","highlights":["struggling with"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/082030-082814.webm","at":820.5,"dur":7.84}]},{"speaker":"B","text":"Academic reading is mostly about vocabulary. Do you find it challenging?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/083626-084761.webm","at":836.5,"dur":11.35}]},{"speaker":"A","text":"I understand the general idea, but I struggle to identify the correct answers. Some topics, like engineering, are just too complicated.","highlights":["general idea"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/085980-086833.webm","at":859.9,"dur":8.53},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/090178-090991.webm","at":901.9,"dur":8.13}]},{"speaker":"B","text":"I want to see your potential. You're around a 6.5 right now. When did you last do a full practice test?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/091530-092515.webm","at":915.5,"dur":9.85},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/092718-093151.webm","at":927.4,"dur":4.33}]},{"speaker":"A","text":"I did them separately about a week ago because I had too much work in September.","highlights":["too much work"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/093240-094587.webm","at":932.6,"dur":13.47}]},{"speaker":"B","text":"You should do a full reading section again. Some parts aren't matching up for you.","highlights":["matching up"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/096482-097906.webm","at":964.9,"dur":14.24}]},{"speaker":"A","text":"Writing Task 1 is clear, but Task 2 is hard because I need a wider vocabulary and more synonyms to express my opinion.","highlights":["wider vocabulary"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/100324-101865.webm","at":1003.4,"dur":15.41}]},{"speaker":"B","text":"That's what we'll focus on today. Task 2 is tough because of a lack of ideas, limited lexical resources, and spelling issues.","highlights":["lack of ideas"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/102926-104673.webm","at":1029.5,"dur":17.47}]},{"speaker":"A","text":"I'm calling from my phone because I don't have my laptop with me today.","highlights":["calling from"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/106668-107837.webm","at":1066.8,"dur":11.69}]},{"speaker":"B","text":"I'll set up a Google Doc. Since you're on your phone, it might take a few extra steps to access it.","highlights":["extra steps"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/109132-110659.webm","at":1091.4,"dur":15.27}]},{"speaker":"A","text":"I'm having trouble with the assignment. I chose the topic about the government controlling sugar consumption.","highlights":["having trouble"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/120402-120723.webm","at":1204.2,"dur":3.21},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/120934-122519.webm","at":1209.5,"dur":15.85}]}],"time":820.5,"topic":2},{"title":"Government responsibility vs individual choice in health","lines":[{"speaker":"A","text":"So, what's your take on this? Do you think the government should be responsible for public health?","highlights":["what's your take"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/130882-131099.webm","at":1309.0,"dur":2.17}]},{"speaker":"B","text":"I believe the government should take responsibility, but individuals also need to take control of their own nutrition and cut down on sugar.","highlights":["cut down on"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/131340-132942.webm","at":1313.5,"dur":16.02}]},{"speaker":"A","text":"So you're saying you agree with both sides? That's a good starting point for a discussion essay.","highlights":["starting point"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/134164-134585.webm","at":1341.8,"dur":4.21}]},{"speaker":"A","text":"This type of essay is challenging because you have to develop the opposing view just as strongly as your own.","highlights":["opposing view"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/136360-137915.webm","at":1363.8,"dur":15.55}]},{"speaker":"B","text":"Exactly. If I don't believe in God, I can argue my side easily, but I'd have to find reasonable ways to support the opposite view.","highlights":["reasonable ways"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/140882-142393.webm","at":1408.9,"dur":15.11}]},{"speaker":"A","text":"Right. So, why do you think government policy plays such a key role in our way of life?","highlights":["key role"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/143988-145709.webm","at":1440.0,"dur":17.21}]},{"speaker":"B","text":"Because government policies affect our lives directly. If they focus on healthy lifestyles, it can lead to fewer health problems.","highlights":["focus on"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/147348-148865.webm","at":1473.6,"dur":15.17}]},{"speaker":"A","text":"That's a good start, but the hardest part is providing a concrete example.","highlights":["concrete example"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/150308-151043.webm","at":1503.3,"dur":7.35}]},{"speaker":"B","text":"I heard a government implemented some sugar consumption restrictions, which I think had positive effects.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/157250-158366.webm","at":1572.6,"dur":11.16}]},{"speaker":"A","text":"That's a bit vague. Often, when governments restrict things, they end up making the situation worse.","highlights":["end up"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/161200-162658.webm","at":1612.1,"dur":14.58}]},{"speaker":"B","text":"Like with alcohol—people just make their own low-quality stuff and end up drinking just as much.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/163254-164580.webm","at":1632.7,"dur":13.26}]},{"speaker":"A","text":"So, what kind of measures should the government actually take?","highlights":["kind of measures"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/165242-166005.webm","at":1652.6,"dur":7.63}]}],"time":1309.0,"topic":3},{"title":"Using real-world examples in essays","lines":[{"speaker":"A","text":"I can use the Moscow longevity policy as an example of government intervention, specifically regarding nutrition and public health.","highlights":["government intervention"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/167010-168444.webm","at":1670.2,"dur":14.34}]},{"speaker":"B","text":"That would work well if the essay topic was about the government taking measures, like educating the public or controlling sugar content.","highlights":["taking measures"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/169800-171128.webm","at":1698.2,"dur":13.28}]},{"speaker":"A","text":"In the UK and other countries, the government raises taxes on regular Coca-Cola while keeping taxes lower for Diet Coke or Coke Zero.","highlights":["raises taxes"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/173692-175136.webm","at":1737.0,"dur":14.44}]},{"speaker":"B","text":"We can build on that. We don't need academic expertise to write a good essay; we can take a real fact and tweak it slightly to favor our argument.","highlights":["academic expertise"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/179446-180876.webm","at":1794.7,"dur":14.3}]},{"speaker":"A","text":"For instance, we could say that after this tax was introduced, sales of zero-sugar drinks went up, proving people are consuming less sugar.","highlights":["zero-sugar drinks"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/181820-183282.webm","at":1818.4,"dur":14.62}]},{"speaker":"B","text":"That's a great example. Many people make the mistake of throwing out random statistics without any basis, like claiming Germany banned sugar in 2016.","highlights":["make the mistake"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/186714-187418.webm","at":1867.3,"dur":7.04},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/188304-188922.webm","at":1883.1,"dur":6.18}]},{"speaker":"A","text":"Exactly. An examiner won't fact-check, but the claim is obviously false. We should always base our points on something that is actually true.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/191002-191515.webm","at":1910.2,"dur":5.13},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/192545-193082.webm","at":1925.6,"dur":5.37}]},{"speaker":"B","text":"Let's move to the idea of individual control. Can you give me an example for that?","highlights":["individual control"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/194128-194809.webm","at":1941.5,"dur":6.81},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/195232-195809.webm","at":1952.5,"dur":5.77}]},{"speaker":"A","text":"I can use a personal example. As a teenager, I used to eat a lot of sugar, but I stopped for a year and felt much better.","highlights":["personal example"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/200438-201824.webm","at":2004.6,"dur":13.86}]},{"speaker":"A","text":"I have more energy now and no addictions; I don't feel the need to eat chocolate every day.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/202068-202927.webm","at":2020.9,"dur":8.59}]}],"time":1670.2,"topic":3},{"title":"Scientific study on sugar reduction","lines":[{"speaker":"A","text":"I actually lost some weight and my mood improved every day after I cut back on sugar.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/202934-204327.webm","at":2029.5,"dur":13.93}]},{"speaker":"B","text":"That's a great start, but we need a representative sample. If we just use your experience, an opponent could say it's just an outlier.","highlights":["representative sample"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/205196-206648.webm","at":2052.2,"dur":14.52}]},{"speaker":"A","text":"I guess we could look at a larger group, like a university. For instance, a medical university could conduct research on 200 first-year students.","highlights":["conduct research"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/213518-214910.webm","at":2135.3,"dur":13.92}]},{"speaker":"B","text":"How would they convince those students to stop eating sugar? Maybe they used advertisements or offered incentives like better grades.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/216726-218053.webm","at":2167.5,"dur":13.27},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/220733-222423.webm","at":2207.5,"dur":16.9}]},{"speaker":"A","text":"Exactly. They would ask questions about their health and moods, then measure their weight and blood sugar levels over a month.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/225722-227128.webm","at":2257.3,"dur":14.06}]},{"speaker":"B","text":"Right, and those are objective measurements. For example, losing three pounds or a drop in blood sugar levels provides hard data.","highlights":["objective measurements"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/229862-231331.webm","at":2298.8,"dur":14.69}]},{"speaker":"A","text":"At the end of the experiment, the students would have felt healthier and less addicted to sugar. They might have even gotten better grades.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/233998-235586.webm","at":2340.1,"dur":15.88}]},{"speaker":"B","text":"To keep it objective, they could use sleep trackers to show they were sleeping better and had lower stress levels.","highlights":["sleep trackers"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/240200-240651.webm","at":2402.1,"dur":4.51},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/242270-243099.webm","at":2422.8,"dur":8.29}]}],"time":2029.5,"topic":4},{"title":"Refining a research idea and example","lines":[{"speaker":"A","text":"Even though this is a hypothetical example, I don't think it's impossible for a medical university to conduct this experiment.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/245232-246356.webm","at":2452.5,"dur":11.24}]},{"speaker":"B","text":"I'll write that down as our second idea. I need to summarize it in a nutshell first.","highlights":["in a nutshell"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/246518-247665.webm","at":2465.4,"dur":11.47}]},{"speaker":"A","text":"Should I put it in a Google Doc? I'll start with the core idea and worry about the explanation later.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/248530-248919.webm","at":2485.5,"dur":3.89},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/249466-250413.webm","at":2494.9,"dur":9.47}]},{"speaker":"B","text":"You need to state the idea clearly. For instance, we can say that individuals should take control over their own data.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/252579-253795.webm","at":2526.0,"dur":12.16}]},{"speaker":"A","text":"Right, like, individuals should take control over their data themselves, and it leads to positive effects.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/256814-257568.webm","at":2568.3,"dur":7.54}]},{"speaker":"B","text":"I like that. We can mention that people might not realize they feel better after abstaining from sugar for a while.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/258870-259581.webm","at":2588.9,"dur":7.11}]},{"speaker":"A","text":"I've written three sentences for the example. It covers the students' mood and energy levels.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/296114-296872.webm","at":2961.3,"dur":7.58},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/297458-297698.webm","at":2974.7,"dur":2.4}]},{"speaker":"B","text":"The concept is solid and makes the example convincing. However, we need to polish the vocabulary and grammar.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/297937-298957.webm","at":2979.5,"dur":10.2}]},{"speaker":"A","text":"I'm not sure what the best word is. Is it 'provides' or 'has'?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/306292-307438.webm","at":3063.1,"dur":11.46}]},{"speaker":"B","text":"'Causes effects' is redundant. You should use 'has positive effects' instead. Also, we need a definite article for a specific time.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/308426-308737.webm","at":3084.5,"dur":3.11},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/313834-314223.webm","at":3138.5,"dur":3.89}]}],"time":2452.5,"topic":4},{"title":"Prepositions with university and locations","lines":[{"speaker":"A","text":"\"In the nearest future\" sounds a bit more natural to me, but \"in the distant future\" works too.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/314680-315237.webm","at":3146.9,"dur":5.57}]},{"speaker":"B","text":"What's the difference between saying \"in university\" and \"at university\"?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/316864-317140.webm","at":3168.7,"dur":2.76}]},{"speaker":"A","text":"When you say \"at university,\" you're physically present and studying. It's like saying \"I'm at school.\"","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/323050-324373.webm","at":3230.7,"dur":13.23}]},{"speaker":"A","text":"Saying \"in university\" is more general. It means you are a student in general, not necessarily where you are right now.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/328490-329384.webm","at":3285.0,"dur":8.94}]},{"speaker":"B","text":"So, what's the difference between being \"at the coffee shop\" and \"in the coffee shop\"? That's a tricky question.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/334320-335372.webm","at":3343.3,"dur":10.52}]},{"speaker":"A","text":"People usually use \"at\" for locations like the beach or a cafe. It doesn't mean you're literally inside the building.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/337696-338647.webm","at":3377.1,"dur":9.51}]},{"speaker":"A","text":"\"In the university\" is very specific and much less common. It focuses on being inside the building.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/348280-348801.webm","at":3483.0,"dur":5.21}]},{"speaker":"B","text":"Is it a big mistake if I use the wrong one?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/351402-351623.webm","at":3514.1,"dur":2.21}]},{"speaker":"A","text":"It's a high-level concept, so it's not a huge mistake, but it is still a mistake. You should use \"at Sechenov University.\"","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/352394-352959.webm","at":3524.0,"dur":5.65}]},{"speaker":"B","text":"Do the words \"provide\" and \"experiment\" collocate?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/355606-356027.webm","at":3556.3,"dur":4.21}]}],"time":3146.9,"topic":5},{"title":"Grammar and usage for research papers","lines":[{"speaker":"A","text":"When we talk about experiments, we usually say 'do an experiment' or 'conduct an experiment.'","highlights":["conduct an experiment"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/358462-359431.webm","at":3584.8,"dur":9.69}]},{"speaker":"B","text":"Right. In this context, we can say the university conducted an experiment. Also, we should use 'an' when introducing a concept for the first time.","highlights":["for the first time"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/363558-364332.webm","at":3635.8,"dur":7.74}]},{"speaker":"A","text":"Exactly. And we should remove 'add here' because it's redundant. The phrasing about reducing sugar consumption is slightly odd, but it works.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/365892-366087.webm","at":3659.1,"dur":1.95},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/366350-367883.webm","at":3663.7,"dur":15.33}]},{"speaker":"B","text":"I see the mistake here. It's the kind of error where you notice it when someone points it out, but you'd have no clue during a test.","highlights":["no clue"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/369042-370633.webm","at":3690.5,"dur":15.91}]},{"speaker":"A","text":"We also need to fix 'sugar blood.' It should be 'blood sugar level.' And it's better to put a full stop here to start a new sentence.","highlights":["blood sugar level"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/376078-377617.webm","at":3760.9,"dur":15.39}]},{"speaker":"B","text":"This one is a high-level mistake. You have 'students' repeated twice here. It's not correct.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/380890-381673.webm","at":3809.1,"dur":7.83},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/382710-383298.webm","at":3827.3,"dur":5.88}]},{"speaker":"A","text":"We need to talk about possessives. When you use an apostrophe 's', that's the possessive case.","highlights":["possessive case"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/388112-388830.webm","at":3881.3,"dur":7.18}]},{"speaker":"B","text":"That's a big topic. Generally, determiners like 'my' or 'the' must belong to the main noun, like 'my brother's book.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/389060-390462.webm","at":3890.8,"dur":14.02}]},{"speaker":"A","text":"Right. If you just say 'brother's book' without a determiner, it's incorrect. You need to say 'the brother's book' or 'my brother's book.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/393334-394126.webm","at":3933.5,"dur":7.92}]},{"speaker":"B","text":"For plurals, it's different. If you have multiple brothers, it's 'my brothers' books.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/394924-396073.webm","at":3949.4,"dur":11.49},{"src":"lesson_audio/lesson_date_28-09-2026_time_16-12-34/396362-396565.webm","at":3963.8,"dur":2.03}]},{"speaker":"A","text":"And for names ending in 's', like Chris, you use
