<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;

ce"}],"more_examples":["Winning the championship really humbled the team after they had been so arrogant.","The harsh reality of the situation served to humble the young activist.","He was humbled by the sheer scale of the mountain he had to climb."],"synonyms":["bring down to earth","check","deflate","bring low"],"antonyms":["exalt","aggrandize","uplift"],"gap":{"sentence":"The team's crushing defeat in the final round served to _____ them after their arrogant behavior all season.","answer":"humble","options":["humble","encourage","reward","protect"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/006726-007308.webm","at":67.4,"dur":5.82}},{"term":"unnecessarily over-complicated","pos":"adjective phrase","definition":"made much more difficult or complex than it needs to be.","time":97.8,"lesson":"The text feels like it was written by a prince from a hundred years ago. It is so unnecessarily over-complicated.","examples":[{"sentence":"The instructions for assembling the chair are unnecessarily over-complicated.","pattern":"Subject + be + unnecessarily over-complicated"},{"sentence":"I think the company's new policy is unnecessarily over-complicated and confusing.","pattern":"Subject + be + unnecessarily over-complicated + and + [ad_j]"},{"sentence":"The plot of the movie was unnecessarily over-complicated by too many subplots.","pattern":"Subject + was + unnecessarily over-complicated + by + [noun]"}],"more_examples":["The software's user interface is unnecessarily over-complicated for a simple task like photo editing.","Why did you make the recipe unnecessarily over-complicated? We could have just boiled the pasta.","The legal contract was unnecessarily over-complicated with dense jargon that nobody could understand."],"synonyms":["overly complex","convoluted","overengineered","too complicated","excessively complex","over-elaborate"],"antonyms":["simple","straightforward","easy","uncomplicated","user-friendly","basic"],"gap":{"sentence":"The recipe for making a simple omelet was _____, requiring twenty different steps and several rare ingredients.","answer":"unnecessarily over-complicated","options":["unnecessarily over-complicated","straightforward","efficient","brief"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/009584-010383.webm","at":95.9,"dur":7.99}},{"term":"tendency","pos":"noun","definition":"A regular pattern or a way in which something is likely to happen or develop.","time":136.8,"lesson":"I found the reading part of the test on this website. I have noticed a tendency in recent years for the reading section to get harder while the listening section becomes easier.","examples":[{"sentence":"There is a tendency for prices to rise during the holiday season.","pattern":"There is a tendency for [noun] to [verb]"},{"sentence":"He has a tendency to interrupt people when they are speaking.","pattern":"have a tendency to [verb]"},{"sentence":"She has a tendency to overthink small problems.","pattern":"tendency to [verb]"}],"countable":[{"meaning":"A regular pattern or a way in which something is likely to happen or develop.","example":"I have noticed a tendency in recent years for the reading section to get harder while the listening section becomes easier.","lesson":true},{"meaning":"A physical inclination or a leaning toward a specific direction","example":"The sculpture has a slight tendency toward the left side."},{"meaning":"A specific political or social leaning","example":"The party has a tendency toward conservative policies."}],"uncountable":[],"more_examples":["The company has a tendency to hire interns during the summer.","In this region, there is a tendency for heavy rain in late August.","The stock market shows a tendency to fluctuate wildly before a crisis."],"synonyms":["inclination","propensity","leaning","proclivity","bent","predisposition"],"antonyms":[],"gap":{"sentence":"Because the weather is getting colder, there is a _____ for the leaves to change color and fal pose","pos":"verb","definition":"To put forward a plan, idea, or suggestion for consideration.","time":2332.2,"lesson":"You could say a scientist from Milan or a researcher from Milan. The word 'proposes' is used here, which is similar to 'made a proposal.'","examples":[{"sentence":"The committee proposes that we increase the budget for the next project.","pattern":"propose + that + subject + base verb"},{"sentence":"He proposed a new strategy to improve the company's marketing reach.","pattern":"propose + noun phrase"},{"sentence":"The government is proposing to build a new high-speed railway.","pattern":"propose + to + infinitive"},{"sentence":"She proposed the idea of working from home two days a week.","pattern":"propose + the idea of + -ing"}],"more_examples":["I propose that we take a break before starting the next chapter.","The architect proposed a design that incorporates more green spaces.","They proposed a motion to change the meeting time to 3 PM."],"synonyms":["suggest","submit","put forward","recommend","advocate","offer","advance","move","pitch"],"antonyms":["oppose","withdraw","dismiss","veto","block"],"gap":{"sentence":"Since the current office layout is very cramped, I will _____ a new floor plan to the manager tomorrow.","answer":"propose","options":["propose","demand","ignore","refuse"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/232814-233588.webm","at":2328.2,"dur":7.74}},{"term":"against all expectations","pos":"expression","definition":"happening in a way that is completely different from what people thought would happen.","time":2516.0,"lesson":"Which one is that? It is the third one: 'against all expectations.' Where does it say that? That was very hard; I spent so much time on it and wasn't sure of my answer.","examples":[{"sentence":"Against all expectations, the small startup became a billion-dollar company within two years.","pattern":"Against all expectations, [clause]"},{"sentence":"The team won the championship against all expectations, despite being underdogs.","pattern":""},{"sentence":"Against all expectations, the rain stopped just as the outdoor wedding ceremony began.","pattern":""},{"sentence":"He succeeded in his exams against all expectations.","pattern":"succeed [in something] against all expectations"}],"more_examples":["Against all expectations, the old man managed to run a full marathon.","The movie was a huge hit against all expectations, despite the poor reviews.","Against all expectations, the peaceful protest ended without any incidents."],"synonyms":["unexpectedly","contrary to expectations","contrary to predictions","surprisingly"],"antonyms":["as expected","predictably","according to plan","as anticipated"],"gap":{"sentence":"The marathon runner finished the race _____, even though he had tripped and fallen in the first mile.","answer":"against all expectations","options":["against all expectations","by common sense","for the sake of","on purpose"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/251580-251969.webm","at":2516.0,"dur":3.89}},{"term":"in direct proportion to","pos":"expression","definition":"Increasing or decreasing at the same rate as something else.","time":2605.8,"lesson":"The Netherlands is seeing a drop in crime decreasing in direct proportion to the closure of prisons.","examples":[{"sentence":"The cost of the project increased in direct proportion to the amount of materials used.","pattern":"increased in direct proportion to [noun]"},{"sentence":"Your salary will rise in direct proportion to your level of responsibility.","pattern":"in direct proportion to [noun phrase]"},{"sentence":"The risk of infection is in direct proportion to the number of people in the room.","pattern":"is in direct proportion to [noun phrase]"}],"more_examples":["The amount of stress you feel is often in direct proportion to how much you procrastinate.","The company's profits grew in direct proportion to its expansion into new markets.","The amount of energy required is in direct proportion to the weight of the object being moved."],"synonyms":["in line with","commensurate with","correspondingly"],"antonyms":["inversely proportional to","disproportionately"],"gap":{"sentence":"The amount of stress you feel at work is often _____ the size of your workload.","answer":"in direct proportion to","options":["in direct proportion to","regardless of","opposite to","instead of"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/260592-260863.webm","at":2606.1,"dur":2.71}},{"term":"stumble upon","pos":"phrasal verb","definition":"To find something by chance or unexpectedly while doing something else.","time":2924.0,"lesson":"I was browsing through YouTube one day and stumbled upon a podcast where two young men discussed evolutionary psychology for two and a half hours.","examples":[{"sentence":"I stumbled upon an old photograph while I was cleaning out the attic.","pattern":"stumble upon + object"},{"sentence":"While browsing the bookstore, she stumbled upon a rare first edition.","pattern":""},{"sentence":"They stumbled upon the solution by accident during their experiment.","pattern":"stumble upon + noun phrase"},{"sentence":"I'm so glad I stumbled upon your blog; your advice is very helpful.","pattern":""}],"more_examples":["I was walking through the park and stumbled upon a hidden garden.","We stumbled upon a tiny café while wandering around the old town.","While researching for my project, I stumbled upon some fascinating statistics."],"synonyms":["come across","happen upon","find by chance","discover unexpectedly"],"antonyms":["look for","seek out","search for","deliberately find"],"gap":{"sentence":"I wasn't looking for a new job, but I _____ a great opening while browsing LinkedIn.","answer":"stumbled upon","options":["stumbled upon","avoided","hired","queried"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/292487-292789.webm","at":2925.0,"dur":3.02}},{"term":"here's the deal","pos":"expression","definition":"Used to introduce an explanation, a plan, or a specific arrangement.","time":3178.9,"lesson":"OK, here's the deal. You need to practice reading every day because it is your weakest area.","examples":[{"sentence":"Here's the deal: I'll drive you to the airport if you pay for the gas.","pattern":"Here's the deal: [clause]"},{"sentence":"I'm not sure if we can agree, but here's the deal I can offer.","pattern":"here's the deal (noun phrase)"},{"sentence":"Look, here's the deal. We need to finish this project by Friday.","pattern":"Look, here's the deal (introductory phrase)"},{"sentence":"So, here's the deal: you work for three months, and then we review your contract.","pattern":"here's the deal: [conditional arrangement]"}],"more_examples":["Here's the deal: I'll watch your dog this weekend if you cook me dinner.","I know you're upset, but here's the deal: we have to follow the rules.","Here's the deal: if we leave now, we can beat the traffic."],"synonyms":["the bottom line is","the situation is","this is the plan"],"antonyms":[],"gap":{"sentence":"I know you're busy, but _____: I'll handle the grocery shopping if you cook dinner tonight.","answer":"here's the deal","options":["here's the deal","there's the problem","that's the feeling","here's the memory"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/317884-318081.webm","at":3179.0,"dur":1.97}},{"term":"keep in mind","pos":"expression","definition":"to remember or consider a specific piece of information or a fact.","time":3239.6,"lesson":"Just keep in mind that there are a lot of hints in the exam. The examiners are supposed to have a very structural approach to the test.","examples":[{"sentence":"Please keep in mind that the deadline for the project is this Friday.","pattern":"keep in mind + that-clause"},{"sentence":"You should keep the safety rules in mind at all times.","pattern":"keep [something] in mind"},{"sentence":"Keep in mind that prices may change without notice.","pattern":""},{"sentence":"I'll keep that in mind for next time.","pattern":""}],"more_examples":["Keep in mind that the restaurant is closed on Mondays.","When you're planning the trip, keep in mind that the weather can be unpredictable.","You should keep in mind how much this decision will affect your long-term goals."],"synonyms":["bear in mind","remember","take into account","consider","note","don't forget","be aware","take into consideration"],"antonyms":["forget","ignore","disregard","overlook"],"gap":{"sentence":"When you are planning the hiking trip, please _____ that the weather in the mountains can change very quickly.","answer":"keep in mind","options":["keep in mind","look forward","take off","give up"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/324078-324465.webm","at":3241.0,"dur":3.87}},{"term":"antonyms","pos":"noun","definition":"Words that have opposite meanings to each other.","time":3298.1,"lesson":"Very often, the task uses antonyms. For example, if the word is 'defying' and the task is 'agreeing with,' you should say they are antonyms.","examples":[{"sentence":"The words 'hot' and 'cold' are common antonyms.","pattern":"common antonyms"},{"sentence":"In this vocabulary test, you need to identify the antonyms for each word.","pattern":"identify the antonyms"},{"sentence":"The student was asked to provide three antonyms for the word 'happy'.","pattern":"antonyms for [word]"},{"sentence":"Opposite words, or antonyms, can help clarify the meaning of a text.","pattern":"Opposite words, or antonyms"}],"countable":[{"meaning":"Words that have opposite meanings to each other.","example":"For example, if the word is 'defying' and the task is 'agreeing with,' you should say they are antonyms.","lesson":true},{"meaning":"Words that have opposite meanings to each other","example":"The word 'fast' has several antonyms, such as 'slow' and 'leisurely'."}],"uncountable":[],"more_examples":["Can you think of any antonyms for the word 'generous'?","The exercise asks you to match each verb with its correct antonym.","Learning antonyms is a great way to expand your descriptive vocabulary."],"synonyms":["opposites","contraries"],"antonyms":["synonyms","equivalents"],"gap":{"sentence":"To help the students understand the difference between 'fast' and 'slow', the teacher asked them to find several _____.","answer":"antonyms","options":["antonyms","pronouns","prepositions","conjunctions"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/329828-329983.webm","at":3298.5,"dur":1.55}},{"term":"do a decent job","pos":"expression","definition":"To perform a task successfully or to a satisfactory standard.","time":3318.9,"lesson":"Well, you are doing a decent job so far.","examples":[{"sentence":"You did a decent job on the presentation, but try to speak a bit louder next time.","pattern":"do a decent job + on + [noun]"},{"sentence":"I don't need perfection; I just need you to do a decent job with the repairs.","pattern":"do a decent job + with + [noun]"},{"sentence":"He's doing a decent job of managing the team despite the recent changes.","pattern":"do a decent job of + -ing"},{"sentence":"The new intern is doing a decent job so far.","pattern":"do a decent job so far"}],"more_examples":["I'm not looking for a masterpiece, I just need you to do a decent job on the landscaping.","She did a decent job of explaining the complex rules to the children.","If you can do a decent job of keeping the house clean, I won't mind the noise."],"synonyms":["do a good job","do a satisfactory job","do a reasonable job","do a fair job","do a solid job","get the job done","perform adequately"],"antonyms":["do a poor job","do a bad job","do a sloppy job","do a subpar job","mess up"],"gap":{"sentence":"I'm not looking for perfection, but I need you to _____ with the painting before the guests arrive.","answer":"do a decent job","options":["do a decent job","do a messy job","do a slow job","do a loud job"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/331820-332301.webm","at":3318.4,"dur":4.81}},{"term":"pull up","pos":"phrasal verb","definition":"To arrive at a place or come over to join a group.","time":3459.1,"lesson":"I'm having a crying session at my house tonight at 8 p.m. Please pull up.","examples":[{"sentence":"Feel free to pull up to my place whenever you're ready.","pattern":"pull up + to + [place]"},{"sentence":"If you can pull up by 7:00, we can grab a quick coffee.","pattern":"pull up + by + [time]"},{"sentence":"Just pull up and I'll let you in.","pattern":"pull up (as a standalone command)"},{"sentence":"They pulled up in the driveway and headed inside.","pattern":"pulled up + in + [location]"}],"more_examples":["Once you pull up at the restaurant, I'll come out to meet you.","You can pull up in the back parking lot to avoid the traffic.","Just pull up whenever you get here; the gate is unlocked."],"synonyms":["arrive","show up","turn up","stop by","come over","roll up"],"antonyms":["leave","depart","go away","head out"],"gap":{"sentence":"Since the restaurant was fully booked, we had to wait for a taxi to _____ before we could finally get a table.","answer":"pull up","options":["pull up","walk in","run over","sit down"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/346308-346503.webm","at":3463.3,"dur":1.95}},{"term":"touch grass","pos":"idiom","definition":"To spend time outdoors in nature to relax and disconnect from technology or intense work.","time":3507.5,"lesson":"I probably want to watch the sunset and touch some grass after three hours of English because I have been sitting at my desk since 1 p.m. If touching grass has this calming effect on you, then by all means do it.","examples":[{"sentence":"I've been staring at my computer screen all day; I really need to go outside and touch grass.","pattern":""},{"sentence":"You've been playing video games for ten hours straight—go touch some grass!","pattern":""},{"sentence":"After a long week of meetings, I find that touching grass helps me clear my head.","pattern":""},{"sentence":"He needs to touch grass and get some perspective on the situation.","pattern":""}],"more_examples":["You've been arguing with strangers on Twitter for hours; honestly, you need to touch grass.","I'm feeling so burnt out from this project that I just need to go outside and touch grass.","Whenever I feel overwhelmed by social media, I make a point to touch grass and go for a walk."],"synonyms":["get some fresh air","unplug","disconnect","get back to reality","ground yourself"],"antonyms":["stay plugged in","scroll endlessly","stay inside"],"gap":{"sentence":"You have been arguing with strangers on social media for hours; you really need to _____.","answer":"touch grass","options":["touch grass","check emails","write reports","post photos"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/350764-351284.webm","at":3507.7,"dur":5.2}},{"term":"by all means","pos":"expression","definition":"Used to give permission or to strongly encourage someone to do something.","time":3526.6,"lesson":"If touching grass has this calming effect on you, then by all means. Okay, I will do that.","examples":[{"sentence":"By all means, take my seat if you need to sit down.","pattern":"By all means + imperative"},{"sentence":"If you have any questions during the presentation, by all means, ask them.","pattern":"If..., by all means, [verb]"},{"sentence":"By all means, feel free to contact me if you need further assistance.","pattern":"By all means, feel free to"}],"more_examples":["By all means, join us for dinner if you have the time.","If you think the project needs more research, by all means, start looking into it.","By all means, tell me if you find any errors in the report."],"synonyms":["certainly","of course","absolutely","go ahead","please do"],"antonyms":["under no circumstances","don't bother","not at all"],"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/352830-353115.webm","at":3528.4,"dur":2.85}}],"dialogues":[{"title":"Discussing a difficult reading test","lines":[{"speaker":"A","text":"Can you hear and see me clearly? I'm a bit worried a script on my computer might freeze occasionally.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/000370-001119.webm","at":3.8,"dur":7.49},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/001346-002599.webm","at":13.7,"dur":12.53}]},{"speaker":"B","text":"That's fine, I'll let you know if it happens. So, what's up?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/002690-003206.webm","at":27.0,"dur":5.16}]},{"speaker":"B","text":"I have a question about this reading. It's so much harder than the ones we did when we started. Was it a trap?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/004112-005562.webm","at":41.3,"dur":14.5}]},{"speaker":"A","text":"I chose it completely randomly from the site. I didn't have any intention to humble you.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/011308-012085.webm","at":113.2,"dur":7.77}]},{"speaker":"B","text":"I'm so angry at myself for trying so hard. The text feels like it was written by a prince 100 years ago. It's unnecessarily overcomplicated.","highlights":["angry at myself"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/008280-009740.webm","at":82.9,"dur":14.6}]},{"speaker":"A","text":"I've noticed that in recent years, reading has gotten harder while listening has become easier. I think that's a good trend.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/014746-016007.webm","at":147.6,"dur":12.61}]},{"speaker":"A","text":"With listening, you don't get a second chance, especially with a complex map. With reading, you have the time to reread.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/016156-017700.webm","at":161.7,"dur":15.44}]},{"speaker":"B","text":"The texts were just so long. Usually, each part has a separate idea, but here I couldn't even tell what I just read.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/022640-024255.webm","at":226.5,"dur":16.15}]},{"speaker":"B","text":"Sometimes I'd read a sentence and couldn't even find the verb. I had to read it out loud several times because it was just too much.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/027040-028460.webm","at":270.5,"dur":14.2}]},{"speaker":"B","text":"My answers weren't bad. For example, I wrote 'undermined by,' but the answer required at least three words, so it was 'severely undermined by.'","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/028882-030344.webm","at":288.9,"dur":14.62}]},{"speaker":"B","text":"Then there was a question asking if something was 'moral' or 'philosophical.' I was just like, 'What the hell is this?'","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/033116-034664.webm","at":331.3,"dur":15.48},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/037814-039136.webm","at":378.3,"dur":13.22}]}],"time":3.6,"topic":0},{"title":"Analyzing reading difficulties and complex literature","lines":[{"speaker":"A","text":"I chose 'moral' because it sounds better as a collocation. You scored quite low on this test, and you spent a lot more time on it than you should have.","highlights":["sounds better"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/040954-042406.webm","at":409.6,"dur":14.52}]},{"speaker":"B","text":"I'm just saying that it was challenging for me. I think the test might be over-complicated, or it could just be an issue with my skills.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/043062-044524.webm","at":430.7,"dur":14.62}]},{"speaker":"A","text":"When you read, do you find it hard because of unknown words or structures? For example, did you simply not know what 'realm' means?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/045590-047365.webm","at":456.0,"dur":17.75}]},{"speaker":"B","text":"I can understand the text, but it takes so much more time. I even started reading 'Thinking, Fast and Slow' by Daniel Kahneman, which isn't an easy book at all.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/056038-057474.webm","at":560.5,"dur":14.36}]},{"speaker":"A","text":"Kahneman is a senior scholar at Princeton and won the Nobel Prize in economics in 2002. Your boss recommended it because it explains how we use System 1 and System 2 to make decisions.","highlights":["senior scholar"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/061640-063170.webm","at":616.5,"dur":15.3}]},{"speaker":"B","text":"It seemed really complicated to me at first, but I was doing my best. I also read 'Can't Hurt Me' by David Goggins, which tells his life story.","highlights":["doing my best"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/066808-068413.webm","at":668.2,"dur":16.05}]},{"speaker":"A","text":"I distinguish between fictional books, like George R.R. Martin's 'A Song of Ice and Fire', and academic literature. I think the Goggins book is more like a narrative story.","highlights":["distinguish between"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/070904-072617.webm","at":709.1,"dur":17.13}]},{"speaker":"B","text":"What I'm trying to say is that these readings were so complicated that they took so much time, and my brain was just giving up.","highlights":["giving up"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/073480-074912.webm","at":734.9,"dur":14.32}]}],"time":409.6,"topic":0},{"title":"Reading books vs. watching movies","lines":[{"speaker":"A","text":"I found it so hard to concentrate on those two books. How did you find them?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/075474-076154.webm","at":754.8,"dur":6.8}]},{"speaker":"B","text":"David Goggins was much easier for me. However, since moving to Bali and starting our lessons, 'Thinking, Fast and Slow' has become easier to get through.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/077074-078498.webm","at":770.8,"dur":14.24}]},{"speaker":"A","text":"I never finished the other one because it was too complicated. Honestly, reading isn't my hobby; I'd much rather watch movies or listen to podcasts.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/079190-080624.webm","at":792.0,"dur":14.34}]},{"speaker":"B","text":"I actually listened to audiobooks in Russia. When learning a language, you don't really need books to master speaking. Most of my English came from shows and podcasts.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/081708-082747.webm","at":817.2,"dur":10.39},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/082988-084092.webm","at":830.1,"dur":11.04}]},{"speaker":"A","text":"I used to love watching shows, but I started finding it boring because I knew most of the words. I felt I should start reading books about a year or two ago.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/084772-086236.webm","at":847.8,"dur":14.64}]},{"speaker":"B","text":"Reading is fundamentally different from watching movies. In films, you can just point at someone, but books have to describe everything, like the shape of someone's eyes or their hair.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/089960-091334.webm","at":899.7,"dur":13.74}]},{"speaker":"A","text":"So, the vocabulary in books is something you'll rarely encounter in real life. I saw a phrase about being 'simultaneously appalled and enthralled' and I had no idea what it meant.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/095372-096893.webm","at":953.8,"dur":15.21}]},{"speaker":"B","text":"Actually, 'appalled' is a good word for being shocked to the core. If you read enough, you'll see that phrase quite often in average books.","highlights":["shocked to the core"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/100774-102471.webm","at":1007.9,"dur":16.97}]},{"speaker":"A","text":"I would have struggled with that passage two years ago, but now I recognize it as a very common way to write.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/104140-105219.webm","at":1041.5,"dur":10.79}]}],"time":754.8,"topic":0},{"title":"Strategies for tackling difficult academic reading","lines":[{"speaker":"A","text":"I feel like the first paragraph is just nonsense. If I encountered something like that in a book, I'd just skip it until it gets interesting.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/106746-107880.webm","at":1067.6,"dur":11.34}]},{"speaker":"B","text":"Reading is hard even in your native language. When I was 12, I had a dictionary by my side because I'd have to look up new words on every page.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/110122-110572.webm","at":1101.3,"dur":4.5},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/111454-111816.webm","at":1114.6,"dur":3.62}]},{"speaker":"A","text":"If you can read any book easily, that actually means you are very competent in the language, potentially even above a native speaker level.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/113630-114735.webm","at":1136.4,"dur":11.05}]},{"speaker":"B","text":"The only way to tackle it is to read more. Combining academic reading with fiction is a good approach, especially with books like 'Thinking, Fast and Slow'.","highlights":["tackle it"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/115298-116424.webm","at":1153.1,"dur":11.26}]},{"speaker":"B","text":"Even though those authors write for ordinary people, they still use academic words and think in a very academic way. You have to get used to that style.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/119144-120075.webm","at":1191.5,"dur":9.31}]},{"speaker":"A","text":"I have only one month. I can't just develop the skill of someone who has been reading for years. I just don't like reading.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/129492-130884.webm","at":1295.0,"dur":13.92}]},{"speaker":"B","text":"The only thing you need to do is understand the main idea of a sentence. You actually did that even though you didn't know specific words like 'appalled' or 'unthrown'.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/131520-133087.webm","at":1315.3,"dur":15.67}]},{"speaker":"A","text":"For example, the word 'inquiries' in the first sentence—does that mean situations or things that happened?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/133882-135362.webm","at":1338.9,"dur":14.8}]},{"speaker":"B","text":"It sounds like 'encounters', but it's 'inquiries'. It's not very far from the truth. Now, can you tell me the idea of this first sentence in simple words?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/136358-137792.webm","at":1363.7,"dur":14.34}]}],"time":1067.6,"topic":1},{"title":"Analyzing Jack the Ripper text","lines":[{"speaker":"A","text":"I really hate this first sentence. It's just so ugly. 'Few murder inquiries have stirred the public imagination to such an extent as those relating to Jack the Ripper.'","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/139286-140636.webm","at":1393.1,"dur":13.5}]},{"speaker":"B","text":"Grammatically, it uses an inversion. In simple terms, it means the public was shocked and highly imaginative about these specific murder cases.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/143704-145282.webm","at":1437.1,"dur":15.78}]},{"speaker":"A","text":"When you say 'few murder inquiries,' does that mean there weren't many cases in the 19th century in general?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/147356-148403.webm","at":1473.7,"dur":10.47}]},{"speaker":"B","text":"I'm not sure. These tasks often try to make you think literally. If it says 'few murder inquiries,' they might want you to decide if that's true or not given.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/149210-150724.webm","at":1492.2,"dur":15.14}]},{"speaker":"A","text":"Maybe there were many cases, but only a few were associated with Jack the Ripper specifically. I'm not sure.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/153842-155296.webm","at":1538.5,"dur":14.54}]},{"speaker":"B","text":"Exactly. The sentence means people were shocked by this case more than almost any other.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/155602-157143.webm","at":1556.1,"dur":15.41}]},{"speaker":"A","text":"Now the second sentence: 'The murder is worthy of a depraved savage.' And it mentions the 19th century coming to a close. Was that around 1898?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/158022-159487.webm","at":1580.4,"dur":14.65}]},{"speaker":"B","text":"Yes, 1898. You scared the life out of me with that phrasing! 'Depraved savage' sounds so intense. I spent 50 minutes on the first part and then hit this.","highlights":["scared the life out of me"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/165978-167372.webm","at":1659.9,"dur":13.94}]},{"speaker":"A","text":"It's okay to be emotional. 'Depraved' means something is corrupted or affected in a bad way, and 'savage' usually refers to someone rude or violent.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/168570-170140.webm","at":1685.8,"dur":15.7}]},{"speaker":"B","text":"Together, 'worthy of a depraved savage' sounds like a stylistic way of describing a perverted person or an unthinkable level of violence.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/173350-174668.webm","at":1733.7,"dur":13.18}]},{"speaker":"A","text":"To be honest, I'm not 100% sure what it means, but my guess about a perverted person seems accurate. However, none of my guesses actually matter here.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/175248-176684.webm","at":1752.6,"dur":14.36}]}],"time":1383.4,"topic":3},{"title":"Analyzing reading comprehension and vocabulary","lines":[{"speaker":"A","text":"You can technically ignore some parts even if you don't fully understand them, but they still get in the way of your flow.","highlights":["get in the way"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/179998-180884.webm","at":1800.1,"dur":8.86}]},{"speaker":"A","text":"I feel like those phrases are just useless; they don't add new facts, they just carry an emotional charge.","highlights":["emotional charge"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/184774-185434.webm","at":1847.8,"dur":6.6}]},{"speaker":"B","text":"When I finished reading the text, I was relieved to finally know why they couldn't catch Jack the Ripper.","highlights":["finally know"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/185690-186554.webm","at":1857.0,"dur":8.64}]},{"speaker":"A","text":"Words like 'appalled' and 'unthrown' are meaningful because they describe the emotions people felt. What was your guess for those words?","highlights":["describe the emotions"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/187622-188534.webm","at":1876.3,"dur":9.12}]},{"speaker":"B","text":"I figured everyone was just terrified. The words don't add new meaning; they just convey very negative emotions.","highlights":["convey very negative emotions"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/190110-191059.webm","at":1901.2,"dur":9.49}]},{"speaker":"A","text":"I got a 5.1 on this reading, which feels unfair. We shouldn't judge your English based on just two readings.","highlights":["judge your English"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/194744-195694.webm","at":1947.5,"dur":9.5},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/196778-197157.webm","at":1967.9,"dur":3.79}]},{"speaker":"B","text":"I agree. You should stop scoring yourself and try to read these passages in a very relaxed manner, like a book you'd read for fun.","highlights":["relaxed manner"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/198390-199917.webm","at":1984.0,"dur":15.27}]},{"speaker":"A","text":"I don't mind unknown words, but if there are three in one sentence, I lose the meaning of the whole thing.","highlights":["lose the meaning"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/204020-204352.webm","at":2040.3,"dur":3.32},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/205368-205682.webm","at":2053.8,"dur":3.14}]},{"speaker":"B","text":"I struggled with the word 'incarcerated' in the first part, but I eventually understood it.","highlights":["struggled with"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/206652-208241.webm","at":2066.6,"dur":15.89}]}],"time":1800.1,"topic":4},{"title":"IELTS Reading Strategies and Vocabulary","lines":[{"speaker":"A","text":"I tried to guess the meaning of the word because the rest of the text wasn't too hard. Since it sounds like 'car' in Spanish, which means prison, I figured it had a Latin origin.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/211184-212406.webm","at":2111.9,"dur":12.22}]},{"speaker":"B","text":"Your Spanish background can definitely help you a lot with that. I understand your point about not putting pressure on yourself to look up every single word.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/212790-214222.webm","at":2128.1,"dur":14.32}]},{"speaker":"A","text":"Exactly. A lot of sentences don't need to be analyzed that thoroughly. Sometimes it's just okay to move on.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/215248-216581.webm","at":2152.6,"dur":13.33}]},{"speaker":"B","text":"I have a question about the reading section. What's the best plan? Should I read the whole text first or start with the questions?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/217618-219078.webm","at":2176.3,"dur":14.6}]},{"speaker":"A","text":"Part one is the easiest, part two is in the middle, and part three is intentionally very difficult. If you struggle with the very first sentence of part three, that's a sign of its difficulty.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/220262-221684.webm","at":2202.7,"dur":14.22}]},{"speaker":"B","text":"So they are trying to separate students of different levels? If someone only needs a 6.0, they might not even spend time on part three.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/223230-224620.webm","at":2232.4,"dur":13.9}]},{"speaker":"A","text":"Right. Part one should take about ten minutes, part two around 20 minutes, and part three should take about half of your time, which is 30 minutes.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/225830-227386.webm","at":2258.4,"dur":15.56}]},{"speaker":"B","text":"I see. True/False and 'gap-fill' tasks are by far the most difficult. You really need to understand the logic behind them.","highlights":["by far"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/227400-229275.webm","at":2274.1,"dur":18.75}]},{"speaker":"A","text":"In my opinion, 'complete the sentence' tasks are one of the easiest because the words are usually right there in the text.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/229292-230856.webm","at":2293.0,"dur":15.64}]},{"speaker":"B","text":"I felt like my intuition was helping me out on the first reading. I thought I could just find the answers in the text easily, but then it wasn't that simple.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/236096-237664.webm","at":2361.1,"dur":15.68}]},{"speaker":"A","text":"For example, in the first sentence of part one, you need to use 'rehabilitation'. If you put that in, the sentence makes perfect sense.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/239604-240831.webm","at":2396.2,"dur":12.27},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/247194-248614.webm","at":2472.1,"dur":14.2}]}],"time":2111.9,"topic":5},{"title":"Grammar practice and reading habits","lines":[{"speaker":"A","text":"Basically, you just need to look for a mention of a person or a group of people in the text.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/248845-249588.webm","at":2488.6,"dur":7.43}]},{"speaker":"B","text":"How did you miss the phrase 'against all expectations' in the third question? That was really tough.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/250144-250907.webm","at":2501.6,"dur":7.63},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/251580-251969.webm","at":2516.0,"dur":3.89}]},{"speaker":"A","text":"I spent so much time on it and wasn't sure of the answer. The sentence says the Netherlands saw a drop in crime as prisons closed.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/253280-254232.webm","at":2532.9,"dur":9.52}]},{"speaker":"B","text":"Exactly, because the Netherlands stopped imprisoning people so much. We can see the drop in crime is in direct proportion to the prison closures.","highlights":["in direct proportion to"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/257874-259240.webm","at":2578.8,"dur":13.66},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/260592-260863.webm","at":2606.1,"dur":2.71}]},{"speaker":"A","text":"The synonym for 'against' here is 'defying'. Now, try to complete number four. I swear, it's impossible without looking at the answer.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/261568-261807.webm","at":2615.9,"dur":2.39},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/262114-263106.webm","at":2621.3,"dur":9.92}]},{"speaker":"B","text":"I agree. Even a native speaker might struggle with this. I'm meeting a British girl on Wednesday and I'll show her this text to see if she can do it.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/270224-271721.webm","at":2702.4,"dur":14.97}]},{"speaker":"A","text":"I've always hated reading Russian literature. I was a good student, but reading just isn't my thing.","highlights":["isn't my thing"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/273304-274777.webm","at":2733.1,"dur":14.73}]},{"speaker":"B","text":"My advice is to find something you're actually interested in. You can grab a self-help book on productivity, but many won't be interesting.","highlights":["grab a"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/276310-277391.webm","at":2763.3,"dur":10.81},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/277538-278172.webm","at":2775.6,"dur":6.34}]},{"speaker":"A","text":"I couldn't find anything that piqued my curiosity until I found a book about marketing and psychological tricks called 'Influence'.","highlights":["piqued my curiosity"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/279960-281629.webm","at":2799.8,"dur":16.69}]},{"speaker":"B","text":"Oh, I think I know it. It's by Robert Cialdini, 'The Psychology of Influence'. It's very relevant even today.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/285796-286218.webm","at":2858.1,"dur":4.22},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/287740-289202.webm","at":2877.6,"dur":14.62}]}],"time":2488.6,"topic":6},{"title":"Evolutionary Psychology and IELTS Reading Strategies","lines":[{"speaker":"A","text":"You know, I'm really into the scientific side of things. I actually stumbled upon a podcast where two guys spent over two hours discussing evolutionary psychology.","highlights":["stumbled upon"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/292206-293355.webm","at":2922.2,"dur":11.49}]},{"speaker":"B","text":"Oh, interesting! What kind of topics did they cover?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/293669-294514.webm","at":2936.8,"dur":8.45}]},{"speaker":"A","text":"They talked about why the dating market feels empty today and even analyzed men's height. Surprisingly, being extremely tall isn't always a plus.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/294066-294745.webm","at":2940.8,"dur":6.79},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/295234-295608.webm","at":2952.5,"dur":3.74}]},{"speaker":"B","text":"That's fascinating. So, what is the preferred height according to their research?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/295616-295907.webm","at":2956.4,"dur":2.91}]},{"speaker":"A","text":"The data shows that being above average is attractive, but once you hit around 190 cm, the curve starts to drop because it's just too much.","highlights":["above average"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/297156-297806.webm","at":2971.7,"dur":6.5},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/301558-302111.webm","at":3015.8,"dur":5.53}]},{"speaker":"B","text":"I see. Did they discuss anything about the modern dating scene, like why many independent women are struggling to find a mate?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/304928-306013.webm","at":3049.5,"dur":10.85}]},{"speaker":"A","text":"Exactly. They explained that many successful women find it hard to match status with men, while many wealthy men prefer younger partners.","highlights":["match status"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/306880-308369.webm","at":3068.9,"dur":14.89}]},{"speaker":"B","text":"That sounds like a complex topic. Was it difficult to follow because of the academic language they used?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/313480-314942.webm","at":3135.0,"dur":14.62}]},{"speaker":"A","text":"It was! I didn't even realize I was pausing every few minutes to look up words. Honestly, I think reading is the area where I can improve the most.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/312362-313048.webm","at":3123.8,"dur":6.86},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/318748-319335.webm","at":3187.6,"dur":5.87}]},{"speaker":"B","text":"You're right. If you put in the same effort as you do for writing, you could easily increase your reading score by two points.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/321348-322591.webm","at":3213.7,"dur":12.43}]},{"speaker":"A","text":"I just need to get used to the structure of the test and realize that the answers are often just rephrased versions of the text.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/325434-326404.webm","at":3254.4,"dur":9.7}]}],"time":2922.2,"topic":7},{"title":"Reading strategies and homework humor","lines":[{"speaker":"A","text":"Your reading comprehension will improve over time. Often, the answer is a synonym or even an antonym of the word in the task.","highlights":["over time"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/328024-329257.webm","at":3280.3,"dur":12.33},{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/329542-329983.webm","at":3295.6,"dur":4.41}]},{"speaker":"B","text":"I honestly feel like I could do a lot better. I'm going to send you a meme right now.","highlights":["do a lot better"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_14-10-44/332304-332968.webm
