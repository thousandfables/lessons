is not immediately obvious.","time":296.8,"lesson":"My answers were actually not that bad. For example, I wrote 'undermined by' when the expected answer was 'severely undermined by.'","examples":[{"sentence":"The team's confidence was undermined by the repeated losses.","pattern":"subject + be + undermined by + noun"},{"sentence":"His authority was undermined by his constant hesitation during the meeting.","pattern":"subject + be + undermined by + gerund phrase"},{"sentence":"The project's success was severely undermined by a lack of funding.","pattern":"severely undermined by"},{"sentence":"Don't let your progress be undermined by small distractions.","pattern":"let + object + be undermined by"}],"more_examples":["The peace treaty was undermined by secret negotiations between the two sides.","Her credibility was undermined by the fact that she hadn't told the truth.","The structural integrity of the bridge was undermined by years of neglect."],"synonyms":["weakened by","eroded by","compromised by","damaged by","subverted by","eaten away by","undercut by"],"antonyms":["strengthened by","bolstered by","reinforced by","supported by","solidified by","buttressed by"],"gap":{"sentence":"The company's reputation was _____ a series of small, hidden leaks of private information.","answer":"undermined by","options":["undermined by","improved by","protected by","supported by"]}},{"term":"moral","pos":"adjective","definition":"relating to the principles of right and wrong behavior.","time":332.0,"lesson":"For example, I just said 'moral' as my answer, but the correct answer was 'moral or philosophical.' I was quite confused by that word.","examples":[{"sentence":"The company faced a moral dilemma when they discovered the safety flaw.","pattern":"moral + dilemma"},{"sentence":"Is it morally wrong to lie to protect someone's feelings?","pattern":"adverb form: morally + adjective"},{"sentence":"She is a person of high moral character.","pattern":"moral + character"},{"sentence":"The debate focused on the moral implications of the new law.","pattern":"moral + implications"}],"more_examples":["The soldiers were praised for their moral courage during the conflict.","The documentary explores the moral complexities of artificial intelligence.","He felt a moral obligation to donate his inheritance to charity."],"synonyms":["ethical","virtuous","principled","righteous","conscientious"],"antonyms":["immoral","unethical","corrupt","dishonest","wicked"],"gap":{"sentence":"The manager decided to resign because he felt that the company's actions were _____ wrong.","answer":"morally","options":["morally","physically","biologically","geographically"]}},{"term":"philosophical","pos":"adjective","definition":"relating to the study of the fundamental nature of knowledge, reality, and existence.","time":409.9,"lesson":"I usually use a collocation with 'moral' because it sounds better. I chose 'moral' because 'philosophical' sounds bad in this context.","examples":[{"sentence":"The professor gave a philosophical lecture on the meaning of life.","pattern":"give a philosophical lecture"},{"sentence":"She has a very philosophical approach to dealing with unexpected problems.","pattern":"have a philosophical approach"},{"sentence":"It is a philosophical question that doesn't have a simple answer.","pattern":"philosophical question"},{"sentence":"He tried to remain philosophical despite the disappointing news.","pattern":"remain philosophical"}],"more_examples":["The documentary explores the philosophical implications of artificial intelligence.","They spent the evening in a deep philosophical debate about free will.","The novel is less about the plot and more about philosophical themes."],"synonyms":["metaphysical","theoretical","conceptual","abstract","intellectual","analytical"],"antonyms":["practical","concrete","empirical"],"gap":{"sentence":"Instead of getting angry about the broken vase, he took a _____ view on the fleeting nature of material possessions.","answer":"philosophical","options":["philosophical","practical","technical","aggressive"]}},{"term":"realm","pos":"noun","definition":"A field, area, or domain of activity, interest, or knowledge.","time":474.2,"lesson":"Can you say that was the case with the word 'realm'? You simply didn't know what 'realm' meant.","examples":[{"sentence":"The scientist is an expert in the realm of quantum physics.","pattern":"in the realm of"},{"sentence":"This topic falls outside my realm of expertise.","pattern":"realm of expertise"},{"sentence":"The company is expanding into the realm of artificial intelligence.","pattern":"expanding into the realm of"},{"sentence":"In the realm of fantasy fiction, dragons are common creatures.","pattern":""}],"countable":[{"meaning":"A field, area, or domain of activity, interest, or knowledge.","example":"Can you say that was the case with the word 'realm'?","lesson":true},{"meaning":"A kingdom or a kingdom's territory","example":"The king ruled over a vast realm for many years."},{"meaning":"A physical area or territory","example":"The explorers traveled into the unknown realm of the deep jungle."}],"uncountable":[],"more_examples":["She has always been fascinated by the realm of marine biology.","The app allows users to explore the realm of digital photography."],"synonyms":["field","domain","sphere","area","sector","province","scope"],"antonyms":[],"gap":{"sentence":"The chef has spent his entire life mastering the _____ of pastry making, creating hundreds of unique recipes.","answer":"realm","options":["realm","color","weight","shape"]}},{"term":"depraved","pos":"adjective","definition":"morally corrupt, wicked, or showing a lack of moral principles.","time":533.9,"lesson":"Few murder inquiries have stirred the public imagination as much as those relating to Jack the Ripper. The reports of his depraved and savage actions simultaneously appalled and enthralled the Victorian public.","examples":[{"sentence":"The dictator was known for his depraved treatment of political prisoners.","pattern":""},{"sentence":"Some people find the movie's depiction of depraved behavior quite disturbing.","pattern":""},{"sentence":"He was accused of committing a depraved act of violence.","pattern":""},{"sentence":"The novel explores the depraved minds of serial killers.","pattern":"depraved + noun (collocation)"}],"more_examples":["The underground club was notorious for its depraved atmosphere and illicit activities.","The philosopher argued that the pursuit of pleasure without any moral restraint leads to a depraved society.","She was shocked by the depraved lyrics of the new underground rap song."],"synonyms":["corrupt","wicked","degenerate","vile","immoral","base","debased","perverted","shameless"],"antonyms":["virtuous","moral","righteous","pure","ethical","upright","noble","wholesome"],"gap":{"sentence":"The community was shocked by the _____ actions of the man who stole money from the local orphanage.","answer":"depraved","options":["depraved","generous","helpful","honest"]}},{"term":"unprecedented","pos":"adjective","definition":"Never having happened or existed before; completely new and unusual.","time":554.3,"lesson":"The unleashing of a serial killer onto the London scene caught the police unprepared, as did the unprecedented brutality of the killings. These acts earned their perpetrators the nickname Jack the Ripper.","examples":[{"sentence":"The company saw unprecedented growth in the final quarter of the year.","pattern":"unprecedented + noun"},{"sentence":"The scale of the disaster was unprecedented in the country's history.","pattern":"The scale of... was unprecedented"},{"sentence":"The government is facing an unprecedented crisis regarding the economy.","pattern":"face an unprecedented [problem]"},{"sentence":"The sheer speed of the technological change is unprecedented.","pattern":"subject + is unprecedented"}],"more_examples":["The heavy rainfall caused unprecedented flooding in the downtown area.","The athlete's performance was an unprecedented feat of endurance.","The move toward remote work has led to an unprecedented shift in office culture."],"synonyms":["unparalleled","unmatched","groundbreaking","unexampled","singular","new"],"antonyms":["common","usual","normal","traditional","standard","routine","expected"],"gap":{"sentence":"The city experienced an _____ amount of snowfall this winter, breaking all previous records for the region.","answer":"unprecedented","options":["unprecedented","expected","minimal","common"]}},{"term":"senior scholar","pos":"noun phrase","definition":"A high-ranking academic researcher or professor with extensive experience and expertise in a field.","time":616.0,"lesson":"The book is not easy at all. It was written by a senior scholar at Princeton University who was awarded the Nobel Prize in Economics in 2002.","examples":[{"sentence":"The university invited a senior scholar to deliver the keynote speech at the conference.","pattern":""},{"sentence":"She is a senior scholar specializing in medieval literature.","pattern":"senior scholar + specializing in"},{"sentence":"The research was supervised by a senior scholar in the department.","pattern":""},{"sentence":"As a senior scholar, he has published over fifty peer-reviewed papers.","pattern":""}],"countable":[{"meaning":"A high-ranking academic researcher or professor with extensive experience and expertise in a field.","example":"It was written by a senior scholar at Princeton University who was awarded the Nobel Prize in Economics in 2002.","lesson":true}],"uncountable":[],"more_examples":["The grant was awarded to a senior scholar whose work on climate change is groundbreaking.","The department is looking to hire a senior scholar to lead the new robotics lab.","Many senior scholars have expressed concern over the recent changes to the curriculum."],"synonyms":["senior academic","distinguished professor","leading authority","senior faculty member"],"antonyms":["junior scholar"],"gap":{"sentence":"Because of her decades of experience and deep expertise, the committee appointed her as a _____ to lead the research project.","answer":"senior scholar","options":["senior scholar","junior student","new intern","young apprentice"]}},{"term":"academic literature","pos":"noun phrase","definition":"Written works, such as research papers or scholarly books, used for study and education.","time":714.3,"lesson":"When we talk about literature, I distinguish between two big groups: fictional books and academic literature. I think this reading was academic, while the other one was fiction.","examples":[{"sentence":"The professor asked us to cite several sources from academic literature.","pattern":""},{"sentence":"It is often difficult to understand academic literature because of the complex vocabulary.","pattern":""},{"sentence":"She spent the entire weekend reviewing academic literature on climate change.","pattern":""},{"sentence":"The thesis is based on a wide range of academic literature.","pattern":""}],"countable":[],"uncountable":[{"meaning":"Written works, such as research papers or scholarly books, used for study and education.","example":"When we talk about literature, I distinguish between two big groups: fictional books and academic literature.","lesson":true},{"meaning":"The body of written works in a specific field of study","example":"The academic literature on quantum mechanics is vast and complex."}],"more_examples":["The department is looking for experts who can analyze current academic literature.","Students are encouraged to supplement their textbooks with academic literature.","The research project requires a thorough survey of the existing academic literature."],"synonyms":["scholarly publications","research papers","scholarly works","peer-reviewed literature"],"antonyms":["popular literature"],"gap":{"sentence":"While a blog post offers a quick opinion, you need to consult _____ to find peer-reviewed evidence for your thesis.","answer":"academic literature","options":["academic literature","fiction novels","personal diaries","advertising slogans"]}},{"term":"push oneself","pos":"expression","definition":"To force yourself to do something that you do not want to do.","time":799.9,"lesson":"Reading books is not my hobby because I don't enjoy it. I push myself to do it because I feel like I need to, but I prefer watching movies or listening to podcasts.","examples":[{"sentence":"I have to push myself to go to the gym when I'm feeling tired.","pattern":"push oneself + to + verb"},{"sentence":"She pushed herself to finish the marathon despite the pain.","pattern":"pushed herself (past tense)"},{"sentence":"You need to push yourself to speak more in meetings.","pattern":"need to + push oneself"},{"sentence":"It's hard to push yourself to study when you'd rather be gaming.","pattern":"hard to + push oneself"}],"more_examples":["I really had to push myself to wake up at 5 a.m. for the flight.","You have to push yourself to start the first chapter of the book.","He pushed himself to stay calm during the intense interview."],"synonyms":["make an effort","force oneself","buckle down","make a conscious effort","steel oneself","motivate oneself"],"antonyms":["slack off","procrastinate","take it easy","ease up"],"gap":{"sentence":"Even though I felt exhausted, I had to _____ to complete the final report before the deadline.","answer":"push myself","options":["push myself","choose myself","hide myself","forget myself"]}},{"term":"not my thing","pos":"idiom","definition":"something that you do not enjoy, have an interest in, or feel suited for.","time":807.3,"lesson":"I don't enjoy reading books. I prefer watching movies or listening to podcasts, but reading is just not my thing.","examples":[{"sentence":"I know everyone loves hiking, but mountain climbing is just not my thing.","pattern":"subject + is just not my thing"},{"sentence":"He tried to get me into team sports, but competitive gaming is not my thing.","pattern":"not my thing (as a contrast to a preference)"},{"sentence":"I'm not into politics; it's just not my thing.","pattern":"not my thing (as a reason for lack of interest)"}],"more_examples":["I tried baking a cake, but honestly, it's just not my thing.","He's really into heavy metal, but that kind of music is not my thing.","I know I should probably start a blog, but writing for the public is not my thing."],"synonyms":["not for me","I'm not into it","doesn't appeal to me","not my style","not my forte"],"antonyms":["my thing","right up my alley","my cup of tea","I'm into it","my forte"],"gap":{"sentence":"I know you enjoy going to loud clubs, but dancing in a crowded room is just _____.","answer":"not my thing","options":["not my thing","my passion","my hobby","my specialty"]}},{"term":"wordy","pos":"adjective","definition":"using more words than necessary to express an idea; unnecessarily long or complex.","time":867.7,"lesson":"I could follow along with the reading, but it felt very wordy. You look at the text and wonder why it was phrased that way when there were easier ways to say the same thing.","examples":[{"sentence":"The report is far too wordy; you should try to be more concise.","pattern":""},{"sentence":"I find his writing style a bit wordy, which makes it hard to get to the point.","pattern":""},{"sentence":"Try not to be wordy during your presentation so the audience stays engaged.","pattern":""},{"sentence":"The instructions were so wordy that I had to read them three times to understand.","pattern":""}],"more_examples":["The lawyer's statement was so wordy that the jury lost interest.","You can cut out those extra adjectives to make the paragraph less wordy.","I'm trying to write a more direct email; I don't want it to be wordy."],"synonyms":["verbose","prolix","long-winded","rambling","repetitive","circuitous","pleonastic"],"antonyms":["concise","succinct","brief","terse","laconic","to the point","pithy"],"gap":{"sentence":"The email was so _____ that I had to skim through several paragraphs just to find the actual meeting time.","answer":"wordy","options":["wordy","concise","clear","helpful"]}},{"term":"fundamentally different","pos":"adjective phrase","definition":"having a basic nature or core characteristics that are completely different from something else.","time":900.0,"lesson":"I realized about two years ago that I should start reading books because watching movies was getting boring. However, I should say that reading books is fundamentally different from watching movies.","examples":[{"sentence":"The two systems are fundamentally different in how they process data.","pattern":"be + fundamentally different + in + noun phrase"},{"sentence":"Our goals are fundamentally different, so we cannot work together on this project.","pattern":"subject + are fundamentally different"},{"sentence":"The movie was fundamentally different from the book it was based on.","pattern":"be fundamentally different from"},{"sentence":"They have fundamentally different views on how the company should be run.","pattern":"have fundamentally different + noun"}],"more_examples":["The two cultures are fundamentally different in terms of social etiquette.","The new software is fundamentally different from the previous version.","Living in a city is fundamentally different from living in the countryside."],"synonyms":["radically different","completely different","inherently different","totally different","strikingly different","distinctly different"],"antonyms":["fundamentally similar","essentially the same","virtually identical"],"gap":{"sentence":"The two job offers are _____ because one is a remote role while the other requires moving to another country.","answer":"fundamentally different","options":["fundamentally different","highly similar","quite consistent","fairly uniform"]}},{"term":"and so on and so forth","pos":"expression","definition":"Used at the end of a list to show that other similar things continue.","time":943.7,"lesson":"In real life, we never have to describe the shape of someone's eyes, the color of their hair, or the way they style their hair, and so on and so forth.","examples":[{"sentence":"You can buy fruit, vegetables, and so on and so forth at the local market.","pattern":"list + and so on and so forth"},{"sentence":"The report covers the budget, the timeline, and so on and so forth.","pattern":"noun + and so on and so forth"},{"sentence":"We discussed the logistics, the marketing plan, and so on and so forth.","pattern":""},{"sentence":"She had to prepare the presentation, the handouts, and so on and so forth.","pattern":"list of tasks + and so on and so forth"}],"more_examples":["The shop sells everything from pens and notebooks to folders, and so on and so forth.","You need to pack your toothbrush, soap, shampoo, and so on and so forth.","The museum has exhibits on ancient history, modern art, and so on and so forth."],"synonyms":["etc","and so forth","et cetera","and what not","and so on"],"antonyms":[],"gap":{"sentence":"The shop sells everything from pens and notebooks to backpacks _____, making it a one-stop shop for students.","answer":"and so on and so forth","options":["and so on and so forth","never","rarely","only"]}},{"term":"appalled","pos":"adjective","definition":"Feeling shocked or horrified by something bad, shocking, or immoral.","time":990.5,"lesson":"Victorian society was simultaneously appalled and enthralled. It is like being shocked to the core.","examples":[{"sentence":"I was appalled by the way the company treated its employees.","pattern":"appalled by [something]"},{"sentence":"The public was appalled to learn about the corruption.","pattern":"subject + was/were appalled"},{"sentence":"She looked appalled when she saw the mess in the kitchen.","pattern":"look + appalled"},{"sentence":"They were utterly appalled by the lack of basic hygiene.","pattern":"utterly + appalled"}],"more_examples":["I was appalled by the sheer amount of plastic waste on the beach.","The neighbors were appalled to find out their fence had been destroyed.","He was appalled by the rude behavior of the teenagers in the shop."],"synonyms":["horrified","shocked","stunned","dismayed","aghast","outraged","revolted"],"antonyms":["unfazed"],"gap":{"sentence":"The neighbors were _____ to see the children left alone in a house with no supervision.","answer":"appalled","options":["appalled","excited","relaxed","grateful"]}},{"term":"enthralled","pos":"adjective","definition":"completely fascinated or captivated by something, often to the point of being held spellbound.","time":990.5,"lesson":"Victorian society was simultaneously appalled and enthralled. I am not sure if it means being amazed in a bad way or simply shocked.","examples":[{"sentence":"The children were enthralled by the magician's final trick.","pattern":"be enthralled by"},{"sentence":"She sat enthralled, watching the sunset over the mountains.","pattern":"subject + verb + enthralled"},{"sentence":"The audience was left enthralled by the haunting melody of the cello.","pattern":"left + enthralled"},{"sentence":"He became enthralled with the idea of exploring deep space.","pattern":"become enthralled with"}],"more_examples":["The fans were enthralled by the singer's powerful live performance.","I was completely enthralled by the plot twists in the novel.","The toddlers sat enthralled as the colorful bubbles floated around them."],"synonyms":["captivated","mesmerized","spellbound","riveted","enchanted","hypnotized","engrossed","absorbed","transfixed"],"antonyms":["bored","uninterested","indifferent","unmoved","disengaged"]},{"term":"backstory","pos":"noun","definition":"The previous events or history that explain why a situation or character is the way it is.","time":1095.9,"lesson":"I have a problem: I have one month left. Should I provide a little backstory? We need to understand that reading in general is hard.","examples":[{"sentence":"The movie was great, but it needed a bit more backstory for the main character.","pattern":"need + backstory"},{"sentence":"Can you give me some backstory on why the company decided to change its logo?","pattern":"give (someone) backstory"},{"sentence":"The novelist spent three pages explaining the backstory of the war.","pattern":"backstory of [something]"},{"sentence":"I don't need the whole backstory; just tell me what happened today.","pattern":"the whole backstory"}],"countable":[{"meaning":"The previous events or history that explain why a situation or character is the way it is.","example":"Should I provide a little backstory?","lesson":true},{"meaning":"A sequence of events in a fictional story","example":"The game's backstory is told through hidden notes found in the world."}],"uncountable":[{"meaning":"The historical context or background of a situation","example":"The backstory of the conflict is quite complex and spans decades."}],"more_examples":["The detective spent weeks uncovering the backstory of the crime.","In the play, the backstory of the two lovers is revealed in the first act.","I'm not interested in the backstory; I just want to know the final result."],"synonyms":["background","history","origins","past","context"],"antonyms":[],"gap":{"sentence":"The character's sudden outburst of anger made sense once I learned about his tragic _____.","answer":"backstory","options":["backstory","attitude","feeling","behavior"]}},{"term":"tackle","pos":"verb","definition":"To make a determined effort to deal with a problem or a difficult task.","time":1153.5,"lesson":"This is the first part of the issue. First of all, the only way to tackle it is to read more. Combining academic reading with fiction is a good approach.","examples":[{"sentence":"We need to tackle the issue of climate change immediately.","pattern":"tackle + noun (problem/issue)"},{"sentence":"The government is trying to tackle rising inflation.","pattern":"tackle + gerund/noun phrase"},{"sentence":"How are you planning to tackle this project?","pattern":"tackle + object"},{"sentence":"She tackled the difficult math problems one by one.","pattern":""}],"more_examples":["I need to tackle my laundry before I can go out.","The team is ready to tackle the new marketing strategy.","He decided to tackle his fear of heights by going rock climbing."],"synonyms":["deal with","handle","address","confront","cope with","undertake","attend to","manage","face up to"],"antonyms":["avoid","ignore","evade","shirk","neglect","dodge"],"gap":{"sentence":"The mountain of paperwork was overwhelming, so I decided to _____ it by organizing the files into categories.","answer":"tackle","options":["tackle","forget","neglect","dismiss"]}},{"term":"likelihood","pos":"noun","definition":"The probability or chance that something will happen or be true.","time":1214.5,"lesson":"An academic cannot simply say, 'There is no way you can achieve that.' Instead, they would say, 'The likelihood of a successful outcome is low.'","examples":[{"sentence":"There is a high likelihood that the meeting will be postponed due to the storm.","pattern":"high likelihood that"},{"sentence":"What is the likelihood of winning the lottery?","pattern":"likelihood of + -ing"},{"sentence":"Given the current trends, the likelihood of success is increasing.","pattern":"likelihood of [noun]"},{"sentence":"The likelihood of rain today is about fifty percent.","pattern":"The likelihood of [noun] is [percentage/amount]"}],"countable":[],"uncountable":[{"meaning":"The probability or chance that something will happen or be true.","example":"An academic cannot simply say, 'There is no way you can achieve that.' Instead, they would say, 'The likelihood of a successful outcome is low.'","lesson":true}],"more_examples":["There is a strong likelihood that the prices will rise next month.","The likelihood of a power outage is slim during the summer.","Scientists are studying the likelihood of a volcanic eruption in the region."],"synonyms":["probability","chance","possibility","odds"],"antonyms":["improbability","unlikelihood"],"gap":{"sentence":"Because the team has practiced so hard, there is a high _____ that they will win the championship.","answer":"likelihood","options":["likelihood","requirement","decision","purpose"]}},{"term":"savage","pos":"adjective","definition":"behaving in a wild, violent, or very rude and aggressive manner.","time":1710.7,"lesson":"That is one of the meanings of the word savage. Do you know this word? A savage person might be a very rude person.","examples":[{"sentence":"The fans were savage in their criticism of the new movie.","pattern":"savage + in + [noun phrase]"},{"sentence":"He has a savage sense of humor that can sometimes offend people.","pattern":"savage + [noun]"},{"sentence":"The tribe lived in a savage state, untouched by modern civilization.","pattern":"in a savage state"},{"sentence":"She gave him a savage look when he interrupted her speech.","pattern":"give + [someone] + a savage look"}],"more_examples":["The storm caused savage damage to the coastal village.","He was hit by a savage attack from his business rivals."],"synonyms":["fierce","brutal","violent","ruthless","vicious","barbaric","ferocious","unrelenting","aggressive"],"antonyms":["gentle","mild","civilized","tame","peaceful","moderate","polite"],"gap":{"sentence":"The angry customer became so _____ that he started shouting insults and throwing items at the staff.","answer":"savage","options":["savage","polite","calm","helpful"]}},{"term":"worthy of","pos":"expression","definition":"deserving of a particular quality, treatment, or status based on one's actions or character.","time":1735.4,"lesson":"It is not a direct meaning; 'worthy of a depraved savage' is more of a saying. They are just using those words to make the report sound more dramatic.","examples":[{"sentence":"The hero's bravery was worthy of a medal.","pattern":"worthy of + noun"},{"sentence":"Is this movie worthy of our time?","pattern":"worthy of + possessive pronoun + noun"},{"sentence":"He is not worthy of the trust you placed in him.","pattern":"not worthy of + noun"}],"more_examples":["The project was a success, and the team is worthy of a celebration.","After years of hard work, she finally felt worthy of the promotion.","Is this old building worthy of renovation, or should we tear it down?"],"synonyms":["deserving of","meriting"],"antonyms":["unworthy of","undeserving of","not fit for"],"gap":{"sentence":"After working late every night for a month, she felt her promotion was _____ celebration.","answer":"worthy of","options":["worthy of","full of","capable of","good for"]}},{"term":"stumble over","pos":"phrasal verb","definition":"To be blocked or confused by a specific word or phrase, making it hard to understand.","time":2030.9,"lesson":"I don't think unknown words bother me at all. There is nothing that makes me stumble over a word and suddenly lose the meaning of the whole sentence.","examples":[{"sentence":"I sometimes stumble over my words when I'm nervous about speaking in public.","pattern":"stumble over + noun (physical/verbal tripping)"},{"sentence":"The text was so dense that I kept stumbling over the complex legal jargon.","pattern":"stumble over + noun (difficulty understanding)"},{"sentence":"He stumbled over the same paragraph three times while trying to read it aloud.","pattern":"stumble over + object (repetition)"},{"sentence":"Don't worry if you stumble over a few words; the important thing is to keep going.","pattern":"if + subject + stumble over"}],"more_examples":["I always stumble over the pronunciation of 'rural' when I'm trying to speak quickly.","The speaker's thick accent made it easy for the audience to stumble over some of the technical terms.","I'm still learning the language, so I often stumble over long compound words."],"synonyms":["falter on","get tongue-tied","hesitate over"],"antonyms":["articulate","speak fluently","pronounce clearly","flow smoothly"],"gap":{"sentence":"The speaker was so nervous that she kept _____ the long, technical terms during her presentation.","answer":"stumbling over","options":["stumbling over","writing","recording","memorizing"]}},{"term":"incarcerated","pos":"adjective","definition":"kept in prison or a similar place of confinement.","time":2077.5,"lesson":"I was hating a word while reading this text, but then I understood it in the context of 'incarcerated.' It appeared in each sentence, so I tried to guess the meaning.","examples":[{"sentence":"The suspect was incarcerated for three years before his trial.","pattern":"be incarcerated for [period of time]"},{"sentence":"The government is looking for ways to reduce the number of incarcerated people.","pattern":"number of incarcerated [people/individuals]"},{"sentence":"He spent most of his youth incarcerated in a high-security facility.","pattern":"spent [time] incarcerated"},{"sentence":"The report highlights the harsh conditions faced by incarcerated offenders.","pattern":"incarcerated + noun"}],"more_examples":["The documentary explores the lives of incarcerated individuals seeking rehabilitation.","Many incarcerated people are allowed to work in prison workshops.","The judge ordered that the defendant remain incarcerated until the investigation is complete."],"synonyms":["imprisoned","locked up","detained","confined","jailed","behind bars","held in custody"],"antonyms":["free","released","liberated","unconfined"],"gap":{"sentence":"The thief was _____ for several months after the police discovered the stolen jewelry in his house.","answer":"incarcerated","options":["incarcerated","employed","exhausted","inspired"]}},{"term":"by far","pos":"adverbial phrase","definition":"used to emphasize that something is much more than anything else in a group.","time":2279.2,"lesson":"Then we have different types of tasks here, such as true/false and gap filling. Gap filling is by far the most difficult task, and you just need to understand how it works.","examples":[{"sentence":"This is by far the best pizza I have ever had.","pattern":"by far + superlative adjective"},{"sentence":"She is by far the most experienced candidate for the job.","pattern":"by far + the + most + adjective"},{"sentence":"It was by far the easiest exam of the semester.","pattern":"by far + the + -est adjective"}],"more_examples":["Mount Everest is by far the highest mountain in the world.","That was by far the most interesting documentary I've seen this year.","He is by far the fastest runner on the team."],"synonyms":["easily","clearly","hands down","head and shoulders above"],"antonyms":["not by much","only slightly","barely"],"gap":{"sentence":"Out of all the cities I have visited, Tokyo is _____ the most organized and efficient.","answer":"by far","options":["by far","quite","rather","fairly"]}},{"term":"propose","pos":"verb","definition":"To put forward a plan, idea, or suggestion for consideration.","time":2332.6,"lesson":"The text might mention a scientist from Milan or a researcher from Milan. The word 'proposes' is used here, which is similar to 'made a proposal.'","examples":[{"sentence":"The committee proposed a new strategy to increase sales.","pattern":"propose + noun"},{"sentence":"I propose that we hold the meeting on Friday instead.","pattern":"propose + that + subject + base verb"},{"sentence":"The government is proposing a series of tax reforms.","pattern":"present continuous (proposing)"}],"more_examples":["The architect proposed a modern design for the new library.","I'd like to propose a toast to the happy couple.","They proposed a motion to change the company's remote work policy."],"synonyms":["suggest","submit","put forward","recommend","offer","advance","pitch"],"antonyms":["oppose"],"gap":{"sentence":"Since the current office layout is very cramped, the manager decided to _____ a plan for a complete renovation.","answer":"propose","options":["propose","ignore","refuse","hide"]}},{"term":"stumble upon","pos":"phrasal verb","definition":"To find something by chance or unexpectedly while doing something else.","time":2924.0,"lesson":"I was browsing through YouTube one day and stumbled upon a podcast where two young men discussed evolutionary psychology for two and a half hours.","examples":[{"sentence":"I stumbled upon an old photograph while I was cleaning out the attic.","pattern":"stumble upon + object"},{"sentence":"While browsing the bookstore, she stumbled upon a rare first edition.","pattern":""},{"sentence":"They stumbled upon the solution by accident during their experiment.","pattern":"stumble upon + noun phrase"},{"sentence":"I'm so glad I stumbled upon your blog; your advice is very helpful.","pattern":""}],"more_examples":["I was walking through the park and stumbled upon a hidden garden.","We stumbled upon a tiny café while wandering around the old town.","While researching for my project, I stumbled upon some fascinating statistics."],"synonyms":["come across","happen upon","find by chance","discover unexpectedly"],"antonyms":["look for","seek out","search for","deliberately find"],"gap":{"sentence":"I wasn't looking for a job, but I _____ a great opening while scrolling through social media.","answer":"stumbled upon","options":["stumbled upon","requested","planned","avoided"]}},{"term":"match someone in status","pos":"expression","definition":"To have the same social standing, wealth, or level of success as another person.","time":3061.6,"lesson":"They find it very hard to find a mate simply because most men are above their level; they cannot match them in status.","examples":[{"sentence":"The company is looking for a candidate who can match the CEO in status.","pattern":""},{"sentence":"It is often difficult for people from different backgrounds to match each other in status.","pattern":"match each other in status"},{"sentence":"He felt uncomfortable because he didn't think he could match her in status.","pattern":"couldn't match [someone] in status"},{"sentence":"In some cultures, it is important to marry someone who matches you in status.","pattern":"match you in status"}],"more_examples":["In the 19th century, many families insisted that children marry someone who could match them in status.","The scholarship is designed to help students from lower-income families match their peers in status.","It's not just about money; they want a partner who can match them in status and influence."],"synonyms":["be of equal rank","be of equal means"],"antonyms":["be of unequal status"],"gap":{"sentence":"The billionaire refused to attend the local gala because he didn't want to mingle with people who couldn't _____.","answer":"match him in status","options":["match him in status","help him in status","match him in weight","match him in color"]}},{"term":"keep in mind","pos":"expression","definition":"to remember or consider a specific piece of information or a fact.","time":3239.6,"lesson":"Just keep in mind that there are a lot of hints in the exam. The examiners are supposed to have a very structural approach to the test.","examples":[{"sentence":"Please keep in mind that the deadline for the project is this Friday.","pattern":"keep in mind + that-clause"},{"sentence":"You should keep the safety rules in mind at all times.","pattern":"keep [something] in mind"},{"sentence":"Keep in mind that prices may change without notice.","pattern":""},{"sentence":"I'll keep that in mind for next time.","pattern":""}],"more_examples":["Keep in mind that the restaurant is closed on Mondays.","When you're planning the trip, keep in mind that the weather can be unpredictable.","You should keep in mind how much this decision will affect your long-term goals."],"synonyms":["bear in mind","remember","take into account","consider","note","don't forget","be aware","take into consideration"],"antonyms":["forget","ignore","disregard","overlook"],"gap":{"sentence":"When you are planning the hiking route, please _____ that the weather can change very quickly in the mountains.","answer":"keep in mind","options":["keep in mind","look forward","get along","take part"]}},{"term":"pull up","pos":"phrasal verb","definition":"To arrive at a place or come over to join a group.","time":3459.1,"lesson":"I'm having a crying session at my house tonight at 8 p.m. Please pull up.","examples":[{"sentence":"Feel free to pull up to my place whenever you're ready.","pattern":"pull up + to + [place]"},{"sentence":"If you can pull up by 7:00, we can grab a quick coffee.","pattern":"pull up + by + [time]"},{"sentence":"Just pull up and I'll let you in.","pattern":"pull up (as a standalone command)"},{"sentence":"They pulled up in the driveway and headed inside.","pattern":"pulled up + in + [location]"}],"more_examples":["Once you pull up at the restaurant, I'll come out to meet you.","You can pull up in the back parking lot to avoid the traffic.","Just pull up whenever you get here; the gate is unlocked."],"synonyms":["arrive","show up","turn up","stop by","come over","roll up"],"antonyms":["leave","depart","go away","head out"],"gap":{"sentence":"Once the taxi _____ outside the hotel, we grabbed our bags and headed to the check-in desk.","answer":"pulled up","options":["pulled up","walked in","ran away","looked around"]}},{"term":"touch grass","pos":"idiom","definition":"To spend time outdoors in nature to relax and disconnect from technology or intense work.","time":3507.5,"lesson":"I probably want to watch the sunset and touch some grass after three hours of English because I have been sitting at my desk since 1 p.m. If touching grass has this calming effect on you, then by all means do it.","examples":[{"sentence":"I've been staring at my computer screen all day; I really need to go outside and touch grass.","pattern":""},{"sentence":"You've been playing video games for ten hours straight—go touch some grass!","pattern":""},{"sentence":"After a long week of meetings, I find that touching grass helps me clear my head.","pattern":""},{"sentence":"He needs to touch grass and get some perspective on the situation.","pattern":""}],"more_examples":["You've been arguing with strangers on Twitter for hours; honestly, you need to touch grass.","I'm feeling so burnt out from this project that I just need to go outside and touch grass.","Whenever I feel overwhelmed by social media, I make a point to touch grass and go for a walk."],"synonyms":["get some fresh air","unplug","disconnect","get back to reality","ground yourself"],"antonyms":["stay plugged in","scroll endlessly","stay inside"]},{"term":"by all means","pos":"expression","definition":"Used to give permission or to strongly encourage someone to do something.","time":3526.6,"lesson":"If touching grass has this calming effect on you, then by all means. Okay, I will do that.","examples":[{"sentence":"By all means, take my seat if you need to sit down.","pattern":"By all means + imperative"},{"sentence":"If you have any questions during the presentation, by all means, ask them.","pattern":"If..., by all means, [verb]"},{"sentence":"By all means, feel free to contact me if you need further assistance.","pattern":"By all means, feel free to"}],"more_examples":["By all means, join us for dinner if you have the time.","If you think the project needs more research, by all means, start looking into it.","By all means, tell me if you find any errors in the report."],"synonyms":["certainly","of course","absolutely","go ahead","please do"],"antonyms":["under no circumstances","don't bother","not at all"]}],"dialogues":[{"title":"Discussing a challenging English reading test","lines":[{"speaker":"A","text":"Can you hear and see me clearly? I'm a bit worried my computer script might freeze the connection.","said":"hello hi you hear me well you see me well yeah I do okay yeah because like on my computer there's a script running and I'm actually a little worried that it might like you know I might free this occasionally","highlights":["freeze the connection"]},{"speaker":"B","text":"I'll let you know if that happens. Anyway, I have a question about this reading. It was incredibly difficult—it felt like a trap!","said":"I will let you know if you do all right Alina what's up hello good afternoon I have a question what the fuck what what was this reading like","highlights":["felt like a trap"]},{"speaker":"A","text":"I actually chose it completely at random. I didn't have any hidden agenda to humble you.","said":"on this on the site I chose this test completely randomly did not have any intention behind it at all","highlights":["hidden agenda"]},{"speaker":"B","text":"I'm so angry at myself for struggling! The text felt like it was written by a prince 100 years ago—it was unnecessarily overcomplicated.","said":"I feel like I'm angry I'm like angry at myself I'm like what the fuck why am I trying so hard but it's it feels like the text was fucking written by Prince Charles or I don't know or some other Prince that leads 100 years ago like it's so unnecessarily unnecessarily over","highlights":["unnecessarily overcomplicated"]},{"speaker":"A","text":"I've noticed that in recent years, reading tasks have become harder while listening has become easier. That's a good trend because listening gives you no second chance.","said":"I just noticed it that reading has gotten a little bit harder while listening has gotten a little bit easier and I think that that's a good actually tendency because listening you don't really you don't have a second chance","highlights":["no second chance"]},{"speaker":"B","text":"The texts were just so long. Usually, each part has a separate idea, but here, I couldn't even tell what I just read.","said":"the text texts were just so long I don't know maybe yeah yeah they're definitely long like and each part of it is flowing into another and just some parts are kind of I don't know how to explain it usually I think each part has a separate idea"},{"speaker":"B","text":"I had to reread some sentences several times out loud because they were so dense. My answers weren't bad, but I missed a word because of the word count.","said":"I have to go back and reread it several times and like read it out loud because I feel like it's just too much so my answers actually are not so bad and I think because for example I replied undermined by and then the answer was severely undermined by but in"},{"speaker":"A","text":"You scored low because it was challenging, but we need to see if it's the complexity of the test or a skill issue.","said":"because you scored quite low on this test and because you spend a lot of time on it like you spent 1.5 more time then you should which is not bad yeah but like it's just I'm just saying that it was challenging to you and I see that we have two things are","highlights":["skill issue"]},{"speaker":"B","text":"I struggled with words like 'realm.' And this sentence about Jack the Ripper was packed with such weird, archaic vocabulary.","highlights":["packed with"]},{"speaker":"B","text":"I've started reading 'Thinking, Fast and Slow' by Daniel Kahneman. It's not an easy book at all, but it explains how we use systems one and two to make decisions.","highlights":["not an easy book"]},{"speaker":"B","text":"I also read 'Can't Hurt Me' by David Goggins. It's a fictional account of his life. My brain was just giving up because the readings were so complicated.","said":"I actually also read a book in English where I didn't understand of course some words from time to time which was by David Goggins you can't hurt me I don't know if you heard","highlights":["giving up"]}]},{"title":"Overcoming the challenges of reading books","lines":[{"speaker":"A","text":"I'm finding it really hard to concentrate on these books. I found David Goggins much easier, but 'Thinking, Fast and Slow' is still quite difficult.","said":"it was so much easier when then with this one but I feel like since I when I moved to Bali and I started lessons with you it","highlights":["concentrate on"]},{"speaker":"B","text":"Actually, since you started our lessons, 'Thinking, Fast and Slow' has become easier than it used to be for you.","said":"the current one thinking fast and slow became much more easier than it used to be when I started it"},{"speaker":"A","text":"To be honest, reading isn't really my hobby. I don't enjoy it; I prefer watching movies or listening to audiobooks and podcasts.","said":"I don't have reading books as I'm a hobby I do not like it and I push myself to do it because I feel like it I need to do","highlights":["to be honest"]},{"speaker":"B","text":"You don't need books to master a language. Most of my English came from movies and podcasts. When I first started reading, it felt very wordy.","highlights":["master a language"]},{"speaker":"B","text":"Books are fundamentally different from movies. In films, you can just say 'Chris' and the audience knows who that is. Books have to describe everything.","said":"how what he looks like how he behaves books don't have this tools you know like they can show us something so they need to describe things","highlights":["fundamentally different"]},{"speaker":"B","text":"The vocabulary in books is often very specific. You won't encounter words like 'appalled' or 'enthralled' in daily life very often.","said":"the vocabulary that you see in books will like most of it you will only see in books you will never encounter it in life mm","highlights":["daily life"]},{"speaker":"A","text":"That first paragraph is just nonsense. It's too much! If I see something like that in a book, I'd just skip it until it gets interesting.","said":"the first paragraph it's just it's nonsense like it's it's too much and if I would encounter something like that in a book I would just fucking skip that paragraph"},{"speaker":"B","text":"Reading is hard even in your native language. When I was twelve, I had to keep a dictionary next to me because every few pages introduced new words.","said":"I would only get into reading books and I would have a huge you know like dictionary beside me and I remember if I was reading like you know a hard book I would like every like every couple of every page basically would introduce new words","highlights":["native language"]},{"speaker":"B","text":"To tackle this, you should combine academic reading with fiction. Even though 'Thinking, Fast and Slow' is for ordinary people, it still uses academic phrasing.","said":"the only way to tackle it is to read more of course and reading like combining academic reading with fiction is a good approach I would say because like even you know like those books like","highlights":["tackle this"]},{"speaker":"A","text":"I only have one month. I can't develop the skills of a lifelong reader in that time. What should I do?","said":"I have one month like I cannot just develop the skill to a level of a person who has been reading for some time"},{"speaker":"B","text":"You just need to understand the main idea. You did that even without knowing exactly what 'appalled' or 'enthralled' meant.","said":"the only thing you need you just need to understand the idea of a sentence and you demonstrated that even though you are did not know exactly what appalled is what unthrown is you kind of like got the idea","highlights":["main idea"]},{"speaker":"B","text":"For example, 'inquiries' in that sentence sounds like 'encounters.' It's not far from the truth. Now, can you tell me the idea of that sentence in simple words?","said":"it sounds like encounterings but it's inquiries yeah just like situations okay not not very far not very far from the truth actually can you okay this first sentence can you tell me in simple words the idea of the sentence","highlights":["not far from the truth"]}]},{"title":"Analyzing Jack the Ripper text","lines":[{"speaker":"A","text":"I really hate this first sentence. It's just so ugly. 'Few murder inquiries have stirred the public imagination to such an extent as those relating to Jack the Ripper.'","said":"the first sentence I hate this sentence it's just for me it in such a fucking ugly way few murder inquiries have stirred the public imagination to such an extent as those relating to Jack the Ripper"},{"speaker":"B","text":"It uses a specific grammatical construction here. Basically, it means that the public was shocked and fascinated by these specific cases.","said":"we have a grammatical construction as a specific grammatical construction that communicates the idea like we have an inversion here just in simple words what the sentence is about there were few murder inquiries cases yelling cases public"},{"speaker":"A","text":"When you say 'few murder inquiries,' do you mean there weren't many cases in the 19th century in general?","said":"when you said few murder inquiries does mean that are in the 19th century there weren't many cases in general"},{"speaker":"B","text":"I'm not sure. The task often tries to make you think literally. They might want you to decide if it's true, false, or not given.","said":"the task they are very often they like it very much you know like what they take a certain phrase and they try to make you think about it literally"},{"speaker":"A","text":"Maybe there were many cases, but only a few were associated with Jack the Ripper specifically.","said":"but it says few murder inquiries but few were associated with Jack the Ripper maybe there were many and few of them were associated with this exact murder"},{"speaker":"B","text":"Exactly. It's saying that people were shocked by this case more than almost any other.","said":"what the sentence is saying is basically a pub like people were very shocked people were shocked when this case is appeared and not a lot of cases shocked people as much as this one"},{"speaker":"A","text":"The second sentence is so weird. 'The murder is worthy of a depraved savage... simultaneously appalled and enthralled.' What year is that? 1800s?"},{"speaker":"B","text":"Who is a 'depraved savage'? It's not even funny. I spent 50 minutes on the first part and then I hit this.","said":"who is a depraved savage simulant it's not even funny like it's not funny at all and I already spent 50 minutes on a first part and the second one was like this"},{"speaker":"A","text":"It's okay to be emotional. 'Depraved' means something is affected in a bad way, and 'savage' usually refers to a rude or violent person.","said":"it's okay to be emotional sometimes depraved or do you know this word depraved sleep like lack of something and like some bit something is affecting it in a bad way so like something affects it and it's right you are"},{"speaker":"B","text":"I guess it refers to a perverted person or a level of violence that is unthinkable, but honestly, that part doesn't really matter for the meaning.","said":"probably my guess would be accurate actually like they're talking about just a very like you know perverted person or you know a person so bad that's so depraved you know that it's just unthinkable you know a level of violence"},{"speaker":"A","text":"You can ignore that part. It doesn't introduce new facts. It just carries an emotional charge."},{"speaker":"B","text":"I felt relieved when I finished the text because I finally understood why they couldn't catch Jack the Ripper.","said":"when I finish reading the stacks I was relieved because I was like fine now I know what happened they couldn't catch Jack the Ripper"},{"speaker":"A","text":"Words like 'appalled' and 'enthralled' show the emotions people felt. Everyone was just terrified.","said":"appalled and unthrown old actually could be meaningful here because that tells us the what kind of emotions people experienced yeah and"},{"speaker":"B","text":"I got a 6.5 on my first reading, but then it dropped to 5.0. It feels unfair, but we shouldn't judge my English based on just two readings."},{"speaker":"A","text":"From now on, stop scoring your readings. Treat these passages like a book you'd read in your free time. Just read it and try to understand.","said":"I recommend is it from now on you stop scoring your readings you need to do two three four in a very relaxed manner you know like you you need to treat those passages the same"},{"speaker":"B","text":"Unknown words don't bother me much, but if there are three in one sentence and I lose the meaning of the whole thing, that's a problem.","said":"understand the sentence no I think if there are three unknown words in a sentence or at least the words that I barely hear and see and encounter then it's a problem like with this exact sentence then I just lose the meaning of a whole sentence"}]},{"title":"IELTS Reading strategies and reading habits","lines":[{"speaker":"A","text":"I tried to guess the meaning of the word based on context. Since 'car' means prison in Spanish, I figured it had a Latin origin.","said":"I was like it sounds like car so which is in Spanish is a prison and I was like that's like in prison I I probably think that this word has a Latin origin","highlights":["based on context"]},{"speaker":"B","text":"Your Spanish definitely helps! But I agree with your idea of looking up words. You shouldn't put pressure on yourself to find every single detail.","said":"just that's what I'm saying so yeah but I got your idea that I need to Google a word I would I can order the Google a word without any pressure","highlights":["put pressure on yourself"]},{"speaker":"A","text":"Exactly. Not every sentence needs to be analyzed thoroughly. Sometimes it's just okay to move on.","said":"very often again and this is this comes from this comes from practice a lot of sentences they don't need to be parsed that detailed","highlights":["move on"]},{"speaker":"B","text":"What's the best way to approach the reading section? Should I read the whole text first or start with the questions?","said":"how do I complete a reading what is the plan do I read the text completely or do I first read the questions what is the best way to complete it"},{"speaker":"A","text":"Part one is the easiest, part two is moderate, and part three is intentionally very difficult to separate students of different levels.","said":"part one is the easiest part two is somewhere in the middle and part three is intentionally very very hard yeah yeah and the fact that I","highlights":["separate students"]},{"speaker":"A","text":"You should spend about ten minutes on part one, 20 minutes on part two, and 30 minutes on part three.","said":"part one should take the least amount of time around ten minutes because usually it's very easy hmm part two around approximately 20 minutes and part three half of"},{"speaker":"A","text":"True/False/Not Given is the hardest. However, 'complete the gap' tasks are easier because you just need to find the exact words in the text."},{"speaker":"B","text":"I felt my intuition helping me out on the first one, but the others were much harder. For example, where does it mention the rehabilitation of offenders?","said":"I intuitively now I didn't know you know you felt what I didn't did it like my end intuition was helping me out and I was like oh I","highlights":["helping me out"]},{"speaker":"A","text":"It's in the first sentence. If you put 'rehabilitation' there, it fits grammatically as a hint for a group of people.","said":"it's in the first sentence part one first sentence I said just rehabilitation the fine shhh oh"},{"speaker":"B","text":"I missed the 'against all expectations' part. It was so hard. How does 'incarceration' fit there?"},{"speaker":"A","text":"The Netherlands stopped imprisoning people and started closing prisons. 'Against' is a synonym for 'defying' in this context."},{"speaker":"B","text":"Number four is impossible! I swear, I won't even look at the answer.","said":"Number four. It's just. Don't look at the answer, it's impossible, I swear"},{"speaker":"A","text":"It's not that hard; it's only part one. Even a native speaker might struggle without experience."},{"speaker":"B","text":"I've always hated reading literature. I was a good student, but reading just isn't my thing.","said":"I can't read in Russian. I can't read in my own language. I hate reading Russian literature, and I always did all my life. I was a good student","highlights":["isn't my thing"]},{"speaker":"A","text":"My advice is to find something you're actually interested in. You could try a self-help book on productivity.","said":"my advice is, you need to find stuff that you're actually interested in, because that makes it much easier. Yeah. Of course, you can grab any random self-help book, for"},{"speaker":"B","text":"I found a book called 'Influence' by Robert Cialdini. It's about psychological tricks to make people agree with you.","said":"same. How to evoke. It was a book about different psychological tricks, how to make people agree with what you offer to them. What's the name? Influence, yeah"}]},{"title":"Evolutionary psychology and IELTS study habits","lines":[{"speaker":"A","text":"You know, you can find some really interesting scientific content anywhere online. I actually stumbled upon a podcast where two guys discussed evolutionary psychology for over two hours.","said":"you might be interested in the scientific aspect of it. And you literally can find it anywhere. For example, on YouTube, I just one day, I was just crawling. And one day, I just stumbled upon a podcast where two guys would discuss evolutionary psychology for","highlights":["stumbled upon"]},{"speaker":"B","text":"They were talking about why the dating market feels empty today and why people aren't dating as much. They even discussed men's height and what the preferred height is.","said":"they would discuss things like why the dating market feels like it's empty today, why people don't date today. They would discuss, for example, men's height. What's the preferred height of men"},{"speaker":"A","text":"Right, and it's not just about being super tall. The study found that being above average is attractive, but once you hit around 190cm, the curve starts dropping because it's just too much.","said":"But it's actually not true. Definitely not. Because the study found that it should be above average, but not too high. Not too high, yeah. And actually, there is a predictor how we can count it. Not too tall. Not too tall, yeah. If we take all men's heights","highlights":["above average"]},{"speaker":"B","text":"It's all just statistics. The data changes depending on the country, like in Vietnam or other Asian countries. They also talked about how wealthy, independent women find it hard to find a mate because of status gaps.","said":"It's just statistics. Women just look at the guys around them, and the statistics would be different for Vietnam or for Asian countries. And they would discuss stuff like that for two and a half hours. Why women data app? Why today there are a lot of women"},{"speaker":"A","text":"The podcast was fascinating. I didn't even notice I was pausing to look up academic words because the researchers used such sophisticated language to describe complicated systems.","said":"And it was very interesting. And again, I did not feel like I will, I did not feel like, OK, now I will practice reading, or now I will do some thinking. It was just interesting. And I did not even notice how I would pause every three minutes and look up words","highlights":["sophisticated language"]},{"speaker":"B","text":"I have a question, though. We haven't practiced speaking, and that must be hard too. But honestly, what could be harder than reading at this point?","said":"Pavel, I have a question. We haven't practiced speaking. And it must be fucking hard as well. Well, what could be harder than reading at this point"},{"speaker":"A","text":"Here's the deal: you need to get into reading every day because it's your weakest area. If you put the same effort into reading as you do for writing, you could improve your score significantly.","said":         (() => {

            const IRREGULAR = {};

                    forms.split(',').forEach(form => { IRREGULAR[form] = base; });

            const icons = {
                play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
                bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg>'

            const mistakes = lesson.mistakes || [];

            // --------------------------------------------------------- helpers
            function esc(value) {
                return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

                    if (w.endsWith(suffix) && w.length - suffix.length >= 3) { w = w.slice(0, -suffix.length); break; }

            function playButton(text, label) {

            // Word diff (longest common subsequence) between what was said and the fix.
            function diff(before, after) {
                const a = before.split(/\s+/).filter(Boolean);
                const b = after.split(/\s+/).filter(Boolean);
                const n = a.length, m = b.length;
                const table = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
                for (let i = n - 1; i >= 0; i--) {
                    for (let j = m - 1; j >= 0; j--) {
                        table[i][j] = norm(a[i]) === norm(b[j]) ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
                    }
                }
                const left = [], right = [];
                let i = 0, j = 0;
                while (i < n || j < m) {
                    if (i < n && j < m && norm(a[i]) === norm(b[j])) {
                        left.push({ word: a[i++], kind: 'same' });
                        right.push({ word: b[j++], kind: 'same' });
                    } else if (j >= m || (i < n && table[i + 1][j] >= table[i][j + 1])) {
                        const word = a[i];
                        const previous = i > 0 ? norm(a[i - 1]) : '';
                        const noise = FILLERS.has(norm(word)) || norm(word) === previous || !norm(word);

                    } else {

                        const last = left[left.length - 1];

                }
                const render = (tokens, tag) => tokens.map(t => {

                return { said: render(left, 'del'), fixed: render(right, 'ins') };

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {

                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
