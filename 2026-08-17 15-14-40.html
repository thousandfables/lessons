        body {
            display: flex;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h2 {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            color: #444;
            background: linear-gradient(145deg, #eaeaea, #ffffff);

            text-transform: capitalize;
            letter-spacing: 0.5px;
        }

        h3 {
            font-size: 50px;
            font-weight: bold;
        }



        #left {
            width: 100%;
            padding: 20px;
            border-right: 2px solid #ccc;
        }

        #right {
            display: none background-color: #f4f4f4;
        }

        .part-buttons,
        .content-buttons {
            margin-bottom: 10px;
        }

        .part-buttons button,
        .content-buttons button {
            margin-right: 5px;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .part-buttons button.active {
            background-color: #007bff;
            color: white;
        }

        .content-buttons button.loading {
            animation: flash 0.5s infinite alternate;
        }

        .content-buttons button.active {
            background-color: #007bff;
            color: white;
        }

        @keyframes flash {
            0% {
                background-color: #ffd700;
            }

            100% {
                background-color: #ffa500;
            }
        }

        .hidden {
            display: none;
        }

        .section-content {
            margin-top: 1px;
            padding: 30px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }

        .entry-box {
            font-weight: bold;
            font-size: 1.4em;
            display: inline-block;
            border-bottom: 2px solid #2980b9;
            padding-bottom: 2px;
            margin-top: 25px;
            margin-bottom: 5px;
        }

            background-color: #f4f4f4;
            padding: 8px 12px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            margin: 5px 0;
            max-width: 400px;
            text-align: left;

            color: #000000;
            font-size: 1.2em;
        }

            margin-left: 20px;
            font-style: italic;
        }

            background-color: rgba(142, 68, 173, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            box-shadow: 2px 2px 5px rgba(142, 68, 173, 0.15);
            max-width: 500px;
        }

            font-size: 1.8em;
            font-weight: bold;
            padding: 8px 12px;
            display: inline-block;
            border-left: 6px solid rgba(0, 0, 0, 0.2);
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.2);
            margin-top: 30px;
            margin-bottom: 10px;
            color: white;

            background-color: #8e44ad;
            border-left-color: #6a1b9a;
            box-shadow: 3px 3px 8px rgba(142, 68, 173, 0.3);
        }

            background-color: rgba(52, 152, 219, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            box-shadow: 2px 2px 5px rgba(52, 152, 219, 0.15);
            max-width: 500px;
        }

        .fact {
            color: black;
        }

        /* Joke Text */
        .joke {
            color: #6d1b9a;
            /* Deeper purple for better readability */
            font-size: 1.1em;
            line-height: 1.4;
        }

        .joke-question {
            font-weight: bold;
            font-size: 1.2em;
            font-style: italic;
            color: #2c3e50;
            /* Dark gray-blue for a classy contrast */

        }

        .bold {
            font-weight: 600;
            color: #000000;
            /* Darker shade for better contrast */
        }

        .italic {
            font-style: italic;
            color: #000000;
            /* Slightly darker gray for better readability */
        }

        .bold-italic {
            font-weight: 600;
            font-style: italic;
            color: #222;
            /* More emphasis on bold-italic text */
        }

        /* Joke Box - Adds a soft neumorphic effect */
        .joke-box {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1),
                -5px -5px 10px rgba(255, 255, 255, 0.5);
            max-width: 550px;
            transition: all 0.3s ease-in-out;
        }

        /* Joke Box Hover Effect */
        .joke-box:hover {
            transform: translateY(-3px);
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.15),
                -6px -6px 12px rgba(255, 255, 255, 0.6);
        }

        /* Dialogue Container - Auto Width Based on Content */
        .dialogue-container {
            display: inline-block;
            /* Shrinks width to fit content */
            max-width: 800px;
            /* Prevents it from becoming too wide */
            margin: 20px 0;
            /* Aligns it to the left with some spacing */
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }

        .line {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.1);
            font-size: 1.1em;
            line-height: 1.4;
        }

        .person-1 {
            background: linear-gradient(145deg, #dde5ed, #c9d6e2);
            text-align: left;
            color: #2c3e50;
        }

        .person-2 {
            background: linear-gradient(145deg, #d1e8ff, #b9dfff);
            text-align: left;
            color: #1d3557;
        }

        /* Speaker Name Styling */
        .speaker {
            font-weight: bold;
            margin-bottom: 5px;

            font-size: 1.1em;
            color: #000;
        }
    </style>
</head>

        "vocabulary_4": {

        "vocabulary_5": {
            "vocabulary_list": [
                {
                    "word": "Present continuous (present progressive)",
                    "definition": "A verb tense used to describe actions that are happening now or around now (form: am/is/are + -ing).",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'When I say \"I am singing,\" I mean I am in the process of singing (I am singing right now).'",
                        "Context 2": "She is studying for her exam at the moment.",
                        "Context 3": "They are building a new playground in the neighborhood."
                    }
                },
                {
                    "word": "Past simple (simple past)",
                    "definition": "A verb tense used to describe completed actions that happened at a specific time in the past (regular verbs add -ed; many common verbs are irregular).",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'I sang last night.' (not 'I am sang' — past simple states the completed action)",
                        "Context 2": "He visited his grandparents last weekend.",
                        "Context 3": "We watched a movie yesterday evening."
                    }
                },
                {
                    "word": "Past continuous (past progressive)",
                    "definition": "A verb tense used to describe a continuous action that was happening at a specific moment in the past (form: was/were + -ing).",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'I was singing when the phone rang.' (not 'I were singing')",
                        "Context 2": "They were studying all night before the exam.",
                        "Context 3": "It was raining heavily when we left the house."
                    }
                },
                {
                    "word": "Wake up",
                    "definition": "A phrasal verb meaning to stop sleeping and become awake.",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'I woke up one and a half hours ago.' (not 'I am was wake up')",
                        "Context 2": "Please wake up early tomorrow to catch the train.",
                        "Context 3": "The loud thunder woke the baby up last night."
                    }
                },
                {
                    "word": "State",
                    "definition": "A condition or situation that is static (not an action); often used in grammar to contrast with actions (state verbs vs action verbs).",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'Waking up is an action, not a state.'",
                        "Context 2": "Knowing the answer is a state (I know the fact).",
                        "Context 3": "Her happiness was obvious — it was a lasting state that day."
                    }
                },
                {
                    "word": "Process",
                    "definition": "A series of actions or steps taken to achieve a particular end; in grammar, '-ing' often emphasizes the ongoing process of an action.",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'Singing is the process of producing song: \"I am singing\" = \"I am in the process of singing.\"'",
                        "Context 2": "The hiring process took three weeks from application to offer.",
                        "Context 3": "Cooking is a creative process that requires patience."
                    }
                },
                {
                    "word": "Simple positive sentence",
                    "definition": "A basic affirmative sentence (states that something happened or is happening) without negation or question form.",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'I woke up one and a half hours ago.' is a simple positive sentence.",
                        "Context 2": "She finished her homework before dinner.",
                        "Context 3": "They arrived on time for the meeting."
                    }
                },
                {
                    "word": "Regularize",
                    "definition": "To make something regular or standard; in language, to make irregular forms follow a regular pattern.",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'Some people regularize irregular verbs by making them take -ed (for example, some might say \"waked\" instead of \"woke\").'",
                        "Context 2": "Over time, spelling often regularizes in a language as usage settles.",
                        "Context 3": "The company decided to regularize employee schedules to reduce confusion."
                    }
                },
                {
                    "word": "Quirk",
                    "definition": "An unusual habit, feature, or detail — often a small oddity or exception.",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'That's a quirk — an interesting exception — that some speakers use different past forms like \"woke\" or \"waked.\"'",
                        "Context 2": "One of her quirks is that she labels everything in the kitchen.",
                        "Context 3": "The old typewriter had a quirk that made the 'e' key stick sometimes."
                    }
                },
                {
                    "word": "Subject (grammar)",
                    "definition": "The person, thing, or idea that performs the action or about which the sentence speaks (usually a noun or pronoun).",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'Make a full sentence with the subject and the verb: \"I woke up one and a half hours ago.\" — here \"I\" is the subject.'",
                        "Context 2": "In the sentence 'The cat slept,' 'The cat' is the subject.",
                        "Context 3": "When you start a sentence, place the subject before the verb in simple statements."
                    }
                },
                {
                    "word": "Verb",
                    "definition": "A word that describes an action, occurrence, or state of being.",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'Sing is a verb; \"singing\" shows the process (I am singing).'",
                        "Context 2": "The verb 'run' can change to 'ran' in the past simple.",
                        "Context 3": "Modal verbs like 'can' or 'should' help the main verb express ability or obligation."
                    }
                },
                {
                    "word": "Sleepy",
                    "definition": "Feeling a desire to sleep or showing signs of tiredness.",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'He looked sleepy — he probably did not have enough sleep and wanted to sleep.'",
                        "Context 2": "After the long flight, everyone felt sleepy and dozed off.",
                        "Context 3": "The kitten was so sleepy that it fell asleep on my book."

                },
                {
                    "word": "Cognitive effort",
                    "definition": "Mental energy required to think, learn, or solve problems.",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'Mixing tenses requires cognitive effort, so we practice simpler forms first.'",

                        "Context 3": "Learning a new language demands sustained cognitive effort at the beginning."

                {
                    "word": "Flexibility",
                    "definition": "The ability to adapt or change; in language, the ability to use different structures for variety or nuance.",
                    "context": {
                        "Context 1": "Corrected from the lesson: 'Using both simple and continuous forms gives you flexibility in how you express time and process.'",
                        "Context 2": "A flexible work schedule gives employees better work-life balance.",
                        "Context 3": "Yoga increases physical flexibility and reduces stress."
                    }
                }
            ],
            "funny_facts": [
                {
                    "word": "Wake up",
                    "fact": "Studies show many people hit the snooze button multiple times — waking up slowly is a global habit (and a quiet rebellion against alarms)."
                },
                {
                    "word": "Present continuous",
                    "fact": "In English, speakers sometimes use the present continuous for future plans: 'I am meeting her tomorrow.' So '-ing' can act like a tiny calendar!"

                {
                    "word": "Quirk",
                    "fact": "The word 'quirk' originally meant a twist or bend — now it's used for personality oddities. Language itself has many quirky exceptions."

                    "answer": "Because the students needed help conjugating — they kept falling asleep on the present continuous!"

                {
                    "question": "What tense is a sleepy detective in?",

            ]
        },

            // Set parts_number from json_content
            let parts_number = json_content.parts_number || 0;

        // References to sections
        const partsSection = document.getElementById('partsSection');
        const contentSection = document.getElementById('contentSection');
        const displaySection = document.getElementById('displaySection');

        let activePart = null; // Track the active part

        // Function to create Part buttons
        function createPartButtons() {
            for (let i = 1; i <= parts_number; i++) {
                let button = document.createElement("button");
                button.textContent = "Part " + i;
                button.onclick = () => showContentButtons(i, button);
                partsSection.appendChild(button);
            }
        }

        // Function to show Mistakes, Vocabulary, and Dialogue buttons
        function showContentButtons(part, button) {
            // Reset previous part selection
            document.querySelectorAll(".part-buttons button").forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");

            // Clear previous content buttons and displayed content
            contentSection.innerHTML = "";
            contentSection.classList.remove("hidden");
            displaySection.innerHTML = "";

            activePart = part; // Update active part

            let sections = ["Mistakes", "Vocabulary", "Dialogue"];
            sections.forEach(section => {
                let secButton = document.createElement("button");
                secButton.textContent = section;
                secButton.onclick = () => {
                    secButton.classList.add("loading"); // Add flashing effect
                    displayContent(section, part, secButton);
                };
                contentSection.appendChild(secButton);
            });
        }

        // Function to display selected content
        function displayContent(type, part, button) {
            let dataKey = type.toLowerCase(); // "mistakes", "vocabulary", "dialogue"
            let partKey = dataKey + "_" + part; // e.g., "mistakes_1"

            if (json_content[dataKey] && json_content[dataKey][partKey]) {
                let contentData = json_content[dataKey][partKey];

                if (dataKey === "mistakes") {
                    appendContent(displayMistakes(contentData), part, type, button);
                } else if (dataKey === "vocabulary") {
                    appendContent(displayVocabulary(contentData), part, type, button);
                } else if (dataKey === "dialogue") {
                    appendContent(displayDialogue(contentData), part, type, button);
                }
            }
        }

        // Append content while keeping existing sections
        function appendContent(html, part, type, button) {
            let sectionID = `part${part}-${type}`;
            let existingSection = document.getElementById(sectionID);

            if (!existingSection) {
                let newSection = document.createElement("div");
                newSection.id = sectionID;
                newSection.classList.add("section-content");
                newSection.innerHTML = html;
                displaySection.appendChild(newSection);

                // Remove animation, keep the button highlighted
                button.classList.remove("loading");
                button.classList.add("active");
            }
        }

        // Function to display Mistakes content
        function displayMistakes(data) {
            let html = "<h3>Mistakes</h3>";
            data.mistakes_list.forEach(mistake => {
                html += `<p><b>Original:</b> ${mistake.original}</p>`;
                html += `<p><b>Corrected:</b> <b> ${mistake.corrected}</b></p>`;
                html += `<p><b>Explanation:</b> ${mistake.explanation}</p>`;
                html += `<p><b>Context:</b> <i> ${mistake.context}</i></p>`;
                html += `<hr><br>`; /* Adds an extra blank line */
            });
            return html;
        }





        // Function to display Vocabulary content
        function displayVocabulary(data) {
            let html = "<h3>Vocabulary</h3>";

            // Helper function: Preserve case in context replacement
            function formatContextSentence(sentence, word) {
                const regex = new RegExp(`\\b${word}\\b`, "gi"); // Case-insensitive exact word match
                return sentence.replace(regex, (match) => {
                    return `<span class="bold-italic">${match}</span>`; // Keeps match's case
                });
            }

            // Vocabulary Section
            data.vocabulary_list.forEach((entry, index) => {
                // Word Entry
                html += `<p class="entry-box"> <span class="word">${index + 1}. ${entry.word}</span></p>`;

                // Definition Box
                html += `<div class="definition-box"><span class="bold">Definition:</span> ${entry.definition}</div>`;

                // Context Sentences
                html += "<p>";
                Object.values(entry.context).forEach((sentence, i) => {
                    const formattedSentence = formatContextSentence(sentence, entry.word);
                    html += `<br><span class="bold">Context ${i + 1}:</span> <span class="italic">${formattedSentence}</span>`;
                });
                html += "</p>";
            });

            // Funny Facts Section
            if (data.funny_facts.length > 0) {
                html += `<div class="section-title purple-section">Funny Facts</div>`;
                data.funny_facts.forEach((fact, index) => {
                    html += `<div class="fact-box">
                <p class="fact"><span class="bold">${index + 1}. ${fact.word}:</span> ${fact.fact}</p>
             </div>`;
                });
            }

            // Jokes Section
            if (data.jokes.length > 0) {
                html += `<div class="section-title purple-section">Jokes</div>`;
                data.jokes.forEach((joke, index) => {
                    html += `<div class="joke-box">
                <p class="joke-question">${index + 1}. ${joke.question}</p>
                <p class="italic joke">${joke.answer}</p>
             </div>`;
                });
            }

            return html; // Returning the generated HTML instead of inserting it directly
        }

        function displayDialogue(data) {
            let html = `<div class="dialogue-container">`;
            html += "<h3>Dialogue</h3>";

            data.dialogue_list.forEach(entry => {
                const speaker = Object.keys(entry)[0];
                const line = entry[speaker];

                html += `<div class="line ${speaker === "Person 1" ? 'person-1' : 'person-2'}">
                    <span class="speaker">${speaker}:</span> ${line}
                 </div>`;
            });

            html += `</div>`;
            return html;
        }





        // Initialize part buttons
        createPartButtons();
    </script>
