                let html = '';
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Study or practise" data-no-speech>'
                        + views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('')
                        + '</div>';
                }
                html += '<div id="vocab-view"></div>';
                html += `<button class="back-to-quiz" type="button" hidden data-no-speech>${icons.backArrow}Back to the quiz</button>`;
                panel.innerHTML = html;
                const host = document.getElementById('vocab-view');
                const backButton = panel.querySelector('.back-to-quiz');
                // "See the word" leaves the quiz as it is (same question, same
                // score); the button brings it back where the reader left it.
                let current = 'words';
                let paused = null;
                const leaveQuiz = () => {
                    paused = null;
                    backButton.hidden = true;
                };
                // Each game gets a new element, so its listeners go away with it.
                freshGame = () => {
                    host.innerHTML = '<div class="game"></div>';
                    return host.firstChild;
                };

                const show = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'words';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    if (view === 'gap' && paused) {
                        const { game, scroll } = paused;
                        leaveQuiz();
                        host.replaceChildren(game);
                        window.scrollTo({ top: scroll });
                        const next = game.querySelector('[data-action]');
                        if (next) next.focus({ preventScroll: true });
                    } else if (view === 'match') { leaveQuiz(); renderMatch(freshGame()); }
                    else if (view === 'gap') renderGap(freshGame());
                    else host.innerHTML = vocabulary.map(wordCardHtml).join('');
                    current = view;
                    if (remember) storage('lesson-vocab-view', view);
                };
                backButton.addEventListener('click', () => show('gap', false));
                // The timeline opens the word list the way "See the word" does:
                // a quiz in progress waits behind "Back to the quiz".
                vocabularyToWords = () => {
                    if (current === 'words') return;
                    const game = current === 'gap' ? host.querySelector('.game') : null;
                    const scroll = window.scrollY;
                    show('words', false);
                    if (game) {
                        paused = { game, scroll };
                        backButton.hidden = false;
                    }
                };
                // "Go back" to a quiz resumes it where it was (a paused one).
                vocabularyView = () => current;
                setVocabularyView = view => {
                    if (view === current) return;
                    if (view === 'words') vocabularyToWords();
                    else show(view, false);
                };

                panel.addEventListener('click', event => {
                    const view = event.target.closest('.view');
                    if (view) { show(view.dataset.view, true); return; }
                    // Any of the buttons opens all the parts in place (always in
                    // the same order; the page does not move, its own part lights
                    // up briefly); "Hide" closes them again.
                    const more = event.target.closest('.more-btn');
                    if (more) {
                        const word = more.closest('.word');
                        const open = !more.classList.contains('more-hide');
                        word.querySelector('.more-bar').classList.toggle('open', open);
                        word.querySelectorAll('.more-btn:not(.more-hide)').forEach(button => button.setAttribute('aria-expanded', String(open)));
                        word.querySelectorAll('.more-part').forEach(part => { part.hidden = !open; });
                        if (open) flashItem(word.querySelector(`.more-part[data-part="${more.dataset.part}"]`));
                        return;
                    }
                    const jump = event.target.closest('[data-word]');
                    if (jump) {
                        const game = current === 'gap' ? host.querySelector('.game') : null;
                        const scroll = window.scrollY;
                        show('words', false);
                        if (game) {
                            paused = { game, scroll };
                            backButton.hidden = false;
                        }
                        const card = document.getElementById('word-' + jump.dataset.word);
                        if (card) {
                            glideToCenter(card);
                            card.classList.add('flash');
                            setTimeout(() => card.classList.remove('flash'), 1500);
                        }
                    }
                });
                show(storage('lesson-vocab-view') || 'words', false);
            }

            // ------------------------------------------------------- dialogues
            const inTime = (x, y) => (x.dialogue.time ?? x.number) - (y.dialogue.time ?? y.number);
            const dialogueItems = dialogues.map((dialogue, number) => ({ dialogue, number })).sort(inTime);

            // A highlighted phrase opens its word card when the vocabulary has
            // it: "took her temperature" finds "take someone's temperature".
            // Word forms, capitals, placeholders (someone, something), pronouns
            // and possessives do not matter; the small words of a phrasal verb
            // do ("look up" is not "look after"). A phrase may hold the whole
            // term ("practically mythical": "mythical"), or be at least half
            // of it ("under the weather": "feel under the weather").
            const PRONOUNS = new Set(['i', 'me', 'you', 'he', 'him', 'she', 'we', 'us', 'they', 'them', 'it', 'this', 'that', 'these', 'those',
                'myself', 'himself', 'herself', 'itself', 'ourselves', 'yourselves', 'themselves', 'hers', 'mine', 'yours', 'theirs', 'ours',
                "somebody's", "something's", "sb's", "sth's", 'anyone', 'anybody', 'anything', 'everyone', 'everybody', 'everything']);

            function lemma(word) {
                let w = norm(word).replace(/'s$/, '');
                if (IRREGULAR[w]) return IRREGULAR[w].replace(/e+$/, '');
                for (const [ending, replacement] of [['ies', 'y'], ['ied', 'y'], ['ing', ''], ['ed', ''], ['es', ''], ['s', ''], ['ly', '']]) {
                    if (w.endsWith(ending) && w.length - ending.length >= 3) {
                        w = w.slice(0, -ending.length) + replacement;
                        if ((ending === 'ing' || ending === 'ed') && /([bdgmnprt])\1$/.test(w)) w = w.slice(0, -1);  // running, stopped
                        break;
                    }
                }
                return w.replace(/e+$/, '');
            }

            function phraseWords(text) {
                const content = new Set(), small = new Set();
                String(text || '').split(/[\s/]+/).forEach(raw => {
                    const w = norm(raw);
                    if (!w || PLACEHOLDERS.has(w) || PRONOUNS.has(w)) return;
                    if (FUNCTION_WORDS.has(w)) small.add(w);
                    else content.add(lemma(w));
                });
                return { content, small };
            }

            let termWords = null;
            function vocabularyFor(phrase, time) {
                termWords = termWords || vocabulary.map(entry => phraseWords(entry.term));
                const p = phraseWords(phrase);
                if (!p.content.size) return -1;
                let best = -1, bestScore = 0, bestGap = Infinity;
                vocabulary.forEach((entry, index) => {
                    const t = termWords[index];
                    if (!t.content.size) return;
                    const shared = [...t.content].filter(w => p.content.has(w)).length;
                    const termInPhrase = shared === t.content.size && [...t.small].every(w => p.small.has(w));
                    const phraseInTerm = shared === p.content.size && shared * 2 >= t.content.size && [...p.small].every(w => t.small.has(w));
                    if (!termInPhrase && !phraseInTerm) return;
                    // Most words in common first; a phrase much longer than the term is too loose.
                    const score = shared * 4 + [...t.small].filter(w => p.small.has(w)).length - Math.abs(p.content.size - t.content.size);
                    const at = entry.clip ? entry.clip.at : entry.time;
                    const gap = known(at) && known(time) ? Math.abs(at - time) : Infinity;
                    if (score > bestScore || (score === bestScore && gap < bestGap)) {
                        best = index;
                        bestScore = score;
                        bestGap = gap;
                    }
                });
                return best;
            }

            function dialogueHtml(dialogue, options) {
                let html = `<article class="card dialogue"><div class="d-head"><h3>${esc(dialogue.title)}</h3>`;
                const facts = [];
                // The letters sit on the lines; the title gets them only when its
                // time is not already the first line's own (no line clips).
                const first = (dialogue.lines || [])[0];
                const firstAt = first && first.clips && first.clips.length ? first.clips[0].at : null;
                const jumps = known(firstAt) && Math.abs(firstAt - dialogue.time) < 1 ? '' : jumpsHtml('dialogues', dialogue.time);
                if (dialogue.time !== null && dialogue.time !== undefined) facts.push(`<span class="clock">${clock(dialogue.time)}</span>${jumps}`);
                if (options.showTopic && topics[dialogue.topic]) facts.push(`<span>${esc(topics[dialogue.topic].title)}</span>`);
                if (facts.length) html += `<div class="ex-meta" data-no-speech>${facts.join(jumps ? '' : '<span class="sep">·</span>')}</div>`;
                html += '</div>';
                const number = dialogues.indexOf(dialogue);
                (dialogue.lines || []).forEach((line, index) => {
                    const side = line.speaker === 'B' ? 'B' : 'A';
                    const lineTime = line.clips && line.clips.length ? line.clips[0].at : (index === 0 ? dialogue.time : null);
                    html += `<div class="line ${side}" data-item="d-${number}-${index}"><span class="who" data-no-speech>${side}</span><div class="bubble">`
                        + highlightPhrases(line.text, line.highlights, phrase => vocabularyFor(phrase, lineTime));
                    // Only the recording itself; the transcript's raw words are never shown.
                    const clips = (line.clips || []).map(clip => clipHtml(clip, 'Hear what was said')).join('');
                    if (clips) html += `<div class="line-tools" data-no-speech>${clips}${jumpsHtml('dialogues', line.clips[0].at)}</div>`;
                    html += '</div></div>';
                });
                return html + '</article>';
            }

            function dialogueListHtml(view) {
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = dialogueItems.filter(item => item.dialogue.topic === number);
                        if (!items.length) return '';
                        let html = '<section class="topic-group"><h3 class="topic-head" data-no-speech>';
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        return html + items.map(item => dialogueHtml(item.dialogue, {})).join('') + '</section>';
                    }).join('');
                }
                return dialogueItems.map(item => dialogueHtml(item.dialogue, { showTopic: true })).join('');
            }

            function renderDialogues() {
                const panel = document.getElementById('panel-dialogues');
                if (!dialogues.length) {
                    panel.innerHTML = '<p class="empty">No dialogues for this lesson.</p>';
                    return;
                }
                const views = [];
                if (dialogues.some(d => d.time !== undefined)) views.push(['time', 'By time']);
                if (topics.length > 1 && dialogues.some(d => d.topic !== undefined)) views.push(['topic', 'By topic']);
                const linked = dialogues.some(dialogue => (dialogue.lines || []).some(line => (line.highlights || []).some(phrase => vocabularyFor(phrase, null) >= 0)));
                let html = '<p class="panel-intro">Moments from your conversation, retold the way two native speakers would say them. Highlighted phrases are worth borrowing'
                    + (linked ? '; tap an underlined one to see it in Vocabulary' : '') + '. Tap ▶ to hear what was actually said.</p>';
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the dialogues" data-no-speech>'
                        + views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('')
                        + '</div>';
                }
                html += '<div id="dialogue-list"></div>';
                panel.innerHTML = html;
                const list = document.getElementById('dialogue-list');
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = views.length ? views[0][0] : 'time';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = dialogueListHtml(view);
                    if (remember) storage('lesson-dialogue-view', view);
                };
                showView(storage('lesson-dialogue-view') || 'time', false);
                panel.addEventListener('click', event => {
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                });
            }

            // ---------------------------------------------------- lesson audio
            // One clip plays at a time; its pill opens into the small player.
            const player = { audio: null, pill: null, frame: 0 };

            function clipAudio() {
                if (player.audio) return player.audio;
                const audio = new Audio();
                audio.preload = 'auto';
                const refresh = () => {
                    const pill = player.pill;
                    if (!pill) return;
                    pill.classList.toggle('playing', !audio.paused && !audio.ended);
                    showProgress();
                    cancelAnimationFrame(player.frame);
                    if (!audio.paused) {
                        const tick = () => { showProgress(); player.frame = requestAnimationFrame(tick); };
                        player.frame = requestAnimationFrame(tick);
                    }
                };
                ['play', 'playing', 'pause', 'ended', 'seeked', 'loadedmetadata'].forEach(name => audio.addEventListener(name, refresh));
                // Animation frames stop while the page is hidden (a locked phone); the clip's own ticks do not.
                audio.addEventListener('timeupdate', showProgress);
                audio.addEventListener('error', () => {
                    if (!player.pill) return;
                    showNote('This part of the lesson audio could not be played.');
                    player.pill.classList.add('failed');
                    player.pill.querySelector('.clip-main').title = 'This recording is not available';
                    stopClip();
                });
                player.audio = audio;
                return audio;
            }

            function showProgress() {
                const pill = player.pill, audio = player.audio;
                if (!pill || !audio) return;
                const share = audio.duration ? Math.min(1, audio.currentTime / audio.duration) : 0;
                pill.querySelector('.clip-fill').style.width = `${share * 100}%`;
                pill.querySelector('.clip-bar').setAttribute('aria-valuenow', String(Math.round(share * 100)));
            }

            function stopClip() {
                cancelAnimationFrame(player.frame);
                if (player.audio) player.audio.pause();
                if (player.pill) player.pill.classList.remove('open', 'playing');
                player.pill = null;
            }

            function playClip() {
                if (window.lessonVoice) window.lessonVoice.stop();
                const started = player.audio.play();
                if (started && started.catch) started.catch(() => {});
            }

            // The clips are Opus in WebM: every current browser plays them;
            // iPhones only from iOS 17.5. Elsewhere a tap says so.
            const clipsPlayable = Boolean(document.createElement('audio').canPlayType('audio/webm; codecs="opus"'));
            let noteTimer = 0;
            function showNote(message) {
                let note = document.querySelector('.clip-note');
                if (!note) {
                    note = document.createElement('p');
                    note.className = 'clip-note';
                    note.setAttribute('role', 'status');
                    note.setAttribute('data-no-speech', '');
                    document.body.appendChild(note);
                }
                note.textContent = message;
                note.hidden = false;
                clearTimeout(noteTimer);
                noteTimer = setTimeout(() => { note.hidden = true; }, 4500);
            }

            function openClip(pill) {
                if (!clipsPlayable) {
                    pill.classList.add('failed');
                    showNote('This phone cannot play the lesson audio. Updating the phone (iOS 17.5 or later) fixes it.');
                    return;
                }
                stopClip();
                const audio = clipAudio();
                player.pill = pill;
                pill.classList.remove('failed');
                pill.classList.add('open');
                audio.src = pill.dataset.src;
                showProgress();
                playClip();
            }

            function seekClip(pill, event) {
                if (player.pill !== pill || !player.audio.duration) return;
                const box = pill.querySelector('.clip-bar').getBoundingClientRect();
                const share = Math.min(1, Math.max(0, (event.clientX - box.left) / box.width));
                player.audio.currentTime = share * player.audio.duration;
                showProgress();
            }

            document.addEventListener('click', event => {
                const main = event.target.closest('.clip-main');
                if (main) {
                    const pill = main.closest('.clip');
                    if (player.pill !== pill) openClip(pill);
                    else if (player.audio.paused || player.audio.ended) playClip();
                    else player.audio.pause();
                    return;
                }
                const skip = event.target.closest('.clip-skip');
                if (skip && player.pill === skip.closest('.clip')) {
                    const audio = player.audio;
                    const end = audio.duration || 0;
                    audio.currentTime = Math.min(end, Math.max(0, audio.currentTime + Number(skip.dataset.skip)));
                    if (audio.currentTime < end) playClip();
                    showProgress();
                }
            });
            document.addEventListener('pointerdown', event => {
                const bar = event.target.closest('.clip-bar');
                if (!bar) return;
                const pill = bar.closest('.clip');
                bar.setPointerCapture(event.pointerId);
                seekClip(pill, event);
                const move = moveEvent => seekClip(pill, moveEvent);
                const end = () => {
                    bar.removeEventListener('pointermove', move);
                    bar.removeEventListener('pointerup', end);
                    bar.removeEventListener('pointercancel', end);
                };
                bar.addEventListener('pointermove', move);
                bar.addEventListener('pointerup', end);
                bar.addEventListener('pointercancel', end);
            });
            document.addEventListener('keydown', event => {
                const bar = event.target.closest && event.target.closest('.clip-bar');
                if (!bar || player.pill !== bar.closest('.clip')) return;
                const audio = player.audio;
                const step = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[event.key];
                if (step) audio.currentTime = Math.min(audio.duration || 0, Math.max(0, audio.currentTime + step));
                else if (event.key === 'Home') audio.currentTime = 0;
                else return;
                event.preventDefault();
                showProgress();
            });

            // ---------------------------------------------------------- themes
            const THEMES = [
                ['auto', 'Auto', 'linear-gradient(135deg, #f5f6fa 50%, #171a21 50%)', '#3b5bdb'],
                ['light', 'Light', '#f5f6fa', '#3b5bdb'],
                ['sepia', 'Sepia', '#f3ead6', '#9a5b13'],
                ['mint', 'Mint', '#e9f5ef', '#0f7a5c'],
                ['dark', 'Dark', '#171a21', '#8ea2ff'],
                ['black', 'Black', '#000000', '#8fb3ff']
            ];
            const themeRow = document.getElementById('themes');
            const themeButton = document.querySelector('.theme-btn');
            themeRow.innerHTML = THEMES.map(([id, name, background, accent]) =>
                `<button class="theme" type="button" role="radio" aria-checked="false" data-theme-choice="${id}"><span class="swatch" style="--sw-bg: ${background}; --sw-accent: ${accent}"></span>${name}</button>`).join('');

            function applyTheme(id, remember) {
                if (!THEMES.some(([name]) => name === id)) id = 'auto';
                if (id === 'auto') delete document.documentElement.dataset.theme;
                else document.documentElement.dataset.theme = id;
                themeRow.querySelectorAll('.theme').forEach(button => button.setAttribute('aria-checked', String(button.dataset.themeChoice === id)));
                if (remember) storage('lesson-theme', id);
            }
            applyTheme(storage('lesson-theme') || 'auto', false);
            themeButton.addEventListener('click', () => {
                themeRow.hidden = !themeRow.hidden;
                themeButton.setAttribute('aria-expanded', String(!themeRow.hidden));
            });
            themeRow.addEventListener('click', event => {
                const choice = event.target.closest('[data-theme-choice]');
                if (choice) applyTheme(choice.dataset.themeChoice, true);
            });

            // -------------------------------------------------------- timeline
            // A thin bar on the right edge: the lesson from start (top) to end
            // (bottom), with the open section's items on it and a dot for the
            // place being read. Hold it and three bars open, one per section:
            // the finger picks a moment, every bar shows its item nearest to
            // it, and the open section follows along. Letting go on another
            // bar opens that section at its item; a quick tap, or letting go
            // away from the bars, leaves everything where it was.
            const LANES = [['mistakes', 'Mistakes', 'M'], ['vocabulary', 'Vocabulary', 'V'], ['dialogues', 'Dialogues', 'D']];
            const laneItems = { mistakes: [], vocabulary: [], dialogues: [] };
            const known = value => value !== null && value !== undefined;
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => {
                const time = example.clip ? example.clip.at : example.time;
                if (known(time)) laneItems.mistakes.push({ time, id: `m-${c}-${e}`, label: card.label || 'Mistake' });
            }));
            vocabulary.forEach((entry, i) => {
                const time = entry.clip ? entry.clip.at : entry.time;
                if (known(time)) laneItems.vocabulary.push({ time, id: `word-${i}`, label: entry.term });
            });
            dialogues.forEach((dialogue, d) => (dialogue.lines || []).forEach((line, l) => {
                const time = line.clips && line.clips.length ? line.clips[0].at : (l === 0 ? dialogue.time : null);
                if (known(time)) laneItems.dialogues.push({ time, id: `d-${d}-${l}`, label: dialogue.title });
            }));
            Object.values(laneItems).forEach(items => items.sort((x, y) => x.time - y.time));
            const everyTime = Object.values(laneItems).flat().map(item => item.time);
            const lessonEnd = everyTime.length ? Math.max(...everyTime) + 30 : 0;

            const found = new Map();
            function itemElement(item) {
                let element = found.get(item.id);
                if (!element || !element.isConnected) {
                    element = item.id.startsWith('word-') ? document.getElementById(item.id) : document.querySelector(`[data-item="${item.id}"]`);
                    if (element) found.set(item.id, element);
                }
                return element;
            }

            function nearestItem(items, time) {
                let best = null;
                for (const item of items) if (!best || Math.abs(item.time - time) < Math.abs(best.time - time)) best = item;
                return best;
            }

            // Beside an item's time: one small button per other section (its
            // symbol and colour, its letter small in a corner), opening that
            // section at its item nearest in time. Sections without timed
            // items get no button.
            function jumpsHtml(section, time) {
                if (!known(time)) return '';
                const buttons = LANES.filter(([id]) => id !== section && laneItems[id].length).map(([id, name, letter]) => {
                    const label = `${name} near ${clock(time)}`;
                    return `<button class="jump-btn" type="button" data-lane="${id}" data-at="${time}" title="${label}" aria-label="${label}">`
                        + `${symbol(id)}<span class="jump-letter" aria-hidden="true">${letter}</span></button>`;
                }).join('');
                return buttons ? `<span class="jump-set" data-no-speech>${buttons}</span>` : '';
            }

            function flashItem(element) {
                element.classList.remove('tl-flash');
                void element.offsetWidth; // restart the animation
                element.classList.add('tl-flash');
                setTimeout(() => element.classList.remove('tl-flash'), 1500);
            }

            // A calm scroll (about half a second, easing in and out) that
            // brings an element to the middle of the screen; a tall element
            // starts just under the tabs. A touch or the wheel stops it.
            let glideFrame = 0;
            function centerGoal(element) {
                const box = element.getBoundingClientRect();
                const top = document.querySelector('.tabs').offsetHeight;
                const room = window.innerHeight - top;
                const goal = window.scrollY + box.top - top - Math.max(12, (room - box.height) / 2);
                return Math.max(0, Math.min(goal, document.documentElement.scrollHeight - window.innerHeight));
            }

            function glideToCenter(element) {
                cancelAnimationFrame(glideFrame);
                const end = centerGoal(element);
                let start = window.scrollY;
                if (Math.abs(end - start) < 2) return;
                // A far jump skips most of the way at once and glides the last stretch.
                if (Math.abs(end - start) > window.innerHeight * 1.5) {
                    start = end - Math.sign(end - start) * window.innerHeight * 0.6;
                    window.scrollTo(0, start);
                }
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    window.scrollTo(0, end);
                    return;
                }
                const began = performance.now();
                const step = now => {
                    const t = Math.min(1, (now - began) / 550);
                    const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                    window.scrollTo(0, start + (end - start) * eased);
                    if (t < 1) glideFrame = requestAnimationFrame(step);
                };
                glideFrame = requestAnimationFrame(step);
            }
            ['wheel', 'touchstart', 'keydown'].forEach(name =>
                window.addEventListener(name, () => cancelAnimationFrame(glideFrame), { passive: true }));

            function scrollToItem(element, smooth) {
                const top = element.getBoundingClientRect().top + window.scrollY - document.querySelector('.tabs').offsetHeight - 14;
                window.scrollTo({ top: Math.max(0, top), behavior: smooth ? 'smooth' : 'auto' });
            }

            // The item's element, made visible: the word list instead of a
            // quiz, a mistake hidden by a filter or behind "Show more".
            function revealItem(section, item) {
                if (section === 'vocabulary') vocabularyToWords();
                const element = itemElement(item);
                if (!element) return null;
                if (section === 'mistakes') {
                    const card = element.closest('.mistake');
                    if (card && card.hidden) showAllMistakes();
                    if (card && element.hidden) {
                        card.querySelectorAll('.pair[hidden]').forEach(pair => { pair.hidden = false; });
                        const more = card.querySelector('.more-toggle');
                        if (more) more.remove();
                    }
                }
                return element;
            }

            const timeline = document.createElement('div');
            timeline.className = 'timeline';
            timeline.setAttribute('data-no-speech', '');
            timeline.innerHTML = '<div class="tl-rail" title="Hold and slide: move through the lesson by time">'
                + '<span class="tl-axis"><span class="tl-ticks"></span><span class="tl-here" hidden></span></span></div>'
                + '<div class="tl-panel" hidden>'
                + LANES.map(([id, name]) => `<div class="tl-lane" data-lane="${id}" title="${name}"><span class="tl-name">${symbol(id)}</span>`
                    + '<span class="tl-axis"><span class="tl-ticks"></span><span class="tl-mark" hidden></span></span></div>').join('')
                + '<span class="tl-guide"></span><span class="tl-thumb"></span><span class="tl-time"></span></div>';
            const rail = timeline.querySelector('.tl-rail');
            const railAxis = rail.querySelector('.tl-axis');
            const here = rail.querySelector('.tl-here');
            const timelinePanel = timeline.querySelector('.tl-panel');
            const guide = timelinePanel.querySelector('.tl-guide');
            const thumb = timelinePanel.querySelector('.tl-thumb');
            const timeTag = timelinePanel.querySelector('.tl-time');
            if (lessonEnd) document.body.appendChild(timeline);

            const ticksHtml = items => items.map(item => `<i style="top: ${(item.time / lessonEnd) * 100}%"></i>`).join('');
            const share = time => Math.min(1, Math.max(0, time / lessonEnd));

            // The bar starts just under the section names: lower down while the
            // page's header is on screen, right under the tabs once they stick
            // to the top. While it is held it stays put (the page moves under it).
            const tabsBar = document.querySelector('.tabs');
            let scrub = null;
            let placesFrozen = false;
            let railTop = '';
            function placeTimeline() {
                if (scrub) return;
                const top = `${Math.round(Math.max(0, tabsBar.getBoundingClientRect().bottom) + 8)}px`;
                if (top === railTop) return;
                railTop = top;
                timeline.style.setProperty('--tl-top', top);
            }

            function refreshRail() {
                if (!lessonEnd || !currentTab) return;
                rail.querySelector('.tl-ticks').innerHTML = ticksHtml(laneItems[currentTab]);
                showHere();
            }

            // The dot: the time of the item at the top of the screen.
            function showHere() {
                if (!lessonEnd || !currentTab) return;
                const limit = document.querySelector('.tabs').getBoundingClientRect().bottom + 8;
                let first = null;
                for (const item of laneItems[currentTab]) {
                    const element = itemElement(item);
                    if (!element) continue;
                    const box = element.getBoundingClientRect();
                    if (!box.height || box.bottom < limit) continue;
                    if (!first || box.top < first.top) first = { top: box.top, time: item.time };
                }
                here.hidden = !first;
                if (first) here.style.top = `${share(first.time) * 100}%`;
            }
            let hereFrame = 0;
            window.addEventListener('scroll', () => {
                placeTimeline();
                cancelAnimationFrame(hereFrame);
                hereFrame = requestAnimationFrame(showHere);
            }, { passive: true });
            window.addEventListener('resize', () => { placeTimeline(); showHere(); });
            // The header changes height too (the colours row, the lesson time).
            if ('ResizeObserver' in window) {
                const watcher = new ResizeObserver(() => placeTimeline());
                watcher.observe(document.querySelector('.hero'));
                watcher.observe(tabsBar);
            }

            function timeAt(y) {
                const box = railAxis.getBoundingClientRect();
                return share((y - box.top) / box.height * lessonEnd) * lessonEnd;
            }

            function laneAt(x) {
                for (const lane of timelinePanel.querySelectorAll('.tl-lane')) {
                    const box = lane.getBoundingClientRect();
                    if (x >= box.left && x <= box.right) return lane;
                }
                return null;
            }

            function openTimeline(event) {
                const back = placeNow();  // for "Go back", if the release opens another section
                stopClip();
                // The open section's bar is on the right, under the finger;
                // the other two to its left in the usual order.
                const order = LANES.map(([id]) => id).filter(id => id !== currentTab).concat(currentTab);
                timelinePanel.querySelectorAll('.tl-lane').forEach(lane => {
                    const id = lane.dataset.lane;
                    lane.style.order = order.indexOf(id);
                    lane.classList.toggle('current', id === currentTab);
                    lane.querySelector('.tl-ticks').innerHTML = ticksHtml(laneItems[id]);
                });
                savePlace();  // where the reader was, kept while the panel shows other places
                placesFrozen = true;
                const scroll = window.scrollY;
                timelinePanel.hidden = false;
                // The section narrows to fit beside the panel (it scrolls to the
                // finger's moment right after, so its new length does not matter).
                const room = document.querySelector('main').getBoundingClientRect().right - (timelinePanel.getBoundingClientRect().left - 8);
                document.documentElement.style.setProperty('--tl-room', `${Math.max(0, Math.round(room))}px`);
                document.documentElement.classList.add('tl-open');
                scrub = { section: currentTab, lane: currentTab, showing: currentTab, time: 0, scroll, back,
                    started: Date.now(), x: event.clientX, y: event.clientY, moved: false };
            }

            function moveTimeline(event) {
                const time = timeAt(event.clientY);
                const lane = laneAt(event.clientX);
                if (Math.hypot(event.clientX - scrub.x, event.clientY - scrub.y) > 6) scrub.moved = true;
                scrub.time = time;
                scrub.lane = lane ? lane.dataset.lane : null;
                timelinePanel.querySelectorAll('.tl-lane').forEach(each => {
                    const id = each.dataset.lane;
                    const item = nearestItem(laneItems[id], time);
                    const mark = each.querySelector('.tl-mark');
                    each.classList.toggle('target', each === lane);
                    mark.hidden = !item;
                    if (item) mark.style.top = `${share(item.time) * 100}%`;
                });
                const panelBox = timelinePanel.getBoundingClientRect();
                const y = event.clientY - panelBox.top;
                const column = (lane || timelinePanel.querySelector('.tl-lane.current')).getBoundingClientRect();
                guide.style.top = `${y}px`;
                thumb.style.top = `${y}px`;
                const knobX = column.left + column.width / 2 - panelBox.left;
                thumb.style.left = `${knobX}px`;
                // The time sits above the fingertip, inside the panel.
                timeTag.textContent = clock(time);
                const half = timeTag.offsetWidth / 2;
                timeTag.style.left = `${Math.min(Math.max(knobX, half + 4), panelBox.width - half - 4)}px`;
                timeTag.style.top = `${Math.max(timeTag.offsetHeight + 4, y - 30)}px`;
                // The page shows the section whose bar is under the finger, at
                // its item nearest to the finger's moment.
                if (lane && lane.dataset.lane !== scrub.showing) {
                    scrub.showing = lane.dataset.lane;
                    selectTab(scrub.showing, false);
                }
                const item = nearestItem(laneItems[scrub.showing], time);
                const element = item && revealItem(scrub.showing, item);
                if (element && element.getClientRects().length) scrollToItem(element, false);
            }

            function closeTimeline(commit) {
                const done = scrub;
                scrub = null;
                timelinePanel.hidden = true;
                document.documentElement.classList.remove('tl-open');
                if (!done) return;
                placesFrozen = false;
                const tapped = !done.moved && Date.now() - done.started < 250;
                const item = done.lane && nearestItem(laneItems[done.lane], done.time);
                if (!commit || tapped || !item) {
                    // Nothing changes: the section and the place from before.
                    if (currentTab !== done.section) selectTab(done.section, false);
                    window.scrollTo({ top: done.scroll });
                    showHere();
                    placeTimeline();
                    return;
                }
                if (currentTab !== done.lane) selectTab(done.lane, false);
                storage('lesson-tab', done.lane);
                const element = revealItem(done.lane, item);
                if (element) {
                    scrollToItem(element, false);
                    flashItem(element);
                }
                savePlace();
                showHere();
                placeTimeline();
                if (done.lane !== done.section) navigated(done.back);  // another section: a step in the history
                else keepView();
            }

            rail.addEventListener('pointerdown', event => {
                if (event.button > 0) return;
                event.preventDefault();
                try {
                    rail.setPointerCapture(event.pointerId);  // keep the finger's moves when it leaves the bar
                } catch (_error) {
                    // the pointer is already gone; the moves still arrive while it is over the bar
                }
                openTimeline(event);
                moveTimeline(event);
            });
            rail.addEventListener('pointermove', event => { if (scrub) moveTimeline(event); });
            rail.addEventListener('pointerup', () => closeTimeline(true));
            rail.addEventListener('pointercancel', () => closeTimeline(false));

            // ------------------------------------------- go back (the history)
            // Every change of section (a tab, a symbol beside a time, a phrase,
            // the timeline) is a step in the browser's own history, so the
            // phone's Back button, the browser's back and forward arrows, a back
            // swipe and the ↩ button under the timeline all do the same thing:
            // return to the view exactly as it was left. Each history entry
            // holds its view (the section, its filter or view, the item at the
            // top of the screen and how far down it was); the current entry
            // follows the reader as they scroll, without adding entries. At the
            // page's first view Back leaves the page as usual. The address does
            // not change.
            const VIEW = 'lessonView';
            let depth = 0;        // steps back to the page's first view
            let backTab = null;   // the section one step back
            const goBack = document.createElement('button');
            goBack.className = 'go-back';
            goBack.type = 'button';
            goBack.hidden = true;
            goBack.setAttribute('data-no-speech', '');
            goBack.innerHTML = `${icons.goBack}<span class="go-to"></span>`;
            document.body.appendChild(goBack);

            function placeNow() {
                const place = { tab: currentTab, y: window.scrollY, item: null, filter: null, view: null };
                if (!currentTab) return place;
                if (currentTab === 'mistakes') place.filter = mistakeFilter();
                if (currentTab === 'vocabulary') place.view = vocabularyView();
                // The first item still on screen under the tabs, and its height on the screen.
                const limit = tabsBar.getBoundingClientRect().bottom;
                for (const element of document.getElementById('panel-' + currentTab).querySelectorAll('[data-item], .word[id]')) {
                    const box = element.getBoundingClientRect();
                    if (!box.height || box.bottom <= limit) continue;
                    place.item = { selector: element.id ? '#' + element.id : `[data-item="${element.dataset.item}"]`, top: box.top };
                    break;
                }
                return place;
            }

            // Browsers limit how often a page may write its history (Safari:
            // about 100 times in 30 s): the view is written at most twice a
            // second, and a refused write only makes Back less exact.
            let lastWrite = 0;
            let viewTimer = 0;
            function writeHistory(push, view) {
                const state = { [VIEW]: view, depth, backTab };
                try {
                    if (push) history.pushState(state, '');
                    else history.replaceState(state, '');
                    lastWrite = Date.now();
                    return true;
                } catch (_error) {
                    return false;  // no history here, or too many writes: the page works on
                }
            }

            function writeView(push) {
                clearTimeout(viewTimer);
                if (scrub || !currentTab) return false;  // not while the timeline is held
                return writeHistory(push, placeNow());
            }

            // The current entry follows the reader: 0.4 s after the page stops
            // moving, or after a filter or view changes.
            function keepView() {
                clearTimeout(viewTimer);
                viewTimer = setTimeout(function write() {
                    const wait = 500 - (Date.now() - lastWrite);
                    if (wait > 0) viewTimer = setTimeout(write, wait);
                    else writeView(false);
                }, 400);
            }

            // Another section was opened: the entry being left keeps the view
            // it was left at, and the new view is the next entry.
            function navigated(from) {
                clearTimeout(viewTimer);
                writeHistory(false, from);
                const before = { depth, backTab };
                depth += 1;
                backTab = from.tab;
                if (!writeView(true)) ({ depth, backTab } = before);
                showGoBack();
            }

            function showGoBack() {
                const lane = depth > 0 && LANES.find(([id]) => id === backTab);
                goBack.hidden = !lane;
                timeline.classList.toggle('has-back', Boolean(lane));
                if (!lane) return;
                const badge = goBack.querySelector('.go-to');
                if (badge.dataset.lane !== backTab) {
                    badge.dataset.lane = backTab;
                    badge.innerHTML = symbol(backTab);
                }
                goBack.title = `Back to ${lane[1]}`;
                goBack.setAttribute('aria-label', `Go back to ${lane[1]}`);
            }

            // The section as it was (its filter or view), then the same item at
            // the same height on the screen: the same scroll position, unless
            // something above it changed meanwhile (a "Show more" opened).
            function returnTo(place) {
                cancelAnimationFrame(glideFrame);
                if (currentTab !== place.tab) {
                    selectTab(place.tab, true);
                    // From the section's own place, so a quiz paused now keeps it.
                    if (places[place.tab] !== undefined) window.scrollTo(0, places[place.tab]);
                }
                if (place.filter) setMistakeFilter(place.filter);
                if (place.view) setVocabularyView(place.view);
                let top = place.y;
                let element = null;
                try {
                    element = place.item && document.querySelector(`#panel-${place.tab} ${place.item.selector}`);
                } catch (_error) {
                    element = null;  // a view saved by another version of the page: its scroll position is used
                }
                if (element && element.getClientRects().length) {

                const from = placeNow();
                cancelAnimationFrame(glideFrame);
                savePlace();

                if (switching) {
                    selectTab(section, true);
                    // From the section's own place, so a paused quiz keeps it.
                    if (places[section] !== undefined) window.scrollTo(0, places[section]);
                }
                const element = revealItem(section, item);
                if (element && element.getClientRects().length) {
                    window.scrollTo(0, centerGoal(element));
                    flashItem(element);
                }
                savePlace();
                showHere();
                placeTimeline();
                if (switching) navigated(from);

            document.addEventListener('click', event => {
                const jump = event.target.closest('.jump-btn');
                if (!jump) return;
                const item = nearestItem(laneItems[jump.dataset.lane], Number(jump.dataset.at));
                if (item) openSection(jump.dataset.lane, item);
            });

            // A tap on an underlined phrase opens its word card. It waits for a
            // possible second tap first: a double-tap still selects and speaks
            // a word of the phrase, and a selection is never interrupted.
            let phraseTap = null;
            function cancelPhraseTap() {
                if (!phraseTap) return;
                clearTimeout(phraseTap.timer);
                phraseTap.mark.classList.remove('pressing');
                phraseTap = null;
            }
            document.addEventListener('click', event => {
                const mark = event.target.closest('mark.expr[data-vocab]');
                if (!mark) return;
                cancelPhraseTap();
                if (event.detail > 1) return;  // a double click selects a word
                mark.classList.add('pressing');

                    mark,
                    timer: setTimeout(() => {
                        cancelPhraseTap();
                        const selection = window.getSelection();
                        if (selection && !selection.isCollapsed && selection.toString().trim()) return;

                while (end < text.length && inWord(text[end])) end++;

                    return;

                    cancelPhraseTap();  // the first tap was not meant to open a word card
                    const range = wordRangeAt(touch.clientX, touch.clientY);

            // Every section keeps its own place: going back to a section (or
            // opening the page again later) returns to where the reader was.
            const tabs = Array.from(document.querySelectorAll('.tab'));
            const placeKey = 'lesson-place:' + location.pathname;

                places[currentTab] = Math.round(window.scrollY);

            function goToTab(name) {

                savePlace();
                selectTab(name, true);
                const saved = places[name];
                if (saved !== undefined) window.scrollTo({ top: saved });
                else if (window.scrollY > contentTop()) window.scrollTo({ top: contentTop() });

                navigated(from);

            let placeTimer = 0;
            window.addEventListener('scroll', () => {
                clearTimeout(placeTimer);
                placeTimer = setTimeout(savePlace, 250);
                keepView();

            window.addEventListener('pagehide', savePlace);

            function selectTab(name, remember) {
                stopClip();
                currentTab = name;
                tabs.forEach(tab => {
                    const active = tab.dataset.tab === name;
                    tab.setAttribute('aria-selected', String(active));

                tab.addEventListener('keydown', event => {
                    const step = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;

                    const next = tabs[(index + step + tabs.length) % tabs.length];
                    next.focus();
                    goToTab(next.dataset.tab);
                });

            renderVocabulary();
            renderDialogues();
            const remembered = storage('lesson-tab');
            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
            placeTimeline();

            // to the page) wins over the sections' remembered places.
            const kept = history.state && history.state[VIEW];
            const firstView = kept && LANES.some(([id]) => id === kept.tab) ? kept : null;
            if (firstView) {

            placeTimeline();
            showGoBack();

                    return speak(text);
                };

            // which changes line lengths: the first view is put back in place
            // then, unless the reader has already moved.
            let readerMoved = false;
            ['pointerdown', 'wheel', 'keydown'].forEach(name =>

            window.addEventListener('load', () => {
                if (readerMoved || !firstPlace) return;
                returnTo(firstPlace);
                showHere();
                placeTimeline();
                writeView(false);
            });
        })();

(() => {
    'use strict';

    // Words play through Web Audio. When the word files cannot be read (a
    // page opened straight from the disk, file://), each word plays through
    // an <audio> element instead.

    const manifest = window.STATIC_VOICE_MANIFEST || {};
    if (!Object.keys(manifest).length) return;

    const fromDisk = window.location.protocol === 'file:';

    const state = {
        lastCapturedSelection: '',
        audioContext: null,
        currentSource: null,
        bufferCache: new Map(),
        session: 0,
        selectionTimer: null,
        pointerActive: false,
        pauseTimer: null,
        pauseResolve: null,
        elements: new Map(),
        currentElement: null,
        elementResolve: null
    };

    function normalizeKey(value) {
        return value
            .normalize('NFKC')
            .replace(/’/g, "'")
            .toLocaleLowerCase('en-US');
    }

    function normalizeSelectedText(value) {
        return value
            .replace(/ /g, ' ')
            .replace(/\r/g, '')
            .split(/\n+/)
            .map(line => line.replace(/[ \t]+/g, ' ').trim())
            .filter(Boolean)
            .join('\n')
            .trim();
    }

    function nodeExcludedFromSpeech(node) {
        if (!node) return false;
        const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
        return Boolean(element && element.closest('[data-no-speech]'));
    }

    function tokenize(text) {
        const expression = /[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu;
        const matches = Array.from(text.matchAll(expression));

        return matches.map((match, index) => {
            const end = match.index + match[0].length;
            const nextStart = index + 1 < matches.length ? matches[index + 1].index : text.length;
            return {
                key: normalizeKey(match[0]),
                after: text.slice(end, nextStart)
            };
        });
    }

    function getAudioContext() {
        if (!state.audioContext) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) throw new Error('This browser cannot play lesson audio.');
            state.audioContext = new AudioContextClass();
        }
        return state.audioContext;
    }

    function resolvePendingPause() {
        if (state.pauseTimer) window.clearTimeout(state.pauseTimer);
        state.pauseTimer = null;
        if (state.pauseResolve) state.pauseResolve();
        state.pauseResolve = null;
    }

    function cancelPlayback() {
        state.session += 1;
        resolvePendingPause();
        if (state.currentElement) state.currentElement.pause();
        if (state.elementResolve) state.elementResolve();
        if (!state.currentSource) return;
        try {
            state.currentSource.stop();
        } catch (_error) {
            // The word may have ended between the check and stop call.
        }
        state.currentSource = null;
    }

    async function loadBuffer(path) {
        if (state.bufferCache.has(path)) return state.bufferCache.get(path);

        const promise = (async () => {
            const response = await fetch(path, { cache: 'force-cache' });
            if (!response.ok) throw new Error(`An audio word could not be loaded (${response.status}).`);
            const data = await response.arrayBuffer();
            return getAudioContext().decodeAudioData(data.slice(0));
        })();

        state.bufferCache.set(path, promise);
        try {
            return await promise;
        } catch (error) {
            state.bufferCache.delete(path);
            throw error;
        }
    }

    function playBuffer(buffer, session) {
        return new Promise((resolve, reject) => {
            if (session !== state.session) {
                resolve();
                return;
            }

            const source = getAudioContext().createBufferSource();
            source.buffer = buffer;
            source.connect(state.audioContext.destination);
            state.currentSource = source;
            source.onended = () => {
                if (state.currentSource === source) state.currentSource = null;
                resolve();
            };

            try {
                source.start(0);
            } catch (error) {
                reject(error);
            }
        });
    }

    // From disk: one <audio> element per word, loaded ahead of time.
    function wordElement(path) {
        let audio = state.elements.get(path);
        if (!audio) {
            audio = new Audio(path);
            audio.preload = 'auto';
            state.elements.set(path, audio);
        }
        return audio;
    }

    function playElement(path, session) {
        return new Promise(resolve => {
            if (session !== state.session) {
                resolve();
                return;
            }
            const audio = wordElement(path);
            const finish = () => {
                audio.removeEventListener('ended', finish);
                audio.removeEventListener('error', finish);
                if (state.currentElement === audio) state.currentElement = null;
                if (state.elementResolve === finish) state.elementResolve = null;
                resolve();
            };
            audio.addEventListener('ended', finish);
            audio.addEventListener('error', finish);
            state.currentElement = audio;
            state.elementResolve = finish;
            audio.currentTime = 0;
            const started = audio.play();
            if (started && started.catch) started.catch(finish);
        });
    }

    function punctuationPause(text) {
        if (/[.!?]/.test(text)) return 230;
        if (/[;:]/.test(text)) return 145;
        if (/,/.test(text)) return 105;
        if (/\n/.test(text)) return 170;
        return 28;
    }

    function waitForPause(milliseconds, session) {
        return new Promise(resolve => {
            if (session !== state.session || milliseconds <= 0) {
                resolve();
                return;
            }
            state.pauseResolve = resolve;
            state.pauseTimer = window.setTimeout(() => {
                state.pauseTimer = null;
                state.pauseResolve = null;
                resolve();
            }, milliseconds);
        });
    }

    // Once the word files turn out to be unreadable (a page opened from the
    // disk), every word plays through an <audio> element.
    let useElements = fromDisk;

    async function speakWithElements(playable, first, session) {
        for (let index = first; index < playable.length; index += 1) {
            if (session !== state.session) return;
            for (let ahead = 1; ahead <= 4; ahead += 1) {
                const next = playable[index + ahead];
                if (next) wordElement(manifest[next.key]);
            }
            const token = playable[index];
            await playElement(manifest[token.key], session);
            await waitForPause(punctuationPause(token.after), session);
        }
    }

    async function speak(text) {
        try {
            if (useElements) {
                cancelPlayback();
                const session = state.session;
                await speakWithElements(tokenize(text).filter(token => manifest[token.key]), 0, session);
                return;
            }
            const audioContext = getAudioContext();
            const resumePromise = audioContext.resume();
            cancelPlayback();
            const session = state.session;
            const playable = tokenize(text).filter(token => manifest[token.key]);
            if (!playable.length) return;

            await resumePromise;
            const prefetch = index => {
                for (let offset = 0; offset < 8; offset += 1) {
                    const item = playable[index + offset];
                    if (item) loadBuffer(manifest[item.key]).catch(() => {});
                }
            };

            prefetch(0);
            for (let index = 0; index < playable.length; index += 1) {
                if (session !== state.session) return;
                prefetch(index + 1);
                const token = playable[index];
                let buffer;
                try {
                    buffer = await loadBuffer(manifest[token.key]);
                } catch (_error) {
                    useElements = true;
                    await speakWithElements(playable, index, session);
                    return;
                }
                if (session !== state.session) return;
                await playBuffer(buffer, session);
                await waitForPause(punctuationPause(token.after), session);
            }
        } catch (error) {
            console.warn('Lesson audio could not be played.', error);
        }
    }

    function captureSelection() {
        window.clearTimeout(state.selectionTimer);
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
            state.lastCapturedSelection = '';
            return false;
        }
        if (nodeExcludedFromSpeech(selection.anchorNode) || nodeExcludedFromSpeech(selection.focusNode)) return false;

        const text = normalizeSelectedText(selection.toString());
        if (!text || text === state.lastCapturedSelection) return false;
        state.lastCapturedSelection = text;
        speak(text);
        return true;
    }

    function primeAudio() {
        if (fromDisk) return;
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed) return;
        try {
            getAudioContext().resume();
        } catch (_error) {
            // Playback reports a useful browser error in the console if needed.
        }
    }

    document.addEventListener('selectionchange', () => {
        window.clearTimeout(state.selectionTimer);
        if (state.pointerActive) return;
        state.selectionTimer = window.setTimeout(captureSelection, 350);
    });
    document.addEventListener('pointerdown', event => {
        if (nodeExcludedFromSpeech(event.target)) return;
        state.pointerActive = true;
        window.clearTimeout(state.selectionTimer);
    });
    document.addEventListener('pointerup', event => {
        state.pointerActive = false;
        if (nodeExcludedFromSpeech(event.target)) return;
        primeAudio();
        window.setTimeout(captureSelection, 40);
    });
    document.addEventListener('pointercancel', () => {
        state.pointerActive = false;
    });
    document.addEventListener('touchstart', event => {
        if (nodeExcludedFromSpeech(event.target)) return;
        state.pointerActive = true;
        window.clearTimeout(state.selectionTimer);
    }, { passive: true });
    document.addEventListener('touchend', event => {
        state.pointerActive = false;
        if (nodeExcludedFromSpeech(event.target)) return;
        primeAudio();
        window.setTimeout(captureSelection, 70);
    }, { passive: true });
    document.addEventListener('keyup', event => {
        if (event.key === 'Shift' || event.shiftKey) captureSelection();
    });
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') cancelPlayback();
    });

    // Lets lesson pages attach play buttons to words and sentences.
    window.lessonVoice = { speak, stop: cancelPlayback };
})();
