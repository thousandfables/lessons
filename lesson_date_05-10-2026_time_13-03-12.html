,"at":3268.6,"dur":2.77}},{"term":"at the outset","pos":"idiom","definition":"at the very beginning of a process, period of time, or activity","time":3289.6,"lesson":"Semicolons and colons are possible in very rare sentences. However, those are not things we need at the outset.","examples":[{"sentence":"At the outset, we need to establish clear goals for the project.","pattern":"At the outset, [subject] + [verb]"},{"sentence":"I should have told you about the risks at the outset.","pattern":"at the outset (at the beginning)"},{"sentence":"The two companies agreed on the main terms at the outset of the negotiations.","pattern":"at the outset of + [noun phrase]"},{"sentence":"It is important to be honest with your clients at the outset.","pattern":""}],"more_examples":["At the outset, it's vital to understand the scope of the work.","We didn't realize how much funding we would need at the outset.","At the outset of the training, everyone received a handbook."],"synonyms":["from the start","initially","from the beginning","at first","right from the start","at the beginning"],"antonyms":["at the end","finally","ultimately","in the end","towards the end"],"gap":{"sentence":"The hike was incredibly exhausting, so we should have discussed the difficulty of the route _____.","answer":"at the outset","options":["at the outset","at the end","during the middle","constantly"]},"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/328952-329316.webm","at":3289.7,"dur":3.64}},{"term":"put someone in charge of something","pos":"expression","definition":"To give someone the responsibility or authority to manage or control something.","time":3461.2,"lesson":"I would say something like putting robots in charge of supervision. This is a better way to phrase it.","examples":[{"sentence":"The manager decided to put Sarah in charge of the new project.","pattern":""},{"sentence":"They put the local police in charge of maintaining order during the festival.","pattern":"put [organization] in charge of"},{"sentence":"You can put me in charge of the catering if you're too busy.","pattern":"put [someone] in charge of"}],"more_examples":["The school decided to put the headteacher in charge of the new safety initiative.","Who is going to put someone in charge of the warehouse during the holidays?","They put the committee in charge of organizing the charity gala."],"synonyms":["appoint someone to lead","task someone with","delegate responsibility to","entrust someone with","assign someone to","give someone oversight of","make someone responsible for"],"antonyms":["remove someone from charge","relieve someone of responsibility","take away responsibility from"],"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/346118-346409.webm","at":3461.4,"dur":2.91}},{"term":"emotional intelligence","pos":"noun phrase","definition":"The ability to understand and manage your own emotions and the feelings of others.","time":3565.3,"lesson":"Robots might leave us unemployed. However, jobs requiring a human touch, emotional intelligence, and empathy, as well as managerial positions, may be safer.","examples":[{"sentence":"A good leader needs high emotional intelligence to manage a team effectively.","pattern":""},{"sentence":"She has a lot of emotional intelligence; she always knows how to calm people down.","pattern":""},{"sentence":"The course helps students develop their emotional intelligence and communication skills.","pattern":""},{"sentence":"In many ways, emotional intelligence is just as important as IQ in the workplace.","pattern":""}],"countable":[{"meaning":"The ability to understand and manage your own emotions and the feelings of others.","example":"However, jobs requiring a human touch, emotional intelligence, and empathy, as well as managerial positions, may be safer.","lesson":true}],"uncountable":[{"meaning":"The capacity to perceive and respond to emotions","example":"The training program focuses on building emotional intelligence among healthcare workers."}],"more_examples":["Parents often say that emotional intelligence is key to raising well-adjusted children.","He struggled with his emotions until he started practicing emotional intelligence techniques.","Being able to read the room requires a high level of emotional intelligence."],"synonyms":["empathy","interpersonal skills","social awareness","self-awareness","people skills"],"antonyms":["lack of empathy","low emotional awareness","social awkwardness"],"gap":{"sentence":"Because she can sense how her colleagues are feeling and respond appropriately, she is known for her high _____.","answer":"emotional intelligence","options":["emotional intelligence","physical strength","academic knowledge","technical skill"]},"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/357166-357509.webm","at":3571.9,"dur":3.43}},{"term":"polished","pos":"adjective","definition":"Ideas or work that have been refined, improved, and made professional or sophisticated.","time":3650.7,"lesson":"It is nice to work with people who make fewer mistakes and produce more polished ideas.","examples":[{"sentence":"The presentation was very polished and impressed the investors.","pattern":"very + polished"},{"sentence":"You need to polish your speech before the final performance.","pattern":"verb form: to polish + object"},{"sentence":"Her writing style is polished and easy to follow.","pattern":"subject + be + polished"},{"sentence":"The team spent weeks refining the prototype to ensure a polished final product.","pattern":"polished + noun phrase"}],"more_examples":["The app's user interface looks much more polished than the first version.","She gave a polished response to the interviewer's difficult question.","We need to make sure the branding feels polished before the launch."],"synonyms":["refined","sophisticated","professional","seamless","elegant","streamlined","finished"],"antonyms":["unrefined","rough","amateur","crude","unpolished","unfinished"],"gap":{"sentence":"Although the initial draft was messy, the final version looked very _____ and professional for the meeting.","answer":"polished","options":["polished","rough","basic","hasty"]},"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/364856-365383.webm","at":3648.7,"dur":5.27}}],"dialogues":[{"title":"Moving house and a rude landlord","lines":[{"speaker":"A","text":"It's a beautiful day! Even though it's Monday, I'm actually feeling great today.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/000372-001581.webm","at":3.8,"dur":12.09}]},{"speaker":"B","text":"To be honest, I don't really care about weekdays. I only care about my days off.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/003966-005253.webm","at":39.8,"dur":12.87}]},{"speaker":"A","text":"I'm a bit worked up because we're looking to rent a new apartment. I'm actually moving tomorrow.","highlights":["worked up"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/007408-008637.webm","at":74.3,"dur":12.29}]},{"speaker":"B","text":"That's a shame. I'm happy for you, but I heard something unpleasant happened with your landlord.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/010510-011659.webm","at":105.3,"dur":11.49}]},{"speaker":"A","text":"She's been very rude. We had to pay three thousand rubles for electricity in just one month.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/012320-013801.webm","at":123.4,"dur":14.81}]},{"speaker":"B","text":"Did you discuss the electricity costs with her beforehand?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/016554-016819.webm","at":165.7,"dur":2.65}]},{"speaker":"A","text":"We did. She told us 1,500 rubles would be enough, but she lied because she knew we just arrived in Bali.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/016886-018168.webm","at":169.1,"dur":12.82}]},{"speaker":"A","text":"Her attitude in the messages was so tense. She kept sending question marks when I told her we'd pay later.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/023364-024537.webm","at":233.8,"dur":11.73}]},{"speaker":"B","text":"I thought she might have done something even crazier than that.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/025123-025813.webm","at":251.3,"dur":6.9}]},{"speaker":"A","text":"Not really. She just told me she was kicking out the neighbors next week because their dog was barking.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/026050-026716.webm","at":260.6,"dur":6.66}]},{"speaker":"B","text":"Does she speak English? Do you text her in English?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/029452-029921.webm","at":294.7,"dur":4.69}]},{"speaker":"A","text":"Yes, she does. She's a businesswoman who studied journalism in the UK, so she thinks she's very cool.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/030226-031694.webm","at":302.5,"dur":14.68}]}],"time":3.8,"topic":0},{"title":"Host families, kidnappings, and study habits","lines":[{"speaker":"A","text":"When my boyfriend mentioned he studied in Russia, this girl asked why he chose Russia. I felt she was being a bit self-entitled, considering I'm Russian.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/031676-032763.webm","at":316.9,"dur":10.87}]},{"speaker":"B","text":"I've never met a truly pleasant person. In every hotel or homestay we've stayed in, something always felt a bit off.","highlights":["felt a bit off"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/033814-035315.webm","at":338.3,"dur":15.01}]},{"speaker":"A","text":"Our current host family is different. The lady is so sweet! She sends photos of blankets to ask which one I prefer and even bought me a matching bracelet.","highlights":["so sweet"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/035578-036986.webm","at":355.9,"dur":14.08}]},{"speaker":"A","text":"She's so nice that I started worrying! Maybe she's planning to send us to a concentration camp or something.","highlights":["planning to"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/038212-039603.webm","at":382.4,"dur":13.91}]},{"speaker":"B","text":"I've heard stories about people being kidnapped for organs or sold into slavery in Thailand. I haven't heard of anything like that happening in Bali, but we'll see.","highlights":["sold into slavery"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/039694-041222.webm","at":397.0,"dur":15.28}]},{"speaker":"A","text":"If I disappear, look for me in Myanmar! You're my only hope. I think I have enough money to buy you off, but you'd technically be my slave.","highlights":["buy you off"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/042264-043787.webm","at":422.8,"dur":15.23},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/044050-044501.webm","at":440.7,"dur":4.51}]},{"speaker":"B","text":"I'm a professional cook, so I'd be expensive! I'm not sure you could afford me. If you did buy me, I'd have to pay off my debts for my whole life.","highlights":["pay off my debts"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/046980-048509.webm","at":470.0,"dur":15.29}]},{"speaker":"A","text":"You've been in Bali for three weeks and so much has happened. You always seem to attract crazy energies and adventures. It's never boring.","highlights":["attract crazy energies"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/050468-051932.webm","at":504.9,"dur":14.64}]},{"speaker":"B","text":"I'm really excited about my essay. The reading you gave me about AI and robots actually helped a lot. Reading and writing are definitely interconnected.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/053906-055348.webm","at":539.2,"dur":14.42}]},{"speaker":"A","text":"To limit my screen time, I put Instagram in a separate folder with TikTok and set a 30-minute daily limit with a password.","highlights":["screen time"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/057860-059348.webm","at":578.8,"dur":14.88}]}],"time":316.9,"topic":0},{"title":"Scrolling habits and biohacking","lines":[{"speaker":"A","text":"I used to have TikTok and Instagram right here. Now it says I need to buy a paid version for different articles.","highlights":["paid version"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/061740-063203.webm","at":617.5,"dur":14.63}]},{"speaker":"B","text":"Why is your phone in Spanish? I saw your Bybit screenshot in Spanish.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/065106-065995.webm","at":651.3,"dur":8.89}]},{"speaker":"A","text":"My Binance and Bybit are in Spanish because I don't know how to use crypto. I need to learn; it's a useful skill.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/066070-067466.webm","at":660.9,"dur":13.96}]},{"speaker":"B","text":"You're starting to use crypto more and reading books. It's a good habit. Do you actually enjoy reading so far?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/068104-069576.webm","at":681.2,"dur":14.72}]},{"speaker":"A","text":"I'm giving myself time and space. I need to overcome not liking it in order to like it.","highlights":["time and space"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/070242-071762.webm","at":702.6,"dur":15.2}]},{"speaker":"B","text":"If you had to choose, would you rather scroll TikTok or read a book?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/071926-072845.webm","at":719.5,"dur":9.19}]},{"speaker":"A","text":"I'd rather scroll because I love it. My feed is about Bali news and master's programs, which motivates me to get back to my studies.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/073534-074952.webm","at":735.4,"dur":14.18}]},{"speaker":"B","text":"Scrolling is addictive. It's a well-documented phenomenon. I'm not protected against it; it works the same way on me.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/078106-079652.webm","at":781.3,"dur":15.46}]},{"speaker":"A","text":"You're giving off the vibe of someone who wakes up at 6 a.m. to jog and do a biohacking routine.","highlights":["giving off the vibe"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/080566-082023.webm","at":805.9,"dur":14.57}]},{"speaker":"B","text":"I'm 40, by the way. You look 20, but ironically, I actually do all those things, though I don't scroll as much.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/084840-085910.webm","at":848.5,"dur":10.7}]},{"speaker":"A","text":"It learns what you like. It figured out I'm not into stupid memes, so it started recommending biohacking routines and chess reviews.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/087737-089174.webm","at":877.6,"dur":14.37}]}],"time":617.5,"topic":2},{"title":"Doomscrolling and research habits","lines":[{"speaker":"A","text":"I honestly find myself scrolling through random stuff all the time. It's like a guilty pleasure, but sometimes it just stops being fun.","highlights":["guilty pleasure"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/090814-092291.webm","at":908.2,"dur":14.77}]},{"speaker":"B","text":"I totally get that. It depends on the day. Sometimes I'm scrolling and think, 'This isn't even as entertaining as I imagined,' and I just close the app.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/096382-097700.webm","at":963.9,"dur":13.18}]},{"speaker":"A","text":"Exactly. Some days the TikTok feed is just terrible, and I'm like, 'I'm leaving.' Other days, the content really hits the mark.","highlights":["hits the mark"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/098484-099884.webm","at":985.0,"dur":14.0}]},{"speaker":"B","text":"I've actually tried to cut back. I realized I was spending four hours a day on Instagram and TikTok combined. That's a huge chunk of time.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/100700-102128.webm","at":1007.1,"dur":14.28}]},{"speaker":"A","text":"Everyone agrees that doomscrolling is bad, but when you're writing essays, you need to find ideas from somewhere. I don't judge; it's fine as long as it works.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/105448-106803.webm","at":1054.6,"dur":13.55}]},{"speaker":"B","text":"It really comes down to being curious. I especially like those investigation reels about crime stories; they feel like short documentary films.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/109028-110442.webm","at":1090.5,"dur":14.14}]},{"speaker":"A","text":"I agree. A TikTok can spark your interest, but you need to explore the topic at a deeper level to actually remember the information.","highlights":["spark your interest"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/113410-114837.webm","at":1134.2,"dur":14.27}]},{"speaker":"B","text":"Right, because if you just watch a short clip, you'll forget it in a day. You have to go to YouTube to get the full story.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/116430-117970.webm","at":1164.5,"dur":15.4}]},{"speaker":"A","text":"I like your approach of using an app that feeds you interesting short articles. That's definitely useful for research.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/118335-120138.webm","at":1183.5,"dur":18.03}]},{"speaker":"B","text":"So, what was the title of that last page? It was 'Robots will replace most human jobs in the future.'","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/120294-121625.webm","at":1203.1,"dur":13.31}]}],"time":908.2,"topic":2},{"title":"Discussing the AI essay and Russian content","lines":[{"speaker":"A","text":"By the way, just a spoiler: Claude said my essay on robots is my best one so far."},{"speaker":"B","text":"I'm not undermining your effort, but honestly, robots is one of the easiest topics I could give you.","highlights":["undermining your effort"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/124432-125414.webm","at":1244.5,"dur":9.82}]},{"speaker":"A","text":"Don't get too happy, though. You won't always get an easy topic on the IELTS test.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/127359-127700.webm","at":1273.8,"dur":3.41}]},{"speaker":"B","text":"Exactly. You never know what you'll get. Sometimes it's a walk in the park, and sometimes it's really tough.","highlights":["walk in the park"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/127810-128095.webm","at":1278.2,"dur":2.85},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/131890-132031.webm","at":1319.0,"dur":1.41}]},{"speaker":"A","text":"I only spent five minutes brainstorming my ideas, and I realized I forgot to include any examples.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/132606-133603.webm","at":1326.2,"dur":9.97}]},{"speaker":"B","text":"Five minutes? That's exactly how much time you're supposed to spend on it. I like how you touched on the social aspects of human nature.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/134494-134903.webm","at":1345.1,"dur":4.09},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/135446-136201.webm","at":1354.7,"dur":7.55}]},{"speaker":"A","text":"I also included emotions and empathy to open up the topic better. I feel like I'm starting to forget some English words lately.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/136360-137283.webm","at":1363.8,"dur":9.23},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/137526-138039.webm","at":1375.5,"dur":5.13}]},{"speaker":"B","text":"Like the word 'conceal'? You used it in the conclusion to describe hiding real intentions.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/140382-141194.webm","at":1404.0,"dur":8.12}]},{"speaker":"A","text":"That's a very relevant topic now, especially after the incident at OpenAI.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/142836-143987.webm","at":1428.5,"dur":11.51}]},{"speaker":"B","text":"A friend of mine who specializes in AI made a video in Russian about whether robots will eventually kill us.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/144580-146190.webm","at":1445.9,"dur":16.1}]},{"speaker":"A","text":"I watched a few minutes, but I don't trust Russian content enough to watch the whole thing.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/149182-149739.webm","at":1491.9,"dur":5.57}]},{"speaker":"B","text":"I only watch his stuff because we're friends. His video has exactly one like—mine.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/149870-150951.webm","at":1498.9,"dur":10.81}]}],"time":1244.5,"topic":2},{"title":"AI risks and grammar corrections","lines":[{"speaker":"A","text":"After reading about that incident where a thousand agents went rogue and started hacking servers, I felt compelled to rewatch the entire Terminator franchise.","highlights":["felt compelled"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/152900-153661.webm","at":1529.2,"dur":7.61}]},{"speaker":"B","text":"You definitely should. It's wild how those agents started hacking things just because they were looking for bugs without any humans involved.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/154468-155926.webm","at":1544.8,"dur":14.58},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/156424-156663.webm","at":1564.4,"dur":2.39}]},{"speaker":"A","text":"It's scary because I'm afraid humans will degenerate as programmers delegate more tasks to AI, eventually losing the ability to control it.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/157610-159214.webm","at":1576.2,"dur":16.04}]},{"speaker":"B","text":"It really is. A researcher mentioned that her team of three couldn't understand what was happening without the help of a ChatGPT agent.","highlights":["what was happening"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/161058-162535.webm","at":1610.7,"dur":14.77}]},{"speaker":"A","text":"That's terrifying! The agent sent over a million messages to each other. Anyway, let's move on. How did I rephrase that first sentence?","highlights":["move on"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/163322-164525.webm","at":1633.3,"dur":12.03},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/165486-165773.webm","at":1655.1,"dur":2.87}]},{"speaker":"B","text":"The title says 'replace' rather than 'lose jobs,' but I still think the sentence is a bit too short to stand alone.","highlights":["stand alone"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/166630-167384.webm","at":1666.5,"dur":7.54},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/169778-170434.webm","at":1698.0,"dur":6.56}]},{"speaker":"A","text":"I see. Well, you should merge your declaration of ideas with the first idea and start the next part with 'also.'","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/174768-175951.webm","at":1747.9,"dur":11.83}]},{"speaker":"B","text":"I'll do that. I'm also concerned about why you hyphenated that word. I thought it was supposed to be like that.","highlights":["I'll do that"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/176842-177188.webm","at":1768.6,"dur":3.46},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/178656-181245.webm","at":1789.2,"dur":25.89}]},{"speaker":"A","text":"We only hyphenate words when they act as adjectives, like 'high-performance machine.' Some nouns like 'well-being' just have to be memorized.","highlights":["act as adjectives"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/182512-183261.webm","at":1825.2,"dur":7.49},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/185116-185674.webm","at":1851.3,"dur":5.58}]},{"speaker":"B","text":"I get it now. I also noticed you spelled USA without any articles.","highlights":["I get it now"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/184806-185049.webm","at":1848.3,"dur":2.43},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/187998-188421.webm","at":1880.1,"dur":4.23}]}],"time":1529.2,"topic":3},{"title":"Improving IELTS writing examples","lines":[{"speaker":"A","text":"Are you sure this example was yours? I'm not sure, that's why I'm asking. It couldn't be you.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/188488-189190.webm","at":1885.1,"dur":7.02}]},{"speaker":"B","text":"Actually, I completely made this up out of nowhere. I swear, but it sounds very convincing.","highlights":["made this up"]},{"speaker":"A","text":"It does sound convincing. You might want to add a little more specificity, like mentioning customer support on a website or Amazon.","highlights":["add a little more specificity"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/195191-196820.webm","at":1952.1,"dur":16.29}]},{"speaker":"B","text":"I thought people prefer humans because they are intellectually more agile and better at understanding problems.","highlights":["intellectually more agile"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/199056-200230.webm","at":1990.8,"dur":11.74}]},{"speaker":"A","text":"You mentioned empathy and personality, but the connection between your ideas and the examples is a bit weak now.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/200529-201043.webm","at":2005.4,"dur":5.14},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/205856-206054.webm","at":2058.7,"dur":1.98}]},{"speaker":"B","text":"I couldn't think of a specific example for doctors and therapists, so I changed the second part of the paragraph.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/201694-203333.webm","at":2017.0,"dur":16.39},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/204982-205866.webm","at":2049.9,"dur":8.84}]},{"speaker":"A","text":"The workflow was perfect. You just need to tweak the idea slightly. You can simply say customer support.","highlights":["tweak the idea"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/207902-208378.webm","at":2079.2,"dur":4.76},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/210025-210407.webm","at":2100.4,"dur":3.82}]},{"speaker":"B","text":"The part about the AI takeover is interesting. Can you tell that I wrote this in only seven minutes?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/211540-212341.webm","at":2115.6,"dur":8.01},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/220018-220303.webm","at":2200.3,"dur":2.85}]},{"speaker":"A","text":"Writing a body paragraph in seven minutes is crazy. The example lacks a few facts, like which AI model or company was used.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/220728-221152.webm","at":2207.4,"dur":4.24},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/221778-223070.webm","at":2218.0,"dur":12.92}]},{"speaker":"B","text":"I'll mention OpenAI and a new protein prototype model. That should be enough for an IELTS test.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/225428-226517.webm","at":2254.5,"dur":10.89},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/226680-226917.webm","at":2267.0,"dur":2.37}]},{"speaker":"A","text":"Since it's an IELTS test and not a security paper, that's fine. However, how can we rephrase 'supervision' to something like 'managing'?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/229296-230397.webm","at":2293.2,"dur":11.01},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/232780-233682.webm","at":2328.0,"dur":9.02}]}],"time":1885.1,"topic":4},{"title":"Reviewing an essay on AI and robots","lines":[{"speaker":"A","text":"I don't quite get what you mean by delegating supervision. If we let AI oversee its own work, we're basically giving it total control.","highlights":["total control"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/234936-236315.webm","at":2349.5,"dur":13.79}]},{"speaker":"B","text":"Exactly. In my head, I see two AIs: one messes up and the other just gives it a pass without noticing any problems.","highlights":["gives it a pass"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/239918-241071.webm","at":2399.3,"dur":11.53}]},{"speaker":"A","text":"The supervision part isn't really in the text. We should either remove all mentions of supervision or add a sentence about a human stopping the AI.","highlights":["mentions of"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/243470-244823.webm","at":2434.8,"dur":13.53}]},{"speaker":"B","text":"But that scenario is hypothetical and doesn't actually happen. We should just remove it since the example is made up.","highlights":["made up"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/248378-249792.webm","at":2484.0,"dur":14.14}]},{"speaker":"A","text":"Wait, the second example actually happened. A domain was hacked. That makes total sense, so we should keep that and remove the other one.","highlights":["makes total sense"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/250008-251129.webm","at":2500.3,"dur":11.21},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/254904-255482.webm","at":2549.2,"dur":5.78}]},{"speaker":"B","text":"On a scale of one to nine, I'd rate your essay a 4.0. To score a seven, we need at least half of your sentences to be error-free.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/260174-260597.webm","at":2601.9,"dur":4.23},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/261258-262738.webm","at":2612.8,"dur":14.8}]},{"speaker":"A","text":"Let's look at the first sentence. 'Most people will lose their jobs in the future due to the progress of robot development.' That's completely natural.","highlights":["completely natural"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/263590-264300.webm","at":2636.1,"dur":7.1}]},{"speaker":"B","text":"The next part is okay, but if you stop and start a new sentence here, it will be correct. Currently, it's not.","highlights":["stop and start"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/266842-267784.webm","at":2668.5,"dur":9.42}]},{"speaker":"A","text":"When listing things like emotions, empathy, and personality, you should use an Oxford comma. It's a sign of formal writing, but it's not a mistake.","highlights":["sign of formal writing"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/268744-270183.webm","at":2687.5,"dur":14.39}]},{"speaker":"B","text":"In this sentence, the comma is redundant because it's already a mistake. Also, do you know what a complex sentence is?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/271361-273220.webm","at":2713.8,"dur":18.59}]}],"time":2349.5,"topic":4},{"title":"Grammar and vocabulary nuances","lines":[{"speaker":"A","text":"I love the name Alina. It sounds sophisticated and beautiful. But Ola? That feels much less cool.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/275138-275407.webm","at":2751.5,"dur":2.69}]},{"speaker":"B","text":"I don't know, it's a very simple name. I'm not an Ola, but I see what you mean.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/276088-276483.webm","at":2761.0,"dur":3.95}]},{"speaker":"A","text":"Actually, you told me before that you didn't like it when I called you Alina.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/278752-279344.webm","at":2787.6,"dur":5.92}]},{"speaker":"B","text":"A complex sentence needs at least two pairs of subject and verb, like 'I like flowers and flowers like me.'","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/281884-282621.webm","at":2819.0,"dur":7.37}]},{"speaker":"A","text":"In this sentence, 'jobs that require,' there is no verb in that part, so we should remove the comma.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/283310-284343.webm","at":2833.3,"dur":10.33}]},{"speaker":"B","text":"Why do we use 'would' here? It implies a habitual action in the past, which sounds like a mistake.","highlights":["habitual action"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/289510-290794.webm","at":2895.3,"dur":12.84}]},{"speaker":"A","text":"The phrase 'on a line' feels much more natural than 'on airline' in this context.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/299802-300149.webm","at":2998.2,"dur":3.47},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/300858-301317.webm","at":3008.8,"dur":4.59}]},{"speaker":"B","text":"You're right, 'on the line' is a standard collocation and an idiom.","highlights":["standard collocation"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/304342-306882.webm","at":3043.5,"dur":25.4}]},{"speaker":"A","text":"The word 'overtake' is very strong. It implies a desire to dominate or gain control, which feels a bit off for jobs.","highlights":["gain control"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/310944-312206.webm","at":3109.6,"dur":12.62}]},{"speaker":"B","text":"Just admit it, I'm not your favorite student and you hate me! We're only halfway through.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/320886-321928.webm","at":3209.0,"dur":10.42}]}],"time":2751.5,"topic":4},{"title":"Editing an essay on robot supervision","lines":[{"speaker":"A","text":"I need a moment to really think this through. It needs to simmer for a bit.","highlights":["think this through"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/322542-322867.webm","at":3225.6,"dur":3.25}]},{"speaker":"B","text":"Take your time. I agree that the real intentions of machines can be hidden.","highlights":["take your time"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/323107-323441.webm","at":3231.3,"dur":3.34}]},{"speaker":"A","text":"Exactly. That's why it's best to write sentences that aren't too long or too short.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/323694-324496.webm","at":3237.0,"dur":8.02}]},{"speaker":"B","text":"Right. And we should avoid using hyphens here. They are usually reserved for very specific cases.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/327290-328678.webm","at":3273.0,"dur":13.88}]},{"speaker":"A","text":"True. However, we do need a comma after the 'if' clause in this sentence.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/331628-332261.webm","at":3316.5,"dur":6.33}]},{"speaker":"B","text":"This sentence is error-free now. I like how you introduced the model here.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/333318-334118.webm","at":3333.4,"dur":8.0}]},{"speaker":"A","text":"The sentence about trusting robots to perform supervision sounds a bit off. 'Trusting the control' isn't quite right.","highlights":["sounds a bit off"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/338604-339538.webm","at":3386.2,"dur":9.34}]},{"speaker":"B","text":"I agree. We could use 'leaving supervision to robots' or 'having robots perform supervision' instead.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/347098-347965.webm","at":3471.2,"dur":8.67}]},{"speaker":"A","text":"I'm not sure we need 'will' here. It feels unnecessary.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/350828-351386.webm","at":3508.5,"dur":5.58}]},{"speaker":"B","text":"It's a prediction, so 'will' works. We're saying robots will leave us unemployed.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/356188-356710.webm","at":3562.1,"dur":5.22}]},{"speaker":"A","text":"We should mention that jobs requiring emotional intelligence and empathy remain in human hands.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/356738-357509.webm","at":3567.5,"dur":7.71},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/359522-359679.webm","at":3595.3,"dur":1.57}]},{"speaker":"B","text":"You're getting the vibe. It's nice to work with people who provide polished ideas.","highlights":["polished ideas"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/359700-360123.webm","at":3597.2,"dur":4.23},{"src":"lesson_audio/lesson_date_05-10-2026_time_13-03-12/364856-365383.webm","at":3648.7,"dur":5.27}]}],"time":3225.6,"topic":4}]};

                goBack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>'
            };

            // A section's symbol (drawn once at the top of the page).
            const symbol = section => `<svg class="sym" aria-hidden="true" focusable="false"><use href="#sym-${section}"/></svg>`;

            const lesson = LESSON || {};
            const meta = lesson.meta || {};
            const mistakes = lesson.mistakes || [];
            // Graded lessons: every card has a grade 1-7 (a card without one
            // gets the grade nearest its old level); otherwise the old levels.
            const hasGrade = card => Number.isInteger(card.grade) && card.grade >= 1 && card.grade <= 7;
            const graded = mistakes.some(hasGrade);
            const gradeOf = card => hasGrade(card) ? card.grade : ({ high: 4, medium: 5, low: 6 }[card.severity] || 5);
            const vocabulary = lesson.vocabulary || [];
            const dialogues = lesson.dialogues || [];

            // --------------------------------------------------------- helpers
            function esc(value) {
                return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
            }

            function norm(word) {
                return word.toLowerCase().replace(/’/g, "'").replace(/[^\p{L}\p{N}']/gu, '');
            }

            function stem(word) {
                let w = norm(word).replace(/'s$/, '');
                if (IRREGULAR[w]) return IRREGULAR[w];
                for (const suffix of ['ing', 'ied', 'ies', 'ed', 'es', 's', 'ly']) {
                    if (w.endsWith(suffix) && w.length - suffix.length >= 3) { w = w.slice(0, -suffix.length); break; }
                }
                return w.replace(/e+$/, '');
            }

            function playButton(text, label) {
                return `<button class="play" type="button" data-say="${esc(text)}" aria-label="${esc(label || 'Listen')}" data-no-speech>${icons.play}</button>`;
            }

            // A clip of the lesson recording: a pill with the time it was said,
            // which opens into a small player when tapped.
            function clipHtml(clip, label) {
                if (!clip || !clip.src) return '';
                const at = clock(clip.at);
                return `<span class="clip" data-src="${esc(clip.src)}" data-no-speech>`
                    + `<button class="clip-main" type="button" title="${esc(label)}" aria-label="${esc(label)}, ${at}">${icons.clipPlay}${icons.clipPause}<span>${at}</span></button>`
                    + '<span class="clip-more">'
                    + `<button class="clip-skip" type="button" data-skip="-3" title="Back 3 seconds" aria-label="Back 3 seconds">${icons.back3}</button>`
                    + '<span class="clip-bar" role="slider" tabindex="0" aria-label="Position in the clip" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="clip-fill"></span></span>'
                    + `<button class="clip-skip" type="button" data-skip="3" title="Forward 3 seconds" aria-label="Forward 3 seconds">${icons.forward3}</button>`
                    + '</span></span>';
            }

            // Word diff (longest common subsequence) between what was said and the fix.
            function diff(before, after) {
                const a = before.split(/\s+/).filter(Boolean);
                const b = after.split(/\s+/).filter(Boolean);
                const n = a.length, m = b.length;
                const table = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
                for (let i = n - 1; i >= 0; i--) {
                    for (let j = m - 1; j >= 0; j--) {
                        table[i][j] = norm(a[i]) === norm(b[j]) ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
                    }
                }
                const left = [], right = [];
                let i = 0, j = 0;
                while (i < n || j < m) {
                    if (i < n && j < m && norm(a[i]) === norm(b[j])) {
                        left.push({ word: a[i++], kind: 'same' });
                        right.push({ word: b[j++], kind: 'same' });
                    } else if (j >= m || (i < n && table[i + 1][j] >= table[i][j + 1])) {
                        const word = a[i];
                        const previous = i > 0 ? norm(a[i - 1]) : '';
                        const noise = FILLERS.has(norm(word)) || norm(word) === previous || !norm(word);
                        left.push({ word, kind: noise ? 'same' : 'del' });
                        i++;
                    } else {
                        // Mark where a missing word belongs, unless a deletion already shows the spot.
                        const last = left[left.length - 1];
                        if (!last || (last.kind !== 'del' && last.kind !== 'gap')) left.push({ kind: 'gap' });
                        right.push({ word: b[j++], kind: 'ins' });
                    }
                }
                const render = (tokens, tag) => tokens.map(t => {
                    if (t.kind === 'gap') return '<span class="gap" aria-hidden="true"></span>';
                    return t.kind === 'same' ? esc(t.word) : `<${tag} class="w">${esc(t.word)}</${tag}>`;
                }).join(' ').replace(/<\/(del|ins)> <\1 class="w">/g, ' ');
                return { said: render(left, 'del'), fixed: render(right, 'ins') };
            }

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {
                    if (!hit[index] && functional.has(norm(part))) {
                        const near = [index - 2, index + 2].some(k => hit[k]);
                        if (near) hit[index] = true;
                    }
                });
                return parts.map((part, index) => {
                    if (!hit[index]) return esc(part);
                    // Underline the word itself, not quotes or punctuation stuck to it.
                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                    return `${esc(before)}<b class="hl">${esc(core)}</b>${esc(after)}`;
                }).join('');
            }

            // link(phrase): the vocabulary entry of a highlighted phrase, or -1.
            function highlightPhrases(text, phrases, link) {
                const lower = text.toLowerCase();
                const ranges = [];
                (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length, phrase]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end, phrase]) => {
                    const word = link ? link(phrase) : -1;
                    const opens = word >= 0 ? ` data-vocab="${word}" title="${esc(`See “${vocabulary[word].term}” in Vocabulary`)}"` : '';
                    html += esc(text.slice(cursor, start)) + `<mark class="expr"${opens}>${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {
                    if (value === undefined) return window.localStorage.getItem(key);
                    window.localStorage.setItem(key, value);
                } catch (_error) {
                    return null;
                }
                return null;
            }

            // ---------------------------------------------------------- header
            document.getElementById('title').textContent = meta.title || 'Lesson review';

            // The lesson time in Moscow time (meta.start_utc: when the lesson
            // began, in seconds since 1970). A tap shows it in the reader's own
            // time zone instead, remembered on the phone. Older pages have no
            // start_utc: the date and time as recorded, with no zone.
            const eyebrow = document.getElementById('eyebrow');
            const lessonStart = typeof meta.start_utc === 'number' && isFinite(meta.start_utc) ? new Date(meta.start_utc * 1000) : null;
            let lessonTimes = null;
            let ownZone = storage('lesson-time-zone') === 'own';

            function zoneTime(zone) {
                const date = { day: 'numeric', month: 'long', year: 'numeric' };
                const time = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
                if (zone) { date.timeZone = zone; time.timeZone = zone; }
                return {
                    date: new Intl.DateTimeFormat('en-GB', date).format(lessonStart),
                    time: new Intl.DateTimeFormat('en-GB', time).format(lessonStart)
                };
            }

            function offsetName(minutes) {
                const size = Math.abs(minutes);
                if (!size) return 'GMT';
                return 'GMT' + (minutes < 0 ? '-' : '+') + Math.floor(size / 60) + (size % 60 ? ':' + String(size % 60).padStart(2, '0') : '');
            }

            if (lessonStart) {
                try {
                    const moscow = zoneTime('Europe/Moscow');
                    const own = zoneTime(null);
                    lessonTimes = {
                        moscow: Object.assign(moscow, { zone: 'MSK', name: 'Moscow time' }),
                        own: Object.assign(own, { zone: offsetName(-lessonStart.getTimezoneOffset()), name: 'your time' }),
                        differ: moscow.date !== own.date || moscow.time !== own.time
                    };
                } catch (_error) {
                    lessonTimes = null;  // no time zones in this browser: the time as recorded
                }
            }

            function showLessonTime() {
                let date = meta.date;
                if (!lessonTimes) {
                    eyebrow.textContent = ['English lesson', meta.date, meta.time].filter(Boolean).join(' · ');
                } else {
                    const shown = lessonTimes.differ && ownZone ? lessonTimes.own : lessonTimes.moscow;
                    const other = shown === lessonTimes.own ? lessonTimes.moscow : lessonTimes.own;
                    const time = `${esc(shown.time)} <span class="tz">${esc(shown.zone)}</span>`;
                    date = shown.date;
                    eyebrow.innerHTML = `English lesson · ${esc(shown.date)} · `
                        + (lessonTimes.differ
                            ? `<button class="tz-btn" type="button" title="Show ${esc(other.name)} (${esc(other.zone)})" aria-label="${esc(`${shown.time} ${shown.name}. Show ${other.name}, ${other.zone}`)}">${time}</button>`
                            : `<span class="tz-time">${time}</span>`);
                }
                document.title = (meta.title ? meta.title + ' · ' : '') + 'English lesson' + (date ? ' · ' + date : '');
            }
            showLessonTime();
            eyebrow.addEventListener('click', event => {
                if (!event.target.closest('.tz-btn')) return;
                ownZone = !ownZone;
                storage('lesson-time-zone', ownZone ? 'own' : 'moscow');
                showLessonTime();
                const button = eyebrow.querySelector('.tz-btn');
                if (button && event.detail === 0) button.focus();  // kept for the keyboard
            });

            document.getElementById('count-mistakes').textContent = mistakes.length;
            document.getElementById('count-vocabulary').textContent = vocabulary.length;
            document.getElementById('count-dialogues').textContent = dialogues.length;

            // -------------------------------------------------------- mistakes
            const topics = lesson.topics || [];
            // Each mistake example, word and dialogue line can be found by the timeline.
            const exampleIds = new Map();
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => exampleIds.set(example, `m-${c}-${e}`)));
            let showAllMistakes = () => {};
            let vocabularyToWords = () => {};
            // What "Go back" needs to put a section back as it was.
            let mistakeFilter = () => 'all';
            let setMistakeFilter = () => {};
            let vocabularyView = () => 'words';
            let setVocabularyView = () => {};

            function clock(seconds) {
                if (seconds === null || seconds === undefined) return '';
                const total = Math.max(0, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const rest = String(total % 60).padStart(2, '0');
                return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
            }

            function plain(text) {
                return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
            }

            // One example: when it was said, the full sentence(s) as said and
            // corrected, and (where it adds something) its own explanation.
            function exampleHtml(example, options) {
                const before = example.context || example.quote;
                const after = example.context_fix || example.fix;
                const d = diff(before, after);
                // The clip pill needs no separator: it stays apart from the topic when the line wraps.
                const pill = clipHtml(example.clip, 'Hear what was said');
                // The letters beside the time open the same moment in the other sections.
                const jumps = jumpsHtml('mistakes', example.clip ? example.clip.at : example.time);
                const facts = [];
                if (!pill && example.time !== null && example.time !== undefined) facts.push(`<span class="clock">${clock(example.time)}</span>${jumps}`);
                if (options.showTopic && topics[example.topic]) facts.push(`<span>${esc(topics[example.topic].title)}</span>`);
                let html = `<div class="pair" data-item="${exampleIds.get(example) || ''}"${options.hidden ? ' hidden' : ''}>`;
                const separator = jumps && !pill ? '' : '<span class="sep">·</span>';
                if (pill || facts.length) html += `<div class="ex-meta" data-no-speech>${pill}${pill ? jumps : ''}${facts.join(separator)}</div>`;
                html += `<div class="said"><span class="mark-icon" aria-label="What was said" data-no-speech>✗</span><span class="txt">${d.said}</span></div>`;
                html += `<div class="fixed"><span class="mark-icon" aria-label="Better" data-no-speech>✓</span><span class="txt">${d.fixed}</span>${playButton(after, 'Listen to the correct version')}</div>`;
                if (options.why) html += `<p class="ex-why">${esc(options.why)}</p>`;
                return html + '</div>';
            }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
                    html += items.map(item => `<li><span class="meaning">${esc(item.meaning)}</span><span class="m-ex">${highlightTerm(item.example, entry.term)}`
                        + (item.lesson ? ' <span class="from-lesson" data-no-speech>from the lesson</span>' : '') + '</span></li>').join('');
                    return html + '</ol></div>';
                };
                return '<div class="forms">'
                    + column('Countable', 'a / an, plural', entry.countable || [])
                    + column('Uncountable', 'no a / an, no plural', entry.uncountable || [])
                    + '</div>';
            }

            function relatedHtml(entry) {
                const row = (title, words) => (words || []).length
                    ? `<div class="rel"><p class="part-title" data-no-speech>${title}</p><span class="rel-words">${words.map(w => `<span class="rel-word">${esc(w)}</span>`).join('<span class="sep" data-no-speech> · </span>')}</span></div>`
                    : '';
                return row('Synonyms', entry.synonyms) + row('Antonyms', entry.antonyms);
            }

            // Visible: when it was said, the word, the meaning, the lesson's own
            // words and at least three examples. The rest opens on request.
            function wordCardHtml(entry, index) {
                const term = entry.term || '';
                let html = `<article class="card word" id="word-${index}"><div class="w-head">`;
                if (entry.clip) html += clipHtml(entry.clip, 'Hear it in the lesson');
                else if (entry.time !== null && entry.time !== undefined) html += `<span class="clock" data-no-speech>${clock(entry.time)}</span>`;
                html += jumpsHtml('vocabulary', entry.clip ? entry.clip.at : entry.time);
                // The word, its kind and its speaker stay together (a new row when
                // they do not fit); the kind and the speaker never part.
                html += `<div class="w-title"><h3 class="w-term">${esc(term)}</h3><span class="w-side">`;
                if (entry.pos) html += `<span class="w-pos" data-no-speech>${esc(entry.pos)}</span>`;
                html += playButton(term, 'Listen to ' + term) + '</span></div></div>';
                if (entry.definition) html += `<p class="def">${esc(entry.definition)}</p>`;
                const passage = entry.lesson || entry.lesson_example;
                if (passage) {
                    html += `<div class="lesson-ex"><div class="txt"><span class="src" data-no-speech>From the lesson</span>${highlightTerm(passage, term)}</div>${playButton(passage, 'Listen')}</div>`;
                }
                const examples = exampleItems(entry);
                if (examples.length) {
                    html += '<ul class="examples">' + examples.map(example => '<li>'
                        + (example.pattern ? `<span class="pat" data-no-speech>${esc(example.pattern)}</span> ` : '')
                        + highlightTerm(example.sentence, term) + '</li>').join('') + '</ul>';
                }
                if (entry.note) html += `<p class="note">${icons.bulb}<span>${esc(entry.note)}</span></p>`;

                const parts = [];
                if ((entry.countable || []).length || (entry.uncountable || []).length) parts.push(['forms', 'Countable / uncountable', formsHtml(entry)]);
                if ((entry.more_examples || []).length) {
                    parts.push(['more', 'More examples', '<p class="part-title" data-no-speech>More examples</p><ul class="examples">'
                        + entry.more_examples.map(s => `<li>${highlightTerm(s, term)}</li>`).join('') + '</ul>']);
                }
                const related = relatedHtml(entry);
                if (related) parts.push(['related', 'Synonyms & antonyms', related]);
                if (parts.length) {
                    html += '<div class="more-bar" data-no-speech>'
                        + parts.map(([id, name]) => `<button class="more-btn" type="button" data-part="${id}" aria-expanded="false">${name}</button>`).join('')
                        + '<button class="more-btn more-hide" type="button">Hide</button></div>';
                    html += parts.map(([id, , body]) => `<div class="more-part" data-part="${id}" hidden>${body}</div>`).join('');
                }
                return html + '</article>';
            }

            // Matching pairs: all the words, shuffled into rounds of about six;
            // the meanings are shuffled separately.
            function renderMatch(game) {
                const pool = shuffled(matchable);
                const roundCount = Math.ceil(pool.length / 6);
                const rounds = [];
                for (let r = 0, cursor = 0; r < roundCount; r++) {
                    const size = Math.floor(pool.length / roundCount) + (r < pool.length % roundCount ? 1 : 0);
                    rounds.push(pool.slice(cursor, cursor + size));
                    cursor += size;
                }
                let round = 0, misses = 0, picked = null;
                const missText = () => misses === 1 ? '1 mistake' : `${misses} mistakes`;

                function draw() {
                    const ids = rounds[round];
                    let html = `<div class="game-head" data-no-speech><span>Round ${round + 1} of ${rounds.length}</span><span class="game-score">${missText()}</span></div>`;
                    html += '<p class="game-hint" data-no-speech>Tap a word, then its meaning.</p>';
                    html += '<div class="match-board" data-no-speech><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile term" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].term)}</button>`).join('');
                    html += '</div><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile meaning" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].definition)}</button>`).join('');
                    html += '</div></div><div class="game-foot" data-no-speech></div>';
                    game.innerHTML = html;
                    picked = null;
                }

                function roundDone() {
                    const foot = game.querySelector('.game-foot');
                    if (round + 1 < rounds.length) {
                        foot.innerHTML = `<p>Round complete!</p><button class="game-btn" type="button" data-action="next-round">Next round</button>`;
                    } else {
                        foot.innerHTML = `<div class="summary"><p class="big">All ${pool.length} words matched</p><p>${missText()}</p>`
                            + '<button class="game-btn" type="button" data-action="restart">Play again</button></div>';
                    }
                    foot.querySelector('button').focus({ preventScroll: true });
                }

                game.addEventListener('click', event => {
                    const tile = event.target.closest('.tile');
                    if (tile && !tile.disabled) {
                        const side = tile.classList.contains('term') ? 'term' : 'meaning';
                        if (picked === tile) {
                            tile.setAttribute('aria-pressed', 'false');
                            picked = null;
                        } else if (!picked || picked.classList.contains(side)) {
                            if (picked) picked.setAttribute('aria-pressed', 'false');
                            picked = tile;
                            tile.setAttribute('aria-pressed', 'true');
                        } else {
                            const other = picked;
                            picked = null;
                            other.setAttribute('aria-pressed', 'false');
                            if (other.dataset.id === tile.dataset.id) {
                                [other, tile].forEach(t => { t.classList.add('done'); t.disabled = true; });
                                speak(vocabulary[Number(tile.dataset.id)].term);
                                if (!game.querySelector('.tile:not(.done)')) roundDone();
                            } else {
                                misses++;
                                game.querySelector('.game-score').textContent = missText();
                                [other, tile].forEach(t => {
                                    t.classList.remove('wrong');
                                    void t.offsetWidth; // restart the shake
                                    t.classList.add('wrong');
                                    setTimeout(() => t.classList.remove('wrong'), 450);
                                });
                            }
                        }
                        return;
                    }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next-round') { round++; draw(); }
                    if (action.dataset.action === 'restart') renderMatch(freshGame());
                });
                draw();
            }

            // Fill the gap: a new sentence, the word hidden, four options.
            function renderGap(game) {
                const order = shuffled(gapItems);
                let position = 0, score = 0;
                const missed = [];

                function draw() {
                    const { entry } = order[position];
                    const [before, after] = entry.gap.sentence.split(/_{3,}/);
                    let html = `<div class="game-head" data-no-speech><span>${position + 1} of ${order.length}</span><span class="game-score">${score} correct</span></div>`;
                    html += `<div class="card"><p class="gap-sentence">${esc(before)}<span class="blank" data-no-speech>&nbsp;</span>${esc(after || '')}</p>`;
                    html += '<div class="options" data-no-speech>'
                        + shuffled(entry.gap.options).map(o => `<button class="option" type="button" data-option="${esc(o)}">${esc(o)}</button>`).join('')
                        + '</div><div class="gap-result" hidden></div></div>';
                    game.innerHTML = html;
                }

                function answer(button) {
                    const { entry, index } = order[position];
                    const right = button.dataset.option === entry.gap.answer;
                    game.querySelectorAll('.option').forEach(b => {
                        b.disabled = true;
                        if (b.dataset.option === entry.gap.answer) b.classList.add('right');
                    });
                    if (right) score++;
                    else { button.classList.add('wrong'); missed.push(index); }
                    game.querySelector('.game-score').textContent = `${score} correct`;
                    const blank = game.querySelector('.blank');
                    blank.textContent = entry.gap.answer;
                    blank.classList.add('filled');
                    blank.removeAttribute('data-no-speech');
                    const full = entry.gap.sentence.replace(/_{3,}/, entry.gap.answer);
                    const last = position + 1 >= order.length;
                    const result = game.querySelector('.gap-result');
                    result.innerHTML = `<p class="verdict ${right ? 'ok' : 'no'}" data-no-speech>${right ? '✓ Correct' : `✗ The answer is “${esc(entry.gap.answer)}”`}</p>`
                        + `<p class="gap-def"><b>${esc(entry.term)}</b>: ${esc(entry.definition)}</p>`
                        + `<div class="gap-actions" data-no-speech>${playButton(full, 'Listen to the sentence')}`
                        + `<button class="game-btn secondary" type="button" data-word="${index}">See the word</button>`
                        + `<button class="game-btn" type="button" data-action="${last ? 'finish' : 'next'}">${last ? 'Finish' : 'Next'}</button></div>`;
                    result.hidden = false;
                    result.querySelector('[data-action]').focus({ preventScroll: true });
                }

                function finish() {
                    let html = `<div class="card summary"><p class="big">${score} of ${order.length}</p><p>${score === order.length ? 'Perfect!' : 'Words to review:'}</p>`;
                    if (missed.length) {
                        html += '<div class="missed" data-no-speech>' + missed.map(i => `<button class="chip" type="button" data-word="${i}">${esc(vocabulary[i].term)}</button>`).join('') + '</div>';
                    }
                    html += '<button class="game-btn" type="button" data-action="restart">Try again</button></div>';
                    game.innerHTML = html;
                }

                game.addEventListener('click', event => {
                    const option = event.target.closest('.option');
                    if (option && !option.disabled) { answer(option); return; }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next') { position++; draw(); }
                    if (action.dataset.action === 'finish') finish();
                    if (action.dataset.action === 'restart') renderGap(freshGame());
                });
                draw();
            }

            let freshGame = () => null;

            function renderVocabulary() {
                const panel = document.getElementById('panel-vocabulary');
                if (!vocabulary.length) {
                    panel.innerHTML = '<p class="empty">No new vocabulary in this lesson.</p>';
                    return;
                }
                const views = [['words', 'Words']];
                if (matchable.length >= 3) views.push(['match', 'Match']);
                if (gapItems.length) views.push(['gap', 'Fill the gap']);
