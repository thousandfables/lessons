<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;

:"lesson_audio/lesson_date_27-09-2026_time_15-18-34/189562-189924.webm","at":1895.7,"dur":3.62}},{"term":"mitigate","pos":"verb","definition":"To make something bad, such as a problem or a negative feeling, less severe.","time":1949.8,"lesson":"Does 'less intense' sound okay, or should I use 'mitigate racism'? I know the word 'mitigate,' but I'm not sure if it's the best wording here.","examples":[{"sentence":"The government is trying to mitigate the effects of the economic crisis.","pattern":"mitigate + the effects of"},{"sentence":"We can mitigate the risk by double-checking all the data.","pattern":"mitigate the risk"},{"sentence":"The new law was designed to mitigate the impact of pollution on the local community.","pattern":"mitigate the impact of"},{"sentence":"Wearing a seatbelt helps mitigate the severity of injuries during a car accident.","pattern":"mitigate the severity of"}],"more_examples":["The company offered a discount to mitigate the customers' frustration over the delay.","The medication is intended to mitigate the pain associated with chronic back issues."],"synonyms":["alleviate","lessen","ease","reduce","diminish","soften","moderate","lessen the impact of"],"antonyms":["aggravate","exacerbate","intensify","worsen","increase","heighten","magnify"],"gap":{"sentence":"The company offered a full refund to _____ the customer's anger after the delivery was delayed.","answer":"mitigate","options":["mitigate","increase","provoke","ignore"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/195196-195677.webm","at":1952.1,"dur":4.81}},{"term":"culturally unique","pos":"adjective phrase","definition":"possessing distinct characteristics or traditions that are specific to one particular culture.","time":2025.7,"lesson":"It is hard to formulate that, but perhaps we could describe it as culturally unique.","examples":[{"sentence":"The village is known for its culturally unique festivals.","pattern":""},{"sentence":"The museum showcases many culturally unique artifacts from the region.","pattern":""},{"sentence":"We want to preserve the culturally unique aspects of our local heritage.","pattern":""},{"sentence":"The city's architecture is culturally unique compared to the neighboring towns.","pattern":""}],"more_examples":["The chef tried to incorporate culturally unique spices into the modern fusion dish.","Many indigenous groups have culturally unique ways of communicating with nature.","The documentary highlights the culturally unique clothing worn during the harvest moon."],"synonyms":["ethnically distinct","culturally specific","unique to the culture","culturally idiosyncratic"],"antonyms":["culturally generic","homogenized"],"gap":{"sentence":"The restaurant serves traditional dishes that are _____, reflecting the specific customs and history of the local people.","answer":"culturally unique","options":["culturally unique","modern","generic","fast"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/203110-203543.webm","at":2031.3,"dur":4.33}},{"term":"formulate","pos":"verb","definition":"To put into words or express an idea or plan clearly and precisely.","time":2025.7,"lesson":"People will become less racist, or something like that. It is hard to formulate that idea as something culturally unique.","examples":[{"sentence":"The government is trying to formulate a new policy to tackle inflation.","pattern":"formulate + noun (plan/policy)"},{"sentence":"I need some time to formulate my thoughts before I answer your question.","pattern":"formulate + thoughts"},{"sentence":"They have formulated a strategy to increase sales by next quarter.","pattern":"have formulated (present perfect)"},{"sentence":"It's difficult to formulate a clear response when you are under pressure.","pattern":"formulate + adjective (clear/precise)"}],"more_examples":["The scientist spent months trying to formulate a hypothesis for the experiment.","Could you give me a moment to formulate a proper request for the s":["lack of clear instructions","wealth of clear instructions","variety of clear instructions","collection of clear instructions"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/203764-204216.webm","at":2037.8,"dur":4.52}},{"term":"ongoing process","pos":"noun phrase","definition":"A series of actions or changes that is currently happening and continues over time.","time":2138.7,"lesson":"The topic is becoming less important because it is an ongoing process.","examples":[{"sentence":"Learning a new language is an ongoing process that requires daily practice.","pattern":"Subject + is an ongoing process"},{"sentence":"The company is undergoing an ongoing process of restructuring its departments.","pattern":"undergoing an ongoing process of + -ing"},{"sentence":"We need to view social change as an ongoing process rather than a one-time event.","pattern":"view [something] as an ongoing process"},{"sentence":"The renovation of the old library is an ongoing process that will take months.","pattern":"ongoing process + that + [future tense]"}],"countable":[{"meaning":"A series of actions or changes that is currently happening and continues over time.","example":"The topic is becoming less important because it is an ongoing process.","lesson":true}],"uncountable":[],"more_examples":["Healing from a major surgery is an ongoing process that requires patience.","The transition to the new software system is an ongoing process.","Building a strong personal brand is an ongoing process, not an overnight success."],"synonyms":["continuous process","work in progress","evolving situation","ongoing development","gradual progression","dynamic process"],"antonyms":["one-time event","completed action","finished task","instantaneous change","final result"],"gap":{"sentence":"Healing from a serious injury is an _____ that requires patience and consistent physical therapy over several months.","answer":"ongoing process","options":["ongoing process","quick result","sudden change","brief moment"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/213918-214440.webm","at":2139.3,"dur":5.22}},{"term":"wage war","pos":"expression","definition":"To engage in a conflict or a state of hostility against someone or something.","time":2160.0,"lesson":"Should I change it? Wars will be waged, but not because of racism, because people generally hate each other.","examples":[{"sentence":"The two neighboring countries have waged war against each other for decades.","pattern":"wage war + against + someone"},{"sentence":"In the modern era, many companies wage war on each other for market dominance.","pattern":"wage war on (metaphorical use)"},{"sentence":"The government decided to wage war against the spread of misinformation.","pattern":"wage war against + abstract noun"},{"sentence":"Historians study how different empires waged war to expand their territories.","pattern":"past tense: waged war"}],"more_examples":["The tech giants are waging war over who will lead the AI revolution.","The non-profit organization is waging war on plastic pollution in the oceans.","Some activists argue that we need to wage war on systemic inequality."],"synonyms":["go to war","engage in conflict","fight against","combat","oppose","confront","battle","clash with"],"antonyms":["make peace","seek reconciliation","cooperate","harmonize","negotiate","ceasefire"],"gap":{"sentence":"The marketing department is trying to _____ against the rival brand to win back their loyal customers.","answer":"wage war","options":["wage war","make peace","build bridges","share secrets"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/216264-216635.webm","at":2162.7,"dur":3.71}},{"term":"distinguish between","pos":"verb","definition":"To show or explain the differences between two or more things.","time":2254.8,"lesson":"We need to talk about racism and then distinguish between how less racism leads to more unity and how it results in less bullying.","examples":[{"sentence":"It is sometimes difficult to distinguish between fact and opinion in news reports.","pattern":"distinguish between A and B"},{"sentence":"Can you distinguish the difference between these two types of coffee?","pattern":"distinguish the difference"},{"sentence":"The judge had to distinguish between a minor offense and a serious crime.","pattern":""}],"more_examples":["It's hard to distinguish between the two twins because they look so much alike.","The software helps users distinguish between different types of file formats.","Can you distinguish between a genuine leather bag and a synthetic one?"],"synonyms":["tell the difference between","differentiate between","tell apart","discriminate between","identify the difference between"],"antonyms":["confuse","mistake for"],"gap":{"sentence":"The two shades of blue are so similar that it is hard to _____ them.","answer":"distinguish between","options":["distinguish between","connect with","agree with","belong to"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/225282-226180.webm","at":2253.0,"dur":8.98}},{"term":"stronger bonds","pos":"noun phrase","definition":"closer and more solid connections between people in a group or society.","time":2259.2,"lesson":"We need to talk about racism and distinguish between two points: less racism means more unity and stronger bonds, while less racism also means less bullying.","examples":[{"sentence":"Living together in a small village helped create stronger bonds between the neighbors.","pattern":"create + stronger bonds"},{"sentence":"Shared experiences during the crisis forged stronger bonds among the team members.","pattern":"forged stronger bonds"},{"sentence":"The goal of the community project is to build stronger bonds between different generations.","pattern":"build stronger bonds"},{"sentence":"They have much stronger bonds than they did before the move.","pattern":"have + stronger bonds"}],"countable":[{"meaning":"closer and more solid connections between people in a group or society.","example":"We need to talk about racism and distinguish between two points: less racism means more unity and stronger bonds, while less racism also means less bullying.","lesson":true}],"uncountable":[],"more_examples":["Regular volunteer work helped the residents form stronger bonds with one another.","The holiday dinner was a great opportunity to create stronger bonds within the family.","Working on a difficult project together helped the colleagues develop stronger bonds."],"synonyms":["deeper connections","closer ties","tighter-knit relationships","mutual trust"],"antonyms":["weaker ties","fissures","estrangement","division","alienation"],"gap":{"sentence":"The local sports club organized a weekend retreat to help the members develop _____ after months of working together.","answer":"stronger bonds","options":["stronger bonds","harder tasks","longer hours","better grades"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/225694-226548.webm","at":2257.0,"dur":8.54}},{"term":"draw a parallel","pos":"expression","definition":"To point out the similarities between two different people, things, or situations.","time":2468.5,"lesson":"The sense of identity as a Cossack is becoming less important. Perhaps we can draw a parallel between that and recent immigrants, such as Italian people moving to the U.S.","examples":[{"sentence":"The author draws a parallel between the current economic crisis and the Great Depression.","pattern":"draw a parallel between A and B"},{"sentence":"You can draw a parallel between the two characters' motivations.","pattern":"draw a parallel between [noun]"},{"sentence":"It is easy to draw a parallel between the movie and the book it was based on.","pattern":"It is [adjective] to draw a parallel"},{"sentence":"The teacher drew a parallel between the historical war and modern-day conflicts.","pattern":"past tense: drew a parallel"}],"more_examples":["Many people draw a parallel between the rise of social media and the invention of the printing press.","The CEO tried to draw a parallel between the company's past success and its current growth strategy.","It is helpful to draw a parallel between your current symptoms and those of a common cold."],"synonyms":["make a comparison","compare","draw a comparison","liken","draw a connection","draw a comparison between"],"antonyms":["contrast","differentiate","distinguish","draw a distinction"],"gap":{"sentence":"The manager asked the team to _____ between the old project's failures and our current strategy to avoid repeating past mistakes.","answer":"draw a parallel","options":["draw a parallel","make a decision","give a speech","take a risk"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/246880-247438.webm","at":2468.9,"dur":5.58}},{"term":"relevant","pos":"adjective","definition":"connected or related to the topic being discussed or the situation at hand.","time":2593.6,"lesson":"For example, we can say that an immigration problem is very relevant in countries like the UK, Italy, or Spain.","examples":[{"sentence":"Please only include information that is relevant to the job application.","pattern":"relevant to + noun"},{"sentence":"The judge decided that the evidence was not relevant to the case.","pattern":"not relevant to"},{"sentence":"Is this question relevant to the topic we are discussing right now?","pattern":"relevant to the topic"},{"sentence":"The company is looking for candidates with relevant experience in marketing.","pattern":"relevant + noun (experience)"}],"more_examples":["I'm sorry, but that's not really relevant to what we're talking about.","The training program should provide skills that are relevant to the current industry trends.","Please make sure your comments are relevant to the main theme of the presentation."],"synonyms":["applicable","pertinent","related","germane","appropriate","material","connected"],"antonyms":["irrelevant","unrelated","extraneous","inapplicable"],"gap":{"sentence":"The manager asked me to skip the personal stories and only share information _____ to the project goals.","answer":"relevant","options":["relevant","unimportant","complex","hidden"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/260194-260559.webm","at":2602.1,"dur":3.65}},{"term":"from scratch","pos":"idiom","definition":"Starting something from the very beginning, without using anything that already exists.","time":2698.5,"lesson":"They are fully integrated into society because of their lack of national identity. Therefore, I will have to write this whole example from scratch.","examples":[{"sentence":"The chef had to start the recipe from scratch because the previous batch was ruined.","pattern":"start [something] from scratch"},{"sentence":"I didn't have any notes, so I had to write the entire essay from scratch.","pattern":"write [something] from scratch"},{"sentence":"If the software keeps crashing, we might have to rebuild the whole system from scratch.","pattern":"rebuild [something] from scratch"},{"sentence":"She built her successful business from scratch with no outside investment.","pattern":"build [something] from scratch"}],"more_examples":["I'm moving into a new apartment and need to decorate the living room from scratch.","Since the original data was corrupted, we had to re-enter every customer's information from scratch.","He didn't know how to play chess, so he had to learn the rules from scratch."],"synonyms":["from the ground up","from the beginning","from the bottom up","starting over","anew"],"antonyms":["from a template","pre-made","ready-made"],"gap":{"sentence":"Since the original design was completely lost, the team had to recreate the entire website _____.","answer":"from scratch","options":["from scratch","by mistake","in advance","for example"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/270116-270439.webm","at":2701.3,"dur":3.23}},{"term":"mindset","pos":"noun","definition":"A set of attitudes, beliefs, or ways of thinking that determines how someone behaves.","time":2809.5,"lesson":"It is more about different customs and different mindsets. Because they are from Morocco, they still have a Moroccan mindset that doesn't always fit into the Spanish cultural landscape.","examples":[{"sentence":"To succeed in this industry, you need to have a growth mindset.","pattern":"have a + [adjective] mindset"},{"sentence":"The company is trying to shift its mindset toward sustainability.","pattern":"shift one's mindset"},{"sentence":"He has a very positive mindset despite the challenges he faces.","pattern":"have a very [adjective] mindset"},{"sentence":"It's hard to change someone's mindset overnight.","pattern":"change someone's mindset"}],"countable":[{"meaning":"A set of attitudes, beliefs, or ways of thinking that determines how someone behaves.","example":"Because they are from Morocco, they still have a Moroccan mindset that doesn't always fit into the Spanish cultural landscape.","lesson":true},{"meaning":"A person's mental state or current way of thinking","example":"She has a very different mindset when it comes to parenting."}],"uncountable":[],"more_examples":["Adopting a proactive mindset can help you stay ahead of potential problems.","The coach tried to instill a winning mindset in the team before the finals.","You need to develop a more open mindset if you want to learn from others."],"synonyms":["attitude","outlook","perspective","frame of mind","way of thinking","disposition","mentality"],"antonyms":[],"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/280696-281704.webm","at":2807.1,"dur":10.08}},{"term":"partly disappear","pos":"verb phrase","definition":"To become less visible or common, but not completely vanish.","time":3185.6,"lesson":"The traditions are not fully erased. They can partly disappear. That is a much softer way of putting it.","examples":[{"sentence":"Some of the original features of the building have partly disappeared over time.","pattern":"present perfect + have partly disappeared"},{"sentence":"The local dialect might partly disappear as younger generations move to the city.","pattern":"modal verb + partly disappear"},{"sentence":"While the custom hasn't vanished, it has partly disappeared from daily life.","pattern":""}],"more_examples":["The mountains partly disappear behind the clouds during the storm.","The brand's popularity has partly disappeared since the new competitor arrived.","The old road partly disappears into the forest as you drive further north."],"synonyms":["fade","diminish","wane","recede","subside","dwindle"],"antonyms":["emerge","appear","become more visible"],"gap":{"sentence":"The mountains have _____ behind the thick fog, making it difficult for the hikers to see the path.","answer":"partly disappeared","options":["partly disappeared","moved closer","suddenly grew","became sharper"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/318862-319066.webm","at":3188.8,"dur":2.04}},{"term":"polish","pos":"verb","definition":"To improve, refine, or make a plan or idea better and more complete.","time":3255.6,"lesson":"What do you mean you will not explore real Spain? This idea needs polishing, definitely.","examples":[{"sentence":"You should polish your presentation before the meeting tomorrow.","pattern":"polish + object"},{"sentence":"The author spent weeks polishing the final chapter of the novel.","pattern":""},{"sentence":"The draft is good, but it needs a bit of polishing to be professional.","pattern":"need + polishing"},{"sentence":"He is polishing his skills by practicing every day.","pattern":"polish + skills"}],"more_examples":["I need to polish my speech before I go on stage.","Could you help me polish this proposal to make it more persuasive?","She spent the afternoon polishing her research paper for the conference."],"synonyms":["refine","improve","fine-tune","perfect","enhance","touch up","flesh out"],"antonyms":["ruin","neglect","damage","mess up"],"gap":{"sentence":"The initial draft of the proposal was quite good, but I need to _____ the details before submitting it to the board.","answer":"polish","options":["polish","ignore","block","break"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/325564-325891.webm","at":3255.8,"dur":3.27}},{"term":"take one's eyes off (something)","pos":"idiom","definition":"To stop looking at someone or something because it is very attractive or interesting.","time":3333.6,"lesson":"Your hair looks good today. I can't take my eyes off your hair.","examples":[{"sentence":"The movie was so intense that I couldn't take my eyes off the screen.","pattern":"can't take my eyes off + object"},{"sentence":"You must not take your eyes off the baby for even a second.","pattern":"take your eyes off + object"},{"sentence":"I was so mesmerized by the dancer that I couldn't take my eyes off her.","pattern":""},{"sentence":"He was staring at the painting, unable to take his eyes off it.","pattern":"unable to take one's eyes off"}],"more_examples":["The puppies were so cute that I couldn't take my eyes off them.","Once the magician started his trick, the audience couldn't take their eyes off his hands.","The sunset was so breathtakingly beautiful that I couldn't take my eyes off the horizon."],"synonyms":["be mesmerized by","be captivated by","be glued to","be transfixed by","be spellbound by","be fascinated by"],"antonyms":["look away","ignore"],"gap":{"sentence":"The street performer's juggling skills were so incredible that I couldn't _____ for a moment.","answer":"take my eyes off him","options":["take my eyes off him","close my eyes to him","hide from him","speak to him"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/333368-333695.webm","at":3333.8,"dur":3.27}}],"dialogues":[{"title":"Volunteering at a festival","lines":[{"speaker":"A","text":"Can you hear me okay? I think the connection is a bit worse than it was a few minutes ago.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/000316-001843.webm","at":3.3,"dur":15.27}]},{"speaker":"B","text":"All good! So, during our last lesson, we were still in the preparation week for the festival. I told you some stories about how we weren't treated very well.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/002032-003460.webm","at":20.4,"dur":14.28}]},{"speaker":"A","text":"Right, but that passed quickly and the festival week began. I was working in a protocol position, which had four different roles.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/003940-005411.webm","at":39.5,"dur":14.71}]},{"speaker":"B","text":"Like being at the airport to meet newcomers and help with transport, or working at hotels, or even at the venue itself.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/006110-007460.webm","at":61.3,"dur":13.5}]},{"speaker":"A","text":"At the venue, you could work at the information desk, navigating people or accompanying them around the territory.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/007440-008352.webm","at":74.5,"dur":9.12}]},{"speaker":"B","text":"When you say 'navigating desk,' I imagine a little hobbit sitting at the desk, telling people to turn right and go straight.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/008332-009780.webm","at":83.4,"dur":14.48}]},{"speaker":"A","text":"I actually meant 'at the desk.' I was working at the information desk, but I think I said 'in the desk.'","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/011332-012480.webm","at":113.4,"dur":11.48}]},{"speaker":"B","text":"I see. And 'accompanying people' is the most interesting position. It's like being a stalker, following them around.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/013736-015154.webm","at":137.6,"dur":14.18}]},{"speaker":"A","text":"Not really stalking! We knew their schedules and accompanied them to meeting rooms, VIP lounges, or even to their hotels and other places in the city.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/015540-016988.webm","at":155.5,"dur":14.48}]},{"speaker":"B","text":"We were working with important guests, like ministers. How did you manage to get a position working with VIPs?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/018370-019925.webm","at":183.8,"dur":15.55}]},{"speaker":"A","text":"I have no idea. I just got a message saying I'd be there. Maybe they reconsidered me for a more important role since I was denied the 'atasha' position.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/019984-021529.webm","at":200.0,"dur":15.45}]},{"speaker":"B","text":"I'm not sure how the selection process works. When I volunteered in Sochi two years ago, I was 18 and was given an important 'atasha' role.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/023482-024754.webm","at":235.0,"dur":12.72}]},{"speaker":"A","text":"Anyway, we were assigned certain locations. The curators were deciding who would work with the Russian VIPs versus the foreign ones.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/025504-026851.webm","at":255.2,"dur":13.47}]},{"speaker":"B","text":"Of course, I wanted to work with the foreigners, but those spots went to people who spoke other languages at a very high level, not just English.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/030330-031726.webm","at":303.4,"dur":13.96}]},{"speaker":"A","text":"Exactly. We even had a guy who spoke Thai.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/032248-033867.webm","at":322.6,"dur":16.19}]}],"time":3.3,"topic":0},{"title":"Language skills and MacBook performance","lines":[{"speaker":"A","text":"When you say 'Lao', are you referring to the country or the language spoken by the Lao people?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/034066-035369.webm","at":340.9,"dur":13.03}]},{"speaker":"B","text":"Both, of course. In that group, there were many cool guys from Gemoy University, including a few who spoke Arabic at a very high level.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/035536-036974.webm","at":355.5,"dur":14.38}]},{"speaker":"A","text":"I decided not to mention that I speak Spanish because I don't feel comfortable doing so yet; my level isn't professional enough.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/038302-039587.webm","at":383.1,"dur":12.85}]},{"speaker":"B","text":"Did anyone actually check the skills of the guy who claimed to speak Thai? It would be a daunting task to verify that.","highlights":["daunting task"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/039714-040404.webm","at":397.3,"dur":6.9},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/041476-042206.webm","at":414.9,"dur":7.3}]},{"speaker":"A","text":"A friend of mine was supposed to work with the Latino team because he's fluent in Spanish, but he ended up handing over a Mexican woman to me.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/043432-044898.webm","at":434.5,"dur":14.66}]},{"speaker":"B","text":"Was the person in charge allowed to reassign people like that? It wasn't that strict, I'd say.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/046270-047909.webm","at":462.8,"dur":16.39}]},{"speaker":"A","text":"My connection is lagging. It might be the internet, or maybe the script running on my computer is eating up all the resources.","highlights":["eating up"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/050048-051198.webm","at":500.7,"dur":11.5}]},{"speaker":"B","text":"Are you using a MacBook now? Some people treat them like a showpiece, like a fancy dish on a shelf that never gets used.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/051210-051672.webm","at":512.2,"dur":4.62},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/056664-057266.webm","at":566.7,"dur":6.02}]},{"speaker":"A","text":"I actually use mine! I feel a sense of satisfaction every time I touch the interface and see how smoothly everything works.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/060334-061484.webm","at":603.4,"dur":11.5}]},{"speaker":"B","text":"Have you seen what's happening on my screen? I have so many tabs open, and the script is taking up almost all of the GPU.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/062080-063625.webm","at":621.0,"dur":15.45}]},{"speaker":"A","text":"That map is an app I'm developing to optimize routing for a delivery system.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/065766-067059.webm","at":657.8,"dur":12.93}]}],"time":340.1,"topic":1},{"title":"Logistics Algorithms and Mexican Accents","lines":[{"speaker":"A","text":"So, the app is designed to find the best route for deliveries. For example, if a pizza chain has ten cafes in a city, it has to manage constant orders and deliver them within an hour.","highlights":["manage constant orders"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/073362-073933.webm","at":733.7,"dur":5.71},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/074186-075409.webm","at":742.1,"dur":12.23}]},{"speaker":"B","text":"I see. I think I overcomplicated the system. It's struggling because there are too many variables, but if I add another vehicle, it should find a solution.","highlights":["overcomplicated the system"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/076338-077736.webm","at":763.5,"dur":13.98}]},{"speaker":"A","text":"It actually found a solution! It's assigning routes to our seven trucks. Every truck has its own specific job to do.","highlights":["assigning routes"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/079698-081335.webm","at":797.2,"dur":16.37}]},{"speaker":"B","text":"I'm worried the MacBook won't handle it. If the RAM fails, I'd just have to buy a replacement, which costs about 10,000 rubles.","highlights":["handle it"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/083508-084972.webm","at":835.2,"dur":14.64}]},{"speaker":"A","text":"Wait, the connection froze again. Can you see me now? It seems to be working stably.","highlights":["working stably"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/086586-087931.webm","at":866.0,"dur":13.45}]},{"speaker":"B","text":"To finish my story, I started working with international guests daily. I spent four hours with a Mexican woman helping with her accreditation and transport.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/089334-089635.webm","at":893.4,"dur":3.01},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/089918-091384.webm","at":899.4,"dur":14.66}]},{"speaker":"A","text":"We spoke mostly in English, but she spoke a lot of Spanish too. I realized her accent is very clear and she didn't simplify her language for me at all.","highlights":["simplify her language"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/093224-094053.webm","at":932.3,"dur":8.29},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/097362-097718.webm","at":973.7,"dur":3.56}]},{"speaker":"B","text":"Then I met two women from Venezuela. One was a high-ranking government official, a vice minister of youth policy. They were amazing ladies.","highlights":["high-ranking government"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/098478-099508.webm","at":984.9,"dur":10.3}]}],"time":733.7,"topic":2},{"title":"Translating at a Russian Summit","lines":[{"speaker":"A","text":"It would be funny to ask the government if they feel empty lately, since you were there!","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/101130-102355.webm","at":1011.4,"dur":12.25}]},{"speaker":"B","text":"I actually tried speaking to them formally at first, but they told me to just use an unofficial tone.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/102482-103980.webm","at":1024.9,"dur":14.98}]},{"speaker":"B","text":"The minister preferred Spanish, but I had the most interesting experience during the closing ceremony in that massive concert hall.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/105420-106266.webm","at":1054.3,"dur":8.46}]},{"speaker":"B","text":"I managed to sneak in and watch from the VIP lounge while they were munching on some very expensive cakes.","highlights":["sneak in"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/107684-109345.webm","at":1076.9,"dur":16.61}]},{"speaker":"B","text":"I was shocked to find myself translating the ceremony into Spanish! I ended up becoming a sort of VIP attaché.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/111236-112705.webm","at":1112.5,"dur":14.69}]},{"speaker":"A","text":"I have so much respect for people who speak more than two languages. It's impressive.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/116118-117079.webm","at":1161.4,"dur":9.61}]},{"speaker":"B","text":"To be honest, I'm still not that great. When my friends speak all at once, it's just white noise to me.","highlights":["white noise"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/118200-119594.webm","at":1182.1,"dur":13.94}]},{"speaker":"A","text":"It's hard to judge your own level. You might be just two months away from a huge leap in your understanding.","highlights":["huge leap"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/124388-125781.webm","at":1244.0,"dur":13.93}]},{"speaker":"B","text":"I think I'm around the B1 level in Spanish, based on the textbook I'm using.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/129362-130134.webm","at":1293.7,"dur":7.72}]},{"speaker":"A","text":"The whole event was about Russia's soft power—showing the world that they are a developed country with lots of innovations.","highlights":["soft power"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/132650-134127.webm","at":1326.6,"dur":14.77}]}],"time":1011.4,"topic":3},{"title":"Russian Festival and IELTS Preparation","lines":[{"speaker":"A","text":"The festival featured enormous pavilions showcasing Russia's development, along with a walking robot that could actually dance with people.","highlights":["showcasing Russia's development"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/135098-136296.webm","at":1351.1,"dur":11.98},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/137126-137612.webm","at":1371.4,"dur":4.86}]},{"speaker":"B","text":"I heard they even recruited random people from places like Venezuela to visit Russia for two weeks with all expenses covered.","highlights":["all expenses covered"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/139688-140896.webm","at":1397.1,"dur":12.08}]},{"speaker":"A","text":"The VIPs were there for official business, like signing documents and negotiating, but they probably couldn't explain the event's true purpose.","highlights":["official business"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/142256-143614.webm","at":1422.7,"dur":13.58}]},{"speaker":"B","text":"Exactly. They just signed papers about eternal friendship and unbreakable ties, and we'll have to see if any projects actually come to life.","highlights":["come to life"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/145250-146471.webm","at":1452.6,"dur":12.21}]},{"speaker":"A","text":"At least you made some new connections. I'm actually heading to Moscow in two weeks to meet some people I met at the festival.","highlights":["new connections"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/149164-150138.webm","at":1491.7,"dur":9.74}]},{"speaker":"B","text":"We're on the national identity essay now. We've already covered the most complicated types, so we only have two left.","highlights":["covered the most complicated types"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/151324-151858.webm","at":1513.3,"dur":5.34},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/154602-155115.webm","at":1546.2,"dur":5.13}]},{"speaker":"A","text":"The only difference in the next one is weighing the advantages against the disadvantages, and the problem-solution essay isn't that hard.","highlights":["weighing the advantages"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/155460-156265.webm","at":1554.8,"dur":8.05},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/158106-158479.webm","at":1581.3,"dur":3.73}]},{"speaker":"B","text":"I've decided to postpone my master's for a year to save up some money and get my dental work finished.","highlights":["postpone my master's"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/160446-161822.webm","at":1604.6,"dur":13.76}]},{"speaker":"A","text":"I'll have more time to prepare for the IELTS then. Do you have any trips planned for the future?","highlights":["prepare for the IELTS"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/163408-164376.webm","at":1634.2,"dur":9.68}]},{"speaker":"B","text":"I actually bought tickets to Tashkent with some friends for the end of November.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/165018-166191.webm","at":1650.3,"dur":11.73}]},{"speaker":"A","text":"The national identity essay is tricky because everyone has their own definition of what it means.","highlights":["their own definition"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/167548-168412.webm","at":1675.6,"dur":8.64}]}],"time":1351.1,"topic":3},{"title":"Refining an academic essay on racism","lines":[{"speaker":"A","text":"I think the idea of people feeling more united is a standard way to approach the topic of eliminating racism.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/169358-170096.webm","at":1693.7,"dur":7.38}]},{"speaker":"B","text":"Coming up with ideas is easy, but finding specific examples for an academic essay is much harder.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/171052-171640.webm","at":1710.6,"dur":5.88}]},{"speaker":"A","text":"Regarding the phrase 'where a person comes from,' we could clarify it by saying 'where a person's family originally comes from.'","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/179948-180655.webm","at":1799.6,"dur":7.07}]},{"speaker":"B","text":"In academic writing, it's important to avoid being too radical. Instead of saying racism 'will disappear,' we should use softer language.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/189477-189924.webm","at":1894.9,"dur":4.47}]},{"speaker":"A","text":"Right, saying racism will be 'less intense' or 'mitigated' sounds more balanced than making a definitive prediction.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/191510-192675.webm","at":1915.2,"dur":11.65}]},{"speaker":"B","text":"We could also say that people will become less racist, though that can be tricky to formulate perfectly.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/200404-201227.webm","at":2004.2,"dur":8.23},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/202104-202564.webm","at":2021.2,"dur":4.6}]},{"speaker":"A","text":"The word 'lack' is countable here, specifically referring to a 'lack of national identity.'","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/203764-205047.webm","at":2037.8,"dur":12.83}]},{"speaker":"B","text":"And about bullying—we should clarify that while it might not be racially motivated, it could still stem from pure hatred.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/209564-210045.webm","at":2095.7,"dur":4.81},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/211600-212547.webm","at":2116.1,"dur":9.47}]},{"speaker":"A","text":"So, we'll say wars will be waged, but not because of racism, since people generally hate each other for other reasons.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/216174-216846.webm","at":2161.9,"dur":6.72}]},{"speaker":"B","text":"I like this body paragraph because it's very logical and the points are well-connected.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/222432-223024.webm","at":2224.4,"dur":5.92}]}],"time":1693.7,"topic":4},{"title":"National Identity and Racism in Schools","lines":[{"speaker":"A","text":"You've found a way to link two distinct reasons: tourism and less bullying, both of which stem from a decrease in racism.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/223096-224374.webm","at":2231.1,"dur":12.78}]},{"speaker":"B","text":"We could clarify that less racism leads to stronger bonds and fewer instances of bullying.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/225836-226548.webm","at":2258.5,"dur":7.12}]},{"speaker":"A","text":"I'm finding it hard to make the point about national identity convincing. How can I prove there is less racism?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/228066-229626.webm","at":2280.8,"dur":15.6}]},{"speaker":"B","text":"Right now, it feels a bit random. If we swapped the UK and Russia for the US and Canada, the argument wouldn't change.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/229652-230489.webm","at":2296.6,"dur":8.37}]},{"speaker":"A","text":"I could use my example of Italian kids in American schools. In a typical US classroom, people of all races are present and it's completely normal.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/232410-233569.webm","at":2324.3,"dur":11.59}]},{"speaker":"B","text":"That's true, but in Russian schools, it's different. I grew up in Astrakhan near the Kazakh border, and I never even noticed the ethnic differences.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/236950-238369.webm","at":2369.6,"dur":14.19}]},{"speaker":"B","text":"However, when I moved to Moscow, my roommates noticed how people from Azerbaijan or Central Asia were stared at by others.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/240014-241579.webm","at":2400.2,"dur":15.65}]},{"speaker":"A","text":"We can mention specific Russian regions where this is common. We're talking about how national identity is becoming less important.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/244162-245512.webm","at":2441.8,"dur":13.5}]},{"speaker":"B","text":"Let's draw a parallel with immigrants. For example, third-generation Italians in the US might not feel Italian anymore; their sense of national identity has faded.","highlights":["draw a parallel"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/246880-248251.webm","at":2468.9,"dur":13.71},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/248814-249682.webm","at":2488.3,"dur":8.68}]},{"speaker":"B","text":"This makes it much easier for them to assimilate. We don't need statistics; it's just a fact about how schools work.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/251212-252515.webm","at":2512.2,"dur":13.03},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/252824-253993.webm","at":2528.4,"dur":11.69}]}],"time":2231.1,"topic":4},{"title":"Cultural identity vs. racism in Spain","lines":[{"speaker":"A","text":"Some people report less bullying based on skin color in multinational classes, but immigration issues remain very relevant in places like the UK, Italy, or Spain.","highlights":["remain very relevant"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/257232-258577.webm","at":2572.4,"dur":13.45},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/260194-261312.webm","at":2602.1,"dur":11.18}]},{"speaker":"B","text":"In Spain, many people from Morocco are treated badly or face racism because they behave like they would back home.","highlights":["back home"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/261646-263124.webm","at":2616.6,"dur":14.78}]},{"speaker":"A","text":"However, a person whose grandfather fled Morocco 60 years ago might feel zero racism because they are fully integrated and lack that national identity.","highlights":["fully integrated"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/263142-264890.webm","at":2631.5,"dur":17.48}]},{"speaker":"B","text":"Right now, this is just a template. You can't leave it like this; you need to replace the parts to make it work.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/271052-272597.webm","at":2710.6,"dur":15.45}]},{"speaker":"A","text":"I'm thinking about the lost sense of national identity. In Morocco, they have customs regarding marriage or treating women, which don't align with Spanish values.","highlights":["align with"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/275214-276652.webm","at":2752.2,"dur":14.38}]},{"speaker":"B","text":"So it's not about racism, but rather different mindsets. Fresh arrivals still have the Moroccan mindset, which doesn't fit the Spanish cultural landscape.","highlights":["cultural landscape"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/280102-281582.webm","at":2801.1,"dur":14.8}]},{"speaker":"A","text":"That makes sense. A third-generation Moroccan might have adopted all the cultural values and forgotten their previous identity, which can be an advantage.","highlights":["makes sense"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/284096-285502.webm","at":2841.1,"dur":14.06}]},{"speaker":"B","text":"This is a great example of how we start with one idea, realize racism doesn't fit, and then adjust the wording.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/292571-293922.webm","at":2925.9,"dur":13.51}]},{"speaker":"A","text":"It's much easier to find a strong example and change one word than to try and force an example into an idea that doesn't make sense.","highlights":["force an example"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/294870-295873.webm","at":2948.9,"dur":10.03}]},{"speaker":"B","text":"I was looking for synonyms for 'motherland.' Maybe we can use a phrase like 'lessened sense of identity' or 'language from the motherland.'","highlights":["lessened sense"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/296860-297565.webm","at":2968.8,"dur":7.05},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/299210-300538.webm","at":2992.3,"dur":13.28}]}],"time":2572.4,"topic":4},{"title":"Refining an essay on cultural landscape","lines":[{"speaker":"A","text":"I think we should use the phrase 'language of their motherland' instead of just 'motherland' to be more precise.","highlights":["be more precise"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/306194-306525.webm","at":3062.1,"dur":3.31}]},{"speaker":"B","text":"That works. However, your example about having zero time to finish an essay is okay, but you need more facts and details.","highlights":["need more facts"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/311054-312333.webm","at":3110.6,"dur":12.79}]},{"speaker":"A","text":"I see. Since many people will argue with your points, you should pick one specific city and discuss it in detail.","highlights":["discuss it in detail"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/312716-313277.webm","at":3127.3,"dur":5.61},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/315454-315982.webm","at":3154.7,"dur":5.28}]},{"speaker":"B","text":"Also, 'erasure of cultural landscape' is very strong language. You should say it 'partly disappears' instead.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/315988-316698.webm","at":3160.1,"dur":7.1},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/318862-319367.webm","at":3188.8,"dur":5.05}]},{"speaker":"A","text":"Even 'partly disappear' might not be right because traditions are still maintained in Germany. Maybe they just don't celebrate certain things anymore.","highlights":["still maintained"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/319598-320121.webm","at":3196.1,"dur":5.23},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/320400-321573.webm","at":3204.2,"dur":11.73}]},{"speaker":"B","text":"True, but looking at one big European city won't reflect how the real country looks. For example, you won't see the real Spain just by visiting Barcelona.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/323058-324558.webm","at":3230.8,"dur":15.0}]},{"speaker":"A","text":"That idea definitely needs polishing. For instance, you could mention a lawsuit where an Easter celebration was stopped due to discrimination.","highlights":["needs polishing"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/325564-325891.webm","at":3255.8,"dur":3.27},{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/327908-329205.webm","at":3279.2,"dur":12.97}]},{"speaker":"B","text":"I doubt that specific case actually happened, so you need to think of the exact wordings.","highlights":["exact wordings"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/329584-330455.webm","at":3296.0,"dur":8.71}]},{"speaker":"A","text":"Okay, Nadia, please polish the essay and finish the conclusion. I'll send you the homework in about an hour and a half.","highlights":["finish the conclusion"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/331094-332522.webm","at":3311.0,"dur":14.28}]},{"speaker":"B","text":"I'll get on it. By the way, your hair looks great today; the lighting is really good.","highlights":["get on it"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_15-18-34/332770-333233.webm","at":3327.9,"dur":4.63}]}],"time":3062.1,"topic":4}]};
