<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
            }
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: #b9ccff; color: #0d2146; }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;
            font-weight: 650;
            cursor: pointer;
        }

        .orig-toggle:hover { color: var(--accent); }

        .orig { margin: 6px 0 0; padding: 6px 9px; border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 0.88rem; font-style: italic; }

        .dialogue-tools { margin: 0 0 14px; }

        /* ------------------------------------------ mistake views and times */
        .viewbar { display: inline-flex; flex-wrap: wrap; gap: 2px; margin: 0 0 12px; padding: 3px; border-radius: 12px; background: var(--surface-2); }

        .view { min-height: 34px; padding: 4px 14px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-size: 0.88rem; font-weight: 650; cursor: pointer; }

        .view[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .ex-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 5px; color: var(--muted); font-size: 0.8rem; font-weight: 600; }

        .clock { padding: 0 6px; border-radius: 5px; background: var(--surface); color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }

        .sep { color: var(--faint); }

        .ex-why { margin: 6px 0 0 24px; color: var(--muted); font-size: 0.9rem; }

        .topic-head { display: flex; gap: 8px; align-items: center; margin: 24px 0 10px; font-size: 1.02rem; }

        .topic-head .clock { background: var(--surface-2); }

        .topic-count { margin-left: auto; color: var(--faint); font-size: 0.8rem; }

        @media (max-width: 520px) {
            body { font-size: 16px; }
            .card { padding: 14px; }
            #panel-vocabulary { font-size: 15px; }
            .word { padding: 12px; }
            .w-term { font-size: 1.08rem; }
            .bubble { max-width: 94%; }
            .tab { font-size: 0.88rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="hero">
            <p class="eyebrow" id="eyebrow" data-no-speech>English lesson</p>
            <h1 id="title">Lesson review</h1>
            <p class="hint" data-no-speech>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
                <span>Select any word or sentence to hear it.</span>
            </p>
        </header>

        <nav class="tabs" role="tablist" aria-label="Lesson sections" data-no-speech>
            <button class="tab" role="tab" id="tab-mistakes" data-tab="mistakes" aria-controls="panel-mistakes">Mistakes <span class="count" id="count-mistakes">0</span></button>
            <button class="tab" role="tab" id="tab-vocabulary" data-tab="vocabulary" aria-controls="panel-vocabulary">Vocabulary <span class="count" id="count-vocabulary">0</span></button>
            <button class="tab" role="tab" id="tab-dialogues" data-tab="dialogues" aria-controls="panel-dialogues">Dialogues <span class="count" id="count-dialogues">0</span></button>
        </nav>

        <main>
            <section class="panel" id="panel-mistakes" role="tabpanel" aria-labelledby="tab-mistakes"></section>
            <section class="panel" id="panel-vocabulary" role="tabpanel" aria-labelledby="tab-vocabulary" hidden></section>
            <section class="panel" id="panel-dialogues" role="tabpanel" aria-labelledby="tab-dialogues" hidden></section>
        </main>
    </div>

 at the desk, organizing the new arrivals.","You can find the manager at the desk in the main lobby.","She stayed at the desk until the last customer had left."],"synonyms":["behind the desk","at the counter","at the workstation"],"antonyms":["away from the desk","out of the office","on break"]},{"term":"reconsider","pos":"verb","definition":"To think about something again, especially to change a previous decision or opinion.","time":213.8,"lesson":"You were denied the position of an atasha. Maybe that is why they reconsidered you for an even more important role.","examples":[{"sentence":"The committee decided to reconsider your application after you provided the missing documents.","pattern":"decide to reconsider"},{"sentence":"I'm not sure I want to go to the party; I need to reconsider my plans.","pattern":"need to reconsider"},{"sentence":"If you reconsider your offer, we can discuss a higher salary.","pattern":"If + subject + reconsider"},{"sentence":"The company is reconsidering its investment in the new project.","pattern":"reconsider + noun phrase"}],"more_examples":["I need some time to reconsider whether I should move to another city.","The government is reconsidering the new tax laws due to public outcry.","You should reconsider your choice of major before you sign the enrollment papers."],"synonyms":["think over","rethink","review","re-evaluate","re-examine","take another look at"],"antonyms":[],"gap":{"sentence":"Since the hotel was much more expensive than I expected, I had to _____ booking that room.","answer":"reconsider","options":["reconsider","confirm","ignore","maintain"]}},{"term":"assign","pos":"verb","definition":"To give someone a specific task, role, or location to work at.","time":267.4,"lesson":"We were assigned positions and certain locations. Our curators were then thinking about who would work with the Russian VIPs and ministers.","examples":[{"sentence":"The manager assigned me to the marketing project starting next week.","pattern":"a ive","top-notch","first-class","remarkable","magnificent","stellar"],"antonyms":["mediocre","poor","average","subpar","inferior","unsatisfactory","ordinary"],"gap":{"sentence":"The hotel received a five-star rating because the service provided by the staff was truly _____.","answer":"outstanding","options":["outstanding","ordinary","slow","poor"]}},{"term":"daunting task","pos":"noun phrase","definition":"A job or activity that feels very difficult, intimidating, or overwhelming to complete.","time":414.3,"lesson":"They just asked what languages people speak. To check his skills, they would need to find a second person who speaks Thai, which would be a daunting task.","examples":[{"sentence":"Moving to a new country alone is a daunting task for many people.","pattern":"Subject + is a daunting task"},{"sentence":"The project is a daunting task, but we can manage it if we work together.","pattern":"Noun + is a daunting task"},{"sentence":"Climbing Mount Everest is a daunting task that requires years of training.","pattern":"Gerund/Noun phrase + is a daunting task"},{"sentence":"The manager admitted that organizing the entire conference was a daunting task.","pattern":"verb + that + [clause] + was a daunting task"}],"countable":[{"meaning":"A job or activity that feels very difficult, intimidating, or overwhelming to complete.","example":"To check his skills, they would need to find a second person who speaks Thai, which would be a daunting task.","lesson":true}],"uncountable":[],"more_examples":["Learning a new language from scratch can be a daunting task for adults.","Writing a 50-page thesis is a daunting task that requires a lot of discipline.","Setting up a small business from the ground up is a daunting task."],"synonyms":["overwhelming challenge","formidable challenge","arduous task","tough job","intimidating project","mammoth undertaking"],"antonyms":["easy task","simple job","effortless activity","easy feat"],"gap":{"sentence":"Writing a 50-page thesis by next ll online shop as a side project."}],"uncountable":[],"more_examples":["I'm thinking of starting a podcast as a side project.","She spends her weekends working on a side project involving wood carving.","Many software engineers have side projects that eventually turn into full-time companies."],"synonyms":["passion project","hobby","secondary project","extracurricular project","personal project"],"antonyms":["main job","full-time career","primary occupation","day job"],"gap":{"sentence":"Even though she works in marketing, she spends her weekends developing a new website as a _____.","answer":"side project","options":["side project","main job","full-time career","daily routine"]}},{"term":"sophisticated algorithm","pos":"noun phrase","definition":"A complex set of rules or calculations used by a computer to solve difficult problems.","time":721.8,"lesson":"There is too much data on the screen and I understand absolutely nothing. It is a very sophisticated algorithm meant for managing complex logistics, like delivering pizzas from multiple locations.","examples":[{"sentence":"The company uses a sophisticated algorithm to determine the best delivery routes.","pattern":"use + a sophisticated algorithm + to + verb"},{"sentence":"Is the app's recommendation engine powered by a sophisticated algorithm?","pattern":"be powered by + a sophisticated algorithm"},{"sentence":"Developing a sophisticated algorithm for real-time data processing is very challenging.","pattern":"sophisticated algorithm + for + -ing"},{"sentence":"The software relies on a sophisticated algorithm to detect fraudulent transactions.","pattern":"rely on + a sophisticated algorithm"}],"countable":[{"meaning":"A complex set of rules or calculations used by a computer to solve difficult problems.","example":"It is a very sophisticated algorithm meant for managing complex logistics, like delivering pizzas from multiple locations.","lesson":true}],"uncountable":[],"more_examples":["The social media platform uses a sophisticated algorithm to curate your news feed.","Engineers are working on a sophisticated algorithm to predict stock market trends.","The autonomous vehicle navigates city streets using a sophisticated algorithm."],"synonyms":["complex algorithm","advanced algorithm","intricate logic"],"antonyms":["simple algorithm"],"gap":{"sentence":"The streaming service uses a _____ to analyze your viewing habits and suggest movies you might enjoy.","answer":"sophisticated algorithm","options":["sophisticated algorithm","vague guess","easy method","quick tip"]}},{"term":"laggy","pos":"adjective","definition":"Experiencing slow response times or delays, usually due to a heavy processing load.","time":779.4,"lesson":"If I assign another vehicle to it, it probably should work, but it's very laggy because I'm running a lot of tests in the background.","examples":[{"sentence":"The video game is really laggy because my internet connection is unstable.","pattern":"subject + be + really laggy"},{"sentence":"I noticed the app became laggy whenever I tried to upload high-resolution photos.","pattern":"become + laggy"},{"sentence":"The software is a bit laggy, but it should improve once the update is installed.","pattern":"a bit + laggy"},{"sentence":"Is the interface laggy, or is my computer just running too many programs?","pattern":"Is the [noun] laggy?"}],"more_examples":["The mouse cursor feels really laggy when I try to move it across the screen.","I'm having a laggy experience on this video call because of the poor signal.","The website is so laggy that it takes forever for the buttons to react."],"synonyms":["slow","choppy","delayed","sluggish","unresponsive","stuttering","jittery"],"antonyms":["smooth","responsive","fast","fluid","seamless"],"gap":{"sentence":"The video editing software became so _____ that it took forever to render even a simple clip.","answer":"laggy","options":["laggy","smooth","efficient","useful"]}},{"term":"on a daily basis","pos":"expression","definition":"happening every day; as part of a regular daily routine.","time":903.3,"lesson":"After meeting the first guest, you began working with international guests on a daily basis. More specifically, you worked with Latino people.","examples":[{"sentence":"I try to exercise on a daily basis to stay healthy.","pattern":"subject + verb + on a daily basis"},{"sentence":"The team updates the project status on a daily basis.","pattern":"on a daily basis (at the end of a sentence)"},{"sentence":"She practices the piano on a daily basis.","pattern":"on a daily basis (frequency)"},{"sentence":"The software is updated on a daily basis to ensure security.","pattern":"passive voice + on a daily basis"}],"more_examples":["I check my emails on a daily basis to stay organized.","The shop restocks its shelves on a daily basis.","He drinks at least two liters of water on a daily basis."],"synonyms":["every day","daily","each day"],"antonyms":["occasionally","rarely","seldom"]},{"term":"high-ranking","pos":"adjective","definition":"Holding a position of great importance or authority within an organization or government.","time":1005.5,"lesson":"I was just thinking about how she is a high-ranking government official. It would be funny to ask her if she misses anyone at the government office.","examples":[{"sentence":"The company invited several high-ranking executives to the gala.","pattern":"high-ranking + noun"},{"sentence":"She is a high-ranking official in the Ministry of Education.","pattern":"high-ranking + official"},{"sentence":"Only high-ranking members of the committee are allowed to vote on this issue.","pattern":"Only + high-ranking + noun"},{"sentence":"He reached a high-ranking position in the military after twenty years of service.","pattern":"reach + a high-ranking position"}],"more_examples":["The meeting was attended by high-ranking members of the tech industry.","It is difficult for a junior employee to get a meeting with high-ranking management.","The protest was organized to demand changes from high-ranking politicians."],"synonyms":["senior","top-level","high-level","prominent","influential","leading","elite"],"antonyms":["low-ranking","junior","subordinate","entry-level","minor"],"gap":{"sentence":"The company's decision was final because it was made by a _____ member of the board.","answer":"high-ranking","options":["high-ranking","junior","temporary","unskilled"]}},{"term":"open-minded","pos":"adjective","definition":"willing to accept new ideas, different behaviors, or unconventional ways of doing things.","time":1040.1,"lesson":"They told me to leave the formal tone and use an unofficial one. They were very open-minded and positive all the time, which made it a pleasure to be with them.","examples":[{"sentence":"You need to be open-minded if you want to learn from different cultures.","pattern":"be open-minded + if clause"},{"sentence":"My boss is very open-minded about new ways of working.","pattern":"open-minded about + noun"},{"sentence":"She has an open-minded approach to solving complex problems.","pattern":"open-minded approach"},{"sentence":"They were open-minded enough to listen to our suggestions.","pattern":"open-minded enough to + verb"}],"more_examples":["He's very open-minded when it comes to trying new types of food.","To be a successful artist, you have to be open-minded and willing to experiment.","I appreciate how open-minded she is about different religious beliefs."],"synonyms":["receptive","tolerant","unbiased","objective","flexible","broad-minded","nonjudgmental","accepting"],"antonyms":["narrow-minded","prejudiced","closed-minded","bigoted","conservative","intolerant","dogmatic"],"gap":{"sentence":"Because he is so _____, he is always happy to try unusual foods from different countries.","answer":"open-minded","options":["open-minded","stubborn","traditional","cautious"]}},{"term":"sneak in","pos":"phrasal verb","definition":"To enter a place quietly or secretly, often without official permission.","time":1076.6,"lesson":"The closing ceremony was held in a very huge concert hall. I managed to sneak in there as their translator and watch the ceremony from the VIP lounge.","examples":[{"sentence":"The fans tried to sneak in through the back door to get a better view.","pattern":""},{"sentence":"He sneaked in while everyone was distracted by the fireworks.","pattern":"past tense: sneaked"}],"more_examples":["I tried to sneak in the laundry room to use the dryer before it closed.","The cat managed to sneak in through the open window while we were out."],"synonyms":["slip in","creep in","infiltrate","get in secretly"],"antonyms":["enter openly","walk in","burst in"],"gap":{"sentence":"The thief tried to _____ through the side window while the security guards were changing shifts.","answer":"sneak in","options":["sneak in","wait in","stay in","work in"]}},{"term":"hungover","pos":"adjective","definition":"feeling unwell, often with a headache or nausea, after drinking too much alcohol.","time":1144.5,"lesson":"For example, yesterday I drank with my Latino friends. I am hungover, by the way.","examples":[{"sentence":"He felt hungover and struggled to focus during the meeting.","pattern":"feel + hungover"},{"sentence":"I'm still feeling a bit hungover from the party last night.","pattern":"still feeling + hungover"},{"sentence":"Is he hungover? He looks like he hasn't slept at all.","pattern":"be + hungover"}],"more_examples":["I'm going to stay in bed all day because I'm feeling so hungover.","He woke up feeling hungover and regretted drinking so much tequila."],"synonyms":["nauseous","sick"],"antonyms":["sober","refreshed","clear-headed"],"gap":{"sentence":"After drinking several bottles of wine at the wedding, he woke up feeling extremely _____ and had a splitting headache.","answer":"hungover","options":["hungover","energetic","curious","proud"]}},{"term":"evoke respect","pos":"expression","definition":"To cause someone to feel admiration or high regard for another person.","time":1161.2,"lesson":"When you don't have something, you might envy others who do. People who speak more than two languages evoke my respect.","examples":[{"sentence":"The old man's stories evoke a great deal of respect among the local children.","pattern":"evoke + [amount] of respect"},{"sentence":"His ability to remain calm under pressure evokes respect.","pattern":"subject + evokes respect"}],"more_examples":["The way she handled the difficult negotiation evoked a lot of respect from her colleagues.","His lifelong commitment to charity evokes respect in everyone who knows him.","The bravery of the first responders evoked deep respect across the nation."],"synonyms":["command respect","inspire respect","earn respect","garner respect","win respect","merit respect","deserve respect"],"antonyms":["lose respect","diminish respect"],"gap":{"sentence":"The way the volunteer stayed so patient while helping the difficult customers really _____.","answer":"evokes respect","options":["evokes respect","causes fear","creates confusion","shows anger"]}},{"term":"unintelligible","pos":"adjective","definition":"Impossible to hear or understand clearly, often due to noise or poor pronunciation.","time":1181.8,"lesson":"I am still not that great. For instance, many things that the ladies I was working with said were unintelligible to me.","examples":[{"sentence":"The recording was so distorted that the speaker's voice became almost unintelligible.","pattern":""},{"sentence":"I'm sorry, could you repeat that? Your accent was a bit unintelligible over the phone.","pattern":"unintelligible + over the phone"},{"sentence":"The noise from the construction site made the conversation unintelligible.","pattern":"make + object + unintelligible"}],"more_examples":["The radio signal was so weak that the news report became completely unintelligible.","I tried to listen to the podcast, but the background music made the dialogue unintelligible.","Because of the heavy wind, the ,"static","din"],"antonyms":["silence"],"gap":{"sentence":"Because the crowd was speaking a language I didn't know, their voices became nothing more than _____.","answer":"white noise","options":["white noise","useful advice","helpful tips","brief summaries"]}},{"term":"huge leap","pos":"noun phrase","definition":"A sudden and very significant improvement or progress in someone's ability or knowledge.","time":1246.7,"lesson":"You can never truly know how good you are right now. However, you are only two months away from a huge leap in your understanding.","examples":[{"sentence":"The new software update represents a huge leap forward for the company's technology.","pattern":"a huge leap forward"},{"sentence":"After three months of intensive practice, she made a huge leap in her piano skills.","pattern":"make a huge leap"},{"sentence":"The transition from learning basic grammar to fluent conversation is a huge leap.","pattern":"be a huge leap"},{"sentence":"The scientist's discovery was a huge leap toward curing the disease.","pattern":"a huge leap toward + -ing"}],"countable":[{"meaning":"A sudden and very significant improvement or progress in someone's ability or knowledge.","example":"However, you are only two months away from a huge leap in your understanding.","lesson":true},{"meaning":"A long jump or a large movement in space","example":"The athlete took a huge leap over the hurdle."},{"meaning":"A sudden, large increase in a quantity or value","example":"There was a huge leap in stock prices overnight."}],"uncountable":[],"more_examples":["The new training program helped the team make a huge leap in their productivity.","Learning how to code was a huge leap for my career prospects.","The child made a huge leap in his reading ability over the summer."],"synonyms":["quantum leap","giant step","massive step forward"],"antonyms":["small step","slow progress"],"gap":{"sentence":"Since starting the advanced coding bootcamp, his ability to build complex apps has made a _____.","answer":"huge leap","options":["huge leap","small step","tiny move","slow crawl"]}},{"term":"soft power","pos":"noun phrase","definition":"The ability to influence others and promote a country's image through culture and values.","time":1320.3,"lesson":"If we are speaking about the global idea of it, it is like the soft power of Russia. They want to show people around the world that Russia is a developed country with many innovations.","examples":[{"sentence":"The country uses its soft power to attract foreign tourists and investors.","pattern":"use + soft power + to + verb"},{"sentence":"Many people believe that cinema and music are powerful tools of soft power.","pattern":"tools of soft power"},{"sentence":"The government is trying to increase its soft power by hosting international sporting events.","pattern":"increase + soft power"},{"sentence":"Unlike military force, soft power relies on attraction and persuasion.","pattern":"soft power vs. hard power (contrast)"}],"countable":[],"uncountable":[{"meaning":"The ability to influence others and promote a country's image through culture and values.","example":"If we are speaking about the global idea of it, it is like the soft power of Russia.","lesson":true},{"meaning":"The capacity to influence others through attraction rather than coercion","example":"The nation's soft power is rooted in its rich culinary traditions."}],"more_examples":["The country's soft power is often bolstered by its high-quality education system.","Promoting democratic values is a key component of their soft power strategy.","Many analysts argue that the country's soft power is declining in the region."],"synonyms":["cultural influence","diplomatic influence","cultural diplomacy"],"antonyms":["hard power","military force","economic coercion"],"gap":{"sentence":"Instead of using military force, the nation relies on _____ to shape how other countries perceive its culture and values.","answer":"soft power","options":["soft power","hard power","fast power","main power"]}},{"term":"unbreakable ties","pos":"noun phrase","definition":"A very strong and lasting connection or relationship between two people or countries.","time":1459.5,"lesson":"They signed a bunch of papers containing beautiful words about eternal friendship and unbreakable ties between our countries.","examples":[{"sentence":"The two neighboring countries have maintained unbreakable ties for decades.","pattern":"maintain + unbreakable ties"},{"sentence":"The treaty aims to forge unbreakable ties between the two nations.","pattern":"forge unbreakable ties"},{"sentence":"Their friendship is built on unbreakable ties of mutual trust and respect.","pattern":"built on unbreakable ties"}],"countable":[{"meaning":"A very strong and lasting connection or relationship between two people or countries.","example":"They signed a bunch of papers containing beautiful words about eternal friendship and unbreakable ties between our countries.","lesson":true}],"uncountable":[],"more_examples":["The shared history of the two families created unbreakable ties that have lasted for generations.","Despite the distance, the siblings maintained unbreakable ties through daily video calls.","The trade agreement is designed to create unbreakable ties between the regional economies."],"synonyms":["indissoluble bonds","eternal connections","deep-rooted ties","permanent bonds","enduring links"],"antonyms":["fragile connections","fleeting relationships","broken bonds","weak ties","temporary links"]},{"term":"come to life","pos":"expression","definition":"To start being developed, implemented, or become active after being planned or discussed.","time":1465.8,"lesson":"We signed a bunch of papers about eternal friendship and unbreakable ties between our countries. Maybe some projects will be organized and they will come to life after this event.","examples":[{"sentence":"The city really comes to life at night when the lights turn on.","pattern":"come to life (metaphorical/vibrant)"},{"sentence":"After months of planning, the new community garden finally came to life.","pattern":"come to life (realization of a project)"},{"sentence":"The architect's vision for the building came to life in the final construction.","pattern":"come to life (transformation from idea to reality)"},{"sentence":"We need more funding before these ambitious plans can come to life.","pattern":""}],"more_examples":["The startup's business plan finally came to life once they secured the investment.","It took years of research before the movie script finally came to life on screen.","The non-profit's initiative to provide clean water came to life this summer."],"synonyms":["take shape","materialize","get underway","be realized","be implemented","become a reality","be put into practice"],"antonyms":["fall through","be abandoned","be scrapped","fail to launch"],"gap":{"sentence":"After months of brainstorming, the startup's business plan finally _____ when they secured their first investor.","answer":"came to life","options":["came to life","stayed quiet","went backwards","failed completely"]}},{"term":"come up with","pos":"phrasal verb","definition":"To produce, suggest, or think of an idea, a reason, or a solution.","time":1573.3,"lesson":"The last sentence is like, 'I think the advantages are much more important,' and then you have to come up with a reason for that. That is the only difference.","examples":[{"sentence":"We need to come up with a new marketing strategy by Friday.","pattern":"come up with + noun"},{"sentence":"How did you come up with such a creative idea for the gift?","pattern":""},{"sentence":"She came up with a great way to save money on electricity.","pattern":""},{"sentence":"They are trying to come up with a solution to the traffic problem.","pattern":"come up with + a solution"}],"more_examples":["I can't think of a name for my new business; I need to come up with something catchy.","The team had to come up with a plan to handle the unexpected power outage.","Can you come up with a few more examples of how to use this software?"],"synonyms":["think of","devise","create","propose","generate","formulate","dream up","invent"],"antonyms":[],"gap":{"sentence":"I need to _____ a clever excuse for why I missed the meeting this morning.","answer":"come up with","options":["come up with","give up","take off","put on"]}},{"term":"postpone","pos":"verb","definition":"To delay an event or action until a later date or time.","time":1602.6,"lesson":"I have made a decision to postpone my master education for a year because I feel that I need a bit more time to save money.","examples":[{"sentence":"The outdoor concert was postponed because of the heavy rain.","pattern":"be postponed because of [reason]"},{"sentence":"We had to postpone the meeting until next Tuesday.","pattern":"postpone [something] until [time]"},{"sentence":"Can we postpone the deadline for the project by two days?","pattern":"postpone the deadline"},{"sentence":"I'm going to postpone my vacation until I finish this work.","pattern":"postpone + [possessive pronoun] + [noun]"}],"more_examples":["The flight was postponed due to technical difficulties with the engine.","I'm sorry, but I have to postpone our dinner date until next week.","They decided to postpone the vote until more members could attend."],"synonyms":["put off","delay","defer","hold off","shelve"],"antonyms":["advance","bring forward","expedite","accelerate"],"gap":{"sentence":"Since the manager is still out of the office, we have decided to _____ the presentation until next week.","answer":"postpone","options":["postpone","confirm","shorten","prepare"]}},{"term":"life hack","pos":"noun","definition":"A clever tip or simple trick to make a task easier or more efficient.","time":1838.8,"lesson":"There is a small life hack that not a lot of people know. Because it is an academic essay, it is in many ways similar to writing a real scientific paper.","examples":[{"sentence":"Using a binder clip to organize cables is a great life hack.","pattern":"a great life hack"},{"sentence":"I learned a life hack that saves me a lot of time when cooking.","pattern":"learn a life hack"},{"sentence":"Here is a simple life hack for staying organized during finals week.","pattern":"life hack for + -ing"},{"sentence":"Is there any life hack for remembering new vocabulary words more quickly?","pattern":""}],"countable":[{"meaning":"A clever tip or simple trick to make a task easier or more efficient.","example":"There is a small life hack that not a lot of people know.","lesson":true},{"meaning":"A shortcut or a simplified method for completing a process","example":"I found a life hack to bypass the long queue at the airport."},{"meaning":"A clever way to repurpose an everyday object","example":"Using a muffin tin as a cupcake stand is a classic life hack."}],"uncountable":[],"more_examples":["I saw a life hack on TikTok for getting stains out of white shirts.","What's your favorite life hack for keeping your phone battery full?","One of my favorite life hacks is putting a rubber band around the toothpaste tube."],"synonyms":["shortcut","tip","trick","workaround","pro-tip","convenience"],"antonyms":[],"gap":{"sentence":"I discovered a clever _____ that allows me to clean my microwave in just a few minutes.","answer":"life hack","options":["life hack","problem","equipment","subject"]}},{"term":"radical","pos":"adjective","definition":"expressing or demanding extreme change or very strong, certain opinions.","time":1884.1,"lesson":"When scientists write academic papers, they usually avoid being radical. They avoid making certain claims unless they have absolute proof.","examples":[{"sentence":"The company is planning a radical shift in its marketing strategy.","pattern":"a radical + noun"},{"sentence":"He holds some very radical views on how the government should be run.","pattern":"hold radical views"},{"sentence":"The move to go completely paperless was a radical change for the office.","pattern":"a radical change"},{"sentence":"The professor warned against making radical claims without sufficient evidence.","pattern":"make radical claims"}],"more_examples":["The new CEO proposed a radical reorganization of the entire department.","Some people believe that a radical overhaul of the healthcare system is necessary.","She took a radical approach to her fitness routine by training every single day."],"synonyms":["extreme","drastic","revolutionary","fundamental","far-reaching","uncompromising"],"antonyms":["conservative","moderate","gradual","traditional","mild","conventional"],"gap":{"sentence":"The CEO's proposal to move the entire production line overseas was considered a _____ step by the staff.","answer":"radical","options":["radical","gentle","passive","steady"]}},{"term":"mitigate","pos":"verb","definition":"To make something bad, such as a problem or a negative feeling, less severe.","time":1949.8,"lesson":"Does 'less intense' sound okay, or should I use 'mitigate racism'? I know the word 'mitigate,' but I'm not sure if it's the best wording here.","examples":[{"sentence":"The government is trying to mitigate the effects of the economic crisis.","pattern":"mitigate + the effects of"},{"sentence":"We can mitigate the risk by double-checking all the data.","pattern":"mitigate the risk"},{"sentence":"The new law was designed to mitigate the impact of pollution on the local community.","pattern":"mitigate the impact of"},{"sentence":"Wearing a seatbelt helps mitigate the severity of injuries during a car accident.","pattern":"mitigate the severity of"}],"more_examples":["The company offered a discount to mitigate the customers' frustration over the delay.","The medication is intended to mitigate the pain associated with chronic back issues."],"synonyms":["alleviate","lessen","ease","reduce","diminish","soften","moderate","lessen the impact of"],"antonyms":["aggravate","exacerbate","intensify","worsen","increase","heighten","magnify"],"gap":{"sentence":"The company offered a full refund to _____ the customers' anger after the product failed.","answer":"mitigate","options":["mitigate","increase","provoke","ignore"]}},{"term":"draw a parallel","pos":"expression","definition":"To show how two different situations or things are similar to each other.","time":2469.5,"lesson":"The sense of national identity among Cossacks is becoming less important. We can draw a parallel between that and, for example, fresh immigrants moving to the U.S.","examples":[{"sentence":"Many experts draw a parallel between the current economic crisis and the Great Depression.","pattern":"draw a parallel between A and B"},{"sentence":"You can draw a parallel to your own experience when describing the character's struggles.","pattern":"draw a parallel to [something]"},{"sentence":"The author draws a parallel between the two historical events to highlight recurring patterns.","pattern":"draw a parallel between [two things]"},{"sentence":"It is easy to draw a parallel between the movie and the book it was based on.","pattern":"It is [adjective] to draw a parallel"}],"more_examples":["The coach tried to draw a parallel between the team's chemistry and a well-oiled machine.","It's hard to draw a parallel between the two cultures because they are so different.","Can you draw a parallel between your current project and the one you did last year?"],"synonyms":["make a comparison","compare","draw a comparison","relate","liken","draw a connection"],"antonyms":["contrast","differentiate","distinguish"]},{"term":"from scratch","pos":"idiom","definition":"Starting something from the very beginning, without using anything that already exists.","time":2698.5,"lesson":"They are fully integrated into society because of their lack of national identity. Therefore, I will have to write this whole example from scratch.","examples":[{"sentence":"The chef had to start the recipe from scratch because the previous batch was ruined.","pattern":"start [something] from scratch"},{"sentence":"I didn't have any notes, so I had to write the entire essay from scratch.","pattern":"write [something] from scratch"},{"sentence":"If the software keeps crashing, we might have to rebuild the whole system from scratch.","pattern":"rebuild [something] from scratch"},{"sentence":"She built her successful business from scratch with no outside investment.","pattern":"build [something] from scratch"}],"more_examples":["I'm moving into a new apartment and need to decorate the living room from scratch.","Since the original data was corrupted, we had to re-enter every customer's information from scratch.","He didn't know how to play chess, so he had to learn the rules from scratch."],"synonyms":["from the ground up","from the beginning","from the bottom up","starting over","anew"],"antonyms":["from a template","pre-made","ready-made"],"gap":{"sentence":"Since the original design was completely lost, the team had to recreate the entire project _____.","answer":"from scratch","options":["from scratch","in advance","by mistake","on purpose"]}},{"term":"file a lawsuit","pos":"expression","definition":"To officially start a legal case against someone in a court of law.","time":3278.6,"lesson":"For some reason, they can't celebrate it now. This is because some Arabs filed a lawsuit and won it, claiming that the celebration discriminates against them.","examples":[{"sentence":"The company decided to file a lawsuit against the former employee for theft.","pattern":"file a lawsuit against [someone]"},{"sentence":"If the landlord doesn't make repairs, the tenants might file a lawsuit.","pattern":"might + file a lawsuit"},{"sentence":"She filed a lawsuit for breach of contract after the deal fell through.","pattern":"file a lawsuit for [reason]"},{"sentence":"They are planning to file a lawsuit to seek compensation for the damages.","pattern":"file a lawsuit to [verb]"}],"more_examples":["The neighbors are planning to file a lawsuit over the property line dispute.","He threatened to file a lawsuit if his medical records weren't released.","The victims of the accident have decided to file a lawsuit against the trucking company."],"synonyms":["take legal action","sue","bring a case","institute legal proceedings","commence a lawsuit"],"antonyms":["drop a lawsuit","withdraw a lawsuit","settle out of court","dismiss a case"],"gap":{"sentence":"After the company refused to pay for the broken equipment, the owner decided to _____ to get his money back.","answer":"file a lawsuit","options":["file a lawsuit","book a flight","take a photo","join a club"]}}],"dialogues":[{"title":"Volunteering at a festival","lines":[{"speaker":"A","text":"Can you hear me okay? The connection seems a bit worse than it was a few minutes ago.","said":"you hear me well do you see me yeah a bit worse than two minutes ago"},{"speaker":"B","text":"Yeah, it's fine. So, during our last lesson, we were still in the preparation week for the festival.","said":"all good so okay when we had our last lesson it was still like the preparation week for us as volunteers"},{"speaker":"A","text":"Right, and I told you those stories about how we weren't treated very well at first.","said":"i told you some unpleasant stories of how not really pleasantly we were treated"},{"speaker":"B","text":"Exactly. But that all passed quickly, and then the festival week finally began. The participants started arriving.","said":"but it all passed kind of quickly and then the week of the festival itself began so participants came"},{"speaker":"A","text":"I was working in a protocol position, which had four different roles, like meeting newcomers at the airport or helping with transport at the hotels.","said":"i was working in a protocol position i was yeah and even in this position there were four different positions which you could take for instance be in the airport and meet newcomers and help them with trans transport also in hotels doing the same thing about"},{"speaker":"B","text":"And then there was the venue itself, where you could work at the information desk, navigating people around the area.","said":"and in the venue you could work in the information desk just navigating people or accompanying people around the territory"},{"speaker":"A","text":"When you say 'navigating desk,' I imagine a little hobbit sitting there, and someone asks for directions.","said":"when you say in the navigating desk i imagine a small dwarf you know a small hobbit sitting in the desk and it's like knock knock where is how do i get to the venue oh it's yeah turn turn right and then go straight"},{"speaker":"B","text":"I actually meant I was working at the information desk. I thought about a hobbit sitting on the desk, swinging their legs.","said":"i was meaning that it should be at the at the desk i was working out the information desk but what did i say i said in the desk oh i in the desk oh all the desk i imagine a small hobbit like you know like swinging their swinging their legs sitting sitting on"},{"speaker":"A","text":"Or you could accompany people around the venue, which is a much more interesting role. It's almost like being a stalker.","said":"or accompanying people around the venue which is the most interesting position and thank god i got it like a stalker like sorry what do you mean what do you mean accompanying them like stalking them following them"},{"speaker":"B","text":"Not really stalking! We just knew their schedules and accompanied them to meeting rooms, VIP lounges, or even to their hotels.","said":"well not really meeting them on the venue and like knowing their schedule accompany them to the right meeting rooms their vip lounges we could also accompany them in their personal cars to hotels for example or are the other places they wanted to visit in the"},{"speaker":"A","text":"We were working with very important guests, like ministers. How did you manage to get assigned to the VIP block?","said":"and all of these people who we were working with were important guests experts or like vip people like ministers or something so yeah and there was this day where we were did you did you somehow managed to to get this position of working with vips"},{"speaker":"B","text":"I have no idea. I just got a message saying I'd be there. Maybe they reconsidered me for a more important role after I was denied the 'atasha' position.","said":"i don't know how i just was sent a message like you will be working there and i'm like i don't know why because because remember you told that you were denied the position of an atasha"},{"speaker":"A","text":"I'm not sure how the selection process works. When I volunteered in Sochi two years ago, I was only 18 and got a very important role.","said":"maybe i actually have no idea how selection process works there because at the very first festival which i where i where i second where i participated two years ago in sochi i was 18 years old and it was my first volunteering experience and i was given this atasha"},{"speaker":"B","text":"We were assigned certain locations, and the curators had to decide who would work with the Russian ministers versus the foreign guests.","said":"we were assigned certain locations and so our curators were like thinking who will be working with the russian vip people ministers and all that or with foreign ones"},{"speaker":"A","text":"I wanted to work with foreign guests, but those spots went to people who spoke other languages at a very high level, not just English.","said":"of course i wanted to work with foreign people but the people who managed to get into this international block were people who spoke some other foreign language in a very great level not only english because all of us spoke english and it wasn't something like"},{"speaker":"B","text":"Right, like those guys who spoke Thai and Lao. There were some very cool guys from Gemoy University, and a few who spoke Arabic fluently.","said":"so we even had a guy who spoke thai and laos how is lao languages yeah because it's it's laos the country and the language like the lao people and the lao language okay so thai and lao languages yeah yeah okay so huh that thai and lao languages the thai and"},{"speaker":"A","text":"I decided not to say I spoke Spanish because my level isn't high enough to use it professionally.","said":"so i decided not to say that i speak spanish because i don't didn't feel comfortable doing that like my level is still not enough like to work with this language professionally"},{"speaker":"B","text":"Did anyone actually check their skills? They just asked what languages they spoke. It would be a daunting task to verify someone's Thai skills.","said":"the guy who claimed to speak thai you mean anybody checked his language speaking skills or the guy who claimed to be proficient in arabic nobody checked anything by the way they just asked what languages do you speak and that's it to check his skills they","highlights":["daunting task"]}]},{"title":"Software logistics and translating for VIPs","lines":[{"speaker":"A","text":"So, if you have five more trucks, the app is supposed to find a solution for the delivery system. Does a solution even exist?","said":"you would have to deliver it let's say you have like five more trucks the app is supposed to find the solution to the system does the solution exist","highlights":["delivery system"]},{"speaker":"B","text":"Actually, it can't find one right now. It's a side project I've been meaning to do for a long time, but there's just too much data on the screen.","said":"which might not exist actually like it can't find 20 it's like you know it's a side project that i've been meaning to do for for a long time but now actually i actually get to do that no it's can't it can't find the solution too much data on the screen","highlights":["side project"]},{"speaker":"A","text":"I see. It's a very sophisticated algorithm. Imagine a company like Dodo Pizza with 10 cafes in a city. They need to deliver pizzas within one hour all day long.","said":"it's a very sophisticated algorithm and it is meant for like you know you know imagine dodo pizza again dodo pizza dodo pizza yeah imagine dodo pizza yeah they have for example 10 cafes in a certain city and they have constant people constantly people are","highlights":["sophisticated algorithm"]},{"speaker":"B","text":"Exactly. I might have over-complicated the system. It's lagging because I'm running a lot of tests in the background, but adding another vehicle should help.","said":"i made the system i made the system over complicated it probably doesn't solve because there are two oh yeah there are too many bottles and too are few or trucks here probably but if i for example if i sign another vehicle to it that probably should and it's"},{"speaker":"A","text":"It actually found a solution! It's showing all the routes for the seven trucks we have. Each truck gets its own job.","said":"and it actually did find solution already and like those are all the routes that we have how many yeah how many trucks do we have we have seven seven trucks and like it assigns you know like routes to them and every truck does its own job"},{"speaker":"B","text":"I'm worried my MacBook won't handle it. If the RAM fails, I'll just have to buy a new one.","said":"i don't think macbook will be able to handle it like maybe but like you know if something breaks in it for example if here my ram fucks up i just buy another one replace the broken one","highlights":["handle it"]},{"speaker":"A","text":"The connection froze for a second, but it seems stable now. Anyway, tell me more about your story with the Mexican woman.","said":"we have lost the connection again do you see me well one two three one two three you just you just freeze one two three one two three one two three yeah you just freeze a bit but like now it seems fine yeah now should now should be okay now should work stably"},{"speaker":"B","text":"She was the first guest I worked with. I started working with international guests daily, specifically Latinos. I spent four hours with her dealing with her accreditation.","said":"she was first so and then other guests and then you made your way into into working with international people international guests on the on a daily basis and and more precise with latino people because like with this mexican woman i spent like maybe four"},{"speaker":"A","text":"Were you speaking English the whole time?","said":"we were speaking mostly english but she was speaking she was speaking spanish a lot too but why why like if we were so like speaking about some complicated things we were doing it in english but she was speaking to me a lot in spanish too"},{"speaker":"B","text":"Yes, she spoke Spanish a lot. I realized the Mexican accent is my favorite because it's so clear. She didn't simplify her language for me at all.","said":"that's how i understood that probably mexican accent is my favorite right now because it's super clear super understandable and even when she spoke spanish with other latinos who we met in the venue i noticed that she didn't change anything in the way she"},{"speaker":"A","text":"That's impressive. You also worked with a Vice Minister of Youth Policy from Venezuela, right? They were amazing.","said":"so with two women from venezuela one of them was a vice minister of youth policy of the country and her like colleague i don't know who exactly she was but they were amazing amazing ladies","highlights":["Vice Minister"]},{"speaker":"B","text":"They were very open-minded. They told me to drop the formal tone and just speak naturally. I even ended up being a VIP attaché, translating for them at the closing ceremony.","said":"i actually spoke with friends with them at first i tried to speak with them in their official tone because there is an official way a formal way of speaking in spanish language and they were like like leave it use unofficial one and so they were very open"},{"speaker":"A","text":"I'm still not that great at it. When my friends speak all at once, it's just white noise to me.","said":"i'm still that great for instance this or how can i say that still many things that these ladies i was working with were unintelligible for me and like yesterday when i was with my friends like they speak all at the same time and it's like all like white noise","highlights":["white noise"]},{"speaker":"B","text":"It's hard to judge your own level. You might be just two months away from a huge leap in your understanding.","said":"it's very interesting how we can't really notice and can't really tell our own level it's like you know i see so many people as far like as far when when i work with a person for the first time like what's my level like tell me how good i am and i always reply","highlights":["huge leap"]},{"speaker":"A","text":"I'm probably around B1 level in Spanish. By the way, what was the main goal of that whole event?","said":"i think i'm somewhere in the beginning of b1 if we speak about spanish at least we we use b1 textbook with my teacher so yeah i'm somewhere there did you figure out what this whole event was about"},{"speaker":"B","text":"It was about 'soft power.' Russia wanted to show the world that they are a developed country with many innovations.","said":"it's like the soft power soft power yeah soft power of russia to show people around the world that russia is great that we are a very developed country with a lot of innovations and the future and and all this stuff","highlights":["soft power"]}]},{"title":"Russian festival and IELTS essay practice","lines":[{"speaker":"A","text":"The festival had these enormous pavilions showing off Russia's development. There were even robots dancing with people and plenty of stuff just for fun.","said":"they were for huge pavilions like enormously huge pavilions with different stands which demonstrated like how russia is developed in certain areas","highlights":["showing off"]},{"speaker":"B","text":"I heard some bloggers were being invited to Russia for two weeks with all expenses covered, including transport and accommodation.","said":"random woman from venezuela do you want to come to russia for two weeks every thing is covered will cover your transportation will cover your accommodation","highlights":["all expenses covered"]},{"speaker":"A","text":"The important people there were mostly just signing documents and making promises about eternal friendship, but I honestly have no idea what the actual projects are.","said":"i would say i have no fucking idea we just signed we just signed a bunch of papers you know like with a bunch of you know beautiful words about eternal","highlights":["no idea"]},{"speaker":"B","text":"At least it's a chance to make new connections. Actually, I'm going to Moscow in two weeks to meet some people I met at that festival.","said":"very of course of course of course so i am going to moscow in two weeks to meet one of people who i met at this festival","highlights":["make new connections"]},{"speaker":"A","text":"Let's look at the essay on national identity. We've covered the hardest types, so we only have the 'advantages outweigh disadvantages' and 'problem-solution' types left."},{"speaker":"B","text":"I've decided to postpone my master's degree for a year to save money and get my braces fixed. I'll also delay my IELTS exam.","said":"i have made a decision to postpone my master education for a year because i feel that i need more a bit more time to save money and also time to cure my teeth"},{"speaker":"A","text":"I actually bought tickets to Tashkent for late November. Anyway, regarding the essay, national identity is tricky because everyone defines it differently."},{"speaker":"B","text":"I'm struggling with examples. For instance, many Italians in New York can't speak Italian at all. They might have lost their national identity.","said":"some in new york there are a lot of italians and many of them can't speak italian at all yeah but like we can","highlights":["at all"]},{"speaker":"A","text":"In academic writing, it's better to avoid being radical. Instead of saying 'racism will disappear,' you should say it might be mitigated or become less intense.","highlights":["avoid being radical"]},{"speaker":"B","text":"Should I use 'mitigated'? Also, I want to say that bullying won't be caused by racism, but rather by pure hatred.","said":"is bullying that will not be caused by racism we have come to a great development now bullying will come in a racist form our boy yes racist proof zero percent racist only pure pure hate","highlights":["pure hatred"]},{"speaker":"A","text":"That's a great development. You could say wars will be waged due to general hatred rather than racism.","said":"wars will be waged but not because of racism because people generally hate each other that's a great development","highlights":["wars will be waged"]},{"speaker":"B","text":"I'm worried the examiner will make fun of my logic, but I hope I get a good score!","said":"the guy who will be checking my essay will also make fun of it and oh so funny i'll put her a nice score","highlights":["make fun of"]}]},{"title":"Refining national identity and cultural assimilation","lines":[{"speaker":"A","text":"You found a way to report two distinct reasons, but you also connected them. You mentioned that people are more united and there is less bullying because of less racism.","said":"you found a way to report two distinct reasons but at the same time you connected them like it's tourism yeah like people are united but at the same time less bullying and it's all because of less racism","highlights":["distinct reasons"]},{"speaker":"B","text":"We can link them even better. We should talk about racism first, then distinguish how less racism leads to stronger bonds and fewer instances of bullying.","said":"we can connect to even better like we can simply proclaim the the first idea yeah well maybe here we we need to talk about racism and then distinguish here less racism means more unity stronger bonds","highlights":["stronger bonds"]},{"speaker":"A","text":"It's hard to change that right now. Also, your example about national identity in Russia isn't very convincing. It's difficult to prove there is less racism.","said":"the reasons that national identity is a huge role in russian but exam your example is not very convincing so it was actually hard to come up with one but it's i mean like how how i can prove that there is less racism"},{"speaker":"B","text":"If you swap the UK and Russia for the US and Canada, nothing changes. I'm trying to say that in American schools, classrooms are diverse and it's normal for people to have no problem with that.","highlights":["no problem with"]},{"speaker":"A","text":"In Russian schools, it's different. I'm from a region near the Kazakh border where many Kazakh people lived, but I never even noticed it. I didn't feel any difference.","said":"but you know in russian schools it's very different because for example i come from estracon yeah and estracon is like like close to the kazakh border and like for me a big number of kazakh people in estracon was not even and like for me a big number of kazakh","highlights":["never even noticed"]},{"speaker":"A","text":"However, when I moved to Moscow, my roommates mentioned that our classes were 100 percent Slavic. They were staring at people from Azerbaijan or Central Asia.","said":"but when i came to moscow and i met other people from other regions and for example guys from evanova who i lived with who i shared a room with they said our our like you know our classes were 100 percent slavic you know like and here like when they saw in"},{"speaker":"B","text":"We can mention specific regions. Also, let's look at the US. Italian immigrants might face racism initially, but by the third generation, their sense of national identity has faded.","highlights":["sense of national identity"]},{"speaker":"B","text":"That faded identity makes it much easier to assimilate. We don't need statistics; it's just a fact that children in multinational classes experience less bullying based on skin color.","said":"if you are an italian in in third generation you don't feel italian anymore like your sense of national identity kind of dissolved yeah kind of faded and but that actually makes makes it much easier for you to assimilate in in america yeah does this make","highlights":["easier to assimilate"]},{"speaker":"A","text":"Consider Spain. Many people from Morocco face harsh treatment because they behave like they are still in Morocco. But a third-generation Moroccan might face zero racism because they are fully integrated.","said":"okay spain like there are a lot of illegal immigrants who are just flooding spain but at the same time like the same people from you know nigeria or the same people from spain what's what's the what's the closest country to spain the closest african country","highlights":["fully integrated"]},{"speaker":"B","text":"Right now, your example is just a template. You can replace any part and it doesn't change. We should focus on the lost sense of national identity.","said":"you can't leave it like that because for now there is no example really like here is just a template i see a template you remove every part and put like replace it with any other part and it doesn't really change","highlights":["just a template"]},{"speaker":"A","text":"Sometimes, a lack of identity can be seen as a bad thing. If people from Morocco keep their old customs, like treating women as unequal, Spaniards might see it as a clash of mindsets, not racism.","said":"national identity can be a bad thing in certain in certain people's eyes can it well for if in morocco you for example you have a custom of arranging marriages or you have a custom of abusing women for example in general in morocco women are not treated as","highlights":["clash of mindsets"]
