<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;

atures a reward system that gives badges for every workout completed."],"synonyms":["incentive program","incentive scheme","recognition program","bonus scheme","performance-based rewards"],"antonyms":["punishment system","penalty system"],"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/219128-219644.webm","at":2191.5,"dur":5.16}},{"term":"do the heavy lifting","pos":"idiom","definition":"To perform the most difficult, demanding, or strenuous part of a task or project.","time":2299.4,"lesson":"It could be very easy, but it could end up with one vehicle getting very easy orders while another vehicle has to do all the heavy lifting. Despite the difference in workload, they would still get paid equally.","examples":[{"sentence":"The marketing team did most of the heavy lifting in preparing the campaign.","pattern":"do the heavy lifting + in + [gerund/noun phrase]"},{"sentence":"I can help with the research, but you'll have to do the heavy lifting of writing the report.","pattern":"have to do the heavy lifting of + [gerund]"},{"sentence":"While the CEO makes the final decisions, her assistants do the heavy lifting of daily operations.","pattern":"subject + do the heavy lifting of + [noun phrase]"},{"sentence":"We need a software tool to do the heavy lifting for our data analysis.","pattern":"do the heavy lifting for + [noun phrase]"}],"more_examples":["I'll handle the presentation slides, but you'll need to do the heavy lifting of negotiating the contract.","The new AI integration is designed to do the heavy lifting of sorting through customer feedback.","She's the backbone of the team; she does all the heavy lifting when it comes to organizing the logistics."],"synonyms":["do the grunt work","shoulder the burden","carry the load"],"antonyms":["do the light work"],"gap":{"sentence":"I can handle the basic scheduling, but since the project is so complex, you will have to _____.","answer":"do the heavy lifting","options":["do the heavy lifting","do the easy part","do the light work","do the quick task"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/230178-230659.webm","at":2301.9,"dur":4.81}},{"term":"variables","pos":"noun","definition":"Different factors or conditions that can change and affect the outcome of a situation.","time":2312.8,"lesson":"It is a difficult system to reward people fairly because you have to consider many different options and variables. You would have to rely on the drivers to assign a difficulty level to each task.","examples":[{"sentence":"There are too many variables to consider when planning a wedding on a budget.","pattern":"too many variables to consider"},{"sentence":"The experiment failed because we didn't control for all the external variables.","pattern":"control for variables"},{"sentence":"Weather is one of the main variables that affect our delivery times.","pattern":"one of the main variables"},{"sentence":"We need to account for several variables before making a final decision.","pattern":"account for variables"}],"countable":[{"meaning":"Different factors or conditions that can change and affect the outcome of a situation.","example":"It is a difficult system to reward people fairly because you have to consider many different options and variables.","lesson":true},{"meaning":"A mathematical symbol used to represent an unknown value","example":"In the equation x + 5 = 10, x is the variable."},{"meaning":"A property or characteristic that can be changed or varied","example":"The software allows users to adjust several variables in the settings."}],"uncountable":[],"more_examples":["The success of the project depends on several variables, including funding and timing.","You have to consider all the variables before you decide to move abroad.","There are too many variables involved in predicting the stock market's behavior."],"synonyms":["factors","elements","influences","conditions","circumstances","considerations"],"antonyms":["constants","fixed values","cer ny means possible"},{"sentence":"The government is exploring new means to reduce carbon emissions.","pattern":"means to + verb"}],"countable":[{"meaning":"The methods, resources, or tools available to achieve a specific goal or result.","example":"I had already figured out the algorithm, but back then I just did not have any means to make it work.","lesson":true},{"meaning":"A method or way of doing something","example":"The most effective means of communication is often face-to-face conversation."},{"meaning":"A person's wealth or income","example":"He was a man of modest means who lived a simple life."}],"uncountable":[{"meaning":"The average standard of living or wealth","example":"The family lived beyond their means for many years."}],"more_examples":["The local community is searching for any means of providing clean water to the village.","They used every means at their disposal to ensure the project was finished on time."],"synonyms":["methods","ways","resources","tools","mechanisms"],"antonyms":["obstacles","barriers","hindrances","impediments"],"gap":{"sentence":"The small non-profit organization lacks the financial _____ to provide housing for all the homeless people in the city.","answer":"means","options":["means","goals","dreams","rules"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/249982-250672.webm","at":2500.0,"dur":6.9}},{"term":"open source","pos":"adjective","definition":"Software or algorithms whose source code is made available for anyone to use and modify.","time":2557.4,"lesson":"You have to think about these complex algorithms for a long time. The thing is, those algorithms already exist in open source projects, but I didn't know how to work with the libraries.","examples":[{"sentence":"Many developers prefer using open source software because it is free to modify.","pattern":""},{"sentence":"Is this library open source, or do I need to pay for a license?","pattern":"Is this [noun] open source?"},{"sentence":"The company ers to meet the deadline.","pattern":"split [something] among [people]"}],"more_examples":["To avoid burnout, it's best to split a big task into weekly milestones.","The project manager suggested we split a big task into specific modules for each department."],"synonyms":["break down a project","divide a large task","segment a task","break into smaller steps","deconstruct a project","partition a task"],"antonyms":[],"gap":{"sentence":"The renovation felt impossible at first, but I managed to make progress by deciding to _____ into smaller milestones.","answer":"split a big task","options":["split a big task","ignore a big task","finish a big task","delay a big task"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/275926-276548.webm","at":2759.5,"dur":6.22}},{"term":"lose track of","pos":"expression","definition":"To fail to keep a clear understanding of something or to forget the details.","time":2844.9,"lesson":"If you don't limit the project in many other ways, you kind of just lose track of it. It starts doing things in its own way, and after that, it becomes hard to understand.","examples":[{"sentence":"I lost track of time because I was so focused on my work.","pattern":"lose track of + time"},{"sentence":"With so many new features, it's easy to lose track of the original goal.","pattern":"it's easy to + lose track of"},{"sentence":"I'm sorry, I lost track of what you were saying for a moment.","pattern":"lose track of + what [subject] [verb]"},{"sentence":"The project grew so large that the team began to lose track of the small details.","pattern":"begin to + lose track of"}],"more_examples":["I had a lot of tabs open and eventually lost track of which page I was on.","It's easy to lose track of your belongings when you're traveling in a crowded city.","I've been reading for three hours and completely lost track of the day."],"synonyms":["lose your place","get confused","forget","become distracted"],"antonyms":["keep track of","stay on top of","keep in mind"],"gap":{"sentence":"I was so busy multitasking that I _____ what I was supposed to do next.","answer":"lost track of","options":["lost track of","followed","noticed","remembered"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/284640-284936.webm","at":2846.5,"dur":2.96}},{"term":"TL;DR","pos":"noun","definition":"A very short summary of a long piece of text or a complex task.","time":2909.0,"lesson":"I used the comments from the analyst and provided a TL;DR for the AI to explain exactly what needed to be done. I also sent the documentation and all other relevant information.","examples":[{"sentence":"The TL;DR of the meeting is that we need to increase the budget by 10%.","pattern":"The TL;DR of [something] is"},{"sentence":"I don't have time to read the whole report, can you give me the TL;DR?","pattern":"give me the TL;DR"},{"sentence":"TL;DR: The project is delayed due to technical issues.","pattern":"TL;DR: [Summary sentence]"},{"sentence":"Write a TL;DR at the top of your email so people can see the main point quickly.","pattern":"Write a TL;DR"}],"countable":[{"meaning":"A very short summary of a long piece of text or a complex task.","example":"I used the comments from the analyst and provided a TL;DR for the AI to explain exactly what needed to be done.","lesson":true},{"meaning":"A summary of a long post or comment on social media","example":"I saw a long thread on Twitter, but I just read the TL;DR."}],"uncountable":[],"more_examples":["Can you provide a TL;DR for that three-hour podcast?","I'll put a TL;DR at the bottom of the documentation for quick reference.","The TL;DR of the legal contract is that we can't share the data."],"synonyms":["summary","overview","brief","gist","recap","synopsis","bottom line"],"antonyms":["full report","detailed explanation","long-form content","comprehensive analysis"],"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/290630-291112.webm","at":2906.4,"dur":4.82}},{"term":"build a picture in your head","pos":"expression","definition":"to form a clear mental image or visualization of something before doing it.","time":3103.2,"lesson":"The thing is that when you start coding, you should already have built a picture in your head of what it should look like.","examples":[{"sentence":"Before starting the renovation, I need to build a picture in my head of the final room.","pattern":"build a picture in your head of + noun"},{"sentence":"Can you help me build a picture in my head of how the new app will function?","pattern":"help (someone) build a picture in their head"},{"sentence":"I'm trying to build a picture in my head of the city based on your description.","pattern":"build a picture in my head based on"},{"sentence":"Once you build a picture in your head, it's much easier to explain the project to others.","pattern":""}],"more_examples":["I'm trying to build a picture in my head of what the wedding will look like.","Close your eyes and try to build a picture in your head of your favorite vacation spot.","It’s hard to build a picture in your head of the plot without seeing the movie."],"synonyms":["visualize","imagine","form a mental image","envision"],"antonyms":[],"gap":{"sentence":"Before I start writing the novel, I need to _____ of the main character's personality.","answer":"build a picture in my head","options":["build a picture in my head","write a list","take a break","find a solution"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/310476-311040.webm","at":3104.9,"dur":5.64}},{"term":"prompting","pos":"verb (gerund)","definition":"Giving detailed instructions or descriptions to an AI to guide its output.","time":3146.8,"lesson":"You should ensure the programmer has a clear picture of the project in their head. If you spend more time prompting—explaining in detail what you want to see—you can figure out the best way to build it before starting.","examples":[{"sentence":"I spent all morning prompting the AI
