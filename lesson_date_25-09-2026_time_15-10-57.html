chedule to give everyone a longer break.","The marketing team needs to tweak the ad copy before it goes live."],"synonyms":["adjust","fine-tune","modify","refine","calibrate","tailor","polish"],"antonyms":["leave as is","maintain","preserve","keep"],"gap":{"sentence":"The presentation is almost perfect, but I need to _____ a few slides to make the data clearer.","answer":"tweak","options":["tweak","ignore","cancel","publish"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/328784-329635.webm","at":3287.9,"dur":8.51}},{"term":"customizable","pos":"adjective","definition":"Able to be changed or modified to suit a person's specific needs or preferences.","time":3294.1,"lesson":"I tweaked a lot of settings because Claude is very customizable. You can specify in great detail how you want it to operate and interact with you.","examples":[{"sentence":"The software offers a highly customizable interface for different types of users.","pattern":"highly customizable"},{"sentence":"Is this laptop customizable, or can I only change the external accessories?","pattern":"subject + customizable?"},{"sentence":"The app is fully customizable, allowing you to choose your own colors and layout.","pattern":"fully customizable"},{"sentence":"One of the best features of the new car is its customizable dashboard.","pattern":"customizable + noun"}],"more_examples":["The company offers customizable gift baskets for corporate events.","You can choose a customizable workout plan based on your fitness goals.","The furniture is modular and customizable, making it perfect for small apartments."],"synonyms":["tailorable","adaptable","adjustable","personalized","flexible","modifiable","configurable"],"antonyms":["fixed","standardized","predefined","permanent","rigid","non-adjustable"],"gap":{"sentence":"Since the furniture is highly _____, we can change the dimensions to fit perfectly into our small apartment.","answer":"customizable","options":["customizable","permanent","identical","fixed"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/329306-330154.webm","at":3293.3,"dur":8.48}},{"term":"have an edge over","pos":"expression","definition":"to have a quality or advantage that makes one better than a competitor.","time":3315.2,"lesson":"After tweaking the settings, I saw that Claude actually has an edge over ChatGPT. This is because I feel that ChatGPT gives up too early, while Claude really takes its time to go over the task.","examples":[{"sentence":"Our company has a competitive edge over the others because of our unique technology.","pattern":"have a competitive edge over"},{"sentence":"She has an edge over her rivals because she speaks four languages fluently.","pattern":"have an edge over [someone]"},{"sentence":"In a close race, having better endurance can give you the edge over others.","pattern":"have the edge over"}],"more_examples":["Because she has lived in the city for years, she has an edge over the new recruits.","The team has a significant edge over their opponents thanks to their superior training facilities.","In a crowded job market, having a specialized certification can give you an edge over other applicants."],"synonyms":["have an advantage over","have the upper hand"],"antonyms":["be at a disadvantage","be outmatched"],"gap":{"sentence":"Because she has lived in the city for ten years, she _____ the other candidates who are new to the area.","answer":"has an edge over","options":["has an edge over","has a fear of","has a debt to","has a meeting with"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/331666-332145.webm","at":3316.9,"dur":4.79}},{"term":"hand over","pos":"phrasal verb","definition":"To stop working on a task and return responsibility for it to another person.","time":3329.5,"lesson":"You give the AI a task, and after 30 minutes, it hands the task over to you. Codex, however, takes its time and tests everything extensively to ensure it works.","examples":[{"sentence":"The outgoing manager will hand over the project to his successor next week.","pattern":"hand over + object + to + person"},{"sentence":"I'm ready to hand over the keys once you've signed the contract.","pattern":"be ready to hand over"},{"sentence":"The robot was designed to hand over the heavy packages to the customers.","pattern":"hand over + object"},{"sentence":"He refused to hand over any information regarding the private investigation.","pattern":"refuse to hand over"}],"more_examples":["The nurse will hand over the patient's records to the night shift.","I need to hand over my responsibilities before I go on maternity leave.","Please hand over the documents to the receptionist as soon as you arrive."],"synonyms":["pass on","transfer","turn over","give over","delegate"],"antonyms":["take over"],"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/332836-333446.webm","at":3328.5,"dur":6.1}},{"term":"go over","pos":"phrasal verb","definition":"To examine or review something carefully and in detail.","time":3337.0,"lesson":"Codex really takes its time. It goes over everything and tests extensively to make sure that it actually works.","examples":[{"sentence":"Could you go over the contract one more time before I sign it?","pattern":"go over + object"},{"sentence":"I need to go over my notes before the presentation starts.","pattern":"need to + go over"},{"sentence":"Let's go over the main points of the meeting to ensure we are all on the same page.","pattern":"Let's + go over + noun phrase"},{"sentence":"The teacher went over the homework with the students to explain the mistakes.","pattern":"past tense: went over"}],"more_examples":["I'd like to go over the itinerary to see if we missed any stops.","Before we submit the proposal, we should go over the budget one last time.","Can you go over the instructions again? I'm still a bit confused about step three."],"synonyms":["review","examine","check","inspect","study","re-examine","scrutinize","run through","look over","audit"],"antonyms":["ignore","overlook","skip","neglect"],"gap":{"sentence":"Since the project requirements are quite complex, we need to _____ the technical specifications one more time to avoid any errors.","answer":"go over","options":["go over","ignore","forget","hide"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/333572-334304.webm","at":3335.8,"dur":7.32}},{"term":"expire","pos":"verb","definition":"To reach the end of a fixed period of time and no longer be valid.","time":3428.9,"lesson":"When the subscription has fully expired, I will buy a Claude account to use and test this.","examples":[{"sentence":"My passport will expire next month, so I need to renew it.","pattern":"will expire"},{"sentence":"The offer is only valid until the coupon expires at midnight.","pattern":"until [subject] expires"},{"sentence":"Your membership has expired; please log in to update your payment details.","pattern":"has expired"}],"more_examples":["The milk will expire in two days, so we should drink it soon.","The contract is set to expire at the end of the year.","Please make sure you use your gift card before it expires."],"synonyms":["run out","lapse","terminate","end","cease","come to an end"],"antonyms":["renew","continue","extend"],"gap":{"sentence":"I can't use this milk because the date on the carton has already _____.","answer":"expired","options":["expired","improved","started","hidden"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/343094-343323.webm","at":3431.0,"dur":2.29}},{"term":"proper name","pos":"noun phrase","definition":"A specific name for a particular person, place, or organization that does not use an article.","time":3462.4,"lesson":"If you say 'Claude,' it is just the name; it is a proper name, so you do not use an article. It is the same way as 'America,' where you do not say 'an America.'","examples":[{"sentence":"Paris is a proper name, so you shouldn't say 'the Paris.'","pattern":"proper name + so + [result]"},{"sentence":"When writing a formal report, always capitalize every proper name.","pattern":"capitalize + proper name"},{"sentence":"Is 'Google' considered a proper name or a common noun in this context?","pattern":"Is [Name] considered a proper name...?"},{"sentence":"You don't need an article before a proper name like 'Microsoft.'","pattern":"no article + proper name"}],"countable":[{"meaning":"A specific name for a particular person, place, or organization that does not use an article.","example":"If you say 'Claude,' it is just the name; it is a proper name, so you do not use an article.","lesson":true}],"uncountable":[],"more_examples":["In many languages, you don't use a definite article before a proper name.","The form asks for your full proper name, not just a nickname.","Did you remember to capitalize the proper name in the address line?"],"synonyms":[],"antonyms":[],"gap":{"sentence":"Because the term refers to a specific person or place without an article, it is classified as a _____.","answer":"proper name","options":["proper name","common noun","adjective","verb"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/346232-346670.webm","at":3462.4,"dur":4.38}},{"term":"pay off","pos":"phrasal verb","definition":"To produce good results or be worth the time and money spent on it.","time":3734.6,"lesson":"That is not the point. I like spending money on things that pay off, and it surely pays off.","examples":[{"sentence":"The investment in new software really paid off when our productivity doubled.","pattern":"subject + paid off"},{"sentence":"I'm not sure if all this hard work will pay off in the end.","pattern":"will + pay off"},{"sentence":"The marketing campaign paid off, resulting in a 20% increase in sales.","pattern":"paid off + [result clause]"},{"sentence":"It took a lot of effort, but the training eventually paid off.","pattern":"adverb (eventually) + paid off"}],"more_examples":["All those late nights studying finally paid off when she got the scholarship.","The renovation was expensive, but it really paid off in terms of property value.","I hope my decision to switch careers pays off in the long run."],"synonyms":["yield results","bear fruit","be worth it","be rewarding","yield a return","come to fruition","prove successful"],"antonyms":["flop","be fruitless","fail","go nowhere"],"gap":{"sentence":"I spent months practicing every day, and it finally _____ when I passed the exam with a perfect score.","answer":"paid off","options":["paid off","failed out","gave up","fell back"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/373536-373899.webm","at":3735.6,"dur":3.63}},{"term":"keep up with","pos":"phrasal verb","definition":"To move, work, or progress at the same speed as something else.","time":3788.4,"lesson":"I try to manage the agents, but I can't keep up with three of them at once. By the time I finish reading one part, another agent has already finished its task.","examples":[{"sentence":"I'm finding it hard to keep up with all the new emails I receive every day.","pattern":"keep up with + noun"},{"sentence":"Technology is moving so fast that it's difficult to keep up with the latest trends.","pattern":"keep up with + the latest trends"},{"sentence":"If you don't study regularly, you might find it hard to keep up with the rest of the class.","pattern":"keep up with + the rest of [group]"},{"sentence":"She ran as fast as she could to keep up with the group.","pattern":"keep up with + [person/group]"}],"more_examples":["It's challenging to keep up with the news when there's so much happening globally.","The company is struggling to keep up with the increasing demand for their products.","I need to read more books to keep up with the latest developments in my field."],"synonyms":["match","stay abreast of","keep pace with","maintain the pace of","follow","stay current with"],"antonyms":["fall behind","lag behind"],"gap":{"sentence":"The project is moving so quickly that I'm struggling to _____ the constant changes.","answer":"keep up with","options":["keep up with","fall behind","give up on","put off"]},"clip":{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/378594-379235.webm","at":3786.0,"dur":6.41}}],"dialogues":[{"title":"Beards and penis size","lines":[{"speaker":"A","text":"Hey, what's up? I'm doing well, but I was just looking at my beard. It's barely growing at all.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/000782-002186.webm","at":8.0,"dur":14.04}]},{"speaker":"A","text":"I used to use special beard oil and a brush, but honestly, shaving is even more of a hassle for me.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/004696-006285.webm","at":47.1,"dur":15.89}]},{"speaker":"B","text":"I'd be glad if I had no facial hair. It's like you don't have to wash it all day long.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/006386-007448.webm","at":64.0,"dur":10.62}]},{"speaker":"A","text":"You're lucky to have a small penis too. You don't have to go out and order large condoms.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/008420-009483.webm","at":84.3,"dur":10.63}]},{"speaker":"B","text":"A friend once told me he had a giant one. I made a joke about it and found a hilarious Russian phrase.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/010616-012233.webm","at":106.3,"dur":16.17}]},{"speaker":"A","text":"That's true, a big penis is often not very convenient.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/016148-017082.webm","at":161.7,"dur":9.34}]},{"speaker":"B","text":"When I worked in webcam, I saw some guys with 30-centimeter 'hammers.' They had to explain it at the airport because people thought they were carrying bombs.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/018330-019917.webm","at":183.4,"dur":15.87}]},{"speaker":"A","text":"I think 30 centimeters is an exaggeration. 20 or 25 is huge, but 30 seems like a stretch.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/024270-025595.webm","at":242.8,"dur":13.25}]},{"speaker":"B","text":"Most girls don't want to date guys with giant ones. Some girls like them, but most prefer something slightly above average.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/027122-028586.webm","at":271.4,"dur":14.64}]},{"speaker":"A","text":"A study showed that when women see 3D-printed models, they usually pick something slightly above average, like 16 or 17 centimeters.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/031486-033119.webm","at":315.0,"dur":16.33}]},{"speaker":"B","text":"The perfect size to satisfy most girls is actually around 11 to 12 centimeters, but we have to take into account the erection.","highlights":["take into account"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/035182-036746.webm","at":351.9,"dur":15.64}]},{"speaker":"A","text":"I don't have any shame talking about genitals, but I'm not sure how you feel about this.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/038968-040409.webm","at":389.8,"dur":14.41}]}],"time":7.6,"topic":0},{"title":"Developing a delivery optimization app","lines":[{"speaker":"A","text":"So, did you manage to get a shower or hit the pool?","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/042604-042948.webm","at":426.1,"dur":3.44}]},{"speaker":"B","text":"Yeah, I needed to refresh myself before talking to people. When you spend all day coding, it's a must.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/042880-043700.webm","at":428.9,"dur":8.2}]},{"speaker":"A","text":"Are you still working on your Telecloud application?","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/044392-044890.webm","at":444.0,"dur":4.98}]},{"speaker":"B","text":"I'm actually finished with Telecloud. It works well enough now, but I'm on a much cooler quest.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/044774-045841.webm","at":447.8,"dur":10.67}]},{"speaker":"A","text":"I remember you mentioned something about an English project.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/046170-047079.webm","at":461.8,"dur":9.09}]},{"speaker":"B","text":"English is next on the list, but I'm also working on a delivery problem. I used to work at my father's company in Astrakhan.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/049680-050850.webm","at":496.9,"dur":11.7}]},{"speaker":"B","text":"I was so frustrated by the inefficient decisions they made. I had to manually plan routes for two cars with different capacities.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/051702-053246.webm","at":517.1,"dur":15.44}]},{"speaker":"B","text":"You have to satisfy different time windows for each customer. I'd spend ages trying to figure out a better route so nobody would be late.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/058318-059108.webm","at":583.3,"dur":7.9}]},{"speaker":"B","text":"Back then, I didn't know any algorithms. I was like a researcher tackling a brand-new problem, and I eventually came up with a solution.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/064352-064946.webm","at":643.6,"dur":5.94},{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/066200-066485.webm","at":662.1,"dur":2.85}]},{"speaker":"B","text":"Now that AI agents are so advanced, I can just feed them the algorithm. I built an app that optimizes the delivery!","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/068018-069374.webm","at":680.3,"dur":13.56}]},{"speaker":"A","text":"I'd love to see it!","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/070336-070887.webm","at":703.5,"dur":5.51}]},{"speaker":"B","text":"Check this out. I intentionally made this example a very hard day to test it.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/071780-072292.webm","at":718.0,"dur":5.12}]}],"time":426.1,"topic":0},{"title":"Optimizing delivery routes with heuristic algorithms","lines":[{"speaker":"A","text":"Usually, delivery windows are quite wide because people can wait, but I intentionally made these very tight to test the system.","highlights":["delivery windows"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/073216-074286.webm","at":732.3,"dur":10.7}]},{"speaker":"B","text":"You've set some addresses so close together that it's impossible to make work in real life.","highlights":["make work"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/077888-078442.webm","at":779.0,"dur":5.54}]},{"speaker":"A","text":"I also assigned very small loads to the cars, specifically for companies with limited resources.","highlights":["limited resources"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/080012-080394.webm","at":800.3,"dur":3.82},{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/081610-082492.webm","at":816.2,"dur":8.82}]},{"speaker":"B","text":"Since there's no guarantee the system will find a perfect solution, how does it handle the constraints?","highlights":["no guarantee"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/087480-088354.webm","at":874.9,"dur":8.74}]},{"speaker":"A","text":"It uses a heuristic algorithm. The longer the engine runs, the better the solutions it finds by trying many different options.","highlights":["heuristic algorithm"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/084172-085460.webm","at":841.8,"dur":12.88}]},{"speaker":"B","text":"If it can't find a solution after 40 seconds, what does it do?","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/090408-090832.webm","at":904.2,"dur":4.24}]},{"speaker":"A","text":"It tells me the minimal change I can make to the system to make it work.","highlights":["minimal change"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/090812-091467.webm","at":908.2,"dur":6.55}]},{"speaker":"B","text":"The algorithm suggests asking one person to wait for two and a half hours. That's a lot!","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/099234-100286.webm","at":992.4,"dur":10.52}]},{"speaker":"A","text":"There are other options, like asking two people to wait a little. Some people don't mind because they are home all day.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/100878-102212.webm","at":1008.9,"dur":13.34}]},{"speaker":"B","text":"I see. But some addresses are non-negotiable; they simply cannot wait because they are closed.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/102490-103228.webm","at":1025.0,"dur":7.38}]}],"time":732.3,"topic":1},{"title":"Optimizing delivery routes with algorithms","lines":[{"speaker":"A","text":"I've restricted the algorithm's behavior for this specific organization because they have strict requirements and need to be assigned on time.","highlights":["strict requirements"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/103762-105242.webm","at":1037.7,"dur":14.8}]},{"speaker":"A","text":"With these constraints, the algorithm needs to identify which clients can actually wait.","highlights":["with these constraints"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/105346-106801.webm","at":1053.6,"dur":14.55}]},{"speaker":"B","text":"The optimizer will run for about 40 seconds. Look at this remote address; people living that far out usually don't mind waiting.","highlights":["don't mind"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/107026-107973.webm","at":1070.4,"dur":9.47}]},{"speaker":"A","text":"This order is the main issue. If we ask this person to wait just 20 minutes, the algorithm can solve all the routes.","highlights":["the main issue"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/115726-117074.webm","at":1157.4,"dur":13.48}]},{"speaker":"B","text":"It figured out a very sophisticated way to schedule the vehicles. They have plenty of time, but we need to account for traffic.","highlights":["account for"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/117168-118564.webm","at":1171.8,"dur":13.96}]},{"speaker":"B","text":"A 30-minute buffer before the end of their shift is a comfortable amount of time.","highlights":["amount of time"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/119002-120218.webm","at":1190.1,"dur":12.16}]},{"speaker":"A","text":"For huge orders, it splits them up. For example, it can divide a delivery of 45 bottles between two different trucks.","highlights":["splits them up"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/120434-121917.webm","at":1204.4,"dur":14.83}]},{"speaker":"A","text":"It's amazing how it manages the capacity to deliver every single bottle while satisfying all the criteria.","highlights":["satisfying all the criteria"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/126548-127682.webm","at":1265.6,"dur":11.34}]},{"speaker":"B","text":"It's a cool application, but if I were an employee, I'd find it hard to navigate because everything is in English and needs instructions.","highlights":["hard to navigate"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/130746-132277.webm","at":1307.6,"dur":15.31}]},{"speaker":"A","text":"I'm building this for myself right now, but for the production version, I'll simplify the options and just give them one button.","highlights":["production version"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/135434-136954.webm","at":1354.4,"dur":15.2}]}],"time":1037.7,"topic":1},{"title":"Optimizing delivery logistics and ride-sharing","lines":[{"speaker":"A","text":"The app's interface is great. Since it's all in Russian, it'll be a very practical application for any delivery company.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/138692-139249.webm","at":1387.0,"dur":5.57}]},{"speaker":"B","text":"Exactly. The coolest part is how universal it is. For instance, we have four cars delivering orders in the city, but I still have to take a taxi or the bus.","highlights":["the coolest part"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/139752-141031.webm","at":1397.6,"dur":12.79}]},{"speaker":"A","text":"I know! Buses in Astrakhan were terrible four years ago. Since these delivery cars have empty seats, maybe we can use them to transport people without losing any efficiency.","highlights":["without losing"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/142574-143359.webm","at":1425.8,"dur":7.85},{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/143936-144152.webm","at":1439.5,"dur":2.16}]},{"speaker":"B","text":"Let's see. I want to pick up 'Bob' at 1 p.m. I'm willing to wait for an hour. I can just drop a pin on the map for the pickup location.","highlights":["drop a pin"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/151790-152646.webm","at":1518.0,"dur":8.56},{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/153636-154078.webm","at":1536.5,"dur":4.42}]},{"speaker":"A","text":"We can assign it to an existing order or create a new point. Let's set the delivery time for 2 p.m. and assign it to the green truck.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/155676-156244.webm","at":1556.9,"dur":5.68},{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/159308-159765.webm","at":1593.2,"dur":4.57}]},{"speaker":"B","text":"The system is struggling to find a solution. It's trying many random seeds, but there's no guarantee it will work. I feel like it might never find a way to solve the system.","highlights":["no guarantee"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/164472-165004.webm","at":1644.8,"dur":5.32},{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/165338-166040.webm","at":1653.5,"dur":7.02}]},{"speaker":"A","text":"I know the system is solvable. I'm currently working on speeding up the engine by rewriting the implementation in C++ to make it five or six times faster.","highlights":["speeding up"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/166040-167716.webm","at":1660.5,"dur":16.76}]}],"time":1387.0,"topic":1},{"title":"Optimizing delivery route engines","lines":[{"speaker":"A","text":"I want the engine to provide options that are close to the optimal solution. If it shows a six-minute difference, that's fine, but fifty minutes is unacceptable.","highlights":["close to"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/169506-170970.webm","at":1695.2,"dur":14.64}]},{"speaker":"B","text":"I understand. Even if there are three people to move, forty minutes is still too much. You'd rather go with the six-minute option.","highlights":["go with"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/173706-174686.webm","at":1737.3,"dur":9.8}]},{"speaker":"A","text":"Actually, one of the optimizations was this street. It was a green truck that delivered it, but the order was assigned to a different truck.","highlights":["assigned to"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/176784-178403.webm","at":1767.9,"dur":16.19}]},{"speaker":"B","text":"Right, because the starting window is much later. The truck didn't just sit there for two hours; it went on delivering other addresses.","highlights":["sit there"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/181964-183747.webm","at":1819.7,"dur":17.83}]},{"speaker":"A","text":"It's a cool application. When I run the engine, I can see all the paths and seeds it tries. Just looking at them calms me down.","highlights":["calms me down"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/184182-185641.webm","at":1842.0,"dur":14.59}]},{"speaker":"B","text":"Optimizing the engine to provide more solutions will be a huge improvement. Claude calculated that the difference is around five times on the benchmarks.","highlights":["huge improvement"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/188000-189536.webm","at":1880.1,"dur":15.36}]},{"speaker":"A","text":"You could actually sell this to other companies. I know that nobody else does this. When I worked at Yandex, their optimizer wasn't nearly as configurable as mine.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/191560-193136.webm","at":1915.7,"dur":15.76}]},{"speaker":"B","text":"That's very useful for business. I was also thinking about a cool feature: handoffs. Like when one truck gives products, such as bottles or pizza, to another truck.","highlights":["thinking about"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/197876-199278.webm","at":1978.9,"dur":14.02}]}],"time":1695.2,"topic":3},{"title":"Logistics and delivery driver management","lines":[{"speaker":"A","text":"When you're planning delivery routes, do you mark out specific spots on the map beforehand?","highlights":["mark out"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/203578-203801.webm","at":2035.9,"dur":2.23}]},{"speaker":"B","text":"Yes, but you have to visit them in advance to see if there's enough space or if it's convenient.","highlights":["in advance"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/204128-204922.webm","at":2041.4,"dur":7.94}]},{"speaker":"A","text":"I'm figuring out how to implement a system where drivers can meet up to exchange products instead of going back to the depot.","highlights":["meet up"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/206830-207523.webm","at":2068.4,"dur":6.93}]},{"speaker":"B","text":"Do you also factor in time for drivers to take breaks, eat, or have a smoke?","highlights":["factor in"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/208006-209153.webm","at":2080.3,"dur":11.47}]},{"speaker":"A","text":"You need to build in a buffer because you never know how long a customer will take. You could set a 15-minute window instead of 10.","highlights":["build in"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/210838-211406.webm","at":2108.5,"dur":5.68}]},{"speaker":"B","text":"Exactly. You can assign specific shifts and breaks. Unless you want to treat your employees like robots who don't need to pee.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/214930-215471.webm","at":2149.4,"dur":5.41},{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/217604-217968.webm","at":2176.2,"dur":3.64}]},{"speaker":"A","text":"I'm also planning to build an app with a reward system because every action should be rewarded somehow.","highlights":["reward system"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/219128-220083.webm","at":2191.5,"dur":9.55}]},{"speaker":"B","text":"Some orders are easy, like carrying two bottles in an elevator, but others require heavy lifting and multiple trips.","highlights":["heavy lifting"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/222972-223999.webm","at":2229.8,"dur":10.27},{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/224928-225219.webm","at":2249.5,"dur":2.91}]},{"speaker":"A","text":"In some areas, there are no elevators, so you have to carry bottles up to the fifth floor or walk 300 meters to a school.","highlights":["no elevators"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/225730-226534.webm","at":2257.4,"dur":8.04}]},{"speaker":"B","text":"If an operator just looks at time windows, one driver might get easy tasks while another does all the heavy lifting for the same pay.","highlights":["heavy lifting"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/230050-231187.webm","at":2300.6,"dur":11.37}]},{"speaker":"A","text":"It's a complex system because you have to account for so many different variables.","highlights":["account for"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/230982-232477.webm","at":2309.9,"dur":14.95}]}],"time":2035.9,"topic":4},{"title":"Logistics algorithms and optimization","lines":[{"speaker":"A","text":"I don't think the system where drivers assign a difficulty level is very reliable because people might just lie.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/233812-234414.webm","at":2338.2,"dur":6.02}]},{"speaker":"B","text":"Actually, it's easy to check. If the last driver gave it a two, why is it a four now? You can just ask for a reason.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/235680-237128.webm","at":2357.0,"dur":14.48}]},{"speaker":"A","text":"I thought of a GPS tracker system to measure the distance from the car to the gate, but that would be unreliable.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/238620-239364.webm","at":2386.3,"dur":7.44}]},{"speaker":"B","text":"Exactly. In Russia, internet coverage is poor in some districts, and they often shut down GPS signals, especially during certain times.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/241798-242522.webm","at":2418.1,"dur":7.24}]},{"speaker":"A","text":"The app looks amazing already. It's a huge time-saver and optimizes many different things.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/246116-247010.webm","at":2461.3,"dur":8.94}]},{"speaker":"B","text":"My father never understood me. He was fine with the old system, but I knew we could make it much better.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/247112-248364.webm","at":2471.2,"dur":12.52}]},{"speaker":"A","text":"Even if you hired three software developers, they wouldn't have built it the same way I did. It takes a lot of effort.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/250900-252033.webm","at":2509.1,"dur":11.33}]},{"speaker":"B","text":"This isn't average programming; it's more like mathematical or even Olympic-level programming. You have to think about it for a long time.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/254218-255075.webm","at":2542.3,"dur":8.57}]},{"speaker":"A","text":"The open-source algorithms have been around for a while, but I didn't know how to work with the libraries.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/255692-256556.webm","at":2557.0,"dur":8.64}]},{"speaker":"B","text":"Building a distance matrix was impossible back then. For 30 points, you'd need to calculate over 800 values manually.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/257882-258931.webm","at":2578.9,"dur":10.49}]},{"speaker":"A","text":"You'd have to open hundreds of tabs in Yandex to get the distances, but they'll block you after about a hundred requests.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/261950-262938.webm","at":2619.7,"dur":9.88}]}],"time":2338.2,"topic":4},{"title":"Using AI for complex coding tasks","lines":[{"speaker":"A","text":"It sounds amazing to handle 800 stops, but those algorithms are designed for companies with massive fleets.","highlights":["designed for"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/265156-266620.webm","at":2651.7,"dur":14.64}]},{"speaker":"B","text":"Claude said that for your task with 40 locations, it's easy peasy. However, it took Claude three days to do what took me three years of planning.","highlights":["easy peasy"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/267632-269064.webm","at":2676.4,"dur":14.32}]},{"speaker":"A","text":"Planning is the most important thing. I remember Claude spent five hours building it from scratch after I spent 14 minutes describing the requirements.","highlights":["from scratch"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/270416-271870.webm","at":2704.3,"dur":14.54}]},{"speaker":"B","text":"I can't rely on AI for big tasks. I prefer using it as a small injection to modify a specific class or implement a new feature.","highlights":["rely on"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/274984-276400.webm","at":2749.9,"dur":14.16}]},{"speaker":"A","text":"I've tried big tasks, but it took four hours and the results weren't great. It's hard to manage an already large application with such big requests.","highlights":["results weren't great"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/279946-281374.webm","at":2799.6,"dur":14.28}]},{"speaker":"B","text":"You feel like you're losing control if you don't specify exactly what you want. The AI just does things its own way, which is hard to follow.","highlights":["losing control"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/283266-284738.webm","at":2832.9,"dur":14.72}]},{"speaker":"A","text":"It's not that it's hard to track; it's just that the AI creates new classes instead of using the ones that already exist.","highlights":["instead of"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/285744-287290.webm","at":2857.5,"dur":15.46}]},{"speaker":"B","text":"I tried adding all our microservices to the project using analyst comments and documentation, but it still didn't use existing classes.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/288218-289789.webm","at":2882.4,"dur":15.71}]},{"speaker":"A","text":"Why does it bother you that it creates new classes? Maybe those classes are actually needed and it's doing a better job.","highlights":["doing a better job"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/294600-296008.webm","at":2946.2,"dur":14.08}]},{"speaker":"B","text":"It's just that too many classes make the system too complicated for a new person to understand.","highlights":["too complicated"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/296010-296690.webm","at":2960.2,"dur":6.8}]}],"time":2651.7,"topic":5},{"title":"Using AI for coding projects","lines":[{"speaker":"A","text":"The AI understands the code better than you do because you'd have to open every file to grasp new concepts.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/298280-299213.webm","at":2982.9,"dur":9.33}]},{"speaker":"B","text":"I think it's better to use AI for specific parts of a project rather than letting it build everything from scratch.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/302540-303488.webm","at":3025.6,"dur":9.48}]},{"speaker":"A","text":"If you rely on AI completely from the start, you lose your own opinion on how the code should actually work.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/305246-306672.webm","at":3052.6,"dur":14.26}]},{"speaker":"B","text":"Think of it this way: you should have a clear picture in your head of what the project looks like before you start coding.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/308334-309521.webm","at":3083.5,"dur":11.87},{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/309842-310580.webm","at":3098.6,"dur":7.38}]},{"speaker":"B","text":"If you had a great programmer next to you, you'd know exactly how to explain the steps to them.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/312286-313300.webm","at":3123.0,"dur":10.14}]},{"speaker":"B","text":"I'd spend hours chatting with the bot to figure out the plan and ensure the code stays readable and accounts for future features.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/316034-316741.webm","at":3160.4,"dur":7.07}]},{"speaker":"A","text":"I'm too lazy to spend three hours chatting with an AI. I prefer giving precise instructions for small, specific tasks.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/319664-320700.webm","at":3196.7,"dur":10.36}]},{"speaker":"B","text":"I prefer using Cursor over Codex because it's much easier to use for those kinds of precise tasks.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/323940-324880.webm","at":3239.5,"dur":9.4}]},{"speaker":"A","text":"I've never used Cursor, but I bought subscriptions for both Codex and Claude. They feel very different to me.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/327954-328570.webm","at":3279.7,"dur":6.16}]}],"time":2982.9,"topic":5},{"title":"Comparing Claude and Codex for development","lines":[{"speaker":"A","text":"I've been tweaking the settings in Claude Code quite a bit because it's so customizable. You can specify exactly how you want it to operate.","highlights":["quite a bit"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/329948-330968.webm","at":3299.6,"dur":10.2}]},{"speaker":"B","text":"I feel like Claude has an edge over ChatGPT. Codex tends to give up too early, whereas Claude really takes its time to test everything extensively.","highlights":["has an edge over"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/331666-332632.webm","at":3316.9,"dur":9.66}]},{"speaker":"A","text":"That makes sense for big systems. An ML developer at my job uses Claude Code for his tasks. My ChatGPT subscription expired a few weeks ago, but I can still use Codex.","highlights":["makes sense"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/335170-336207.webm","at":3351.9,"dur":10.37}]},{"speaker":"B","text":"Once your subscription has fully expired, are you planning to get a Claude Code subscription?","highlights":["fully expired"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/343094-344116.webm","at":3431.0,"dur":10.22}]},{"speaker":"A","text":"Yeah, I'll get a subscription. I can't afford to buy the whole thing, but I'll check the prices. I see options for $20, $100, and $200.","highlights":["afford to"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/348508-349289.webm","at":3485.2,"dur":7.81}]},{"speaker":"B","text":"The $100 version is actually quite limiting for big tasks. ChatGPT also has strict limitations on tokens, and they get consumed really fast during big projects.","highlights":["quite limiting"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/352366-353934.webm","at":3523.9,"dur":15.68}]},{"speaker":"A","text":"I don't know why people mention a five-hour limit on Codex; I've never seen it. But if it's a restriction, it's a big deal for important work.","highlights":["a big deal"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/356404-357069.webm","at":3564.1,"dur":6.65}]},{"speaker":"B","text":"Exactly. It's a major restriction for something really big and important. That's why I'll probably pay for the $200 plan.","highlights":["major restriction"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/360262-361150.webm","at":3602.7,"dur":8.88}]}],"time":3299.6,"topic":6},{"title":"Maximizing AI Agent Productivity","lines":[{"speaker":"A","text":"I saw news that ChatGPT is improving its subscriptions, including a 'Pro Max' plan for around $200 a month.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/361516-362809.webm","at":3615.3,"dur":12.93}]},{"speaker":"B","text":"Oh my god, $500 a month? They actually lose money on those $100 or $200 subscriptions.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/364348-365789.webm","at":3643.6,"dur":14.41}]},{"speaker":"A","text":"I was hesitant to pay for two $100 subscriptions, but I realized they give me so much value and joy.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/366348-367786.webm","at":3663.6,"dur":14.38}]},{"speaker":"B","text":"You aren't short on cash, so you can afford it. But I only had $40 left after paying $200!","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/371162-372633.webm","at":3711.7,"dur":14.71}]},{"speaker":"A","text":"The point is spending money on things that pay off. I still need to figure out how to monetize my app.","highlights":["pay off"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/373130-374676.webm","at":3731.5,"dur":15.46}]},{"speaker":"B","text":"People think agents work independently, but I'm sitting at my computer 24/7 managing three of them at once.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/376122-377576.webm","at":3761.3,"dur":14.54}]},{"speaker":"A","text":"I can't keep up with all three sessions. I have to be there constantly to guide them and get the maximum value.","highlights":["keep up with"],"clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/378858-380260.webm","at":3788.7,"dur":14.02},{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/381848-382564.webm","at":3818.7,"dur":7.16}]},{"speaker":"B","text":"It's like being a product owner. No matter how good a developer you are, an agent will always be faster in some ways.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/385224-386952.webm","at":3852.3,"dur":17.28}]},{"speaker":"A","text":"Exactly. If you know how to interact with it properly, it amplifies any skill you have.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/387412-388215.webm","at":3874.2,"dur":8.03}]},{"speaker":"B","text":"It's a great tool for developers and small companies. Even with 10 years of experience, I can't beat an agent's speed.","clips":[{"src":"lesson_audio/lesson_date_25-09-2026_time_15-10-57/389938-391344.webm","at":3899.5,"dur":14.06}]},{"speaker":"A","text":"I just
