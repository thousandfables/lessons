.2,"dur":10.6}},{"term":"rely on one's intuition","pos":"expression","definition":"To trust your feelings or inner sense of what is right rather than using facts.","time":2841.9,"lesson":"You will not see the time, so you will just have to rely on your own intuition regarding how long you have been speaking.","examples":[{"sentence":"I didn't have any data, so I had to rely on my intuition to make the final decision.","pattern":"rely on one's intuition + to + verb"},{"sentence":"When choosing a career, many people rely on their intuition more than a logical plan.","pattern":""},{"sentence":"You can't always rely on your intuition; sometimes you need to check the facts.","pattern":"can't always rely on"}],"more_examples":["I don't have the full report yet, so I'll have to rely on my intuition to gauge the client's reaction.","Sometimes you just have to rely on your intuition when you're faced with a complex moral dilemma.","She's a great salesperson because she knows how to rely on her intuition to read people's body language."],"synonyms":["trust your gut","go with your gut","follow your instincts","trust your inner voice"],"antonyms":["rely on facts","base it on data","use logic","consult the evidence","make a calculated decision"],"gap":{"sentence":"Since there were no clear statistics available, she had to _____ to choose the best candidate for the job.","answer":"rely on her intuition","options":["rely on her intuition","rely on her hobbies","rely on her schedule","rely on her dreams"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/284270-284753.webm","at":2842.9,"dur":4.83}},{"term":"bump into","pos":"phrasal verb","definition":"To encounter or come across something unexpectedly, such as a topic or a problem.","time":2900.1,"lesson":"If it's not a personal topic, I have bumped into types of questions like what people should do with old buildings in the city.","examples":[{"sentence":"I bumped into an old friend at the supermarket yesterday.","pattern":"bump into + person"},{"sentence":"While researching the project, I bumped into some interesting data.","pattern":"bump into + information/objects"},{"sentence":"You might bump into some unexpected problems during the installation.","pattern":"might + bump into + abstract noun"}],"more_examples":["I was just browsing the archives when I bumped into a few old letters.","We might bump into some technical glitches once the software goes live.","I'm hoping to bump into some useful tips while reading the manual."],"synonyms":["run into","come across","encounter","stumble upon","happen upon","find by chance"],"antonyms":["avoid","dodge","shun"],"gap":{"sentence":"I was planning a simple dinner, but I _____ some unexpected complications when the oven suddenly stopped working.","answer":"bumped into","options":["bumped into","planned","prepared","fixed"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/289782-290600.webm","at":2897.9,"dur":8.18}},{"term":"sweet spot","pos":"noun phrase","definition":"The ideal point, time, or condition for achieving the best result.","time":3089.0,"lesson":"The timing is fine, but usually the sweet spot is one minute and 30 seconds.","examples":[{"sentence":"The sweet spot for launching a new product is usually during the holiday season.","pattern":"The sweet spot for + [noun/gerund]"},{"sentence":"We need to find the sweet spot between high quality and low cost.","pattern":"sweet spot between [X] and [Y]"},{"sentence":"The sweet spot for this advertisement is about 30 seconds long.","pattern":"sweet spot is [time/measurement]"},{"sentence":"You've hit the sweet spot with this design; it's exactly what the client wanted.","pattern":"hit the sweet spot"}],"countable":[{"meaning":"The ideal point, time, or condition for achieving the best result.","example":"The timing is fine, but usually the sweet spot is one minute and 30 seconds.","lesson":true},{"meaning":"The area on a racket or bat where the ball hits best","example":"You need to hit the ball on the sweet spot of the racket."},{"meaning":"A place or situation that is very convenient or advantageous","example":"This neighborhood is the sweet spot for commuters who work downtown."}],"uncountable":[],"more_examples":["We're trying to find the sweet spot for the price point to attract more customers.","The sweet spot for a workout is usually right after a light warm-up.","The new software update hit the sweet spot by fixing bugs without slowing down the system."],"synonyms":["ideal balance","optimum point","prime condition","golden mean"],"antonyms":["suboptimal point","dead zone"],"gap":{"sentence":"The photographer spent hours adjusting the camera settings to find the _____ where the lighting looked perfect.","answer":"sweet spot","options":["sweet spot","loud spot","wrong spot","heavy spot"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/309030-309263.webm","at":3090.4,"dur":2.33}},{"term":"flow naturally","pos":"expression","definition":"To happen or be told in a smooth, easy, and effortless way.","time":3123.3,"lesson":"Stories based on your real experiences are much simpler to tell because you can imagine them. Because of this, the story just flows naturally.","examples":[{"sentence":"The conversation flowed naturally, and we didn't notice how much time had passed.","pattern":"subject + flow naturally"},{"sentence":"I want my presentation to flow naturally rather than sounding like I'm reading a script.","pattern":"want something + to flow naturally"},{"sentence":"The transition between the two scenes in the movie flowed naturally.","pattern":"noun + flowed naturally"},{"sentence":"If you practice enough, your speech will start to flow naturally.","pattern":"start + to flow naturally"}],"more_examples":["The music in the background flows naturally with the rhythm of the dance.","I hope the dialogue in the play flows naturally between the characters.","The new software update allows the user interface to flow naturally from one screen to another."],"synonyms":["run smoothly","come easily","smoothly","without a hitch"],"antonyms":["feel forced","be awkward","be disjointed","stilted"],"gap":{"sentence":"Because we were both so relaxed and comfortable, the conversation _____ without any awkward silences.","answer":"flowed naturally","options":["flowed naturally","felt forced","became complicated","stayed silent"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/312304-312979.webm","at":3123.2,"dur":6.75}},{"term":"synonymous with","pos":"expression","definition":"having the same meaning as another word or being closely associated with something.","time":3174.6,"lesson":"He has a lot of job offers coming in, but that is not synonymous with being famous.","examples":[{"sentence":"In many cultures, red is synonymous with danger or passion.","pattern":"synonymous with + noun"},{"sentence":"The brand name has become synonymous with high-quality luxury goods.","pattern":"become synonymous with"},{"sentence":"Success is not always synonymous with wealth.","pattern":"A is not synonymous with B"},{"sentence":"For many people, the word 'home' is synonymous with comfort.","pattern":"synonymous with + abstract noun"}],"more_examples":["In the tech world, the company's name is practically synonymous with innovation.","For many athletes, winning a gold medal is synonymous with ultimate achievement.","The term 'fast fashion' has become synonymous with environmental waste."],"synonyms":["equivalent to","interchangeable with"],"antonyms":["opposite to","contrary to","distinct from","different from"],"gap":{"sentence":"In the tech world, the word 'innovation' is often _____ progress because it represents the core goal of creating something new.","answer":"synonymous with","options":["synonymous with","opposite of","conflicting with","indifferent to"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/317196-317699.webm","at":3172.1,"dur":5.03}},{"term":"stand out","pos":"phrasal verb","definition":"To be much more noticeable, better, or different than others in a group.","time":3206.8,"lesson":"You mentioned that he has an interesting story, but you didn't really tell it. What exactly makes him stand out?","examples":[{"sentence":"Her bright red hair makes her stand out in a crowd.","pattern":"make + object + stand out"},{"sentence":"The company's innovative technology really makes it stand out from its competitors.","pattern":"stand out from [something]"},{"sentence":"With such a unique style, his portfolio stands out among the other applicants.","pattern":"subject + stands out"},{"sentence":"He wanted to stand out during the interview, so he prepared some impressive statistics.","pattern":"want to + stand out"}],"more_examples":["The skyscraper's modern glass facade makes it stand out against the old buildings.","I don't want to stand out, so I'm wearing something very plain today.","Her incredible singing voice really made her stand out during the talent show."],"synonyms":["be noticeable","be prominent","be conspicuous","be striking","be distinct","be unique","be eye-catching"],"antonyms":["blend in","be inconspicuous","be unremarkable"],"gap":{"sentence":"Because she wore a neon green suit to the office, she really _____ among her colleagues.","answer":"stood out","options":["stood out","sat down","stayed quiet","walked away"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/320664-320941.webm","at":3206.8,"dur":2.77}},{"term":"bail on","pos":"phrasal verb","definition":"To decide not to do something you had planned or to reject a specific opportunity.","time":3245.9,"lesson":"I refused the offer and left Google to start my own business. I bailed on that three million dollar offer, and in five years, I made twenty million.","examples":[{"sentence":"I'm sorry, but I have to bail on our dinner plans tonight because I'm feeling unwell.","pattern":"bail on + [noun/event]"},{"sentence":"He bailed on the project at the last minute, leaving the rest of the team to finish it.","pattern":"bail on + [noun/project]"},{"sentence":"Don't bail on me now; we're almost at the finish line!","pattern":"bail on + [object pronoun]"},{"sentence":"She bailed on the job offer because the commute was too long.","pattern":"bail on + [noun/offer]"}],"more_examples":["I'm sorry, I have to bail on our trip to the beach this weekend.","He bailed on his commitment to volunteer at the shelter.","Are you going to bail on me and leave me to handle the whole party alone?"],"synonyms":["flake on","back out of","blow off"],"antonyms":["stick to","follow through","honor","commit to"],"gap":{"sentence":"Even though we agreed to go hiking, he decided to _____ the trip because he was too tired.","answer":"bail on","options":["bail on","join","attend","prepare"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/324554-325055.webm","at":3245.6,"dur":5.01}},{"term":"tell someone about something","pos":"expression","definition":"To give information or share a story regarding a specific topic with another person.","time":3378.6,"lesson":"I want to tell you about an interesting TV program that I watched on National Geographic when I was younger. It told a fascinating story about a famous veterinarian in Australia who helped wild and endangered animals.","examples":[{"sentence":"Can you tell me about your trip to Japan?","pattern":"tell + someone + about + noun"},{"sentence":"I'll tell you about it as soon as I have more details.","pattern":"tell + someone + about + pronoun"},{"sentence":"She told us about her new job during dinner.","pattern":""},{"sentence":"He told me about the problems he was facing at work.","pattern":"tell + someone + about + clause"}],"more_examples":["I need to tell you about the weird noise my car is making.","Could you tell me about your experience working in a startup?","He finally told his parents about his plan to quit his job."],"synonyms":["inform someone about","update someone on","brief someone on","fill someone in on"],"antonyms":["hide something from someone","keep something secret"],"gap":{"sentence":"Since I missed the meeting, could you please _____ so I can catch up?","answer":"tell me about the project's progress","options":["tell me about the project's progress","lend me the project's progress","write me the project's progress","bring me the project's progress"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/338872-339308.webm","at":3388.9,"dur":4.36}},{"term":"on a regular basis","pos":"expression","definition":"happening frequently or at fixed intervals of time.","time":3517.0,"lesson":"That was something that happened on a regular basis in the past. You could also say you used to watch it every day.","examples":[{"sentence":"I go to the gym on a regular basis to stay fit.","pattern":"subject + verb + on a regular basis"},{"sentence":"The company updates its software on a regular basis.","pattern":"on a regular basis (at the end of a clause)"},{"sentence":"Do you check your emails on a regular basis?","pattern":"interrogative sentence with on a regular basis"},{"sentence":"She attends the meetings on a regular basis, even when she is busy.","pattern":"on a regular basis (with a contrastive clause)"}],"more_examples":["I try to drink at least eight glasses of water on a regular basis.","The neighborhood is patrolled by security guards on a regular basis.","You should back up your files on a regular basis to avoid data loss."],"synonyms":["regularly","periodically","consistently","routinely","at regular intervals"],"antonyms":["irregularly","occasionally","rarely","infrequently","sporadically"],"gap":{"sentence":"To ensure the garden remains healthy and the weeds are kept under control, I water the plants _____.","answer":"on a regular basis","options":["on a regular basis","on a sudden basis","on a rare basis","on a chaotic basis"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/351758-352263.webm","at":3517.8,"dur":5.05}},{"term":"would watch","pos":"expression","definition":"To do something regularly in the past as a habit or routine.","time":3525.1,"lesson":"You can say 'I would watch' because it was a habit of yours. For example, you could say, 'I would watch this program every day.'","examples":[{"sentence":"When I was a child, I would watch cartoons every Saturday morning.","pattern":"would + verb (past habit)"},{"sentence":"Every summer, we would watch the fireworks from the beach.","pattern":"would + verb (repeated past action)"},{"sentence":"I would watch the news every night before going to bed.","pattern":"would + verb (routine)"},{"sentence":"He would watch the birds in the garden for hours.","pattern":"would + verb (past behavior)"}],"more_examples":["Every Sunday, my grandmother would watch the neighbors bake bread.","In college, we would watch movies in the common room until late.","Whenever it rained, he would watch the droplets race down the window."],"synonyms":["used to watch"],"antonyms":[],"gap":{"sentence":"During our holidays in the countryside, we _____ the sunset every evening to relax after a long day.","answer":"would watch","options":["would watch","would eat","would run","would sleep"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/352496-352798.webm","at":3525.2,"dur":3.02}},{"term":"organism","pos":"noun","definition":"A living thing, typically referring to very small life forms like cells or bacteria.","time":3556.7,"lesson":"An organism usually means a cell or bacteria, like a very small organism. When it is a big animal, it is referred to as a body.","examples":[{"sentence":"Bacteria are microscopic organisms that can be found almost everywhere.","pattern":"adjective + organism"},{"sentence":"The scientist studied the behavior of the smallest organisms in the pond.","pattern":"the smallest organisms"},{"sentence":"Every living organism needs water and nutrients to survive.","pattern":""},{"sentence":"Is a virus considered a living organism?","pattern":""}],"countable":[{"meaning":"A living thing, typically referring to very small life forms like cells or bacteria.","example":"An organism usually means a cell or bacteria, like a very small organism.","lesson":true},{"meaning":"An individual animal, plant, or single-celled life form","example":"The biologist identified a new species of organism in the deep sea."}],"uncountable":[],"more_examples":["The laboratory is equipped to study various microscopic organisms.","Some organisms can survive in extreme temperatures and high pressure.","The researcher observed how the organism reacted to the new medication."],"synonyms":["living thing","life form","living creature"],"antonyms":["non-living thing","inanimate object","matter"],"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/355706-356633.webm","at":3557.3,"dur":9.27}},{"term":"automatic language processing","pos":"noun phrase","definition":"The subconscious ability to speak fluently without actively thinking about grammar or vocabulary.","time":3705.3,"lesson":"We have two programs: one is automatic language processing, and the other is conscious processing where you actually pay attention to what you are saying. Fluency requires automatic language processing, but it relies on patterns that are fossilized in your brain.","examples":[{"sentence":"When you reach a high level of fluency, automatic language processing allows you to speak without hesitation.","pattern":""},{"sentence":"The goal of the course is to move your speaking skills from conscious effort to automatic language processing.","pattern":""},{"sentence":"Because it is automatic language processing, I didn't notice I was making the same mistake every time.","pattern":""},{"sentence":"Automatic language processing helps you respond quickly during a fast-paced conversation.","pattern":""}],"countable":[],"uncountable":[{"meaning":"The subconscious ability to speak fluently without actively thinking about grammar or vocabulary.","example":"We have two programs: one is automatic language processing, and the other is conscious processing where you actually pay attention to what you are saying.","lesson":true}],"more_examples":["I'm trying to reach a point where automatic language processing takes over during my presentations.","The more you practice the same phrases, the more you rely on automatic language processing.","During the debate, his automatic language processing was so smooth that he never seemed to pause for words."],"synonyms":["subconscious speech","automaticity","unconscious processing","natural flow"],"antonyms":["conscious processing","deliberate speech","active thinking","manual processing"],"gap":{"sentence":"Once you stop worrying about every grammar rule, _____ allows you to speak smoothly without overthinking your words.","answer":"automatic language processing","options":["automatic language processing","manual language processing","interrupted language processing","hesitant language processing"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/370542-370861.webm","at":3705.6,"dur":3.19}},{"term":"fossilized","pos":"adjective","definition":"fixed or established in a way that is very difficult to change or remove.","time":3716.8,"lesson":"Fluency requires automatic language processing, but automatic language processing relies on patterns that are fossilized in your brain. A mistake that has gotten fossilized is very hard to detect consciously.","examples":[{"sentence":"The fossilized habits of the old company made it difficult to adopt new technology.","pattern":"fossilized + noun"},{"sentence":"If you don't correct your pronunciation now, the mistake might become fossilized.","pattern":"become + fossilized"},{"sentence":"The teacher noticed several fossilized errors in the student's speaking style.","pattern":"fossilized errors"},{"sentence":"It is hard to break fossilized patterns of thinking without conscious effort.","pattern":"fossilized patterns of [noun]"}],"more_examples":["The city's fossilized infrastructure makes it nearly impossible to expand the subway system.","Many people find it hard to break away from fossilized social norms.","The company struggled to innovate because of its fossilized management style."],"synonyms":["entrenched","ingrained","deep-seated","rigid","set in stone","fixed","hard-wired"],"antonyms":["flexible","adaptable","fluid","malleable","dynamic","changeable","evolving"],"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/371690-372197.webm","at":3717.1,"dur":5.07}}],"dialogues":[{"title":"Living arrangements and travel experiences","lines":[{"speaker":"A","text":"Can you hear and see me clearly now? Your connection seems much better.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/000076-001049.webm","at":1.0,"dur":9.73}]},{"speaker":"B","text":"I can see and hear you perfectly. By the way, I'm getting a severe sunburn on my back.","highlights":["severe sunburn"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/001758-002165.webm","at":17.8,"dur":4.07},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/002872-003387.webm","at":28.9,"dur":5.15}]},{"speaker":"A","text":"I noticed your necklace. Is that your grandmother's?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/004415-005122.webm","at":44.3,"dur":7.07}]},{"speaker":"B","text":"Yes, it's my grandmother's. I've worn it for five years. I also carry my mother's necklace with me.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/004866-005634.webm","at":48.8,"dur":7.68}]},{"speaker":"A","text":"I see the stairs behind you. Is it a tiny house?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/008354-009807.webm","at":83.7,"dur":14.53}]},{"speaker":"B","text":"It's not that small, but there's no curtain on the mirror, so I can't sleep during the day. We're moving next week.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/010258-011370.webm","at":102.8,"dur":11.12}]},{"speaker":"A","text":"The owner is a businesswoman who doesn't provide anything. She expects you to buy everything yourself.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/013282-014030.webm","at":133.0,"dur":7.48}]},{"speaker":"B","text":"Exactly. She rents it out on a monthly basis via Facebook Marketplace. The place feels a bit lived-in and worn out.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/015398-015819.webm","at":154.2,"dur":4.21},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/019212-019691.webm","at":192.3,"dur":4.79}]},{"speaker":"A","text":"I used to live in a huge 115-square-meter apartment in the center of Astana, Kazakhstan.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/023807-025058.webm","at":238.2,"dur":12.51}]},{"speaker":"B","text":"After our visas expired due to a massive investigation into forged documents, we traveled all over Vietnam.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/028720-029311.webm","at":287.4,"dur":5.91},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/029974-030498.webm","at":299.8,"dur":5.24}]},{"speaker":"A","text":"We eventually found a nice place in the highlands and stayed there for three months.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/034118-035043.webm","at":341.3,"dur":9.25}]}],"time":1.0,"topic":0},{"title":"Travel addiction vs. the need for comfort","lines":[{"speaker":"A","text":"We decided we needed to be near the sea, so we moved here. Right now, we're staying in a hotel room.","highlights":["staying in"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/035084-036011.webm","at":351.0,"dur":9.27}]},{"speaker":"B","text":"Are you living with a friend? Do you want to explore other countries like Thailand or Indonesia, or are you not really looking?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/036300-037581.webm","at":363.2,"dur":12.81}]},{"speaker":"A","text":"I've realized I'm addicted to the novelty of traveling. After three weeks in one place, it gets boring and I just start hopping places.","highlights":["hopping places"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/037650-038903.webm","at":376.7,"dur":12.53},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/039052-039709.webm","at":390.7,"dur":6.57}]},{"speaker":"B","text":"Exactly. It's hard to focus when everything is changing so quickly. It really drains your energy.","highlights":["drains your energy"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/043268-044214.webm","at":432.9,"dur":9.46}]},{"speaker":"A","text":"I thought about moving to Bali, but I have so much to do that I can't even organize my day or get enough sleep.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/044590-045796.webm","at":446.0,"dur":12.06}]},{"speaker":"B","text":"Moving to another region would be so energy-draining. I want to settle in somewhere and unpack. I'm very attached to comfort and a cozy space.","highlights":["settle in"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/047212-048767.webm","at":472.2,"dur":15.55}]},{"speaker":"B","text":"I need a bed where I can actually sleep. These polyester sheets are terrible; I'm already so pissed because I can't relax properly.","highlights":["relax properly"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/049830-051278.webm","at":498.5,"dur":14.48}]},{"speaker":"A","text":"Are the mattresses in Bali as hard as they are here in Vietnam?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/054585-055107.webm","at":546.0,"dur":5.22}]},{"speaker":"B","text":"No, not at all. In Thailand, they were very sturdy, but in some places, the bed just hugs you.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/055624-057082.webm","at":556.4,"dur":14.58}]},{"speaker":"A","text":"I'm exhausted. I worked until 4 a.m. straight because my boss is in a maniac stage right now, constantly demanding new tasks.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/058432-060005.webm","at":584.5,"dur":15.73}]},{"speaker":"B","text":"He's crazy! He wants to find investors and then asks about tasks I finished a month ago. I just want him to leave me alone.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/061704-063248.webm","at":617.2,"dur":15.44}]}],"time":351.0,"topic":1},{"title":"Work stress and the need for rest","lines":[{"speaker":"A","text":"I think he confused you with Claude code. I make that mistake all the time when I'm trying to be productive and start a dozen different chats.","highlights":["all the time"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/064680-066016.webm","at":647.0,"dur":13.36}]},{"speaker":"B","text":"He loves ChatGPT, but he keeps giving me tasks that a basic AI could handle. He treats me like his personal assistant.","highlights":["personal assistant"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/066916-067792.webm","at":669.4,"dur":8.76}]},{"speaker":"B","text":"He keeps dangling a move to the US over my head like a carrot. I'm not a hungry horse; I'm just exhausted and need sleep.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/069168-070694.webm","at":691.9,"dur":15.26}]},{"speaker":"A","text":"You definitely need a break. I also signed up with an agency to help with my Master's degree, and they sent me a massive Excel table to fill out.","highlights":["signed up with"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/072976-074150.webm","at":729.9,"dur":11.74}]},{"speaker":"B","text":"They basically asked me to write my entire biography by tomorrow. I have to do it, but I'm heading to the beach after class to switch off my phone.","highlights":["switch off"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/075444-076293.webm","at":754.6,"dur":8.49},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/076466-077320.webm","at":764.9,"dur":8.54}]},{"speaker":"A","text":"The beach is the perfect place to chill out. Do you ever go to the sea after a hard day of work to realize that life is good?","highlights":["chill out"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/079836-081016.webm","at":798.6,"dur":11.8}]},{"speaker":"B","text":"I spent five hours there recently and got a severe sunburn, but it was amazing. Now I'm just going to get a massage and relax.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/081487-082998.webm","at":815.0,"dur":15.11}]},{"speaker":"A","text":"Every time you try to relax, something goes wrong! You'll probably end up with a broken bone or something.","highlights":["goes wrong"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/083796-085043.webm","at":838.1,"dur":12.47}]},{"speaker":"B","text":"I might just tell my boss I'm sick and take a sick leave. I have zero energy left to feed his delusions or handle his tasks.","highlights":["sick leave"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/086266-087720.webm","at":862.8,"dur":14.54}]},{"speaker":"A","text":"You need time off. If your body doesn't get any free time, you lose all motivation to push harder or do anything.","highlights":["time off"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/088274-089790.webm","at":882.9,"dur":15.16}]},{"speaker":"B","text":"Exactly. You just end up neglecting everything and getting a headache. I really do need some rest.","highlights":["neglecting everything"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/090894-092363.webm","at":909.0,"dur":14.69}]}],"time":647.0,"topic":1},{"title":"Discussing Speaking Test Preparation","lines":[{"speaker":"A","text":"It doesn't matter how much money you make if you don't have the time to spend it. I've spent all my money too!","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/092436-093651.webm","at":924.6,"dur":12.15}]},{"speaker":"B","text":"Imagine wanting to relax with a massage but having to work instead. That couldn't be worse! But honestly, it's good motivation to work hard so you can fully enjoy that massage later.","highlights":["couldn't be worse"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/093788-095222.webm","at":938.1,"dur":14.34}]},{"speaker":"A","text":"Let's move on to the speaking part. I know we haven't been doing much speaking, but I think it's important to shift our focus to give your brain some variety.","highlights":["shift our focus"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/096608-097370.webm","at":966.2,"dur":7.62},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/098551-099769.webm","at":985.7,"dur":12.18}]},{"speaker":"B","text":"I find speaking much harder. I'm afraid of the speaking section because I have almost no time to prepare my answers, and the topics can be really complex.","highlights":["prepare my answers"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/101524-103053.webm","at":1015.4,"dur":15.29}]},{"speaker":"A","text":"You need to practice speaking about anything using high-level vocabulary. The criteria for speaking are similar to writing: ideas and logic first, then vocabulary and grammar.","highlights":["high-level vocabulary"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/103352-104203.webm","at":1033.6,"dur":8.51},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/105880-107206.webm","at":1059.0,"dur":13.26}]},{"speaker":"B","text":"I've been reviewing the latest feedback. I reworked and redesigned the mistakes section to reduce the noise, though some errors might still slip through.","highlights":["slip through"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/108850-109337.webm","at":1088.7,"dur":4.87},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/110496-111599.webm","at":1105.2,"dur":11.03}]},{"speaker":"A","text":"We just have to embrace those AI limitations. It's worth double-checking, but generating ideas is also a very difficult skill for many people.","highlights":["embrace those AI limitations"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/111916-113221.webm","at":1119.3,"dur":13.05},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/113954-114603.webm","at":1139.7,"dur":6.49}]},{"speaker":"B","text":"The speaking section is a standalone part of the test. I haven't booked my exam yet, but I know there are plenty of slots available.","highlights":["standalone part"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/116422-116724.webm","at":1164.3,"dur":3.02},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/120436-121214.webm","at":1204.5,"dur":7.78}]},{"speaker":"A","text":"I'd recommend the computer-based test because you get your results sooner. Plus, you get to use headphones and control the volume.","highlights":["results sooner"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/121341-122562.webm","at":1213.6,"dur":12.21},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/124628-125607.webm","at":1246.5,"dur":9.79}]}],"time":924.6,"topic":1},{"title":"IELTS Test Structure and Speaking Tips","lines":[{"speaker":"A","text":"Wearing headphones during the writing section is definitely helpful because the mechanical keyboards can be quite noisy when everyone starts typing at once.","highlights":["at once"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/126162-127335.webm","at":1261.8,"dur":11.73}]},{"speaker":"B","text":"True, and the computer section is much easier because you can see your word count on the screen.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/128704-129567.webm","at":1287.1,"dur":8.63}]},{"speaker":"B","text":"No, you'll be with a real person. You usually do the listening, reading, and writing in one three-hour session, and then have a separate speaking test.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/131242-131578.webm","at":1312.5,"dur":3.36},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/132338-133132.webm","at":1323.5,"dur":7.94}]},{"speaker":"A","text":"Can you schedule the speaking test for the same day? In Kazakhstan, you can choose to do the main test first or the speaking part.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/134216-135306.webm","at":1342.3,"dur":10.9}]},{"speaker":"B","text":"I actually prefer doing the speaking part first. When you have a fresh mind and plenty of energy in the morning, you can warm up with some podcasts.","highlights":["fresh mind"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/138326-139532.webm","at":1383.5,"dur":12.06}]},{"speaker":"A","text":"The speaking test lasts about 11 to 15 minutes. Part one is just to warm you up with general questions about your preferences and where you're from.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/141236-142694.webm","at":1412.6,"dur":14.58}]},{"speaker":"B","text":"Part two is where you get a card and have to tell a story for one to two minutes. Many people find this harder than part three.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/147498-147983.webm","at":1475.2,"dur":4.85},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/149286-149720.webm","at":1493.0,"dur":4.34}]},{"speaker":"A","text":"In part three, the examiner listens very carefully. The questions are abstract and related to the topic you chose in part two.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/150360-150912.webm","at":1503.7,"dur":5.52},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/151948-153220.webm","at":1519.7,"dur":12.72}]}],"time":1261.8,"topic":1},{"title":"IELTS Speaking Test Strategies","lines":[{"speaker":"A","text":"In part three, the first few questions relate to part two, but the rest are just random topics. You can't really predict what's coming.","highlights":["predict what's coming"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/155544-156969.webm","at":1555.6,"dur":14.25}]},{"speaker":"B","text":"Exactly. The examiner will notice if you give a memorized answer. If they suspect that, they'll hit you with a random question you couldn't possibly prepare for.","highlights":["hit you with"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/157796-158105.webm","at":1578.1,"dur":3.09},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/158414-159749.webm","at":1584.3,"dur":13.35}]},{"speaker":"A","text":"So instead of memorizing the top 20 topics, I should focus on building the skill of speaking about anything for a full minute.","highlights":["focus on"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/164078-165558.webm","at":1641.0,"dur":14.8}]},{"speaker":"B","text":"That's exactly what the exam wants. It's a skill. I don't think I could talk about laundry for a minute using high-level vocabulary in Russian.","highlights":["high-level vocabulary"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/165998-167366.webm","at":1660.1,"dur":13.68}]},{"speaker":"A","text":"Regarding the tone, do you think the speaking section is formal or informal?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/168504-169043.webm","at":1685.2,"dur":5.39}]},{"speaker":"B","text":"It's definitely informal. They test your formal vocabulary in the writing section, so the speaking part should simulate a real conversation with a friend.","highlights":["simulate a real conversation"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/169264-170554.webm","at":1692.7,"dur":12.9},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/172606-173247.webm","at":1726.2,"dur":6.41}]},{"speaker":"A","text":"So you can use slang and make jokes, just like you would when meeting someone for the first time.","highlights":["meeting someone"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/174253-175176.webm","at":1742.7,"dur":9.23}]},{"speaker":"B","text":"With high-level words, accuracy is much more important than range. If you use complex words incorrectly, you're just speaking gibberish.","highlights":["much more important"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/177196-178224.webm","at":1772.2,"dur":10.28}]},{"speaker":"A","text":"It sounds so lame to try and impress them with academic words you don't actually know how to use.","highlights":["try and impress"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/179696-180563.webm","at":1797.1,"dur":8.67}]},{"speaker":"B","text":"It's better to use words you're comfortable with. If you stop worrying about using sophisticated vocabulary and focus on what you want to convey, you'll do better.","highlights":["comfortable with"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/182138-183636.webm","at":1821.6,"dur":14.98}]}],"time":1555.6,"topic":2},{"title":"Natural speaking and handling different question types","lines":[{"speaker":"A","text":"Usually, vocabulary takes care of itself. When we just talk naturally, I notice you use high-level vocabulary without even realizing it.","highlights":["takes care of itself"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/183888-185245.webm","at":1839.1,"dur":13.57}]},{"speaker":"B","text":"And about idioms, we don't have to use them in every sentence. They just need to sound natural to be useful.","highlights":["sound natural"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/189204-190334.webm","at":1892.2,"dur":11.3}]},{"speaker":"A","text":"Exactly. You don't need to use any idioms at all to be fluent. A native speaker might just throw one out out of the blue.","highlights":["out of the blue"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/190988-192432.webm","at":1910.0,"dur":14.44}]},{"speaker":"B","text":"That makes sense. So, just be natural and that's it.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/194384-194988.webm","at":1944.0,"dur":6.04}]},{"speaker":"A","text":"To help you speak at length, we can practice two types of questions that usually intimidate people: very specific ones and very general ones.","highlights":["speak at length"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/196248-197723.webm","at":1962.6,"dur":14.75},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/197920-198408.webm","at":1979.4,"dur":4.88}]},{"speaker":"B","text":"Like how do I prefer to dye my hair? That's very specific. On the other end of the spectrum, we have general questions like, 'Who is your best friend?'","highlights":["on the other end of the spectrum"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/200680-202282.webm","at":2007.0,"dur":16.02}]},{"speaker":"A","text":"I'll come up with questions off the top of my head, and you should try to answer them in about 15 to 20 seconds with three sentences.","highlights":["off the top of my head"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/215190-216567.webm","at":2152.0,"dur":13.77}]},{"speaker":"B","text":"I'll keep it simple: a reason and a short explanation.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/218498-218973.webm","at":2185.1,"dur":4.75}]},{"speaker":"A","text":"Let's start with a very specific one: What is your favorite alcoholic drink?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/219736-220107.webm","at":2197.5,"dur":3.71},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/220592-220835.webm","at":2206.1,"dur":2.43}]},{"speaker":"B","text":"I don't drink much, but when I go out, I prefer a Sex on the Beach or a Sunrise Killer because they aren't too sweet or sour.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/221738-223375.webm","at":2217.6,"dur":16.37}]},{"speaker":"A","text":"And what about your favorite electronic device?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/224944-225191.webm","at":2249.6,"dur":2.47}]},{"speaker":"B","text":"My phone is definitely my favorite. Since I work online, I have to stay updated almost 24/7.","highlights":["stay updated"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/225796-227204.webm","at":2258.2,"dur":14.08}]},{"speaker":"A","text":"I actually love questions like that because they make you think about stuff.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/228146-229312.webm","at":2281.6,"dur":11.66}]}],"time":1839.1,"topic":2},{"title":"IELTS Speaking Practice and Tips","lines":[{"speaker":"A","text":"Sometimes people don't think about common topics because they're so relatable, but you can still find interesting things to say about them.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/230656-231241.webm","at":2306.7,"dur":5.85}]},{"speaker":"B","text":"Exactly. For me, my favorite device is definitely my laptop because my whole life centers around it. It runs 24/7 for my cloud sessions and classes.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/231904-232894.webm","at":2319.1,"dur":9.9}]},{"speaker":"A","text":"What's your favorite type of tea? Thank you for asking!","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/234926-235722.webm","at":2349.5,"dur":7.96}]},{"speaker":"B","text":"I love tea, but mint tea is my favorite. It's so refreshing and nourishing, especially with a bit of lemon and honey. It reminds me of my grandma picking mint.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/235716-236502.webm","at":2357.3,"dur":7.86},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/238384-238744.webm","at":2383.9,"dur":3.6}]},{"speaker":"A","text":"That part about your grandma was a bit redundant since you'd already answered the question. In the first part of the exam, the examiner might not stop you, but you need to save time.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/239136-239363.webm","at":2391.5,"dur":2.27},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/240134-240570.webm","at":2401.4,"dur":4.36}]},{"speaker":"B","text":"I see. So they'll jump straight into the next section if I talk too long?","highlights":["jump straight into"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/244438-244967.webm","at":2444.6,"dur":5.29}]},{"speaker":"A","text":"Actually, in the third section, they might even cut you off right in the middle of a great idea. It can be very annoying.","highlights":["cut you off"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/247840-248340.webm","at":2478.5,"dur":5.0},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/249528-249899.webm","at":2495.4,"dur":3.71}]},{"speaker":"B","text":"My favorite time of day is the morning. Even though I'm not an early bird, I love slow mornings with coffee and the sound of birds.","highlights":["early bird"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/251716-252904.webm","at":2517.4,"dur":11.88}]},{"speaker":"A","text":"That's good. To make it more natural, you can use fillers like 'That's a great question' to give yourself some time to think.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/255650-256716.webm","at":2556.7,"dur":10.66}]},{"speaker":"A","text":"When you hear a very general question, your job is to think of something specific.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/257494-258073.webm","at":2575.1,"dur":5.79}]}],"time":2306.7,"topic":3},{"title":"IELTS Speaking Practice Session","lines":[{"speaker":"A","text":"You need to narrow it down to something specific that is relevant to you. Let's start with: do you like traveling?","highlights":["narrow it down"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/258254-259840.webm","at":2582.6,"dur":15.86}]},{"speaker":"B","text":"I actually love traveling. It's one of my passions. I've traveled a lot through Europe and I'm currently in Bali, exploring new cultures and cuisines.","highlights":["one of my passions"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/262114-263519.webm","at":2621.3,"dur":14.05}]},{"speaker":"A","text":"That's a great start. Now, what's your favorite food?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/264886-264979.webm","at":2649.1,"dur":0.93}]},{"speaker":"B","text":"I'm such a foodie! I'd say Russian cuisine is my favorite. I love dishes like Pelmeni and Russian soups; they are my ultimate comfort food.","highlights":["comfort food"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/267046-267860.webm","at":2670.6,"dur":8.14}]},{"speaker":"A","text":"Remember, the examiner will ask 'why?' You should explain that Russian food is nourishing, healthy, and high in protein.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/269680-270838.webm","at":2697.0,"dur":11.58}]},{"speaker":"B","text":"That's because our food is really nourishing. It's always hot, super healthy, and high in protein, which makes it both tasty and nutritious.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/272218-273727.webm","at":2722.4,"dur":15.09}]},{"speaker":"A","text":"Good. I noticed a small mistake earlier: you said you have to 'keep it to yourself,' but you meant you want to 'keep it for yourself' as in, not show anyone your phone.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/274866-276619.webm","at":2753.3,"dur":17.53},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/276768-276970.webm","at":2767.9,"dur":2.02}]},{"speaker":"A","text":"Let's move on to part two. You'll get a cue card and one minute to prepare a plan before speaking for one to two minutes.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/279956-282188.webm","at":2808.7,"dur":22.32}]},{"speaker":"B","text":"Since I won't see the timer, I'll have to rely on my intuition to know when to stop.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/284030-285360.webm","at":2840.5,"dur":13.3}]},{"speaker":"A","text":"Exactly. Just tell the story naturally, like you're talking to a friend or a colleague. It can be a personal experience.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/287378-288465.webm","at":2874.0,"dur":10.87}]},{"speaker":"A","text":"Right. Sometimes the questions are personal, but other times they ask about things like what people should do with old buildings in the city.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/289504-290963.webm","at":2895.2,"dur":14.59}]}],"time":2582.6,"topic":3},{"title":"Discussing a business leader and storytelling","lines":[{"speaker":"A","text":"If we're talking about a famous business person, I’d definitely mention my current boss, Ivan. He's from Russia but lives in the U.S. now.","highlights":["definitely mention"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/299180-302418.webm","at":3007.3,"dur":32.38}]},{"speaker":"A","text":"I'm fascinated by his story. He finished his MBA at the University of Darden and worked in operations at Amazon for seven years.","highlights":["fascinated by"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/302754-304357.webm","at":3027.6,"dur":16.03}]},{"speaker":"A","text":"After Amazon, he worked as a COO for some big Russian banks and fintech projects. He's a very disciplined, slightly crazy person who makes him a great leader.","highlights":["fintech projects"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/304518-305964.webm","at":3045.4,"dur":14.46}]},{"speaker":"B","text":"That's not bad at all. I liked how you told a relevant story. It's much easier to tell stories based on your real experience because they flow naturally.","highlights":["flow naturally"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/310266-311728.webm","at":3102.8,"dur":14.62}]},{"speaker":"A","text":"I should have mentioned that he's quite famous in Russia, specifically for running the most successful startups in the fintech sector.","highlights":["specifically for"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/313820-314815.webm","at":3138.4,"dur":9.95},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/318452-319209.webm","at":3184.7,"dur":7.57}]},{"speaker":"B","text":"You mentioned he has an interesting story, but you didn't really tell it. What exactly makes him stand out?","highlights":["stand out"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/319530-320941.webm","at":3195.4,"dur":14.11}]},{"speaker":"A","text":"I could mention a story about a guy in Silicon Valley who turned down three million dollars from Google to start his own business.","highlights":["turned down"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/323334-324782.webm","at":3233.4,"dur":14.48}]},{"speaker":"B","text":"That's an interesting story. Now, let's try a science topic. Sometimes you get topics you don't know much about, so try to think of a personal story.","highlights":["don't know much about"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/328440-329589.webm","at":3284.6,"dur":11.49}]},{"speaker":"B","text":"Maybe you can think back to a science program you watched when you were nine years old about fascinating facts about leopards.","highlights":["think back to"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/330070-331604.webm","at":3300.8,"dur":15.34}]}],"time":3007.3,"topic":4},{"title":"TV influence on career and IELTS prep","lines":[{"speaker":"A","text":"I watched this fascinating National Geographic program about a veterinarian in Australia who helped endangered animals.","highlights":["endangered animals"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/339326-340871.webm","at":3393.4,"dur":15.45}]},{"speaker":"A","text":"It showed how humans affect wildlife and how volunteers can help. It really influenced my life choices and led me to become a veterinarian.","highlights":["life choices"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/341392-342834.webm","at":3414.0,"dur":14.42}]},{"speaker":"B","text":"That's great! Just a quick tip: since you watched it regularly in the past, you should say 'I used to watch it' or 'I would watch it.'","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/350648-352078.webm","at":3506.7,"dur":14.3}]},{"speaker":"B","text":"Also, instead of saying 'organisms' for large animals, it's more natural to say 'bodies.'","highlights":["more natural"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/354696-354873.webm","at":3547.1,"dur":1.77},{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/355476-357009.webm","at":3555.0,"dur":15.33}]},{"speaker":"A","text":"I understand. I think my grammar is usually fine, but I make mistakes when I'm stressed or too concentrated on the content.","highlights":["too concentrated"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/367572-368872.webm","at":3675.9,"dur":13.0}]},{"speaker":"B","text":"That's common. Fluency relies on automatic language processing, and mistakes can become fossilized in your brain, making them hard to detect consciously.","highlights":["fossilized in your brain"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/371410-372886.webm","at":3714.3,"dur":14.76}]},{"speaker":"A","text":"I'll try to finish the readings today, but I have to complete this Excel sheet for my master's degree first.","highlights":["master's degree"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/375670-376732.webm","at":3756.8,"dur":10.62}]},{"speaker":"B","text":"No problem. Just make sure to get some rest. Good luck with your tasks this week!","highlights":["good luck"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_13-01-59/376790-377737.webm","at":3768.0,"dur":9.47}]}],"time":3393.4,"topic":5}]};

                const b = after.split(/\s+/).filter(Boolean);
                const n = a.length, m = b.length;
                const table = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
                for (let i = n - 1; i >= 0; i--) {
                    for (let j = m - 1; j >= 0; j--) {
                        table[i][j] = norm(a[i]) === norm(b[j]) ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
                    }
                }
                const left = [], right = [];
                let i = 0, j = 0;
                while (i < n || j < m) {
                    if (i < n && j < m && norm(a[i]) === norm(b[j])) {
                        left.push({ word: a[i++], kind: 'same' });
                        right.push({ word: b[j++], kind: 'same' });
                    } else if (j >= m || (i < n && table[i + 1][j] >= table[i][j + 1])) {
                        const word = a[i];
                        const previous = i > 0 ? norm(a[i - 1]) : '';
                        const noise = FILLERS.has(norm(word)) || norm(word) === previous || !norm(word);
                        left.push({ word, kind: noise ? 'same' : 'del' });
                        i++;
                    } else {
                        // Mark where a missing word belongs, unless a deletion already shows the spot.
                        const last = left[left.length - 1];
                        if (!last || (last.kind !== 'del' && last.kind !== 'gap')) left.push({ kind: 'gap' });
                        right.push({ word: b[j++], kind: 'ins' });
                    }
                }
                const render = (tokens, tag) => tokens.map(t => {
                    if (t.kind === 'gap') return '<span class="gap" aria-hidden="true"></span>';
                    return t.kind === 'same' ? esc(t.word) : `<${tag} class="w">${esc(t.word)}</${tag}>`;
                }).join(' ').replace(/<\/(del|ins)> <\1 class="w">/g, ' ');
                return { said: render(left, 'del'), fixed: render(right, 'ins') };
            }

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {
                    if (!hit[index] && functional.has(norm(part))) {
                        const near = [index - 2, index + 2].some(k => hit[k]);
                        if (near) hit[index] = true;
                    }
                });
                return parts.map((part, index) => {
                    if (!hit[index]) return esc(part);
                    // Underline the word itself, not quotes or punctuation stuck to it.
                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                    return `${esc(before)}<b class="hl">${esc(core)}</b>${esc(after)}`;
                }).join('');
            }

            // link(phrase): the vocabulary entry of a highlighted phrase, or -1.
            function highlightPhrases(text, phrases, link) {
                const lower = text.toLowerCase();
                const ranges = [];
                (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length, phrase]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end, phrase]) => {
                    const word = link ? link(phrase) : -1;
                    const opens = word >= 0 ? ` data-vocab="${word}" title="${esc(`See “${vocabulary[word].term}” in Vocabulary`)}"` : '';
                    html += esc(text.slice(cursor, start)) + `<mark class="expr"${opens}>${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {
                    if (value === undefined) return window.localStorage.getItem(key);
                    window.localStorage.setItem(key, value);
                } catch (_error) {
                    return null;
                }
                return null;
            }

            // ---------------------------------------------------------- header
            document.getElementById('title').textContent = meta.title || 'Lesson review';

            // The lesson time in Moscow time (meta.start_utc: when the lesson
            // began, in seconds since 1970). A tap shows it in the reader's own
            // time zone instead, remembered on the phone. Older pages have no
            // start_utc: the date and time as recorded, with no zone.
            const eyebrow = document.getElementById('eyebrow');
            const lessonStart = typeof meta.start_utc === 'number' && isFinite(meta.start_utc) ? new Date(meta.start_utc * 1000) : null;
            let lessonTimes = null;
            let ownZone = storage('lesson-time-zone') === 'own';

            function zoneTime(zone) {
                const date = { day: 'numeric', month: 'long', year: 'numeric' };
                const time = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
                if (zone) { date.timeZone = zone; time.timeZone = zone; }
                return {
                    date: new Intl.DateTimeFormat('en-GB', date).format(lessonStart),
                    time: new Intl.DateTimeFormat('en-GB', time).format(lessonStart)
                };
            }

            function offsetName(minutes) {
                const size = Math.abs(minutes);
                if (!size) return 'GMT';
                return 'GMT' + (minutes < 0 ? '-' : '+') + Math.floor(size / 60) + (size % 60 ? ':' + String(size % 60).padStart(2, '0') : '');
            }

            if (lessonStart) {
                try {
                    const moscow = zoneTime('Europe/Moscow');
                    const own = zoneTime(null);
                    lessonTimes = {
                        moscow: Object.assign(moscow, { zone: 'MSK', name: 'Moscow time' }),
                        own: Object.assign(own, { zone: offsetName(-lessonStart.getTimezoneOffset()), name: 'your time' }),
                        differ: moscow.date !== own.date || moscow.time !== own.time
                    };
                } catch (_error) {
                    lessonTimes = null;  // no time zones in this browser: the time as recorded
                }
            }

            function showLessonTime() {
                let date = meta.date;
                if (!lessonTimes) {
                    eyebrow.textContent = ['English lesson', meta.date, meta.time].filter(Boolean).join(' · ');
                } else {
                    const shown = lessonTimes.differ && ownZone ? lessonTimes.own : lessonTimes.moscow;
                    const other = shown === lessonTimes.own ? lessonTimes.moscow : lessonTimes.own;
                    const time = `${esc(shown.time)} <span class="tz">${esc(shown.zone)}</span>`;
                    date = shown.date;
                    eyebrow.innerHTML = `English lesson · ${esc(shown.date)} · `
                        + (lessonTimes.differ
                            ? `<button class="tz-btn" type="button" title="Show ${esc(other.name)} (${esc(other.zone)})" aria-label="${esc(`${shown.time} ${shown.name}. Show ${other.name}, ${other.zone}`)}">${time}</button>`
                            : `<span class="tz-time">${time}</span>`);
                }
                document.title = (meta.title ? meta.title + ' · ' : '') + 'English lesson' + (date ? ' · ' + date : '');
            }
            showLessonTime();
            eyebrow.addEventListener('click', event => {
                if (!event.target.closest('.tz-btn')) return;
                ownZone = !ownZone;
                storage('lesson-time-zone', ownZone ? 'own' : 'moscow');
                showLessonTime();
                const button = eyebrow.querySelector('.tz-btn');
                if (button && event.detail === 0) button.focus();  // kept for the keyboard
            });

            document.getElementById('count-mistakes').textContent = mistakes.length;
            document.getElementById('count-vocabulary').textContent = vocabulary.length;
            document.getElementById('count-dialogues').textContent = dialogues.length;

            // -------------------------------------------------------- mistakes
            const topics = lesson.topics || [];
            // Each mistake example, word and dialogue line can be found by the timeline.
            const exampleIds = new Map();
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => exampleIds.set(example, `m-${c}-${e}`)));
            let showAllMistakes = () => {};
            let vocabularyToWords = () => {};
            // What "Go back" needs to put a section back as it was.
            let mistakeFilter = () => 'all';
            let setMistakeFilter = () => {};
            let vocabularyView = () => 'words';
            let setVocabularyView = () => {};

            function clock(seconds) {
                if (seconds === null || seconds === undefined) return '';
                const total = Math.max(0, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const rest = String(total % 60).padStart(2, '0');
                return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
            }

            function plain(text) {
                return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
            }

            // One example: when it was said, the full sentence(s) as said and
            // corrected, and (where it adds something) its own explanation.
            function exampleHtml(example, options) {
                const before = example.context || example.quote;
                const after = example.context_fix || example.fix;
                const d = diff(before, after);
                // The clip pill needs no separator: it stays apart from the topic when the line wraps.
                const pill = clipHtml(example.clip, 'Hear what was said');
                // The letters beside the time open the same moment in the other sections.
                const jumps = jumpsHtml('mistakes', example.clip ? example.clip.at : example.time);
                const facts = [];
                if (!pill && example.time !== null && example.time !== undefined) facts.push(`<span class="clock">${clock(example.time)}</span>${jumps}`);
                if (options.showTopic && topics[example.topic]) facts.push(`<span>${esc(topics[example.topic].title)}</span>`);
                let html = `<div class="pair" data-item="${exampleIds.get(example) || ''}"${options.hidden ? ' hidden' : ''}>`;
                const separator = jumps && !pill ? '' : '<span class="sep">·</span>';
                if (pill || facts.length) html += `<div class="ex-meta" data-no-speech>${pill}${pill ? jumps : ''}${facts.join(separator)}</div>`;
                html += `<div class="said"><span class="mark-icon" aria-label="What was said" data-no-speech>✗</span><span class="txt">${d.said}</span></div>`;
                html += `<div class="fixed"><span class="mark-icon" aria-label="Better" data-no-speech>✓</span><span class="txt">${d.fixed}</span>${playButton(after, 'Listen to the correct version')}</div>`;
                if (options.why) html += `<p class="ex-why">${esc(options.why)}</p>`;
                return html + '</div>';
            }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
