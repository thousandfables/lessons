":""}],"more_examples":["I'll let you borrow my laptop on one condition: you don't download any illegal software.","She agreed to babysit on one condition: that she gets to watch movies while the kids sleep.","You can use my office space on one condition: you must keep it completely tidy."],"synonyms":["provided that","only if","on the condition that","with one catch","as long as"],"antonyms":["without any requirements"],"gap":{"sentence":"I will let you borrow my laptop for the weekend _____: you must promise not to install any new software.","answer":"on one condition","options":["on one condition","on one purpose","on one reason","on one way"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/301846-302434.webm","at":3018.6,"dur":5.88}},{"term":"an enormous amount of","pos":"noun phrase","definition":"A very large quantity or a great deal of something.","time":3034.9,"lesson":"That would be painful, but these models take an enormous amount of power to run.","examples":[{"sentence":"The project requires an enormous amount of time and dedication to complete.","pattern":"an enormous amount of + uncountable noun"},{"sentence":"She had to do an enormous amount of research before writing her thesis.","pattern":""},{"sentence":"The company spent an enormous amount of money on the new marketing campaign.","pattern":"spend + an enormous amount of + money"},{"sentence":"I can't believe how an enormous amount of data is processed every second.","pattern":"subject + verb + an enormous amount of + noun"}],"countable":[{"meaning":"A very large quantity or a great deal of something.","example":"That would be painful, but these models take an enormous amount of power to run.","lesson":true}],"uncountable":[],"more_examples":["The renovation will require an enormous amount of effort from the whole team.","The storm caused an enormous amount of damage to the coastal roads.","He has an enormous amount of experience in the field of renewable energy."],"synonyms":["a great deal of","a huge amount of","a vast amount of","a massive amount of","tons of","heaps of","a lot of"],"antonyms":["a small amount of","a tiny amount of","a negligible amount of"],"gap":{"sentence":"The renovation was so complex that it required _____ effort from the entire team.","answer":"an enormous amount of","options":["an enormous amount of","a tiny amount of","a little bit of","no amount of"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/303430-304008.webm","at":3034.4,"dur":5.78}},{"term":"at any time","pos":"expression","definition":"Whenever you want or whenever it is convenient for you.","time":3257.1,"lesson":"There are no specific rules or restrictions. You can basically stop delivering those orders at any time.","examples":[{"sentence":"You can cancel your subscription at any time without any penalty.","pattern":"at any time + without + -ing"},{"sentence":"The emergency alarm can be triggered at any time.","pattern":"subject + can be + past participle + at any time"},{"sentence":"Feel free to contact me at any time if you have questions.","pattern":"Feel free to + verb + at any time"},{"sentence":"The software allows users to save their progress at any time.","pattern":""}],"more_examples":["You can change your flight booking at any time before the departure.","Please let me know at any time if the schedule doesn't work for you.","The members are welcome to join the meeting at any time."],"synonyms":["whenever","anytime","whenever it's convenient","at your convenience","at your leisure"],"antonyms":["never","at no time","not at all"],"gap":{"sentence":"Since the office is open twenty-four hours, you can drop off the package _____ that suits you.","answer":"at any time","options":["at any time","at noon","at night","at once"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/325758-326022.webm","at":3257.7,"dur":2.64}},{"term":"didn't get you","pos":"expression","definition":"To fail to understand what someone is saying or what they mean.","time":3333.1,"lesson":"Who will deliver it if all of them forgot to pick up this order? I didn't get you; do you mean that if you have a hundred orders in Rostov...","examples":[{"sentence":"I didn't get what you meant by 'it's complicated.'","pattern":"didn't get + what + clause"},{"sentence":"Sorry, I didn't get you. Could you repeat that last part?","pattern":""},{"sentence":"I'm afraid I didn't get you; the connection was a bit laggy.","pattern":""}],"more_examples":["I didn't get you at all. Are you saying we should cancel the meeting?"],"synonyms":["I don't follow","I'm lost","I missed that","I'm confused"],"antonyms":["I see","I understand","I follow you","That makes sense","I get it"],"gap":{"sentence":"I'm sorry, the connection was very poor and I _____, could you please repeat that?","answer":"didn't get you","options":["didn't get you","didn't help you","didn't meet you","didn't call you"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/333334-333968.webm","at":3333.4,"dur":6.34}},{"term":"carrier","pos":"noun","definition":"A person or company that transports goods or packages from one place to another.","time":3345.5,"lesson":"There are a hundred points on the map that you can potentially deliver. Every other carrier has the same 100 orders available, but what if 40 carriers choose to deliver 90 of them?","examples":[{"sentence":"The shipping carrier will notify you once the package has been collected.","pattern":"shipping carrier"},{"sentence":"Which carrier is the most reliable for international deliveries?","pattern":"Which carrier + is + adjective"},{"sentence":"The company hired a third-party carrier to handle the logistics of the move.","pattern":"third-party carrier"},{"sentence":"The carrier is responsible for ensuring the goods arrive in good condition.","pattern":"carrier + is responsible for + -ing"}],"countable":[{"meaning":"A person or company that transports goods or packages from one place to another.","example":"Every other carrier has the same 100 orders available, but what if 40 carriers choose to deliver 90 of them?","lesson":true},{"meaning":"A person who carries a disease or virus","example":"The health department is tracking the primary carrier of the virus."},{"meaning":"A device or component that carries a signal or power","example":"The technician checked the signal carrier to ensure a stable connection."}],"uncountable":[],"more_examples":["We need to find a local carrier that can deliver these items by tomorrow.","The carrier lost several boxes during the transit across the border.","Is there a cheaper carrier available for shipping heavy furniture?"],"synonyms":["shipping company","transport company","courier","freight company","delivery service","hauler","transportation provider"],"antonyms":[],"gap":{"sentence":"Since the warehouse is located in a remote area, we need to find a reliable _____ to transport our heavy equipment.","answer":"carrier","options":["carrier","storage","warehouse","product"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/334350-335106.webm","at":3343.6,"dur":7.56}},{"term":"approach","pos":"noun","definition":"A specific way of thinking about, planning, or solving a problem or task.","time":3434.3,"lesson":"The system could be improved for sure, but they probably didn't want to bother. I have to say that they use a different approach because my approach involves accounting for a specific capacity, such as having four drivers and four trucks.","examples":[{"sentence":"We need to take a different approach if we want to increase our sales this quarter.","pattern":"take a different approach"},{"sentence":"The company is trying a new approach to remote work management.","pattern":"a new approach to [noun/gerund]"},{"sentence":"What is your approach to handling difficult customers?","pattern":"approach to [-ing]"},{"sentence":"The team's approach was very creative and helped them solve the issue quickly.","pattern":""}],"countable":[{"meaning":"A specific way of thinking about, planning, or solving a problem or task.","example":"I have to say that they use a different approach because my approach involves accounting for a specific capacity, such as having four drivers and four trucks.","lesson":true},{"meaning":"A way of moving towards a person, place, or thing","example":"The guard noticed his slow approach toward the gate."},{"meaning":"A way of dealing with a person or a situation","example":"She took a very diplomatic approach to the negotiation."}],"uncountable":[{"meaning":"The act of moving closer to something","example":"The approach of winter made the air feel much colder."}],"more_examples":["The teacher suggested a more hands-on approach to learning grammar.","We need a systematic approach to organizing the warehouse inventory.","The government is considering a new approach to urban housing shortages."],"synonyms":["method","strategy","technique","procedure","tactic","way"],"antonyms":[],"gap":{"sentence":"The project failed because the team used a very disorganized _____ to managing the daily tasks.","answer":"approach","options":["approach","attitude","opinion","feeling"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/343626-344298.webm","at":3436.4,"dur":6.72}},{"term":"dynamic","pos":"adjective","definition":"Constantly changing, developing, or moving rather than staying fixed or constant.","time":3450.0,"lesson":"When you have a fixed number of trucks and a set number of orders per day, the situation is different. In their case, the number of cars is dynamic.","examples":[{"sentence":"The price of electricity is dynamic and changes based on demand.","pattern":"dynamic + and + [clause]"},{"sentence":"We need a dynamic approach to solve this problem because the situation changes quickly.","pattern":"dynamic + approach"},{"sentence":"The team works in a very dynamic environment where new tasks appear every hour.","pattern":"dynamic + environment"},{"sentence":"The software allows for dynamic updates without needing to restart the system.","pattern":"dynamic + [noun] + without + -ing"}],"more_examples":["The city has a dynamic nightlife with events happening every night.","She has a very dynamic personality and always brings energy to the room.","The market is dynamic, responding instantly to global economic shifts."],"synonyms":["ever-changing","fluid","active","evolving","flexible","variable","shifting","adaptive"],"antonyms":["static","fixed","constant","stationary","stable","unchanging","rigid"],"gap":{"sentence":"Working in a _____ environment means that your daily responsibilities are constantly shifting and never stay the same.","answer":"dynamic","options":["dynamic","static","fixed","stable"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/345096-345997.webm","at":3451.1,"dur":9.01}},{"term":"missed opportunities","pos":"noun phrase","definition":"Potential benefits or successes that were not taken advantage of due to inaction or inefficiency.","time":3695.9,"lesson":"All those missed opportunities and unoptimized aspects likely cost the company millions of dollars every year. However, I am not sure if the management is willing to change their current systems.","examples":[{"sentence":"If we don't invest in new technology now, we'll face many missed opportunities in the future.","pattern":""},{"sentence":"I feel like I've had so many missed opportunities to travel while I was younger.","pattern":"have + [number] + missed opportunities"},{"sentence":"We need to analyze our past projects to identify any missed opportunities for growth.","pattern":""}],"countable":[{"meaning":"Potential benefits or successes that were not taken advantage of due to inaction or inefficiency.","example":"All those missed opportunities and unoptimized aspects likely cost the company millions of dollars every year.","lesson":true}],"uncountable":[],"more_examples":[],"synonyms":["lost opportunities","squandered chances","wasted potential","overlooked possibilities","forgone advantages"],"antonyms":["seized opportunities","taken chances","realized potential","successful ventures"],"gap":{"sentence":"The company failed to expand into the Asian market, resulting in many _____ to increase their global profits.","answer":"missed opportunities","options":["missed opportunities","future successes","current projects","daily routines"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/369814-370427.webm","at":3698.2,"dur":6.13}},{"term":"willing to","pos":"adjective phrase","definition":"ready and happy to do something or accept a particular change.","time":3708.3,"lesson":"All those unoptimized aspects cost the company millions per year, but I'm not sure if they are willing to change. They might say they have a working system and don't want to risk anything.","examples":[{"sentence":"Are you willing to work overtime this weekend to finish the project?","pattern":"be willing to + verb"},{"sentence":"The company is not willing to negotiate the terms of the contract.","pattern":"negative form: not willing to"},{"sentence":"I'm only willing to help if you promise to do the same for me later.","pattern":"conditional: only willing to"},{"sentence":"She wasn't very willing to share her personal information with the app.","pattern":"adverbial modifier: very willing to"}],"more_examples":["Would you be willing to take a survey about our new service?","They aren't willing to move to a different city for the job.","I'm willing to compromise on the price if we can settle today."],"synonyms":["ready to","eager to","prepared to","content to"],"antonyms":["unwilling to","reluctant to","hesitant to"],"gap":{"sentence":"Since the apartment is so cheap, the tenant is _____ accept the noisy neighbors.","answer":"willing to","options":["willing to","anxious to","hopeful to","desperate to"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/370930-371263.webm","at":3709.4,"dur":3.33}},{"term":"bet on","pos":"phrasal verb","definition":"To trust in something or someone, or to rely on a specific outcome.","time":3730.2,"lesson":"Our algorithms are working for sure, so why should you bet on your system when we already have a working one?","examples":[{"sentence":"I wouldn't bet on the train being on time during the storm.","pattern":"bet on + noun phrase"},{"sentence":"You can bet on her to show up; she is never late.","pattern":"bet on + object + to + verb"},{"sentence":"The investors are ready to bet on this new startup.","pattern":"bet on + gerund/noun"},{"sentence":"I'm not sure I can bet on that plan working out.","pattern":"bet on + [something] + working"}],"more_examples":["I'd bet on him winning the race; he's been training incredibly hard.","You can't bet on the weather being clear for the outdoor wedding."],"synonyms":["count on","rely on","depend on","bank on","trust in","take as a given","put your faith in"],"antonyms":["doubt","distrust","be skeptical of","have reservations about"],"gap":{"sentence":"The weather forecast is so unpredictable that I wouldn't _____ the sun coming out tomorrow.","answer":"bet on","options":["bet on","look at","wait for","talk about"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/373012-373462.webm","at":3730.2,"dur":4.5}},{"term":"it's only a matter of time","pos":"expression","definition":"Something is certain to happen eventually, even if we don't know exactly when.","time":3775.6,"lesson":"They don't have many warehouses left, so it's only a matter of time before they run into problems. We have a solution, but we don't want to use it.","examples":[{"sentence":"It's only a matter of time before the company expands into new markets.","pattern":"It's only a matter of time before + [clause]"},{"sentence":"If you keep practicing every day, it's only a matter of time before you become fluent.","pattern":"It's only a matter of time before + [subject] + [verb]"},{"sentence":"They are working so hard that it's only a matter of time before they succeed.","pattern":""}],"more_examples":["The battery is very low; it's only a matter of time before the phone dies.","With the way they argue, it's only a matter of time before they break up.","The old bridge is in such bad shape that it's only a matter of time before it collapses."],"synonyms":["inevitable","bound to happen","certain to happen","unavoidable"],"antonyms":["uncertain","doubtful","unlikely","never going to happen"],"gap":{"sentence":"He has been practicing the piano for years, so _____ before he plays perfectly.","answer":"it's only a matter of time","options":["it's only a matter of time","it's only a question","it's only a problem","it's only a secret"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/377270-377761.webm","at":3772.8,"dur":4.91}}],"dialogues":[{"title":"Daily life, school, and AI subscriptions","lines":[{"speaker":"A","text":"So, you're officially a certified autist now! I told you about that great t-shirt in the last lesson.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/000304-001707.webm","at":3.1,"dur":14.03}]},{"speaker":"B","text":"Yeah, but it's supposed to say 'gay' somewhere. I saw another one on AliExpress where 'gay' actually makes more sense.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/001776-002942.webm","at":17.9,"dur":11.66}]},{"speaker":"A","text":"True, especially in Russia. Anyway, how are you? It's sunny today. Have you been swimming in the sea yet?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/005228-006655.webm","at":52.4,"dur":14.27}]},{"speaker":"B","text":"I try to go every day. I woke up at 6:30 a.m. today and jogged to the sea for a swim.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/007276-008732.webm","at":72.9,"dur":14.56}]},{"speaker":"A","text":"Do you swim properly or just float? You're probably swimming like a big lazy frog. That's actually great for your physique.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/009780-011449.webm","at":97.9,"dur":16.69}]},{"speaker":"B","text":"I'm not going to school today because I have four 40-minute lessons. It's not really necessary to go in.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/015822-016940.webm","at":158.3,"dur":11.18}]},{"speaker":"A","text":"There's a term for people who skip school regularly: a habitual truant. So, you're a habitual truant today!","highlights":["habitual truant"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/017800-019199.webm","at":178.1,"dur":13.99}]},{"speaker":"B","text":"I'm piloting this project of a four-day work week. It's like I'm living in Europe now.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/022988-024494.webm","at":230.0,"dur":15.06}]},{"speaker":"A","text":"It's interesting how the Ural River separates Asia and Europe. It's quite convenient for your commute to school.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/026402-028010.webm","at":264.2,"dur":16.08}]},{"speaker":"B","text":"September was crazy. I bought subscriptions for the best AI models: ChatGPT, Astra, and Claude.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/032108-033606.webm","at":321.2,"dur":14.98}]},{"speaker":"A","text":"To get anything useful from them, you need to pay at least a hundred bucks per month. If it's less, you won't squeeze much out of them.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/035676-037064.webm","at":356.9,"dur":13.88}]}],"time":0.0,"topic":0},{"title":"Building apps with AI and Telegram storage","lines":[{"speaker":"A","text":"You can get a subscription for about 20 bucks, but the limits are really tight, and you'll constantly hit them.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/037506-038442.webm","at":375.2,"dur":9.36}]},{"speaker":"B","text":"I actually switched to Claude. I had a hundred-dollar subscription, but I'm not going to use Judge a Pity anymore.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/040666-041047.webm","at":406.8,"dur":3.81}]},{"speaker":"A","text":"Is Claude better? I wanted to test both programs to see which one is superior, even though the subscriptions were incredibly expensive.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/041220-042543.webm","at":412.3,"dur":13.23}]},{"speaker":"B","text":"I'll have to work a lot harder from now on to afford $200 a month for subscriptions. So far, I've built at least three apps.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/043576-044345.webm","at":435.9,"dur":7.69}]},{"speaker":"B","text":"The first app I built provides unlimited cloud storage by uploading everything to Telegram because it allows for unlimited space.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/049024-050509.webm","at":491.0,"dur":14.85}]},{"speaker":"A","text":"I've used Telegram that way too, but it's very inconvenient when you need to find a specific photo because there's no way to sort things.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/051826-052660.webm","at":518.5,"dur":8.34}]},{"speaker":"B","text":"This app replicates your actual storage. These files are virtual storage—about 3 terabytes of data—and they are fully in the cloud.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/058160-059886.webm","at":581.7,"dur":17.26}]},{"speaker":"B","text":"It looks like a real directory on Windows. You can sort by size or name just like a normal folder.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/060768-061185.webm","at":607.8,"dur":4.17},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/061832-062558.webm","at":618.4,"dur":7.26}]},{"speaker":"A","text":"That's great! It's like a free Google Drive. How long did it take you to create this?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/073072-073408.webm","at":730.8,"dur":3.36},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/073992-074734.webm","at":740.0,"dur":7.42}]}],"time":375.2,"topic":1},{"title":"Using AI for Software Development","lines":[{"speaker":"A","text":"AI is actually pretty bad at generating ideas from scratch. It’s much better at executing a well-specified plan that you already have in mind.","highlights":["from scratch"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/075930-077376.webm","at":759.5,"dur":14.46}]},{"speaker":"B","text":"Exactly. You have to explain the system architecture to the AI like you're talking to a child, detailing exactly how the files should be uploaded and split.","highlights":["system architecture"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/079754-080761.webm","at":797.6,"dur":10.07}]},{"speaker":"A","text":"Once you give it that plan, it can start building. But then comes the testing phase, where you have to make changes on the fly when things don't work as expected.","highlights":["on the fly"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/081876-082976.webm","at":818.9,"dur":11.0}]},{"speaker":"B","text":"Right, and while the AI can suggest fixes, you still need to understand them yourself. You can't just rely 100% on what it suggests.","highlights":["rely 100%"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/084390-085670.webm","at":844.0,"dur":12.8}]},{"speaker":"A","text":"The hardest part for me was testing the backup system. I wanted to back up my phone's photos every month without manually sorting through what was already uploaded.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/086968-087980.webm","at":869.8,"dur":10.12}]},{"speaker":"B","text":"So, if you have 100 gigabytes of data, but only 20 gigabytes are new, the AI needs to identify exactly which files are missing and only upload those.","highlights":["identify exactly"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/092770-093508.webm","at":927.8,"dur":7.38}]},{"speaker":"A","text":"And I want the gallery to stay organized. Even if a video was uploaded in April, I want to find it in the September folder by using placeholders.","highlights":["stay organized"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/094228-094764.webm","at":942.4,"dur":5.36},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/096038-096623.webm","at":960.5,"dur":5.85}]},{"speaker":"B","text":"So your app creates multiple links in different folders that all point back to that one original file? Did it actually work for three terabytes of data?","highlights":["point back to"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/098722-100158.webm","at":987.4,"dur":14.36}]},{"speaker":"A","text":"It did! If it hadn't worked, I wouldn't have been able to upload that much data. It was worth the two weeks of effort because it's actually useful.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/101432-102816.webm","at":1014.4,"dur":13.84}]},{"speaker":"B","text":"I agree. If I build an app, I want to actually use it. Some people just try to create something to demonstrate the power of AI, but that's not the goal.","highlights":["not the goal"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/104090-105596.webm","at":1041.0,"dur":15.06}]}],"time":758.9,"topic":1},{"title":"Challenges of using AI for video backgrounds","lines":[{"speaker":"A","text":"It's crazy how AI can generate images from descriptions, but to see how good it really is, you have to see it do real things.","highlights":["real things"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/107436-108155.webm","at":1074.5,"dur":7.19}]},{"speaker":"B","text":"Exactly. I wanted to make funny videos on Instagram and TikTok. I thought it would be cool to have AI generate a suitable background for a character.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/110288-111680.webm","at":1103.0,"dur":13.92}]},{"speaker":"A","text":"Like if you're playing an old man, you'd need a specific apartment. If you can't find a real one to film in, you'd think AI could do it easily.","highlights":["film in"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/112870-114288.webm","at":1128.8,"dur":14.18}]},{"speaker":"B","text":"I thought it would be a piece of cake since there are so many models now, but it turns out no model could actually do it.","highlights":["piece of cake"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/114568-116168.webm","at":1145.8,"dur":16.0}]},{"speaker":"A","text":"So you didn't go crazy and build your own model? What was the solution?","highlights":["go crazy"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/115936-117292.webm","at":1159.5,"dur":13.56}]},{"speaker":"B","text":"I had to bail on the idea. I'm busy making cool programs instead. I think people on TikTok would be impressed by the process of making these apps.","highlights":["bail on"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/119442-119858.webm","at":1194.5,"dur":4.16},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/121128-122086.webm","at":1211.4,"dur":9.58}]},{"speaker":"B","text":"If the colors of the fan or the wall match my t-shirt, it's a mess. Even my hair looks terrible in the AI generation.","highlights":["a mess"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/126598-128052.webm","at":1266.1,"dur":14.54}]},{"speaker":"A","text":"It's fine for a joke, but you wanted it to look real. So, you decided not to use AI-generated backgrounds at all?","highlights":["look real"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/128864-130280.webm","at":1288.7,"dur":14.16}]},{"speaker":"B","text":"Yeah, that's sad. I actually used a screenshot from Fortnite for the background.","highlights":["screenshot from"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/129928-130889.webm","at":1299.4,"dur":9.61},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/132042-132846.webm","at":1320.5,"dur":8.04}]},{"speaker":"A","text":"Why do you use a layout showing your GPU and CPU capacity? And why are you flexing your muscles like that?","highlights":["flexing your muscles"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/133842-134511.webm","at":1338.5,"dur":6.69},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/135170-135729.webm","at":1351.9,"dur":5.59}]},{"speaker":"B","text":"I'm just trying to impress people. Oh, and I spotted a familiar piece of clothing—my lucky panties!","highlights":["spotted a"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/136606-137892.webm","at":1366.3,"dur":12.86}]}],"time":1074.5,"topic":1},{"title":"The Traveling Salesman Problem","lines":[{"speaker":"A","text":"So, you've actually created three different apps, haven't you?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/141054-141749.webm","at":1410.6,"dur":6.95}]},{"speaker":"B","text":"I did. The first was Tele Cloud, but the one I'm working on now is a logistics dispatcher to optimize routes.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/146254-147739.webm","at":1462.6,"dur":14.85}]},{"speaker":"A","text":"Is it finished yet?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/148476-149019.webm","at":1484.9,"dur":5.43}]},{"speaker":"B","text":"Not yet, because finding a solution for optimizing routes with many points on a map is currently unsolvable.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/148714-149726.webm","at":1487.2,"dur":10.12}]},{"speaker":"A","text":"What exactly makes it so difficult?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/149252-149908.webm","at":1492.6,"dur":6.56}]},{"speaker":"B","text":"If you have 120 dots on a map, each with specific time windows, finding the perfect plan is incredibly hard.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/155364-156248.webm","at":1553.7,"dur":8.84}]},{"speaker":"B","text":"You need a plan where every truck delivers every bottle on time without overworking the drivers, but finding the absolute best one is the challenge.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/158104-159080.webm","at":1581.1,"dur":9.76}]},{"speaker":"A","text":"In mathematics, what do you call that specific problem?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/162610-163526.webm","at":1626.2,"dur":9.16}]},{"speaker":"B","text":"It's the Traveling Salesman Problem. The best possible solution is called the optimum.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/163170-164617.webm","at":1631.8,"dur":14.47}]},{"speaker":"B","text":"For a few orders, we can easily calculate all combinations, but once you hit 12 points, it becomes almost impossible.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/170320-171289.webm","at":1703.3,"dur":9.69}]},{"speaker":"A","text":"Is there a mathematical formula that governs this?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/171666-172510.webm","at":1716.8,"dur":8.44}]},{"speaker":"B","text":"The solution is called a factorial. As the numbers increase, the combinations explode. By 14, you're looking at 87 billion combinations.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/172772-173295.webm","at":1727.8,"dur":5.23},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/177966-178337.webm","at":1779.9,"dur":3.71}]}],"time":1410.6,"topic":1},{"title":"Solving logistics with heuristic algorithms","lines":[{"speaker":"A","text":"There are more atoms in the universe than there are possible combinations for this problem. Since we have 120 orders, every point is a unique number.","highlights":["unique number"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/180762-181193.webm","at":1807.7,"dur":4.31},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/181978-182724.webm","at":1819.9,"dur":7.46}]},{"speaker":"B","text":"Exactly. If you have data, everything becomes easier. But with these trucks, there are billions of possible combinations for how they can move.","highlights":["possible combinations"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/184612-185588.webm","at":1846.2,"dur":9.76}]},{"speaker":"A","text":"Right, one truck could go to several locations and return, or another could work the whole shift to deliver three orders. This could save ten minutes of work.","highlights":["whole shift"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/185974-186292.webm","at":1859.8,"dur":3.18},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/188004-188331.webm","at":1880.1,"dur":3.27}]},{"speaker":"B","text":"To solve this, we use heuristic algorithms. A heuristic is a method that finds a solution without calculating every single possible option.","highlights":["heuristic algorithms"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/188712-189386.webm","at":1887.2,"dur":6.74},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/192472-192981.webm","at":1924.8,"dur":5.09}]},{"speaker":"A","text":"It's very useful because I know if I follow this plan, I'll deliver everything. However, it might not be the absolute best solution.","highlights":["absolute best"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/194256-195200.webm","at":1942.7,"dur":9.44}]},{"speaker":"B","text":"My estimate shows the best solution could be seven percent better. That's about four hours of savings, which is huge because you don't have to pay drivers for that time.","highlights":["seven percent better"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/198372-199822.webm","at":1983.8,"dur":14.5}]},{"speaker":"A","text":"Saving time is vital, especially with gas prices. It also helps us squeeze in more orders, like if 20 more people want water, we might be able to deliver it.","highlights":["squeeze in"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/200628-201428.webm","at":2006.4,"dur":8.0},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/202026-202668.webm","at":2020.4,"dur":6.42}]},{"speaker":"B","text":"The whole problem is developing a better heuristic. The catch is that there is no proven 'best' algorithm; it's a complex scientific problem.","highlights":["the catch is"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/204188-205037.webm","at":2042.0,"dur":8.49},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/206060-206499.webm","at":2060.7,"dur":4.39}]},{"speaker":"A","text":"It sounds impossible, like magic, but many people at different universities are constantly publishing new methods to improve the results.","highlights":["sounds impossible"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/208846-209862.webm","at":2088.6,"dur":10.16}]},{"speaker":"B","text":"I'm using Astrakhan as the example because I know that town well and I've done similar work there before.","highlights":["similar work"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/214208-215274.webm","at":2142.2,"dur":10.66}]}],"time":1807.7,"topic":2},{"title":"Algorithm optimization and project redesign","lines":[{"speaker":"A","text":"I need to understand the algorithm's logic. If I know the city, I can check the solution, but if it works in Astrakhan, it should work anywhere.","highlights":["work anywhere"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/217370-218303.webm","at":2173.8,"dur":9.33}]},{"speaker":"B","text":"Exactly. I'm combining all the published methods with my own to find the most effective solution for different scenarios.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/218838-220164.webm","at":2188.5,"dur":13.26}]},{"speaker":"A","text":"You've been optimizing it every day. Do those tests require a lot of processing power?","highlights":["processing power"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/223104-224643.webm","at":2231.1,"dur":15.39}]},{"speaker":"B","text":"My computer is running at maximum capacity, almost like a mining farm. This is the second project currently in progress.","highlights":["maximum capacity"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/225100-226127.webm","at":2251.1,"dur":10.27}]},{"speaker":"A","text":"What about the reviews? You decided to change them because you wanted to improve the style and design?","highlights":["style and design"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/229558-231166.webm","at":2295.7,"dur":16.08}]},{"speaker":"B","text":"I did the original version a year and a half ago when AI was quite bad. If you specify the problem in great detail, it can do a lot.","highlights":["in great detail"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/233336-233743.webm","at":2333.5,"dur":4.07},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/234424-235198.webm","at":2344.3,"dur":7.74}]},{"speaker":"A","text":"Redesigning the reviews would have taken me a day back then, but now the entire project takes only three or four hours.","highlights":["back then"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/235788-236668.webm","at":2358.1,"dur":8.8}]},{"speaker":"B","text":"It's not just about the design; it's about the new features. The feedback from the project founder was overwhelmingly positive.","highlights":["overwhelmingly positive"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/238448-238860.webm","at":2384.7,"dur":4.12},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/239872-240444.webm","at":2398.8,"dur":5.72}]},{"speaker":"A","text":"The difference is huge. Even where I last checked it, things like the autistic gaze are now permanent on the internet.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/242432-243131.webm","at":2424.4,"dur":6.99},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/243638-244629.webm","at":2436.5,"dur":9.91}]},{"speaker":"B","text":"A lot has happened in the last five days. I've written a lot of trials to make the script interesting and useful.","highlights":["a lot has happened"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/246148-246507.webm","at":2461.6,"dur":3.59},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/246972-248017.webm","at":2469.9,"dur":10.45}]},{"speaker":"A","text":"I did make a mistake here. I didn't quite understand what that word meant.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/251066-251990.webm","at":2510.8,"dur":9.24}]}],"time":2173.8,"topic":3},{"title":"Developing an all-in-one English learning app","lines":[{"speaker":"A","text":"I've noticed that word in the vocabulary section now. I really want students to spend as much time on it as they do in class.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/251970-253696.webm","at":2519.8,"dur":17.26}]},{"speaker":"B","text":"You can actually create a profile for every single student. Since you don't have many students yet, algorithms can generate profiles for as many as you need.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/254000-255514.webm","at":2540.1,"dur":15.14}]},{"speaker":"A","text":"It would be like Quizlet, where we force users to learn what they don't know by adding them to a list to study every lesson.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/255760-257200.webm","at":2557.7,"dur":14.4}]},{"speaker":"B","text":"That's exactly what I'm planning to build for my fourth project. I want to integrate all my current resources, like the Cambridge Dictionary and ChatGPT, into one app.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/258144-259578.webm","at":2581.5,"dur":14.34}]},{"speaker":"A","text":"So, do you want to connect existing tools or create your own version of them?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/262222-262787.webm","at":2622.3,"dur":5.65}]},{"speaker":"B","text":"It's a significant project. It might be more challenging than my current work on algorithms, but it'll be really cool to have everything in one place.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/263412-264912.webm","at":2634.2,"dur":15.0}]},{"speaker":"A","text":"I had a problem yesterday with the word 'cinnamon.' I remembered the start of the word, but the ending was just a blur in my mind.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/266928-268176.webm","at":2669.4,"dur":12.48}]},{"speaker":"B","text":"Maybe it's because it's in your passive vocabulary. You only know the skeleton of the word, and since you only use it for 'cinnamon buns,' you might have merged it with 'Cinnabon.'","highlights":["passive vocabulary"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/269682-270967.webm","at":2696.9,"dur":12.85}]},{"speaker":"A","text":"I realized 'Cinnabon' is just a company name. I wasn't sure if I was saying it right, so I used ChatGPT to clarify, then checked the Cambridge Dictionary.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/272430-273820.webm","at":2724.5,"dur":13.9}]},{"speaker":"B","text":"It's much more useful when all of that stays in one app. You won't have to switch between different tabs.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/276346-277309.webm","at":2763.6,"dur":9.63}]},{"speaker":"A","text":"The app will keep a history of every word you look up. You'll be able to see exactly how many words you've learned in the last week.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/277648-279152.webm","at":2776.6,"dur":15.04}]},{"speaker":"B","text":"It's much easier than using Quizlet and asking ChatGPT to generate quizzes, which it often gets wrong. Having everything in one single app would be way better.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/279390-280800.webm","at":2794.0,"dur":14.1}]}],"time":2519.8,"topic":4},{"title":"AI evolution and app development","lines":[{"speaker":"A","text":"I'm thinking about a feature where you can talk to an AI and it shows your mistakes in real-time, rather than waiting an hour for a review.","highlights":["in real-time"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/283834-285151.webm","at":2838.4,"dur":13.17}]},{"speaker":"B","text":"Can you imagine living without any AI tools? We lived like that just a few years ago, but it's hard to go back once people have adapted.","highlights":["go back"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/286404-287736.webm","at":2864.1,"dur":13.32}]},{"speaker":"A","text":"I see AI as the next step in evolution, following the industrial revolution and the rise of computers. It's only going to accelerate from here.","highlights":["next step"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/292830-294513.webm","at":2928.4,"dur":16.83}]},{"speaker":"B","text":"True, but the subscription costs are crazy. I can't imagine paying $100 a month, especially since companies like OpenAI are likely losing money on these models.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/297208-298705.webm","at":2972.5,"dur":14.97}]},{"speaker":"A","text":"They're basically giving you hundreds of dollars worth of computing power for a small fee. These models take an enormous amount of power to run.","highlights":["enormous amount"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/301380-302434.webm","at":3013.9,"dur":10.54}]},{"speaker":"B","text":"I've only ever used free models, so I'm not sure how the paid ones compare. Anyway, when was the last time you bought a video game?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/304008-304536.webm","at":3040.2,"dur":5.28},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/305492-305905.webm","at":3055.0,"dur":4.13}]},{"speaker":"A","text":"I can't remember. But even if a game costs 20 bucks, that's not a huge amount of money compared to what's in my bank account.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/306292-306588.webm","at":3063.0,"dur":2.96},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/308692-309291.webm","at":3087.0,"dur":5.99}]},{"speaker":"B","text":"After our last lesson, I thought a lot about your career. Maybe we can connect the app you showed me with the delivery routes in Astrakhan to your career app.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/311740-313034.webm","at":3117.5,"dur":12.94}]},{"speaker":"A","text":"It might be a simple solution, but does it actually account for time windows when calculating the delivery routes?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/316684-318079.webm","at":3166.9,"dur":13.95}]}],"time":2838.4,"topic":4},{"title":"How a courier delivery app works","lines":[{"speaker":"A","text":"So, how does this app actually work? Is it like Google Maps but with fewer features?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/318666-319874.webm","at":3186.8,"dur":12.08}]},{"speaker":"B","text":"It shows points on a map, and each point represents a delivery. You click on one to book it, and it shows the address and a timer.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/322928-324408.webm","at":3229.4,"dur":14.8}]},{"speaker":"A","text":"Does it build a route for you? And are there any limits on how many orders I can do?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/319881-320350.webm","at":3199.0,"dur":4.69},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/326356-326988.webm","at":3263.7,"dur":6.32}]},{"speaker":"B","text":"There are no limits. You can do one delivery a day or a hundred. You get paid based on how many you complete, and the price depends on the weight or the distance.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/327984-329446.webm","at":3279.9,"dur":14.62}]},{"speaker":"A","text":"I'm surprised by this model. What if 40 couriers ignore a specific order? Who would actually deliver it?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/331094-332695.webm","at":3311.0,"dur":16.01}]},{"speaker":"B","text":"Once you book an order, it disappears from the map for other couriers. If you don't deliver it, you have to return it to the warehouse.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/336984-338352.webm","at":3369.9,"dur":13.68}]},{"speaker":"A","text":"I think the system could be optimized. It feels like a basic solution rather than the best one.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/341119-342569.webm","at":3411.3,"dur":14.5}]},{"speaker":"B","text":"The system could definitely be improved, but they use a different approach. Their fleet size is dynamic, unlike a fixed number of trucks.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/342570-344030.webm","at":3425.8,"dur":14.6}]},{"speaker":"A","text":"What if someone wants to work full-time? Can they just book a batch of 10 orders at once?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/346910-348368.webm","at":3469.2,"dur":14.58}]},{"speaker":"B","text":"You can book 10, but there's a bonus if you complete the order and deliver it within 40 minutes.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/349204-350843.webm","at":3492.1,"dur":16.39}]}],"time":3186.8,"topic":5},{"title":"Optimizing delivery logistics and test results","lines":[{"speaker":"A","text":"I'm thinking about how my algorithm could help couriers. For instance, if you're working a part-time job, how much do you usually make per day?","highlights":["part-time job"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/353074-353889.webm","at":3530.8,"dur":8.15}]},{"speaker":"B","text":"It depends. But imagine if you could set a goal, like earning 2,000 rubles for seven hours of work. The app would then automatically assign orders to fit that timeframe.","highlights":["fit that timeframe"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/354250-355805.webm","at":3542.6,"dur":15.55}]},{"speaker":"A","text":"Right, but what happens if there aren't enough orders? The system could offer options, like 'You can do four orders for 700 rubles, or six orders for 1,200 rubles,' and you just pick what works for you.","highlights":["pick what works"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/359264-360741.webm","at":3592.7,"dur":14.77}]},{"speaker":"B","text":"I'm definitely trying different options. Honestly, the ideas you just came up with are already better than what we have now. It's crazy how a massive company like this overlooks such simple improvements.","highlights":["overlooks such simple improvements"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/365118-365488.webm","at":3651.3,"dur":3.7},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/365790-366610.webm","at":3658.0,"dur":8.2}]},{"speaker":"A","text":"Exactly. Those missed opportunities and unoptimized aspects probably cost the company millions every year. However, they might be reluctant to change because they're sticking with their current system.","highlights":["reluctant to change"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/369724-371263.webm","at":3697.4,"dur":15.39}]},{"speaker":"B","text":"They might say they don't want to bet on your algorithm since their current one is already working. They might not even care about the individual couriers, even though faster deliveries would satisfy more customers.","highlights":["bet on"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/371454-372552.webm","at":3714.6,"dur":10.98}]},{"speaker":"A","text":"It's a shame. They have a solution but refuse to use it. It's the price of wasted potential. Anyway, did you manage to finish the reading tests?","highlights":["wasted potential"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/377768-378907.webm","at":3777.8,"dur":11.39},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/379258-379903.webm","at":3792.8,"dur":6.45}]},{"speaker":"B","text":"I did the reading tests on my iPad, but I ran into an error. I had to screenshot my answers and finish them on my computer. I ended up with a score of 6.5.","highlights":["ran into an error"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/381236-381714.webm","at":3812.5,"dur":4.78},{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/382774-383634.webm","at":3827.8,"dur":8.6}]},{"speaker":"A","text":"No problem. Review your mistakes and start the second test I sent you. Also, did you check my report about the maps?","highlights":["review your mistakes"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/385236-386262.webm","at":3852.5,"dur":10.26}]},{"speaker":"B","text":"I took a look, but I haven't reviewed it in detail yet. I'll do that today and send you a video review. Have a great day!","highlights":["in detail"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_13-04-38/386888-388042.webm"                 (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length, phrase]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end, phrase]) => {
                    const word = link ? link(phrase) : -1;
                    const opens = word >= 0 ? ` data-vocab="${word}" title="${esc(`See “${vocabulary[word].term}” in Vocabulary`)}"` : '';
                    html += esc(text.slice(cursor, start)) + `<mark class="expr"${opens}>${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {
                    if (value === undefined) return window.localStorage.getItem(key);
                    window.localStorage.setItem(key, value);
                } catch (_error) {
                    return null;
                }
                return null;
            }

            // ---------------------------------------------------------- header
            document.getElementById('title').textContent = meta.title || 'Lesson review';

            // The lesson time in Moscow time (meta.start_utc: when the lesson
            // began, in seconds since 1970). A tap shows it in the reader's own
            // time zone instead, remembered on the phone. Older pages have no
            // start_utc: the date and time as recorded, with no zone.
            const eyebrow = document.getElementById('eyebrow');
            const lessonStart = typeof meta.start_utc === 'number' && isFinite(meta.start_utc) ? new Date(meta.start_utc * 1000) : null;
            let lessonTimes = null;
            let ownZone = storage('lesson-time-zone') === 'own';

            function zoneTime(zone) {
                const date = { day: 'numeric', month: 'long', year: 'numeric' };
                const time = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
                if (zone) { date.timeZone = zone; time.timeZone = zone; }
                return {
                    date: new Intl.DateTimeFormat('en-GB', date).format(lessonStart),
                    time: new Intl.DateTimeFormat('en-GB', time).format(lessonStart)
                };
            }

            function offsetName(minutes) {
                const size = Math.abs(minutes);
                if (!size) return 'GMT';
                return 'GMT' + (minutes < 0 ? '-' : '+') + Math.floor(size / 60) + (size % 60 ? ':' + String(size % 60).padStart(2, '0') : '');
            }

            if (lessonStart) {
                try {
                    const moscow = zoneTime('Europe/Moscow');
                    const own = zoneTime(null);
                    lessonTimes = {
                        moscow: Object.assign(moscow, { zone: 'MSK', name: 'Moscow time' }),
                        own: Object.assign(own, { zone: offsetName(-lessonStart.getTimezoneOffset()), name: 'your time' }),
                        differ: moscow.date !== own.date || moscow.time !== own.time
                    };
                } catch (_error) {
                    lessonTimes = null;  // no time zones in this browser: the time as recorded
                }
            }

            function showLessonTime() {
                let date = meta.date;
                if (!lessonTimes) {
                    eyebrow.textContent = ['English lesson', meta.date, meta.time].filter(Boolean).join(' · ');
                } else {
                    const shown = lessonTimes.differ && ownZone ? lessonTimes.own : lessonTimes.moscow;
                    const other = shown === lessonTimes.own ? lessonTimes.moscow : lessonTimes.own;
                    const time = `${esc(shown.time)} <span class="tz">${esc(shown.zone)}</span>`;
                    date = shown.date;
                    eyebrow.innerHTML = `English lesson · ${esc(shown.date)} · `
                        + (lessonTimes.differ
                            ? `<button class="tz-btn" type="button" title="Show ${esc(other.name)} (${esc(other.zone)})" aria-label="${esc(`${shown.time} ${shown.name}. Show ${other.name}, ${other.zone}`)}">${time}</button>`
                            : `<span class="tz-time">${time}</span>`);
                }
                document.title = (meta.title ? meta.title + ' · ' : '') + 'English lesson' + (date ? ' · ' + date : '');
            }
            showLessonTime();
            eyebrow.addEventListener('click', event => {
                if (!event.target.closest('.tz-btn')) return;
                ownZone = !ownZone;
                storage('lesson-time-zone', ownZone ? 'own' : 'moscow');
                showLessonTime();
                const button = eyebrow.querySelector('.tz-btn');
                if (button && event.detail === 0) button.focus();  // kept for the keyboard
            });

            document.getElementById('count-mistakes').textContent = mistakes.length;
            document.getElementById('count-vocabulary').textContent = vocabulary.length;
            document.getElementById('count-dialogues').textContent = dialogues.length;

            // -------------------------------------------------------- mistakes
            const topics = lesson.topics || [];
            // Each mistake example, word and dialogue line can be found by the timeline.
            const exampleIds = new Map();
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => exampleIds.set(example, `m-${c}-${e}`)));
            let showAllMistakes = () => {};
            let vocabularyToWords = () => {};
            // What "Go back" needs to put a section back as it was.
            let mistakeFilter = () => 'all';
            let setMistakeFilter = () => {};
            let vocabularyView = () => 'words';
            let setVocabularyView = () => {};

            function clock(seconds) {
                if (seconds === null || seconds === undefined) return '';
                const total = Math.max(0, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const rest = String(total % 60).padStart(2, '0');
                return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
            }

            function plain(text) {
                return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
            }

            // One example: when it was said, the full sentence(s) as said and
            // corrected, and (where it adds something) its own explanation.
            function exampleHtml(example, options) {
                const before = example.context || example.quote;
                const after = example.context_fix || example.fix;
                const d = diff(before, after);
                // The clip pill needs no separator: it stays apart from the topic when the line wraps.
                const pill = clipHtml(example.clip, 'Hear what was said');
                // The letters beside the time open the same moment in the other sections.
                const jumps = jumpsHtml('mistakes', example.clip ? example.clip.at : example.time);
                const facts = [];
                if (!pill && example.time !== null && example.time !== undefined) facts.push(`<span class="clock">${clock(example.time)}</span>${jumps}`);
                if (options.showTopic && topics[example.topic]) facts.push(`<span>${esc(topics[example.topic].title)}</span>`);
                let html = `<div class="pair" data-item="${exampleIds.get(example) || ''}"${options.hidden ? ' hidden' : ''}>`;
                const separator = jumps && !pill ? '' : '<span class="sep">·</span>';
                if (pill || facts.length) html += `<div class="ex-meta" data-no-speech>${pill}${pill ? jumps : ''}${facts.join(separator)}</div>`;
                html += `<div class="said"><span class="mark-icon" aria-label="What was said" data-no-speech>✗</span><span class="txt">${d.said}</span></div>`;
                html += `<div class="fixed"><span class="mark-icon" aria-label="Better" data-no-speech>✓</span><span class="txt">${d.fixed}</span>${playButton(after, 'Listen to the correct version')}</div>`;
                if (options.why) html += `<p class="ex-why">${esc(options.why)}</p>`;
                return html + '</div>';
            }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
                    html += items.map(item => `<li><span class="meaning">${esc(item.meaning)}</span><span class="m-ex">${highlightTerm(item.example, entry.term)}`
                        + (item.lesson ? ' <span class="from-lesson" data-no-speech>from the lesson</span>' : '') + '</span></li>').join('');
                    return html + '</ol></div>';
                };
                return '<div class="forms">'
                    + column('Countable', 'a / an, plural', entry.countable || [])
                    + column('Uncountable', 'no a / an, no plural', entry.uncountable || [])
                    + '</div>';
            }

            function relatedHtml(entry) {
                const row = (title, words) => (words || []).length
                    ? `<div class="rel"><p class="part-title" data-no-speech>${title}</p><span class="rel-words">${words.map(w => `<span class="rel-word">${esc(w)}</span>`).join('<span class="sep" data-no-speech> · </span>')}</span></div>`
                    : '';
                return row('Synonyms', entry.synonyms) + row('Antonyms', entry.antonyms);
            }

            // Visible: when it was said, the word, the meaning, the lesson's own
            // words and at least three examples. The rest opens on request.
            function wordCardHtml(entry, index) {
                const term = entry.term || '';
                let html = `<article class="card word" id="word-${index}"><div class="w-head">`;
                if (entry.clip) html += clipHtml(entry.clip, 'Hear it in the lesson');
                else if (entry.time !== null && entry.time !== undefined) html += `<span class="clock" data-no-speech>${clock(entry.time)}</span>`;
                html += jumpsHtml('vocabulary', entry.clip ? entry.clip.at : entry.time);
                // The word, its kind and its speaker stay together (a new row when
                // they do not fit); the kind and the speaker never part.
                html += `<div class="w-title"><h3 class="w-term">${esc(term)}</h3><span class="w-side">`;
                if (entry.pos) html += `<span class="w-pos" data-no-speech>${esc(entry.pos)}</span>`;
                html += playButton(term, 'Listen to ' + term) + '</span></div></div>';
                if (entry.definition) html += `<p class="def">${esc(entry.definition)}</p>`;
                const passage = entry.lesson || entry.lesson_example;
                if (passage) {
                    html += `<div class="lesson-ex"><div class="txt"><span class="src" data-no-speech>From the lesson</span>${highlightTerm(passage, term)}</div>${playButton(passage, 'Listen')}</div>`;
                }
                const examples = exampleItems(entry);
                if (examples.length) {
                    html += '<ul class="examples">' + examples.map(example => '<li>'
                        + (example.pattern ? `<span class="pat" data-no-speech>${esc(example.pattern)}</span> ` : '')
                        + highlightTerm(example.sentence, term) + '</li>').join('') + '</ul>';
                }
                if (entry.note) html += `<p class="note">${icons.bulb}<span>${esc(entry.note)}</span></p>`;

                const parts = [];
                if ((entry.countable || []).length || (entry.uncountable || []).length) parts.push(['forms', 'Countable / uncountable', formsHtml(entry)]);
                if ((entry.more_examples || []).length) {
                    parts.push(['more', 'More examples', '<p class="part-title" data-no-speech>More examples</p><ul class="examples">'
                        + entry.more_examples.map(s => `<li>${highlightTerm(s, term)}</li>`).join('') + '</ul>']);
                }
                const related = relatedHtml(entry);
                if (related) parts.push(['related', 'Synonyms & antonyms', related]);
                if (parts.length) {
                    html += '<div class="more-bar" data-no-speech>'
                        + parts.map(([id, name]) => `<button class="more-btn" type="button" data-part="${id}" aria-expanded="false">${name}</button>`).join('')
                        + '<button class="more-btn more-hide" type="button">Hide</button></div>';
                    html += parts.map(([id, , body]) => `<div class="more-part" data-part="${id}" hidden>${body}</div>`).join('');
                }
                return html + '</article>';
            }

            // Matching pairs: all the words, shuffled into rounds of about six;
            // the meanings are shuffled separately.
            function renderMatch(game) {
                const pool = shuffled(matchable);
                const roundCount = Math.ceil(pool.length / 6);
                const rounds = [];
                for (let r = 0, cursor = 0; r < roundCount; r++) {
                    const size = Math.floor(pool.length / roundCount) + (r < pool.length % roundCount ? 1 : 0);
                    rounds.push(pool.slice(cursor, cursor + size));
                    cursor += size;
                }
                let round = 0, misses = 0, picked = null;
                const missText = () => misses === 1 ? '1 mistake' : `${misses} mistakes`;

                function draw() {
                    const ids = rounds[round];
                    let html = `<div class="game-head" data-no-speech><span>Round ${round + 1} of ${rounds.length}</span><span class="game-score">${missText()}</span></div>`;
                    html += '<p class="game-hint" data-no-speech>Tap a word, then its meaning.</p>';
                    html += '<div class="match-board" data-no-speech><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile term" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].term)}</button>`).join('');
                    html += '</div><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile meaning" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].definition)}</button>`).join('');
                    html += '</div></div><div class="game-foot" data-no-speech></div>';
                    game.innerHTML = html;
                    picked = null;
                }

                function roundDone() {
                    const foot = game.querySelector('.game-foot');
                    if (round + 1 < rounds.length) {
