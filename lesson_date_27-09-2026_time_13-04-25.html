<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
            }
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: #b9ccff; color: #0d2146; }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;
            font-weight: 650;
            cursor: pointer;
        }

        .orig-toggle:hover { color: var(--accent); }

        .orig { margin: 6px 0 0; padding: 6px 9px; border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 0.88rem; font-style: italic; }

        .dialogue-tools { margin: 0 0 14px; }

        /* ------------------------------------------ mistake views and times */
        .viewbar { display: inline-flex; flex-wrap: wrap; gap: 2px; margin: 0 0 12px; padding: 3px; border-radius: 12px; background: var(--surface-2); }

        .view { min-height: 34px; padding: 4px 14px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-size: 0.88rem; font-weight: 650; cursor: pointer; }

        .view[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .ex-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 5px; color: var(--muted); font-size: 0.8rem; font-weight: 600; }

        .clock { padding: 0 6px; border-radius: 5px; background: var(--surface); color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }

        .sep { color: var(--faint); }

        .ex-why { margin: 6px 0 0 24px; color: var(--muted); font-size: 0.9rem; }

        .topic-head { display: flex; gap: 8px; align-items: center; margin: 24px 0 10px; font-size: 1.02rem; }

        .topic-head .clock { background: var(--surface-2); }

        .topic-count { margin-left: auto; color: var(--faint); font-size: 0.8rem; }

        @media (max-width: 520px) {
            body { font-size: 16px; }
            .card { padding: 14px; }
            #panel-vocabulary { font-size: 15px; }
            .word { padding: 12px; }
            .w-term { font-size: 1.08rem; }
            .bubble { max-width: 94%; }
            .tab { font-size: 0.88rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="hero">
            <p class="eyebrow" id="eyebrow" data-no-speech>English lesson</p>
            <h1 id="title">Lesson review</h1>
            <p class="hint" data-no-speech>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
                <span>Select any word or sentence to hear it.</span>
            </p>
        </header>

        <nav class="tabs" role="tablist" aria-label="Lesson sections" data-no-speech>
            <button class="tab" role="tab" id="tab-mistakes" data-tab="mistakes" aria-controls="panel-mistakes">Mistakes <span class="count" id="count-mistakes">0</span></button>
            <button class="tab" role="tab" id="tab-vocabulary" data-tab="vocabulary" aria-controls="panel-vocabulary">Vocabulary <span class="count" id="count-vocabulary">0</span></button>
            <button class="tab" role="tab" id="tab-dialogues" data-tab="dialogues" aria-controls="panel-dialogues">Dialogues <span class="count" id="count-dialogues">0</span></button>
        </nav>

        <main>
            <section class="panel" id="panel-mistakes" role="tabpanel" aria-labelledby="tab-mistakes"></section>
            <section class="panel" id="panel-vocabulary" role="tabpanel" aria-labelledby="tab-vocabulary" hidden></section>
            <section class="panel" id="panel-dialogues" role="tabpanel" aria-labelledby="tab-dialogues" hidden></section>
        </main>
    </div>

attern":""},{"sentence":"I'm going to take a nap to recharge before the party starts.","pattern":""}],"more_examples":["I usually spend my Sunday mornings reading a book to recharge.","You look exhausted; why don't you take the afternoon off to recharge?","After a grueling marathon, it takes a few days to fully recharge."],"synonyms":["refuel","re-energize","recover"],"antonyms":["exhaust","drain","tire out","deplete"],"gap":{"sentence":"After working double shifts all week, I'm planning a quiet weekend away to _____ before starting my next project.","answer":"recharge","options":["recharge","relocate","reproduce","reappear"]}},{"term":"come to terms with (something)","pos":"expression","definition":"To gradually accept a difficult, unpleasant, or inevitable situation.","time":1801.2,"lesson":"You just have to understand and come to terms with the fact that, at school, you are often wasting your time.","examples":[{"sentence":"It took him a long time to come to terms with the loss of his job.","pattern":"come to terms with + noun"},{"sentence":"She is still trying to come to terms with the news of her move.","pattern":"still + come to terms with"},{"sentence":"They finally came to terms with the reality of the situation.","pattern":"come to terms with + the reality of"},{"sentence":"He had a hard time coming to terms with his failure.","pattern":""}],"more_examples":["It took her months to come to terms with the end of their relationship.","He eventually came to terms with the fact that he would never play professionally.","The community is still struggling to come to terms with the tragedy."],"synonyms":["accept","make peace with","resign oneself to","face up to","reconcile oneself to","acknowledge","come to grips with"],"antonyms":["reject","deny","ignore","refuse to accept","resist"],"gap":{"sentence":"After months of mourning, she finally managed to _____.","answer":"come to terms with the passing of her beloved pet","options":["come to terms with the passing of her beloved pet","ignore the passing of her beloved pet","demand the passing of her beloved pet","predict the passing of her beloved pet"]}},{"term":"maintain a system","pos":"expression","definition":"To perform the ongoing work or tasks required to keep a structure or organization functioning.","time":1897.9,"lesson":"Why do jobs exist? Jobs exist because you need to maintain a certain system. Any person who works somewhere benefits a system and maintains it.","examples":[{"sentence":"The company hired new staff to maintain the system and ensure everything runs smoothly.","pattern":"maintain the system"},{"sentence":"It takes a lot of effort to maintain a system that serves thousands of people.","pattern":"It takes [effort] to maintain"},{"sentence":"If we don't have enough people to maintain the system, the whole operation might collapse.","pattern":"maintain the system (conditional)"}],"more_examples":["The IT department is responsible for maintaining the system during the weekend.","It is crucial to maintain a system of regular check-ups to prevent equipment failure.","We need a dedicated team to maintain the system as the user base grows."],"synonyms":["keep a system running","manage a system","keep up a system","service a system","sustain a system"],"antonyms":["neglect a system","let a system fail","abandon a system"],"gap":{"sentence":"The software is complex, so the IT department has to _____ to prevent any technical glitches.","answer":"maintain a system","options":["maintain a system","delete a system","ignore a system","hide a system"]}},{"term":"inevitable","pos":"adjective","definition":"certain to happen and unavoidable, especially because of the way a system is organized.","time":1929.0,"lesson":"You only receive a small share of this big system. It is not necessarily a good or bad thing; it is inevitable simply because building systems is hard.","examples":[{"sentence":"With the current trend, a rise in prices seems inevitable.","pattern":"subject + seems + inevitable"},{"sentence":"It was inevitable that the company would eventually expand into new markets.","pattern":"It is inevitable that + clause"},{"sentence":"The team faced the inevitable consequences of their poor planning.","pattern":"the inevitable + noun"},{"sentence":"If you don't study, failure is almost inevitable.","pattern":"adverb + inevitable"}],"more_examples":["In any large organization, some level of bureaucracy is inevitable.","The software update will cause some temporary downtime, but it's inevitable.","When you combine high demand with low supply, a price hike is inevitable."],"synonyms":["unavoidable","bound to happen","certain","unpreventable"],"antonyms":["avoidable","preventable","uncertain"],"gap":{"sentence":"Because the city is so overcrowded, some level of traffic congestion is _____ during the morning rush hour.","answer":"inevitable","options":["inevitable","optional","temporary","unexpected"]}},{"term":"on a regular basis","pos":"expression","definition":"happening or done frequently or at fixed intervals of time.","time":2164.4,"lesson":"The school system builds a habit in you. For example, students learn that they need to go somewhere on a regular basis and do certain things that they are rated on.","examples":[{"sentence":"You should exercise on a regular basis to stay healthy.","pattern":"on a regular basis (at the end of a sentence)"},{"sentence":"The company updates its software on a regular basis.","pattern":"subject + verb + on a regular basis"},{"sentence":"Do you visit your grandparents on a regular basis?","pattern":""},{"sentence":"I don't check my email on a regular basis, only when I'm at my desk.","pattern":""}],"more_examples":["I try to cook at home on a regular basis to save money.","The team meets on a regular basis to discuss their progress.","You need to water the plants on a regular basis during the summer."],"synonyms":["regularly","periodically","consistently","at regular intervals","routinely","systematically"],"antonyms":["irregularly","occasionally","rarely","seldom","infrequently","sporadically"],"gap":{"sentence":"To ensure the garden stays beautiful and the weeds are kept under control, you need to water the plants _____.","answer":"on a regular basis","options":["on a regular basis","on a sudden basis","on a rare basis","on a secret basis"]}},{"term":"be willing to","pos":"expression","definition":"to be happy or ready to do something, especially if it involves effort or sacrifice.","time":2216.5,"lesson":"A stable society can be maintained if there are many people who follow orders without asking questions and are willing to sacrifice their time. They must be convinced that they are actually getting something in return.","examples":[{"sentence":"Are you willing to take the risk if the project succeeds?","pattern":"question form: Are you willing to...?"},{"sentence":"She was willing to do whatever it took to pass the exam.","pattern":"willing to + [verb phrase]"},{"sentence":"The company is willing to negotiate the terms of the contract.","pattern":"willing to + [infinitive]"}],"more_examples":["Are you willing to move to another city for this job opportunity?"],"synonyms":["ready to","prepared to","game to","disposed to","open to"],"antonyms":["unwilling to","reluctant to","hesitant to"],"gap":{"sentence":"The marathon was incredibly grueling, but he _____ push through the pain to reach the finish line.","answer":"was willing to","options":["was willing to","was annoyed to","was angry to","was bored to"]}},{"term":"emerge out of nowhere","pos":"expression","definition":"to appear suddenly or develop without a clear, obvious beginning or prior explanation.","time":2336.8,"lesson":"Of course, TikTok did not emerge out of nowhere. They conducted a lot of research and studies to understand how it works.","examples":[{"sentence":"The new trend didn't just emerge out of nowhere; it was built over years of marketing.","pattern":"subject + didn't just emerge out of nowhere"},{"sentence":"A huge opportunity emerged out of nowhere during the meeting.","pattern":"noun + emerged out of nowhere"},{"sentence":"The problem emerged out of nowhere, leaving the team with no time to react.","pattern":""},{"sentence":"Success rarely emerges out of nowhere; it usually requires a lot of hard work.","pattern":""}],"more_examples":["A mysterious figure emerged out of nowhere and vanished into the shadows.","I was walking alone in the park when a stray dog emerged out of nowhere.","The demand for remote work emerged out of nowhere during the global crisis."],"synonyms":["pop up","materialize suddenly","spring up","come out of nowhere","arise unexpectedly"],"antonyms":["develop gradually","evolve slowly","appear expectedly","be planned in advance"],"gap":{"sentence":"I was enjoying a peaceful walk in the park when a massive storm cloud _____, ruining our plans.","answer":"emerged out of nowhere","options":["emerged out of nowhere","stayed there","happened slowly","planned ahead"]}},{"term":"conduct studies","pos":"expression","definition":"To carry out systematic research or experiments to gain information or test a theory.","time":2341.7,"lesson":"They did a lot of research and conducted a lot of studies to understand how it works.","examples":[{"sentence":"The university is conducting studies on the effects of social media on teenagers.","pattern":"conduct + studies + on [topic]"},{"sentence":"Before launching the new product, the company conducted several studies to gauge consumer interest.","pattern":"conduct + studies + to [verb]"},{"sentence":"Have they conducted any studies to prove that this method is effective?","pattern":"question form: Have they conducted...?"},{"sentence":"The scientists conducted a series of studies over five years.","pattern":"conduct + a series of studies"}],"more_examples":["The government is conducting studies to determine the best way to reduce traffic congestion.","The hospital conducted studies to see if the new medication had any side effects.","They need to conduct more studies before they can claim the treatment is safe."],"synonyms":["carry out research","perform research","run experiments","undertake research","do research","perform tests"],"antonyms":[],"gap":{"sentence":"To ensure the new medication is safe for public use, the pharmaceutical company needs to _____ on its long-term effects.","answer":"conduct studies","options":["conduct studies","write stories","sell products","take photos"]}},{"term":"bring food to the table","pos":"expression","definition":"To successfully provide food or resources for a group or a household.","time":2415.8,"lesson":"It can take six hours before you actually kill an animal and bring food to the table. That is a long span, but at the end of it, you are rewarded.","examples":[{"sentence":"He works two jobs just to bring food to the table for his children.","pattern":"bring food to the table (for someone)"},{"sentence":"In a survival situation, the main priority is how to bring food to the table.","pattern":""},{"sentence":"She is the primary breadwinner who brings food to the table every month.","pattern":""}],"more_examples":["The company is struggling to bring food to the table for its employees.","They moved to the countryside to start a farm and bring food to the table.","It's not just about the money; it's about making sure we can bring food to the table."],"synonyms":["provide for the family","support the household"],"antonyms":[],"gap":{"sentence":"Since the company is facing a financial crisis, the manager is looking for employees who can actually _____.","answer":"bring food to the table","options":["bring food to the table","take food to the table","make food to the table","keep food to the table"]}},{"term":"sedentary lifestyle","pos":"noun phrase","definition":"A way of life that involves little to no physical activity or exercise.","time":2550.7,"lesson":"You have a sedentary lifestyle. You don't really do anything, but you still get a lot of food for that.","examples":[{"sentence":"Many office workers lead a sedentary lifestyle because they sit at desks all day.","pattern":"lead a sedentary lifestyle"},{"sentence":"To counter the risks of a sedentary lifestyle, it is important to take regular walking breaks.","pattern":"risks of a sedentary lifestyle"},{"sentence":"Modern technology has contributed to a more sedentary lifestyle for many teenagers.","pattern":"contributed to a sedentary lifestyle"},{"sentence":"I'm trying to break out of my sedentary lifestyle by joining a local gym.","pattern":"break out of a sedentary lifestyle"}],"countable":[{"meaning":"A way of life that involves little to no physical activity or exercise.","example":"You have a sedentary lifestyle.","lesson":true}],"uncountable":[],"more_examples":["Research shows that a sedentary lifestyle can increase the risk of heart disease.","It is easy to fall into a sedentary lifestyle when you work from home.","Doctors recommend finding ways to stay active to avoid a sedentary lifestyle."],"synonyms":["inactive lifestyle","inactive way of life","lack of physical activity","inactive habits"],"antonyms":["active lifestyle","active way of life","physically active lifestyle","an active life"],"gap":{"sentence":"Doctors warn that spending too much time sitting in front of a screen can lead to a _____.","answer":"sedentary lifestyle","options":["sedentary lifestyle","active lifestyle","healthy diet","busy schedule"]}},{"term":"execution","pos":"noun","definition":"The legal act of carrying out a death sentence as a punishment for a crime.","time":2603.6,"lesson":"In the past, for an execution, you would have to wait about a month before somebody was executed. Would you use the word execution in that context?","examples":[{"sentence":"The prisoner's execution was scheduled for dawn.","pattern":""},{"sentence":"The state carried out the execution by hanging.","pattern":""},{"sentence":"There was a lot of public outcry regarding the execution.","pattern":""},{"sentence":"The execution was carried out in a private facility.","pattern":""}],"countable":[{"meaning":"The legal act of carrying out a death sentence as a punishment for a crime.","example":"In the past, for an execution, you would have to wait about a month before somebody was executed.","lesson":true},{"meaning":"The act of performing or accomplishing a task or plan","example":"The execution of the new marketing strategy was flawless."},{"meaning":"The performance of a creative work, such as a dance or play","example":"The critics praised the dancer's execution of the final routine."}],"uncountable":[{"meaning":"The manner or quality of carrying out a task","example":"The project failed due to poor execution by the team."}],"more_examples":["The governor signed the order for the prisoner's execution.","Many countries have abolished the death penalty and its executions.","The news of the execution sparked protests across the city."],"synonyms":[],"antonyms":["commutation","pardon","clemency","release"],"gap":{"sentence":"The government faced heavy criticism for the public _____ of the criminal who had committed the murder.","answer":"execution","options":["execution","operation","performance","presentation"]}},{"term":"be a headache","pos":"idiom","definition":"To cause a lot of difficulty, stress, or complicated problems to solve.","time":3333.7,"lesson":"If the customer changes the delivery time, it would be such a headache. I would have to rethink the entire route to ensure I'm not late for other deliveries.","examples":[{"sentence":"Dealing with all the paperwork for the visa was a real headache.","pattern":"a real headache"},{"sentence":"The constant technical glitches are becoming a major headache for the team.","pattern":"become a major headache"},{"sentence":"Trying to coordinate three different schedules is such a headache.","pattern":"such a headache"}],"more_examples":["Finding a parking spot in the city center is always a headache.","The new software update has been a real headache for the designers.","Trying to get the kids to behave during the flight was a total headache."],"synonyms":["be a pain","be a nuisance","be a hassle","be a nightmare"],"antonyms":["be a breeze"],"gap":{"sentence":"Trying to get the neighbors to agree on a renovation plan has been _____ because of their constant complaints.","answer":"a real headache","options":["a real headache","a great pleasure","a simple task","a quick fix"]}},{"term":"figure out","pos":"phrasal verb","definition":"to find a solution to a problem or understand how something works through thinking.","time":3520.2,"lesson":"I wouldn't have to do anything because the algorithm would handle it. I wouldn't have to spend hours trying to figure out the optimal route.","examples":[{"sentence":"I can't figure out how to open this software.","pattern":"figure out + how + to-infinitive"},{"sentence":"We need to figure out a way to reduce our monthly expenses.","pattern":"figure out + a way + to-infinitive"},{"sentence":"Did you ever figure out what the problem was?","pattern":"figure out + [question word] + subject + verb"},{"sentence":"It took me a long time to figure out the math problem.","pattern":"take + time + to figure out"}],"more_examples":["I'm trying to figure out why the car won't start.","It took the engineers months to figure out the source of the leak.","Give me a minute to figure out where I parked my bike."],"synonyms":["solve","understand","work out","deduce","decipher","make sense of","crack","unravel"],"antonyms":["misunderstand"],"gap":{"sentence":"The instructions were so confusing that it took me an hour to _____ how to assemble the bookshelf.","answer":"figure out","options":["figure out","ignore","predict","announce"]}}],"dialogues":[{"title":"Hair styles, travel in Vietnam, and YouTube content","lines":[{"speaker":"A","text":"I've washed my hair, so it doesn't look like a surfer anymore. I actually prefer it a bit greasy because it looks cooler.","said":"I washed it You know like before when I don't wash it it looks like you know, it looks cool it looks like I'm a surfer And Yeah, like I like my hair to be greasy"},{"speaker":"B","text":"True, but now you look a bit like Kurt Cobain. By the way, what is that poster on the wall? Is it a painting?","said":"you look like Kurt Cobain Yeah drugs Yeah, and what's that poster in the background next to"},{"speaker":"A","text":"It's actually a mosaic. I don't have enough time to finish it because there are so many pieces and you have to put every color in the right spot.","said":"it's not a picture it's not a painting but it's a mosaic Okay But honestly, I don't I don't have enough time to finish it because you know, it's I can show you there's"},{"speaker":"B","text":"It looks finished from a distance, but it's still quite pale. So, where are you staying now? Have you moved?"},{"speaker":"A","text":"I'm starting my second round in Vietnam. Do you have a favorite place where you feel most comfortable?","said":"round second round second round. Yeah And so do you have some you know? most favorite places in Vietnam, maybe where you feel like I don't great we're just comfortable to be"},{"speaker":"B","text":"It depends on many factors. The feeling of freshness usually vanishes by the second week. It really depends on how much time you spend in one place.","said":"weeks probably Yeah, and then this This feeling of freshness, you know, it vanishes By the end of like the second week. So it's very much depends on how much time you spend in one place"},{"speaker":"A","text":"Sapa could be cool if we had a permanent place to stay. Having an apartment means you don't have to worry about being booked out.","said":"maybe Sapa could be cool if we had a place a permanent place to stay there You know that that's another factor like if you have an apartment You know, you don't have to worry about","highlights":["booked out"]},{"speaker":"B","text":"But nothing beats the sea. It's much better when you have the sun and the water.","said":"But no, but nothing beats the sea Nothing with the series Nothing with the sea really you you like the sea so much, right? Well, of course, it's much better when you have like, you know, the sea and the Sun","highlights":["nothing beats"]},{"speaker":"A","text":"I wanted to ask about the YouTube video you recorded. Did you do it for your students or just for fun?"},{"speaker":"B","text":"I was experimenting with the format. I haven't seen anyone else writing an essay in real time and walking people through their thought process.","said":"aren't videos like that and like I haven't I haven't seen a single person like, you know Writing an essay in real time and like walking you through their thought process"},{"speaker":"A","text":"It's hard for the modern generation to watch such long videos. We have to be aware of people's attention spans.","highlights":["attention spans"]},{"speaker":"B","text":"I think it depends on the person. Some people might find it boring, but if you see the gears turning in their head, it's actually very interesting.","said":"till the end because like everything like if like the person is walking you through their thought process and writing like a very high level essay in real time and like you see how how gears in How wheels are turning in their head","highlights":["gears turning"]},{"speaker":"A","text":"You should use a better title and description. You just wrote 'I else part one,' which doesn't explain much.","said":"you need more write it more how to say it a great especially in description of your video in your description You just wrote like I else part one something like that"},{"speaker":"B","text":"I actually watched it until the end. I'm just being natural during the lessons; I'm not trying to show off.","said":"him That's why okay well, yeah because I am Not i'm not you know showing off. I'm just Like it's just Why am I being natural? you know I'm natural"},{"speaker":"A","text":"That's great. You don't need to play a role. However, I think this specific video format is doomed anyway.","said":"you don't need to play a row on the on your lessons or on your videos So just you know it makes sense But this format is doomed anyway, like no good","highlights":["play a role"]}]},{"title":"Video content, school life, and local troubles","lines":[{"speaker":"A","text":"I think we should change the format of the videos. Maybe make them shorter and use TikTok as the main platform instead of YouTube.","said":"I won't do videos like that In this in this exact manner Maybe we'll change something about them you know, maybe you need to make them not so long and just you know make paths and And use like Use tiktok as a main platform not youtube","highlights":["change the format"]},{"speaker":"B","text":"That makes sense. Short content is better, but you could still structure it with parts, like a 'part one' followed by a body paragraph.","said":"Yeah Yeah short content, but you know like part one and you think a little bit about body paragraph one","highlights":["short content"]},{"speaker":"A","text":"There are a million ways to make it watchable. Honestly, it's better to record something than nothing at all just because you're short on time.","said":"Well, there are a million ways how to make it watchable But again, like it's all a mixture of how much time you have Yeah, and it's better to record like any video at all than like, you know not to record anything because you don't have any time","highlights":["short on time"]},{"speaker":"B","text":"You're right. Your videos are almost two hours long, which is a lot of time to watch, especially if someone needs to rewatch a section.","said":"you know you're right because you know you have a lot of videos and we're really long like one hour almost two hours No, it just it just You need a lot of time to watch it and especially person who you know Maybe somebody needs to repeat some parts of video","highlights":["rewatch a section"]},{"speaker":"A","text":"By the way, do you always wear a tank top under your shirt? It's like a magic trick because you can take the t-shirt off and have a different one underneath.","said":"yeah, I'm impressed. You know, it's just a bit cold, you know It was like a magic trick Yeah magic trick really I can take off take on my t-shirt You can take it like take take it on back and then when you take it off like you you should have a different tank top","highlights":["magic trick"]},{"speaker":"B","text":"I am impressed! I have a t-shirt with 'autism' on it, which was a birthday present from my friend Elia.","said":"of your magic trick, you know, I have a t-shirt with autism on it And like a skeleton in fire in a flame with guns why does it say autism it was a present on my birthday from my friend elia","highlights":["birthday present"]},{"speaker":"A","text":"I saw another one on AliExpress that says 'autistic gay.' I think that's a more interesting way to represent your personality.","said":"I saw another one on aliexpress, you know, and instead of Autism there's autistic gay and I think it's a little bit more interesting way to represent your personality","highlights":["represent your personality"]},{"speaker":"B","text":"Yeah, you were lucky to be born gay and autistic! Anyway, it's been 27 days of the school year already. You go to school every day?","said":"Yeah, yeah gay like it's all looks like the entire package, you know Yeah, that's great Yeah you were so lucky that you were born gay, in autistic on top of yeah What wrong with Yeah, Let's Let me brush off my It's been 27 days of the school year has already","highlights":["school year"]},{"speaker":"A","text":"I do, but school is actually boring. I don't see a reason to go every day, but my parents think I should. I'd rather just have lessons on days that are comfortable for me.","said":"don't know. You know school now is actually boring t spent my my School break school","highlights":["check out"]},{"speaker":"B","text":"That's interesting. So, what time does your school day usually finish?","said":"what time does school finish? school you mean school year no Well, yeah, probably that question was misleading. What time does you finish school? Do you? School year you mean no finish school every day"},{"speaker":"A","text":"It depends on the number of lessons. Sometimes I get home around 3 PM after an eight-hour day.","said":"every day it depends of the number of lessons like we sometimes have sometimes we have eight lessons and If it is I I just returned home Probably 3 am 3 pm 3 pm 3 pm"},{"speaker":"B","text":"It's like a full work day, but you don't get paid for all that effort. It just drains your energy.","said":"Well, it it's almost like a full work day You know like people work from nine to five many people and you work from eight to four But I do not get getting paid for this, you know the sufferings. Yeah yeah, you first you don't get paid for that and second it","highlights":["drains your energy"]},{"speaker":"A","text":"Exactly. I feel like I have no power to do anything at school, but I can recharge once I get home.","said":"it eats your all your energy and all your resources You know actually interesting thing like when I at school I have no powers to do something just even walk in his heart but when I Return home and just like you know spending here 10 minutes I just recharge"},{"speaker":"B","text":"How do you recharge? I usually just drink coffee and start preparing for exams.","said":"How do I recharge after school Actually, I don't even know how it works like just I don't know probably even school with me Just you know Being at home just you know after school. I like to drink coffee and just starting prepare for Something, you know"},{"speaker":"A","text":"I find preparing for subjects like social science and English interesting because I feel like I'm doing something useful for my "said":"understand the same with school School is practically the same and if you think about that, like why why does the this whole institution exists? You mean what like everybody understands that it's ineffectively like not can you wait a second? Yeah Okay Yeah"}]},{"title":"Modern society and dopamine rewards","lines":[{"speaker":"A","text":"I think we should be able to drop some subjects after eighth grade, like maps. Why waste time on things that don't help our rating?","said":"I don't need maps. I'm sure about that and all this things why should I Waste my time. I'm sure to learn all those things just to get a rating in school","highlights":["waste time"]},{"speaker":"B","text":"The current system builds a habit of just following orders and doing what you're told without asking questions. It keeps society stable.","said":"That system builds a habit in you Like a person who goes to school, they just learn that they need to go somewhere. you know, it's a regular Basis Do"},{"speaker":"A","text":"I actually read Brave New World recently. It talks about a stable society where people don't ask questions because they're afraid of the alternative.","highlights":["afraid of the alternative"]},{"speaker":"B","text":"True. Otherwise, people might just become bandits or get addicted to cheap dopamine. Today, a huge part of society is like that.","said":"Or they just become like, you know Bandits, you know robes they start taking drugs They get addicted to a cheap dopamine. Well, at least this is This is","highlights":["cheap dopamine"]},{"speaker":"A","text":"Exactly. In Russia, people are drawn to those dopamine spikes. If there were a button to get money for doing nothing, most people would press it.","said":"especially in russia I think like we Don't want to do anything like especially cheap dopamine as you said, you know All these dopamine show spikes and things like that If we had to know I would say it a button if we press it"},{"speaker":"B","text":"It is human nature. TikTok didn't emerge out of nowhere; they studied how our brains are motivated by dopamine to achieve survival goals.","highlights":["out of nowhere"]},{"speaker":"A","text":"But is our brain designed for such short spikes? Usually, survival goals, like hunting, take hours of effort before you get rewarded with food.","said":"you need to survive you need to find food Usually that's a long-term goal you set like you learn like how to make tools that are help you hunt down animals"},{"speaker":"B","text":"Right, but now you can just call Yandex delivery and get food in 30 minutes. It represents a lot about modern society.","said":"today for example, you can get this food and like in 30 minutes You just like, you know, you just call yandex delivery and they they bring your food","highlights":["represents a lot"]},{"speaker":"A","text":"In the West, delivery is affordable for everyone. In Russia, even poor people can get more food now than people a hundred years ago did.","highlights":["affordable for everyone"]},{"speaker":"B","text":"That's progress, but your reward span is shorter. You can get a dopamine burst in five minutes just by buying a bag of Lay's.","said":"progress, but again like your Your reward span is shorter and now you're rewarded not in six hours, but in 30 minutes Or like or you can just like, you know, go buy a pack of lays","highlights":["dopamine burst"]},{"speaker":"A","text":"The same applies to entertainment. You don't have to wait a year for a circus or a fair anymore; it's all delivered to your phone.","said":"know you have entertainment delivered, right in your phone You don't need to wait a year you like you're just picking up your phone and you spend three seconds to open tiktok","highlights":["delivered to your phone"]},{"speaker":"B","text":"And those videos are optimized for you. TikTok learns your preferences, like how it knows I enjoy chess and certain games.","said":"Like Actually, yeah. Yeah tiktok learns about you. It's like for example about me. It knows it knows that I like chess","highlights":["optimized for you"]}]},{"title":"Algorithms, Addiction, and Logistics Optimization","lines":[{"speaker":"A","text":"I love how algorithms feed me content. If I stop watching chess videos for a bit, the feed makes them feel new again because our brains crave novelty.","said":"of other stuff and it just creates an algorithm when it feeds me all this stuff in spans in time periods Long enough that I forget about them that it's it feels new","highlights":["crave novelty"]},{"speaker":"B","text":"Exactly. If you're interested in something, like building games with AI, the algorithm notices you watch every video to the end and keeps pushing more of that content.","said":"if i'm really interested in for example creating games with ai now It will just like you know show me a like if i'm interested now if if the algorithm sees that i'm interested in every video Every video I see I watch it till the end"},{"speaker":"A","text":"It's so easy to get hooked. Even the smartest person can fall for it because the content is designed to trigger those dopamine circuits in your head.","said":"to it nobody who you are Even you're even if you're the smartest person alive the algorithm will find content That will create those dopamine circuits in your head","highlights":["get hooked"]},{"speaker":"B","text":"I don't think it's about people being stupid. It's just that the content is inherently addictive, much like how someone would become addicted to heroin if it were forced on them.","said":"can get addicted to that because the stuff is addictive the same thing with heroin you know like if if Somebody will force heroin into your body every day. You will get addicted to it"},{"speaker":"A","text":"That's a fair point. We have so many different types of addictions daily. Even learning English or coding can trigger those same brain mechanisms to keep you engaged."},{"speaker":"B","text":"I remember you showed me how to use ChatGPT with Excel. I tried it, but maybe I should use it for my English studies instead.","said":"you remember last time when you showed me a lot of things with chargpt with excel. Yeah after that actually I tried to do something with chargpt, you know But I don't know Maybe I need to do something with english"},{"speaker":"A","text":"You can connect it to the internet to check information. Actually, I'm currently working on an app to make it easier to watch videos and read books.","said":"things like that, of course. Yeah, sure Yeah I'm actually working on the app that will make it easy to watch videos that will make it easy to read books"},{"speaker":"B","text":"What's this other project you're working on? The one you've been meaning to do for about five years?","said":"i'm doing another project which is which is me basically It's like, you know, it's a closure It's a you think that I i've been meaning to do for three years for even five years"},{"speaker":"A","text":"Back when I worked for a bottled water company, I had to manually calculate delivery routes every time something changed. It was a real headache.","highlights":["real headache"]},{"speaker":"B","text":"I see your screen. Is Claude running some tests right now?","said":"do you see my screen no, what about yes now, yeah My computer so oh, yeah, it's because it's because it's testing it a lot Yeah, because claud is doing a lot of tests"},{"speaker":"A","text":"Yeah, it's a simulation. Imagine having one car that holds 40 bottles and one person working from 9 to 6. Now, imagine getting 20 random orders with specific time windows.","said":"Okay, imagine you have one car One card it can take 40 bottles and that or like even you have a person who is working on this car from 9 to 6 PM. Yeah, and now you you start like, you know getting orders. Let's say"},{"speaker":"B","text":"So your job was to figure out the best way to deliver all those orders within those specific time frames?","said":"how this person should Actually deliver all those orders Is it real orders right now? No, no, that's a simulation"},{"speaker":"A","text":"Exactly. But an algorithm is much smarter than a human; it can calculate a million combinations per second. It finds the optimal route in just a few seconds.","said":"an algorithm is much smarter than you are And it can calculate like, you know a million combinations per second Now let's let's give it 20 seconds, okay"},{"speaker":"B","text":"Why don't we use those kinds of routes more often?","said":"why doesn't our build the routes there"},{"speaker":"A","text":"Well, if a customer calls and changes their time window suddenly, it's a nightmare to recalculate manually. The algorithm handles that instantly by finding the shortest route."}]},{"title":"Optimizing delivery routes with algorithms","lines":[{"speaker":"A","text":"The algorithm finds the shortest route while accounting for specific time windows. For example, if a customer only accepts a delivery at 1 p.m., the system has to figure out how to fit that into the schedule."},{"speaker":"B","text":"Exactly. In my job, the algorithm does all of that for me now. I don't have to think about the logistics of how to deliver a package at 1:21 p.m. anymore.","said":"now algorithm just does it instead of me I don't have to think about that. Like it found the way how to deliver this at 13 21","highlights":["logistics of"]},{"speaker":"A","text":"What happens if you add a second vehicle? Does the code need to be changed? It seems like it's not working properly right now.","said":"Yeah With two vehicles If you add for example a second vehicle The fuck Okay, yes, it probably does some changes to the code right now, that's why it doesn't"},{"speaker":"B","text":"The core idea is to fully solve the delivery system. It's not just for our company; it works for any city in the world.","said":"the idea is like that. The idea is that it like fully solves the delivery system it works only for us, right? No, it works for any city in the world","highlights":["core idea"]},{"speaker":"A","text":"So if you had the script right now, you wouldn't have to spend hours trying to figure out the optimal route. You'd just press a button to run it.","said":"I wouldn't have to spend hours, you know, like trying to figure out the optimal route oh, and that's great and so you just Just and what did you do like you just","highlights":["figure out"]},{"speaker":"B","text":"Right. You just change the scenario and hit run. The program recalculates everything, almost like a video game.","said":"you just like change the scenario press the run button and like the program recalculates everything You know just like a video game","highlights":["hit run"]},{"speaker":"A","text":"I'm a bit disappointed it's not working yet, but I believe it's because the code is being refactored. It's a cool concept though.","said":"i'm actually pretty disappointed that it doesn't it doesn't work, but it's again, it's because I believe what it works I believe yeah because because it's being refactored"},{"speaker":"B","text":"Without the algorithm, I'd be overwhelmed. I'd have to answer constant calls and text drivers to tell them that addresses are no longer available. It would be a mess."},{"speaker":"A","text":"Did you build this yourself? Did you use AI?","said":"you did it By yourself, right? Yeah Did you use ai"},{"speaker":"B","text":"No, this was five years ago. These algorithms existed long before AI; I just didn't know how to program them back then.","said":"we have delivery now Well, I well these algorithms existed long before ai I just didn't didn't know about them and I didn't know how to make a program Using those algorithms"},{"speaker":"A","text":"It just shows how much crazy stuff you can build today using AI. Basically, any idea in your head can be made to work.","said":"it just illustrates how Like what kind of crazy shit you can build? Now today using ai That's basically any idea that you have in your head you can you know make it work"},{"speaker":"B","text":"I thought Wildburst had a system like that. They're a big company, so they definitely have a way to optimize their deliveries."},{"speaker":"A","text":"I thought couriers should have this too. But you have a point; it's just a point on a map and a destination.","said":"I thought actually that couriers should have this too No, actually you just you know, you have a point on your map and a point Where it should be delivered"},{"speaker":"B","text":"If you can't do it on Friday, just text me. Also, I didn't use the same map as your video because I didn't want to copy-paste. I found a different one online."},{"speaker":"A","text":"Great. Try to describe it in the same way. We'll take a look at it next week. Have a good day!","said":"Try to describe it in the same way. Great. Great we'll take a look at that. Yeah, okay Okay. See you see you next week. Yeah. Bye. Have a good"}]}]};
