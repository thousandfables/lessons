<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;

        const LESSON = {"version":4,"meta":{"title":"From Vietnam to Tech Innovation","topics":["Traveling in Vietnam","YouTube videos and attention spans","School schedules and energy levels","The inefficiency of the school system","Developing a delivery optimization app"],"date":"27 September 2026","time":"13:04"},"topics":[{"title":"Traveling in Vietnam","at":0,"time":0.0},{"title":"YouTube videos and attention spans","at":677,"time":354.0},{"title":"School schedules and energy levels","at":3463,"time":1610.5},{"title":"The inefficiency of the school system","at":4166,"time":1956.8},{"title":"Developing a delivery optimization app","at":6364,"time":2896.7}],"mistakes":[{"severity":"high","label":"Sentence structure","rule":"Do not use the auxiliary verb 'is' or 'are' before a main verb.","examples":[{"quote":"it's very much depends on","fix":"It very much depends on","context":"This feeling of freshness vanishes by the end of the second week. It's very much depends on how much time you spend in one place.","context_fix":"This feeling of freshness vanishes by the end of the second week. It very much depends on how much time you spend in one place.","why":"When using a main verb like 'depends' in the present simple, you don't need the auxiliary verb 'is'.","time":241.9,"at":414,"topic":0,"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/023490-024547.webm","at":235.1,"dur":10.57}},{"quote":"it's all looks like the entire package","fix":"It all looks like the entire package","context":"Instead of autism there's autistic gay and I think it's a little bit more interesting way to represent your personality. It's all looks like the entire package.","context_fix":"Instead of autism there's autistic gay and I think it's a little bit more interesting way to represent your personality. It all looks like the entire package.","why":"You don't need 'is' because 'looks' is the main verb. 'It looks' is the correct structure.","time":856.7,"at":1910,"topic":1,"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/084410-086113.webm","at":844.3,"dur":17.03}},{"quote":"does the this whole institution exists","fix":"does this whole institution exist","context":"School is practically the same, and if you think about that, why does the this whole institution exists?","context_fix":"School is practically the same, and if you think about that, why does this whole institution exist?","why":"Remove 'the' before 'this'. Also, use 'exist' because 'does' already indicates the third-person singular form.","time":1962.3,"at":4183,"topic":3,"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/195694-196519.webm","at":1957.0,"dur":8.25}},{"quote":"people who are just follow orders","fix":"people who just follow orders","context":"The society is stable if it has a lot of people who are just follow orders and don't ask questions and are willing to sacrifice their time.","context_fix":"The society is stable if it has a lot of people who just follow orders and don't ask questions and are willing to sacrifice their time.","why":"You don't need 'are' before 'follow.' The relative pronoun 'who' is followed directly by the verb 'follow' to describe the people.","time":2209.4,"at":4709,"topic":3,"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/220384-222041.webm","at":2204.0,"dur":16.57}},{"quote":"tools that are help you hunt","fix":"tools that help you hunt","context":"You need to find food. Usually that's a long-term goal you set, like you learn how to make tools that are help you hunt down animals.","context_fix":"You need to find food. Usually that's a long-term goal you set, like you learn how to make tools that help you hunt down animals.","why":"When using 'that' as a relative pronoun followed by a verb, you don't need 'are' before the main verb 'help'.","time":2404.7,"at":5143,"topic":3,"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/239962-241143.webm","at":2399.7,"dur":11.81}},{"quote" for the project's failure.","pattern":"a big share of + [abstract noun]"},{"sentence":"A big share of the population lives in urban areas.","pattern":"a big share of + [countable noun (plural)]"}],"countable":[{"meaning":"A large percentage or a significant portion of a group or total.","example":"A big share of society is like that; if people don't work, they start to degrade in many ways.","lesson":true}],"uncountable":[],"more_examples":["A big share of the budget was spent on marketing last year.","A big share of the students expressed concern about the new exam format.","A big share of the electricity used in the city comes from solar power."],"synonyms":["a large portion of","a significant part of","a large chunk of"],"antonyms":["a small share of","a tiny fraction of","a small portion of"],"gap":{"sentence":"Even though the company is small, _____ the total sales comes from just one loyal customer.","answer":"a big share of","options":["a big share of","a few of","a lack of","a shortage of"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/228112-228470.webm","at":2281.2,"dur":3.58}},{"term":"emerge out of nowhere","pos":"expression","definition":"to appear suddenly or develop without a clear, obvious beginning or prior explanation.","time":2336.8,"lesson":"Of course, TikTok did not emerge out of nowhere. They conducted a lot of research and studies to understand how it works.","examples":[{"sentence":"The new trend didn't just emerge out of nowhere; it was built over years of marketing.","pattern":"subject + didn't just emerge out of nowhere"},{"sentence":"A huge opportunity emerged out of nowhere during the meeting.","pattern":"noun + emerged out of nowhere"},{"sentence":"The problem emerged out of nowhere, leaving the team with no time to react.","pattern":""},{"sentence":"Success rarely emerges out of nowhere; it usually requires a lot of hard work.","pattern":""}],"more_examples":["A mysterious figure emerged out of nowhere and vanished into the shadows.","I was walking alone in the park when a stray dog emerged out of nowhere.","The demand for remote work emerged out of nowhere during the global crisis."],"synonyms":["pop up","materialize suddenly","spring up","come out of nowhere","arise unexpectedly"],"antonyms":["develop gradually","evolve slowly","appear expectedly","be planned in advance"],"gap":{"sentence":"I was enjoying a peaceful walk in the park when a huge spider suddenly _____, making me jump.","answer":"emerged out of nowhere","options":["emerged out of nowhere","stayed very still","moved slowly","planned ahead"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/233808-234132.webm","at":2338.3,"dur":3.24}},{"term":"bring food to the table","pos":"expression","definition":"To successfully provide food or resources for a group or a household.","time":2415.8,"lesson":"It can take six hours before you actually kill an animal and bring food to the table. That is a long span, but at the end of it, you are rewarded.","examples":[{"sentence":"He works two jobs just to bring food to the table for his children.","pattern":"bring food to the table (for someone)"},{"sentence":"In a survival situation, the main priority is how to bring food to the table.","pattern":""},{"sentence":"She is the primary breadwinner who brings food to the table every month.","pattern":""}],"more_examples":["The company is struggling to bring food to the table for its employees.","They moved to the countryside to start a farm and bring food to the table.","It's not just about the money; it's about making sure we can bring food to the table."],"synonyms":["provide for the family","support the household"],"antonyms":[],"gap":{"sentence":"Even though he loves his art, he had to get a steady office job to _____.","answer":"bring food to the table","options":["bring food to the table","make a lot of noise","take a long nap","watch a movie"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/241574-242145.webm","at":2415.8,"dur":5.71}},{"term":"execution","pos":"noun","definition":"The official act of carrying out a death sentence.","time":2605.7,"lesson":"In the past, you might have had to wait a month for an execution. Would you use the word 'execution' in that context?","examples":[{"sentence":"The prisoner was led to the building for his execution.","pattern":""},{"sentence":"The state carried out the execution at dawn.","pattern":""},{"sentence":"The execution of the death penalty is a controversial issue.","pattern":"The execution of + noun"},{"sentence":"They were scheduled for execution tomorrow morning.","pattern":""}],"countable":[{"meaning":"The official act of carrying out a death sentence.","example":"In the past, you might have had to wait a month for an execution.","lesson":true}],"uncountable":[],"more_examples":["The condemned man was taken to the prison for his execution.","The government announced that the execution would take place by hanging.","Public executions were common in many countries centuries ago."],"synonyms":["capital punishment","putting to death"],"antonyms":["commutation","pardon","clemency"],"gap":{"sentence":"The government faced heavy protests after the scheduled _____ of the convicted murderer.","answer":"execution","options":["execution","preparation","presentation","construction"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/260560-260917.webm","at":2605.8,"dur":3.57}},{"term":"get addicted to","pos":"expression","definition":"To develop a strong need or habit of doing something, often something harmful or addictive.","time":2729.9,"lesson":"The algorithm will feed you more videos like that. In this way, it is very easy to get addicted to it.","examples":[{"sentence":"He got addicted to social media and started checking his phone every five minutes.","pattern":"get addicted to + noun"},{"sentence":"It's easy to get addicted to sugary snacks if you eat them every day.","pattern":"get addicted to + noun phrase"},{"sentence":"She realized she was getting addicted to online shopping.","pattern":"getting addicted to (progressive form)"},{"sentence":"The game is designed so that players quickly get addicted to it.","pattern":"get addicted to + pronoun"}],"more_examples":["He warned his son not to get addicted to video games.","Many people get addicted to caffeine during busy work weeks.","It's easy to get addicted to watching endless reality TV shows."],"synonyms":["become hooked on","become dependent on","become obsessed with","be hooked on"],"antonyms":[],"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/273012-273546.webm","at":2730.2,"dur":5.34}},{"term":"no way around","pos":"expression","definition":"a situation that cannot be avoided or escaped; something that is inevitable.","time":2791.4,"lesson":"If someone were to force heroin into your body every day, you would get addicted to it. There is no way around that.","examples":[{"sentence":"The company is facing a massive debt, and there is no way around it.","pattern":"there is no way around + it"},{"sentence":"We have to pay the fine; there's simply no way around it.","pattern":"there's simply no way around it"},{"sentence":"The government says there is no way around the new tax laws.","pattern":"no way around + noun phrase"}],"more_examples":["I'm sorry, but if you want to get the promotion, there is no way around the extra training.","The construction blocked the main road, so there was no way around it for the commuters.","We need to address the safety issues now; there is no way around it if we want to stay open."],"synonyms":["inevitable","unavoidable","no escape","no alternative"],"antonyms":["avoidable","optional","evadable"],"gap":{"sentence":"The project deadline is tomorrow, so there is _____ finishing the remaining tasks tonight.","answer":"no way around","options":["no way around","no reason for","no room for","no excuse for"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/278898-279365.webm","at":2789.1,"dur":4.67}},{"term":"time window","pos":"noun phrase","definition":"A specific period of time during which a task must be completed or a delivery made.","time":3076.7,"lesson":"Every dot on the map represents a person calling for water. These customers have specific time windows; for example, one person can only receive a delivery between 3:00 and 5:00 PM.","examples":[{"sentence":"The courier must deliver the package within the designated time window.","pattern":"within the [adjective] time window"},{"sentence":"We need to find a time window that works for both the client and the technician.","pattern":"find a time window that works for"},{"sentence":"The surgery was scheduled during a narrow time window when the equipment was available.","pattern":"during a narrow time window"},{"sentence":"Can you give me a time window for when the repair person will arrive?","pattern":"give me a time window for [noun/gerund]"}],"countable":[{"meaning":"A specific period of time during which a task must be completed or a delivery made.","example":"These customers have specific time windows; for example, one person can only receive a delivery between 3:00 and 5:00 PM.","lesson":true},{"meaning":"A period of time during which an opportunity exists","example":"There is a small time window for us to react to the news."}],"uncountable":[],"more_examples":["The airline offered a two-hour time window for passengers to check in.","We have a very tight time window to finish the construction before the storm hits.","Please let me know your preferred time window for the initial consultation."],"synonyms":["time slot","time frame","period","window of opportunity","scheduled time"],"antonyms":[],"gap":{"sentence":"The construction crew can only work during a specific _____ because the noise restrictions are very strict.","answer":"time window","options":["time window","deadline","location","method"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/307698-308065.webm","at":3077.1,"dur":3.67}},{"term":"be a headache","pos":"expression","definition":"To cause a lot of difficulty, worry, or complicated problems for someone.","time":3333.7,"lesson":"It would be such a headache because I would have to think about whether going to one place earlier would make me late for another.","examples":[{"sentence":"Dealing with all the paperwork for the visa is a real headache.","pattern":"a real headache"},{"sentence":"The constant noise from the construction site is becoming a headache.","pattern":"becoming a headache"},{"sentence":"Changing the flight plans at the last minute is such a headache.","pattern":"such a headache"}],"more_examples":["Trying to coordinate schedules for ten different people is a real headache.","The broken radiator has been a headache for the maintenance team all week."],"synonyms":["be a pain","be a nuisance","be a hassle","be a burden","be a struggle","be a chore","be a trial"],"antonyms":["be a breeze"],"gap":{"sentence":"Trying to coordinate the schedules of five different people for a meeting is always _____.","answer":"such a headache","options":["such a headache","so easy","very simple","quite smooth"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/333372-333618.webm","at":3333.9,"dur":2.46}},{"term":"take care of","pos":"phrasal verb","definition":"To handle a task, solve a problem, or manage a situation automatically or systematically.","time":3348.7,"lesson":"I would have to think about the timing and worry about being late. But now, the algorithm just takes care of it.","examples":[{"sentence":"Don't worry about the reservation; I'll take care of it.","pattern":"take care of + object"},{"sentence":"The new software takes care of the data entry automatically.","pattern":"subject + takes care of + task"},{"sentence":"Could you take care of the bill while I go grab our coats?","pattern":"take care of + noun (responsibility)"},{"sentence":"The manager will take care of your complaint as soon as possible.","pattern":"take care of + abstract noun (problem/complaint)"}],"more_examples":["The smart thermostat takes care of the temperature throughout the night.","Our new security system takes care of monitoring the perimeter.","The automated system takes care of the inventory updates every evening."],"synonyms":["handle","manage","deal with","process","oversee","address","attend to","sort out"],"antonyms":["ignore","neglect","overlook"],"gap":{"sentence":"Since the system is fully automated, it will _____ all the scheduling for our team.","answer":"take care of","options":["take care of","forget","delay","avoid"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/334668-335154.webm","at":3346.8,"dur":4.86}},{"term":"figure out","pos":"phrasal verb","definition":"to find a solution to a problem or understand how something works through thinking.","time":3520.2,"lesson":"I wouldn't have to do anything because the algorithm would handle it. I wouldn't have to spend hours trying to figure out the optimal route.","examples":[{"sentence":"I can't figure out how to open this software.","pattern":"figure out + how + to-infinitive"},{"sentence":"We need to figure out a way to reduce our monthly expenses.","pattern":"figure out + a way + to-infinitive"},{"sentence":"Did you ever figure out what the problem was?","pattern":"figure out + [question word] + subject + verb"},{"sentence":"It took me a long time to figure out the math problem.","pattern":"take + time + to figure out"}],"more_examples":["I'm trying to figure out why the car won't start.","It took the engineers months to figure out the source of the leak.","Give me a minute to figure out where I parked my bike."],"synonyms":["solve","understand","work out","deduce","decipher","make sense of","crack","unravel"],"antonyms":["misunderstand"],"gap":{"sentence":"I've been staring at these IKEA instructions for an hour, but I still can't _____ how to assemble the bookshelf.","answer":"figure out","options":["figure out","ignore","predict","announce"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/352064-352563.webm","at":3520.7,"dur":4.99}}],"dialogues":[{"title":"Travel experiences and mosaic art","lines":[{"speaker":"A","text":"I washed my hair, but it looks much better when it's a bit greasy. It gives off a cool surfer vibe.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/000326-001512.webm","at":3.4,"dur":11.86}]},{"speaker":"B","text":"True, but now you look like Kurt Cobain! By the way, is that a painting on the wall or a mosaic?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/003242-004687.webm","at":32.5,"dur":14.45},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/006486-006815.webm","at":65.0,"dur":3.29}]},{"speaker":"A","text":"It is a mosaic, but I honestly don't have enough time to finish it because there are so many pieces to place.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/006658-008330.webm","at":66.7,"dur":16.72}]},{"speaker":"B","text":"It looks finished from a distance, but it's actually quite pale. So, where are you staying now? Have you moved?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/014288-015680.webm","at":143.0,"dur":13.92}]},{"speaker":"A","text":"I've been all over Vietnam, but I'm starting my second round now. Do you have a favorite place where you feel comfortable?","highlights":["all over"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/019120-019934.webm","at":191.3,"dur":8.14},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/020830-021332.webm","at":208.4,"dur":5.02}]},{"speaker":"B","text":"It depends on many factors. That feeling of freshness usually vanishes by the end of the second week.","highlights":["depends on"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/022182-023576.webm","at":221.9,"dur":13.94}]},{"speaker":"A","text":"Sapa would be cool if we had a permanent place to stay. It's a hassle moving around when places are fully booked.","highlights":["permanent place"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/027222-027837.webm","at":272.4,"dur":6.15},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/028338-029160.webm","at":283.5,"dur":8.22}]},{"speaker":"B","text":"Nothing beats the sea, though. It's much better when you have the sun and the waves.","highlights":["nothing beats"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/030856-032223.webm","at":308.8,"dur":13.67}]},{"speaker":"A","text":"I tried swimming in the river last time, but the water was a bit dirty because it hadn't been cleaned up.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/033850-034982.webm","at":338.7,"dur":11.32}]},{"speaker":"B","text":"I wanted to ask about the YouTube videos you used to record. Were you doing those for your students?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/035554-037006.webm","at":355.6,"dur":14.52}]}],"time":3.4,"topic":0},{"title":"The challenges of long-form educational videos","lines":[{"speaker":"A","text":"I haven't seen anyone on YouTube actually write an essay in real time while walking the viewer through their thought process.","highlights":["thought process"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/038746-039541.webm","at":387.6,"dur":7.95}]},{"speaker":"B","text":"I know it's interesting, but because it's unedited, it's not very dynamic. You could trim it down to 40 minutes of just your commentary.","highlights":["trim it down"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/041814-042746.webm","at":418.3,"dur":9.32}]},{"speaker":"A","text":"We have to be mindful of attention spans. It's not that people are stupid; they just can't process complex information for two hours straight.","highlights":["be mindful of"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/045964-046710.webm","at":459.7,"dur":7.46},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/047250-047578.webm","at":472.6,"dur":3.28}]},{"speaker":"B","text":"It's a scientific fact. If nothing happens for 30 seconds, the brain just drops its focus and starts thinking about other things.","highlights":["drops its focus"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/048600-049548.webm","at":486.2,"dur":9.48}]},{"speaker":"A","text":"I think it depends on the person. If I saw this two years ago, I would have watched it until the end to see how the gears were turning.","highlights":["how the gears were turning"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/052814-054242.webm","at":528.2,"dur":14.28}]},{"speaker":"B","text":"Even if YouTube promoted it, you won't find many videos like this. You need to be more specific in your titles and descriptions.","highlights":["be more specific"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/055752-056330.webm","at":557.7,"dur":5.78},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/056890-057850.webm","at":569.0,"dur":9.6}]},{"speaker":"A","text":"I'm just trying to be natural. I'm not trying to show off; I just want to be authentic.","highlights":["show off"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/065202-066403.webm","at":652.2,"dur":12.01}]},{"speaker":"B","text":"That's actually great. You don't need to play a role. But honestly, I think this format is doomed anyway.","highlights":["play a role"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/066904-067664.webm","at":669.1,"dur":7.6}]}],"time":387.6,"topic":1},{"title":"Content creation, school life, and personal style","lines":[{"speaker":"A","text":"I probably won't make videos in this exact manner anymore. We might need to make them shorter and use TikTok as the main platform.","highlights":["in this exact manner"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/068406-069954.webm","at":684.2,"dur":15.48}]},{"speaker":"B","text":"Yeah, short content is good. You could also break them into parts, like a 'part one' and then a separate video for the next paragraph.","highlights":["break them into"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/071654-073068.webm","at":716.6,"dur":14.14}]},{"speaker":"A","text":"There are a million ways to make it watchable, but it really depends on how much time you have. It's better to record something than nothing.","highlights":["depends on"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/073326-074957.webm","at":733.5,"dur":16.31}]},{"speaker":"B","text":"You're right. Your videos are almost two hours long, and people need a lot of time to watch them, especially if they need to repeat parts.","highlights":["a lot of time"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/074986-076396.webm","at":750.0,"dur":14.1}]},{"speaker":"A","text":"Do you always wear a tank top under your shirt? I did it for the first time today to impress you. Are you impressed?","highlights":["for the first time"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/077574-079064.webm","at":775.8,"dur":14.9}]},{"speaker":"B","text":"I am! It was like a magic trick. You can take off your t-shirt and have a different tank top underneath.","highlights":["magic trick"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/079225-080703.webm","at":792.4,"dur":14.78}]},{"speaker":"A","text":"I have a t-shirt with 'autism' on it. It was a birthday present from my friend Elia.","highlights":["birthday present"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/081666-083005.webm","at":816.9,"dur":13.39},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/083202-083576.webm","at":832.2,"dur":3.74}]},{"speaker":"B","text":"I saw one on AliExpress that said 'autistic gay.' I think that's a more interesting way to represent your personality.","highlights":["represent your personality"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/083890-085298.webm","at":839.1,"dur":14.08}]},{"speaker":"A","text":"So, 27 days of the school year have already passed. You're in 11th grade and you go to school every day?","highlights":["already passed"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/089238-090679.webm","at":892.6,"dur":14.41}]},{"speaker":"B","text":"Honestly, school is boring now. I don't see a reason to go every day, but my parents think I should. I'm just trying to prepare.","highlights":["don't see a reason"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/092162-093296.webm","at":921.7,"dur":11.34}]},{"speaker":"A","text":"I have eight lessons in one day. I have no energy left to do my own business after that.","highlights":["no energy left"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/095482-096936.webm","at":955.0,"dur":14.54}]},{"speaker":"B","text":"There are no toilets in our school. Every day someone starts taking a shit in them, and we never know who it is.","highlights":["every day"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/098780-100212.webm","at":987.9,"dur":14.32}]}],"time":684.2,"topic":1},{"title":"School toilets and life in Kushevskoye","lines":[{"speaker":"A","text":"Imagine having to go to the bathroom at school every single day. It feels like such a challenge.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/103456-103923.webm","at":1034.7,"dur":4.67}]},{"speaker":"B","text":"I mean, if someone does it every day, do you actually respect them for that?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/104008-104767.webm","at":1040.2,"dur":7.59}]},{"speaker":"A","text":"Not really. But what if they just have a natural body rhythm? They're just healthy people.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/105210-106014.webm","at":1052.2,"dur":8.04}]},{"speaker":"B","text":"I do it every day before school, but you can't really force your body to do it. I wish people would do it at home because it's more comfortable.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/107206-108614.webm","at":1072.2,"dur":14.08}]},{"speaker":"A","text":"The school toilets were a total nightmare. There were no doors, so you couldn't even say if a stall was occupied.","highlights":["total nightmare"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/110544-111667.webm","at":1105.6,"dur":11.23}]},{"speaker":"B","text":"You could leave a message on the wall. Maybe that person could become your pen pal in the future.","highlights":["pen pal"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/117138-118016.webm","at":1171.5,"dur":8.78}]},{"speaker":"A","text":"School is so boring. Most of my friends have left, and I really miss Astrakhan, but it's a long drive to get there now.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/119466-119916.webm","at":1194.8,"dur":4.5},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/121608-122556.webm","at":1216.2,"dur":9.48}]},{"speaker":"B","text":"I feel like I'm slowly but surely fading away. I feel like I might die in a few months.","highlights":["slowly but surely"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/124922-126341.webm","at":1249.3,"dur":14.19}]},{"speaker":"A","text":"Kushevskoye feels like a big hell to me. It's like an anti-utopia.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/129976-130815.webm","at":1299.9,"dur":8.39}]},{"speaker":"B","text":"My friend Kirill actually had his jaw broken because some people started a conflict with him over the length of his hair.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/131132-131868.webm","at":1311.4,"dur":7.36},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/133834-134704.webm","at":1338.4,"dur":8.7}]}],"time":1034.7,"topic":1},{"title":"Crime stories and school life","lines":[{"speaker":"A","text":"Did you tell me about that story four months ago?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/137748-138329.webm","at":1377.7,"dur":5.81}]},{"speaker":"B","text":"I don't recall, but it's actually a pretty messed up and scary story.","highlights":["messed up"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/138333-139348.webm","at":1383.4,"dur":10.15}]},{"speaker":"A","text":"Yeah, Kirill really had some balls to do that. He basically gouged the other guy's eye out.","highlights":["had some balls"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/139764-141304.webm","at":1397.7,"dur":15.4}]},{"speaker":"B","text":"Well, if someone hits you, you should hit back. It's logical. Even Putin says you need to punch first.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/141684-143275.webm","at":1417.0,"dur":15.91}]},{"speaker":"A","text":"You look a bit like Putin right now because of that bold expression.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/144378-145746.webm","at":1444.0,"dur":13.68}]},{"speaker":"B","text":"I'd rather you call an ambulance than mention Picheneggis! Anyway, what happened with the guy who cracked his jaw?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/146034-147596.webm","at":1460.5,"dur":15.62}]},{"speaker":"A","text":"He's going to jail for a few years. At least we have some justice; it's not like Sin City.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/150594-152274.webm","at":1506.0,"dur":16.8}]},{"speaker":"B","text":"I'm visiting Moscow again in a month to check out some universities during my school break.","highlights":["check out"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/155562-156927.webm","at":1555.7,"dur":13.65}]},{"speaker":"A","text":"What time does your school day usually finish?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/161044-162478.webm","at":1610.6,"dur":14.34}]},{"speaker":"B","text":"It depends on the number of lessons. Sometimes I get home at 3 p.m. after eight classes.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/163836-165155.webm","at":1638.6,"dur":13.19},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/165366-166076.webm","at":1653.9,"dur":7.1}]},{"speaker":"A","text":"That's like a full work day, but you don't get paid for the struggle.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/166458-167774.webm","at":1664.7,"dur":13.16}]},{"speaker":"B","text":"School drains all my energy, but I can recharge after 10 minutes at home. How do you recharge?","highlights":["drains all my energy"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/168660-170180.webm","at":1686.7,"dur":15.2}]}],"time":1377.7,"topic":1},{"title":"The inefficiency of school and work systems","lines":[{"speaker":"A","text":"I'm not really sure how I recharge after school, but I usually drink some coffee and start preparing for my exams.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/174096-175268.webm","at":1741.1,"dur":11.72}]},{"speaker":"A","text":"Studying subjects like social science and English is interesting for me, so it doesn't feel like a chore.","highlights":["feel like"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/175572-176612.webm","at":1755.8,"dur":10.4}]},{"speaker":"A","text":"When I have six math lessons a week, I don't feel like I'm doing anything useful for my future.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/178088-179529.webm","at":1781.0,"dur":14.41}]},{"speaker":"B","text":"You have to come to terms with the fact that you're often just wasting time at school.","highlights":["come to terms with"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/180116-181545.webm","at":1801.3,"dur":14.29}]},{"speaker":"B","text":"It's the same with work. Five years ago, my job as a sales manager drained all my energy.","highlights":["drained all my energy"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/184028-184773.webm","at":1840.4,"dur":7.45},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/186256-186628.webm","at":1862.8,"dur":3.72}]},{"speaker":"B","text":"It's interesting how society builds systems that benefit the owners much more than the workers.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/187736-187967.webm","at":1877.5,"dur":2.31},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/188164-189510.webm","at":1881.8,"dur":13.46}]},{"speaker":"A","text":"I agree. School is practically the same. Why does this whole institution even exist?","highlights":["practically the same"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/195500-196519.webm","at":1955.1,"dur":10.19}]},{"speaker":"B","text":"Everyone knows the system is ineffective, even the people in the ministry who decide how schools operate.","highlights":["decide how"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/198516-199704.webm","at":1985.3,"dur":11.88}]},{"speaker":"B","text":"Nothing changes because nobody protests the system, especially in Russia.","highlights":["protests the system"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/206504-207770.webm","at":2065.1,"dur":12.66}]},{"speaker":"A","text":"It's a plus for the owner of the system, but since nobody owns it, nobody really benefits.","highlights":["plus for"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/207778-208512.webm","at":2077.9,"dur":7.34}]}],"time":1741.1,"topic":2},{"title":"Education, Social Order, and Dopamine","lines":[{"speaker":"A","text":"You don't get paid for going to school, but nobody else gets paid for you being there either.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/208500-209468.webm","at":2085.1,"dur":9.68}]},{"speaker":"B","text":"I think after eighth grade, you should be able to choose what you need to learn and drop the rest.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/210768-212175.webm","at":2107.8,"dur":14.07}]},{"speaker":"A","text":"I don't see the point of wasting time on subjects like geography just to get a grade.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/212583-213980.webm","at":2126.0,"dur":13.97}]},{"speaker":"B","text":"The current system is designed to build a habit of following orders and working for a result expressed in numbers.","highlights":["build a habit"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/216090-217513.webm","at":2161.0,"dur":14.23}]},{"speaker":"A","text":"This model benefits the people in charge because a stable society needs people who follow orders without asking questions.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/219758-221247.webm","at":2197.7,"dur":14.89},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/221436-221722.webm","at":2214.6,"dur":2.86}]},{"speaker":"B","text":"I actually read Brave New World recently, and it mentions how people prefer stability over the alternative of being rebels.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/222816-224174.webm","at":2228.3,"dur":13.58}]},{"speaker":"A","text":"A lot of people just want to follow orders or they end up becoming bandits or getting addicted to cheap dopamine.","highlights":["cheap dopamine"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/225816-227252.webm","at":2258.3,"dur":14.36}]},{"speaker":"B","text":"That's the main issue today. If there were a button that gave us money for doing nothing, most people would press it.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/229106-230602.webm","at":2291.2,"dur":14.96}]},{"speaker":"A","text":"It's human nature. TikTok didn't emerge out of nowhere; they did extensive research to understand how our brains work.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/232694-234132.webm","at":2327.0,"dur":14.38}]},{"speaker":"B","text":"Our brains are designed to release dopamine when we achieve a goal to survive, but are they designed for these short dopamine spikes?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/235648-237167.webm","at":2356.6,"dur":15.19}]}],"time":2085.1,"topic":3},{"title":"Instant gratification and modern convenience","lines":[{"speaker":"A","text":"In the past, survival was a long-term goal. You had to spend hours tracking an animal before you could finally bring food to the table.","highlights":["bring food to the table"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/239808-241143.webm","at":2398.3,"dur":13.35}]},{"speaker":"B","text":"That's true, but nowadays you can just call Yandex Delivery and have food arrive in 30 minutes. Even in big cities like Moscow or St. Petersburg, people prefer ordering over going to the store.","highlights":["prefer ordering"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/243552-244246.webm","at":2435.6,"dur":6.94}]},{"speaker":"A","text":"It's a huge shift in modern society. In Western countries, delivery is affordable for almost everyone, but in Russia, many people still struggle to afford much more than people did a hundred years ago.","highlights":["huge shift"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/247684-248522.webm","at":2476.9,"dur":8.38}]},{"speaker":"B","text":"Exactly. Now, someone working as a cashier at Pyaterochka can get enough food with a low salary while exerting zero energy. It's a sedentary lifestyle compared to the past.","highlights":["sedentary lifestyle"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/251896-253271.webm","at":2519.1,"dur":13.75}]},{"speaker":"A","text":"That's progress, but the reward span is much shorter now. Instead of waiting hours, you get a quick dopamine burst in five minutes by grabbing a bag of Lay's chips.","highlights":["quick dopamine burst"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/256590-257828.webm","at":2566.0,"dur":12.38}]},{"speaker":"B","text":"The same applies to entertainment. You used to have to wait a year for a circus or a fair to come to town, or even a month for a public execution.","highlights":["public execution"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/258590-259696.webm","at":2586.1,"dur":11.06}]},{"speaker":"A","text":"Now, entertainment is delivered straight to your phone. You don't have to wait; you just spend three seconds opening TikTok and start scrolling.","highlights":["straight to your phone"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/263734-264910.webm","at":2637.5,"dur":11.76}]},{"speaker":"B","text":"And those videos are optimized for you. TikTok learns your preferences, like how it knows I'm into chess and certain other games.","highlights":["optimized for you"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/265336-266218.webm","at":2653.6,"dur":8.82}]}],"time":2398.3,"topic":3},{"title":"Algorithms, Dopamine, and AI Projects","lines":[{"speaker":"A","text":"I love how algorithms feed me content. If I stop watching chess videos for a bit, they feel new again because our brains crave novelty.","highlights":["crave novelty"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/267100-268056.webm","at":2671.1,"dur":9.56}]},{"speaker":"B","text":"Exactly. If you watch every video to the end, the algorithm sees your interest and feeds you more. It's so easy to get hooked.","highlights":["get hooked"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/271862-272847.webm","at":2718.7,"dur":9.85}]},{"speaker":"A","text":"Even the smartest person can get addicted because these platforms are designed to trigger dopamine circuits. It's like how someone would get addicted to heroin.","highlights":["trigger dopamine circuits"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/273456-274567.webm","at":2734.7,"dur":11.11}]},{"speaker":"B","text":"I think addiction is natural. We have many types of addictions every day. AI is the same way; it can be good or bad depending on how you use it.","highlights":["depending on how"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/279582-280995.webm","at":2796.0,"dur":14.13}]},{"speaker":"A","text":"True. You can use those same brain mechanisms to get addicted to learning English or coding. I've been trying to use ChatGPT for my English studies.","highlights":["brain mechanisms"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/283754-285114.webm","at":2837.6,"dur":13.6}]},{"speaker":"B","text":"I'm actually working on an app now to make it easier to watch videos and read books. It's a project I've been meaning to do for five years.","highlights":["meaning to do"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/289596-290956.webm","at":2896.2,"dur":13.6}]},{"speaker":"A","text":"What's the backstory? You mentioned you were working for a company that delivered bottled water and had to calculate everything manually.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/293654-294973.webm","at":2936.7,"dur":13.19}]}],"time":2671.1,"topic":3},{"title":"Logistics and Route Optimization Algorithms","lines":[{"speaker":"A","text":"I'll have to do the math in my head. Can you see my screen now?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/296322-296915.webm","at":2963.3,"dur":5.93},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/297214-297889.webm","at":2972.3,"dur":6.75}]},{"speaker":"B","text":"Yeah, it's because Claude is running a lot of tests right now.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/299390-299755.webm","at":2994.1,"dur":3.65}]},{"speaker":"A","text":"That's a good example. It's a bit of an exaggeration, but imagine you have one car that can hold 40 bottles.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/300564-301470.webm","at":3005.7,"dur":9.06}]},{"speaker":"B","text":"So you have a person working from 9 to 6 PM, and you start getting orders for two to six bottles every day.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/304182-305803.webm","at":3042.0,"dur":16.21}]},{"speaker":"A","text":"Let's say we have 20 orders on the map. Each dot is someone calling because they need water, and they have specific time windows.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/307140-307924.webm","at":3071.5,"dur":7.84}]},{"speaker":"B","text":"For example, one person can only come home between 3 and 5 PM, while another is available from 10:40 to 12:20. My job was to figure out how to deliver everything.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/308070-309506.webm","at":3080.8,"dur":14.36}]},{"speaker":"A","text":"That's a simulation, but it works the same way as real-time. You could try to sort the orders by their closing time.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/310499-311913.webm","at":3105.1,"dur":14.14}]},{"speaker":"B","text":"It's like a Walker's career. However, an algorithm is much smarter than you; it can calculate a million combinations per second.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/316318-317319.webm","at":3163.3,"dur":10.01}]},{"speaker":"A","text":"Even in 15 seconds, it can calculate about 100 combinations. We only have one car and 40 bottles, but it already found a plan.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/317468-317977.webm","at":3174.9,"dur":5.09},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/318266-319761.webm","at":3182.9,"dur":14.95}]},{"speaker":"B","text":"It's a very simple scenario and it finds the solution in the first three seconds. But why doesn't our build the routes there?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/326564-327461.webm","at":3265.8,"dur":8.97},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/329740-330237.webm","at":3297.6,"dur":4.97}]},{"speaker":"A","text":"Well, if an order changes its time window and calls you saying they can't wait any longer, that would be such a headache.","highlights":["such a headache"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/331474-332933.webm","at":3314.8,"dur":14.59}]},{"speaker":"B","text":"I'd have to think if going there earlier would make me late elsewhere. But the algorithm just takes care of it automatically.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/333558-335154.webm","at":3335.7,"dur":15.96}]}],"time":2963.3,"topic":4},{"title":"Optimizing delivery routes with algorithms","lines":[{"speaker":"A","text":"So, the algorithm finds the shortest route based on specific time windows. For example, if a customer is only available at 1 PM, it has to factor that in.","highlights":["factor that in"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/341002-342466.webm","at":3410.1,"dur":14.64}]},{"speaker":"B","text":"Exactly. In your job, does an algorithm handle that for you now? Do you have to think about the logistics at all?","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/343626-344466.webm","at":3436.5,"dur":8.4}]},{"speaker":"A","text":"The algorithm does it all now. I don't have to worry about it. It figures out exactly how to deliver a package at 1:21 PM.","clips":[{"src": ndles their deliveries. They're a big company, so they must have a sophisticated solution.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/365940-366526.webm","at":3659.5,"dur":5.86},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/367902-368460.webm","at":3679.1,"dur":5.58}]},{"speaker":"B","text":"I'll tell you more about it next time. If you can't do the map on Friday, just shoot me a text.","highlights":["shoot me a text"],"clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/367454-367902.webm","at":3674.7,"dur":4.48},{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/371104-371336.webm","at":3711.2,"dur":2.32}]},{"speaker":"A","text":"I didn't copy your video's map because I didn't want to copy-paste. I found a different one online and tried to describe it in the same way.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/372422-373316.webm","at":3724.3,"dur":8.94}]},{"speaker":"B","text":"Great, we'll take a look at that. See you next week! Have a great day.","clips":[{"src":"lesson_audio/lesson_date_27-09-2026_time_13-04-25/373602-374460.webm","at":3736.2,"dur":8.58}]}],"time":3410.1,"topic":4}]};
