spacious home office.","answer":"transformed","options":["transformed","decorated","cleaned","painted"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/267062-267409.webm","at":2670.7,"dur":3.47}},{"term":"put in","pos":"phrasal verb","definition":"To include information, names, or items in a book, list, or document.","time":2827.8,"lesson":"If a person who ranks food puts it in this book, like a critic or a connoisseur, he travels to very fancy restaurants.","examples":[{"sentence":"The editor asked me to put in the names of all the sponsors.","pattern":"put in + noun"},{"sentence":"You should put in a request for a day off next week.","pattern":"put in + a request"},{"sentence":"The author decided to put in more detail about the history of the city.","pattern":"put in + more detail"},{"sentence":"Could you put in a word for me with the manager?","pattern":"put in a word for [someone]"}],"more_examples":["Make sure you put in your contact information at the bottom of the form.","The designer forgot to put in the company logo on the final draft.","You need to put in a password before you can access the files."],"synonyms":["include","enter","add","insert","record","list","input","incorporate"],"antonyms":["exclude","remove","omit","delete","take out","leave out"],"gap":{"sentence":"The application form was missing your phone number, so please make sure to _____ your contact details before submitting it.","answer":"put in","options":["put in","give up","call off","carry on"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/283038-283412.webm","at":2830.5,"dur":3.74}},{"term":"connoisseur","pos":"noun","definition":"An expert judge in matters of taste, especially regarding high-quality food and drink.","time":2831.7,"lesson":"If a person who ranks food and puts it in this book—a critic or a connoisseur—travels to very fancy restaurants. They visit high-level establishments with experienced cooks where the food is prepared impeccably.","examples":[{"sentence":"He is a wine connoisseur who can identify the region of origin just by tasting it.","pattern":"a [noun] connoisseur"},{"sentence":"The restaurant's interior was designed to appeal to true art connoisseurs.","pattern":"appeal to [noun] connoisseurs"},{"sentence":"As a connoisseur of fine chocolate, she only buys from small, artisanal producers.","pattern":"connoisseur of [noun]"},{"sentence":"The film was praised by several critics and connoisseurs of classical cinema.","pattern":"connoisseur of [noun] + [verb phrase]"}],"countable":[{"meaning":"An expert judge in matters of taste, especially regarding high-quality food and drink.","example":"If a person who ranks food and puts it in this book—a critic or a connoisseur—travels to very fancy restaurants.","lesson":true}],"uncountable":[],"more_examples":["The chef invited several local cheese connoisseurs to the private tasting event.","She is considered a connoisseur of rare spices and exotic flavors.","Only a true connoisseur of coffee would appreciate the subtle notes in this roast."],"synonyms":["expert","aficionado","specialist","enthusiast","authority"],"antonyms":["amateur","novice","layperson","tyro"],"gap":{"sentence":"Because he can distinguish the subtle notes of different coffee beans, he is considered a true coffee _____.","answer":"connoisseur","options":["connoisseur","beginner","customer","worker"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/283412-283715.webm","at":2834.2,"dur":3.03}},{"term":"impeccable","pos":"adjective","definition":"perfectly prepared or executed without any flaws or mistakes.","time":2865.5,"lesson":"The food in these high-level restaurants is prepared using impeccable cooking methods. The cooking process is very well-optimized and high-quality.","examples":[{"sentence":"Her English is impeccable; she sounds like a native speaker.","pattern":"Subject + be + impeccable"},{"sentence":"The hotel provides impeccable service to every guest.","pattern":"impeccable + noun (service)"},{"sentence":"The pianist gave an impeccable performance of the concerto.","pattern":"impeccable + noun (performance)"},{"sentence":"You need to ensure your timing is impeccable during the presentation.","pattern":"ensure + [noun] + is impeccable"}],"more_examples":["The dress was in impeccable condition despite being over twenty years old.","The team's coordination during the final minutes of the game was impeccable.","She has an impeccable reputation as a journalist who never compromises her integrity."],"synonyms":["flawless","perfect","faultless","exemplary","irreproachable"],"antonyms":["flawed","imperfect","faulty","sloppy","defective","subpar"],"gap":{"sentence":"The chef's presentation was _____, with every ingredient placed exactly where it should be without a single mess.","answer":"impeccable","options":["impeccable","messy","random","vague"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/287806-288136.webm","at":2878.2,"dur":3.3}},{"term":"held in high regard","pos":"expression","definition":"respected and admired by many people for your skills, qualities, or achievements.","time":2968.4,"lesson":"If the restaurant were judged by three cooks who are very famous and held in high regard, I would understand. These are people who are widely respected in their field.","examples":[{"sentence":"The professor is held in high regard by all of his students.","pattern":"be held in high regard by [someone]"},{"sentence":"She is a scientist who is held in high regard for her groundbreaking research.","pattern":"held in high regard for [reason]"},{"sentence":"In that industry, he is held in very high regard.","pattern":"held in very high regard"},{"sentence":"The judge is held in high regard because of her fairness and integrity.","pattern":"held in high regard because of [reason]"}],"more_examples":["The local community holds the retired firefighter in high regard for his years of service.","In the world of classical music, she is held in high regard for her technical mastery.","He is held in high regard by his colleagues because he always stays calm under pressure."],"synonyms":["respected","admired","esteemed","revered","highly thought of","well-regarded","venerated","honored"],"antonyms":["disrespected","looked down upon","disregarded","scorned","held in low esteem"],"gap":{"sentence":"Because of her years of experience and incredible leadership, the manager is _____ by everyone in the office.","answer":"held in high regard","options":["held in high regard","ignored","criticized","overlooked"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/297762-298122.webm","at":2977.8,"dur":3.6}},{"term":"widely respected","pos":"adjective phrase","definition":"admired or held in high esteem by a large number of people.","time":2981.4,"lesson":"It wouldn't be the same if the judges were three cooks who are very famous and widely respected. If a chef knew a widely respected tester, he would take their feedback seriously.","examples":[{"sentence":"She is a widely respected expert in the field of renewable energy.","pattern":"widely respected + [noun phrase]"},{"sentence":"The professor is widely respected for her groundbreaking research.","pattern":"widely respected + for + [gerund/noun]"},{"sentence":"He has become a widely respected figure in the local community.","pattern":"become + a widely respected + [noun]"},{"sentence":"The organization is widely respected for its commitment to human rights.","pattern":"widely respected + for + [possessive + noun]"}],"more_examples":["The restaurant is widely respected for its authentic Italian cuisine.","He is a widely respected mentor to many young artists in the city.","The judge is widely respected for her impartiality and fairness."],"synonyms":["highly regarded","well-respected","revered","esteemed","renowned","celebrated","acclaimed","distinguished","venerated"],"antonyms":["disreputable","scorned","notorious","shunned","derided"],"gap":{"sentence":"Because of his years of honest service and integrity, the retired judge is _____ by everyone in the town.","answer":"widely respected","options":["widely respected","highly controversial","widely ignored","deeply disliked"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/297762-298708.webm","at":2977.8,"dur":9.46}},{"term":"dubious","pos":"adjective","definition":"Not able to be fully trusted or believed; suspicious and not convincing.","time":3020.0,"lesson":"If the tester is someone nobody really knows, their opinion seems dubious. It feels less convincing to me because I would have to rely on the taste of a random person.","examples":[{"sentence":"The company's claims about the product's safety are a bit dubious.","pattern":"subject + be + a bit dubious"},{"sentence":"I'm dubious about the possibility of finishing the project by tomorrow.","pattern":"be dubious about + noun phrase"},{"sentence":"He made some dubious remarks during the meeting that made everyone uncomfortable.","pattern":"dubious + noun (adjective + noun collocation)"},{"sentence":"The source of the information is dubious, so we should double-check the facts.","pattern":"subject + is + dubious"}],"more_examples":["The salesman gave me a dubious explanation for why the car's engine was making that noise.","I have some dubious feelings about the new investment opportunity my friend suggested.","The website looks a bit dubious, so I wouldn't enter my credit card details there."],"synonyms":["suspicious","questionable","uncertain","doubtful","fishy","shady","unreliable","sketchy"],"antonyms":["reliable","trustworthy","certain","convincing","dependable","credible"],"gap":{"sentence":"The salesman's claims about the car's history were so _____ that I decided not to buy it.","answer":"dubious","options":["dubious","transparent","reliable","honest"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/301428-302617.webm","at":3014.4,"dur":11.89}},{"term":"sommelier","pos":"noun","definition":"A trained professional with extensive experience in tasting and evaluating wine.","time":3047.1,"lesson":"How do I know that he is good? What proves his expertise? Perhaps it is because he has extensive experience in tasting, like a sommelier.","examples":[{"sentence":"The sommelier recommended a full-bodied red wine to pair with the steak.","pattern":"The sommelier + recommended + [noun]"},{"sentence":"We asked the sommelier to explain the different regions of France.","pattern":""},{"sentence":"A professional sommelier can identify the notes of oak and vanilla in a glass of wine.","pattern":"A professional sommelier"},{"sentence":"The restaurant employs a sommelier to manage the extensive wine cellar.","pattern":""}],"countable":[{"meaning":"A trained professional with extensive experience in tasting and evaluating wine.","example":"Perhaps it is because he has extensive experience in tasting, like a sommelier.","lesson":true},{"meaning":"A person who serves wine in a restaurant","example":"The sommelier poured the wine into the glasses with great precision."}],"uncountable":[],"more_examples":["The sommelier guided us through a flight of different sparkling wines.","You can consult the sommelier if you are unsure which vintage to choose.","The sommelier curated a special selection of local wines for the event."],"synonyms":["wine steward","wine expert","wine specialist"],"antonyms":[],"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/306484-306722.webm","at":3064.9,"dur":2.38}},{"term":"convincing","pos":"adjective","definition":"Providing enough evidence or reasons to make someone believe that something is true.","time":3147.9,"lesson":"He said the player is a great grandmaster because he loves playing chess a lot. That is not a convincing argument.","examples":[{"sentence":"The lawyer presented some very convincing evidence to the jury.","pattern":"very + convincing + noun"},{"sentence":"I'm not sure if his excuse for being late is convincing.","pattern":"be + convincing"},{"sentence":"She gave a convincing performance as the lead actress in the play.","pattern":"convincing + performance"},{"sentence":"You need to provide a more convincing reason for why we should hire you.","pattern":"convincing reason for + -ing"}],"more_examples":["The witness's testimony was so convincing that the judge had no choice but to believe her.","They tried to offer a convincing explanation for the missing funds, but nobody was fooled.","The marketing team needs to create a more convincing campaign to attract younger customers."],"synonyms":["persuasive","compelling","credible","plausible","cogent"],"antonyms":["unconvincing","unpersuasive","implausible"],"gap":{"sentence":"The sales pitch was so _____ that the company decided to sign the contract immediately.","answer":"convincing","options":["convincing","boring","confusing","unclear"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/314360-314939.webm","at":3143.7,"dur":5.79}},{"term":"accumulate","pos":"verb","definition":"To gradually gather or build up a larger amount of something over a period of time.","time":3285.6,"lesson":"If you learn five to ten new words every time you read a review, that is progress that accumulates over time. I encourage you to spend time reading the reviews.","examples":[{"sentence":"Dust tends to accumulate quickly if you don't clean the shelves regularly.","pattern":""},{"sentence":"The company has accumulated a large amount of data over the last decade.","pattern":"accumulate + [noun phrase]"},{"sentence":"Small expenses can accumulate into a significant amount of debt.","pattern":"accumulate into"},{"sentence":"He managed to accumulate a fortune through his investments.","pattern":"accumulate + [noun]"}],"more_examples":["Snow began to accumulate on the ground as the temperature dropped.","Over the years, the old house accumulated many layers of peeling paint.","If you don't exercise regularly, stress can accumulate and affect your health."],"synonyms":["build up","collect","gather","amass","accrue","pile up","stockpile"],"antonyms":["dissipate","scatter","deplete","disperse"],"gap":{"sentence":"If you don't wash your clothes after every wear, they will gradually _____ dirt and bacteria.","answer":"accumulate","options":["accumulate","disappear","evaporate","shrink"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/328722-329101.webm","at":3287.3,"dur":3.79}}],"dialogues":[{"title":"Living arrangements and home ownership","lines":[{"speaker":"A","text":"Good morning! Can you hear and see me clearly?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/000000-000683.webm","at":0.0,"dur":6.83}]},{"speaker":"B","text":"Yes, I can. What is that bluish-green thing hanging under the balcony door handle?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/000880-001705.webm","at":9.0,"dur":8.25},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/001974-002636.webm","at":19.9,"dur":6.62}]},{"speaker":"A","text":"Oh, that's a t-shirt. It's drying on the balcony.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/002616-003387.webm","at":26.3,"dur":7.71},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/004156-004973.webm","at":41.8,"dur":8.17}]},{"speaker":"B","text":"I see. Is that a door or a window? The handle goes vertically, which is unusual for a door.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/005094-005449.webm","at":51.1,"dur":3.55},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/005680-007245.webm","at":57.0,"dur":15.65}]},{"speaker":"A","text":"It's a special option. It can function like a regular window or a door, and you can even open it just a little bit.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/009414-010473.webm","at":94.3,"dur":10.59},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/010776-012256.webm","at":108.0,"dur":14.8}]},{"speaker":"B","text":"That's cool. By the way, is that a new mic or a teacup?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/013080-013731.webm","at":131.0,"dur":6.51},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/014220-015173.webm","at":142.4,"dur":9.53}]},{"speaker":"A","text":"Actually, it's an old teacup from IKEA. I also have an IKEA plush snake that I've owned for about seven or eight years.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/015522-016972.webm","at":155.3,"dur":14.5},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/018584-019185.webm","at":186.0,"dur":6.01}]},{"speaker":"B","text":"What do you do with it? It just sits on the couch and acts as a dust collector.","highlights":["dust collector"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/021776-023313.webm","at":217.9,"dur":15.37},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/024066-025121.webm","at":240.9,"dur":10.55}]},{"speaker":"A","text":"I know it takes up space, but it's so soft and not annoying at all.","highlights":["takes up space"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/026666-028145.webm","at":266.9,"dur":14.79}]},{"speaker":"B","text":"Just because something isn't annoying doesn't mean it has to be in your home. For example, a dog wouldn't be annoying, but you don't have one.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/029174-030626.webm","at":291.8,"dur":14.52}]},{"speaker":"A","text":"I can't have a dog because I rent this apartment, which I've lived in for about five years.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/030800-032151.webm","at":308.1,"dur":13.51},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/033336-034669.webm","at":333.6,"dur":13.33}]},{"speaker":"B","text":"Have you ever thought about buying your own place? Mortgages are expensive, and the interest rates are so high right now.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/035458-036565.webm","at":354.8,"dur":11.07},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/037746-039133.webm","at":377.7,"dur":13.87}]},{"speaker":"A","text":"I don't think I want to buy one. It might be a good thing, though, because it gives you the freedom to move to another city or country.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/039422-039883.webm","at":394.4,"dur":4.61},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/040942-042382.webm","at":409.6,"dur":14.4}]},{"speaker":"B","text":"True. Not owning a home means you can start a new life elsewhere whenever you want.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/042492-043815.webm","at":425.0,"dur":13.23},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/044012-044766.webm","at":440.3,"dur":7.54}]}],"time":0.0,"topic":0},{"title":"Travel experiences and Italian pizza","lines":[{"speaker":"A","text":"Nobody really knows where we're going to end up in the future, whether it's in six months or two years.","highlights":["end up"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/048042-048974.webm","at":480.6,"dur":9.32}]},{"speaker":"B","text":"I actually prefer standard pizzas with cheese or black truffles over something like black caviar.","highlights":["black truffles"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/051306-052509.webm","at":513.3,"dur":12.03},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/053390-054519.webm","at":534.1,"dur":11.29}]},{"speaker":"A","text":"Exactly, black truffles are a classic Italian flavor for pizza.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/054688-055381.webm","at":547.0,"dur":6.93},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/055554-056272.webm","at":555.7,"dur":7.18}]},{"speaker":"B","text":"I know that because I went to Italy and tried many different types of pizza.","highlights":["different types"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/057956-059207.webm","at":579.8,"dur":12.51},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/059394-060289.webm","at":594.1,"dur":8.95}]},{"speaker":"A","text":"Did you visit any specific cities like Rome, Venice, or Palermo?","highlights":["specific cities"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/067444-068233.webm","at":674.5,"dur":7.89},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/069808-071230.webm","at":698.3,"dur":14.22}]},{"speaker":"B","text":"I've visited many places over the course of several trips, starting from 2014 until about two years ago.","highlights":["over the course of"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/075708-077125.webm","at":757.3,"dur":14.17}]},{"speaker":"A","text":"So, did you go to France during that last trip two years ago as well?","highlights":["during that last trip"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/086892-087297.webm","at":869.0,"dur":4.05},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/087682-089057.webm","at":877.0,"dur":13.75}]},{"speaker":"B","text":"Actually, I went to France for the second time about one year ago, in September.","highlights":["for the second time"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/091004-091969.webm","at":910.2,"dur":9.65},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/092202-092944.webm","at":922.2,"dur":7.42}]},{"speaker":"A","text":"How many times have you been to Italy in total?","highlights":["in total"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/094840-095347.webm","at":948.6,"dur":5.07}]},{"speaker":"B","text":"That's a hard question, but I think I've made about eight or nine trips there.","highlights":["hard question"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/096292-097735.webm","at":963.0,"dur":14.43}]}],"time":480.6,"topic":0},{"title":"Comparing travel to Italy and France","lines":[{"speaker":"A","text":"Turkey used to be much more affordable for travelers. Now, it's getting quite expensive compared to other countries.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/097746-099112.webm","at":977.6,"dur":13.66}]},{"speaker":"B","text":"It's hard for some people to say how many times they've been to Turkey, but Italy is different. You've been there many times.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/100222-101355.webm","at":1002.4,"dur":11.33}]},{"speaker":"A","text":"I've visited Italy many times because it's a big country with so many interesting regions, exquisite wines, and different dishes.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/103600-104523.webm","at":1036.2,"dur":9.23},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/105058-105713.webm","at":1050.8,"dur":6.55}]},{"speaker":"B","text":"Have you been to France as many times as you've been to Italy? I'm surprised because you've been to Italy about nine times.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/108626-109243.webm","at":1086.4,"dur":6.17},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/109940-110508.webm","at":1099.6,"dur":5.68}]},{"speaker":"A","text":"Actually, I've been to France even more than Italy, mainly because of the wines.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/111456-112773.webm","at":1114.8,"dur":13.17}]},{"speaker":"B","text":"Did you go to France for work, like visiting winemakers in certain cities, or was it your own desire?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/114078-116010.webm","at":1140.9,"dur":19.32}]},{"speaker":"A","text":"My trips to Venice and other cities were all job-related. I didn't go to Italy because I missed Rome or Naples; it's just not my cup of tea.","highlights":["not my cup of tea"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/115980-117177.webm","at":1160.0,"dur":11.97},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/117376-118824.webm","at":1174.0,"dur":14.48}]},{"speaker":"B","text":"I don't know how the two countries differ. I've only taken very short trips to both, and I don't have a clear picture of them.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/123214-124604.webm","at":1232.3,"dur":13.9}]},{"speaker":"A","text":"France has a different vibe for me. The Italian lifestyle is more noisy and emotional; everything happens so fast, like a roller coaster.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/128372-128853.webm","at":1283.8,"dur":4.81},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/129156-130693.webm","at":1291.8,"dur":15.37}]},{"speaker":"B","text":"The French people are quieter and more bearable. I was trying to find the right way to say if you went there on your own accord.","highlights":["on your own accord"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/133390-134563.webm","at":1334.0,"dur":11.73},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/138126-139012.webm","at":1381.4,"dur":8.86}]},{"speaker":"A","text":"You can say I went there on my own initiative. Regarding the weather, it really depends on the location, especially in the north of Italy.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/145318-146711.webm","at":1453.4,"dur":13.93},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/148336-149703.webm","at":1483.6,"dur":13.67}]}],"time":977.6,"topic":1},{"title":"Adapting Cuisine to Local Palates","lines":[{"speaker":"A","text":"I think the weather in Piedmont is often foggy or rainy because it's so close to the Alps, whereas the tiles have more sunny days.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/149741-150983.webm","at":1497.5,"dur":12.42},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/151634-152675.webm","at":1516.5,"dur":10.41}]},{"speaker":"B","text":"Regarding food, I prefer Italian cuisine because it shares a lot of similarities with Russian flavors.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/158626-159949.webm","at":1586.4,"dur":13.23}]},{"speaker":"A","text":"How would you describe that closeness? How does the connection to Russian flavors actually work?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/160614-161389.webm","at":1606.2,"dur":7.75}]},{"speaker":"B","text":"It's simple; both cultures use similar ingredients like dough, fresh vegetables, potatoes, pork, and beef. The main difference is that Russian flavors lean toward sweetness.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/161590-162913.webm","at":1616.1,"dur":13.23}]},{"speaker":"A","text":"So, if we compare a Russian borscht or an Italian soup to a French bouillabaisse, the former are sweeter while the latter are more sour?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/171526-173147.webm","at":1715.5,"dur":16.21}]},{"speaker":"B","text":"Exactly. In my restaurant, we adapt Italian cuisine to the Russian palate. We use more Parmesan because it's a sweet cheese and fits the local preference for sweetness.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/183560-185423.webm","at":1835.7,"dur":18.63}]},{"speaker":"A","text":"To what extent should a chef preserve the spirit of the original cuisine versus adapting it to the local taste?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/190308-191732.webm","at":1903.2,"dur":14.24}]},{"speaker":"B","text":"If you stick strictly to original flavors from Italy or Lebanon, many Russians won't understand them and will think the food is bad. You won't make a profit.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/194400-196009.webm","at":1944.2,"dur":16.09}]},{"speaker":"A","text":"That's interesting because it means we can never objectively say if something is good; it's always subjective.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/200568-201432.webm","at":2005.8,"dur":8.64}]},{"speaker":"B","text":"Right. For example, what gives Gordon Ramsay the right to judge someone's cooking? He only rates the cooking techniques, not the subjective taste.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/202110-203510.webm","at":2021.2,"dur":14.0}]}],"time":1497.3,"topic":1},{"title":"Culinary techniques and billiards analogies","lines":[{"speaker":"A","text":"I'm not saying he's arrogant, but I want to understand his metric. When he criticizes generic food, he's probably right.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/207630-208755.webm","at":2076.5,"dur":11.25},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/209538-210002.webm","at":2095.5,"dur":4.64}]},{"speaker":"B","text":"Exactly. He can see the cook's intent. He looks at a pizza and realizes the technique used failed to achieve the desired result.","highlights":["desired result"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/213740-214698.webm","at":2137.5,"dur":9.58}]},{"speaker":"A","text":"That's deep. Most people just think about the final product, but he focuses on the working process and how the ingredients behave.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/216544-217271.webm","at":2165.6,"dur":7.27},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/220758-221337.webm","at":2207.8,"dur":5.79}]},{"speaker":"B","text":"It's like billiards. Have you ever played? You hit the balls with a cue, and there are green tables and colored balls.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/222310-223486.webm","at":2223.2,"dur":11.76}]},{"speaker":"A","text":"Is it pool or billiards? I'm not sure of the difference between the two terms.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/224422-225128.webm","at":2244.3,"dur":7.06},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/226802-227353.webm","at":2268.1,"dur":5.51}]},{"speaker":"B","text":"In some versions of billiards, if you accidentally sink the ball into the pocket, it counts as a score.","highlights":["sink the ball"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/234520-235841.webm","at":2345.4,"dur":13.21}]},{"speaker":"A","text":"In other versions, you have to predict which balls go into which pockets before you strike. If you don't hit your target, you don't score.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/236360-237563.webm","at":2363.7,"dur":12.03}]},{"speaker":"B","text":"The analogy is clear. He looks at the dish and says, 'You said you'd put the ball in three pockets, but you didn't.'","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/239614-240317.webm","at":2396.2,"dur":7.03},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/240822-241523.webm","at":2408.4,"dur":7.01}]},{"speaker":"A","text":"But a cooked dish isn't accidental. You put ingredients in a pot with olive oil and fire, and voila, you have a dish.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/243256-243935.webm","at":2432.8,"dur":6.79},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/244544-245868.webm","at":2445.6,"dur":13.24}]},{"speaker":"B","text":"True, but what about the Michelin guide? I'm not sure if it's an organization or a magazine, but it started with a book in Europe.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/249218-250727.webm","at":2492.4,"dur":15.09}]}],"time":2076.5,"topic":1},{"title":"The history of the Michelin Guide","lines":[{"speaker":"A","text":"So, it's a tire company that produces tires, but they actually created a guidebook for their services in Europe.","highlights":["tire company"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/251106-252423.webm","at":2511.3,"dur":13.17}]},{"speaker":"B","text":"Right, and it includes a map and a huge list of restaurants because you need to take a break or have lunch when you're traveling.","highlights":["take a break"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/255046-255733.webm","at":2550.7,"dur":6.87},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/256974-258348.webm","at":2569.9,"dur":13.74}]},{"speaker":"A","text":"Who was the first person to make this book? Was it the owner of the company?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/260384-261151.webm","at":2603.9,"dur":7.67}]},{"speaker":"B","text":"Yes, it was the owner. It's strange that a tire company would produce a book about high cuisine, but it was really about practical recommendations.","highlights":["high cuisine"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/261172-262676.webm","at":2611.8,"dur":15.04}]},{"speaker":"A","text":"How did that work? Did he just happen to have great taste, and did all the restaurants he listed turn out to be very good?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/262762-263985.webm","at":2627.7,"dur":12.23}]},{"speaker":"B","text":"The company is now separate, but it's still linked to the tire company. The founder's last name was Michelin.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/269676-271456.webm","at":2697.0,"dur":17.8}]},{"speaker":"A","text":"Is Michelin a real person's name? I heard it was two brothers who started the guidebook at the beginning of the 20th century.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/272326-272947.webm","at":2723.4,"dur":6.21},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/273704-275013.webm","at":2737.1,"dur":13.09}]},{"speaker":"B","text":"Exactly. One of the brothers listed the restaurants, and the guide was named after him. It's been around for about 120 years.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/275486-276845.webm","at":2755.0,"dur":13.59},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/277985-278593.webm","at":2780.0,"dur":6.08}]},{"speaker":"A","text":"It's interesting that nobody else thought of doing this before. Isn't making a list of good restaurants in different countries quite obvious?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/280412-281815.webm","at":2804.3,"dur":14.03}]},{"speaker":"B","text":"Well, a connoisseur usually visits high-level restaurants where the cooking methods are impeccable and the food is prepared perfectly.","highlights":["high-level restaurants"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/282462-283993.webm","at":2824.7,"dur":15.31}]},{"speaker":"A","text":"But how does he rank them? It's very subjective, isn't it? Like, I might like one place but not another.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/288986-289773.webm","at":2890.0,"dur":7.87},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/290022-291131.webm","at":2900.4,"dur":11.09}]},{"speaker":"B","text":"Nowadays they employ special people who are some of the best food tasters in the world, but you don't even know who the specific tester is.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/291428-292479.webm","at":2914.4,"dur":10.51},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/294264-295728.webm","at":2942.8,"dur":14.64}]},{"speaker":"A","text":"I get it. If it were three famous cooks who are held in high regard and widely respected, I'd understand the ranking better.","highlights":["held in high regard"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/296570-297389.webm","at":2965.8,"dur":8.19},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/297762-298610.webm","at":2977.8,"dur":8.48}]}],"time":2511.2,"topic":3},{"title":"The credibility of food testers","lines":[{"speaker":"A","text":"If a chef respects a food tester because that person is a better cook, that makes sense. The tester has the right to judge the food.","highlights":["the right to"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/298938-300114.webm","at":2989.5,"dur":11.76}]},{"speaker":"B","text":"But if it's just a random person, it feels dubious. How do we know they are actually good at tasting? What proves their expertise?","highlights":["proves their expertise"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/302274-303293.webm","at":3022.8,"dur":10.19},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/303710-304810.webm","at":3037.3,"dur":11.0}]},{"speaker":"A","text":"In chess, we know the grandmasters are the best because they beat everyone else in tournaments. Their results prove their skill.","highlights":["prove their skill"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/307054-308476.webm","at":3070.6,"dur":14.22}]},{"speaker":"B","text":"Exactly. If someone claimed a player was the best just because they love chess, but they've never played against the top grandmasters, that wouldn't be convincing.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/309558-313888.webm","at":3095.7,"dur":43.3}]},{"speaker":"A","text":"We'll continue that discussion later. By the way, did you see my new and improved version of the reviews?","highlights":["continue that discussion"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/317486-318867.webm","at":3175.1,"dur":13.81}]},{"speaker":"B","text":"I did! It's really good stuff. I've also finished the modal verbs grammar homework.","highlights":["good stuff"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/321844-323157.webm","at":3218.6,"dur":13.13},{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/323330-323812.webm","at":3233.5,"dur":4.82}]},{"speaker":"A","text":"I want you to really read the review after class to see your mistakes. I'm worried you might not be familiar with some of the words.","highlights":["be familiar with"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/324318-325371.webm","at":3243.3,"dur":10.53}]},{"speaker":"A","text":"For example, you might not know the word 'dubious.' But if you learn a few new words every time you read a review, that progress will accumulate over time.","highlights":["accumulate over time"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/327478-328500.webm","at":3275.0,"dur":10.22}]},{"speaker":"B","text":"Thank you. I'll definitely spend some time reading it.","highlights":["spend some time"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/329436-330068.webm","at":3294.5,"dur":6.32}]},{"speaker":"A","text":"See you next week! Have a great weekend.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_14-11-33/330242-330723.webm","at":3302.5,"dur":4.81}]}],"time":2989.5,"topic":3}]};

                goBack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>'
            };

            // A section's symbol (drawn once at the top of the page).
            const symbol = section => `<svg class="sym" aria-hidden="true" focusable="false"><use href="#sym-${section}"/></svg>`;

            const lesson = LESSON || {};
            const meta = lesson.meta || {};
            const mistakes = lesson.mistakes || [];
            // Graded lessons: every card has a grade 1-7 (a card without one
            // gets the grade nearest its old level); otherwise the old levels.
            const hasGrade = card => Number.isInteger(card.grade) && card.grade >= 1 && card.grade <= 7;
            const graded = mistakes.some(hasGrade);
            const gradeOf = card => hasGrade(card) ? card.grade : ({ high: 4, medium: 5, low: 6 }[card.severity] || 5);
            const vocabulary = lesson.vocabulary || [];
            const dialogues = lesson.dialogues || [];

            // --------------------------------------------------------- helpers
            function esc(value) {
                return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
            }

            function norm(word) {
                return word.toLowerCase().replace(/’/g, "'").replace(/[^\p{L}\p{N}']/gu, '');
            }

            function stem(word) {
                let w = norm(word).replace(/'s$/, '');
                if (IRREGULAR[w]) return IRREGULAR[w];
                for (const suffix of ['ing', 'ied', 'ies', 'ed', 'es', 's', 'ly']) {
                    if (w.endsWith(suffix) && w.length - suffix.length >= 3) { w = w.slice(0, -suffix.length); break; }
                }
                return w.replace(/e+$/, '');
            }

            function playButton(text, label) {
                return `<button class="play" type="button" data-say="${esc(text)}" aria-label="${esc(label || 'Listen')}" data-no-speech>${icons.play}</button>`;
            }

            // A clip of the lesson recording: a pill with the time it was said,
            // which opens into a small player when tapped.
            function clipHtml(clip, label) {
                if (!clip || !clip.src) return '';
                const at = clock(clip.at);
                return `<span class="clip" data-src="${esc(clip.src)}" data-no-speech>`
                    + `<button class="clip-main" type="button" title="${esc(label)}" aria-label="${esc(label)}, ${at}">${icons.clipPlay}${icons.clipPause}<span>${at}</span></button>`
                    + '<span class="clip-more">'
                    + `<button class="clip-skip" type="button" data-skip="-3" title="Back 3 seconds" aria-label="Back 3 seconds">${icons.back3}</button>`
                    + '<span class="clip-bar" role="slider" tabindex="0" aria-label="Position in the clip" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="clip-fill"></span></span>'
                    + `<button class="clip-skip" type="button" data-skip="3" title="Forward 3 seconds" aria-label="Forward 3 seconds">${icons.forward3}</button>`
                    + '</span></span>';
            }

            // Word diff (longest common subsequence) between what was said and the fix.
            function diff(before, after) {
                const a = before.split(/\s+/).filter(Boolean);
                const b = after.split(/\s+/).filter(Boolean);
                const n = a.length, m = b.length;
                const table = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
                for (let i = n - 1; i >= 0; i--) {
                    for (let j = m - 1; j >= 0; j--) {
                        table[i][j] = norm(a[i]) === norm(b[j]) ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
                    }
                }
                const left = [], right = [];
                let i = 0, j = 0;
                while (i < n || j < m) {
                    if (i < n && j < m && norm(a[i]) === norm(b[j])) {
                        left.push({ word: a[i++], kind: 'same' });
                        right.push({ word: b[j++], kind: 'same' });
                    } else if (j >= m || (i < n && table[i + 1][j] >= table[i][j + 1])) {
                        const word = a[i];
                        const previous = i > 0 ? norm(a[i - 1]) : '';
                        const noise = FILLERS.has(norm(word)) || norm(word) === previous || !norm(word);
                        left.push({ word, kind: noise ? 'same' : 'del' });
                        i++;
                    } else {
                        // Mark where a missing word belongs, unless a deletion already shows the spot.
                        const last = left[left.length - 1];
                        if (!last || (last.kind !== 'del' && last.kind !== 'gap')) left.push({ kind: 'gap' });
                        right.push({ word: b[j++], kind: 'ins' });
                    }
                }
                const render = (tokens, tag) => tokens.map(t => {
                    if (t.kind === 'gap') return '<span class="gap" aria-hidden="true"></span>';
                    return t.kind === 'same' ? esc(t.word) : `<${tag} class="w">${esc(t.word)}</${tag}>`;
                }).join(' ').replace(/<\/(del|ins)> <\1 class="w">/g, ' ');
                return { said: render(left, 'del'), fixed: render(right, 'ins') };
            }

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {
                    if (!hit[index] && functional.has(norm(part))) {
                        const near = [index - 2, index + 2].some(k => hit[k]);
                        if (near) hit[index] = true;
                    }
                });
                return parts.map((part, index) => {
                    if (!hit[index]) return esc(part);
                    // Underline the word itself, not quotes or punctuation stuck to it.
                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                    return `${esc(before)}<b class="hl">${esc(core)}</b>${esc(after)}`;
                }).join('');
            }

            // link(phrase): the vocabulary entry of a highlighted phrase, or -1.
            function highlightPhrases(text, phrases, link) {
                const lower = text.toLowerCase();
                const ranges = [];
                (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length, phrase]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end, phrase]) => {
                    const word = link ? link(phrase) : -1;
                    const opens = word >= 0 ? ` data-vocab="${word}" title="${esc(`See “${vocabulary[word].term}” in Vocabulary`)}"` : '';
                    html += esc(text.slice(cursor, start)) + `<mark class="expr"${opens}>${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {
                    if (value === undefined) return window.localStorage.getItem(key);
                    window.localStorage.setItem(key, value);
                } catch (_error) {
                    return null;
                }
                return null;
            }

            // ---------------------------------------------------------- header
            document.getElementById('title').textContent = meta.title || 'Lesson review';

            // The lesson time in Moscow time (meta.start_utc: when the lesson
            // began, in seconds since 1970). A tap shows it in the reader's own
            // time zone instead, remembered on the phone. Older pages have no
            // start_utc: the date and time as recorded, with no zone.
            const eyebrow = document.getElementById('eyebrow');
            const lessonStart = typeof meta.start_utc === 'number' && isFinite(meta.start_utc) ? new Date(meta.start_utc * 1000) : null;
            let lessonTimes = null;
            let ownZone = storage('lesson-time-zone') === 'own';

            function zoneTime(zone) {
                const date = { day: 'numeric', month: 'long', year: 'numeric' };
                const time = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
                if (zone) { date.timeZone = zone; time.timeZone = zone; }
                return {
                    date: new Intl.DateTimeFormat('en-GB', date).format(lessonStart),
                    time: new Intl.DateTimeFormat('en-GB', time).format(lessonStart)
                };
            }

            function offsetName(minutes) {
                const size = Math.abs(minutes);
                if (!size) return 'GMT';
                return 'GMT' + (minutes < 0 ? '-' : '+') + Math.floor(size / 60) + (size % 60 ? ':' + String(size % 60).padStart(2, '0') : '');
            }

            if (lessonStart) {
                try {
                    const moscow = zoneTime('Europe/Moscow');
                    const own = zoneTime(null);
                    lessonTimes = {
                        moscow: Object.assign(moscow, { zone: 'MSK', name: 'Moscow time' }),
                        own: Object.assign(own, { zone: offsetName(-lessonStart.getTimezoneOffset()), name: 'your time' }),
                        differ: moscow.date !== own.date || moscow.time !== own.time
                    };
                } catch (_error) {
                    lessonTimes = null;  // no time zones in this browser: the time as recorded
                }
            }

            function showLessonTime() {
                let date = meta.date;
                if (!lessonTimes) {
                    eyebrow.textContent = ['English lesson', meta.date, meta.time].filter(Boolean).join(' · ');
                } else {
                    const shown = lessonTimes.differ && ownZone ? lessonTimes.own : lessonTimes.moscow;
                    const other = shown === lessonTimes.own ? lessonTimes.moscow : lessonTimes.own;
                    const time = `${esc(shown.time)} <span class="tz">${esc(shown.zone)}</span>`;
                    date = shown.date;
                    eyebrow.innerHTML = `English lesson · ${esc(shown.date)} · `
                        + (lessonTimes.differ
                            ? `<button class="tz-btn" type="button" title="Show ${esc(other.name)} (${esc(other.zone)})" aria-label="${esc(`${shown.time} ${shown.name}. Show ${other.name}, ${other.zone}`)}">${time}</button>`
                            : `<span class="tz-time">${time}</span>`);
                }
                document.title = (meta.title ? meta.title + ' · ' : '') + 'English lesson' + (date ? ' · ' + date : '');
            }
            showLessonTime();
            eyebrow.addEventListener('click', event => {
                if (!event.target.closest('.tz-btn')) return;
                ownZone = !ownZone;
                storage('lesson-time-zone', ownZone ? 'own' : 'moscow');
                showLessonTime();
                const button = eyebrow.querySelector('.tz-btn');
                if (button && event.detail === 0) button.focus();  // kept for the keyboard
            });

            document.getElementById('count-mistakes').textContent = mistakes.length;
            document.getElementById('count-vocabulary').textContent = vocabulary.length;
            document.getElementById('count-dialogues').textContent = dialogues.length;

            // -------------------------------------------------------- mistakes
            const topics = lesson.topics || [];
            // Each mistake example, word and dialogue line can be found by the timeline.
            const exampleIds = new Map();
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => exampleIds.set(example, `m-${c}-${e}`)));
            let showAllMistakes = () => {};
            let vocabularyToWords = () => {};
            // What "Go back" needs to put a section back as it was.
            let mistakeFilter = () => 'all';
            let setMistakeFilter = () => {};
            let vocabularyView = () => 'words';
            let setVocabularyView = () => {};

            function clock(seconds) {
                if (seconds === null || seconds === undefined) return '';
                const total = Math.max(0, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const rest = String(total % 60).padStart(2, '0');
                return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
            }

            function plain(text) {
                return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
            }

            // One example: when it was said, the full sentence(s) as said and
            // corrected, and (where it adds something) its own explanation.
            function exampleHtml(example, options) {
                const before = example.context || example.quote;
                const after = example.context_fix || example.fix;
                const d = diff(before, after);
                // The clip pill needs no separator: it stays apart from the topic when the line wraps.
                const pill = clipHtml(example.clip, 'Hear what was said');
                // The letters beside the time open the same moment in the other sections.
                const jumps = jumpsHtml('mistakes', example.clip ? example.clip.at : example.time);
                const facts = [];
                if (!pill && example.time !== null && example.time !== undefined) facts.push(`<span class="clock">${clock(example.time)}</span>${jumps}`);
                if (options.showTopic && topics[example.topic]) facts.push(`<span>${esc(topics[example.topic].title)}</span>`);
                let html = `<div class="pair" data-item="${exampleIds.get(example) || ''}"${options.hidden ? ' hidden' : ''}>`;
                const separator = jumps && !pill ? '' : '<span class="sep">·</span>';
                if (pill || facts.length) html += `<div class="ex-meta" data-no-speech>${pill}${pill ? jumps : ''}${facts.join(separator)}</div>`;
                html += `<div class="said"><span class="mark-icon" aria-label="What was said" data-no-speech>✗</span><span class="txt">${d.said}</span></div>`;
                html += `<div class="fixed"><span class="mark-icon" aria-label="Better" data-no-speech>✓</span><span class="txt">${d.fixed}</span>${playButton(after, 'Listen to the correct version')}</div>`;
                if (options.why) html += `<p class="ex-why">${esc(options.why)}</p>`;
                return html + '</div>';
            }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
                    html += items.map(item => `<li><span class="meaning">${esc(item.meaning)}</span><span class="m-ex">${highlightTerm(item.example, entry.term)}`
                        + (item.lesson ? ' <span class="from-lesson" data-no-speech>from the lesson</span>' : '') + '</span></li>').join('');
                    return html + '</ol></div>';
                };
                return '<div class="forms">'
                    + column('Countable', 'a / an, plural', entry.countable || [])
                    + column('Uncountable', 'no a / an, no plural', entry.uncountable || [])
                    + '</div>';
            }

            function relatedHtml(entry) {
                const row = (title, words) => (words || []).length
                    ? `<div class="rel"><p class="part-title" data-no-speech>${title}</p><span class="rel-words">${words.map(w => `<span class="rel-word">${esc(w)}</span>`).join('<span class="sep" data-no-speech> · </span>')}</span></div>`
                    : '';
                return row('Synonyms', entry.synonyms) + row('Antonyms', entry.antonyms);
            }

            // Visible: when it was said, the word, the meaning, the lesson's own
            // words and at least three examples. The rest opens on request.
            function wordCardHtml(entry, index) {
                const term = entry.term || '';
                let html = `<article class="card word" id="word-${index}"><div class="w-head">`;
                if (entry.clip) html += clipHtml(entry.clip, 'Hear it in the lesson');
                else if (entry.time !== null && entry.time !== undefined) html += `<span class="clock" data-no-speech>${clock(entry.time)}</span>`;
                html += jumpsHtml('vocabulary', entry.clip ? entry.clip.at : entry.time);
                // The word, its kind and its speaker stay together (a new row when
                // they do not fit); the kind and the speaker never part.
                html += `<div class="w-title"><h3 class="w-term">${esc(term)}</h3><span class="w-side">`;
                if (entry.pos) html += `<span class="w-pos" data-no-speech>${esc(entry.pos)}</span>`;
                html += playButton(term, 'Listen to ' + term) + '</span></div></div>';
                if (entry.definition) html += `<p class="def">${esc(entry.definition)}</p>`;
                const passage = entry.lesson || entry.lesson_example;
                if (passage) {
                    html += `<div class="lesson-ex"><div class="txt"><span class="src" data-no-speech>From the lesson</span>${highlightTerm(passage, term)}</div>${playButton(passage, 'Listen')}</div>`;
                }
                const examples = exampleItems(entry);
                if (examples.length) {
                    html += '<ul class="examples">' + examples.map(example => '<li>'
                        + (example.pattern ? `<span class="pat" data-no-speech>${esc(example.pattern)}</span> ` : '')
                        + highlightTerm(example.sentence, term) + '</li>').join('') + '</ul>';
                }
                if (entry.note) html += `<p class="note">${icons.bulb}<span>${esc(entry.note)}</span></p>`;

                const parts = [];
                if ((entry.countable || []).length || (entry.uncountable || []).length) parts.push(['forms', 'Countable / uncountable', formsHtml(entry)]);
                if ((entry.more_examples || []).length) {
                    parts.push(['more', 'More examples', '<p class="part-title" data-no-speech>More examples</p><ul class="examples">'
                        + entry.more_examples.map(s => `<li>${highlightTerm(s, term)}</li>`).join('') + '</ul>']);
                }
                const related = relatedHtml(entry);
                if (related) parts.push(['related', 'Synonyms & antonyms', related]);
                if (parts.length) {
                    html += '<div class="more-bar" data-no-speech>'
                        + parts.map(([id, name]) => `<button class="more-btn" type="button" data-part="${id}" aria-expanded="false">${name}</button>`).join('')
                        + '<button class="more-btn more-hide" type="button">Hide</button></div>';
                    html += parts.map(([id, , body]) => `<div class="more-part" data-part="${id}" hidden>${body}</div>`).join('');
                }
                return html + '</article>';
            }

            // Matching pairs: all the words, shuffled into rounds of about six;
            // the meanings are shuffled separately.
            function renderMatch(game) {
                const pool = shuffled(matchable);
                const roundCount = Math.ceil(pool.length / 6);
                const rounds = [];
                for (let r = 0, cursor = 0; r < roundCount; r++) {
                    const size = Math.floor(pool.length / roundCount) + (r < pool.length % roundCount ? 1 : 0);
                    rounds.push(pool.slice(cursor, cursor + size));
                    cursor += size;
                }
                let round = 0, misses = 0, picked = null;
                const missText = () => misses === 1 ? '1 mistake' : `${misses} mistakes`;

                function draw() {
                    const ids = rounds[round];
                    let html = `<div class="game-head" data-no-speech><span>Round ${round + 1} of ${rounds.length}</span><span class="game-score">${missText()}</span></div>`;
                    html += '<p class="game-hint" data-no-speech>Tap a word, then its meaning.</p>';
                    html += '<div class="match-board" data-no-speech><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile term" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].term)}</button>`).join('');
                    html += '</div><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile meaning" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].definition)}</button>`).join('');
                    html += '</div></div><div class="game-foot" data-no-speech></div>';
                    game.innerHTML = html;
                    picked = null;
                }

                function roundDone() {
                    const foot = game.querySelector('.game-foot');
                    if (round + 1 < rounds.length) {
                        foot.innerHTML = `<p>Round complete!</p><button class="game-btn" type="button" data-action="next-round">Next round</button>`;
                    } else {
                        foot.innerHTML = `<div class="summary"><p class="big">All ${pool.length} words matched</p><p>${missText()}</p>`
                            + '<button class="game-btn" type="button" data-action="restart">Play again</button></div>';
                    }
                    foot.querySelector('button').focus({ preventScroll: true });
                }

                game.addEventListener('click', event => {
                    const tile = event.target.closest('.tile');
                    if (tile && !tile.disabled) {
                        const side = tile.classList.contains('term') ? 'term' : 'meaning';
                        if (picked === tile) {
                            tile.setAttribute('aria-pressed', 'false');
                            picked = null;
                        } else if (!picked || picked.classList.contains(side)) {
                            if (picked) picked.setAttribute('aria-pressed', 'false');
                            picked = tile;
                            tile.setAttribute('aria-pressed', 'true');
                        } else {
                            const other = picked;
                            picked = null;
                            other.setAttribute('aria-pressed', 'false');
                            if (other.dataset.id === tile.dataset.id) {
                                [other, tile].forEach(t => { t.classList.add('done'); t.disabled = true; });
                                speak(vocabulary[Number(tile.dataset.id)].term);
                                if (!game.querySelector('.tile:not(.done)')) roundDone();
                            } else {
                                misses++;
                                game.querySelector('.game-score').textContent = missText();
                                [other, tile].forEach(t => {
                                    t.classList.remove('wrong');
                                    void t.offsetWidth; // restart the shake
                                    t.classList.add('wrong');
                                    setTimeout(() => t.classList.remove('wrong'), 450);
                                });
                            }
                        }
                        return;
                    }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next-round') { round++; draw(); }
                    if (action.dataset.action === 'restart') renderMatch(freshGame());
                });
                draw();
            }

            // Fill the gap: a new sentence, the word hidden, four options.
            function renderGap(game) {
                const order = shuffled(gapItems);
                let position = 0, score = 0;
                const missed = [];

                function draw() {
                    const { entry } = order[position];
                    const [before, after] = entry.gap.sentence.split(/_{3,}/);
                    let html = `<div class="game-head" data-no-speech><span>${position + 1} of ${order.length}</span><span class="game-score">${score} correct</span></div>`;
                    html += `<div class="card"><p class="gap-sentence">${esc(before)}<span class="blank" data-no-speech>&nbsp;</span>${esc(after || '')}</p>`;
                    html += '<div class="options" data-no-speech>'
                        + shuffled(entry.gap.options).map(o => `<button class="option" type="button" data-option="${esc(o)}">${esc(o)}</button>`).join('')
                        + '</div><div class="gap-result" hidden></div></div>';
                    game.innerHTML = html;
                }

                function answer(button) {
                    const { entry, index } = order[position];
                    const right = button.dataset.option === entry.gap.answer;
                    game.querySelectorAll('.option').forEach(b => {
                        b.disabled = true;
                        if (b.dataset.option === entry.gap.answer) b.classList.add('right');
                    });
                    if (right) score++;
                    else { button.classList.add('wrong'); missed.push(index); }
                    game.querySelector('.game-score').textContent = `${score} correct`;
                    const blank = game.querySelector('.blank');
                    blank.textContent = entry.gap.answer;
                    blank.classList.add('filled');
                    blank.removeAttribute('data-no-speech');
                    const full = entry.gap.sentence.replace(/_{3,}/, entry.gap.answer);
                    const last = position + 1 >= order.length;
                    const result = game.querySelector('.gap-result');
                    result.innerHTML = `<p class="verdict ${right ? 'ok' : 'no'}" data-no-speech>${right ? '✓ Correct' : `✗ The answer is “${esc(entry.gap.answer)}”`}</p>`
                        + `<p class="gap-def"><b>${esc(entry.term)}</b>: ${esc(entry.definition)}</p>`
                        + `<div class="gap-actions" data-no-speech>${playButton(full, 'Listen to the sentence')}`
                        + `<button class="game-btn secondary" type="button" data-word="${index}">See the word</button>`
                        + `<button class="game-btn" type="button" data-action="${last ? 'finish' : 'next'}">${last ? 'Finish' : 'Next'}</button></div>`;
