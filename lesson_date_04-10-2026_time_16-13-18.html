<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        /* Mistake grades, 1 (gravest) to 7: warm colours where the listener
           had trouble understanding (1-4), cool ones where the meaning was
           clear (5-7). The grade's number is always shown with its colour. */
        :root, :root[data-theme="light"], :root[data-theme="sepia"], :root[data-theme="mint"] {
            --g1: #b3261e; --g2: #d9480f; --g3: #c56200; --g4: #a67c00; --g5: #2a62a8; --g6: #5b7fa6; --g7: #5f6673;
        }

        @media (prefers-color-scheme: dark) {
            :root { --g1: #ff6b6b; --g2: #ff8547; --g3: #ffa23a; --g4: #f2c14e; --g5: #6ea8ff; --g6: #9bb3d4; --g7: #a3aabb; }
        }

        :root[data-theme="dark"], :root[data-theme="black"] {
            --g1: #ff6b6b; --g2: #ff8547; --g3: #ffa23a; --g4: #f2c14e; --g5: #6ea8ff; --g6: #9bb3d4; --g7: #a3aabb;
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        /* The section's symbol before its name, in the section's colour. */
        .tab-sym { flex: none; width: 16px; height: 16px; margin-right: -1px; color: var(--lane); }

        .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ---------------------------------------------------- mistake grades */
        .gr1 { --grade: var(--g1); } .gr2 { --grade: var(--g2); } .gr3 { --grade: var(--g3); } .gr4 { --grade: var(--g4); }
        .gr5 { --grade: var(--g5); } .gr6 { --grade: var(--g6); } .gr7 { --grade: var(--g7); }

        /* Marks (numbers, stripes) use the grade's colour; its words use a
           deeper "ink" of it, mixed toward the theme's text so they stay readable. */
        .gr {
            --grade-soft: color-mix(in srgb, var(--grade) 14%, var(--surface));
            --grade-ink: color-mix(in srgb, var(--grade) 66%, var(--text));
        }

        .mistake.gr { --sev: var(--grade); }

        /* The grade's number on its colour. */
        .grade-num {
            display: inline-grid;
            flex: none;
            place-items: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--grade);
            color: var(--surface);
            font-size: 0.7rem;
            font-style: normal;
            font-weight: 800;
            line-height: 1;
        }

        .absent .grade-num, .grade-num.absent { background: transparent; box-shadow: inset 0 0 0 1.5px var(--grade); color: var(--grade); }

        /* On a card: the number and the grade's name, in its colour. */
        .grade-badge {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            padding: 1px 9px 1px 2px;
            border-radius: 999px;
            background: var(--grade-soft);
            color: var(--grade-ink);
            font-size: 0.8rem;
            font-weight: 750;
            line-height: 1.35;
        }

        /* The scale, at the top of the section: every grade (the ones this
           lesson does not have are faded); "Hide" keeps only the numbers. */
        .grades { margin: -6px 0 14px; padding: 0 0 8px; border-bottom: 1px solid var(--border); }

        .grades-head { display: flex; gap: 8px; align-items: center; min-height: 28px; }

        .grades-title { color: var(--muted); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }

        .grades-short, .grades.closed .grades-long { display: none; }

        .grades.closed .grades-short { display: inline; }

        .grades-strip { display: none; flex-wrap: wrap; gap: 3px; }

        .grades.closed .grades-strip { display: inline-flex; }

        .grades-toggle { margin: -4px -4px -4px auto; padding: 4px 6px; border: 0; background: none; color: var(--accent); font: inherit; font-size: 0.8rem; font-weight: 650; cursor: pointer; }

        .grades-list { margin: 2px 0 0; padding: 0; list-style: none; }

        .grades.closed .grades-list, .grades.closed .grades-note { display: none; }

        .grades.closed { padding-bottom: 6px; }

        .grade-row { display: grid; grid-template-columns: 18px 1fr; gap: 7px; align-items: start; margin: 0 0 3px; color: var(--muted); font-size: 0.76rem; line-height: 1.4; }

        .grade-row .grade-num { margin-top: 0.5px; }

        .grade-row span b { color: var(--grade-ink); font-weight: 750; }

        .grade-row.absent { opacity: 0.55; }

        .grades-note { margin: 2px 0 2px 26px; color: var(--faint); font-size: 0.74rem; }

        /* Filters: All, then one chip per grade the lesson has (number and count). */
        .grade-chip { gap: 5px; padding-left: 6px; }

        .grade-chip[aria-pressed="true"] { border-color: var(--grade); background: var(--grade-soft); color: var(--text); }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .w-title { display: flex; flex: 1 1 auto; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-width: 0; }

        .w-side { display: flex; flex: 1 0 auto; gap: 8px; align-items: center; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;
            font-weight: 650;
            cursor: pointer;
        }

        .orig-toggle:hover { color: var(--accent); }

        .orig { margin: 6px 0 0; padding: 6px 9px; border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 0.88rem; font-style: italic; }

        .dialogue-tools { margin: 0 0 14px; }

        /* ------------------------------------------ mistake views and times */
        .viewbar { display: inline-flex; flex-wrap: wrap; gap: 2px; margin: 0 0 12px; padding: 3px; border-radius: 12px; background: var(--surface-2); }

        .view { min-height: 34px; padding: 4px 14px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-size: 0.88rem; font-weight: 650; cursor: pointer; }

        .view[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .ex-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 5px; color: var(--muted); font-size: 0.8rem; font-weight: 600; }

        .clock { padding: 0 6px; border-radius: 5px; background: var(--surface); color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }

        .sep { color: var(--faint); }

        .ex-why { margin: 6px 0 0 24px; color: var(--muted); font-size: 0.9rem; }

        .topic-head { display: flex; gap: 8px; align-items: center; margin: 24px 0 10px; font-size: 1.02rem; }

        .topic-head .clock { background: var(--surface-2); }

        .topic-count { margin-left: auto; color: var(--faint); font-size: 0.8rem; }

        /* ---------------------------------------------------- lesson audio */
        /* A clip of the recording: a small "▶ 4:02" pill that opens into a
           one-row player (pause, back 3 s, position, forward 3 s). */
        .clip {
            display: inline-flex;
            flex: none;
            align-items: center;
            max-width: 100%;
            height: 30px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            vertical-align: middle;
        }

        .clip button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 30px;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .clip button:hover { background: var(--accent-hover); }

        .clip button:focus-visible, .clip-bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

        .clip .clip-main { gap: 5px; padding: 0 10px 0 9px; font-size: 0.8rem; font-weight: 750; font-variant-numeric: tabular-nums; }

        .clip-main svg { width: 12px; height: 12px; }

        .clip .i-pause, .clip.playing .i-play { display: none; }

        .clip.playing .i-pause { display: block; }

        .clip-more { display: none; align-items: center; padding-right: 3px; }

        .clip.open .clip-more { display: inline-flex; }

        .clip .clip-skip { width: 30px; }

        .clip-skip svg { width: 20px; height: 20px; }

        .clip-bar { position: relative; flex: none; width: 76px; height: 30px; margin: 0 3px; cursor: pointer; touch-action: none; }

        .clip-bar::before, .clip-fill { content: ""; position: absolute; top: 13px; left: 0; height: 4px; border-radius: 2px; }

        .clip-bar::before { right: 0; background: var(--accent); opacity: 0.22; }

        .clip-fill { width: 0; background: var(--accent); }

        .clip-fill::after { content: ""; position: absolute; top: -3px; right: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

        .clip.failed { opacity: 0.45; }

        .clip-note {
            position: fixed;
            right: 16px;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            z-index: 9;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--text);
            color: var(--bg);
            font-size: 0.88rem;
            box-shadow: 0 6px 22px rgba(20, 28, 51, 0.3);
        }

        .clip-note[hidden] { display: none; }

        .line-tools { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 6px 0 0; }

        .d-head { margin: 0 0 12px; }

        .dialogue .d-head h3 { margin: 0 0 4px; }

        .d-head .ex-meta { margin: 0; }

        .d-head .clock { background: var(--surface-2); }

        .back-to-quiz {
            position: fixed;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            z-index: 6;
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 44px;
            padding: 8px 18px 8px 14px;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: var(--on-accent);
            box-shadow: 0 6px 22px rgba(20, 28, 51, 0.28);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            transform: translateX(-50%);
            cursor: pointer;
        }

        .back-to-quiz[hidden] { display: none; }

        .back-to-quiz svg { width: 18px; height: 18px; }

        /* Double-tap selects a word (below), so it must not zoom the page. */
        body { touch-action: manipulation; }

        /* ---------------------------------------------------------- themes */
        .hero-top { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin: 0 0 6px; }

        .hero-top .eyebrow { margin: 0; }

        .theme-btn {
            display: inline-flex;
            flex: none;
            gap: 5px;
            align-items: center;
            min-height: 30px;
            padding: 3px 10px 3px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.78rem;
            font-weight: 650;
            cursor: pointer;
        }

        .theme-btn svg { width: 15px; height: 15px; }

        .theme-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }

        .themes { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }

        .themes[hidden] { display: none; }

        .theme {
            display: inline-flex;
            gap: 7px;
            align-items: center;
            min-height: 34px;
            padding: 3px 11px 3px 5px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .theme[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }

        .swatch { position: relative; width: 22px; height: 22px; border-radius: 50%; background: var(--sw-bg); box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.35); }

        .swatch::after { content: ""; position: absolute; right: 1px; bottom: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--sw-accent); }

        /* ------------------------------------------------- word-card parts */
        .more-part { scroll-margin-top: 84px; }

        .more-bar.open .more-btn::after { content: none; }

        .more-hide { display: none; }

        .more-bar.open .more-hide { display: inline-flex; align-items: center; color: var(--muted); }

        .more-bar.open .more-hide::after { content: " \25B4"; }

        .tl-flash { animation: flash 1.4s ease-out; border-radius: 10px; }

        /* A card keeps its own rounded corners while it lights up. */
        .card.tl-flash { border-radius: var(--radius); }

        /* ----------------------------------------------------- word cards */
        /* Each word starts with a tinted title bar, the word itself the
           largest text on the card; cards stand clearly apart. */
        #panel-vocabulary .word {
            --card-side: 16px;
            margin-bottom: 18px;
            padding-top: 0;
            padding-right: var(--card-side);
            padding-left: var(--card-side);
            overflow: hidden;
            border-color: var(--border);
            border-color: color-mix(in srgb, var(--border) 65%, var(--accent) 35%);
        }

        #panel-vocabulary .word .w-head {
            margin: 0 calc(-1 * var(--card-side)) 12px;
            padding: 10px var(--card-side);
            border-bottom: 1px solid var(--border);
            background: var(--accent-soft);
        }

        #panel-vocabulary .w-term { color: var(--accent); font-size: 1.32rem; font-weight: 800; letter-spacing: -0.005em; }

        #panel-vocabulary .w-head .clip { background: var(--surface); }

        @media (max-width: 520px) {
            #panel-vocabulary .word { --card-side: 10px; margin-bottom: 16px; }
            #panel-vocabulary .word .w-head { margin-bottom: 10px; padding-top: 9px; padding-bottom: 9px; }
            #panel-vocabulary .w-term { font-size: 1.24rem; }
        }

        /* ------------------------------------------------------- timeline */
        /* A thin bar a little in from the right edge (phone screens curve at
           the edge): the lesson's time from top to bottom. It starts under
           the section names (the page sets --tl-top to follow the tabs) and
           ends above "Go back" while that is shown. */
        .timeline { --tl-top: 72px; --tl-bottom: 14px; --tl-inset: 10px; }

        .timeline.has-back { --tl-bottom: 54px; }

        [data-lane="mistakes"] { --lane: var(--major); }
        [data-lane="vocabulary"] { --lane: var(--accent); }
        [data-lane="dialogues"] { --lane: var(--ins-text); }

        .tl-rail {
            position: fixed;
            top: var(--tl-top);
            right: var(--tl-inset);
            bottom: calc(var(--tl-bottom) + env(safe-area-inset-bottom, 0px));
            z-index: 8;
            width: 30px;
            cursor: ns-resize;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .tl-axis { position: absolute; top: 32px; bottom: 10px; left: 50%; width: 10px; margin-left: -5px; }

        .tl-axis::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; border-radius: 1px; background: var(--border); }

        .tl-ticks i { position: absolute; left: 1px; width: 8px; height: 2px; margin-top: -1px; border-radius: 1px; background: var(--lane, var(--faint)); opacity: 0.6; }

        .tl-here { position: absolute; left: 0; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }

        .tl-here[hidden] { display: none; }

        /* Held: one narrow bar per section, the open section on the right, under the finger. */
        .tl-panel {
            position: fixed;
            top: var(--tl-top);
            right: calc(var(--tl-inset) - 5px);
            bottom: calc(var(--tl-bottom) + env(safe-area-inset-bottom, 0px));
            z-index: 7;
            display: flex;
            gap: 1px;
            width: 120px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--border);
            box-shadow: -8px 0 26px rgba(20, 28, 51, 0.18);
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .tl-panel[hidden] { display: none; }

        .tl-lane { position: relative; flex: 1 1 0; min-width: 0; border-radius: 13px; background: var(--surface); }

        .tl-lane.target { background: var(--accent-soft); }

        .tl-name { position: absolute; top: 7px; left: 50%; display: grid; place-items: center; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--lane); color: var(--surface); font-size: 0.66rem; font-weight: 800; }

        .tl-name .sym { width: 12px; height: 12px; }

        .tl-mark { position: absolute; left: -2px; width: 14px; height: 14px; margin-top: -7px; border: 2px solid var(--surface); border-radius: 50%; background: var(--lane); box-shadow: 0 1px 4px rgba(20, 28, 51, 0.3); }

        .tl-mark[hidden] { display: none; }

        /* Over the bars (their flex order also sets the order they are painted in). */
        .tl-guide, .tl-thumb, .tl-time { z-index: 2; }

        .tl-guide { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed var(--accent); opacity: 0.6; }

        .tl-thumb { position: absolute; width: 22px; height: 22px; border: 3px solid var(--surface); border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(20, 28, 51, 0.35); }

        /* The time under the finger, just above the fingertip. */
        .tl-time {
            position: absolute;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--on-accent);
            font-size: 0.8rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            box-shadow: 0 3px 10px rgba(20, 28, 51, 0.3);
        }

        /* While the panel is held, the section narrows to fit beside it. */
        html.tl-open main { padding-right: var(--tl-room, 0px); }

        .tl-rail, .tl-panel { transition: bottom 0.18s ease-out; }

        /* ------------------------------------------------------- go back */
        /* Under the timeline's end, in the same lane: back to the section
           (and the exact place) the reader came from. Its small badge is
           the section it goes back to. */
        .go-back {
            position: fixed;
            right: calc(var(--tl-inset, 10px) - 1px);
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            z-index: 8;
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--surface);
            color: var(--accent);
            box-shadow: 0 2px 10px rgba(20, 28, 51, 0.22);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .go-back[hidden] { display: none; }

        .go-back svg { width: 18px; height: 18px; }

        .go-back::before { content: ""; position: absolute; inset: -4px -6px -8px -10px; }

        .go-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .go-to {
            position: absolute;
            top: -7px;
            left: -8px;
            display: grid;
            place-items: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--lane, var(--accent));
            color: var(--surface);
            box-shadow: 0 0 0 2px var(--bg);
        }

        .go-to .sym { width: 11px; height: 11px; }

        /* ------------------------------------------ jumps between sections */
        /* Beside a time: the same moment in the other two sections, marked
           with their symbols and colours (as on the tabs and the held
           timeline), the section's letter small in a corner. */
        .jump-set { display: inline-flex; flex: none; gap: 9px; align-items: center; margin-left: 2px; vertical-align: middle; }

        .jump-btn .sym { width: 15px; height: 15px; }

        .jump-letter {
            position: absolute;
            right: -5px;
            bottom: -4px;
            min-width: 11px;
            height: 11px;
            padding: 0 2px;
            border-radius: 4px;
            background: var(--surface);
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--lane) 45%, transparent);
            color: var(--lane);
            font-size: 7.5px;
            font-weight: 800;
            line-height: 11px;
            text-align: center;
        }

        .jump-btn {
            position: relative;
            display: inline-grid;
            place-items: center;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1.5px solid var(--lane);
            border-color: color-mix(in srgb, var(--lane) 55%, transparent);
            border-radius: 50%;
            background: var(--surface);
            color: var(--lane);
            font: inherit;
            font-size: 0.7rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .jump-btn::before { content: ""; position: absolute; inset: -4px -3px; }

        .jump-btn:hover { background: color-mix(in srgb, var(--lane) 12%, var(--surface)); }

        .jump-btn:focus-visible { outline: 2px solid var(--lane); outline-offset: 1px; }

        /* A highlighted phrase that has its own word card: tap to open it. */
        mark.expr[data-vocab] {
            cursor: pointer;
            text-decoration-line: underline;
            text-decoration-style: dotted;
            text-decoration-color: var(--accent);
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
            -webkit-tap-highlight-color: transparent;
        }

        mark.expr.pressing { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }

        /* The lesson time in the header: a tap switches Moscow time / own time. */
        .tz-btn {
            display: inline-block;
            margin: -1px 0;
            padding: 0 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: inherit;
            font: inherit;
            letter-spacing: inherit;
            text-transform: inherit;
            line-height: 1.45;
            white-space: nowrap;
            cursor: pointer;
        }

        .tz-btn .tz { color: var(--accent); }

        .tz-time { white-space: nowrap; }

        /* A lane on the right for the timeline, so it never covers the page. */
        @media (max-width: 860px) {
            .page { padding-right: 48px; }
        }

        /* Phones: less space lost on the left, where nothing needs it. */
        @media (max-width: 520px) {
            .page { padding-left: 8px; }
            .tabs { margin: 14px -48px 0 -8px; padding: 10px 8px; }
            .card { padding: 12px 10px; }
            .mistake { border-left-width: 3px; }
            .pair { padding: 8px; }
            .said, .fixed { gap: 5px; }
            .mark-icon { width: 13px; }
            .ex-why { margin-left: 18px; }
            .word { padding: 12px 10px; }
        }

        @media (max-width: 520px) {
            body { font-size: 16px; }
            .card { padding: 14px; }
            #panel-vocabulary { font-size: 15px; }
            .word { padding: 12px; }
            .w-term { font-size: 1.08rem; }
            .bubble { max-width: 94%; }
            .tab { font-size: 0.88rem; }
        }

        /* Phones: the three tabs, with their symbols and counts, stay in one
           row inside the screen (a wider row makes the phone zoom the page out). */

        const LESSON = {"version":4,"meta":{"title":"From Veterinary Work to IELTS Success","topics":["Work as a veterinarian","Learning Python and coding","English learning journey and IELTS","Writing task preparation and ideas","Developing an essay plan","Refining the school phone example","Grammar and punctuation rules","IELTS writing requirements and scores","Reviewing class materials and books","Exam locations and study schedule"],"date":"4 October 2026","time":"16:13","start_utc":1791105198},"topics":[{"title":"Work as a veterinarian","at":0,"time":0.0},{"title":"Learning Python and coding","at":876,"time":437.1},{"title":"English learning journey and IELTS","at":1654,"time":841.9},{"title":"Writing task preparation and ideas","at":3675,"time":1924.8},{"title":"Developing an essay plan","at":4202,"time":2192.9},{"title":"Refining the school phone example","at":6478,"time":3774.3},{"title":"Grammar and punctuation rules","at":7399,"time":4456.0},{"title":"IELTS writing requirements and scores","at":8711,"time":5235.7},{"title":"Reviewing class materials and books","at":9485,"time":5572.7},{"title":"Exam locations and study schedule","at":9975,"time":5776.7}],"mistakes":[{"grade":3,"severity":"high","label":"Sentence structure","rule":"The verb 'started' needs an object or a gerund. You need 'learning' to show what activity you began.","examples":[{"quote":"started a lot about AI","fix":"started learning a lot about AI","context":"I thought about it and somehow I found myself on that course studying. After that, I started a lot about AI and the IT market.","context_fix":"I thought about it and somehow I found myself on that course studying. After that, I started learning a lot about AI and the IT market.","why":"The verb 'started' needs an object or a gerund. You need 'learning' to show what activity you began.","time":743.4,"at":1445,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/073131-074970.webm","at":731.5,"dur":18.39}}]},{"grade":3,"severity":"high","label":"Tense","rule":"Use 'don't know' for uncertainty. Also, use the present simple 'continue' to describe a general situation or future possibility.","examples":[{"quote":"still would know if I'm continue doing this","fix":"still don't know if I continue doing this","context":"My background is biology and veterinary fields, so I thought to create something in this field. I still would know if I'm continue doing this.","context_fix":"My background is biology and veterinary fields, so I thought to create something in this field. I still don't know if I continue doing this.","why":"Use 'don't know' for uncertainty. Also, use the present simple 'continue' to describe a general situation or future possibility.","time":786.5,"at":1535,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/077414-079173.webm","at":774.2,"dur":17.59}}]},{"grade":3,"severity":"high","label":"Word choice","rule":"In this context, 'intrusion' is the correct term for entering someone's private space or 'free zone' without permission.","examples":[{"quote":"the entrance in their free zone","fix":"an intrusion into their free zone","context":"Every phone is like their free time and free zone, so if I supervise them, it could be the entrance in their free zone.","context_fix":"Every phone is like their free time and free zone, so if I supervise them, it could be an intrusion into their free zone.","why":"In this context, 'intrusion' is the correct term for entering someone's private space or 'free zone' without permission.","time":2788.0,"at":4982,"topic":4,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/277620-279668.webm","at":2776.3,"dur":20.48}}]},{"grade":3,"severity":"high","label":"Word choice","rule":"You are talking about progress. 'Improving' means getting better, while 'proving' means showing that something is true.","examples":[{"quote":"proving my, I mean, it's proving my speaking part","fix":"improving my speaking part"," hy":"In direct questions, we use inversion. Instead of 'it could', use 'could it' to form the question correctly.","time":2711.3,"at":4874,"topic":4,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/270990-271601.webm","at":2710.0,"dur":6.11}}]},{"grade":4,"severity":"high","label":"Sentence structure","rule":"In direct questions, we use inversion: 'could it' instead of 'it could'. You're asking a question, so the verb comes before the subject.","examples":[{"quote":"How it could be. affect me","fix":"How could it affect me","context":"How it could be. Affect me? Imagine what if they start ordering drugs on the Internet.","context_fix":"How could it affect me? Imagine what if they start ordering drugs on the Internet.","why":"In direct questions, we use inversion: 'could it' instead of 'it could'. You're asking a question, so the verb comes before the subject.","time":2930.3,"at":5266,"topic":4,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/293072-294174.webm","at":2930.9,"dur":11.02}}]},{"grade":4,"severity":"high","label":"Sentence structure","rule":"When asking a question directly, the verb 'is' should come before the subject 'it'.","examples":[{"quote":"why it's possible","fix":"why is it possible","context":"A lot of people try to explain their train of thought, like why it's possible? But let me tell you what.","context_fix":"A lot of people try to explain their train of thought, like why is it possible? But let me tell you what.","why":"When asking a question directly, the verb 'is' should come before the subject 'it'.","time":3002.3,"at":5405,"topic":4,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/299572-300707.webm","at":2995.9,"dur":11.35}}]},{"grade":4,"severity":"high","label":"Preposition","rule":"When referring to the illegal trade of substances, use the phrase 'deal in' followed by the substance.","examples":[{"quote":"what he was dealing drugs","fix":"dealing in drugs","context":"I knew a guy who wa icle like 'an' before it.","time":144.0,"at":304,"topic":0,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/014518-015288.webm","at":145.3,"dur":7.7}},{"quote":"just starting the Python","fix":"just starting Python","context":"I'm not a pro or I'm not working in this field, but I'm doing it for myself as a hobby. I'm just starting the Python.","context_fix":"I'm not a pro or I'm not working in this field, but I'm doing it for myself as a hobby. I'm just starting Python.","why":"We don't use the definite article 'the' before the names of programming languages like Python.","time":497.4,"at":984,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/049582-050518.webm","at":495.9,"dur":9.36}},{"quote":"it is deal for me","fix":"it is a deal for me","context":"They asked for seven plus for each section and it is deal for me and I'd like to do it.","context_fix":"They asked for seven plus for each section and it is a deal for me and I'd like to do it.","why":"The word 'deal' is a countable noun in this context, so it requires the indefinite article 'a' before it.","time":1243.1,"at":2335,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/123836-124758.webm","at":1238.5,"dur":9.22}},{"quote":"started couple of years ago","fix":"started a couple of years ago","context":"My IELTS journey started couple of years ago. Actually, I had this idea to pass the IELTS exam in 2022.","context_fix":"My IELTS journey started a couple of years ago. Actually, I had this idea to pass the IELTS exam in 2022.","why":"In English, we use the indefinite article 'a' before the phrase 'couple of' when it functions as a quantifier.","time":1332.4,"at":2511,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/133138-134294.webm","at":1331.6,"dur":11.56}},{"quote":"was in the rush","fix":"was in a rush","context":"I studied it quite well. I checked the answers after and I found out that I started well but I was in th etition by using unauthorized materials.","pattern":""}],"more_examples":["He tried to cheat on the math quiz by looking at his neighbor's paper.","The software is designed to detect if anyone tries to cheat on the certification test.","If you cheat on the entrance exam, you could be disqualified from the program."],"synonyms":["break the rules","manipulate"],"antonyms":["play fair","follow the rules","be honest","study independently"],"gap":{"sentence":"The student was disqualified from the science competition because he tried to _____ the final project.","answer":"cheat on","options":["cheat on","study for","prepare for","practice for"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/499436-500145.webm","at":4994.6,"dur":7.09}},{"term":"connector","pos":"noun","definition":"A word or phrase used to link different parts of a sentence or ideas in a text.","time":5067.7,"lesson":"You correctly put a comma after 'however.' It was the right choice because 'however' is a connector.","examples":[{"sentence":"Words like 'furthermore' and 'nevertheless' are common connectors in academic writing.","pattern":"common connectors"},{"sentence":"You should use a connector to show the relationship between these two sentences.","pattern":"use a connector"},{"sentence":"The essay lacks proper connectors, making it difficult to follow the logic.","pattern":"lack + connectors"},{"sentence":"I'm looking for a better connector to link my introduction to the main body.","pattern":"connector + to link"}],"countable":[{"meaning":"A word or phrase used to link different parts of a sentence or ideas in a text.","example":"You correctly put a comma after 'however.' It was the right choice because 'however' is a connector.","lesson":true},{"meaning":"A device or part that joins two things together","example":"The car has a heavy-duty connector for the trailer."},{"meaning":"A person or thing that connects two different groups or systems","example":"She acted as a connector b
