ed a collection of poems for her first book.","pattern":"compile a collection of"}],"more_examples":["Could you compile a list of everyone who attended the meeting?","The app compiles your workout history into a monthly summary.","We need to compile all the necessary documents before the interview."],"synonyms":["collect","gather","assemble","put together","organize","collate","aggregate"],"antonyms":["scatter","disperse","distribute"],"gap":{"sentence":"Before the meeting starts, I need to _____ all the feedback from our clients into a single document.","answer":"compile","options":["compile","describe","predict","calculate"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/557914-558112.webm","at":5579.3,"dur":1.98}},{"term":"keep track of","pos":"phrasal verb","definition":"To monitor, follow, or stay informed about the progress or status of something.","time":5704.7,"lesson":"That is why I don't keep track of books they issue. While they are usable, they are different from the reality because the listening tests can be overcomplicated.","examples":[{"sentence":"I use a spreadsheet to keep track of my monthly expenses.","pattern":"keep track of + noun"},{"sentence":"It's hard to keep track of all the different deadlines.","pattern":"It's hard to + keep track of"},{"sentence":"Can you keep track of the time while I'm presenting?","pattern":"keep track of + the time"},{"sentence":"The app helps you keep track of your daily water intake.","pattern":"help (someone) keep track of"}],"more_examples":["I have a lot of friends moving to different cities, so it's hard to keep track of where everyone is.","The GPS helps you keep track of your location while driving in a new city.","It's difficult to keep track of all the changes made to the project plan."],"synonyms":["monitor","follow","keep tabs on","stay updated on","observe","record","note","trace"],"antonyms":["ignore","lose track of","overlook","neglect"],"gap":{"sentence":"Since I have so many different projects running at once, I need a way to _____ their progress.","answer":"keep track of","options":["keep track of","finish","ignore","forget"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/570378-570651.webm","at":5703.9,"dur":2.73}},{"term":"overcomplicated","pos":"adjective","definition":"made more difficult or complex than necessary, especially regarding instructions or tasks.","time":5720.7,"lesson":"For example, the listening tests in the books are a little bit overcomplicated. In recent years, the listening section of the real test has actually been simplified.","examples":[{"sentence":"The instructions for assembling the chair were overcomplicated and confusing.","pattern":"overcomplicated + adjective"},{"sentence":"You don't need to make the design overcomplicated; keep it simple.","pattern":"make + object + overcomplicated"},{"sentence":"The software's interface is overcomplicated for a beginner to use.","pattern":"overcomplicated for [someone] to [verb]"},{"sentence":"I think the plot of the movie became overcomplicated in the final act.","pattern":"become + overcomplicated"}],"more_examples":["The recipe was overcomplicated; I could have just boiled the pasta.","The company's new hiring process is overcomplicated and takes weeks to complete."],"synonyms":["convoluted","unnecessarily complex","overengineered","labyrinthine","tortuous"],"antonyms":["simple","straightforward","uncomplicated","clear","user-friendly"],"gap":{"sentence":"The recipe was so _____ that I spent three hours preparing a dish that should have taken twenty minutes.","answer":"overcomplicated","options":["overcomplicated","efficient","quick","convenient"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/572012-572549.webm","at":5720.2,"dur":5.37}},{"term":"straightforward","pos":"adjective","definition":"Easy to do or understand; not complicated or difficult.","time":5746.7,"lesson":"The listening section is not that challenging anymore; it is pretty straightforward. On the other hand, the reading section has become more difficult.","examples":[{"sentence":"The instructions for assembling the desk were very straightforward.","pattern":"straightforward + noun"},{"sentence":"I prefer a straightforward answer rather than a long, complicated explanation.","pattern":""},{"sentence":"The process is quite straightforward: just fill out the form and click submit.","pattern":"quite straightforward"},{"sentence":"He gave me a straightforward explanation of how the new software works.","pattern":"straightforward + noun phrase"}],"more_examples":["The rules of the game are very straightforward.","I'm looking for a straightforward way to improve my speaking skills.","It was a straightforward task that only took me ten minutes."],"synonyms":["simple","easy","uncomplicated","clear","direct","plain","basic"],"antonyms":["complicated","complex","difficult","convoluted","tricky"],"gap":{"sentence":"I appreciate that the application process is quite _____ because I don't have much time to deal with complex paperwork.","answer":"straightforward","options":["straightforward","tedious","confusing","lengthy"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/574618-574956.webm","at":5746.5,"dur":3.38}},{"term":"stick to","pos":"phrasal verb","definition":"To continue doing something as planned or to not change a decision or schedule.","time":5881.7,"lesson":"I don't really need to stick to a specific date, so I can move it a little bit. I think March would be better.","examples":[{"sentence":"We need to stick to the original plan despite the problems we encountered.","pattern":"stick to + noun"},{"sentence":"It's hard to stick to a diet when there are so many delicious snacks.","pattern":"stick to + -ing"},{"sentence":"If you want to pass the exam, you must stick to your study schedule.","pattern":"stick to + possessive + noun"},{"sentence":"I'm trying to stick to my budget this month.","pattern":""}],"more_examples":["The coach told the players to stick to the game plan.","I'm trying to stick to my New Year's resolutions.","Even though it was tempting to stop, she decided to stick to her training routine."],"synonyms":["adhere to","follow through with","keep to","stay with","maintain","persist with","remain faithful to"],"antonyms":["deviate from","abandon","break","change","diverge from"],"gap":{"sentence":"Even though we are running late, we should _____ the itinerary to ensure we see all the sights.","answer":"stick to","options":["stick to","abandon","forget","cancel"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/588170-588461.webm","at":5881.9,"dur":2.91}},{"term":"see where it goes","pos":"expression","definition":"To try something out and wait to see how it develops before making a final decision.","time":5919.7,"lesson":"We can start with one class per week and see where it goes. If, in two or three months, I see that it's clearly not enough, I will tell you.","examples":[{"sentence":"I'm not sure if I want to move to a new city, but I'll take the job and see where it goes.","pattern":"take [something] and see where it goes"},{"sentence":"Let's start the project on a small scale and see where it goes.","pattern":"start [something] and see where it goes"},{"sentence":"I'm just dating him for now to see where it goes.","pattern":"see where it goes (regarding a relationship)"},{"sentence":"We can try this new marketing strategy and see where it goes.","pattern":"try [something] and see where it goes"}],"more_examples":["I'm going to start taking some acting classes and see where it goes.","We're just roommates for now, but we'll see where it goes.","I've started a blog to share my travel stories and see where it goes."],"synonyms":["wait and see","see how things develop","keep it open-ended","play it by ear","see what happens"],"antonyms":["make a firm commitment","decide right away","set in stone","make a final decision"],"gap":{"sentence":"I'm not ready to commit to a long-term contract yet, so I'll start working with them part-time and _____.","answer":"see where it goes","options":["see where it goes","finish the job","quit the position","make a promise"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/591955-592034.webm","at":5919.7,"dur":0.79}},{"term":"reach out","pos":"phrasal verb","definition":"To contact someone, usually via phone, email, or social media, to communicate or ask for something.","time":5960.7,"lesson":"I'll reach out on Telegram and send you a review. We can pick the next date on Telegram as well.","examples":[{"sentence":"Please reach out to me if you have any questions about the project.","pattern":"reach out + to + person"},{"sentence":"I'm going to reach out to the hiring manager to follow up on my application.","pattern":"reach out to [someone] to [verb]"},{"sentence":"Feel free to reach out at any time; I'm happy to help.","pattern":"feel free to reach out"},{"sentence":"The company reached out to several influencers to promote the new product.","pattern":"reach out (past tense)"}],"more_examples":["I'm planning to reach out to some local businesses for sponsorship.","If you're feeling overwhelmed, don't hesitate to reach out to your mentor.","We should reach out to the neighbors to see if they're okay after the storm."],"synonyms":["get in touch with","contact","message","call","email","connect with","approach"],"antonyms":["ignore","avoid"],"gap":{"sentence":"Since I haven't heard from the landlord about the repairs, I think I should _____ to him tomorrow.","answer":"reach out","options":["reach out","look into","set up","give up"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/595952-596166.webm","at":5959.6,"dur":2.14}}],"dialogues":[{"title":"A conversation about veterinary neurology","lines":[{"speaker":"A","text":"Do you have a stable internet connection? I'm using a VPN right now, but if the connection stays bad, I'll switch to Google Meet.","highlights":["stable internet connection"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/000484-000867.webm","at":4.9,"dur":3.83},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/001774-002841.webm","at":17.8,"dur":10.67}]},{"speaker":"B","text":"I don't have any issues on my end. By the way, that's a lovely pipe in your background. Is that in your apartment or a house?","highlights":["on my end"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/003106-003663.webm","at":31.2,"dur":5.57},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/004696-005036.webm","at":47.3,"dur":3.4}]},{"speaker":"A","text":"It's in my kitchen. I'm originally from Saint Petersburg, but I'm currently living in Moscow. I rent an apartment there.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/005132-006169.webm","at":51.4,"dur":10.37},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/006398-006703.webm","at":64.1,"dur":3.05}]},{"speaker":"B","text":"You look like a software developer because of your background, but I actually work as a veterinarian.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/006996-008273.webm","at":70.1,"dur":12.77}]},{"speaker":"A","text":"Oh, you're a vet? Are you a doctor at a clinic? How long have you been practicing?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/008278-008720.webm","at":82.9,"dur":4.42},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/009824-010155.webm","at":98.3,"dur":3.31}]},{"speaker":"B","text":"I've been practicing for three years. I specialize in neurology and neurosurgery for dogs and cats.","highlights":["specialize in"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/010166-011076.webm","at":101.8,"dur":9.1}]},{"speaker":"A","text":"That's quite unusual. Usually, people only bring their cats in for minor issues like skin problems. What kind of problems do you deal with?","highlights":["deal with"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/012430-013881.webm","at":124.4,"dur":14.51}]},{"speaker":"B","text":"I handle seizures, lameness, heart pain, and neck or head pain. I perform surgeries on the spinal cord and the brain.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/017040-017548.webm","at":170.6,"dur":5.08},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/019930-020565.webm","at":199.4,"dur":6.35}]},{"speaker":"A","text":"Do you own your own clinic, or do you work for a specific practice?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/021166-021762.webm","at":211.8,"dur":5.96}]},{"speaker":"B","text":"I don't own it. I work at a specific clinic that deals mostly with neurological problems. It's not very common for a regular person to hear about.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/023280-024703.webm","at":232.9,"dur":14.23}]},{"speaker":"A","text":"Do you only treat cats and dogs? Do you work with exotic animals or livestock like horses?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/025806-026094.webm","at":258.2,"dur":2.88}]},{"speaker":"B","text":"No, I only deal with dogs and cats. I don't work with exotic animals or livestock.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/027600-028873.webm","at":276.2,"dur":12.73}]},{"speaker":"A","text":"Do you have a lot of patients with mobility issues? You mentioned something about them being lame.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/029558-030271.webm","at":295.7,"dur":7.13},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/030804-031283.webm","at":308.1,"dur":4.79}]},{"speaker":"B","text":"Yes, there are many patients with limb problems that cause lameness, often due to physical injuries.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/031440-032835.webm","at":314.5,"dur":13.95}]},{"speaker":"A","text":"What is your work schedule like?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/033746-034209.webm","at":337.7,"dur":4.63}]},{"speaker":"B","text":"I work 12-hour shifts, usually two or three times a week. That's about 12 to 15 shifts a month, so I spend a lot of hours at the clinic.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/034584-035807.webm","at":345.9,"dur":12.23},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/037352-037857.webm","at":373.6,"dur":5.05}]}],"time":4.9,"topic":0},{"title":"Learning Python and starting startups","lines":[{"speaker":"A","text":"I used to work at night, but I skip it now. I don't really work with doctors much; I work more with developers in the IT sphere.","highlights":["IT sphere"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/037692-038438.webm","at":377.0,"dur":7.46},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/040228-041256.webm","at":402.4,"dur":10.28}]},{"speaker":"B","text":"I actually worked with a plastic surgeon in Kamchatka about three years ago. He was one of the best, and people from neighboring regions would come to Petropavlovsk to see him.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/041422-042259.webm","at":414.3,"dur":8.37},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/042850-043355.webm","at":428.6,"dur":5.05}]},{"speaker":"A","text":"I do a little bit of Python programming. I started it as a hobby about six months ago, but I'm not a professional. I'm just doing it for myself.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/044648-045240.webm","at":446.6,"dur":5.92},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/047232-048118.webm","at":472.4,"dur":8.86}]},{"speaker":"B","text":"What made you decide to learn Python? I mean, what came first—the chicken or the egg? Why did you choose it?","highlights":["the chicken or the egg"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/052128-052638.webm","at":521.4,"dur":5.1},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/053564-054233.webm","at":535.7,"dur":6.69}]},{"speaker":"A","text":"I studied Python first, and then I found out about Cloud Code. I'm not preparing for a job interview; I just enjoy typing commands and scripts.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/054256-055980.webm","at":542.7,"dur":17.24}]},{"speaker":"B","text":"I did the same thing three years ago. Back then, there were no AIs to help. Nobody explained how to actually run a script, which was a real problem.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/058492-058934.webm","at":585.0,"dur":4.42},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/060682-061672.webm","at":606.9,"dur":9.9}]},{"speaker":"A","text":"It's really helpful to study these things. I use them all the time. Whenever you get into coding, you need a reason to do it.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/063314-064746.webm","at":633.2,"dur":14.32}]},{"speaker":"B","text":"I started by watching Y Combinator videos. They prepare startups for IPOs. I loved the idea of creating a software product, which led me to this course.","highlights":["software product"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/068610-069452.webm","at":686.2,"dur":8.42},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/071530-072815.webm","at":715.5,"dur":12.85}]},{"speaker":"A","text":"What motivated you to start your own startup?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/076332-076648.webm","at":763.4,"dur":3.16}]}],"time":377.0,"topic":0},{"title":"Startup ideas and English learning journeys","lines":[{"speaker":"A","text":"If you were to start a company, do you have any ideas? My background is in biology and veterinary medicine, so I'd want to stay in that field.","highlights":["stay in that field"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/076792-077923.webm","at":768.0,"dur":11.31}]},{"speaker":"B","text":"I have a few notes on my phone, but I haven't landed on the perfect idea yet. Is there anything specific on your mind?","highlights":["landed on"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/081516-082746.webm","at":815.3,"dur":12.3}]},{"speaker":"A","text":"How did your English journey begin? I started in sixth grade when my father told me to study in English, and later I spent a month in Salisbury.","highlights":["English journey"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/084400-086075.webm","at":844.1,"dur":16.75}]},{"speaker":"B","text":"I practiced a lot by talking to friends. My best friend is from Sri Lanka, where they speak Sinhala, not Swahili.","highlights":["practiced a lot"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/090608-091514.webm","at":906.2,"dur":9.06},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/092220-092618.webm","at":922.3,"dur":3.98}]},{"speaker":"A","text":"I watched a lot of YouTube, especially Khan Academy. They explain almost everything, like a library of videos for biology and cells.","highlights":["library of videos"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/098456-100125.webm","at":984.7,"dur":16.69}]},{"speaker":"B","text":"I watched 'Friends' and several movies, but if I had to pick one main source of input, it would be talking to people.","highlights":["main source"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/107750-109400.webm","at":1077.6,"dur":16.5},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/111484-112448.webm","at":1114.9,"dur":9.64}]},{"speaker":"A","text":"Our paths are quite different then. I'm actually looking to join an international veterinary association, so I need to get a 7 on my IELTS.","highlights":["quite different"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/113746-114470.webm","at":1137.6,"dur":7.24},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/116950-118569.webm","at":1169.6,"dur":16.19}]}],"time":768.0,"topic":1},{"title":"IELTS goals and mock test results","lines":[{"speaker":"A","text":"I have this crazy requirement where every section of my IELTS score needs to be at least a 7.0.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/119612-120765.webm","at":1196.2,"dur":11.53}]},{"speaker":"B","text":"Is that really such a big deal? I've never seen an organization with that specific requirement before.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/121318-122671.webm","at":1213.3,"dur":13.53}]},{"speaker":"A","text":"I rechecked the requirements, and they definitely asked for a 7.0 plus in each section. I really want to achieve that.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/122986-124407.webm","at":1230.0,"dur":14.21}]},{"speaker":"B","text":"So, what's going to change in your life once you get your certificate with perfect scores?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/125524-126317.webm","at":1255.3,"dur":7.93}]},{"speaker":"A","text":"I hope to apply to that association so I can visit them. Honestly, I'm not even sure if I'll stay in Russia or work at the same clinic.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/128912-130279.webm","at":1289.3,"dur":13.67}]},{"speaker":"B","text":"You need to find some motivation. I started my IELTS journey a few years ago, but I had to put it off because of life's problems.","highlights":["put it off"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/132066-133530.webm","at":1320.8,"dur":14.64}]},{"speaker":"A","text":"I have the passion and motivation now. I'm ready to do it, even if you say it will be hard.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/137146-138644.webm","at":1371.7,"dur":14.98}]},{"speaker":"B","text":"It's definitely doable, but it's going to take some effort. Usually, people are better at reading than listening, but you need to put in the time.","highlights":["put in the time"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/138656-140206.webm","at":1386.8,"dur":15.5}]},{"speaker":"A","text":"I did the reading and listening sections in a mock test. My reading score was a 6.5, but it was my first experience.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/144174-145791.webm","at":1441.8,"dur":16.17}]},{"speaker":"A","text":"I started well, but I was in a rush at the end. I think I have a time limit problem and need more practice.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/147172-147997.webm","at":1471.8,"dur":8.25},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/148198-149736.webm","at":1482.2,"dur":15.38}]},{"speaker":"A","text":"Some questions were tricky, especially in the multiple-choice section where I had to choose the correct answer.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/152234-153730.webm","at":1522.5,"dur":14.96}]}],"time":1196.2,"topic":2},{"title":"Reviewing IELTS Reading and Listening results","lines":[{"speaker":"A","text":"I used the simple past correctly, but I just forgot the choice form for one of the questions.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/158374-159111.webm","at":1583.8,"dur":7.37}]},{"speaker":"B","text":"Don't worry, that happens to the best of us. You got a 6.5, but I'm sure you can train yourself to get a 7.","highlights":["happens to the best of us"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/158962-159451.webm","at":1589.7,"dur":4.89},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/160046-161695.webm","at":1600.6,"dur":16.49}]},{"speaker":"A","text":"For a first attempt, it's natural to feel like you're just guessing what you have to deal with.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/162322-163333.webm","at":1623.3,"dur":10.11}]},{"speaker":"B","text":"The difficulty level progresses. Some people waste too much time on the first section and run out of time for the third one.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/164054-165552.webm","at":1640.6,"dur":14.98}]},{"speaker":"A","text":"The academic vocabulary didn't really intimidate me, but I did misunderstand a few important words that changed the meaning of the sentences.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/167764-169139.webm","at":1677.7,"dur":13.75},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/169376-170828.webm","at":1694.0,"dur":14.52}]},{"speaker":"B","text":"That's a solid foundation. It means you shouldn't have too much trouble with the writing section.","highlights":["solid foundation"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/173270-174336.webm","at":1732.8,"dur":10.66}]},{"speaker":"A","text":"I did a listening practice on YouTube yesterday. I got 23 out of 30 questions right.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/174990-176434.webm","at":1750.0,"dur":14.44}]},{"speaker":"B","text":"What was the hardest part? Was it the section with the diagram and the arrows?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/181780-183320.webm","at":1818.0,"dur":15.4}]},{"speaker":"A","text":"Yes, comparing the numbers with the arrows was tough. However, the map and the spelling gaps were okay.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/184072-185953.webm","at":1840.8,"dur":18.81}]},{"speaker":"B","text":"Diagrams and maps are tricky because they require experience. Listening is hard because you only have one chance to hear the information.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/190254-191610.webm","at":1902.7,"dur":13.56}]},{"speaker":"B","text":"We are going to work on the writing part today because it's one of the hardest, where you have very few resources.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/192820-194240.webm","at":1928.3,"dur":14.2}]}],"time":1583.8,"topic":2},{"title":"Writing a formal essay on children's internet use","lines":[{"speaker":"A","text":"Writing a formal essay is a double-edged sword. You have to produce at least 250 words, which is a lot of content to generate.","highlights":["double-edged sword"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/195524-196536.webm","at":1955.3,"dur":10.12}]},{"speaker":"B","text":"True, but the advantage is that you have full control over the content. Unlike in the reading section, you can choose the words you're comfortable with.","highlights":["full control"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/196932-197622.webm","at":1969.4,"dur":6.9},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/199056-199500.webm","at":1990.7,"dur":4.44}]},{"speaker":"A","text":"The hardest part is usually generating ideas. Let's look at Writing Part Two. You have 40 minutes to write a formal essay.","highlights":["the hardest part"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/200248-200997.webm","at":2002.6,"dur":7.49},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/210930-211427.webm","at":2109.4,"dur":4.97}]},{"speaker":"B","text":"So, for this task, I'm given a statement and a prompt. I need to decide if I agree or disagree, or discuss advantages and disadvantages.","highlights":["advantages and disadvantages"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/214932-215512.webm","at":2149.5,"dur":5.8}]},{"speaker":"A","text":"We'll start with an opinion essay. Before we begin, we need to create a plan. Tell me your genuine opinion on the statement about children's shoes and internet use.","highlights":["genuine opinion"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/219262-219669.webm","at":2192.7,"dur":4.07},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/220302-220716.webm","at":2203.1,"dur":4.14}]},{"speaker":"B","text":"I grew up without much supervision online and I didn't have any problems. So, I disagree with the statement that children need constant monitoring.","highlights":["constant monitoring"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/223988-225416.webm","at":2240.1,"dur":14.28}]},{"speaker":"A","text":"That's a good start. Now, imagine a person who argues that children should be supervised because they might encounter harmful adult content.","highlights":["harmful adult content"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/228892-229432.webm","at":2289.0,"dur":5.4},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/231076-231412.webm","at":2311.0,"dur":3.36}]},{"speaker":"B","text":"Right, so that person would say children need to be controlled because they might stumble upon inappropriate websites.","highlights":["stumble upon"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/233584-235333.webm","at":2335.9,"dur":17.49},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/235802-236472.webm","at":2358.2,"dur":6.7}]}],"time":1955.3,"topic":3},{"title":"Discussing children's internet safety and privacy","lines":[{"speaker":"A","text":"I think even if parents try to control their children, kids still find ways to access adult content secretly.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/238428-239487.webm","at":2384.5,"dur":10.59},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/240124-240624.webm","at":2401.4,"dur":5.0}]},{"speaker":"B","text":"That's a good point. When we develop a plan for an essay, we need to explain the core idea in a nutshell.","highlights":["in a nutshell"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/241200-241557.webm","at":2412.2,"dur":3.57},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/244960-245489.webm","at":2449.7,"dur":5.29}]},{"speaker":"A","text":"Should we use the phrase 'adult content'? It feels a bit specific and has a certain connotation.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/251062-252254.webm","at":2510.7,"dur":11.92}]},{"speaker":"B","text":"True. Maybe we should say kids still search potentially harmful websites secretly, even under adult supervision.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/259376-260095.webm","at":2593.9,"dur":7.19},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/260676-261713.webm","at":2607.0,"dur":10.37}]},{"speaker":"A","text":"If a parent monitors their child's phone, it could be seen as a violation of their personal space.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/278732-279861.webm","at":2787.5,"dur":11.29}]},{"speaker":"B","text":"But is it justified? There are so many dangerous and threatening things on the web that children might see.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/282358-283368.webm","at":2823.8,"dur":10.1}]},{"speaker":"A","text":"To be honest, I'm starting to have doubts about that position now.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/284416-284875.webm","at":2844.3,"dur":4.59}]},{"speaker":"B","text":"As an examiner, I don't care if your idea is 'good' or 'bad.' I only care if the idea is well-developed.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/285409-286713.webm","at":2854.3,"dur":13.04}]},{"speaker":"A","text":"So as long as the argument is convincing, the specific topic doesn't matter as much.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/287366-288203.webm","at":2873.9,"dur":8.37}]},{"speaker":"B","text":"Exactly. This isn't a scientific paper; it's just about demonstrating your English writing skills in 40 minutes.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/290082-290755.webm","at":2900.9,"dur":6.73}]}],"time":2384.5,"topic":4},{"title":"Developing persuasive examples for arguments","lines":[{"speaker":"A","text":"I think I'll stick with my second idea. But how could it backfire on me? For instance, what if people start ordering drugs online?","highlights":["stick with"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/290942-291446.webm","at":2909.6,"dur":5.04},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/293744-294174.webm","at":2937.5,"dur":4.3}]},{"speaker":"B","text":"I see. We'll decide based on the example we write. Usually, people start with an explanation or their train of thought, but that's easy to justify.","highlights":["train of thought"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/296186-296722.webm","at":2962.1,"dur":5.36},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/299728-299988.webm","at":2997.4,"dur":2.6}]},{"speaker":"B","text":"Even the silliest idea can be justified with weird logic. However, providing a real-life example is much harder. That's why we should start with an example.","highlights":["weird logic"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/300754-301864.webm","at":3007.7,"dur":11.1}]},{"speaker":"A","text":"Right. So an example needs to be something that happened in real life, involving a group of people, like children in Russia or fifth graders in Australia.","highlights":["in real life"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/307044-307424.webm","at":3070.6,"dur":3.8},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/309304-309875.webm","at":3094.9,"dur":5.71}]},{"speaker":"B","text":"Do you have a specific case in mind from your own experience? Just a second, I'm trying to manage forty open tabs on my browser.","highlights":["in mind"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/316044-316518.webm","at":3160.5,"dur":4.74},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/319580-320669.webm","at":3196.0,"dur":10.89}]},{"speaker":"A","text":"I knew a guy who was taking and buying drugs. He even asked his son to buy some for him. I'm still trying to frame this as a proper example.","highlights":["frame this"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/323226-324389.webm","at":3232.4,"dur":11.63},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/327150-328238.webm","at":3271.6,"dur":10.88}]},{"speaker":"B","text":"Let's just put down a first draft for now and we can correct it later. That's the goal.","highlights":["first draft"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/332560-334344.webm","at":3329.2,"dur":17.84}]},{"speaker":"B","text":"Wait, we have a problem. Your example is about only one person. An example needs to be representative, otherwise, your opponent will say it's just an isolated case.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/352198-353478.webm","at":3522.1,"dur":12.8}]}],"time":2909.6,"topic":4},{"title":"Using real examples in essays","lines":[{"speaker":"A","text":"I was thinking we could use an example of a dark web app for buying drugs that leaves no traces or browser history.","highlights":["leaves no traces"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/354797-355950.webm","at":3548.2,"dur":11.53}]},{"speaker":"A","text":"I'd rather focus on a broader problem that affects a large group of people rather than just one specific person.","highlights":["large group"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/358917-360541.webm","at":3589.4,"dur":16.24},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/361192-361672.webm","at":3612.1,"dur":4.8}]},{"speaker":"B","text":"If an app has been downloaded thousands of times without any age verification, we can reasonably assume kids are using it.","highlights":["age verification"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/362164-363104.webm","at":3621.8,"dur":9.4}]},{"speaker":"B","text":"However, our examples shouldn't be made up. It's much better to base them on something real since there are plenty of real-world issues.","highlights":["made up"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/364726-365792.webm","at":3647.5,"dur":10.66}]},{"speaker":"A","text":"We can keep the draft for now and discuss it. Once you have a clearer idea of what you need, you can rewrite it.","highlights":["clearer idea"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/367462-368724.webm","at":3674.7,"dur":12.62}]},{"speaker":"A","text":"I've written this essay a few times and have some cases ready, but it's always fun to come up with new ideas for practice.","highlights":["come up with"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/370722-372173.webm","at":3707.4,"dur":14.51}]},{"speaker":"B","text":"It's easy for kids to hide a second phone from their parents. It's the same with teachers; some schools ask students to hand over their phones, but they just have a backup.","highlights":["hand over"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/374084-375454.webm","at":3741.0,"dur":13.7}]},{"speaker":"B","text":"That shows how easy it is to trick adults. Thousands of children do this.","highlights":["trick adults"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/376450-377146.webm","at":3765.8,"dur":6.96},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/377594-378258.webm","at":3776.0,"dur":6.64}]},{"speaker":"A","text":"Using general terms like 'kids under adult control' sounds like a general explanation, but we are trying to make a specific case here.","highlights":["general terms"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/380730-382261.webm","at":3807.5,"dur":15.31}]},{"speaker":"B","text":"If you describe it as a general problem, you don't have to provide specific numbers, which would require proof.","highlights":["provide specific numbers"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/385850-386941.webm","at":3858.6,"dur":10.91},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/387164-387732.webm","at":3871.8,"dur":5.68}]}],"time":3548.2,"topic":4},{"title":"Refining an essay example about Russian schools","lines":[{"speaker":"A","text":"When you mention the number 30, you should explain that a survey was conducted. You need to specify who did it and where the publication was released.","highlights":["specify who"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/388164-389624.webm","at":3881.7,"dur":14.6}]},{"speaker":"B","text":"I don't need to include all those facts. It's getting too complicated.","highlights":["too complicated"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/390280-390665.webm","at":3902.9,"dur":3.85}]},{"speaker":"A","text":"Let me help you out. You're going too far into the details of publications. We can just present it as a fact.","highlights":["help you out"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/393178-394761.webm","at":3932.0,"dur":15.83}]},{"speaker":"A","text":"We can start by saying that certain gymnasiums and high schools in Russia have this rule.","highlights":["start by"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/395716-397309.webm","at":3957.4,"dur":15.93}]},{"speaker":"A","text":"However, most kids carry a second phone in their pockets. Teachers don't even know about it, so the system doesn't work.","highlights":["don't even know"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/397806-399436.webm","at":3978.3,"dur":16.3}]},{"speaker":"B","text":"Since we're talking about adult supervision, we can reshape our idea using this example of teachers at school.","highlights":["reshape our idea"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/400238-401786.webm","at":4002.5,"dur":15.48}]},{"speaker":"A","text":"I suggest you start from scratch, though you can copy and paste certain parts from your original example if you like them.","highlights":["start from scratch"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/402924-403953.webm","at":4029.4,"dur":10.29}]},{"speaker":"B","text":"So, am I writing a new example or just completing the text for my first idea?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/412762-413903.webm","at":4127.8,"dur":11.41},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/414092-414371.webm","at":4141.1,"dur":2.79}]},{"speaker":"A","text":"Yes, a new example. The first one doesn't work for our main idea, but we can keep some specific expressions.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/414496-416050.webm","at":4145.2,"dur":15.54}]},{"speaker":"A","text":"Imagine the reader hasn't been to Russia. You need to provide context so they understand why students need a second phone.","highlights":["provide context"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/423686-425172.webm","at":4237.1,"dur":14.86}]},{"speaker":"B","text":"I want to explain that students have a second phone because they have to leave their first one behind.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/429891-431257.webm","at":4299.0,"dur":13.66}]},{"speaker":"A","text":"It's like a law. It would be clearer to start by introducing the specific rules children must follow in certain Russian schools.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/431262-432889.webm","at":4312.8,"dur":16.27}]},{"speaker":"A","text":"By the way, make sure you spell 'law' correctly. 'Pushing' isn't the right word to use here.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/444138-444421.webm","at":4441.5,"dur":2.83},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/444608-446143.webm","at":4446.3,"dur":15.35}]}],"time":3881.7,"topic":5},{"title":"Grammar quirks: possessives, articles, and mass nouns","lines":[{"speaker":"A","text":"Is it a law? Like, is the government actually forcing students to do this?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/446832-447387.webm","at":4468.5,"dur":5.55}]},{"speaker":"B","text":"Yeah, they passed a law about a month ago. In Russian schools, students are forced to leave their phones with the teachers.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/447672-448832.webm","at":4476.9,"dur":11.6}]},{"speaker":"A","text":"So, if we're talking about the teacher's desk, that's an advanced use of the possessive, right?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/451312-452889.webm","at":4514.4,"dur":15.77}]},{"speaker":"B","text":"Exactly. If there's one teacher, it's a teacher's desk. If there are multiple teachers, you just add an apostrophe after 'teachers' without anything else.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/453484-455032.webm","at":4534.9,"dur":15.48}]},{"speaker":"A","text":"I actually didn't know that rule. I have a mini grammar course, and articles are one of the most overlooked topics because people think they're basic.","highlights":["most overlooked"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/457516-458572.webm","at":4575.4,"dur":10.56}]},{"speaker":"B","text":"They definitely aren't! For example, 'clothes' and 'scissors' are plural, but 'advice' is uncountable. People often make the mistake of saying 'advices'.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/458836-460502.webm","at":4588.5,"dur":16.66}]},{"speaker":"A","text":"What about hair? Is it singular or plural? I feel like 'her hair is blonde' sounds more natural.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/461032-462577.webm","at":4610.4,"dur":15.45}]},{"speaker":"B","text":"You're right. In English, 'hair' is treated as a mass noun. You only count individual hairs if they're in a soup, but otherwise, it's a mass.","highlights":["treated as"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/464502-466039.webm","at":4645.1,"dur":15.37}]},{"speaker":"A","text":"There are so many quirks like that, like irregular plurals for sheep and fish, or the third conditional.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/467304-468643.webm","at":4673.2,"dur":13.39},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/469112-469911.webm","at":4691.3,"dur":7.99}]},{"speaker":"B","text":"When you say 'teachers' desks,' it sounds like a specific group of teachers who share only one desk.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/472818-474349.webm","at":4728.3,"dur":15.31}]},{"speaker":"A","text":"I'm a bit confused. If I'm using 'desks' in the blue room, why do I need an article there?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/476594-477709.webm","at":4766.1,"dur":11.15},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/479582-480362.webm","at":4796.0,"dur":7.8}]},{"speaker":"B","text":"Since it's a general, unspecified group of many teachers, you don't need an article. It's like saying 'people in Russia.'","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/480556-481734.webm","at":4805.7,"dur":11.78}]}],"time":4468.5,"topic":6},{"title":"Improving Academic Writing and Idea Generation","lines":[{"speaker":"A","text":"We need to introduce contrast here. In formal writing, we shouldn't start sentences with 'but' or 'because.' Do you know any formal synonyms for 'but'?","highlights":["formal synonyms"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/485488-486915.webm","at":4855.0,"dur":14.27}]},{"speaker":"B","text":"I know 'however.'","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/489482-489522.webm","at":4895.0,"dur":0.4}]},{"speaker":"A","text":"That's right. Now, regarding the students, do they still use their phones in their backpacks for several reasons?","highlights":["for several reasons"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/492886-494837.webm","at":4931.5,"dur":19.51},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/496592-498451.webm","at":4969.2,"dur":18.59}]},{"speaker":"B","text":"Well, they use them for a few reasons, like scrolling through TikTok.","highlights":["scrolling through"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/499436-500145.webm","at":4994.6,"dur":7.09},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/501802-502188.webm","at":5018.2,"dur":3.86}]},{"speaker":"A","text":"Exactly. And we need to watch the punctuation. You correctly put a comma after 'however.' We always need a comma after connectors like 'also,' 'moreover,' or 'on the one hand.'","highlights":["on the one hand"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/506328-507778.webm","at":5063.4,"dur":14.5}]},{"speaker":"A","text":"Also, since we're talking about multiple students, do they all share one phone? I hope they don't!","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/510746-511869.webm","at":5107.7,"dur":11.23}]},{"speaker":"A","text":"After those corrections, that's a solid example. To improve, you need to work on vocabulary, grammar, and especially idea generation.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/512537-514142.webm","at":5125.5,"dur":16.05}]},{"speaker":"A","text":"Idea generation is the hardest part because there's no single answer. It's like growing a tree; you start with one idea and then have to adapt the whole paragraph.","highlights":["no single answer"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/517074-518596.webm","at":5170.9,"dur":15.22}]},{"speaker":"A","text":"It's a skill you acquire with practice. You also have to practice doing it fast, since you need to complete the entire essay in 40 minutes.","highlights":["acquire with practice"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/521284-522674.webm","at":5213.0,"dur":13.9}]},{"speaker":"A","text":"Since you need a band seven, it's a high score. A band nine is almost impossible; it has to be impeccable.","highlights":["almost impossible"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/523606-525175.webm","at":5236.2,"dur":15.69}]}],"time":4855.0,"topic":6},{"title":"Achieving a Band 7 in IELTS Writing","lines":[{"speaker":"A","text":"To get a Band 7, at least 50% of your sentences must be completely error-free, with no missed commas or spelling mistakes.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/531120-532566.webm","at":5311.4,"dur":14.46}]},{"speaker":"B","text":"That's why I feel like I need to put most of my effort into the writing section.","highlights":["put most of my effort into"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/537744-538507.webm","at":5377.6,"dur":7.63}]},{"speaker":"A","text":"Actually, spending more time on writing improves your reading score too, since they both use formal vocabulary.","highlights":["formal vocabulary"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/538876-539865.webm","at":5389.0,"dur":9.89}]},{"speaker":"B","text":"I agree. I've noticed my speaking is improving during our classes, and your corrections really help me.","highlights":["really help me"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/546660-548103.webm","at":5466.8,"dur":14.43}]},{"speaker":"A","text":"You're not alone; writing clearly is hard for everyone. However, since you're already conversational, a Band 7 overall is doable with a few months of practice.","highlights":["not alone"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/550540-551926.webm","at":5505.6,"dur":13.86},{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/555554-556256.webm","at":5555.6,"dur":7.02}]},{"speaker":"B","text":"But getting a Band 7 specifically for the writing section is going to take a bit more effort.","highlights":["take a bit more effort"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/556438-557076.webm","at":5564.6,"dur":6.38}]},{"speaker":"A","text":"I highly recommend checking the detailed reviews I compile after every class. They include all the mistakes we made and their explanations.","highlights":["highly recommend"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/557756-559118.webm","at":5577.8,"dur":13.62}]},{"speaker":"B","text":"I'll definitely take a look at the vocabulary section and the quizzes.","highlights":["take a look at"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/559782-560760.webm","at":5598.0,"dur":9.78}]}],"time":5311.4,"topic":7},{"title":"IELTS preparation and study planning","lines":[{"speaker":"A","text":"I'm looking into the Cambridge IELTS 21st preparation book. What do you think about it?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/562794-563944.webm","at":5628.1,"dur":11.5}]},{"speaker":"B","text":"If it's an official book from Cambridge, you can use it, but I actually prefer this IELTS mock test website.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/567303-568299.webm","at":5673.2,"dur":9.96}]},{"speaker":"A","text":"I really like that site because it's free and has a lot of mock tests. If you recommend it, I'll use that instead of a book.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_16-13-18/568724-570225.web             }

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {
                    if (!hit[index] && functional.has(norm(part))) {
                        const near = [index - 2, index + 2].some(k => hit[k]);
                        if (near) hit[index] = true;
                    }
                });
                return parts.map((part, index) => {
                    if (!hit[index]) return esc(part);
                    // Underline the word itself, not quotes or punctuation stuck to it.
                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                    return `${esc(before)}<b class="hl">${esc(core)}</b>${esc(after)}`;
                }).join('');
            }

            // link(phrase): the vocabulary entry of a highlighted phrase, or -1.
            function highlightPhrases(text, phrases, link) {
                const lower = text.toLowerCase();
                const ranges = [];
                (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length, phrase]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end, phrase]) => {
                    const word = link ? link(phrase) : -1;
                    const opens = word >= 0 ? ` data-vocab="${word}" title="${esc(`See “${vocabulary[word].term}” in Vocabulary`)}"` : '';
                    html += esc(text.slice(cursor, start)) + `<mark class="expr"${opens}>${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {
                    if (value === undefined) return window.localStorage.getItem(key);
                    window.localStorage.setItem(key, value);
                } catch (_error) {
                    return null;
                }
                return null;
            }

            // ---------------------------------------------------------- header
            document.getElementById('title').textContent = meta.title || 'Lesson review';

            // The lesson time in Moscow time (meta.start_utc: when the lesson
            // began, in seconds since 1970). A tap shows it in the reader's own
            // time zone instead, remembered on the phone. Older pages have no
            // start_utc: the date and time as recorded, with no zone.
            const eyebrow = document.getElementById('eyebrow');
            const lessonStart = typeof meta.start_utc === 'number' && isFinite(meta.start_utc) ? new Date(meta.start_utc * 1000) : null;
            let lessonTimes = null;
            let ownZone = storage('lesson-time-zone') === 'own';

            function zoneTime(zone) {
                const date = { day: 'numeric', month: 'long', year: 'numeric' };
                const time = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
                if (zone) { date.timeZone = zone; time.timeZone = zone; }
                return {
                    date: new Intl.DateTimeFormat('en-GB', date).format(lessonStart),
                    time: new Intl.DateTimeFormat('en-GB', time).format(lessonStart)
                };
            }

            function offsetName(minutes) {
                const size = Math.abs(minutes);
                if (!size) return 'GMT';
                return 'GMT' + (minutes < 0 ? '-' : '+') + Math.floor(size / 60) + (size % 60 ? ':' + String(size % 60).padStart(2, '0') : '');
            }

            if (lessonStart) {
                try {
                    const moscow = zoneTime('Europe/Moscow');
                    const own = zoneTime(null);
                    lessonTimes = {
                        moscow: Object.assign(moscow, { zone: 'MSK', name: 'Moscow time' }),
                        own: Object.assign(own, { zone: offsetName(-lessonStart.getTimezoneOffset()), name: 'your time' }),
                        differ: moscow.date !== own.date || moscow.time !== own.time
                    };
                } catch (_error) {
                    lessonTimes = null;  // no time zones in this browser: the time as recorded
                }
            }

            function showLessonTime() {
                let date = meta.date;
                if (!lessonTimes) {
                    eyebrow.textContent = ['English lesson', meta.date, meta.time].filter(Boolean).join(' · ');
                } else {
                    const shown = lessonTimes.differ && ownZone ? lessonTimes.own : lessonTimes.moscow;
                    const other = shown === lessonTimes.own ? lessonTimes.moscow : lessonTimes.own;
                    const time = `${esc(shown.time)} <span class="tz">${esc(shown.zone)}</span>`;
                    date = shown.date;
                    eyebrow.innerHTML = `English lesson · ${esc(shown.date)} · `
                        + (lessonTimes.differ
                            ? `<button class="tz-btn" type="button" title="Show ${esc(other.name)} (${esc(other.zone)})" aria-label="${esc(`${shown.time} ${shown.name}. Show ${other.name}, ${other.zone}`)}">${time}</button>`
                            : `<span class="tz-time">${time}</span>`);
                }
                document.title = (meta.title ? meta.title + ' · ' : '') + 'English lesson' + (date ? ' · ' + date : '');
            }
            showLessonTime();
            eyebrow.addEventListener('click', event => {
                if (!event.target.closest('.tz-btn')) return;
                ownZone = !ownZone;
                storage('lesson-time-zone', ownZone ? 'own' : 'moscow');
                showLessonTime();
                const button = eyebrow.querySelector('.tz-btn');
                if (button && event.detail === 0) button.focus();  // kept for the keyboard
            });

            document.getElementById('count-mistakes').textContent = mistakes.length;
            document.getElementById('count-vocabulary').textContent = vocabulary.length;
            document.getElementById('count-dialogues').textContent = dialogues.length;

            // -------------------------------------------------------- mistakes
            const topics = lesson.topics || [];
            // Each mistake example, word and dialogue line can be found by the timeline.
            const exampleIds = new Map();
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => exampleIds.set(example, `m-${c}-${e}`)));
            let showAllMistakes = () => {};
            let vocabularyToWords = () => {};
            // What "Go back" needs to put a section back as it was.
            let mistakeFilter = () => 'all';
            let setMistakeFilter = () => {};
            let vocabularyView = () => 'words';
            let setVocabularyView = () => {};

            function clock(seconds) {
                if (seconds === null || seconds === undefined) return '';
                const total = Math.max(0, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const rest = String(total % 60).padStart(2, '0');
                return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
            }

            function plain(text) {
                return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
            }

            // One example: when it was said, the full sentence(s) as said and
            // corrected, and (where it adds something) its own explanation.
            function exampleHtml(example, options) {
                const before = example.context || example.quote;
                const after = example.context_fix || example.fix;
                const d = diff(before, after);
                // The clip pill needs no separator: it stays apart from the topic when the line wraps.
                const pill = clipHtml(example.clip, 'Hear what was said');
                // The letters beside the time open the same moment in the other sections.
                const jumps = jumpsHtml('mistakes', example.clip ? example.clip.at : example.time);
                const facts = [];
                if (!pill && example.time !== null && example.time !== undefined) facts.push(`<span class="clock">${clock(example.time)}</span>${jumps}`);
                if (options.showTopic && topics[example.topic]) facts.push(`<span>${esc(topics[example.topic].title)}</span>`);
                let html = `<div class="pair" data-item="${exampleIds.get(example) || ''}"${options.hidden ? ' hidden' : ''}>`;
                const separator = jumps && !pill ? '' : '<span class="sep">·</span>';
                if (pill || facts.length) html += `<div class="ex-meta" data-no-speech>${pill}${pill ? jumps : ''}${facts.join(separator)}</div>`;
                html += `<div class="said"><span class="mark-icon" aria-label="What was said" data-no-speech>✗</span><span class="txt">${d.said}</span></div>`;
                html += `<div class="fixed"><span class="mark-icon" aria-label="Better" data-no-speech>✓</span><span class="txt">${d.fixed}</span>${playButton(after, 'Listen to the correct version')}</div>`;
                if (options.why) html += `<p class="ex-why">${esc(options.why)}</p>`;
                return html + '</div>';
            }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
                    html += items.map(item => `<li><span class="meaning">${esc(item.meaning)}</span><span class="m-ex">${highlightTerm(item.example, entry.term)}`
                        + (item.lesson ? ' <span class="from-lesson" data-no-speech>from the lesson</span>' : '') + '</span></li>').join('');
                    return html + '</ol></div>';
                };
                return '<div class="forms">'
                    + column('Countable', 'a / an, plural', entry.countable || [])
                    + column('Uncountable', 'no a / an, no plural', entry.uncountable || [])
                    + '</div>';
            }

            function relatedHtml(entry) {
                const row = (title, words) => (words || []).length
                    ? `<div class="rel"><p class="part-title" data-no-speech>${title}</p><span class="rel-words">${words.map(w => `<span class="rel-word">${esc(w)}</span>`).join('<span class="sep" data-no-speech> · </span>')}</span></div>`
                    : '';
                return row('Synonyms', entry.synonyms) + row('Antonyms', entry.antonyms);
            }

            // Visible: when it was said, the word, the meaning, the lesson's own
            // words and at least three examples. The rest opens on request.
            function wordCardHtml(entry, index) {
                const term = entry.term || '';
                let html = `<article class="card word" id="word-${index}"><div class="w-head">`;
                if (entry.clip) html += clipHtml(entry.clip, 'Hear it in the lesson');
                else if (entry.time !== null && entry.time !== undefined) html += `<span class="clock" data-no-speech>${clock(entry.time)}</span>`;
                html += jumpsHtml('vocabulary', entry.clip ? entry.clip.at : entry.time);
                // The word, its kind and its speaker stay together (a new row when
                // they do not fit); the kind and the speaker never part.
                html += `<div class="w-title"><h3 class="w-term">${esc(term)}</h3><span class="w-side">`;
                if (entry.pos) html += `<span class="w-pos" data-no-speech>${esc(entry.pos)}</span>`;
                html += playButton(term, 'Listen to ' + term) + '</span></div></div>';
                if (entry.definition) html += `<p class="def">${esc(entry.definition)}</p>`;
                const passage = entry.lesson || entry.lesson_example;
                if (passage) {
                    html += `<div class="lesson-ex"><div class="txt"><span class="src" data-no-speech>From the lesson</span>${highlightTerm(passage, term)}</div>${playButton(passage, 'Listen')}</div>`;
                }
                const examples = exampleItems(entry);
                if (examples.length) {
                    html += '<ul class="examples">' + examples.map(example => '<li>'
                        + (example.pattern ? `<span class="pat" data-no-speech>${esc(example.pattern)}</span> ` : '')
                        + highlightTerm(example.sentence, term) + '</li>').join('') + '</ul>';
                }
                if (entry.note) html += `<p class="note">${icons.bulb}<span>${esc(entry.note)}</span></p>`;

                const parts = [];
                if ((entry.countable || []).length || (entry.uncountable || []).length) parts.push(['forms', 'Countable / uncountable', formsHtml(entry)]);
                if ((entry.more_examples || []).length) {
                    parts.push(['more', 'More examples', '<p class="part-title" data-no-speech>More examples</p><ul class="examples">'
                        + entry.more_examples.map(s => `<li>${highlightTerm(s, term)}</li>`).join('') + '</ul>']);
                }
                const related = relatedHtml(entry);
                if (related) parts.push(['related', 'Synonyms & antonyms', related]);
                if (parts.length) {
                    html += '<div class="more-bar" data-no-speech>'
                        + parts.map(([id, name]) => `<button class="more-btn" type="button" data-part="${id}" aria-expanded="false">${name}</button>`).join('')
                        + '<button class="more-btn more-hide" type="button">Hide</button></div>';
                    html += parts.map(([id, , body]) => `<div class="more-part" data-part="${id}" hidden>${body}</div>`).join('');
                }
                return html + '</article>';
            }

            // Matching pairs: all the words, shuffled into rounds of about six;
            // the meanings are shuffled separately.
            function renderMatch(game) {
                const pool = shuffled(matchable);
                const roundCount = Math.ceil(pool.length / 6);
                const rounds = [];
                for (let r = 0, cursor = 0; r < roundCount; r++) {
                    const size = Math.floor(pool.length / roundCount) + (r < pool.length % roundCount ? 1 : 0);
