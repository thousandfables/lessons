            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;

            letter-spacing: 0.5px;
        }

        h3 {
            font-size: 50px;
            font-weight: bold;
        }



        #left {
            width: 100%;
            padding: 20px;
            border-right: 2px solid #ccc;
        }

        #right {

        }

        .part-buttons,
        .content-buttons {
            margin-bottom: 10px;
        }

        .content-buttons button {
            margin-right: 5px;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .part-buttons button.active {
            background-color: #007bff;
            color: white;
        }

        .content-buttons button.loading {
            animation: flash 0.5s infinite alternate;
        }

        .content-buttons button.active {
            background-color: #007bff;
            color: white;
        }

        @keyframes flash {
            0% {
                background-color: #ffd700;
            }

            100% {
                background-color: #ffa500;
            }
        }

        .hidden {
            display: none;
        }

            margin-top: 1px;
            padding: 30px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }

        .entry-box {
            font-weight: bold;
            font-size: 1.4em;
            display: inline-block;
            border-bottom: 2px solid #2980b9;
            padding-bottom: 2px;
            margin-top: 25px;
            margin-bottom: 5px;

            background-color: #f4f4f4;

            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            box-shadow: 2px 2px 5px rgba(142, 68, 173, 0.15);

        }

            font-size: 1.8em;
            font-weight: bold;
            padding: 8px 12px;

            margin-bottom: 10px;
            color: white;

            background-color: #8e44ad;
            border-left-color: #6a1b9a;
            box-shadow: 3px 3px 8px rgba(142, 68, 173, 0.3);

            background-color: rgba(52, 152, 219, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            box-shadow: 2px 2px 5px rgba(52, 152, 219, 0.15);
            max-width: 500px;

            color: black;
        }

        .joke {
            color: #6d1b9a;
            /* Deeper purple for better readability */
            font-size: 1.1em;
            line-height: 1.4;
        }

            font-weight: bold;
            font-size: 1.2em;
            font-style: italic;
            color: #2c3e50;
            /* Dark gray-blue for a classy contrast */

            font-weight: 600;
            color: #000000;
            /* Darker shade for better contrast */
        }

        .italic {
            font-style: italic;
            color: #000000;
            /* Slightly darker gray for better readability */
        }

        .bold-italic {
            font-weight: 600;
            font-style: italic;
            color: #222;
            /* More emphasis on bold-italic text */
        }

        .joke-box {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1),

            max-width: 550px;
            transition: all 0.3s ease-in-out;
        }

        .joke-box:hover {
            transform: translateY(-3px);
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.15),

        /* Dialogue Container - Auto Width Based on Content */
        .dialogue-container {
            display: inline-block;
            /* Shrinks width to fit content */
            max-width: 800px;
            /* Prevents it from becoming too wide */
            margin: 20px 0;

            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);

        .line {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.1);
            font-size: 1.1em;

            background: linear-gradient(145deg, #dde5ed, #c9d6e2);

        }

            background: linear-gradient(145deg, #d1e8ff, #b9dfff);
            text-align: left;
            color: #1d3557;
        }

        /* Speaker Name Styling */
        .speaker {
            font-weight: bold;
            margin-bottom: 5px;

            font-size: 1.1em;
            color: #000;
        }
    </style>
</head>

    "dialogue": {
        "dialogue_1": {
            "dialogue_list": [
                {
                    "Person 1": "Hey! Do you ever feel like shaving is just too much work?"
                },
                {
                    "Person 2": "Oh, definitely! I mean, I shave my beard every day, but sometimes I just can't be bothered."
                },
                {
                    "Person 1": "Same here! It's like, I look in the mirror and think, 'Ugh, this looks awful,' but the effort..."
                },
                {
                    "Person 2": "Right? Like, I have these weird patches where my beard grows, and it looks all uneven."
                },
                {
                    "Person 1": "Exactly! I felt like I looked like I just stumbled out of a forest fire or something."
                },
                {
                    "Person 2": "Haha! That’s a vivid image. But I get it. Sometimes I just wish I could skip the whole thing."
                },
                {
                    "Person 1": "Yeah, but if I don’t shave, I end up looking messy, and that’s not a good look."
                },
                {
                    "Person 2": "For sure! Plus, I hate getting hair in my food or drink. It's the worst!"
                },
                {
                    "Person 1": "Totally. And don’t get me started on the mess I make when I try to shave!"
                },
                {
                    "Person 2": "Seriously! I think I should just stick with trimming it instead of shaving it completely."
                },
                {
                    "Person 1": "That’s what I do too! A trimmer is so much easier. I can get away with it for a while."
                },
                {
                    "Person 2": "Exactly! And if I don’t look too scruffy, then I don't mind waiting a little longer to take care of it."
                },
                {
                    "Person 1": "Yeah, life’s too short to spend it all on shaving, right?"
                },
                {
                    "Person 2": "Amen to that! Let’s just agree to trim rather than shave for now."
                },
                {
                    "Person 1": "Deal! I’ll embrace my little beard stubble as a statement."
                },
                {
                    "Person 2": "Haha! Statement it is! Let’s not worry about it until we have to."
                }
            ]
        },
        "dialogue_2": {
            "dialogue_list": [
                {
                    "Person 1": "Hey! What are you up to today?"
                },
                {
                    "Person 2": "Not much, just trying to catch up on work stuff. You?"
                },
                {
                    "Person 1": "Same here! I got an email from my boss that I need to fix some reports, so I’ve been at it all morning."
                },
                {
                    "Person 2": "Ugh, reports. The never-ending struggle, right?"
                },
                {
                    "Person 1": "Exactly! But I did take a break to play Diablo for a bit."
                },
                {
                    "Person 2": "Oh nice! Did you get the new DLC?"
                },
                {
                    "Person 1": "Yeah! It’s pretty awesome. I think I’ve put in like 40 hours since it came out."
                },
                {
                    "Person 2": "Wow, that’s a dedicated gamer right there! I still need to buy it."
                },
                {
                    "Person 1": "You definitely should! It’s so much fun playing online with friends."
                },
                {
                    "Person 2": "Do you play on PC or console?"
                },
                {
                    "Person 1": "PC. I find it way easier with the mouse and keyboard."
                },
                {
                    "Person 2": "Yeah, I get that. I always feel like I can’t aim with a controller."
                },
                {
                    "Person 1": "For real! I remember trying to play with a joystick, and it was a disaster."
                },
                {
                    "Person 2": "Haha, same! I think I'm a lot better with a mouse."
                },
                {
                    "Person 1": "You should join me sometime! We can team up."
                },
                {
                    "Person 2": "I’d love that! Just let me finish these reports first."
                },
                {
                    "Person 1": "Sure thing! We can tackle that after. Let’s catch up later?"
                },
                {
                    "Person 2": "Sounds like a plan! Good luck with your reports!"
                },
                {
                    "Person 1": "Thanks! You too! Talk later."
                }
            ]
        },
        "dialogue_3": {
            "dialogue_list": [
                {
                    "Person 1": "Hey! Have you heard about the game Path of Exile?"
                },
                {
                    "Person 2": "Not really, I’m not that into games. What’s it about?"
                },
                {
                    "Person 1": "It’s an RPG you can play on the computer or consoles. I used to love playing Diablo 2, and this is right up that alley."
                },
                {
                    "Person 2": "Oh cool! I remember Diablo 2. I played that for hours back in the day!"
                },
                {
                    "Person 1": "Exactly! I really got into Diablo 3 too. I think I logged over a thousand hours on Diablo 4 now since it came out."
                },
                {
                    "Person 2": "Wow, that’s impressive! How does it compare to the others?"
                },
                {
                    "Person 1": "Honestly, the mechanics and characters in Diablo 4 are just way more interesting to me. It pulls me in."
                },
                {
                    "Person 2": "Nice! I loved Heroes of Might and Magic back then too. Did you play that?"
                },
                {
                    "Person 1": "Yes! That game took up a lot of my childhood. I still remember my old PC running it."
                },
                {
                    "Person 2": "Same here! We used to have gaming nights with friends. It was super fun!"
                },
                {
                    "Person 1": "Right? We played together for hours, just having a blast. It’s nostalgic."
                },
                {
                    "Person 2": "Totally! Speaking of old games, I can’t believe how tricky some tongue twisters are."
                },
                {
                    "Person 1": "Oh, don’t get me started! Like ‘If two witches were watching two watches’... I can barely say it once!"
                },
                {
                    "Person 2": "Haha, same! I feel like English has some of the hardest sounds to pronounce."
                },
                {
                    "Person 1": "Definitely! Sometimes I just need to practice to get it right."
                },
                {
                    "Person 2": "Agreed! So when are we having a gaming night again? It's been a while!"
                },
                {
                    "Person 1": "How about this weekend? We can dig up some old games and relive our childhood!"
                },
                {
                    "Person 2": "Sounds like a plan! Can’t wait to jump back into it!"
                }
            ]
        },
        "dialogue_4": {
            "dialogue_list": [
                {
                    "Person 1": "Hey! Do you know what's really got me thinking lately?"
                },
                {
                    "Person 2": "What’s that?"
                },
                {
                    "Person 1": "Gaming! I feel like every time I start a new game, I just get sucked in for hours."
                },
                {
                    "Person 2": "Oh, totally! I remember binging on games like it was a full-time job. What have you been playing?"
                },
                {
                    "Person 1": "I just finished playing Dying Light. That game is such a rush!"
                },
                {
                    "Person 2": "Nice! I loved the first one. The parkour is so fun, right?"
                },
                {
                    "Person 1": "Exactly! I could jump around the city all day long. The feeling of surviving those zombie hordes is just awesome."
                },
                {
                    "Person 2": "I know what you mean! But sometimes, I worry I get too into it. Like, I forget about everything else."
                },
                {
                    "Person 1": "Same here! Last week I was so into it that I ended up playing from morning until late at night."
                },
                {
                    "Person 2": "No way! What about work?"
                },
                {
                    "Person 1": "Yeah, I kinda put it on the back burner. Thankfully it was a slow week."
                },
                {
                    "Person 2": "Lucky! I feel like I need to set limits or something. It’s hard, though."
                },
                {
                    "Person 1": "For real! Sometimes I think I should just play one hour a day, but then I get too hooked."
                },
                {
                    "Person 2": "Right? It’s like once you start, it’s impossible to stop. It’s that craving for closure!"
                },
                {
                    "Person 1": "Exactly! You just want to finish that last quest or mission."
                },
                {
                    "Person 2": "Totally! And then you look at the clock and it's like, 'Whoa, where did the time go?'"
                },
                {
                    "Person 1": "For sure! At least it makes for some fun memories. Like playing with friends during snowy weekends."
                },
                {
                    "Person 2": "Yeah! Those are the best times. What’s the craziest gaming memory you have?"
                },
                {
                    "Person 1": "Probably one time we played for almost 24 hours straight. It was brutal but hilarious!"
                },
                {
                    "Person 2": "Wow! That’s wild. I’ve done similar marathons. They can get pretty intense."
                },
                {
                    "Person 1": "Oh, definitely! But I think as long as we keep having fun, it’s all good."
                },
                {
                    "Person 2": "Agreed! Just need to balance it out with real life, you know?"
                },
                {
                    "Person 1": "Yep! So, what’s next for you? Are you diving into a new game soon?"
                },
                {
                    "Person 2": "Thinking of trying that new parkour game everyone is talking about. You?"
                },
                {
                    "Person 1": "Maybe some classic ones! I could always use a nostalgia trip."
                },
                {
                    "Person 2": "Sounds like a plan! Let’s see who can finish first!"
                },
                {
                    "Person 1": "You’re on! May the best gamer win!"
                }
            ]
        },

            // Set parts_number from json_content
            let parts_number = json_content.parts_number || 0;

        // References to sections
        const partsSection = document.getElementById('partsSection');
        const contentSection = document.getElementById('contentSection');
        const displaySection = document.getElementById('displaySection');

        let activePart = null; // Track the active part

        // Function to create Part buttons
        function createPartButtons() {
            for (let i = 1; i <= parts_number; i++) {
                let button = document.createElement("button");
                button.textContent = "Part " + i;
                button.onclick = () => showContentButtons(i, button);
                partsSection.appendChild(button);
            }
        }

        // Function to show Mistakes, Vocabulary, and Dialogue buttons
        function showContentButtons(part, button) {
            // Reset previous part selection
            document.querySelectorAll(".part-buttons button").forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");

            // Clear previous content buttons and displayed content
            contentSection.innerHTML = "";
            contentSection.classList.remove("hidden");
            displaySection.innerHTML = "";

            activePart = part; // Update active part

            let sections = ["Mistakes", "Vocabulary", "Dialogue"];
            sections.forEach(section => {
                let secButton = document.createElement("button");
                secButton.textContent = section;
                secButton.onclick = () => {
                    secButton.classList.add("loading"); // Add flashing effect
                    displayContent(section, part, secButton);
                };
                contentSection.appendChild(secButton);
            });
        }

        // Function to display selected content
        function displayContent(type, part, button) {
            let dataKey = type.toLowerCase(); // "mistakes", "vocabulary", "dialogue"
            let partKey = dataKey + "_" + part; // e.g., "mistakes_1"

            if (json_content[dataKey] && json_content[dataKey][partKey]) {
                let contentData = json_content[dataKey][partKey];

                if (dataKey === "mistakes") {
                    appendContent(displayMistakes(contentData), part, type, button);
                } else if (dataKey === "vocabulary") {
                    appendContent(displayVocabulary(contentData), part, type, button);
                } else if (dataKey === "dialogue") {
                    appendContent(displayDialogue(contentData), part, type, button);
                }
            }
        }

        // Append content while keeping existing sections
        function appendContent(html, part, type, button) {
            let sectionID = `part${part}-${type}`;
            let existingSection = document.getElementById(sectionID);

            if (!existingSection) {
                let newSection = document.createElement("div");
                newSection.id = sectionID;
                newSection.classList.add("section-content");
                newSection.innerHTML = html;
                displaySection.appendChild(newSection);

                // Remove animation, keep the button highlighted
                button.classList.remove("loading");
                button.classList.add("active");
            }
        }

        // Function to display Mistakes content
        function displayMistakes(data) {
            let html = "<h3>Mistakes</h3>";
            data.mistakes_list.forEach(mistake => {
                html += `<p><b>Original:</b> ${mistake.original}</p>`;
                html += `<p><b>Corrected:</b> <b> ${mistake.corrected}</b></p>`;
                html += `<p><b>Explanation:</b> ${mistake.explanation}</p>`;
                html += `<p><b>Context:</b> <i> ${mistake.context}</i></p>`;
                html += `<hr><br>`; /* Adds an extra blank line */
            });
            return html;
        }





        // Function to display Vocabulary content
        function displayVocabulary(data) {
            let html = "<h3>Vocabulary</h3>";

            // Helper function: Preserve case in context replacement
            function formatContextSentence(sentence, word) {
                const regex = new RegExp(`\\b${word}\\b`, "gi"); // Case-insensitive exact word match
                return sentence.replace(regex, (match) => {
                    return `<span class="bold-italic">${match}</span>`; // Keeps match's case
                });
            }

            // Vocabulary Section
            data.vocabulary_list.forEach((entry, index) => {
                // Word Entry
                html += `<p class="entry-box"> <span class="word">${index + 1}. ${entry.word}</span></p>`;

                // Definition Box
                html += `<div class="definition-box"><span class="bold">Definition:</span> ${entry.definition}</div>`;

                // Context Sentences
                html += "<p>";
                Object.values(entry.context).forEach((sentence, i) => {
                    const formattedSentence = formatContextSentence(sentence, entry.word);
                    html += `<br><span class="bold">Context ${i + 1}:</span> <span class="italic">${formattedSentence}</span>`;
                });
                html += "</p>";
            });

            // Funny Facts Section
            if (data.funny_facts.length > 0) {
                html += `<div class="section-title purple-section">Funny Facts</div>`;
                data.funny_facts.forEach((fact, index) => {
                    html += `<div class="fact-box">
                <p class="fact"><span class="bold">${index + 1}. ${fact.word}:</span> ${fact.fact}</p>
             </div>`;
                });
            }

            // Jokes Section
            if (data.jokes.length > 0) {
                html += `<div class="section-title purple-section">Jokes</div>`;
                data.jokes.forEach((joke, index) => {
                    html += `<div class="joke-box">
                <p class="joke-question">${index + 1}. ${joke.question}</p>
                <p class="italic joke">${joke.answer}</p>
             </div>`;
                });
            }

            return html; // Returning the generated HTML instead of inserting it directly
        }

        function displayDialogue(data) {
            let html = `<div class="dialogue-container">`;
            html += "<h3>Dialogue</h3>";

            data.dialogue_list.forEach(entry => {
                const speaker = Object.keys(entry)[0];
                const line = entry[speaker];

                html += `<div class="line ${speaker === "Person 1" ? 'person-1' : 'person-2'}">
                    <span class="speaker">${speaker}:</span> ${line}
                 </div>`;
            });

            html += `</div>`;
            return html;
        }





        // Initialize part buttons
        createPartButtons();
    </script>
