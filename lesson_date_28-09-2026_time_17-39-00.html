{"sentence":"The company's intention is to expand into the European market.","pattern":"intention + is to + verb"}],"countable":[{"meaning":"A plan or aim to do something in the future","example":"He had every intention of helping us move house."},{"meaning":"A purpose or goal that is often secret or dishonest","example":"The police are investigating his true intentions."}],"uncountable":[{"meaning":"The aim, purpose, or specific meaning you want to convey when saying something.","example":"You cannot make the model 100 percent understand your intention behind a certain sentence.","lesson":true}],"more_examples":["I didn't mean to offend you; that wasn't my intention at all.","The government's intention is to reduce carbon emissions by 2030.","Could you clarify your intention with this request?"],"synonyms":["purpose","aim","goal","objective","plan"],"antonyms":["accident","coincidence"],"gap":{"sentence":"I'm sorry if my comment seemed rude; I had no _____ of offending you during our meeting.","answer":"intention","options":["intention","reaction","opinion","feeling"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/421222-421582.webm","at":4212.3,"dur":3.6}}],"dialogues":[{"title":"Improving lesson reviews with local AI models","lines":[{"speaker":"A","text":"I can't believe it's already 6 p.m. in Moscow. I've been overworking today because trial lessons take so much more energy.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/000604-001165.webm","at":6.2,"dur":5.61},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/003372-004678.webm","at":33.9,"dur":13.06}]},{"speaker":"B","text":"I've reworked the review a bit, and it's looking great now. It's way more useful, and I added a cool feature where you can listen to sad moments.","highlights":["looking great"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/005778-006596.webm","at":57.9,"dur":8.18},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/007566-008274.webm","at":75.8,"dur":7.08}]},{"speaker":"A","text":"The most useful part is the discussion about penis size. I was actually envious of your beard! Is there a correlation between beard size and penis size?","highlights":["envious of"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/008870-010413.webm","at":88.8,"dur":15.43}]},{"speaker":"B","text":"I'm running this model locally on my PC now. That's the biggest change because I don't have to worry about overusing the API.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/012440-013103.webm","at":124.5,"dur":6.63},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/013556-013920.webm","at":135.7,"dur":3.64}]},{"speaker":"A","text":"It's much better than using ChatGPT-5 Mini. Since you're running it on your own machine, you can refine things better and it filters out mistakes quite well.","highlights":["filters out"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/014140-014746.webm","at":141.5,"dur":6.06},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/015386-016694.webm","at":154.1,"dur":13.08}]},{"speaker":"B","text":"The synchronization bar is really cool. It helps you sync a specific person's words across different fields, like matching a phrase to the vocabulary section.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/018236-018980.webm","at":182.5,"dur":7.44},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/020644-021136.webm","at":206.5,"dur":4.92}]},{"speaker":"A","text":"Exactly. If you see 'take into account' in the dialogue, you can jump straight to the vocabulary section to see the definition, synonyms, and antonyms.","highlights":["take into account"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/022330-023494.webm","at":223.4,"dur":11.64}]},{"speaker":"B","text":"I also added games. 'Feeling the gap' is a fun way to hide the answers behind words with the same meaning or collocations.","highlights":["feeling the gap"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/025834-026872.webm","at":258.4,"dur":10.38},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/027890-028703.webm","at":279.0,"dur":8.13}]},{"speaker":"A","text":"That's actually useful. Even if you don't encounter new vocabulary during class, you can still squeeze some learning out of it because it's fun.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/028930-030198.webm","at":289.4,"dur":12.68}]},{"speaker":"B","text":"We'll spend more time on this review. It used to be impossible to read through all the noise in the mistake section without filtering it manually.","highlights":["read through"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/031638-033163.webm","at":316.5,"dur":15.25}]},{"speaker":"A","text":"True, current AIs still struggle to differentiate artifacts like 'uh' or 'um' when someone changes their mind mid-sentence.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/034484-035944.webm","at":344.9,"dur":14.6}]}],"time":3.0,"topic":0},{"title":"AI feedback and communication barriers","lines":[{"speaker":"A","text":"I don't think the AI's labels for major or minor mistakes are entirely accurate, but it's still a cool way to catch my own errors.","highlights":["entirely accurate"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/040894-042167.webm","at":409.0,"dur":12.73}]},{"speaker":"B","text":"It's actually great for spotting things like 'hair' being an uncountable mass, which I tend to mess up quite often.","highlights":["tend to mess up"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/043398-044206.webm","at":434.1,"dur":8.08}]},{"speaker":"A","text":"That's good she can rewind what she said to you now, but the real issue was that she simply couldn't understand what you were saying.","highlights":["the real issue"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/048352-049480.webm","at":483.6,"dur":11.28}]},{"speaker":"B","text":"She has a good intuition for the language, which is much better than just knowing words, but she makes way too many technical mistakes.","highlights":["good intuition"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/053040-054022.webm","at":530.5,"dur":9.82}]},{"speaker":"A","text":"I told her she needs to work with ChatGPT to fix her spelling and subject-verb agreement, because her sentences were often confusing.","highlights":["subject-verb agreement"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/057014-058205.webm","at":570.2,"dur":11.91}]},{"speaker":"B","text":"It's great she's aware of her mistakes now. I can usually tell when someone doesn't understand me, but that's part of the fun.","highlights":["part of the fun"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/062044-063166.webm","at":620.6,"dur":11.22}]},{"speaker":"A","text":"Since I work with people at a lower level, I have to pick my language very carefully and predict what they'll think before I speak.","highlights":["pick my language"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/066880-067778.webm","at":668.9,"dur":8.98}]}],"time":409.0,"topic":0},{"title":"Language learning and hardware limitations","lines":[{"speaker":"A","text":"Not knowing certain words is actually a big part of building an intuitive sense of the language.","highlights":["intuitive sense"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/069638-069997.webm","at":696.5,"dur":3.59}]},{"speaker":"B","text":"Exactly. You have to try to figure out what a word means by looking at the context of the sentence.","highlights":["figure out"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/070214-071416.webm","at":702.2,"dur":12.02}]},{"speaker":"A","text":"Successful learners understand that you will face uncertainty at all stages. Beginners often give up because they feel they have to understand everything perfectly.","highlights":["at all stages"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/071974-073246.webm","at":719.8,"dur":12.72}]},{"speaker":"B","text":"That's true. Even with books, it's a challenge. I read a 12th-century book and I don't understand many words because the language is so outdated.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/076722-077720.webm","at":767.3,"dur":9.98}]},{"speaker":"A","text":"You just have to keep pushing. Whether it's language or any other knowledge, you have to keep going.","highlights":["keep pushing"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/078842-080228.webm","at":788.5,"dur":13.86}]},{"speaker":"B","text":"I'm looking at these reviews and noticing common mistakes, like using 'she do' instead of 'she does'.","highlights":["common mistakes"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/086226-087044.webm","at":862.4,"dur":8.18}]},{"speaker":"A","text":"My computer is struggling with the heavy load right now. The problem isn't my GPU or CPU; it's that I only have 16 gigs of RAM.","highlights":["heavy load"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/093448-094075.webm","at":934.6,"dur":6.27}]},{"speaker":"B","text":"I think 64 gigs would be enough for you. I have 42, but I hit a wall sometimes when I run certain models.","highlights":["hit a wall"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/094906-096280.webm","at":949.2,"dur":13.74}]},{"speaker":"A","text":"The most important thing is actually VRAM. You need enough memory to handle the billions of parameters in the model.","highlights":["the most important thing"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/097762-098921.webm","at":977.7,"dur":11.59}]}],"time":696.5,"topic":1},{"title":"Running LLMs and the weight of AI knowledge","lines":[{"speaker":"A","text":"Do you think a 10 billion parameter model is too heavy for a local machine?","highlights":["local machine"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/102412-103166.webm","at":1024.2,"dur":7.54}]},{"speaker":"B","text":"I can actually run a 19 billion parameter model. It just takes a bit longer to process the answer.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/103180-104729.webm","at":1031.9,"dur":15.49},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/106120-107238.webm","at":1061.3,"dur":11.18}]},{"speaker":"A","text":"Last time I tried to run a model bigger than my VRAM, it just crashed.","highlights":["just crashed"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/110698-111198.webm","at":1107.1,"dur":5.0}]},{"speaker":"B","text":"I don't use my GPU; I run models using my CPU power because I have a Ryzen 7 3800X.","highlights":["CPU power"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/111598-113049.webm","at":1116.2,"dur":14.51}]},{"speaker":"A","text":"I'm running diagnostics to find out why it's failing. If it doesn't help, I might switch to Linux.","highlights":["running diagnostics"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/122738-123258.webm","at":1227.5,"dur":5.2},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/124784-125366.webm","at":1247.9,"dur":5.82}]},{"speaker":"B","text":"I've had the same issues. Sometimes I have to wait two minutes for a response, but it works.","highlights":["had the same issues"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/126724-128107.webm","at":1267.4,"dur":13.83}]},{"speaker":"A","text":"Do you feel the weight of this knowledge on you? The model will eventually analyze your mistakes very closely.","highlights":["weight of this knowledge"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/133330-133792.webm","at":1333.4,"dur":4.62},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/134118-134953.webm","at":1341.3,"dur":8.35}]},{"speaker":"B","text":"I have some thoughts. I need to think more deeply before speaking because the AI is so good at spotting errors.","highlights":["think more deeply"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/135120-136263.webm","at":1351.3,"dur":11.43}]},{"speaker":"A","text":"When you simplify your language for others, you feel like you're becoming a bit dumber.","highlights":["simplify your language"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/141026-141988.webm","at":1410.4,"dur":9.62}]},{"speaker":"B","text":"Exactly. You force yourself to be dumber so people understand, and that's when you start making mistakes.","highlights":["force yourself"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/142538-143215.webm","at":1425.5,"dur":6.77}]}],"time":1024.2,"topic":2},{"title":"Balancing Fluency and Accuracy","lines":[{"speaker":"A","text":"I feel like I make more mistakes when I try to simplify my language. I feel like I have to impress this machine.","highlights":["impress this machine"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/143914-144343.webm","at":1439.2,"dur":4.29},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/146550-146888.webm","at":1465.6,"dur":3.38}]},{"speaker":"B","text":"Do you lower your language settings when you speak with your students? I can handle your thoughts, but sometimes your accent is hard to catch.","highlights":["hard to catch"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/148934-149926.webm","at":1489.4,"dur":9.92},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/151456-151821.webm","at":1514.7,"dur":3.65}]},{"speaker":"A","text":"I've probably done that for about two months. We need to find the right level of challenge—something that's just challenging enough for you.","highlights":["challenging enough"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/152334-152840.webm","at":1523.4,"dur":5.06},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/154270-154816.webm","at":1542.8,"dur":5.46}]},{"speaker":"B","text":"Does this mean you stop constraining yourself? If you overthink it, I think it might be too easy for you.","highlights":["constraining yourself"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/155314-156540.webm","at":1553.2,"dur":12.26}]},{"speaker":"A","text":"When I talk like a normal human being and express my ideas naturally, that's the right challenge. Also, small mistakes are fine; they make you sound natural.","highlights":["normal human being"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/156820-157404.webm","at":1568.3,"dur":5.84},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/166782-167271.webm","at":1667.9,"dur":4.89}]},{"speaker":"B","text":"Language acquisition has a subconscious part. If you lean too hard on the conscious side, you lose your fluency.","highlights":["lean too hard on"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/160676-161643.webm","at":1607.0,"dur":9.67},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/165346-166016.webm","at":1653.7,"dur":6.7}]},{"speaker":"A","text":"I used to worry about making mistakes during job interviews. I'd just use terminology from the book because it was easier to explain things that way.","highlights":["job interviews"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/168582-170085.webm","at":1685.9,"dur":15.03}]},{"speaker":"B","text":"It's an adaptive mechanism. In Russian, you force yourself to sound more colloquial and friendly if you want people to like you.","highlights":["adaptive mechanism"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/177068-177750.webm","at":1770.8,"dur":6.82},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/178046-178903.webm","at":1780.6,"dur":8.57}]}],"time":1439.2,"topic":3},{"title":"Grammar mistakes and linguistic depth","lines":[{"speaker":"A","text":"I was listening to a story about a regular guy from Canada who was just a very average person.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/182206-182978.webm","at":1822.2,"dur":7.72},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/183578-184146.webm","at":1835.9,"dur":5.68}]},{"speaker":"B","text":"I know that if I say 'fewer people,' I sound like a nerd. Also, 'if I were you' is correct, but 'if I were a woman' sounds way too formal.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/185128-186582.webm","at":1851.4,"dur":14.54}]},{"speaker":"A","text":"I noticed that 'you was' is a common non-standard pattern. I've heard it in Tarantino movies and it's often used as mafia slang.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/190876-192224.webm","at":1909.0,"dur":13.48}]},{"speaker":"B","text":"Exactly. Some rappers use intentionally wrong forms to sound more gangster. I can usually catch those mistakes if I have a second to think, but when I'm overwhelmed, they slip out.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/194170-194982.webm","at":1941.8,"dur":8.12},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/197034-197478.webm","at":1970.4,"dur":4.44}]},{"speaker":"A","text":"My grammar completely leaves the chat when I'm getting intimate with a girl! I just stop thinking about the rules.","highlights":["leaves the chat"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/200896-201975.webm","at":2009.2,"dur":10.79}]},{"speaker":"B","text":"That's because it's no longer about the English language; it's about love language. Your grammar is great when you first meet her, but then it all falls apart.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/203738-204162.webm","at":2037.6,"dur":4.24},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/205172-206381.webm","at":2051.8,"dur":12.09}]},{"speaker":"A","text":"I feel like the Russian linguistic system is much deeper than the English one because the entire infrastructure was built around it for so many years.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/207326-208342.webm","at":2073.4,"dur":10.16},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/211752-212219.webm","at":2117.6,"dur":4.67}]},{"speaker":"B","text":"I think English is deep enough for automatic communication, but I see your point. It's like trying to write Python code but trying to invent pointers in C++.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/213584-214570.webm","at":2135.9,"dur":9.86}]}],"time":1822.2,"topic":4},{"title":"Perspectives on accents and communication","lines":[{"speaker":"A","text":"C++ and Python are designed for different purposes, so you just need more time to adapt to the logic.","highlights":["adapt to"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/216404-218280.webm","at":2167.7,"dur":18.76}]},{"speaker":"B","text":"That's true. Regarding accents, I've heard many people find a Russian accent quite sexy and attractive.","highlights":["quite sexy"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/219158-220658.webm","at":2191.7,"dur":15.0}]},{"speaker":"A","text":"At my previous job, people actually asked a model to speak more because they found her accent so attractive.","highlights":["previous job"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/221002-222428.webm","at":2210.1,"dur":14.26}]},{"speaker":"B","text":"I have a different theory. People generally like things that sound different, as long as it's not too far-fetched to relate to.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/229404-230860.webm","at":2294.1,"dur":14.56},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/231604-231860.webm","at":2316.2,"dur":2.56}]},{"speaker":"A","text":"Exactly. It's about being similar in many ways but slightly different in others. Also, many native speakers have accents too.","highlights":["in many ways"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/232248-232875.webm","at":2322.7,"dur":6.27},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/233476-234926.webm","at":2334.9,"dur":14.5}]},{"speaker":"B","text":"I notice that many people in AI podcasts are immigrants with very distinct accents, but that's perfectly fine.","highlights":["perfectly fine"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/236372-237921.webm","at":2363.8,"dur":15.49}]},{"speaker":"A","text":"My brother listened to me speaking with you and said I have a strong accent, but I don't really care.","highlights":["don't really care"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/239586-241052.webm","at":2396.1,"dur":14.66}]},{"speaker":"B","text":"I agree. It's more important how you build your sentences. As long as native speakers can understand you, the accent doesn't matter.","highlights":["doesn't matter"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/245316-246630.webm","at":2453.3,"dur":13.14}]},{"speaker":"A","text":"My brother always points out things I don't know. It's a character trait of his, and it can be quite annoying.","highlights":["character trait"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/249276-250682.webm","at":2492.9,"dur":14.06}]},{"speaker":"B","text":"He's a very weird one, but he's still my brother and I love him no matter how annoying he can be.","highlights":["no matter how"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/254100-255321.webm","at":2541.2,"dur":12.21}]}],"time":2167.7,"topic":4},{"title":"Radishes and Banh Mi","lines":[{"speaker":"A","text":"When I try speaking Vietnamese, my friend tells me my accent is very heavy. Honestly, I don't care as long as people understand me.","highlights":["don't care"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/256586-257671.webm","at":2566.0,"dur":10.85}]},{"speaker":"B","text":"I get that. I was looking up some words yesterday. I wanted to know how to say 'daikon' in English.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/260897-261984.webm","at":2609.1,"dur":10.87}]},{"speaker":"A","text":"Is it radish? I thought it was pronounced differently, like 'redis'.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/264240-265710.webm","at":2642.6,"dur":14.7}]},{"speaker":"B","text":"It's spelled radish. I thought there might be a distinction between different types, like garden radishes.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/271554-272916.webm","at":2715.7,"dur":13.62}]},{"speaker":"A","text":"I'm sure you've seen these in Vietnamese markets. They are very popular in Asia. That's a daikon, which is a type of radish.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/274766-276134.webm","at":2747.8,"dur":13.68}]},{"speaker":"B","text":"I remember them! They are used in miso soup. You usually slice them into squares.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/278048-278906.webm","at":2780.6,"dur":8.58}]},{"speaker":"A","text":"Actually, there's a specific word for cutting them into small cubes: you 'dice' them.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/279216-280784.webm","at":2792.4,"dur":15.68}]},{"speaker":"B","text":"I was looking for interesting ways to cook them. I found a recipe for a Vietnamese sandwich called banh mi.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/283502-285115.webm","at":2835.2,"dur":16.13}]},{"speaker":"A","text":"Banh mi is a very popular street food. In Vietnam, 'banh' means cake, and banh mi is the standard sandwich.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/286602-287950.webm","at":2866.2,"dur":13.48}]},{"speaker":"B","text":"We actually eat it every morning for breakfast at a local food stall. It's very cheap.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/288248-289686.webm","at":2882.6,"dur":14.38}]},{"speaker":"A","text":"Have you ever tried Subway? It's a bit similar to a sandwich, but I think Subway is better.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/289480-289931.webm","at":2894.9,"dur":4.51},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/290106-291607.webm","at":2901.3,"dur":15.01}]},{"speaker":"B","text":"I love Subway too. It's a great option.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/291478-292568.webm","at":2914.9,"dur":10.9}]}],"time":2566.0,"topic":4},{"title":"Seafood, cravings, and local milkshakes","lines":[{"speaker":"A","text":"Vietnam has a lot of seafood, and there are even restaurants dedicated specifically to it.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/294886-295571.webm","at":2949.1,"dur":6.85}]},{"speaker":"B","text":"Vietnamese people love beer, and dried fish or shrimp go really well with it.","highlights":["go really well with"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/295724-296917.webm","at":2957.4,"dur":11.93}]},{"speaker":"A","text":"We tried a seafood restaurant once just to see, but I didn't really enjoy it. I prefer marinated seafood with flavor.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/297102-297734.webm","at":2971.1,"dur":6.32},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/298598-299540.webm","at":2986.1,"dur":9.42}]},{"speaker":"B","text":"That's true. If you just boil octopus, it's tasteless. You have to be very careful with the sauces and how you cook it.","highlights":["be very careful with"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/300574-301798.webm","at":3005.9,"dur":12.24}]},{"speaker":"A","text":"I like salmon steak, but it can be so fatty and hard to eat. It's best when it's just salted.","highlights":["hard to eat"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/302362-303478.webm","at":3023.7,"dur":11.16}]},{"speaker":"B","text":"I sometimes buy salted salmon for sandwiches. It's a classic, especially for New Year's.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/305868-307322.webm","at":3058.8,"dur":14.54}]},{"speaker":"A","text":"I have this inner voice that tells me I'll die if I don't buy oranges or orange juice when I'm at the market.","highlights":["inner voice"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/309378-310840.webm","at":3093.9,"dur":14.62}]},{"speaker":"B","text":"Do you have a sweet tooth? I have extreme cravings for sweets when I'm thinking a lot. It's like a herring shot.","highlights":["have a sweet tooth","extreme craving"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/312938-314340.webm","at":3129.5,"dur":14.02}]},{"speaker":"A","text":"You need calories for your brain, like glucose. I have the same thing, but with a specific milkshake from this region.","highlights":["the same thing"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/317400-318005.webm","at":3174.1,"dur":6.05},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/318236-319210.webm","at":3182.6,"dur":9.74}]},{"speaker":"B","text":"I'm a huge fan of it! It's so cheap, but I don't know why they don't sell it in other regions.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/319694-320976.webm","at":3197.0,"dur":12.82}]},{"speaker":"A","text":"It's probably a logistics problem because of the expiration dates. They would need a really good logistics app.","highlights":["logistics problem"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/324748-326158.webm","at":3247.6,"dur":14.1}]}],"time":2949.1,"topic":5},{"title":"Vocabulary nuances and cultural differences","lines":[{"speaker":"A","text":"I'm looking for customers for Volagosha. I think it would be popular in schools, maybe in 9-liter bottles.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/327528-328956.webm","at":3275.4,"dur":14.28},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/330194-330676.webm","at":3302.1,"dur":4.82}]},{"speaker":"B","text":"That's interesting. By the way, is 'pupil' still used? I feel like it's a bit outdated.","highlights":["a bit outdated"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/331560-332881.webm","at":3315.8,"dur":13.21}]},{"speaker":"A","text":"In the UK, it might be used in universities with traditions, but in America, people might think of your eyes.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/334910-336348.webm","at":3349.2,"dur":14.38}]},{"speaker":"B","text":"Right, like dilated pupils. Also, I learned that 'rubber' is a mistake. In America, you have to say 'eraser'.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/336818-338534.webm","at":3368.3,"dur":17.16}]},{"speaker":"A","text":"Exactly. If you say 'flat' in the US, they won't think of an apartment; they might think of a flat earth.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/342414-343856.webm","at":3424.2,"dur":14.42}]},{"speaker":"B","text":"I remember that Russian meme about the flat earth from around 2013 or 2014. It was quite popular.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/344974-347310.webm","at":3449.8,"dur":23.36},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/347280-348109.webm","at":3473.0,"dur":8.29}]},{"speaker":"A","text":"You have a wide-ranging vocabulary now. You can discuss various topics, but now is the time to refine your grammar.","highlights":["wide-ranging vocabulary"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/351236-352029.webm","at":3512.6,"dur":7.93},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/352240-353704.webm","at":3522.6,"dur":14.64}]},{"speaker":"B","text":"I've started noticing small details, like whether to say 'on New Year' or 'at New Year'.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/357222-358463.webm","at":3572.3,"dur":12.41}]},{"speaker":"A","text":"Actually, it's usually 'on New Year's Day'. In English-speaking countries, New Year's isn't always treated as a standard holiday.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/358676-359975.webm","at":3586.9,"dur":12.99},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/362194-363519.webm","at":3622.1,"dur":13.25}]}],"time":3275.4,"topic":5},{"title":"Prepositions and quirks of English holidays","lines":[{"speaker":"A","text":"I'm curious about the difference between 'at school', 'in school', and 'in the school'.","highlights":["the difference between"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/367644-367877.webm","at":3676.5,"dur":2.33}]},{"speaker":"B","text":"I'm still trying to figure out the exact rules, but I'm confused about why we say 'New Year's' with an 's' at the end.","highlights":["figure out"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/370390-371133.webm","at":3704.0,"dur":7.43}]},{"speaker":"A","text":"It's because it's New Year's Eve, the day before the holiday, just like Christmas Eve.","highlights":["the day before"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/372056-372942.webm","at":3720.7,"dur":8.86}]},{"speaker":"B","text":"The deeper you dive into the topic of holidays, the more interesting it gets because of all the exceptions.","highlights":["dive into"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/376948-377550.webm","at":3769.6,"dur":6.02}]},{"speaker":"A","text":"For example, you don't say 'Christmas's Eve', and it's the same for Halloween.","highlights":["the same for"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/377642-378609.webm","at":3776.5,"dur":9.67}]},{"speaker":"B","text":"We can say 'at Christmas' or 'at Easter', which sounds very natural in British English.","highlights":["natural in"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/383990-385269.webm","at":3840.1,"dur":12.79},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/385686-386148.webm","at":3857.1,"dur":4.62}]},{"speaker":"A","text":"Is it okay to say 'for Easter'? I'd say it works in this context.","highlights":["works in this context"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/387618-388612.webm","at":3876.3,"dur":9.94}]},{"speaker":"B","text":"It's similar to saying 'for breakfast'. You could also say 'during breakfast'.","highlights":["similar to"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/390776-391656.webm","at":3907.9,"dur":8.8}]},{"speaker":"A","text":"There are so many interesting quirks like that. I think reviewing these mistakes is actually a good thing.","highlights":["quirks like that"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/392958-393958.webm","at":3929.8,"dur":10.0}]},{"speaker":"B","text":"You often omit articles, which is a common mistake you'll definitely see in the review.","highlights":["omit articles"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/395098-396337.webm","at":3951.2,"dur":12.39}]}],"time":3676.5,"topic":6},{"title":"Improving pronunciation through AI feedback","lines":[{"speaker":"A","text":"It's not always obvious, but you sometimes struggle with certain words because it's hard to remember which syllable to stress.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/401424-402291.webm","at":4014.3,"dur":8.67}]},{"speaker":"B","text":"Exactly. The engine can detect those stresses, but you might think a word is pronounced one way when it's actually different.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/404420-405303.webm","at":4044.4,"dur":8.83}]},{"speaker":"A","text":"It's a good habit to listen to your own speech. If you have even the slightest doubt about a word, you should check its pronunciation right away.","highlights":["slightest doubt"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/405682-406512.webm","at":4057.0,"dur":8.3}]},{"speaker":"B","text":"I've noticed at least two words today where you mispronounced them. I'm actually curious to see them in the review.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/408052-409381.webm","at":4080.7,"dur":13.29}]},{"speaker":"A","text":"The model might recognize a word because some people pronounce it that way, but you won't know you're making a mistake until you hear the correct pronunciation.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/409754-410434.webm","at":4097.6,"dur":6.8}]},{"speaker":"B","text":"Sometimes it completely messes up a word. For example, it might hear 'weird' and think you said 'virtual'.","highlights":["messes up"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/411390-411885.webm","at":4114.0,"dur":4.95},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/412614-412928.webm","at":4126.3,"dur":3.14}]},{"speaker":"A","text":"In the previous lesson, I used to say 'stop talking' but I forgot about the 'the' and it was read as 'comments'.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/414368-415838.webm","at":4143.8,"dur":14.7}]},{"speaker":"B","text":"When you hear how you actually pronounce it, you can spot the mistake pretty easily. It's the only workaround for now.","highlights":["spot the mistake"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/418092                 const render = (tokens, tag) => tokens.map(t => {
                    if (t.kind === 'gap') return '<span class="gap" aria-hidden="true"></span>';
                    return t.kind === 'same' ? esc(t.word) : `<${tag} class="w">${esc(t.word)}</${tag}>`;
                }).join(' ').replace(/<\/(del|ins)> <\1 class="w">/g, ' ');
                return { said: render(left, 'del'), fixed: render(right, 'ins') };
            }

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {
                    if (!hit[index] && functional.has(norm(part))) {
                        const near = [index - 2, index + 2].some(k => hit[k]);
                        if (near) hit[index] = true;
                    }
                });
                return parts.map((part, index) => {
                    if (!hit[index]) return esc(part);
                    // Underline the word itself, not quotes or punctuation stuck to it.
                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                    return `${esc(before)}<b class="hl">${esc(core)}</b>${esc(after)}`;
                }).join('');
            }

            // link(phrase): the vocabulary entry of a highlighted phrase, or -1.
            function highlightPhrases(text, phrases, link) {
                const lower = text.toLowerCase();
                const ranges = [];
                (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length, phrase]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end, phrase]) => {
                    const word = link ? link(phrase) : -1;
                    const opens = word >= 0 ? ` data-vocab="${word}" title="${esc(`See “${vocabulary[word].term}” in Vocabulary`)}"` : '';
                    html += esc(text.slice(cursor, start)) + `<mark class="expr"${opens}>${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {
                    if (value === undefined) return window.localStorage.getItem(key);
                    window.localStorage.setItem(key, value);
                } catch (_error) {
                    return null;
                }
                return null;
            }

            // ---------------------------------------------------------- header
            document.getElementById('title').textContent = meta.title || 'Lesson review';

            // The lesson time in Moscow time (meta.start_utc: when the lesson
            // began, in seconds since 1970). A tap shows it in the reader's own
            // time zone instead, remembered on the phone. Older pages have no
            // start_utc: the date and time as recorded, with no zone.
            const eyebrow = document.getElementById('eyebrow');
            const lessonStart = typeof meta.start_utc === 'number' && isFinite(meta.start_utc) ? new Date(meta.start_utc * 1000) : null;
            let lessonTimes = null;
            let ownZone = storage('lesson-time-zone') === 'own';

            function zoneTime(zone) {
                const date = { day: 'numeric', month: 'long', year: 'numeric' };
                const time = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
                if (zone) { date.timeZone = zone; time.timeZone = zone; }
                return {
                    date: new Intl.DateTimeFormat('en-GB', date).format(lessonStart),
                    time: new Intl.DateTimeFormat('en-GB', time).format(lessonStart)
                };
            }

            function offsetName(minutes) {
                const size = Math.abs(minutes);
                if (!size) return 'GMT';
                return 'GMT' + (minutes < 0 ? '-' : '+') + Math.floor(size / 60) + (size % 60 ? ':' + String(size % 60).padStart(2, '0') : '');
            }

            if (lessonStart) {
                try {
                    const moscow = zoneTime('Europe/Moscow');
                    const own = zoneTime(null);
                    lessonTimes = {
                        moscow: Object.assign(moscow, { zone: 'MSK', name: 'Moscow time' }),
                        own: Object.assign(own, { zone: offsetName(-lessonStart.getTimezoneOffset()), name: 'your time' }),
                        differ: moscow.date !== own.date || moscow.time !== own.time
                    };
                } catch (_error) {
                    lessonTimes = null;  // no time zones in this browser: the time as recorded
                }
            }

            function showLessonTime() {
                let date = meta.date;
                if (!lessonTimes) {
                    eyebrow.textContent = ['English lesson', meta.date, meta.time].filter(Boolean).join(' · ');
                } else {
                    const shown = lessonTimes.differ && ownZone ? lessonTimes.own : lessonTimes.moscow;
                    const other = shown === lessonTimes.own ? lessonTimes.moscow : lessonTimes.own;
                    const time = `${esc(shown.time)} <span class="tz">${esc(shown.zone)}</span>`;
                    date = shown.date;
                    eyebrow.innerHTML = `English lesson · ${esc(shown.date)} · `
                        + (lessonTimes.differ
                            ? `<button class="tz-btn" type="button" title="Show ${esc(other.name)} (${esc(other.zone)})" aria-label="${esc(`${shown.time} ${shown.name}. Show ${other.name}, ${other.zone}`)}">${time}</button>`
                            : `<span class="tz-time">${time}</span>`);
                }
                document.title = (meta.title ? meta.title + ' · ' : '') + 'English lesson' + (date ? ' · ' + date : '');
            }
            showLessonTime();
            eyebrow.addEventListener('click', event => {
                if (!event.target.closest('.tz-btn')) return;
                ownZone = !ownZone;
                storage('lesson-time-zone', ownZone ? 'own' : 'moscow');
                showLessonTime();
                const button = eyebrow.querySelector('.tz-btn');
                if (button && event.detail === 0) button.focus();  // kept for the keyboard
            });

            document.getElementById('count-mistakes').textContent = mistakes.length;
            document.getElementById('count-vocabulary').textContent = vocabulary.length;
            document.getElementById('count-dialogues').textContent = dialogues.length;

            // -------------------------------------------------------- mistakes
            const topics = lesson.topics || [];
            // Each mistake example, word and dialogue line can be found by the timeline.
            const exampleIds = new Map();
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => exampleIds.set(example, `m-${c}-${e}`)));
            let showAllMistakes = () => {};
            let vocabularyToWords = () => {};
            // What "Go back" needs to put a section back as it was.
            let mistakeFilter = () => 'all';
            let setMistakeFilter = () => {};
            let vocabularyView = () => 'words';
            let setVocabularyView = () => {};

            function clock(seconds) {
                if (seconds === null || seconds === undefined) return '';
                const total = Math.max(0, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const rest = String(total % 60).padStart(2, '0');
                return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
            }

            function plain(text) {
                return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
            }

            // One example: when it was said, the full sentence(s) as said and
            // corrected, and (where it adds something) its own explanation.
            function exampleHtml(example, options) {
                const before = example.context || example.quote;
                const after = example.context_fix || example.fix;
                const d = diff(before, after);
                // The clip pill needs no separator: it stays apart from the topic when the line wraps.
                const pill = clipHtml(example.clip, 'Hear what was said');
                // The letters beside the time open the same moment in the other sections.
                const jumps = jumpsHtml('mistakes', example.clip ? example.clip.at : example.time);
                const facts = [];
                if (!pill && example.time !== null && example.time !== undefined) facts.push(`<span class="clock">${clock(example.time)}</span>${jumps}`);
                if (options.showTopic && topics[example.topic]) facts.push(`<span>${esc(topics[example.topic].title)}</span>`);
                let html = `<div class="pair" data-item="${exampleIds.get(example) || ''}"${options.hidden ? ' hidden' : ''}>`;
                const separator = jumps && !pill ? '' : '<span class="sep">·</span>';
                if (pill || facts.length) html += `<div class="ex-meta" data-no-speech>${pill}${pill ? jumps : ''}${facts.join(separator)}</div>`;
                html += `<div class="said"><span class="mark-icon" aria-label="What was said" data-no-speech>✗</span><span class="txt">${d.said}</span></div>`;
                html += `<div class="fixed"><span class="mark-icon" aria-label="Better" data-no-speech>✓</span><span class="txt">${d.fixed}</span>${playButton(after, 'Listen to the correct version')}</div>`;
                if (options.why) html += `<p class="ex-why">${esc(options.why)}</p>`;
                return html + '</div>';
            }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
                    html += items.map(item => `<li><span class="meaning">${esc(item.meaning)}</span><span class="m-ex">${highlightTerm(item.example, entry.term)}`
                        + (item.lesson ? ' <span class="from-lesson" data-no-speech>from the lesson</span>' : '') + '</span></li>').join('');
                    return html + '</ol></div>';
                };
                return '<div class="forms">'
                    + column('Countable', 'a / an, plural', entry.countable || [])
                    + column('Uncountable', 'no a / an, no plural', entry.uncountable || [])
                    + '</div>';
            }

            function relatedHtml(entry) {
                const row = (title, words) => (words || []).length
                    ? `<div class="rel"><p class="part-title" data-no-speech>${title}</p><span class="rel-words">${words.map(w => `<span class="rel-word">${esc(w)}</span>`).join('<span class="sep" data-no-speech> · </span>')}</span></div>`
                    : '';
                return row('Synonyms', entry.synonyms) + row('Antonyms', entry.antonyms);
            }

            // Visible: when it was said, the word, the meaning, the lesson's own
            // words and at least three examples. The rest opens on request.
            function wordCardHtml(entry, index) {
                const term = entry.term || '';
                let html = `<article class="card word" id="word-${index}"><div class="w-head">`;
                if (entry.clip) html += clipHtml(entry.clip, 'Hear it in the lesson');
                else if (entry.time !== null && entry.time !== undefined) html += `<span class="clock" data-no-speech>${clock(entry.time)}</span>`;
                html += jumpsHtml('vocabulary', entry.clip ? entry.clip.at : entry.time);
                // The word, its kind and its speaker stay together (a new row when
                // they do not fit); the kind and the speaker never part.
                html += `<div class="w-title"><h3 class="w-term">${esc(term)}</h3><span class="w-side">`;
                if (entry.pos) html += `<span class="w-pos" data-no-speech>${esc(entry.pos)}</span>`;
                html += playButton(term, 'Listen to ' + term) + '</span></div></div>';
                if (entry.definition) html += `<p class="def">${esc(entry.definition)}</p>`;
                const passage = entry.lesson || entry.lesson_example;
                if (passage) {
                    html += `<div class="lesson-ex"><div class="txt"><span class="src" data-no-speech>From the lesson</span>${highlightTerm(passage, term)}</div>${playButton(passage, 'Listen')}</div>`;
                }
                const examples = exampleItems(entry);
                if (examples.length) {
                    html += '<ul class="examples">' + examples.map(example => '<li>'
                        + (example.pattern ? `<span class="pat" data-no-speech>${esc(example.pattern)}</span> ` : '')
                        + highlightTerm(example.sentence, term) + '</li>').join('') + '</ul>';
                }
                if (entry.note) html += `<p class="note">${icons.bulb}<span>${esc(entry.note)}</span></p>`;

                const parts = [];
                if ((entry.countable || []).length || (entry.uncountable || []).length) parts.push(['forms', 'Countable / uncountable', formsHtml(entry)]);
                if ((entry.more_examples || []).length) {
                    parts.push(['more', 'More examples', '<p class="part-title" data-no-speech>More examples</p><ul class="examples">'
                        + entry.more_examples.map(s => `<li>${highlightTerm(s, term)}</li>`).join('') + '</ul>']);
                }
                const related = relatedHtml(entry);
                if (related) parts.push(['related', 'Synonyms & antonyms', related]);
                if (parts.length) {
                    html += '<div class="more-bar" data-no-speech>'
                        + parts.map(([id, name]) => `<button class="more-btn" type="button" data-part="${id}" aria-expanded="false">${name}</button>`).join('')
                        + '<button class="more-btn more-hide" type="button">Hide</button></div>';
                    html += parts.map(([id, , body]) => `<div class="more-part" data-part="${id}" hidden>${body}</div>`).join('');
                }
                return html + '</article>';
            }

            // Matching pairs: all the words, shuffled into rounds of about six;
            // the meanings are shuffled separately.
            function renderMatch(game) {
                const pool = shuffled(matchable);
                const roundCount = Math.ceil(pool.length / 6);
                const rounds = [];
                for (let r = 0, cursor = 0; r < roundCount; r++) {
                    const size = Math.floor(pool.length / roundCount) + (r < pool.length % roundCount ? 1 : 0);
                    rounds.push(pool.slice(cursor, cursor + size));
                    cursor += size;
                }
                let round = 0, misses = 0, picked = null;
                const missText = () => misses === 1 ? '1 mistake' : `${misses} mistakes`;

                function draw() {
                    const ids = rounds[round];
                    let html = `<div class="game-head" data-no-speech><span>Round ${round + 1} of ${rounds.length}</span><span class="game-score">${missText()}</span></div>`;
                    html += '<p class="game-hint" data-no-speech>Tap a word, then its meaning.</p>';
                    html += '<div class="match-board" data-no-speech><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile term" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].term)}</button>`).join('');
                    html += '</div><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile meaning" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].definition)}</button>`).join('');
                    html += '</div></div><div class="game-foot" data-no-speech></div>';
                    game.innerHTML = html;
                    picked = null;
                }

                function roundDone() {
                    const foot = game.querySelector('.game-foot');
                    if (round + 1 < rounds.length) {
                        foot.innerHTML = `<p>Round complete!</p><button class="game-btn" type="button" data-action="next-round">Next round</button>`;
                    } else {
                        foot.innerHTML = `<div class="summary"><p class="big">All ${pool.length} words matched</p><p>${missText()}</p>`
                            + '<button class="game-btn" type="button" data-action="restart">Play again</button></div>';
                    }
                    foot.querySelector('button').focus({ preventScroll: true });
                }

                game.addEventListener('click', event => {
                    const tile = event.target.closest('.tile');
                    if (tile && !tile.disabled) {
                        const side = tile.classList.contains('term') ? 'term' : 'meaning';
                        if (picked === tile) {
                            tile.setAttribute('aria-pressed', 'false');
                            picked = null;
                        } else if (!picked || picked.classList.contains(side)) {
                            if (picked) picked.setAttribute('aria-pressed', 'false');
                            picked = tile;
                            tile.setAttribute('aria-pressed', 'true');
                        } else {
                            const other = picked;
                            picked = null;
                            other.setAttribute('aria-pressed', 'false');
                            if (other.dataset.id === tile.dataset.id) {
                                [other, tile].forEach(t => { t.classList.add('done'); t.disabled = true; });
                                speak(vocabulary[Number(tile.dataset.id)].term);
                                if (!game.querySelector('.tile:not(.done)')) roundDone();
                            } else {
                                misses++;
                                game.querySelector('.game-score').textContent = missText();
                                [other, tile].forEach(t => {
                                    t.classList.remove('wrong');
                                    void t.offsetWidth; // restart the shake
                                    t.classList.add('wrong');
                                    setTimeout(() => t.classList.remove('wrong'), 450);
                                });
                            }
                        }
                        return;
                    }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next-round') { round++; draw(); }
                    if (action.dataset.action === 'restart') renderMatch(freshGame());
                });
                draw();
            }

            // Fill the gap: a new sentence, the word hidden, four options.
            function renderGap(game) {
                const order = shuffled(gapItems);
                let position = 0, score = 0;
                const missed = [];

                function draw() {
                    const { entry } = order[position];
                    const [before, after] = entry.gap.sentence.split(/_{3,}/);
                    let html = `<div class="game-head" data-no-speech><span>${position + 1} of ${order.length}</span><span class="game-score">${score} correct</span></div>`;
                    html += `<div class="card"><p class="gap-sentence">${esc(before)}<span class="blank" data-no-speech>&nbsp;</span>${esc(after || '')}</p>`;
                    html += '<div class="options" data-no-speech>'
                        + shuffled(entry.gap.options).map(o => `<button class="option" type="button" data-option="${esc(o)}">${esc(o)}</button>`).join('')
                        + '</div><div class="gap-result" hidden></div></div>';
                    game.innerHTML = html;
                }

                function answer(button) {
                    const { entry, index } = order[position];
                    const right = button.dataset.option === entry.gap.answer;
                    game.querySelectorAll('.option').forEach(b => {
                        b.disabled = true;
                        if (b.dataset.option === entry.gap.answer) b.classList.add('right');
                    });
                    if (right) score++;
                    else { button.classList.add('wrong'); missed.push(index); }
                    game.querySelector('.game-score').textContent = `${score} correct`;
                    const blank = game.querySelector('.blank');
                    blank.textContent = entry.gap.answer;
                    blank.classList.add('filled');
                    blank.removeAttribute('data-no-speech');
                    const full = entry.gap.sentence.replace(/_{3,}/, entry.gap.answer);
                    const last = position + 1 >= order.length;
                    const result = game.querySelector('.gap-result');
                    result.innerHTML = `<p class="verdict ${right ? 'ok' : 'no'}" data-no-speech>${right ? '✓ Correct' : `✗ The answer is “${esc(entry.gap.answer)}”`}</p>`
                        + `<p class="gap-def"><b>${esc(entry.term)}</b>: ${esc(entry.definition)}</p>`
                        + `<div class="gap-actions" data-no-speech>${playButton(full, 'Listen to the sentence')}`
                        + `<button class="game-btn secondary" type="button" data-word="${index}">See the word</button>`
                        + `<button class="game-btn" type="button" data-action="${last ? 'finish' : 'next'}">${last ? 'Finish' : 'Next'}</button></div>`;
                    result.hidden = false;
                    result.querySelector('[data-action]').focus({ preventScroll: true });
                }

                function finish() {
                    let html = `<div class="card summary"><p class="big">${score} of ${order.length}</p><p>${score === order.length ? 'Perfect!' : 'Words to review:'}</p>`;
                    if (missed.length) {
                        html += '<div class="missed" data-no-speech>' + missed.map(i => `<button class="chip" type="button" data-word="${i}">${esc(vocabulary[i].term)}</button>`).join('') + '</div>';
                    }
                    html += '<button class="game-btn" type="button" data-action="restart">Try again</button></div>';
                    game.innerHTML = html;
                }

                game.addEventListener('click', event => {
                    const option = event.target.closest('.option');
                    if (option && !option.disabled) { answer(option); return; }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next') { position++; draw(); }
                    if (action.dataset.action === 'finish') finish();
                    if (action.dataset.action === 'restart') renderGap(freshGame());
                });
                draw();
            }

            let freshGame = () => null;

            function renderVocabulary() {
                const panel = document.getElementById('panel-vocabulary');
                if (!vocabulary.length) {
                    panel.innerHTML = '<p class="empty">No new vocabulary in this lesson.</p>';
                    return;
                }
                const views = [['words', 'Words']];
                if (matchable.length >= 3) views.push(['match', 'Match']);
                if (gapItems.length) views.push(['gap', 'Fill the gap']);
                let html = '';
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Study or practise" data-no-speech>'
                        + views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('')
                        + '</div>';
                }
                html += '<div id="vocab-view"></div>';
                html += `<button class="back-to-quiz" type="button" hidden data-no-speech>${icons.backArrow}Back to the quiz</button>`;
                panel.innerHTML = html;
                const host = document.getElementById('vocab-view');
                const backButton = panel.querySelector('.back-to-quiz');
                // "See the word" leaves the quiz as it is (same question, same
                // score); the button brings it back where the reader left it.
                let current = 'words';
                let paused = null;
                const leaveQuiz = () => {
                    paused = null;
                    backButton.hidden = true;
                };
                // Each game gets a new element, so its listeners go away with it.
                freshGame = () => {
                    host.innerHTML = '<div class="game"></div>';
                    return host.firstChild;
                };

                const show = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'words';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    if (view === 'gap' && paused) {
                        const { game, scroll } = paused;
                        leaveQuiz();
                        host.replaceChildren(game);
                        window.scrollTo({ top: scroll });
                        const next = game.querySelector('[data-action]');
                        if (next) next.focus({ preventScroll: true });
                    } else if (view === 'match') { leaveQuiz(); renderMatch(freshGame()); }
                    else if (view === 'gap') renderGap(freshGame());
                    else host.innerHTML = vocabulary.map(wordCardHtml).join('');
                    current = view;
                    if (remember) storage('lesson-vocab-view', view);
                };
                backButton.addEventListener('click', () => show('gap', false));
                // The timeline opens the word list the way "See the word" does:
                // a quiz in progress waits behind "Back to the quiz".
                vocabularyToWords = () => {
                    if (current === 'words') return;
                    const game = current === 'gap' ? host.querySelector('.game') : null;
                    const scroll = window.scrollY;
                    show('words', false);
                    if (game) {
                        paused = { game, scroll };
                        backButton.hidden = false;
                    }
                };
                // "Go back" to a quiz resumes it where it was (a paused one).
                vocabularyView = () => current;
                setVocabularyView = view => {
                    if (view === current) return;
                    if (view === 'words') vocabularyToWords();
                    else show(view, false);
                };

                panel.addEventListener('click', event => {
                    const view = event.target.closest('.view');
                    if (view) { show(view.dataset.view, true); return; }
                    // Any of the buttons opens all the parts in place (always in
                    // the same order; the page does not move, its own part lights
                    // up briefly); "Hide" closes them again.
                    const more = event.target.closest('.more-btn');
                    if (more) {
                        const word = more.closest('.word');
                        const open = !more.classList.contains('more-hide');
                        word.querySelector('.more-bar').classList.toggle('open', open);
                        word.querySelectorAll('.more-btn:not(.more-hide)').forEach(button => button.setAttribute('aria-expanded', String(open)));
                        word.querySelectorAll('.more-part').forEach(part => { part.hidden = !open; });
                        if (open) flashItem(word.querySelector(`.more-part[data-part="${more.dataset.part}"]`));
                        return;
                    }
                    const jump = event.target.closest('[data-word]');
                    if (jump) {
                        const game = current === 'gap' ? host.querySelector('.game') : null;
                        const scroll = window.scrollY;
                        show('words', false);
                        if (game) {
                            paused = { game, scroll };
                            backButton.hidden = false;
                        }
                        const card = document.getElementById('word-' + jump.dataset.word);
                        if (card) {
                            glideToCenter(card);
                            card.classList.add('flash');
                            setTimeout(() => card.classList.remove('flash'), 1500);
                        }
                    }
                });
                show(storage('lesson-vocab-view') || 'words', false);
            }

            // ------------------------------------------------------- dialogues
            const inTime = (x, y) => (x.dialogue.time ?? x.number) - (y.dialogue.time ?? y.number);
            const dialogueItems = dialogues.map((dialogue, number) => ({ dialogue, number })).sort(inTime);

            // A highlighted phrase opens its word card when the vocabulary has
            // it: "took her temperature" finds "take someone's temperature".
            // Word forms, capitals, placeholders (someone, something), pronouns
            // and possessives do not matter; the small words of a phrasal verb
            // do ("look up" is not "look after"). A phrase may hold the whole
            // term ("practically mythical": "mythical"), or be at least half
            // of it ("under the weather": "feel under the weather").
