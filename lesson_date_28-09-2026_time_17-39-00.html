<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;

 themselves before the deadline."],"synonyms":["overexert","overstrain","overdo it","work oneself to exhaustion"],"antonyms":["rest","relax","take it easy"],"gap":{"sentence":"After working sixty hours this week, he felt so exhausted that he realized he had _____ himself.","answer":"overworked","options":["overworked","relaxed","prepared","organized"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/002704-002935.webm","at":27.1,"dur":2.31}},{"term":"correlation","pos":"noun","definition":"A mutual connection or relationship between two different things.","time":111.0,"lesson":"I was envious of your beard. Why didn't we discuss penises? Maybe there is some correlation between beard size and penis size.","examples":[{"sentence":"There is a high correlation between regular exercise and better sleep quality.","pattern":"correlation between A and B"},{"sentence":"Researchers found a correlation between high sugar intake and tooth decay.","pattern":"find a correlation between"},{"sentence":"The study showed no correlation between the two variables.","pattern":"no correlation between"},{"sentence":"Is there any correlation between the weather and your mood?","pattern":"Is there any correlation between...?"}],"countable":[{"meaning":"A mutual connection or relationship between two different things.","example":"Maybe there is some correlation between beard size and penis size.","lesson":true}],"uncountable":[],"more_examples":["The data suggests a strong correlation between poverty and crime rates.","Is there a correlation between the amount of coffee you drink and your anxiety levels?","The report highlights a correlation between employee satisfaction and productivity."],"synonyms":["connection","relationship","link","association"],"antonyms":["disconnection"],"gap":{"sentence":"The marketing team noticed a clear _____ between the increase in social media ads and the rise in online sales.","answer":"correlation","options":["correlation","competition","restriction","opinion"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/011350-011800.webm","at":113.6,"dur":4.5}},{"term":"refine","pos":"verb","definition":"To improve something by making small changes or adjustments to make it more accurate.","time":157.0,"lesson":"Now that I run everything on my own machine, I can make many more prompts and I can refine things much better. It actually filters out mistakes quite well now.","examples":[{"sentence":"We need to refine the plan before we present it to the board.","pattern":"refine + noun"},{"sentence":"The chef refined the recipe by adding a hint of ginger.","pattern":"refine + [something] + by + -ing"},{"sentence":"The software is still in the early stages and needs to be refined.","pattern":"passive voice: need to be refined"},{"sentence":"I spent the afternoon refining my essay to make the arguments clearer.","pattern":"refining + [something] + to + verb"}],"more_examples":["The coach helped the players refine their technique before the final match.","We need to refine our marketing strategy to reach a younger audience.","The artist spent weeks refining the details of the portrait."],"synonyms":["polish","fine-tune","perfect","adjust","tweak","streamline"],"antonyms":["ruin","spoil","degrade","worsen","impair"],"gap":{"sentence":"The marketing team needs to _____ the logo design to ensure it looks more professional before the launch.","answer":"refine","options":["refine","ignore","abandon","hide"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/015762-016279.webm","at":157.7,"dur":5.17}},{"term":"filter out","pos":"phrasal verb","definition":"To remove unwanted things, information, or errors from a process or a group.","time":162.1,"lesson":"I can make much more prompts and refine things much better. The system actually filters out mistakes quite well, so there is no noise like there used to be.","examples":[{"sentence":"The new software is designed to filter out spam emails automatically.","pattern":"filter out + [noun]"},{"sentence":"You need to filter out the irrelevant data before analyzing the results.","pattern":"filter out + [noun] + before + [-ing]"},{"sentence":"The company uses a screening process to filter out unqualified candidates.","pattern":"use [something] to filter out"},{"sentence":"It's hard to filter out the background noise when recording a podcast.","pattern":"filter out + the [noun]"}],"more_examples":["The water purifier is designed to filter out impurities from the drinking water.","You should try to filter out the opinions of people who don't have experience in this field.","The app helps you filter out advertisements so you can watch the video uninterrupted."],"synonyms":["screen out","weed out","eliminate","exclude","sift out","remove","separate out","eject"],"antonyms":["include","incorporate","keep in","allow in","accept"],"gap":{"sentence":"The coffee machine has a special mechanism to _____ the grounds so the drink stays smooth.","answer":"filter out","options":["filter out","mix with","keep in","pour into"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/016294-016694.webm","at":163.0,"dur":4.0}},{"term":"mental model","pos":"noun phrase","definition":"An internal understanding or framework used to organize information and remember specific details.","time":185.2,"lesson":"You can tell when something happened because you have a timer. This is because you usually have a mental model in your head; you understand and remember exactly what a certain person said.","examples":[{"sentence":"I have a mental model of how the company's hierarchy works.","pattern":"have a mental model of [something]"},{"sentence":"The goal of the training is to help students build a mental model of the ecosystem.","pattern":"build a mental model"},{"sentence":"His mental model of the situation was completely different from the reality.","pattern":"mental model of [something]"},{"sentence":"You need to develop a mental model to understand how these complex systems interact.","pattern":"develop a mental model"}],"countable":[{"meaning":"An internal understanding or framework used to organize information and remember specific details.","example":"This is because you usually have a mental model in your head; you understand and remember exactly what a certain person said.","lesson":true},{"meaning":"A representation of a physical object or process in the mind","example":"The architect had a mental model of the building's structure before drawing the plans."}],"uncountable":[],"more_examples":["Once you have a mental model of the software's logic, it's much easier to troubleshoot errors.","The teacher tried to provide a mental model of the historical timeline to help the students visualize the era.","It's hard to solve the problem if your mental model of the engine is outdated."],"synonyms":["conceptual framework","cognitive map","internal representation","schema","framework","mental map"],"antonyms":["objective reality"],"gap":{"sentence":"Once you have a clear _____ of the software's logic, troubleshooting complex bugs becomes much easier.","answer":"mental model","options":["mental model","daily routine","simple rule","short note"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/018712-019529.webm","at":187.2,"dur":8.17}},{"term":"synchronize","pos":"verb","definition":"To align different parts of a timeline or interface so they match up correctly.","time":199.0,"lesson":"You can remember exactly when a certain person said something and synchronize it across different parts of the screen. For example, there is a synchronization bar on the right side.","examples":[{"sentence":"The software automatically synchronizes your data across all your devices.","pattern":"automatically + synchronize"},{"sentence":"We need to synchronize our watches before the race starts.","pattern":"need to + synchronize"},{"sentence":"The video and the audio are out of sync; I need to synchronize them.","pattern":""},{"sentence":"The team is trying to synchronize their efforts to meet the deadline.","pattern":"synchronize + [noun phrase]"}],"more_examples":["The app will synchronize your calendar with your email account.","Please make sure to synchronize your smart home devices before the update.","It's important to synchronize the start times of the different marketing campaigns."],"synonyms":["align","coordinate","match up","mesh","time","harmonize","calibrate"],"antonyms":["desynchronize","de-coordinate"],"gap":{"sentence":"I need to _____ the smart lights with the music player so the colors change perfectly with the beat.","answer":"synchronize","options":["synchronize","separate","predict","contain"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/019956-020444.webm","at":199.7,"dur":4.88}},{"term":"take into account","pos":"expression","definition":"to consider or remember something when making a decision or judgment.","time":224.1,"lesson":"For example, if you are in the dialogue section and you see the phrase 'take into account' in the first dialogue, you can go to the vocabulary section to see its definition.","examples":[{"sentence":"You need to take into account the fact that they are still learning the language.","pattern":"take into account + the fact that"},{"sentence":"When planning the trip, we must take into account the weather forecast.","pattern":"take into account + noun"},{"sentence":"The judge took into account his previous good behavior before deciding on the sentence.","pattern":"take into account (past tense)"},{"sentence":"Please take into account my suggestions before you finalize the report.","pattern":"take into account + object"}],"more_examples":["We have to take into account the cost of shipping before we set the final price.","When choosing a new apartment, you should take into account how close it is to the train station.","The company didn't take into account how much the new regulations would affect ion between beard size and penis size?","highlights":["envious of"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/008870-010413.webm","at":88.8,"dur":15.43}]},{"speaker":"B","text":"I'm running this model locally on my PC now. That's the biggest change because I don't have to worry about overusing the API.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/012440-013103.webm","at":124.5,"dur":6.63},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/013556-013920.webm","at":135.7,"dur":3.64}]},{"speaker":"A","text":"It's much better than using ChatGPT-5 Mini. Since you're running it on your own machine, you can refine things better and it filters out mistakes quite well.","highlights":["filters out"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/014140-014746.webm","at":141.5,"dur":6.06},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/015386-016694.webm","at":154.1,"dur":13.08}]},{"speaker":"B","text":"The synchronization bar is really cool. It helps you sync a specific person's words across different fields, like matching a phrase to the vocabulary section.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/018236-018980.webm","at":182.5,"dur":7.44},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/020644-021136.webm","at":206.5,"dur":4.92}]},{"speaker":"A","text":"Exactly. If you see 'take into account' in the dialogue, you can jump straight to the vocabulary section to see the definition, synonyms, and antonyms.","highlights":["take into account"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/022330-023494.webm","at":223.4,"dur":11.64}]},{"speaker":"B","text":"I also added games. 'Feeling the gap' is a fun way to hide the answers behind words with the same meaning or collocations.","highlights":["feeling the gap"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/025834-026872.webm","at":258.4,"dur":10.38},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/027890-028703.webm","at":279.0,"dur":8.13}]},{"speaker":"A","text":"That's actually useful. Even if you don't encounter new vocabulary during class, you can still squeeze some learning out of it because it's fun.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/028930-030198.webm","at":289.4,"dur":12.68}]},{"speaker":"B","text":"We'll spend more time on this review. It used to be impossible to read through all the noise in the mistake section without filtering it manually.","highlights":["read through"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/031638-033163.webm","at":316.5,"dur":15.25}]},{"speaker":"A","text":"True, current AIs still struggle to differentiate artifacts like 'uh' or 'um' when someone changes their mind mid-sentence.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/034484-035944.webm","at":344.9,"dur":14.6}]}],"time":3.0,"topic":0},{"title":"AI feedback and communication barriers","lines":[{"speaker":"A","text":"I don't think the AI's labels for major or minor mistakes are entirely accurate, but it's still a cool way to catch my own errors.","highlights":["entirely accurate"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/040894-042167.webm","at":409.0,"dur":12.73}]},{"speaker":"B","text":"It's actually great for spotting things like 'hair' being an uncountable mass, which I tend to mess up quite often.","highlights":["tend to mess up"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/043398-044206.webm","at":434.1,"dur":8.08}]},{"speaker":"A","text":"That's good she can rewind what she said to you now, but the real issue was that she simply couldn't understand what you were saying.","highlights":["the real issue"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/048352-049480.webm","at":483.6,"dur":11.28}]},{"speaker":"B","text":"She has a good intuition for the language, which is much better than just knowing words, but she makes way too many technical mistakes.","highlights":["good intuition"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/053040-054022.webm","at":530.5,"dur":9.82}]},{"speaker":"A","text":"I told her she needs to work with ChatGPT to fix her spelling and subject-verb agreement, because her sentences were often confusing.","highlights":["subject-verb agreement"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/057014-058205.webm","at":570.2,"dur":11.91}]},{"speaker":"B","text":"It's great she's aware of her mistakes now. I can usually tell when someone doesn't understand me, but that's part of the fun.","highlights":["part of the fun"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/062044-063166.webm","at":620.6,"dur":11.22}]},{"speaker":"A","text":"Since I work with people at a lower level, I have to pick my language very carefully and predict what they'll think before I speak.","highlights":["pick my language"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/066880-067778.webm","at":668.9,"dur":8.98}]}],"time":409.0,"topic":0},{"title":"Language learning and hardware limitations","lines":[{"speaker":"A","text":"Not knowing certain words is actually a big part of building an intuitive sense of the language.","highlights":["intuitive sense"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/069638-069997.webm","at":696.5,"dur":3.59}]},{"speaker":"B","text":"Exactly. You have to try to figure out what a word means by looking at the context of the sentence.","highlights":["figure out"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/070214-071416.webm","at":702.2,"dur":12.02}]},{"speaker":"A","text":"Successful learners understand that you will face uncertainty at all stages. Beginners often give up because they feel they have to understand everything perfectly.","highlights":["at all stages"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/071974-073246.webm","at":719.8,"dur":12.72}]},{"speaker":"B","text":"That's true. Even with books, it's a challenge. I read a 12th-century book and I don't understand many words because the language is so outdated.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/076722-077720.webm","at":767.3,"dur":9.98}]},{"speaker":"A","text":"You just have to keep pushing. Whether it's language or any other knowledge, you have to keep going.","highlights":["keep pushing"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/078842-080228.webm","at":788.5,"dur":13.86}]},{"speaker":"B","text":"I'm looking at these reviews and noticing common mistakes, like using 'she do' instead of 'she does'.","highlights":["common mistakes"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/086226-087044.webm","at":862.4,"dur":8.18}]},{"speaker":"A","text":"My computer is struggling with the heavy load right now. The problem isn't my GPU or CPU; it's that I only have 16 gigs of RAM.","highlights":["heavy load"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/093448-094075.webm","at":934.6,"dur":6.27}]},{"speaker":"B","text":"I think 64 gigs would be enough for you. I have 42, but I hit a wall sometimes when I run certain models.","highlights":["hit a wall"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/094906-096280.webm","at":949.2,"dur":13.74}]},{"speaker":"A","text":"The most important thing is actually VRAM. You need enough memory to handle the billions of parameters in the model.","highlights":["the most important thing"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/097762-098921.webm","at":977.7,"dur":11.59}]}],"time":696.5,"topic":1},{"title":"Running LLMs and the weight of AI knowledge","lines":[{"speaker":"A","text":"Do you think a 10 billion parameter model is too heavy for a local machine?","highlights":["local machine"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/102412-103166.webm","at":1024.2,"dur":7.54}]},{"speaker":"B","text":"I can actually run a 19 billion parameter model. It just takes a bit longer to process the answer.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/103180-104729.webm","at":1031.9,"dur":15.49},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/106120-107128.webm","at":1061.3,"dur":10.08}]},{"speaker":"A","text":"Last time I tried to run a model bigger than my VRAM, it just crashed.","highlights":["just crashed"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/110698-111198.webm","at":1107.1,"dur":5.0}]},{"speaker":"B","text":"I don't use my GPU; I run models using my CPU power because I have a Ryzen 7 3800X.","highlights":["CPU power"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/111598-113049.webm","at":1116.2,"dur":14.51}]},{"speaker":"A","text":"I'm running diagnostics to find out why it's failing. If it doesn't help, I might switch to Linux.","highlights":["running diagnostics"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/122738-123258.webm","at":1227.5,"dur":5.2},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/124784-125366.webm","at":1247.9,"dur":5.82}]},{"speaker":"B","text":"I've had the same issues. Sometimes I have to wait two minutes for a response, but it works.","highlights":["had the same issues"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/126724-128107.webm","at":1267.4,"dur":13.83}]},{"speaker":"A","text":"Do you feel the weight of this knowledge on you? The model will eventually analyze your mistakes very closely.","highlights":["weight of this knowledge"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/133330-133784.webm","at":1333.4,"dur":4.54},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/134118-134953.webm","at":1341.3,"dur":8.35}]},{"speaker":"B","text":"I have some thoughts. I need to think more deeply before speaking because the AI is so good at spotting errors.","highlights":["think more deeply"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/135120-136263.webm","at":1351.3,"dur":11.43}]},{"speaker":"A","text":"When you simplify your language for others, you feel like you're becoming a bit dumber.","highlights":["simplify your language"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/141026-141988.webm","at":1410.4,"dur":9.62}]},{"speaker":"B","text":"Exactly. You force yourself to be dumber so people understand, and that's when you start making mistakes.","highlights":["force yourself"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/142538-143215.webm","at":1425.5,"dur":6.77}]}],"time":1024.2,"topic":2},{"title":"Balancing Fluency and Accuracy","lines":[{"speaker":"A","text":"I feel like I make more mistakes when I try to simplify my language. I feel like I have to impress this machine.","highlights":["impress this machine"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/143914-144343.webm","at":1439.2,"dur":4.29},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/146550-146888.webm","at":1465.6,"dur":3.38}]},{"speaker":"B","text":"Do you lower your language settings when you speak with your students? I can handle your thoughts, but sometimes your accent is hard to catch.","highlights":["hard to catch"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/148934-149926.webm","at":1489.4,"dur":9.92},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/151456-151821.webm","at":1514.7,"dur":3.65}]},{"speaker":"A","text":"I've probably done that for about two months. We need to find the right level of challenge—something that's just challenging enough for you.","highlights":["challenging enough"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/152334-152840.webm","at":1523.4,"dur":5.06},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/154270-154816.webm","at":1542.8,"dur":5.46}]},{"speaker":"B","text":"Does this mean you stop constraining yourself? If you overthink it, I think it might be too easy for you.","highlights":["constraining yourself"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/155314-156540.webm","at":1553.2,"dur":12.26}]},{"speaker":"A","text":"When I talk like a normal human being and express my ideas naturally, that's the right challenge. Also, small mistakes are fine; they make you sound natural.","highlights":["normal human being"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/156820-157404.webm","at":1568.3,"dur":5.84},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/166782-167271.webm","at":1667.9,"dur":4.89}]},{"speaker":"B","text":"Language acquisition has a subconscious part. If you lean too hard on the conscious side, you lose your fluency.","highlights":["lean too hard on"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/160676-161643.webm","at":1607.0,"dur":9.67},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/165346-166016.webm","at":1653.7,"dur":6.7}]},{"speaker":"A","text":"I used to worry about making mistakes during job interviews. I'd just use terminology from the book because it was easier to explain things that way.","highlights":["job interviews"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/168582-170085.webm","at":1685.9,"dur":15.03}]},{"speaker":"B","text":"It's an adaptive mechanism. In Russian, you force yourself to sound more colloquial and friendly if you want people to like you.","highlights":["adaptive mechanism"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/177068-177750.webm","at":1770.8,"dur":6.82},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/178046-178903.webm","at":1780.6,"dur":8.57}]}],"time":1439.2,"topic":3},{"title":"Grammar mistakes and linguistic depth","lines":[{"speaker":"A","text":"I was listening to a story about a regular guy from Canada who was just a very average person.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/182206-182978.webm","at":1822.2,"dur":7.72},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/183578-184146.webm","at":1835.9,"dur":5.68}]},{"speaker":"B","text":"I know that if I say 'fewer people,' I sound like a nerd. Also, 'if I were you' is correct, but 'if I were a woman' sounds way too formal.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/185128-186582.webm","at":1851.4,"dur":14.54}]},{"speaker":"A","text":"I noticed that 'you was' is a common non-standard pattern. I've heard it in Tarantino movies and it's often used as mafia slang.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/190876-192224.webm","at":1909.0,"dur":13.48}]},{"speaker":"B","text":"Exactly. Some rappers use intentionally wrong forms to sound more gangster. I can usually catch those mistakes if I have a second to think, but when I'm overwhelmed, they slip out.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/194170-194982.webm","at":1941.8,"dur":8.12},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/197034-197478.webm","at":1970.4,"dur":4.44}]},{"speaker":"A","text":"My grammar completely leaves the chat when I'm getting intimate with a girl! I just stop thinking about the rules.","highlights":["leaves the chat"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/200896-201975.webm","at":2009.2,"dur":10.79}]},{"speaker":"B","text":"That's because it's no longer about the English language; it's about love language. Your grammar is great when you first meet her, but then it all falls apart.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/203738-204162.webm","at":2037.6,"dur":4.24},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/205172-206381.webm","at":2051.8,"dur":12.09}]},{"speaker":"A","text":"I feel like the Russian linguistic system is much deeper than the English one because the entire infrastructure was built around it for so many years.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/207326-208342.webm","at":2073.4,"dur":10.16},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/211752-212219.webm","at":2117.6,"dur":4.67}]},{"speaker":"B","text":"I think English is deep enough for automatic communication, but I see your point. It's like trying to write Python code but trying to invent pointers in C++.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/213584-214570.webm","at":2135.9,"dur":9.86}]}],"time":1822.2,"topic":4},{"title":"Perspectives on accents and communication","lines":[{"speaker":"A","text":"C++ and Python are designed for different purposes, so you just need more time to adapt to the logic.","highlights":["adapt to"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/216760-218280.webm","at":2167.7,"dur":15.2}]},{"speaker":"B","text":"That's true. Regarding accents, I've heard many people find a Russian accent quite sexy and attractive.","highlights":["quite sexy"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/219158-220658.webm","at":2191.7,"dur":15.0}]},{"speaker":"A","text":"At my previous job, people actually asked a model to speak more because they found her accent so attractive.","highlights":["previous job"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/221002-222428.webm","at":2210.1,"dur":14.26}]},{"speaker":"B","text":"I have a different theory. People generally like things that sound different, as long as it's not too far-fetched to relate to.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/229404-230860.webm","at":2294.1,"dur":14.56},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/231604-231860.webm","at":2316.2,"dur":2.56}]},{"speaker":"A","text":"Exactly. It's about being similar in many ways but slightly different in others. Also, many native speakers have accents too.","highlights":["in many ways"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/232248-232875.webm","at":2322.7,"dur":6.27},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/233476-234926.webm","at":2334.9,"dur":14.5}]},{"speaker":"B","text":"I notice that many people in AI podcasts are immigrants with very distinct accents, but that's perfectly fine.","highlights":["perfectly fine"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/236372-237921.webm","at":2363.8,"dur":15.49}]},{"speaker":"A","text":"My brother listened to me speaking with you and said I have a strong accent, but I don't really care.","highlights":["don't really care"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/239586-241052.webm","at":2396.1,"dur":14.66}]},{"speaker":"B","text":"I agree. It's more important how you build your sentences. As long as native speakers can understand you, the accent doesn't matter.","highlights":["doesn't matter"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/245316-246630.webm","at":2453.3,"dur":13.14}]},{"speaker":"A","text":"My brother always points out things I don't know. It's a character trait of his, and it can be quite annoying.","highlights":["character trait"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/249276-250682.webm","at":2492.9,"dur":14.06}]},{"speaker":"B","text":"He's a very weird one, but he's still my brother and I love him no matter how annoying he can be.","highlights":["no matter how"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/254100-255321.webm","at":2541.2,"dur":12.21}]}],"time":2167.7,"topic":4},{"title":"Radishes and Banh Mi","lines":[{"speaker":"A","text":"When I try speaking Vietnamese, my friend tells me my accent is very heavy. Honestly, I don't care as long as people understand me.","highlights":["don't care"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/256586-257671.webm","at":2566.0,"dur":10.85}]},{"speaker":"B","text":"I get that. I was looking up some words yesterday. I wanted to know how to say 'daikon' in English.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/260897-261984.webm","at":2609.1,"dur":10.87}]},{"speaker":"A","text":"Is it radish? I thought it was pronounced differently, like 'redis'.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/264240-265710.webm","at":2642.6,"dur":14.7}]},{"speaker":"B","text":"It's spelled radish. I thought there might be a distinction between different types, like garden radishes.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/271554-272916.webm","at":2715.7,"dur":13.62}]},{"speaker":"A","text":"I'm sure you've seen these in Vietnamese markets. They are very popular in Asia. That's a daikon, which is a type of radish.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/274766-276134.webm","at":2747.8,"dur":13.68}]},{"speaker":"B","text":"I remember them! They are used in miso soup. You usually slice them into squares.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/278048-278906.webm","at":2780.6,"dur":8.58}]},{"speaker":"A","text":"Actually, there's a specific word for cutting them into small cubes: you 'dice' them.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/279216-280784.webm","at":2792.4,"dur":15.68}]},{"speaker":"B","text":"I was looking for interesting ways to cook them. I found a recipe for a Vietnamese sandwich called banh mi.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/283502-285115.webm","at":2835.2,"dur":16.13}]},{"speaker":"A","text":"Banh mi is a very popular street food. In Vietnam, 'banh' means cake, and banh mi is the standard sandwich.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/286602-287950.webm","at":2866.2,"dur":13.48}]},{"speaker":"B","text":"We actually eat it every morning for breakfast at a local food stall. It's very cheap.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/288248-289686.webm","at":2882.6,"dur":14.38}]},{"speaker":"A","text":"Have you ever tried Subway? It's a bit similar to a sandwich, but I think Subway is better.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/289480-289931.webm","at":2894.9,"dur":4.51},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/290106-291607.webm","at":2901.3,"dur":15.01}]},{"speaker":"B","text":"I love Subway too. It's a great option.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/291478-292568.webm","at":2914.9,"dur":10.9}]}],"time":2566.0,"topic":4},{"title":"Seafood, cravings, and local milkshakes","lines":[{"speaker":"A","text":"Vietnam has a lot of seafood, and there are even restaurants dedicated specifically to it.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/294886-295571.webm","at":2949.1,"dur":6.85}]},{"speaker":"B","text":"Vietnamese people love beer, and dried fish or shrimp go really well with it.","highlights":["go really well with"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/295724-296917.webm","at":2957.4,"dur":11.93}]},{"speaker":"A","text":"We tried a seafood restaurant once just to see, but I didn't really enjoy it. I prefer marinated seafood with flavor.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/297102-297734.webm","at":2971.1,"dur":6.32},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/298598-299540.webm","at":2986.1,"dur":9.42}]},{"speaker":"B","text":"That's true. If you just boil octopus, it's tasteless. You have to be very careful with the sauces and how you cook it.","highlights":["be very careful with"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/300574-301798.webm","at":3005.9,"dur":12.24}]},{"speaker":"A","text":"I like salmon steak, but it can be so fatty and hard to eat. It's best when it's just salted.","highlights":["hard to eat"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/302362-303478.webm","at":3023.7,"dur":11.16}]},{"speaker":"B","text":"I sometimes buy salted salmon for sandwiches. It's a classic, especially for New Year's.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/305868-307322.webm","at":3058.8,"dur":14.54}]},{"speaker":"A","text":"I have this inner voice that tells me I'll die if I don't buy oranges or orange juice when I'm at the market.","highlights":["inner voice"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/309378-310840.webm","at":3093.9,"dur":14.62}]},{"speaker":"B","text":"Do you have a sweet tooth? I have extreme cravings for sweets when I'm thinking a lot. It's like a herring shot.","highlights":["have a sweet tooth","extreme craving"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/312938-314340.webm","at":3129.5,"dur":14.02}]},{"speaker":"A","text":"You need calories for your brain, like glucose. I have the same thing, but with a specific milkshake from this region.","highlights":["the same thing"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/317400-318005.webm","at":3174.1,"dur":6.05},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/318236-319210.webm","at":3182.6,"dur":9.74}]},{"speaker":"B","text":"I'm a huge fan of it! It's so cheap, but I don't know why they don't sell it in other regions.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/319694-320976.webm","at":3197.0,"dur":12.82}]},{"speaker":"A","text":"It's probably a logistics problem because of the expiration dates. They would need a really good logistics app.","highlights":["logistics problem"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/324748-326158.webm","at":3247.6,"dur":14.1}]}],"time":2949.1,"topic":5},{"title":"Vocabulary nuances and cultural differences","lines":[{"speaker":"A","text":"I'm looking for customers for Volagosha. I think it would be popular in schools, maybe in 9-liter bottles.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/327528-328956.webm","at":3275.4,"dur":14.28},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/330194-330676.webm","at":3302.1,"dur":4.82}]},{"speaker":"B","text":"That's interesting. By the way, is 'pupil' still used? I feel like it's a bit outdated.","highlights":["a bit outdated"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/331560-332881.webm","at":3315.8,"dur":13.21}]},{"speaker":"A","text":"In the UK, it might be used in universities with traditions, but in America, people might think of your eyes.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/334910-336348.webm","at":3349.2,"dur":14.38}]},{"speaker":"B","text":"Right, like dilated pupils. Also, I learned that 'rubber' is a mistake. In America, you have to say 'eraser'.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/336818-338534.webm","at":3368.3,"dur":17.16}]},{"speaker":"A","text":"Exactly. If you say 'flat' in the US, they won't think of an apartment; they might think of a flat earth.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/342414-343856.webm","at":3424.2,"dur":14.42}]},{"speaker":"B","text":"I remember that Russian meme about the flat earth from around 2013 or 2014. It was quite popular.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/344974-346511.webm","at":3449.8,"dur":15.37},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/347280-348109.webm","at":3473.0,"dur":8.29}]},{"speaker":"A","text":"You have a wide-ranging vocabulary now. You can discuss various topics, but now is the time to refine your grammar.","highlights":["wide-ranging vocabulary"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/351236-352029.webm","at":3512.6,"dur":7.93},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/352240-353704.webm","at":3522.6,"dur":14.64}]},{"speaker":"B","text":"I've started noticing small details, like whether to say 'on New Year' or 'at New Year'.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/357222-358463.webm","at":3572.3,"dur":12.41}]},{"speaker":"A","text":"Actually, it's usually 'on New Year's Day'. In English-speaking countries, New Year's isn't always treated as a standard holiday.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/358676-359975.webm","at":3586.9,"dur":12.99},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/362194-363519.webm","at":3622.1,"dur":13.25}]}],"time":3275.4,"topic":5},{"title":"Prepositions and quirks of English holidays","lines":[{"speaker":"A","text":"I'm curious about the difference between 'at school', 'in school', and 'in the school'.","highlights":["the difference between"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/367644-367877.webm","at":3676.5,"dur":2.33}]},{"speaker":"B","text":"I'm still trying to figure out the exact rules, but I'm confused about why we say 'New Year's' with an 's' at the end.","highlights":["figure out"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/370390-371133.webm","at":3704.0,"dur":7.43}]},{"speaker":"A","text":"It's because it's New Year's Eve, the day before the holiday, just like Christmas Eve.","highlights":["the day before"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/372056-372942.webm","at":3720.7,"dur":8.86}]},{"speaker":"B","text":"The deeper you dive into the topic of holidays, the more interesting it gets because of all the exceptions.","highlights":["dive into"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/376948-377550.webm","at":3769.6,"dur":6.02}]},{"speaker":"A","text":"For example, you don't say 'Christmas's Eve', and it's the same for Halloween.","highlights":["the same for"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/377642-378609.webm","at":3776.5,"dur":9.67}]},{"speaker":"B","text":"We can say 'at Christmas' or 'at Easter', which sounds very natural in British English.","highlights":["natural in"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/383990-385269.webm","at":3840.1,"dur":12.79},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/385686-386148.webm","at":3857.1,"dur":4.62}]},{"speaker":"A","text":"Is it okay to say 'for Easter'? I'd say it works in this context.","highlights":["works in this context"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/387618-388612.webm","at":3876.3,"dur":9.94}]},{"speaker":"B","text":"It's similar to saying 'for breakfast'. You could also say 'during breakfast'.","highlights":["similar to"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/390776-391656.webm","at":3907.9,"dur":8.8}]},{"speaker":"A","text":"There are so many interesting quirks like that. I think reviewing these mistakes is actually a good thing.","highlights":["quirks like that"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/392958-393958.webm","at":3929.8,"dur":10.0}]},{"speaker":"B","text":"You often omit articles, which is a common mistake you'll definitely see in the review.","highlights":["omit articles"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/395098-396337.webm","at":3951.2,"dur":12.39}]}],"time":3676.5,"topic":6},{"title":"Improving pronunciation through AI feedback","lines":[{"speaker":"A","text":"It's not always obvious, but you sometimes struggle with certain words because it's hard to remember which syllable to stress.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/401424-402291.webm","at":4014.3,"dur":8.67}]},{"speaker":"B","text":"Exactly. The engine can detect those stresses, but you might think a word is pronounced one way when it's actually different.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/404420-405303.webm","at":4044.4,"dur":8.83}]},{"speaker":"A","text":"It's a good habit to listen to your own speech. If you have even the slightest doubt about a word, you should check its pronunciation right away.","highlights":["slightest doubt"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/405682-406512.webm","at":4057.0,"dur":8.3}]},{"speaker":"B","text":"I've noticed at least two words today where you mispronounced them. I'm actually curious to see them in the review.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/408052-409381.webm","at":4080.7,"dur":13.29}]},{"speaker":"A","text":"The model might recognize a word because some people pronounce it that way, but you won't know you're making a mistake until you hear the correct pronunciation.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/409754-410434.webm","at":4097.6,"dur":6.8}]},{"speaker":"B","text":"Sometimes it completely messes up a word. For example, it might hear 'weird' and think you said 'virtual'.","highlights":["messes up"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/411390-411885.webm","at":4114.0,"dur":4.95},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/412614-412928.webm","at":4126.3,"dur":3.14}]},{"speaker":"A","text":"In the previous lesson, I used to say 'stop talking' but I forgot about the 'the' and it was read as 'comments'.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/414368-415838.webm","at":4143.8,"dur":14.7}]},{"speaker":"B","text":"When you hear how you actually pronounce it, you can spot the mistake pretty easily. It's the only workaround for now.","highlights":["spot the mistake"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/418092-418559.webm","at":4181.0,"dur":4.67},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/420146-420670.webm","at":4201.7,"dur":5.24}]},{"speaker":"A","text":"You can't make the model 100 percent understand your intention behind a certain sentence. Just read the review.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/420868-422207.webm","at":4208.8,"dur":13.39}]},{"speaker":"B","text":"Let me know if you're busy on Wednesday. I'm trying to switch to American servers, but it's harder to spend money there.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/423486-423994.webm","at":4235.0,"dur":5.08},{"src":"lesson_audio/lesson_date_28-09-2026_time_17-39-00/426352-427445.webm","at":4263.6,"dur":10.93}]}],"time":4014.3,"topic":6}]};
