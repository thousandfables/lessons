<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;

        const LESSON = {"version":4,"meta":{"title":"Forest Walks, Food, and Grammar","topics":["Happiness and vacation life","Walking in a forest garden and hedgehogs","Model verbs and infinitives","Personal life and cooking","Past forms of modal verbs"],"date":"28 September 2026","time":"15:17"},"topics":[{"title":"Happiness and vacation life","at":0,"time":0.0},{"title":"Walking in a forest garden and hedgehogs","at":603,"time":410.6},{"title":"Model verbs and infinitives","at":3304,"time":2153.4},{"title":"Personal life and cooking","at":3716,"time":2420.6},{"title":"Past forms of modal verbs","at":4444,"time":2819.6}],"mistakes":[{"severity":"high","label":"Countable/plural","rule":"Do not use 'a' before uncountable nouns or plural words.","examples":[{"quote":"a clear sign of a progress","fix":"a clear sign of progress","context":"You really did a good job. I remember you did very few mistakes. It's a clear sign of a progress.","context_fix":"You really did a good job. I remember you did very few mistakes. It's a clear sign of progress.","why":"The word 'progress' is uncountable, so we don't use 'a' before it.","time":1207.3,"at":1744,"topic":1,"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/120212-121206.webm","at":1202.3,"dur":9.94}},{"quote":"using different verb","fix":"using a different verb","context":"We find a way how to express the same sentence using different verb and then we make a normal sentence. For example, I should go to work can be expressed using a simple verb need.","context_fix":"We find a way how to express the same sentence using a different verb and then we make a normal sentence. For example, I should go to work can be expressed using a simple verb need.","why":"The word 'verb' is a countable noun. In this context, it should be 'a different verb' or 'different verbs'.","time":1636.3,"at":2463,"topic":1,"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/163188-164637.webm","at":1632.1,"dur":14.49}},{"quote":"very unusual things for a verb","fix":"very unusual thing for a verb","context":"Some of them don't have past forms. This is a very unusual things for a verb in English because in English, every verb should have a past tense.","context_fix":"Some of them don't have past forms. This is a very unusual thing for a verb in English because in English, every verb should have a past tense.","why":"Since you are referring to a single concept (the lack of past forms), use the singular 'thing' instead of 'things'.","time":2196.6,"at":3383,"topic":2,"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/219032-220549.webm","at":2190.5,"dur":15.17}},{"quote":"not a cooking","fix":"not cooking","context":"Breakfast is not a cooking because I'm just cutting some vegetables, making tea, and having cottage cheese; it's not special.","context_fix":"Breakfast is not cooking because I'm just cutting some vegetables, making tea, and having cottage cheese; it's not special.","why":"In this context, 'cooking' is an uncountable gerund. We don't use the indefinite article 'a' before it.","time":2710.5,"at":4257,"topic":3,"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/270904-271351.webm","at":2709.1,"dur":4.47}},{"quote":"make a tea","fix":"making tea","context":"Breakfast is easy because I'm just cutting some vegetables and make a tea, and I just take cottage cheese.","context_fix":"Breakfast is easy because I'm just cutting some vegetables and making tea, and I just take cottage cheese.","why":"When listing actions in a sequence, use the same form (cutting, making). Also, 'tea' is uncountable, so no 'a' is needed.","time":2719.4,"at":4268,"topic":3,"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/270590-272958.webm","at":2706.1,"dur":23.68}}]},{"severity":"high","label":"Tense","rule":"Use present simple for habits, routines, or general facts.","examples":[{"quote":"everything shut off","fix":"everything shuts off","context":"If I say everyth noun phrase"},{"sentence":"We must bear in mind the needs of our customers.","pattern":"bear in mind + object"}],"more_examples":["When planning the budget, you should bear in mind the unexpected costs.","Bear in mind that she is still learning, so please be patient with her."],"synonyms":["keep in mind","remember","take into account","consider","don't forget","take into consideration","note"],"antonyms":["forget","ignore","overlook","disregard"],"gap":{"sentence":"When planning the hike, you should _____ that the trail becomes very steep and difficult near the summit.","answer":"bear in mind","options":["bear in mind","look forward","give up","set up"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/193424-193693.webm","at":1934.4,"dur":2.69}},{"term":"tolerate","pos":"verb","definition":"To allow someone or something to happen or exist, even if you do not like it.","time":2435.6,"lesson":"Can your wife tolerate you singing in the bathroom? I don't think she likes it, but she hasn't told me.","examples":[{"sentence":"I can't tolerate the smell of cigarette smoke in the house.","pattern":"can't tolerate + noun"},{"sentence":"The teacher wouldn't tolerate any talking during the exam.","pattern":"tolerate + noun"},{"sentence":"He finds it hard to tolerate his neighbor's loud music.","pattern":"find it hard to tolerate"},{"sentence":"The company does not tolerate any form of discrimination.","pattern":"does not tolerate + noun phrase"}],"more_examples":["I don't know how she can tolerate working for such a demanding boss.","The government refuses to tolerate any protests in the city center.","He's reached his limit and can no longer tolerate her constant complaining."],"synonyms":["put up with","stand","bear","endure","brook","stomach","suffer"],"antonyms":["forbid","prohibit"],"gap":{"sentence":"My roommate is always messy, but I _____ his habits because he pays the rent on time.","answer":"tolerate","options":["tolerate","prevent","celebrate","avoid"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/243728-244171.webm","at":2437.5,"dur":4.43}},{"term":"appreciate","pos":"verb","definition":"To recognize, enjoy, or value the quality, skill, or beauty of something.","time":2505.6,"lesson":"Does it mean that your wife doesn't think you sing well? Or she just can't appreciate your art of singing?","examples":[{"sentence":"I really appreciate your help with the project.","pattern":"appreciate + noun"},{"sentence":"You should appreciate the effort she put into the meal.","pattern":""},{"sentence":"I don't really appreciate being interrupted while I'm speaking.","pattern":"appreciate + -ing"},{"sentence":"We should learn to appreciate the small things in life.","pattern":"learn to appreciate"}],"more_examples":["I really appreciate your patience while I was explaining the situation.","It's important to appreciate the diversity of cultures in our city.","I don't appreciate the way he speaks to his employees."],"synonyms":["value","treasure","cherish","recognize","admire","prize","esteem"],"antonyms":["dislike","undervalue","scorn"],"gap":{"sentence":"The view from the mountain top was so breathtaking that it was hard not to _____ the beauty of the landscape.","answer":"appreciate","options":["appreciate","ignore","forget","criticize"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/250550-251279.webm","at":2505.7,"dur":7.29}},{"term":"inspire","pos":"verb","definition":"To give someone the feeling or motivation to do something or be creative.","time":2551.6,"lesson":"You work at a restaurant. Doesn't seeing all those people cook inspire you to learn how to cook?","examples":[{"sentence":"The beautiful scenery inspired her to start painting again.","pattern":"inspire + object + to + verb"},{"sentence":"His success story is truly inspiring.","pattern":"inspiring (adjective)"},{"sentence":"The coach's speech inspired the team to work harder.","pattern":""},{"sentence":"She felt inspired to write a novel after visiting the library.","pattern":"feel inspired (adjective phrase)"}],"more_examples":["The teacher's passion for history inspired the students to join the debate club.","I hope my journey will inspire others to pursue their dreams.","The documentary was designed to inspire young people to protect the environment."],"synonyms":["motivate","stimulate","encourage","spark","galvanize","awaken","excite"],"antonyms":["discourage","dissuade","deter","demoralize"],"gap":{"sentence":"The documentary about the young scientist's journey to space _____ many students to pursue careers in engineering.","answer":"inspired","options":["inspired","ignored","prevented","complicated"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/255268-255572.webm","at":2552.8,"dur":3.04}},{"term":"myth","pos":"noun","definition":"A widely held but false belief or a story that is frequently repeated.","time":2582.6,"lesson":"Do you know this story? This is a myth, or a story that people tell very often about Henry Ford.","examples":[{"sentence":"It is a common myth that humans only use ten percent of their brains.","pattern":"It is a common myth that"},{"sentence":"The idea that some people are born naturally talented is largely a myth.","pattern":"is largely a myth"},{"sentence":"Many people still believe the myth that eating celery helps you lose weight instantly.","pattern":"believe the myth that"},{"sentence":"The myth surrounding the company's success was eventually debunked by researchers.","pattern":"myth surrounding [something]"}],"countable":[{"meaning":"A widely held but false belief or a story that is frequently repeated.","example":"This is a myth, or a story that people tell very often about Henry Ford.","lesson":true},{"meaning":"A traditional story involving supernatural beings or events","example":"The story of Hercules is a famous Greek myth."},{"meaning":"A traditional story explaining the origin of something","example":"Many cultures have different myths about how the world began."}],"uncountable":[],"more_examples":["The idea that you need to drink eight glasses of water a day is a myth.","It's a myth that children can't learn a second language after age ten.","The urban myth about haunted houses kept the neighborhood kids awake at night."],"synonyms":["fallacy","misconception","falsehood","fable","legend","old wives' tale"],"antonyms":["fact","truth","reality"],"gap":{"sentence":"Many people believe the _____ that you need to wait 30 minutes after eating before swimming.","answer":"myth","options":["myth","fact","habit","skill"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/258266-258786.webm","at":2582.8,"dur":5.2}},{"term":"schematic","pos":"noun","definition":"A technical drawing or diagram showing the layout and connections of a system or machine.","time":2641.0,"lesson":"He said, 'Here is, for example, a schematic of a car, and it is not working.' He challenged the person to explain why it wasn't working to prove they were a specialist.","examples":[{"sentence":"The electrician showed me a schematic of the house's wiring.","pattern":"a schematic of [something]"},{"sentence":"You need to study the schematic before you start assembling the circuit board.","pattern":"study the schematic"},{"sentence":"The engineers are still refining the schematic for the new engine design.","pattern":"refining the schematic"},{"sentence":"Can you provide a schematic of the software architecture?","pattern":"provide a schematic"}],"countable":[{"meaning":"A technical drawing or diagram showing the layout and connections of a system or machine.","example":"He said, 'Here is, for example, a schematic of a car, and it is not working.' He challenged the person to explain why it wasn't working to prove they were a specialist.","lesson":true},{"meaning":"A simplified outline or plan of a project or system","example":"The architect presented a schematic of the new shopping mall layout."}],"uncountable":[],"more_examples":["The technician handed me a schematic of the central heating system.","You can find a schematic of the plumbing layout in the basement.","The manual includes a schematic to help you connect the speakers."],"synonyms":["diagram","blueprint","layout","plan","outline","technical drawing"],"antonyms":[],"gap":{"sentence":"The technician couldn't understand the complex wiring, so he asked for a _____ to see how the components were connected.","answer":"schematic","options":["schematic","narrative","warning","opinion"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/264273-264622.webm","at":2642.9,"dur":3.49}},{"term":"specialist","pos":"noun","definition":"A person who has expert knowledge or skills in a specific field or activity.","time":2648.6,"lesson":"He showed a schematic of a car that wasn't working and told the man to explain why. He told him, 'Prove that you're a specialist.'","examples":[{"sentence":"If you have a complex skin condition, you should see a dermatologist, who is a skin specialist.","pattern":"a [adjective] specialist"},{"sentence":"The company hired a specialist to oversee the cybersecurity transition.","pattern":"hire a specialist"},{"sentence":"As a specialist in renewable energy, she was invited to speak at the conference.","pattern":"specialist in [field]"},{"sentence":"He isn't a general practitioner; he is a heart specialist.","pattern":""}],"countable":[{"meaning":"A person who has expert knowledge or skills in a specific field or activity.","example":"He told him, 'Prove that you're a specialist.'","lesson":true},{"meaning":"A person who performs a specific task or job","example":"The shop employs several retail specialists to help customers find products."}],"uncountable":[],"more_examples":["The hospital is looking for a pediatric specialist to join the team.","You should consult a tax specialist before filing your international returns.","We need to hire a marketing specialist to handle our social media presence."],"synonyms":["expert","professional","authority","pro","consultant"],"antonyms":["amateur","beginner","novice","layperson"],"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/264870-265047.webm","at":2648.9,"dur":1.77}},{"term":"cottage cheese","pos":"noun","definition":"A soft, white dairy product made from curdled milk, often eaten for breakfast.","time":2722.7,"lesson":"Breakfast doesn't require much cooking because I just cut some vegetables, make some tea, and have some cottage cheese.","examples":[{"sentence":"I usually have a bowl of cottage cheese with some fruit for breakfast.","pattern":""},{"sentence":"Cottage cheese is a high-protein snack that many people enjoy.","pattern":""},{"sentence":"She likes to mix some herbs and cracked pepper into her cottage cheese.","pattern":""},{"sentence":"Is there any cottage cheese left in the refrigerator?","pattern":""}],"countable":[],"uncountable":[{"meaning":"A soft, white dairy product made from curdled milk, often eaten for breakfast.","example":"Breakfast doesn't require much cooking because I just cut some vegetables, make some tea, and have some cottage cheese.","lesson":true}],"more_examples":["Would you like some cottage cheese on your toast?","Cottage cheese is a staple in my weekly meal plan.","I'm trying to eat less cheese, but I still love cottage cheese."],"synonyms":["curd cheese"],"antonyms":[],"gap":{"sentence":"Since I'm trying to eat a high-protein breakfast, I'll have a bowl of _____ with some sliced tomatoes.","answer":"cottage cheese","options":["cottage cheese","margarine","mayonnaise","gravy"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/272706-272958.webm","at":2727.2,"dur":2.52}},{"term":"a bunch of","pos":"noun phrase","definition":"a large number or quantity of something.","time":2801.6,"lesson":"Have you already eaten? I've had a bunch of cottage cheese.","examples":[{"sentence":"I have a bunch of errands to run before the weekend.","pattern":"a bunch of + plural noun"},{"sentence":"There were a bunch of people waiting outside the store.","pattern":"There were + a bunch of + people"},{"sentence":"I bought a bunch of bananas at the market today.","pattern":"a bunch of + uncountable/countable nouns"},{"sentence":"He has a bunch of ideas for the new project.","pattern":"have a bunch of + ideas"}],"countable":[{"meaning":"a large number or quantity of something.","example":"I've had a bunch of cottage cheese.","lesson":true}],"uncountable":[],"more_examples":["I have a bunch of emails to answer this morning.","She has a bunch of questions about the new policy.","We need to clear out a bunch of old furniture from the garage."],"synonyms":["a lot of","a collection of","a heap of","a ton of","a load of"],"antonyms":[],"gap":{"sentence":"I can't finish my homework tonight because I have _____ chores to do around the house.","answer":"a bunch of","options":["a bunch of","a little","no","each"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/280176-280423.webm","at":2801.9,"dur":2.47}},{"term":"digest","pos":"verb","definition":"To think about and understand information or a situation fully.","time":2951.6,"lesson":"I think it's enough information to digest. Next time, we will talk about different synonyms for 'should'.","examples":[{"sentence":"I need some time to digest all the news before I make a decision.","pattern":"need time + to digest"},{"sentence":"The report was very long, and it took me a while to digest the data.","pattern":"take a while + to digest"},{"sentence":"Let me digest that for a moment before I give you my opinion.","pattern":"let me digest + [something]"},{"sentence":"It's a lot of information to digest at once.","pattern":"too much/enough ... to digest"}],"more_examples":["I need a few days to digest the news of the merger before I comment.","The training was intense, so we need some time to digest everything we learned.","It's a complex legal issue; give me a moment to digest the details."],"synonyms":["process","absorb","take in","contemplate","reflect on","mull over","ponder","assimilate","think through","ruminate on"],"antonyms":["ignore","disregard","overlook","dismiss"],"gap":{"sentence":"The training manual was so complex that I need a few days to _____ everything before starting the project.","answer":"digest","options":["digest","ignore","skip","forget"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/295106-295474.webm","at":2951.2,"dur":3.68}},{"term":"check (something) out","pos":"phrasal verb","definition":"To look at, examine, or look at something to get more information about it.","time":3090.6,"lesson":"I have reworked the entire review section. The reviews I send from now on will be much more detailed and fun, so I really recommend that you check it out.","examples":[{"sentence":"You should check out that new cafe down the street; the coffee is amazing.","pattern":"check out + noun (recommendation)"},{"sentence":"I'll send you the link so you can check it out later.","pattern":"check + it + out (separable phrasal verb)"},{"sentence":"Can you check out the flight details and let me know if they're correct?","pattern":"check out + noun (verify information)"},{"sentence":"Check out this video! It explains how to use the new software.","pattern":"Imperative: Check out + noun"}],"more_examples":["I'm going to the mall later to check out those new sneakers.","Could you check out the guest list and see if everyone is invited?","Before you buy the car, you should definitely check out the engine."],"synonyms":["take a look at","inspect","examine","look into","browse"],"antonyms":["ignore","overlook","disregard"],"gap":{"sentence":"I'm not sure if this laptop is worth the money, so could you _____ for me?","answer":"check it out","options":["check it out","fix it","hide it","paint it"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/309102-309489.webm","at":3091.2,"dur":3.87}}],"dialogues":[{"title":"Small talk about weather, shirts, and plans","lines":[{"speaker":"A","text":"Good morning! It's 11:15 in St. Petersburg and it's very sunny outside.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/000000-001137.webm","at":0.0,"dur":11.37}]},{"speaker":"B","text":"That's right. In Moscow, it's very gloomy and cloudy today. It's Moscow's turn for bad weather.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/001532-002421.webm","at":15.5,"dur":8.89}]},{"speaker":"A","text":"The connection is a little flaky today, but everything is good. Well, it can never be too good; life is full of pain and misery.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/010994-011425.webm","at":110.1,"dur":4.31},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/012382-012744.webm","at":124.0,"dur":3.62}]},{"speaker":"B","text":"You're wearing a very cool t-shirt! Is that a bull with corks on its horns?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/014544-015714.webm","at":145.5,"dur":11.7}]},{"speaker":"A","text":"It looks like a giant cattle. Actually, it's a bull. They have those wooden handles and a whistle.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/016132-016639.webm","at":161.4,"dur":5.07},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/017874-019073.webm","at":178.9,"dur":11.99}]},{"speaker":"B","text":"Bulls are intimidating. I once had a wolf t-shirt that could glow in the dark, and I scared the shit out of my family.","highlights":["scared the shit out of"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/022730-023893.webm","at":227.5,"dur":11.63}]},{"speaker":"A","text":"I'm drinking tea and I don't have a reason to feel happy. Do you really need a reason to be happy?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/025994-027099.webm","at":260.1,"dur":11.05},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/027568-028536.webm","at":275.9,"dur":9.68}]},{"speaker":"B","text":"I feel happy because I'm on vacation. My life in Vietnam feels like a never-ending vacation.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/030386-031852.webm","at":304.1,"dur":14.66}]},{"speaker":"A","text":"Today is your day off, so you should be happy! I see a very white t-shirt in the background. Is it for a special occasion?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/032880-033635.webm","at":329.0,"dur":7.55},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/034540-034892.webm","at":345.5,"dur":3.52}]},{"speaker":"B","text":"It's for a special dinner with DRC in Berlin. The Mandela Manekanti sounds very impressive, but DRC doesn't roll off the tongue the same way.","highlights":["roll off the tongue"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/036566-038049.webm","at":365.9,"dur":14.83},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/039613-040711.webm","at":396.2,"dur":10.98}]},{"speaker":"A","text":"What are your plans? Since you work every day, haven't you done enough walking this week?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/043174-044161.webm","at":431.9,"dur":9.87}]},{"speaker":"B","text":"I love walking, but I prefer the forest. Today, I might just walk in a public garden.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/044222-044541.webm","at":442.4,"dur":3.19},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/045146-045669.webm","at":451.6,"dur":5.23}]},{"speaker":"A","text":"A public garden? Can you pick up pumpkins and apples there? It looks like a small forest with some animals, like a zoo.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/049212-050650.webm","at":492.3,"dur":14.38}]}],"time":0.0,"topic":0},{"title":"Hedgehogs, gardens, and greedy goats","lines":[{"speaker":"A","text":"So, there's this small contact zoo where you can feed hedgehogs. It's a really popular trend right now.","highlights":["popular trend"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/052394-053759.webm","at":524.1,"dur":13.65}]},{"speaker":"B","text":"Why hedgehogs? They use a specific type, a South African hedgehog, which is one of the cutest species.","highlights":["specific type"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/055396-056453.webm","at":554.2,"dur":10.57}]},{"speaker":"A","text":"Do you know the Soviet cartoon, A Hedgehog in the Fog? I wonder what kind of hedgehog they based it on.","highlights":["based it on"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/061616-062313.webm","at":616.4,"dur":6.97}]},{"speaker":"B","text":"Maybe it was a wild forest hedgehog. Anyway, are there any hedgehogs in the garden you're visiting today?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/067350-068087.webm","at":673.6,"dur":7.37},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/068448-069275.webm","at":684.7,"dur":8.27}]},{"speaker":"A","text":"They don't have hedgehogs, but they have goats and pigs. It sounds more like a farm than a garden.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/069654-071093.webm","at":696.7,"dur":14.39}]},{"speaker":"B","text":"If you had to choose between playing video games or walking in the garden, which would you pick?","highlights":["had to choose"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/076868-077175.webm","at":768.9,"dur":3.07},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/078234-078603.webm","at":782.4,"dur":3.69}]},{"speaker":"A","text":"I'd do both! I want all the options. You're being greedy!","highlights":["do both"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/078960-079910.webm","at":789.8,"dur":9.5}]},{"speaker":"B","text":"That reminds me of the tale about the greedy goat who died because he couldn't decide between delicious leaves and oats.","highlights":["reminds me of"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/082932-084410.webm","at":829.5,"dur":14.78}]},{"speaker":"A","text":"I enjoy walking because it's a quiet place where I can clear my head and enjoy nature.","highlights":["clear my head"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/090864-092309.webm","at":908.7,"dur":14.45}]},{"speaker":"B","text":"Since it's almost noon, why didn't you go earlier? Walking is best done early in the morning.","highlights":["best done"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/096084-097314.webm","at":960.9,"dur":12.3}]},{"speaker":"A","text":"I was sleeping! Besides, I went bouldering at 9 a.m. yesterday before heading to work.","highlights":["heading to"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/099288-100411.webm","at":993.1,"dur":11.23},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/100656-101387.webm","at":1006.8,"dur":7.31}]}],"time":524.1,"topic":1},{"title":"Introduction to Modal Verbs","lines":[{"speaker":"A","text":"So, do you have anything in mind that you'd like to do today? Maybe read something or play a game?","highlights":["in mind"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/105982-106689.webm","at":1060.0,"dur":7.07}]},{"speaker":"B","text":"I'm not sure. I might listen to some podcasts or watch a video about wine.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/109414-110449.webm","at":1094.3,"dur":10.35}]},{"speaker":"A","text":"I usually find a little time during the work day to read a book or listen to a podcast about wine.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/111694-113162.webm","at":1117.1,"dur":14.68}]},{"speaker":"B","text":"Do you actually do that on your days off too?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/113586-114539.webm","at":1136.0,"dur":9.53}]},{"speaker":"A","text":"Yes, I do. Anyway, Dima, I promised we'd start talking about modal verbs today. It's high time I kept my promise.","highlights":["high time"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/115376-116665.webm","at":1153.9,"dur":12.89}]},{"speaker":"A","text":"You did a great job with the continuous and simple forms last time. It's a clear sign of progress.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/120212-121206.webm","at":1202.3,"dur":9.94}]},{"speaker":"A","text":"Modal verbs are one of the most fundamental things in English, but they are actually very easy.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/121550-122769.webm","at":1215.7,"dur":12.19}]},{"speaker":"A","text":"In real life, you'll mostly see about five of them, such as can, should, must, might, and will.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/124876-126285.webm","at":1249.0,"dur":14.09},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/127040-127519.webm","at":1270.6,"dur":4.79}]},{"speaker":"A","text":"With regular verbs like 'go', we need 'do' for questions and negatives. But with modal verbs, all that complexity is gone.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/140922-142425.webm","at":1409.4,"dur":15.03}]},{"speaker":"A","text":"For example, you'd say 'I want to go,' but with a modal, you just say 'I should go' without the 'to'.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/146802-148219.webm","at":1468.2,"dur":14.17}]}],"time":1059.3,"topic":1},{"title":"Grammar: Modal Verbs and the use of 'to'","lines":[{"speaker":"A","text":"When we form a question with 'should,' we don't need any auxiliary verbs like 'do.' We can just say, 'Should I go to work today?'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/150070-151378.webm","at":1500.8,"dur":13.08}]},{"speaker":"B","text":"That's a perfectly logical question. Sometimes you might actually forget if it's Monday or Tuesday and ask yourself that.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/151442-152451.webm","at":1514.6,"dur":10.09}]},{"speaker":"A","text":"Some modal verbs have past forms, like 'could' for 'can.' However, 'should' doesn't have a past form, and neither does 'must' or 'might.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/154024-154323.webm","at":1540.4,"dur":2.99},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/157496-158491.webm","at":1575.2,"dur":9.95}]},{"speaker":"A","text":"To express a past obligation, we use a different verb. For instance, 'I should go to work' can be expressed as 'I needed to go to work.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/163188-163749.webm","at":1632.1,"dur":5.61},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/164116-164943.webm","at":1641.4,"dur":8.27}]},{"speaker":"B","text":"Why do we use 'to' after 'need' then?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/165532-165869.webm","at":1655.5,"dur":3.37}]},{"speaker":"A","text":"We use 'to' because 'go' is in the infinitive form. An infinitive is a verb that doesn't have a specific tense.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/168802-170285.webm","at":1688.1,"dur":14.83}]},{"speaker":"A","text":"In the infinitive, the verb is like a blank. It doesn't change over time; it's tied to another verb, like 'want.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/178838-179821.webm","at":1788.6,"dur":9.83}]},{"speaker":"A","text":"The word 'to' has many roles. It can show direction, as in 'I will go to Thailand,' or it can show intention.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/184668-186015.webm","at":1846.8,"dur":13.47},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/186826-187717.webm","at":1868.5,"dur":8.91}]},{"speaker":"B","text":"Actually, in 'I want to go to work,' the second 'to' shows direction. It's not about intention; it's about where you are going.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/188710-189916.webm","at":1887.3,"dur":12.06}]},{"speaker":"A","text":"Exactly. And it can get confusing because there are two words that are pronounced exactly the same as 'to.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/190836-191543.webm","at":1908.5,"dur":7.07}]}],"time":1500.8,"topic":1},{"title":"Grammar rules for infinitives and modal verbs","lines":[{"speaker":"A","text":"It's important to remember that 'to' can have different roles. People often get confused between using 'to' as part of an infinitive versus other uses.","highlights":["get confused"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/191543-192992.webm","at":1915.6,"dur":14.49}]},{"speaker":"B","text":"That's true. We should keep that in mind. For example, in 'I want to go to work,' we only change the main verb, which is 'want.'","highlights":["keep that in mind"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/193424-194791.webm","at":1934.4,"dur":13.67}]},{"speaker":"A","text":"Exactly. If there are multiple verbs, the first one is the main verb. So, to make it negative, you'd say 'I do not want to go to work.'","highlights":["main verb"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/195180-196738.webm","at":1952.0,"dur":15.58},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/197288-198336.webm","at":1973.1,"dur":10.48}]},{"speaker":"B","text":"And for a question, it would be 'Do I want to go to work?' In the past, like yesterday, you would say 'I wanted to go to work' or 'I did want to go.'","highlights":["in the past"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/199610-201077.webm","at":1996.3,"dur":14.67},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/203854-204110.webm","at":2038.7,"dur":2.56}]},{"speaker":"A","text":"Right. And the negative past is 'I didn't want to go to work.' Infinitives follow the standard rules, and 'want' is a regular verb.","highlights":["regular verb"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/207424-208133.webm","at":2074.4,"dur":7.09},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/209360-210961.webm","at":2093.8,"dur":16.01}]},{"speaker":"B","text":"I think it's better to understand infinitives as a separate topic before moving on to modal verbs.","highlights":["separate topic"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/215460-216952.webm","at":2154.7,"dur":14.92}]},{"speaker":"A","text":"The thing about modal verbs is that they don't need 'to' before the infinitive. Also, unlike most verbs, they don't have past forms.","highlights":["modal verbs"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/217098-218059.webm","at":2171.2,"dur":9.61},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/218294-219834.webm","at":2183.1,"dur":15.4}]},{"speaker":"B","text":"That's very unusual because every other verb has a past tense, like 'drank' or 'took.' Modal verbs are much simpler, like 'I should go' or 'Should I?'","highlights":["past tense"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/219702-220549.webm","at":2197.1,"dur":8.47},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/220694-221889.webm","at":2207.1,"dur":11.95}]},{"speaker":"A","text":"Let's practice. Can you swim? Yes, I can. Should you go to work today? No, I shouldn't.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/228394-229741.webm","at":2284.0,"dur":13.47},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/230208-231656.webm","at":2302.3,"dur":14.48}]},{"speaker":"B","text":"Can you draw paintings? I can, maybe because I'm studying at an architectural school. But I started in the past.","highlights":["architectural school"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/232156-233471.webm","at":2321.8,"dur":13.15},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/233784-235261.webm","at":2338.0,"dur":14.77}]},{"speaker":"A","text":"So you started art school. That's impressive. Can you sing? Yes, I can.","highlights":["art school"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/241232-242407.webm","at":2412.5,"dur":11.75},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/242768-242983.webm","at":2427.9,"dur":2.15}]}],"time":1915.6,"topic":1},{"title":"Singing, cooking, and cottage cheese","lines":[{"speaker":"A","text":"Can you sing well? Does your wife tolerate you singing in the bathroom?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/243006-244345.webm","at":2430.3,"dur":13.39}]},{"speaker":"B","text":"I do sing in there, but I think my wife doesn't really like it.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/244606-246021.webm","at":2446.3,"dur":14.15},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/246204-246605.webm","at":2462.2,"dur":4.01}]},{"speaker":"A","text":"Why do you think she doesn't like it? Does she tell you directly?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/246710-247419.webm","at":2467.3,"dur":7.09}]},{"speaker":"B","text":"Yeah, she actually told me. It's so annoying.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/247582-248889.webm","at":2476.0,"dur":13.07}]},{"speaker":"A","text":"Maybe she just can't appreciate your art of singing, or she thinks you're not that good.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/249639-251279.webm","at":2496.5,"dur":16.4}]},{"speaker":"A","text":"Can you cook at all?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/252200-252461.webm","at":2522.2,"dur":2.61}]},{"speaker":"B","text":"No, I can't. I just don't like it.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/252694-253787.webm","at":2527.1,"dur":10.93}]},{"speaker":"A","text":"You work at a restaurant, so shouldn't that inspire you to learn how to cook?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/254764-255572.webm","at":2547.8,"dur":8.08}]},{"speaker":"B","text":"Not really, because all those people are cooking for me. I'm like Henry Ford.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/256184-257816.webm","at":2562.0,"dur":16.32}]},{"speaker":"A","text":"That's a famous story about Ford. He didn't know how to assemble cars; his engineers did the work.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/258154-258987.webm","at":2581.7,"dur":8.33}]},{"speaker":"B","text":"Exactly. They cook for me, so why should I bother cooking?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/265874-266940.webm","at":2658.9,"dur":10.66}]},{"speaker":"A","text":"What do you eat at home if nobody cooks for you?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/268644-269607.webm","at":2686.5,"dur":9.63}]},{"speaker":"B","text":"I don't usually eat at home, but breakfast is easy. I just have some cottage cheese.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/269896-271351.webm","at":2699.2,"dur":14.55}]},{"speaker":"A","text":"You're a big fan of cottage cheese! You must have very strong bones because of all that calcium.","highlights":["big fan of"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/273402-274561.webm","at":2734.1,"dur":11.59}]},{"speaker":"B","text":"I don't know the word calcium, but it's the right word for what I'm eating.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/277354-278322.webm","at":2773.7,"dur":9.68}]},{"speaker":"A","text":"Every time I ask if you've eaten, you say you've had a bunch of cottage cheese.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/279706-280423.webm","at":2797.2,"dur":7.17}]},{"speaker":"B","text":"Because it's delicious. I can't argue with that.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/280718-281723.webm","at":2807.4,"dur":10.05}]}],"time":2430.3,"topic":3},{"title":"Past of 'will' and synonyms for 'should'","lines":[{"speaker":"A","text":"Could you swim when you were five years old, or when you were a kid?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/283204-283685.webm","at":2832.1,"dur":4.81},{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/284122-284947.webm","at":2841.4,"dur":8.25}]},{"speaker":"B","text":"I think I learned how to swim when I was three, but I definitely couldn't swim as a toddler.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/285693-287219.webm","at":2857.1,"dur":15.26}]},{"speaker":"A","text":"If you're talking about the past, you can use 'would' instead of 'will'. For example, you could say, 'Yesterday, I told my wife that I would go for a walk.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/291142-291747.webm","at":2911.5,"dur":6.05}]},{"speaker":"A","text":"You could also say, 'I told my boss that I wouldn't come to Berlin because my wife would miss me.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/292284-293463.webm","at":2923.0,"dur":11.79}]},{"speaker":"B","text":"That's a lot of information to digest at once.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/295106-295474.webm","at":2951.2,"dur":3.68}]},{"speaker":"A","text":"Next time, we'll look at synonyms for 'should'. For instance, you can say 'I need to' or 'I have to' work hard.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/296596-297843.webm","at":2966.1,"dur":12.47}]},{"speaker":"A","text":"The difference is that 'need to' has a past form, but 'should' doesn't. You can say 'I had to be at work' on Friday.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/302710-304148.webm","at":3027.3,"dur":14.38}]},{"speaker":"B","text":"That's a very cool way of doing it.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/304368-304741.webm","at":3043.9,"dur":3.73}]},{"speaker":"A","text":"I'll send you some exercises to reinforce this. Also, I've reworked the review section to make it more detailed and fun."},{"speaker":"B","text":"I'll definitely check it out. See you on Friday!","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_15-17-16/309102-309917.webm","at":3091.2,"dur":8.15}]}],"time":2832.1,"topic":4}]};
