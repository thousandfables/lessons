<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
            }
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: #b9ccff; color: #0d2146; }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }

        .topics {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 14px 0 0;
            padding: 0;
            list-style: none;
        }

        .topics li {
            padding: 3px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font-size: 0.82rem;
        }

        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .vocab-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 0 0 14px; }

        .switch { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 0.9rem; font-weight: 600; cursor: pointer; }

        .switch input { width: 18px; height: 18px; accent-color: var(--accent); }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }

        .w-num { color: var(--faint); font-size: 0.85rem; font-weight: 700; }

        .w-term { margin: 0; font-size: 1.25rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.85rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 6px 0 12px; }

        .quiz .def { filter: blur(6px); cursor: pointer; transition: filter 0.15s; }

        .quiz .def.revealed { filter: none; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 10px;
            padding: 8px 12px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; }

        .examples li { position: relative; margin: 0 0 6px; padding-left: 18px; }

        .examples li::before { content: ""; position: absolute; top: 0.72em; left: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;
            font-weight: 650;
            cursor: pointer;
        }

        .orig-toggle:hover { color: var(--accent); }

        .orig { margin: 6px 0 0; padding: 6px 9px; border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 0.88rem; font-style: italic; }

        .dialogue-tools { margin: 0 0 14px; }

        footer { margin: 40px 0 0; color: var(--faint); font-size: 0.8rem; text-align: center; }

        @media (max-width: 520px) {
            body { font-size: 16px; }
            .topics { display: none; }
            .card { padding: 14px; }
            .bubble { max-width: 94%; }
            .tab { font-size: 0.88rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="hero">
            <p class="eyebrow" id="eyebrow" data-no-speech>English lesson</p>
            <h1 id="title">Lesson review</h1>
            <ul class="topics" id="topics" data-no-speech></ul>
            <p class="hint" data-no-speech>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
                <span>Select any word or sentence to hear it.</span>
            </p>
        </header>

        <nav class="tabs" role="tablist" aria-label="Lesson sections" data-no-speech>
            <button class="tab" role="tab" id="tab-mistakes" data-tab="mistakes" aria-controls="panel-mistakes">Mistakes <span class="count" id="count-mistakes">0</span></button>
            <button class="tab" role="tab" id="tab-vocabulary" data-tab="vocabulary" aria-controls="panel-vocabulary">Vocabulary <span class="count" id="count-vocabulary">0</span></button>
            <button class="tab" role="tab" id="tab-dialogues" data-tab="dialogues" aria-controls="panel-dialogues">Dialogues <span class="count" id="count-dialogues">0</span></button>
        </nav>

        <main>
            <section class="panel" id="panel-mistakes" role="tabpanel" aria-labelledby="tab-mistakes"></section>
            <section class="panel" id="panel-vocabulary" role="tabpanel" aria-labelledby="tab-vocabulary" hidden></section>
            <section class="panel" id="panel-dialogues" role="tabpanel" aria-labelledby="tab-dialogues" hidden></section>
        </main>

        <footer id="footer" data-no-speech></footer>
    </div>

    <script>
        const LESSON = {"version":2,"meta":{"title":"Coding, AI, and Language Goals","topics":["English practice and software engineering projects","Coding goals and gaming preferences","Coding, English learning, and gaming","Discussing AI limitations and recommendation algorithms","Algorithms and the risks of AI apps","App recommendations and IELTS preparation","Language learning and travel plans"],"generator":"Gemma 4 12B (local)","date":"27 September 2026","time":"16:17"},"mistakes":[{"severity":"high","label":"Sentence structure","rule":"Ensure every sentence has a subject and a verb to connect ideas.","examples":[{"quote":"education in there better than in the international","fix":"education there is better than internationally"},{"quote":"My thoughts in clear","fix":"My thoughts are clear"},{"quote":"Just enjoyable","fix":"It's just enjoyable"},{"quote":"don't have Don't commit to a game","fix":"don't have to commit to a game"},{"quote":"This language or not language","fix":"Is this a language or not a language?"},{"quote":"I Bothers Bothers me","fix":"It bothers me"},{"quote":"I from 10 hours","fix":"I am free from 10 o'clock"}]},{"severity":"high","label":"Tense","rule":"Use the correct past tense or present continuous form based on the timing of the action.","examples":[{"quote":"it's give me that idea","fix":"it gave me that idea"},{"quote":"I start learning English","fix":"I started learning English"},{"quote":"I don't prepare for for example","fix":"I didn't prepare for, for example"},{"quote":"maybe I don't understood","fix":"maybe I don't understand"},{"quote":"when I scrolling","fix":"when I was scrolling"},{"quote":"AI can't analyze my pronunciation correctly","fix":"AI couldn't analyze my pronunciation correctly"}]},{"severity":"high","label":"Word order","rule":"Follow standard English word order for questions, adverbs, and subjects.","examples":[{"quote":"what does mean spell","fix":"What does spell mean?"},{"quote":"What support me to? make faster in In my usual","fix":"What would support me to make things faster in my usual"},{"quote":"Quickly can Find it","fix":"can quickly find it"},{"quote":"randomly Instagram recommend this real to me","fix":"Instagram randomly recommended this reel to me"},{"quote":"I sometimes can In wrong me in wrong place","fix":"I sometimes put it in the wrong place"},{"quote":"What is time in Monday","fix":"What time is it on Monday?"}]},{"severity":"high","label":"Article","rule":"Use articles (a, an, the) correctly before singular countable nouns and specific items.","examples":[{"quote":"where I need to new idea","fix":"where I need a new idea"},{"quote":"It was only interesting thing","fix":"It was the only interesting thing"},{"quote":"I tried a same part","fix":"I tried the same part"},{"quote":"I found from algorithm recommendation","fix":"I found it from an algorithm recommendation"}]},{"severity":"high","label":"Preposition","rule":"Use the correct prepositions (on, at, to) for days, times, and directions.","examples":[{"quote":"in Monday Wednesday and Friday","fix":"on Monday, Wednesday, and Friday"},{"quote":"until I go to home","fix":"until I go home"},{"quote":"I have a workout in this time","fix":"I have a workout at this time"}]},{"severity":"high","label":"Tense","rule":"Use 'I am going to' or 'I will' to talk about your future plans.","examples":[{"quote":"I Go study abroad in Malaysia","fix":"I'm going to study abroad in Malaysia"}]},{"severity":"high","label":"Sentence structure","rule":"Use 'do you want to' to ask about someone's desires or plans.","examples":[{"quote":"Why do on study abroad","fix":"Why do you want to study abroad?"}]},{"severity":"high","label":"Verb form","rule":"Use 'if I have' for a simple condition. Don't use 'are' with 'have'.","examples":[{"quote":"if I are have an apartment","fix":"if I have an apartment"}]},{"severity":"high","label":"Verb form","rule":"Use 'I try' for habits. If using 'trying', you need 'I am trying'.","examples":[{"quote":"but I trying to practice","fix":"but I try to practice"}]},{"severity":"high","label":"Sentence structure","rule":"After 'did', use the base form of the verb (do), not 'does'.","examples":[{"quote":"what did they does or","fix":"what did they do"}]},{"severity":"high","label":"Verb form","rule":"Use 'am/is/are' with the -ing form: 'when I am speaking'.","examples":[{"quote":"it isn't hearing me when I speaking","fix":"it isn't hearing me when I am speaking"}]},{"severity":"high","label":"Verb form","rule":"Use the base form of the verb after 'can't' (can't hear). Use 'well' to describe how it hears.","examples":[{"quote":"AI can't hearing pronunciation good","fix":"AI can't hear pronunciation well"}]},{"severity":"medium","label":"Word choice","rule":"Choose the most accurate word for the specific context (e.g., 'scrolling' vs 'crawling').","examples":[{"quote":"for reliving in my apartment","fix":"for living in my apartment"},{"quote":"tried in my thoughts","fix":"to clarify my thoughts"},{"quote":"post the post post the comment or comment commentary","fix":"post a comment"},{"quote":"I will say an application","fix":"I will build an application"},{"quote":"Development it is a good Development","fix":"This development is a good thing"},{"quote":"I Gave an activity to videos","fix":"I was shown videos"},{"quote":"they can find but application and And Lost Their money","fix":"they can find a bad application and lose their money"},{"quote":"I was crawling tick-tock","fix":"I was scrolling through TikTok"}]},{"severity":"medium","label":"Sentence structure","rule":"Do not use 'to' after modal verbs like 'can', 'could', or 'should'.","examples":[{"quote":"I plan to and my 10th grade and 11th grade in one year","fix":"I plan to finish my 10th and 11th grade in one year"},{"quote":"What I can to code","fix":"what I can code"},{"quote":"What I can to speak with","fix":"what I can speak with"}]},{"severity":"medium","label":"Verb form","rule":"Use the past tense 'practiced' for actions completed earlier today.","examples":[{"quote":"Today I practice speaking is a A little","fix":"Today I practiced speaking a little"}]},{"severity":"medium","label":"Sentence structure","rule":"Avoid repeating 'because' and 'I'. Use 'is not' or 'isn't' for negatives.","examples":[{"quote":"Maybe it is Because I Because I my microphone is isn't very good","fix":"Maybe it is because my microphone isn't very good"}]},{"severity":"medium","label":"Verb form","rule":"Use the past tense 'talked' because the action happened in the past.","examples":[{"quote":"I just talking to talk talk to AI","fix":"I just talked to AI"}]},{"severity":"medium","label":"Word order","rule":"We usually say 'ask [someone] for [something]'. Use 'ask AI for ideas'.","examples":[{"quote":"I Ask for AI just all of idea what I can to do","fix":"I ask AI for all the ideas of what I can do"}]},{"severity":"medium","label":"Preposition","rule":"Use 'do' or 'work on' for projects, and 'to' before a verb.","examples":[{"quote":"Just go to some projects for just study function","fix":"just do some projects to study functions"}]},{"severity":"medium","label":"Tense","rule":"Use 'could' or 'used to' to describe habits in the past.","examples":[{"quote":"I can play you either games a lot","fix":"I could play games a lot"}]},{"severity":"medium","label":"Tense","rule":"Use 'I have never had' for experiences in your life up until now.","examples":[{"quote":"I Never had an Xbox","fix":"I've never had an Xbox"}]},{"severity":"medium","label":"Tense","rule":"Use 'might have been' + '-ing' to describe a continuous action in the past.","examples":[{"quote":"Then I may be Was in enjoying play in online games","fix":"Then I might have been enjoying playing online games"}]},{"severity":"medium","label":"Verb form","rule":"Use 'it translates' to describe what the library does automatically.","examples":[{"quote":"and this to to Translate this Python code","fix":"and it translates this Python code"}]},{"severity":"medium","label":"Tense","rule":"Use the present tense when talking about a current feeling or general fact.","examples":[{"quote":"I think that I Enjoyed this because it was something new","fix":"I think that I enjoy this because it is something new"}]},{"severity":"medium","label":"Word order","rule":"Use 'I have lost' to describe a change in your state or motivation.","examples":[{"quote":"now I just some lost my motivation","fix":"now I have just lost some motivation"}]},{"severity":"medium","label":"Tense","rule":"Use 'I thought' for past intentions and 'wanted' to match the past context.","examples":[{"quote":"I think what I want to study","fix":"I thought I wanted to study"}]},{"severity":"medium","label":"Verb form","rule":"Use the past tense 'started' for past actions and 'watching' after the verb 'start'.","examples":[{"quote":"Start watch English videos","fix":"started watching English videos"}]},{"severity":"medium","label":"Word order","rule":"Use 'find [something] [adjective]' to describe your opinion of something.","examples":[{"quote":"I Didn't interesting English","fix":"I didn't find English interesting"}]},{"severity":"medium","label":"Word choice","rule":"Use 'might' for possibility and 'your' to show possession.","examples":[{"quote":"I May be learn you words","fix":"I might learn your words"}]},{"severity":"medium","label":"Sentence structure","rule":"Use 'when' to show the condition or situation under which something happens.","examples":[{"quote":"I think that but people rely","fix":"I think that when people rely"}]}],"vocabulary":[{"term":"do nothing but","pos":"expression","definition":"to do only one specific activity and nothing else.","lesson_example":"He spent seven years solving this problem and he did nothing but think of the solution.","examples":["During the summer holidays, I did nothing but relax and read books.","She does nothing but complain about the weather these days."],"note":"Used to emphasize that an activity is the only thing someone is doing."},{"term":"straighten your thoughts","pos":"expression","definition":"To organize your ideas and make them clearer when they are vague or messy.","lesson_example":"Yeah, and To straighten your thoughts yes tried in my thoughts, okay But usually it happens you already have an idea in your head But.","examples":["I need to write down my notes to help straighten my thoughts before the meeting.","Talking to a friend can help you straighten your thoughts about a difficult decision."],"note":"Often used when you have a lot of information but lack a clear plan."},{"term":"vague","pos":"adjective","definition":"not clear or detailed; lacking a specific shape or plan.","lesson_example":"You don't really have a clear picture yet; you just have a very vague idea.","examples":["I have a vague memory of meeting him years ago.","The instructions were too vague, so I didn't know how to start the project."],"note":"Often used with 'idea' or 'memory'. It is the opposite of 'specific' or 'clear'."},{"term":"structure","pos":"verb","definition":"To organize ideas or information into a clear and logical order.","lesson_example":"You give it all your ideas and it structures them and tells you what could be done with them.","examples":["I need to structure my presentation so the audience can follow my main points easily.","The app helps you structure your daily tasks into a manageable schedule."],"note":"Often used with 'organize' or 'arrange' to describe planning a project or a piece of writing."},{"term":"for the sake of","pos":"expression","definition":"doing something only for the activity itself, rather than to achieve a specific goal.","lesson_example":"I don't like coding for the sake of coding, but I like coding when I know I can achieve a goal.","examples":["He didn't want to go to the party for the sake of being social; he just wanted to see his friend.","Don't change your words just for the sake of sounding more professional."],"note":"Often used with 'doing something' or 'just' to emphasize that the action lacks a purpose."},{"term":"put in time and effort","pos":"expression","definition":"To spend a significant amount of energy and work to achieve a specific goal.","lesson_example":"I just need to put in time and effort into that, and then I will have an application that actually does exactly what I wanted.","examples":["If you want to learn a new language fluently, you have to put in time and effort every day.","She put in a lot of time and effort to organize the charity event successfully."],"note":"Often used with the preposition 'into' when referring to a specific project or goal."},{"term":"story-driven","pos":"adjective","definition":"focused on a narrative or plot rather than just gameplay mechanics.","lesson_example":"What is your favorite story-driven game? I think it's Red Dead Redemption 2.","examples":["I prefer story-driven games because I enjoy following a deep, emotional plot.","The movie was very story-driven, focusing on the characters' personal journeys."],"note":"Often used to describe video games, movies, or books where the plot is the main focus."},{"term":"storage","pos":"noun","definition":"the amount of space available on a computer or device to keep data.","lesson_example":"I am hinting at a word with three more letters that ends with 'age'—think storage.","examples":["My phone is running out of storage because I have too many photos.","You should buy a laptop with at least 512 gigabytes of storage."],"note":"Often used with 'space' (e.g., 'storage space') or 'capacity'."},{"term":"spell","pos":"verb","definition":"To say or write the letters of a word in the correct order.","lesson_example":"How do you spell it?","examples":["Could you please spell your last name for me?","I don't know how to spell 'conscientious' correctly."],"note":"Commonly used when asking for clarification on the spelling of names or difficult words."},{"term":"commit to","pos":"phrasal verb","definition":"To dedicate your time, effort, or attention to a specific activity or person.","lesson_example":"I want to relax with video games and not commit to a game or worry about my teammates.","examples":["It is hard to commit to a long-term project when you have so many distractions.","The company is ready to commit to the new environmental standards starting next year."],"note":"Often used with nouns like 'project,' 'relationship,' or 'goal.' It implies a long-term obligation."},{"term":"addictive","pos":"adjective","definition":"something that is so enjoyable or interesting that you want to do it repeatedly.","lesson_example":"I spent six hours a day on it; it is just something addictive that you like doing.","examples":["I tried to stop watching the series, but it was so addictive.","Some mobile games are designed to be highly addictive."],"note":"Often used with 'highly' or 'very' to describe hobbies or habits."},{"term":"daily routine","pos":"noun phrase","definition":"The regular activities and habits that a person does every day.","lesson_example":"What would be the first thing that you would like to optimize in your daily routine?","examples":["I'm trying to incorporate a morning workout into my daily routine.","My daily routine usually includes checking emails, exercising, and preparing lunch."],"note":"Often used with the verb 'stick to' (e.g., 'It's hard to stick to a daily routine')."},{"term":"optimize","pos":"verb","definition":"To make a process, system, or routine as effective or functional as possible.","lesson_example":"What would be the first thing that you would like to optimize in your daily routine?","examples":["We need to optimize our workflow to finish the project ahead of schedule.","I'm trying to optimize my morning routine so I have more time to exercise."],"note":"Often used in business and technology contexts. Common collocations: 'optimize performance' or 'optimize a process'."},{"term":"come up with","pos":"phrasal verb","definition":"to produce, create, or think of a new idea, plan, or solution.","lesson_example":"You have to first come up with an algorithm that solves your problem effectively.","examples":["We need to come up with a new marketing strategy for the next quarter.","How did you come up with such a creative idea for the birthday party?"],"note":"Often used with words like 'idea', 'solution', 'plan', or 'suggestion'."},{"term":"effectively","pos":"adverb","definition":"In a way that produces the desired result or solves a problem successfully.","lesson_example":"You have to first come up with an algorithm and a system that solves your problem effectively.","examples":["The new software helps the team manage their tasks more effectively.","To communicate effectively, it is important to listen as much as you speak."],"note":"Often used with verbs like 'communicate', 'manage', 'work', and 'solve'."},{"term":"contribute to","pos":"verb phrase","definition":"To be one of the factors that causes a result or a situation to happen.","lesson_example":"I'm just curious what contributed to you achieving this above-average level.","examples":["Heavy rain and strong winds contributed to the flight delay.","Many factors, including diet and exercise, contribute to good health."],"note":"Often used with negative results, but can be used for any cause or factor."},{"term":"above average","pos":"adjective","definition":"Better or higher than what is normal or typical for most people.","lesson_example":"I am curious what you did to achieve this above-average level.","examples":["Her test scores were consistently above average compared to the rest of the class.","The hotel offers above average service for such a low price."],"note":"Often used to describe skills, grades, or performance levels."},{"term":"perspective","pos":"noun","definition":"A particular way of thinking about or looking at something; an opinion.","lesson_example":"I'm just curious about your perspective on how you see it.","examples":["From my perspective, the new policy will actually help the employees save time.","It is important to consider different perspectives before making a final decision."],"note":"Often used with the preposition 'on' or 'from' (e.g., 'from my perspective')."},{"term":"hold a conversation","pos":"expression","definition":"To speak with someone and have a continuous, natural exchange of ideas or information.","lesson_example":"They learn English by force and they end up not being able to hold a very simple conversation.","examples":["I'm still practicing my speaking skills because I find it hard to hold a conversation with native speakers.","It's difficult to hold a conversation when you are both feeling very shy."],"note":"Often used with 'simple' or 'meaningful.' It implies a two-way exchange, not just speaking alone."},{"term":"end up","pos":"phrasal verb","definition":"to finally reach a state or situation, often unexpectedly or as a result of actions.","lesson_example":"They force English into their heads and end up not being able to hold a very simple conversation.","examples":["We got lost and ended up staying at a hotel for the night.","If you don't start saving money now, you'll end up having no savings at all."],"note":"Often used with 'with' or 'in' to describe the final result (e.g., 'end up with a cold')."},{"term":"fall in love with","pos":"expression","definition":"to develop a very strong interest, passion, or deep affection for something.","lesson_example":"You have to fall in love with the language and get immersion in the language.","examples":["I fell in love with photography after visiting the mountains last summer.","It is easy to fall in love with the city's vibrant nightlife and food scene."],"note":"Often used figuratively to describe a deep passion for hobbies, places, or objects."},{"term":"immersion","pos":"noun","definition":"The state of being completely surrounded by a language to learn it naturally.","lesson_example":"You have to fall in love with the language and get immersion in the language.","examples":["I find that living in Spain provides the best immersion for learning Spanish.","The school offers a total immersion program where students only speak English."],"note":"Often used in the phrase 'immersion method' or 'language immersion'."},{"term":"limitations","pos":"noun (plural)","definition":"The things that prevent something from being perfect or working in every situation.","lesson_example":"You can use it, but only if you understand its limitations.","examples":["The new software is great, but it has some limitations regarding offline use.","Every human being has physical limitations that we must respect."],"note":"Often used with the verb 'have' or 'recognize' (e.g., 'recognize the limitations')."},{"term":"realistically","pos":"adverb","definition":"In a way that is practical or possible based on the actual facts of a situation.","lesson_example":"The thing is, AI cannot realistically assess your speaking.","examples":["We want to finish the project by tomorrow, but realistically, we need at least three days.","You need to look at your budget realistically before you decide to buy a new car."],"note":"Often used to introduce a practical opinion or to temper over-optimistic expectations."},{"term":"accurately assess","pos":"verb phrase","definition":"to judge or evaluate something correctly and precisely.","lesson_example":"The thing is, AI cannot realistically accurately assess your speaking.","examples":["It is difficult to accurately assess the progress of a student based only on a final exam.","The software was designed to accurately assess the quality of the audio recording."],"note":"Often used in professional or academic contexts when discussing evaluations, tests, or data."},{"term":"bother","pos":"verb","definition":"To make someone feel slightly annoyed, worried, or uncomfortable.","lesson_example":"When you speak and somebody points out your mistakes, does it bother you?","examples":["I'm sorry to bother you, but could you tell me what time the meeting starts?","Stop worrying about what they think; it shouldn't bother you."],"note":"Often used in the negative: 'Don't let it bother you' (Don't let it upset you)."},{"term":"stressed out","pos":"adjective","definition":"Feeling very worried, anxious, or overwhelmed by pressure or difficult situations.","lesson_example":"Your stress level increases and you're kind of stressed out by that.","examples":["I get so stressed out when I have to give a presentation in front of a large audience.","You look really stressed out; why don't you take a break and grab a coffee?"],"note":"Often used with 'get' (e.g., 'I'm getting stressed out') to describe a changing state."},{"term":"rely on","pos":"phrasal verb","definition":"To depend on someone or something because it is very important or necessary for you.","lesson_example":"I rely on my phone a lot because without my phone I can't talk to people or watch YouTube.","examples":["You can always rely on Sarah to help you when you have a problem.","Many people rely on public transportation to get to work every morning."],"note":"Often used with 'depend on' as a synonym; 'rely' can be pronounced with a soft 'l' sound."},{"term":"genuine opinion","pos":"noun phrase","definition":"A sincere, honest thought or feeling that is not influenced by others.","lesson_example":"Well, first of all, what's your genuine opinion?","examples":["I don't want a polite answer; I want your genuine opinion on my new painting.","The survey was designed to collect the genuine opinions of the local residents."],"note":"Often used when asking for honesty rather than just a polite or 'safe' answer."},{"term":"in a nutshell","pos":"idiom","definition":"to describe something in a very short, concise way or using few words.","lesson_example":"When people say 'in a nutshell,' it means in a very short way.","examples":["Can you tell me your plan for the project in a nutshell?","In a nutshell, the company is moving to a new office next month."],"note":"Used to summarize a long story or a complex situation quickly."},{"term":"base form","pos":"noun phrase","definition":"The simplest version of a verb without any endings like -ed, -ing, or -s.","lesson_example":"After modal verbs like can, must, should, will, could, and would, we use the base form of the verb.","examples":["When you use the word 'must', you should use the base form of the verb.","The base form of 'watched' is 'watch'."],"note":"Do not add 'to' before the base form when using modal verbs."},{"term":"specific","pos":"adjective","definition":"clearly defined or identified by exact facts and details rather than being general.","lesson_example":"An example needs to be specific.","examples":["Could you give me a specific date for the meeting?","The doctor gave me specific instructions on how to take the medicine."],"note":"Often used with 'be' or 'give'. Don't confuse with 'particular' in many contexts."},{"term":"scrolling","pos":"verb (present participle)","definition":"Moving through content on a screen by swiping up or down with your finger.","lesson_example":"I remember finding this app when I was scrolling.","examples":["I spent two hours scrolling through news feeds on my phone.","Stop scrolling and try to focus on the article you are reading."],"note":"Often used with the preposition 'through' (e.g., scrolling through Instagram)."},{"term":"search for","pos":"phrasal verb","definition":"to look for something or try to find something.","lesson_example":"I was searching for an app.","examples":["I spent all morning searching for my lost keys.","Are you searching for a new job at the moment?"],"note":"Unlike 'search' (which can be used without a preposition), 'search for' requires the preposition 'for'."},{"term":"collocation","pos":"noun","definition":"A pair or group of words that are naturally used together by native speakers.","lesson_example":"It is the thing that is called a collocation.","examples":["Learning common collocations will help you sound more natural when speaking English.","The teacher explained that 'do homework' is a common collocation, while 'make homework' is incorrect."],"note":"Commonly confused with 'word order'; collocations are about which words 'fit' together naturally."},{"term":"live up to (someone's expectations)","pos":"phrasal verb","definition":"To be as good as someone expected or hoped you would be.","lesson_example":"And with promise, we have multiple verbs, but it's not do. I realize that it did not fulfill that promise. It did not. It didn't do what it promised. That might work. Okay. It didn't. Yeah, another one is it did not live up to its promise.","examples":["I hope I can live up to my parents' expectations during my graduation."],"note":"Often used with 'expectations', 'promises', or 'reputation'."},{"term":"representative","pos":"adjective","definition":"Typical of a large group or showing the qualities of a whole population.","lesson_example":"And one of it is, what's representativeness? what it is? When something is representative.","examples":["The survey results are representative of the entire country's opinions.","A small sample of the fruit is representative of the quality of the whole harvest."],"note":"Often used in statistics and research to describe a sample that accurately reflects a larger group."},{"term":"wrap it up","pos":"phrasal verb","definition":"To finish or conclude an activity, meeting, or conversation.","lesson_example":"So we should wrap it up at this point.","examples":["We have been meeting for two hours, so let's wrap it up and go home."],"note":"Commonly used in professional settings to signal the end of a meeting or task."},{"term":"run out of gas","pos":"phrasal verb","definition":"to use all of the fuel in a vehicle's tank","lesson_example":"If you run out of gas, your motorbike will die.","examples":["I had to stop at a station because the car ran out of gas.","We need to find a petrol station before we run out of gas."],"note":"Commonly used for cars and motorbikes; can also mean having no energy left."}],"dialogues":[{"title":"English practice and software engineering projects","lines":[{"speaker":"A","text":"So, what have you been up to today?"},{"speaker":"B","text":"I've been practicing my speaking skills using an app called GoPrepGG.","said":"I practice speaking is a A little okay, okay","highlights":["speaking skills"]},{"speaker":"A","text":"I've never heard of that one. How does it work exactly?"},{"speaker":"B","text":"The app gives me questions, I answer them, and then it provides an AI review and a score. I got a 4.5 and then a 5.","said":"They give me Questions like in I'll sex am and then I answered to this question and They give me review from a with AI and Ben score"},{"speaker":"A","text":"Did it give you any specific feedback on your performance?","said":"does us have a review does send you a review on how well you did"},{"speaker":"B","text":"It gave me a brief review, but it changed some of my words. My microphone might not be very good.","said":"Yeah Yeah, a little year review, but they Some changed my words what I said Maybe it is Because I Because I my microphone is isn't very good"},{"speaker":"A","text":"I see. So, what's your daily routine like besides studying English?","said":"what what did you do today? Not like, you know English-related just like, you know, what's going on in your life"},{"speaker":"B","text":"I usually wake up at 9 a.m., have breakfast, and then study math, English, IT, and Russian. I also hit the gym on Mondays, Wednesdays, and Fridays.","said":"Usually we cut at 9 a.m. And then Breakfast and then I study maybe math then English then other subjects for you get like Information technology and Russian language Computer science, yeah Okay, okay, so like is that what","highlights":["hit the gym"]},{"speaker":"A","text":"That sounds like a very intense schedule. Do you actually enjoy studying that much?","said":"is it do you like studying or like? There is something more in your life, you know"},{"speaker":"B","text":"Right now, it's all about achieving my goal of studying abroad. I think the education there is better, and I want to work as a software engineer.","said":"Now I just time because I have a period like I need to study just to Achieve my goal just study abroad Why do on study abroad Because I think that education in there better than in the international Well and I sure and I want to","highlights":["studying abroad"]},{"speaker":"A","text":"So you're into coding! What was the last project you worked on?","said":"So you like you like coding Yeah What is the last thing you you did what this last thing you coded"},{"speaker":"B","text":"I built a house rental project. Users can browse listings, book a house, leave feedback, and owners can register their apartments.","said":"does It's Just you have a boss Boss in your recommendations and you can rent this one of the houses What you got and you can create first of house you can delete you can give feedback of this post"},{"speaker":"A","text":"Is that different from apps like Airbnb?","said":"we have other probably applications that do that What? Don't"},{"speaker":"B","text":"Airbnb is usually for hotels. My project was more of a study project. I actually got the idea from chatting with an AI to help clarify my thoughts.","highlights":["clarify my thoughts"]},{"speaker":"A","text":"So you use AI to structure your ideas. What was the last thing you coded that was your own original idea?"},{"speaker":"B","text":"I did a social media project, similar to Twitter, where users can post videos, comments, and likes."},{"speaker":"A","text":"Why did you choose to build that specifically?","said":"But why would you need what why would you think that you need an application like that"},{"speaker":"B","text":"Honestly, I don't really care about the specific idea. I just want to practice coding features and functions."}]},{"title":"Coding goals and gaming preferences","lines":[{"speaker":"A","text":"I really enjoy developing apps that solve specific problems I have. What's your approach to coding?","said":"I like Developing apps that solve some problems that I have"},{"speaker":"B","text":"I don't really like coding for the sake of coding. I need to have a clear picture in my head of a goal I want to achieve.","said":"I don't like coding for the sake of like coding but I like coding when I know that I can achieve some goal that I have in my head"},{"speaker":"A","text":"That makes sense. So, do you enjoy playing video games these days?","said":"Do you like games playing video games"},{"speaker":"B","text":"I used to play a lot, but now I only play for maybe two hours a week. I just want to relax and not have to worry about my teammates."},{"speaker":"A","text":"What kind of games do you like playing now?","said":"what's come what kind of video games do you like playing now"},{"speaker":"B","text":"I prefer solo RPGs. Right now, I'm playing a chill game, though it's not really story-driven."},{"speaker":"A","text":"What's your favorite story-driven game?","said":"what's your favorite story driven our game Story"},{"speaker":"B","text":"I think Red Dead Redemption 2. I finished The Witcher 3, but I realized how much time I'd have to put into other games."},{"speaker":"A","text":"Do you have a gaming laptop?","said":"is it is it a gaming laptop"},{"speaker":"B","text":"It's a laptop from Yandex. It's powerful enough to run games on medium settings.","said":"I think now what's what's the brand? Loon and for some yandex from yandex from"},{"speaker":"A","text":"If you can run CS2, you can definitely play other games.","said":"So you can play game well if you if you can play CS 2 you can definitely play any other game basically, right"},{"speaker":"B","text":"I usually play on my laptop, but I can connect it to an external monitor via HDMI.","said":"I just connected my laptop to an external monitor via HDMI"},{"speaker":"A","text":"I see. So you prefer single-player games because they help you relax?","said":"So like you like single-player games because they help you relax"},{"speaker":"B","text":"Exactly. I just want to unwind without the pressure of online competition.","said":"I want to relax and video games and not or don't have Don't commit to a game don't don't worry about My teammates"},{"speaker":"A","text":"And what are you coding at the moment?","said":"what what are you coding right now"},{"speaker":"B","text":"I'm working on a website using SQL Alchemy.","said":"I'm coding this Aveda website Yeah"}]},{"title":"Coding, English learning, and gaming","lines":[{"speaker":"A","text":"When you're writing Python code and need to interact with a database, you can use libraries like SQLAlchemy to translate your commands.","said":"when you write in Python and this to to Translate this Python code to SQL language to your database and And Return it","highlights":["interact with a database"]},{"speaker":"B","text":"I enjoy coding because I can build apps that do things very quickly. It saves me a lot of time.","said":"I like coding because I can make an app that Does something very fast Which I had to do which I had to spend a lot of time doing before","highlights":["saves me a lot of time"]},{"speaker":"A","text":"What do you like about coding? Is it the building part or the algorithms?"},{"speaker":"B","text":"I've lost some motivation lately, but I'm interested in building something to optimize my daily routine.","highlights":["lost some motivation"]},{"speaker":"A","text":"Like searching for things in the browser via the terminal? You'd have to create a specific command for that.","said":"Maybe these Search in browser like Right what you want in terminal and you Quickly can Find it in the browser","highlights":["via the terminal"]},{"speaker":"B","text":"Do you enjoy learning English? I try to practice every day, but sometimes I lose motivation.","said":"English Yeah, like just but I sometimes Have no motivation and no but I trying to practice speaking every day","highlights":["lose motivation"]},{"speaker":"A","text":"What do you usually talk about with ChatGPT?","said":"what do you talk about with chat GPT"},{"speaker":"B","text":"A lot of random things, like the weather. It's a bit boring, but I need the practice.","highlights":["a bit boring"]},{"speaker":"A","text":"You're much better than the average student in Russia. How did you achieve that level?","said":"If we take an average 16 year old person in Russia Their level of English will be lower than yours With this person I would not be able","highlights":["achieve that level"]},{"speaker":"B","text":"I started learning with Gemini and watched videos. I prefer learning through practice rather than memorizing lists.","said":"I start learning English With AI just like Gemini. I started learning grammar Start watch English videos and From it I Learn new words some some new words, but I I don't like just Memorize words from Least or from cars","highlights":["rather than"]},{"speaker":"A","text":"Learning from movies is much more enjoyable. Coding just for the sake of coding feels like memorizing words from a spreadsheet.","highlights":["just for the sake of"]},{"speaker":"B","text":"I was motivated because English and math were the only interesting things for me after 9th grade.","said":"I was motivated. I think that it's something interesting what I found when I and ended my nine grades and It was only interesting thing and English and math"},{"speaker":"A","text":"It's sad how many people just memorize topics for tests and can't hold a simple conversation.","said":"eager who have to take English or ga They learn it like the force English in their head and they end up not being able to hold a very simple conversation"},{"speaker":"B","text":"I just memorized topics and thought, 'What is wrong with this?' It felt so boring.","said":"I just memorize the topics for speaking I Then I Thought what what does what? What did we what did what did they does or? What did what did they do what? and I thought What is it wrong? Yeah, I think I thought what"},{"speaker":"A","text":"You played The Witcher 3 in Russian, right? If you played it today, would you choose English?","said":"when I played this If you If you were to play a game like that today, would you play it in Russian or in English? I"}]},{"title":"Discussing AI limitations and recommendation algorithms","lines":[{"speaker":"A","text":"It's great that you're motivated to learn English. Many students treat it like an unloved child—they only want the result of a good job, but they don't actually enjoy the process.","highlights":["unloved child"]},{"speaker":"A","text":"Have you ever fallen in love in your life?"},{"speaker":"B","text":"I think only once, with a girl.","said":"I Think One time it was Really with a girl"},{"speaker":"A","text":"Well, it would be even cooler if English were your first love! Anyway, you're here to prepare for the IELTS test. My advice is to be careful with using that AI prep website.","highlights":["be careful with"]},{"speaker":"B","text":"Why is that?","said":"why"},{"speaker":"A","text":"AI isn't built for language learners. It can't accurately assess your speaking because it doesn't understand word stress. If you mispronounce a syllable, it might think you're saying a completely different word.","highlights":["accurately assess"]},{"speaker":"A","text":"For example, if you mispronounce 'stomach,' the AI might think you're trying to say 'quidditch' or a French word for cheese."},{"speaker":"A","text":"Does it bother you when someone points out your mistakes while you're speaking?","said":"bother you know like bother means that you're kind of annoyed by that","highlights":["points out"]},{"speaker":"B","text":"I think so. It does bother me.","said":"I Think so. Yeah, I Bothers Bothers me it bothers you"},{"speaker"         (() => {

            const PLACEHOLDERS = new Set(['someone', 'somebody', 'something', 'sb', 'sth', 'one', "one's", "someone's", 'oneself', 'yourself', 'my', 'your', 'his', 'her', 'its', 'our', 'their', 'a', 'an', 'the']);
            const IRREGULAR = {};
            'be:am,is,are,was,were,been|have:has,had|do:does,did,done|go:goes,went,gone|take:took,taken|make:made|get:got,gotten|give:gave,given|come:came|see:saw,seen|know:knew,known|think:thought|tell:told|find:found|grow:grew,grown|keep:kept|leave:left|bring:brought|buy:bought|catch:caught|choose:chose,chosen|drive:drove,driven|eat:ate,eaten|fall:fell,fallen|feel:felt|fight:fought|fly:flew,flown|forget:forgot,forgotten|hear:heard|hold:held|lay:laid|lead:led|lose:lost|meet:met|pay:paid|say:said|sell:sold|send:sent|sit:sat|sleep:slept|speak:spoke,spoken|spend:spent|stand:stood|stick:stuck|teach:taught|throw:threw,thrown|understand:understood|wear:wore,worn|win:won|write:wrote,written|wind:wound|light:lit|run:ran|begin:began,begun|break:broke,broken|build:built|mean:meant|ride:rode,ridden|rise:rose,risen'
                .split('|').forEach(entry => {
                    const [base, forms] = entry.split(':');
                    IRREGULAR[base] = base;
                    forms.split(',').forEach(form => { IRREGULAR[form] = base; });
                });

            const icons = {
                play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
                bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg>'

            const lesson = LESSON || {};
            const meta = lesson.meta || {};
            const mistakes = lesson.mistakes || [];
            const vocabulary = lesson.vocabulary || [];

            // --------------------------------------------------------- helpers
            function esc(value) {
                return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

            function norm(word) {
                return word.toLowerCase().replace(/’/g, "'").replace(/[^\p{L}\p{N}']/gu, '');
            }

            function stem(word) {
                let w = norm(word).replace(/'s$/, '');
                if (IRREGULAR[w]) return IRREGULAR[w];
                for (const suffix of ['ing', 'ied', 'ies', 'ed', 'es', 's', 'ly']) {
                    if (w.endsWith(suffix) && w.length - suffix.length >= 3) { w = w.slice(0, -suffix.length); break; }
                }

            }

            function playButton(text, label) {
                return `<button class="play" type="button" data-say="${esc(text)}" aria-label="${esc(label || 'Listen')}" data-no-speech>${icons.play}</button>`;
            }

            // Word diff (longest common subsequence) between what was said and the fix.
            function diff(before, after) {
                const a = before.split(/\s+/).filter(Boolean);
                const b = after.split(/\s+/).filter(Boolean);
                const n = a.length, m = b.length;
                const table = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
                for (let i = n - 1; i >= 0; i--) {
                    for (let j = m - 1; j >= 0; j--) {
                        table[i][j] = norm(a[i]) === norm(b[j]) ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
                    }
                }
                const left = [], right = [];
                let i = 0, j = 0;
                while (i < n || j < m) {
                    if (i < n && j < m && norm(a[i]) === norm(b[j])) {
                        left.push({ word: a[i++], kind: 'same' });
                        right.push({ word: b[j++], kind: 'same' });
                    } else if (j >= m || (i < n && table[i + 1][j] >= table[i][j + 1])) {
                        const word = a[i];
                        const previous = i > 0 ? norm(a[i - 1]) : '';
                        const noise = FILLERS.has(norm(word)) || norm(word) === previous || !norm(word);
                        left.push({ word, kind: noise ? 'same' : 'del' });
                        i++;
                    } else {
                        // Mark where a missing word belongs, unless a deletion already shows the spot.
                        const last = left[left.length - 1];
                        if (!last || (last.kind !== 'del' && last.kind !== 'gap')) left.push({ kind: 'gap' });
                        right.push({ word: b[j++], kind: 'ins' });
                    }
                }
                const render = (tokens, tag) => tokens.map(t => {
                    if (t.kind === 'gap') return '<span class="gap" aria-hidden="true"></span>';
                    return t.kind === 'same' ? esc(t.word) : `<${tag} class="w">${esc(t.word)}</${tag}>`;
                }).join(' ').replace(/<\/(del|ins)> <\1 class="w">/g, ' ');
                return { said: render(left, 'del'), fixed: render(right, 'ins') };
            }

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {
                    if (!hit[index] && functional.has(norm(part))) {
                        const near = [index - 2, index + 2].some(k => hit[k]);
                        if (near) hit[index] = true;
                    }
                });
                return parts.map((part, index) => {
                    if (!hit[index]) return esc(part);
                    // Underline the word itself, not quotes or punctuation stuck to it.
                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                    return `${esc(before)}<b class="hl">${esc(core)}</b>${esc(after)}`;
                }).join('');
            }

            function highlightPhrases(text, phrases) {
                const lower = text.toLowerCase();
                const ranges = [];
                (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end]) => {
                    html += esc(text.slice(cursor, start)) + `<mark class="expr">${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {

            // -------------------------------------------------------- mistakes
            function renderMistakes() {

                let html = '<p class="panel-intro">Moments from your conversation, retold the way two native speakers would say them. Highlighted phrases are worth borrowing. Tap “original” to compare with what was actually said.</p>';
                dialogues.forEach(dialogue => {
                    html += `<article class="card dialogue"><h3>${esc(dialogue.title)}</h3>`;
                    (dialogue.lines || []).forEach(line => {
                        const side = line.speaker === 'B' ? 'B' : 'A';
                        html += `<div class="line ${side}"><span class="who" data-no-speech>${side}</span><div class="bubble">${highlightPhrases(line.text, line.highlights)}`;
                        if (line.said) {
                            html += '<button class="orig-toggle" type="button" data-no-speech>original</button>';
                            html += `<div class="orig" hidden>${esc(line.said)}</div>`;
                        }
                        html += '</div></div>';
                    });
                    html += '</article>';
                });
                panel.innerHTML = html;
                panel.addEventListener('click', event => {
                    const button = event.target.closest('.orig-toggle');
                    if (!button) return;
                    const original = button.nextElementSibling;
                    original.hidden = !original.hidden;
                    button.textContent = original.hidden ? 'original' : 'hide original';
                });
            }

            // ------------------------------------------------------------ tabs
            const tabs = Array.from(document.querySelectorAll('.tab'));
            function selectTab(name, remember) {
                tabs.forEach(tab => {
                    const active = tab.dataset.tab === name;
                    tab.setAttribute('aria-selected', String(active));
                    tab.tabIndex = active ? 0 : -1;
                    document.getElementById('panel-' + tab.dataset.tab).hidden = !active;
                });
                if (remember) storage('lesson-tab', name);
            }
            tabs.forEach((tab, index) => {
                tab.addEventListener('click', () => {
                    selectTab(tab.dataset.tab, true);
                    // If the reader had scrolled into the content, start the new tab at its top.
                    const bar = document.querySelector('.tabs');
                    const contentTop = document.querySelector('main').offsetTop - bar.offsetHeight;
                    if (window.scrollY > contentTop) window.scrollTo({ top: contentTop });
                });
                tab.addEventListener('keydown', event => {
                    const step = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;
                    if (!step) return;
                    const next = tabs[(index + step + tabs.length) % tabs.length];
                    next.focus();
                    selectTab(next.dataset.tab, true);
                });
            });

            renderMistakes();
            renderVocabulary();
            renderDialogues();
            const remembered = storage('lesson-tab');
            selectTab(['mistakes', 'vocabulary', 'dialogues'].includes(remembered) ? remembered : 'mistakes', false);

            // ----------------------------------------------------------- voice
            document.addEventListener('click', event => {
                const button = event.target.closest('.play');
                if (button && window.lessonVoice) window.lessonVoice.speak(button.dataset.say);
            });
            window.addEventListener('load', () => {
                if (window.lessonVoice) document.documentElement.classList.add('voice-ready');
            });
        })();
    </script>

(() => {
    'use strict';

    const manifest = window.STATIC_VOICE_MANIFEST || {};
    if (!Object.keys(manifest).length) return;

    const state = {
        lastCapturedSelection: '',
        audioContext: null,
        currentSource: null,
        bufferCache: new Map(),
        session: 0,
        selectionTimer: null,
        pointerActive: false,
        pauseTimer: null,
        pauseResolve: null
    };

    function normalizeKey(value) {
        return value
            .normalize('NFKC')
            .replace(/’/g, "'")
            .toLocaleLowerCase('en-US');
    }

    function normalizeSelectedText(value) {
        return value
            .replace(/\u00a0/g, ' ')
            .replace(/\r/g, '')
            .split(/\n+/)
            .map(line => line.replace(/[ \t]+/g, ' ').trim())
            .filter(Boolean)
            .join('\n')
            .trim();
    }

    function nodeExcludedFromSpeech(node) {
        if (!node) return false;
        const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
        return Boolean(element && element.closest('[data-no-speech]'));
    }

    function tokenize(text) {
        const expression = /[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu;
        const matches = Array.from(text.matchAll(expression));

        return matches.map((match, index) => {
            const end = match.index + match[0].length;
            const nextStart = index + 1 < matches.length ? matches[index + 1].index : text.length;
            return {
                key: normalizeKey(match[0]),
                after: text.slice(end, nextStart)
            };
        });
    }

    function getAudioContext() {
        if (!state.audioContext) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) throw new Error('This browser cannot play lesson audio.');
            state.audioContext = new AudioContextClass();
        }
        return state.audioContext;
    }

    function resolvePendingPause() {
        if (state.pauseTimer) window.clearTimeout(state.pauseTimer);
        state.pauseTimer = null;
        if (state.pauseResolve) state.pauseResolve();
        state.pauseResolve = null;
    }

    function cancelPlayback() {
        state.session += 1;
        resolvePendingPause();
        if (!state.currentSource) return;
        try {
            state.currentSource.stop();
        } catch (_error) {
            // The word may have ended between the check and stop call.
        }
        state.currentSource = null;
    }

    async function loadBuffer(path) {
        if (state.bufferCache.has(path)) return state.bufferCache.get(path);

        const promise = (async () => {
            const response = await fetch(path, { cache: 'force-cache' });
            if (!response.ok) throw new Error(`An audio word could not be loaded (${response.status}).`);
            const data = await response.arrayBuffer();
            return getAudioContext().decodeAudioData(data.slice(0));
        })();

        state.bufferCache.set(path, promise);
        try {
            return await promise;
        } catch (error) {
            state.bufferCache.delete(path);
            throw error;
        }

    function playBuffer(buffer, session) {
        return new Promise((resolve, reject) => {
            if (session !== state.session) {
                resolve();
                return;
            }

            source.buffer = buffer;
            source.connect(state.audioContext.destination);
            state.currentSource = source;
            source.onended = () => {

            try {

            } catch (error) {

            }

    function punctuationPause(text) {
        if (/[.!?]/.test(text)) return 230;
        if (/[;:]/.test(text)) return 145;
        if (/,/.test(text)) return 105;
        if (/\n/.test(text)) return 170;
        return 28;

            if (session !== state.session || milliseconds <= 0) {

                return;

            state.pauseTimer = window.setTimeout(() => {

                state.pauseResolve = null;
                resolve();

            const session = state.session;
            const playable = tokenize(text).filter(token => manifest[token.key]);
            if (!playable.length) return;

            await resumePromise;
            const prefetch = index => {

                    const item = playable[index + offset];
                    if (item) loadBuffer(manifest[item.key]).catch(() => {});
                }
            };

            for (let index = 0; index < playable.length; index += 1) {

                await waitForPause(punctuationPause(token.after), session);

            console.warn('Lesson audio could not be played.', error);
        }

        window.clearTimeout(state.selectionTimer);
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {

            return false;

        return true;
    }

        if (!selection || selection.isCollapsed) return;
        try {
            getAudioContext().resume();
        } catch (_error) {

        }

        if (nodeExcludedFromSpeech(event.target)) return;
        state.pointerActive = true;
        window.clearTimeout(state.selectionTimer);

    document.addEventListener('pointerup', event => {
        state.pointerActive = false;
        if (nodeExcludedFromSpeech(event.target)) return;

        state.pointerActive = false;
    });

        if (nodeExcludedFromSpeech(event.target)) return;
        state.pointerActive = true;
        window.clearTimeout(state.selectionTimer);
    }, { passive: true });
    document.addEventListener('touchend', event => {
        state.pointerActive = false;
        if (nodeExcludedFromSpeech(event.target)) return;
