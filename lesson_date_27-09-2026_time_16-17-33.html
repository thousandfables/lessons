<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;

        const LESSON = {"version":4,"meta":{"title":"Coding, Gaming, and Language Goals","topics":["Daily routine and study goals","Software engineering and coding projects","Video games and hardware","Learning English and AI","Grammar and specific examples","Language learning and scheduling"],"date":"27 September 2026","time":"16:17"},"topics":[{"title":"Daily routine and study goals","at":0,"time":0.0},{"title":"Software engineering and coding projects","at":594,"time":363.6},{"title":"Video games and hardware","at":1622,"time":930.1},{"title":"Learning English and AI","at":3493,"time":2100.3},{"title":"Grammar and specific examples","at":6476,"time":3672.9},{"title":"Language learning and scheduling","at":8527,"time":5199.1}],"mistakes":[{"severity":"high","label":"Preposition","rule":"Use the correct preposition based on the specific verb or context.","examples":[{"quote":"answered to this question","fix":"answer this question","context":"They give me questions like in the IELTS exam and then I answered to this question and they give me a review from AI and a band score.","context_fix":"They give me questions like in the IELTS exam and then I answer this question and they give me a review from AI and a band score.","why":"The verb 'answer' is transitive, so you don't need 'to' before the object. You just 'answer a question'.","time":87.2,"at":139,"topic":0,"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/008212-010105.webm","at":82.3,"dur":18.93}},{"quote":"in Monday, Wednesday, and Friday","fix":"on Monday, Wednesday, and Friday","context":"I just study, and in Monday, Wednesday, and Friday I have workouts in the gym.","context_fix":"I just study, and on Monday, Wednesday, and Friday I have workouts in the gym.","why":"We use the preposition \"on\" for specific days of the week, such as Monday, Wednesday, and Friday.","time":256.3,"at":411,"topic":0,"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/025292-026527.webm","at":253.0,"dur":12.35}},{"quote":"give feedback of this post","fix":"give feedback on this post","context":"You can create a house, you can delete it, you can give feedback of this post, and where do houses come from? A lot of users.","context_fix":"You can create a house, you can delete it, you can give feedback on this post, and where do houses come from? A lot of users.","why":"We use the preposition 'on' when providing feedback about a specific item, such as a post or a product.","time":432.8,"at":705,"topic":1,"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/042826-044675.webm","at":428.4,"dur":18.49}},{"quote":"give likes for post","fix":"give likes to posts","context":"You can post a video, post a comment, and give likes for post. Create account, delete account, delete post, delete comments.","context_fix":"You can post a video, post a comment, and give likes to posts. Create account, delete account, delete post, delete comments.","why":"We use 'give' with the preposition 'to' to indicate the target. Also, 'posts' should be plural here.","time":701.4,"at":1221,"topic":1,"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/068734-071075.webm","at":687.4,"dur":23.41}},{"quote":"two hours in a week","fix":"for two hours a week","context":"I used to play video games a lot, but now I don't really enjoy them; I can play games two hours in a week.","context_fix":"I used to play video games a lot, but now I don't really enjoy them; I can play games for two hours a week.","why":"Use 'for' to show duration (for two hours). 'A week' is more natural than 'in a week' for frequency.","time":941.3,"at":1646,"topic":2,"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/093490-094692.webm","at":935.0,"dur":12.02}},{"quote":"don't have games in laptop","fix":"don't have games on my laptop","context":"How do you buy games? I don't have games in laptop. I just have free games on my left child's hand.","context_fix":"How do you buy games? I don't hav n or pressure rather than through natural interest.","time":2452.5,"lesson":"Many students have to take English exams. They learn by forcing English into their heads, and they end up being unable to hold a very simple conversation.","examples":[{"sentence":"You can't just force grammar rules into a child's head; they need to practice speaking.","pattern":"force + [noun] + into someone's head"},{"sentence":"I tried to force the vocabulary into my head, but I forgot it all the next day.","pattern":""},{"sentence":"The teacher is forcing the facts into our heads for the exam, but we aren't actually learning.","pattern":"be + forcing + [noun] + into someone's head"},{"sentence":"If you force information into your head without understanding it, you won't be able to use it naturally.","pattern":""}],"more_examples":["My parents tried to force the idea of a career in medicine into my head from a young age.","You can't just force a new hobby into someone's head; they have to want to do it.","The training manual is so dense that it feels like they're trying to force the entire company's policy into our heads in one day."],"synonyms":["cram","drill into someone","hammer into someone","indoctrinate","stuff into someone's head"],"antonyms":["learn naturally","absorb information","pick up a skill","learn by osmosis"],"gap":{"sentence":"Instead of letting the students explore the topic naturally, the teacher tried to _____ for the test.","answer":"force the dates into their heads","options":["force the dates into their heads","explain the dates to their","write the dates on their","share the dates with their"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/245142-245796.webm","at":2451.5,"dur":6.54}},{"term":"end up","pos":"phrasal verb","definition":"To reach a situation or state that was not planned or expected.","time":2455.8,"lesson":"They force English into their heads and end up not being able to hold a very simple conversation.","examples":[{"sentence":" out travel and culture.","The goal of the workshop is to help students hold a conversation more fluently.","Even though they speak different languages, they managed to hold a conversation using gestures and simple words."],"synonyms":["have a chat","have a talk","carry on a conversation","keep a conversation going","engage in conversation","converse"],"antonyms":["keep silent","stop talking"],"gap":{"sentence":"The noise in the cafe was so loud that it was almost impossible to _____ with my friend.","answer":"hold a conversation","options":["hold a conversation","make a decision","give a presentation","write a report"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/245624-246145.webm","at":2456.3,"dur":5.21}},{"term":"treat (something) like an unloved child","pos":"expression","definition":"To neglect something while still demanding that it produce successful results for you.","time":2613.6,"lesson":"Many students are bad at English because they treat it like an unloved child. You don't love the child, but you want them to succeed so they can provide for you.","examples":[{"sentence":"He treats his hobby like an unloved child, only paying attention to it when he needs a result.","pattern":""},{"sentence":"You shouldn't treat your health like an unloved child by ignoring it until it's a crisis.","pattern":""},{"sentence":"She treats her business like an unloved child; she ignores the daily work but demands constant profit.","pattern":""},{"sentence":"If you treat your studies like an unloved child, you will struggle to see any real progress.","pattern":"If you treat [something] like an unloved child, [result]"}],"more_examples":["He treats his car like an unloved child, refusing to change the oil until the engine starts smoking.","Don't treat your friendships like an unloved child by only calling people when you need a favor.","She treats her garden like an unloved child, expecting beautiful flowers without ever watering the soil."],"synonyms":[],"antonyms":["nurture","give consistent attention","maintain regularly","prioritize","care for consistently"],"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/261414-261905.webm","at":2614.2,"dur":4.91}},{"term":"provide for (someone)","pos":"phrasal verb","definition":"To supply someone with the money, food, and other necessities for living.","time":2623.7,"lesson":"Imagine you have a child you don't love, but you want him to earn a lot of money because he will then provide for you.","examples":[{"sentence":"He works two jobs to provide for his growing family.","pattern":"provide for + object"},{"sentence":"The government is responsible for providing for the elderly.","pattern":""},{"sentence":"She couldn't afford to provide for herself after she lost her job.","pattern":""},{"sentence":"The parents worked hard to provide for their children's education.","pattern":"provide for + [noun phrase]"}],"more_examples":["After his wife passed away, he had to find a way to provide for their three children.","It is often difficult for young people to provide for themselves in such an expensive city.","The company offers a pension plan to provide for its employees in their retirement."],"synonyms":["support","sustain","maintain","keep","finance","fund"],"antonyms":["neglect","abandon","desert"],"gap":{"sentence":"Since he became the sole breadwinner, he has had to work extra shifts to _____ his wife and three children.","answer":"provide for","options":["provide for","set up","get along with","check on"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/262842-263520.webm","at":2628.5,"dur":6.78}},{"term":"fall in love with (something)","pos":"expression","definition":"To develop a very strong interest, passion, or enjoyment for a hobby or activity.","time":2658.2,"lesson":"I don't think that is a fair way to learn languages. You have to fall in love with the language and immerse yourself in it.","examples":[{"sentence":"I fell in love with photography after visiting Italy.","pattern":"fall in love with + noun"},{"sentence":"It's hard to fall in love with a hobby if you don't practice regularly.","pattern":"fall in love with + noun (negative form)"},{"sentence":"She has fallen in love with the idea of living in the countryside.","pattern":"have fallen in love with + noun phrase"},{"sentence":"You need to fall in love with the process, not just the end result.","pattern":"fall in love with + the + noun"}],"more_examples":["I think I'm starting to fall in love with cooking Thai food.","He fell in love with gardening and spent every weekend in the backyard.","Many people fall in love with the sport of marathon running once they finish their first race."],"synonyms":["take a shine to","develop a passion for","become captivated by","get into","become enthusiastic about"],"antonyms":["lose interest in","grow tired of","become bored with"],"gap":{"sentence":"I started taking pottery classes last month and I have quickly _____ making ceramics.","answer":"fallen in love with","options":["fallen in love with","stopped using","forgot about","avoided"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/265718-266231.webm","at":2657.3,"dur":5.13}},{"term":"limitations","pos":"noun","definition":"The things that prevent something from being perfect or working completely well.","time":2737.5,"lesson":"You can use this website, but only if you understand its limitations. I have tried many different approaches to help you prepare for the IELTS test.","examples":[{"sentence":"The new software has some limitations regarding how much data it can process.","pattern":"have limitations regarding"},{"sentence":"We have to work within the limitations of our current budget.","pattern":"within the limitations of"},{"sentence":"One of the main limitations of this study is the small sample size.","pattern":"limitations of [something]"},{"sentence":"The machine is powerful, but it has its limitations.","pattern":"have its limitations"}],"countable":[{"meaning":"The things that prevent something from being perfect or working completely well.","example":"You can use this website, but only if you understand its limitations.","lesson":true},{"meaning":"The boundaries or restrictions placed on someone's freedom or actions","example":"The prisoners were kept within the limitations of the high walls."},{"meaning":"The extent or scope of something's power or influence","example":"He was aware of the limitations of his own authority."}],"uncountable":[],"more_examples":["The prototype is great, but it has some limitations when used outdoors.","Due to the limitations of the current technology, we can't stream in 8K yet.","The team had to adapt because of the physical limitations of the workspace."],"synonyms":["constraints","restrictions","drawbacks","shortcomings","weaknesses","boundaries"],"antonyms":[],"gap":{"sentence":"The free version of the app is great, but its _____ mean you can't save more than three files.","answer":"limitations","options":["limitations","advantages","benefits","styles"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/273802-274349.webm","at":2738.1,"dur":5.47}},{"term":"realistically","pos":"adverb","definition":"In a way that is practical or possible based on the actual facts of a situation.","time":2756.6,"lesson":"I have tried many different approaches to help you prepare for the IELTS test. The thing is, AI cannot realistically assess your speaking skills accurately.","examples":[{"sentence":"Realistically, we won't be able to finish this project by tomorrow.","pattern":"Realistically, + [clause]"},{"sentence":"How much can we realistically expect to spend on a new car?","pattern":"realistically + expect to"},{"sentence":"You need to look at the situation realistically rather than just hoping for the best.","pattern":"look at [something] realistically"},{"sentence":"Can we realistically achieve our sales goals this month?","pattern":"realistically + [verb]"}],"more_examples":["Realistically, we need to cut costs if we want to stay in business.","How many people can realistically attend the wedding given the current travel restrictions?","I'd love to travel the world, but realistically, I need to save for a house first."],"synonyms":["practically","feasibly","pragmatically","in reality","actually"],"antonyms":["idealistically","theoretically","unrealistically","hypothetically"],"gap":{"sentence":"We want to travel around Europe for a month, but _____, we need to consider our current savings.","answer":"realistically","options":["realistically","optimistically","anxiously","automatically"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/275965-276045.webm","at":2759.8,"dur":0.8}},{"term":"accurately assess","pos":"verb phrase","definition":"To judge or evaluate something correctly and precisely, especially regarding a person's skill level.","time":2756.6,"lesson":"I have tried many different approaches to help you prepare for the IELTS test. The thing is, AI cannot realistically accurately assess your speaking skills.","examples":[{"sentence":"The new software is designed to accurately assess students' reading comprehension.","pattern":""},{"sentence":"It is difficult for a computer to accurately assess the nuances of human emotion.","pattern":""},{"sentence":"We need a way to accurately assess the progress of the project.","pattern":""},{"sentence":"Can this test accurately assess my level of fluency?","pattern":""}],"more_examples":["The interview process is designed to accurately assess a candidate's technical expertise.","It is hard to accurately assess the value of a vintage painting without an expert.","The coach used a new system to accurately assess each player's speed and stamina."],"synonyms":["evaluate correctly","gauge precisely","measure accurately","appraise correctly","determine precisely","gauge accurately"],"antonyms":["misjudge","underestimate","overestimate","judge poorly","miscalculate"],"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/276054-276339.webm","at":2760.6,"dur":2.85}},{"term":"stress","pos":"noun","definition":"The emphasis or force given to a specific syllable when pronouncing a word.","time":2788.7,"lesson":"AI models are built for people who are already fluent and want to write down their thoughts. If you miss the stress or put the stress on a different syllable, the AI may not realize you are struggling with pronunciation; it might simply think you are saying a different word.","examples":[{"sentence":"In the word 'photograph', the stress is on the first syllable.","pattern":"stress + on + [location]"},{"sentence":"You need to put more stress on the 're' in 'remember'.","pattern":"put stress on [syllable]"},{"sentence":"The word 'record' has a different stress depending on whether it is a noun or a verb.","pattern":"different stress"},{"sentence":"I'm having trouble identifying which syllable to stress in this word.","pattern":"identify + stress"}],"countable":[],"uncountable":[{"meaning":"The emphasis or force given to a specific syllable when pronouncing a word.","example":"If you miss the stress or put the stress on a different syllable, the AI may not realize you are struggling with pronunciation; it might simply think you are saying a different word.","lesson":true},{"meaning":"Physical or emotional pressure or tension","example":"Exercise is a great way to relieve stress."}],"more_examples":["Could you tell me which syllable to stress in 'environment'?","The word 'banana' has the stress on the second syllable.","I'm not sure where the stress falls in this long word."],"synonyms":["emphasis","weight"],"antonyms":[],"gap":{"sentence":"The teacher asked the students to pay attention to which syllable receives the most _____ when pronouncing the word 'banana'.","answer":"stress","options":["stress","speed","melody","style"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/279250-279410.webm","at":2792.6,"dur":1.6}},{"term":"point out","pos":"phrasal verb","definition":"To direct someone's attention to a specific fact, mistake, or piece of information.","time":2894.7,"lesson":"Does it bother you when you are speaking and someone points out your mistakes?","examples":[{"sentence":"Could you point out the errors in my essay?","pattern":"point out + noun"},{"sentence":"The teacher pointed out that I had forgotten to include the date.","pattern":"point out + that-clause"},{"sentence":"I'd like to point out that we are already over budget.","pattern":"I'd like to point out"},{"sentence":"He pointed out the flaws in the plan before we started.","pattern":"point out + object + [time phrase]"}],"more_examples":["The GPS pointed out that we had taken a wrong turn.","I'd like to point out that this offer expires at midnight.","Can you point out where the nearest subway station is?"],"synonyms":["indicate","mention","highlight","identify","show","call attention to","note","bring up"],"antonyms":["ignore","overlook","conceal","hide","disregard"],"gap":{"sentence":"During the meeting, my colleague _____ that the deadline had already passed, so we needed to hurry.","answer":"pointed out","options":["pointed out","looked at","listened to","talked about"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/289404-289981.webm","at":2894.1,"dur":5.77}},{"term":"bother","pos":"verb","definition":"To make someone feel slightly annoyed, worried, or uncomfortable.","time":2915.3,"lesson":"When you are speaking and somebody corrects every mistake you make, does it bother you? Bother means that you are kind of annoyed by it and you don't like it.","examples":[{"sentence":"I'm sorry to bother you, but could you help me with this bag?","pattern":"I'm sorry to bother you"},{"sentence":"Stop bothering me while I'm trying to work!","pattern":"bother + object"},{"sentence":"Does the loud noise from the street bother you at night?","pattern":"Does [something] bother you?"},{"sentence":"It doesn't bother me if we arrive a few minutes late.","pattern":"It doesn't bother + person"}],"more_examples":["I'm sorry to bother you, but do you have the time?","I don't want to bother you, but the door is slightly open.","Does it bother you if I smoke on the balcony?"],"synonyms":["annoy","disturb","irritate","trouble","pester","bug"],"antonyms":["soothe","comfort","please","calm"],"gap":{"sentence":"I don't mind the smell of the cooking, but the constant clicking of the clock really _____ me.","answer":"bothers","options":["bothers","helps","calms","pleases"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/290880-291874.webm","at":2908.9,"dur":9.94}},{"term":"stressed out","pos":"adjective","definition":"Feeling very worried, anxious, or overwhelmed, especially by a specific pressure or task.","time":2954.2,"lesson":"I only start thinking about not making a mistake, which is very annoying. Your stress level increases and you feel kind of stressed out by that. Does it happen to you in the same way?","examples":[{"sentence":"I get so stressed out before I have to give a presentation in front of the boss.","pattern":"get + stressed out"},{"sentence":"Don't get too stressed out about the exam; you've studied very hard.","pattern":"stressed out about + noun"},{"sentence":"She looks really stressed out because she has three deadlines today.","pattern":"look + stressed out"},{"sentence":"Moving to a new city can leave you feeling completely stressed out.","pattern":"feeling + stressed out"}],"more_examples":["I've been feeling really stressed out trying to balance my full-time job and my studies.","You look stressed out; why don't you take a break and grab a coffee?"],"synonyms":["overwhelmed","anxious","burnt out","frazzled","tense","worried","under pressure"],"antonyms":["relaxed","calm","at ease","composed","peaceful"],"gap":{"sentence":"I felt completely _____ after trying to manage five different projects at the same time.","answer":"stressed out","options":["stressed out","excited","relaxed","proud"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/295640-296331.webm","at":2956.5,"dur":6.91}},{"term":"academic writing","pos":"noun phrase","definition":"The formal style of writing used in schools, universities, and for research purposes.","time":3024.6,"lesson":"I tried the writing section once, but I didn't understand how to do it. You are doing academic writing.","examples":[{"sentence":"The professor expects us to use academic writing when submitting our final essays.","pattern":""},{"sentence":"You should avoid using slang or informal language in academic writing.","pattern":""},{"sentence":"The university provides a guide on the conventions of academic writing.","pattern":""},{"sentence":"I'm struggling to master the tone required for academic writing.","pattern":""}],"countable":[],"uncountable":[{"meaning":"The formal style of writing used in schools, universities, and for research purposes.","example":"You are doing academic writing.","lesson":true},{"meaning":"The general practice or skill of writing in an academic style","example":"The course focuses on improving your academic writing skills."}],"more_examples":["The scholarship committee looks for clear and concise academic writing.","Most students find it difficult to transition from creative writing to academic writing.","The journal only accepts submissions that adhere to strict academic writing standards."],"synonyms":["scholarly writing","formal writing","research writing","academic prose"],"antonyms":["informal writing","colloquial writing","creative writing"],"gap":{"sentence":"Because the research paper is for a university journal, it must be written in a formal style like _____.","answer":"academic writing","options":["academic writing","creative writing","journalistic writing","poetry"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/302414-302740.webm","at":3024.2,"dur  opinion despite being afraid of offending her boss.","pattern":""}],"countable":[{"meaning":"A sincere, honest, and truthful thought or feeling about something.","example":"Well, first of all, what is your genuine opinion?","lesson":true}],"uncountable":[],"more_examples":["I'm looking for your genuine opinion on which dress I should wear to the wedding.","The interviewer asked for his genuine opinion on the company's current leadership."],"synonyms":["honest opinion","sincere view","true feelings","frank opinion","candid view","honest feedback","unbiased opinion"],"antonyms":["fake opinion","biased view","dishonest feedback","forced opinion"],"gap":{"sentence":"Since the marketing team was being very polite, I struggled to get their _____ on the product's flaws.","answer":"genuine opinion","options":["genuine opinion","public opinion","common opinion","popular opinion"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/327656-327858.webm","at":3276.7,"dur":2.02}},{"term":"not limited to","pos":"expression","definition":"not restricted to only one thing; including other possibilities or examples.","time":3333.6,"lesson":"In the technology industry, I think this development is good. You are not limited to thinking about specific people or specific cases; for example, you could consider the companies that produce those algorithms.","examples":[{"sentence":"The price of the membership is not limited to the monthly fee; there are also annual options.","pattern":"not limited to + noun"},{"sentence":"Our services are not limited to web design, but also include mobile app development.","pattern":"not limited to + [-ing] phrase"},{"sentence":"The competition is not limited to local businesses; international corporations are also involved.","pattern":"not limited to + [subject] + [verb]"},{"sentence":"You are not limited to choosing just one hobby; you can try several different ones.","pattern":"not limited to + [-ing]"}],"more_examples":["The festival's lin tible","faint"],"gap":{"sentence":"The paint on the wall was so _____ that it was immediately clear where the repair had been made.","answer":"noticeable","options":["noticeable","invisible","hidden","subtle"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/343930-344113.webm","at":3439.4,"dur":1.83}},{"term":"in a nutshell","pos":"idiom","definition":"used to describe something in a very short, concise way or summary.","time":3543.0,"lesson":"Do you know what 'in a nutshell' means? When people say 'in a nutshell,' it means they are explaining something in a very short way.","examples":[{"sentence":"In a nutshell, the project failed because we ran out of funding.","pattern":"In a nutshell, [clause]"},{"sentence":"Can you tell me the plot of the movie in a nutshell?","pattern":"tell [something] in a nutshell"},{"sentence":"The CEO's speech was, in a nutshell, a call for more innovation.","pattern":"interrupter: ..., in a nutshell,"},{"sentence":"To put it in a nutshell, we need to work harder if we want to succeed.","pattern":"To put it in a nutshell"}],"more_examples":["The new policy, in a nutshell, is designed to reduce overhead costs.","What's the situation in a nutshell?","In a nutshell, we're looking for a candidate with strong leadership skills."],"synonyms":["in short","to put it briefly","basically","in a word","concisely","simply put","long story short"],"antonyms":["in great detail","at length","elaborately","in-depth"],"gap":{"sentence":"The instructions were so long and complicated that I asked my colleague to explain the process _____.","answer":"in a nutshell","options":["in a nutshell","loudly","honestly","happily"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/354868-355389.webm","at":3548.8,"dur":5.21}},{"term":"base form","pos":"noun phrase","definition":"The simplest form of a verb without any endings like -ed, -ing, or -s.","time":3702.0,"lesson":"After modal verbs like can, must, should, will, and could, we iss anything.","pattern":""}],"more_examples":["The yoga teacher guided the students through the poses step by step.","You need to follow the recipe step by step to ensure the cake rises correctly.","The software will guide you through the installation process step by step."],"synonyms":["gradually","progressively","incrementally","bit by bit","in stages","methodically"],"antonyms":["all at once","simultaneously","instantly","suddenly"],"gap":{"sentence":"The recipe is quite complex, so it is best to follow the instructions _____ to avoid any mistakes.","answer":"step by step","options":["step by step","side by side","back to back","face to face"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/417446-417971.webm","at":4174.7,"dur":5.25}},{"term":"search for","pos":"phrasal verb","definition":"To look through a place or the internet to find something specific.","time":4388.3,"lesson":"The same way we say 'listen to music' and not 'listen music,' we say 'searching for.' For example, 'I was searching for an app.'","examples":[{"sentence":"I spent all morning searching for my lost keys.","pattern":"search for + object"},{"sentence":"Are you still searching for a new job?","pattern":""},{"sentence":"The police are searching for the missing hiker.","pattern":"search for + person"},{"sentence":"I'm searching for a reliable app to track my workouts.","pattern":"searching for + purpose"}],"more_examples":["I'm searching for a flight to Tokyo for next summer.","They are searching for a way to reduce plastic waste.","Can you help me search for the nearest pharmacy?"],"synonyms":["look for","seek","hunt for","track down","scour"],"antonyms":["find","discover","locate"],"gap":{"sentence":"I need to _____ a specific recipe online because the ones I have at home are too complicated.","answer":"search for","options":["search for","ignore","hide","forget"]},"clip":{"src":"lesson_audio/lesson_date_27-09-2026_time_16-17-33/439294-439795.webm","at":4393.1,"dur":5.01}
