p":{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/439530-439758.webm","at":4395.5,"dur":2.28}},{"term":"feasible","pos":"adjective","definition":"Possible to do or achieve; likely to happen in real life.","time":4405.3,"lesson":"The zero and first conditionals are not unrealistic conditions; these conditions are feasible. For these types of situations, the English language uses the usual present tense.","examples":[{"sentence":"With the current budget, it is not feasible to hire three new employees.","pattern":"It is + feasible + to + verb"},{"sentence":"The committee is checking whether the project is economically feasible.","pattern":"economically feasible"},{"sentence":"Is it feasible to finish the construction by the end of the month?","pattern":"Is it feasible...?"},{"sentence":"The plan was technically feasible but practically impossible to organize.","pattern":"technically feasible"}],"more_examples":["We need to find a more feasible way to transport the goods to the rural areas.","The marketing team is looking for a feasible solution to increase user engagement.","It's not feasible to launch the app next week without more testing."],"synonyms":["practicable","achievable","viable","doable","workable","possible","realistic","attainable"],"antonyms":["impossible","unfeasible","impracticable","unachievable","unrealistic","unworkable"],"gap":{"sentence":"The team decided not to launch the product because the timeline was simply not _____ given the current resources.","answer":"feasible","options":["feasible","visible","permanent","expensive"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/441116-441383.webm","at":4411.4,"dur":2.67}},{"term":"prompt","pos":"noun","definition":"A set of instructions or a specific request given to an AI to generate a response.","time":4538.5,"lesson":"I'll give you a prompt. You will need to put it into the GPT chat, and it will give you a test on all these conditions.","examples":[{"sentence":"You can use a simple prompt to ask the AI to summarize this article.","pattern":""},{"sentence":"I spent all morning refining my prompt to get better results from the chatbot.","pattern":"refining a prompt"},{"sentence":"The AI followed the prompt perfectly and generated a three-page report.","pattern":"follow the prompt"},{"sentence":"Try writing a more descriptive prompt if the first answer isn't what you wanted.","pattern":"writing a [adjective] prompt"}],"countable":[{"meaning":"A set of instructions or a specific request given to an AI to generate a response.","example":"I'll give you a prompt.","lesson":true},{"meaning":"A reminder or nudge to take action","example":"The system sends a prompt to the user to complete their profile."},{"meaning":"A cue or signal for an actor to speak","example":"The actor forgot his lines and needed a prompt from the wings."}],"uncountable":[],"more_examples":["I'm struggling to write a prompt that captures the right tone.","The AI needs a very specific prompt to generate accurate code.","If the output is too vague, you might need to adjust your prompt."],"synonyms":["request","cue"],"antonyms":["response","output","answer"],"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/454880-455248.webm","at":4549.0,"dur":3.68}}],"dialogues":[{"title":"Practicing English with ChatGPT","lines":[{"speaker":"A","text":"Good morning! How's it going? You look like you're feeling refreshed today.","highlights":["feeling refreshed"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/003364-003703.webm","at":33.8,"dur":3.39},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/006164-006361.webm","at":61.8,"dur":1.97}]},{"speaker":"B","text":"I did sleep well, but I'm worried I might struggle with my English today because I haven't had time to practice.","highlights":["struggle with"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/006954-008255.webm","at":69.7,"dur":13.01}]},{"speaker":"A","text":"So, in previous days, you were practicing before our classes? What did you usually do?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/012054-012833.webm","at":120.7,"dur":7.79}]},{"speaker":"B","text":"I just talk to ChatGPT using the voice chat feature. I do that to get into the habit of speaking and thinking in English.","highlights":["get into the habit"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/014435-015851.webm","at":144.5,"dur":14.16}]},{"speaker":"A","text":"I see. You use it as a warm-up to get your brain moving before our lesson.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/021130-022704.webm","at":211.5,"dur":15.74}]},{"speaker":"B","text":"Exactly. I usually choose the topics myself, like my day or my weekend plans, to practice how to start a conversation with people.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/025928-027290.webm","at":259.4,"dur":13.62}]},{"speaker":"A","text":"Starting a conversation can be tough. You might think of a boring question and then the whole interaction becomes dull.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/032476-033568.webm","at":324.9,"dur":10.92}]},{"speaker":"B","text":"I've found that starting by talking about myself works well, because then people want to talk about themselves for a long time.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/035330-036643.webm","at":353.5,"dur":13.13}]},{"speaker":"A","text":"That's a very interesting point. Let me think for a second.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/037678-038369.webm","at":377.0,"dur":6.91}]},{"speaker":"B","text":"I need to say this now before I forget! I have one question about the third conditional.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/040296-040807.webm","at":403.1,"dur":5.11},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/041730-042556.webm","at":417.4,"dur":8.26}]}],"time":33.3,"topic":0},{"title":"Practicing English and the term 'social butterfly'","lines":[{"speaker":"A","text":"When I'm doing my homework, I often run into issues with the third conditional. It seems to pop up in most of the exercises.","highlights":["run into issues"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/046038-046593.webm","at":460.6,"dur":5.55},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/046902-047883.webm","at":469.2,"dur":9.81}]},{"speaker":"B","text":"Do you find it useful to practice speaking with AI? For many people, it's not that interesting since AI lacks human emotions and genuine experiences.","highlights":["lacks human emotions"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/050070-051084.webm","at":500.8,"dur":10.14}]},{"speaker":"A","text":"I use it every evening because I need to discuss certain topics. Sometimes I can't find the answers I'm looking for on the internet.","highlights":["looking for"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/053020-053876.webm","at":530.3,"dur":8.56},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/056764-057666.webm","at":567.8,"dur":9.02}]},{"speaker":"B","text":"What do you usually talk about in the evening?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/059491-059924.webm","at":595.1,"dur":4.33}]},{"speaker":"A","text":"I try to describe my day using new vocabulary to fix my mistakes. I choose difficult topics so I can practice using complex words.","highlights":["fix my mistakes"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/060618-061851.webm","at":606.3,"dur":12.33},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/062564-063004.webm","at":625.8,"dur":4.4}]},{"speaker":"B","text":"Which words did you practice yesterday?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/065078-065399.webm","at":650.9,"dur":3.21}]},{"speaker":"A","text":"I really love the term 'social butterfly.' I use it to describe my personality and how I interact with people I've just met.","highlights":["just met"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/065550-067005.webm","at":655.7,"dur":14.55}]},{"speaker":"B","text":"I've never heard that expression before! So, you're like a social butterfly—someone who socializes easily with others.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/074502-074865.webm","at":745.2,"dur":3.63},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/077256-077696.webm","at":772.8,"dur":4.4}]},{"speaker":"A","text":"Exactly. In Russian, we say 'душа компании,' but 'social butterfly' is the best way to put it in English.","highlights":["best way to put it"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/077884-078898.webm","at":778.9,"dur":10.14}]},{"speaker":"B","text":"It sounds like you're an outgoing person. In English, it implies that people specifically enjoy your company.","highlights":["outgoing person"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/078898-079916.webm","at":789.2,"dur":10.18}]}],"time":460.6,"topic":0},{"title":"Idioms for personality and AI technology","lines":[{"speaker":"A","text":"I really like the term 'social butterfly.' In English, it's more about your own personality, whereas the Russian equivalent is more about how others perceive you.","highlights":["social butterfly"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/080780-081752.webm","at":808.0,"dur":9.72}]},{"speaker":"B","text":"That's true. I also find 'black sheep' interesting. It's the opposite of a social butterfly. In Russian, the equivalent is actually 'white crow.'","highlights":["black sheep"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/085950-086794.webm","at":859.7,"dur":8.44},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/090880-091300.webm","at":909.0,"dur":4.2}]},{"speaker":"A","text":"Exactly. 'White crow' isn't common in English, so 'black sheep' is much more accurate. We also have the phrase 'the life of the party.'","highlights":["the life of the party"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/090880-091300.webm","at":909.0,"dur":4.2},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/094226-095137.webm","at":942.5,"dur":9.11}]},{"speaker":"B","text":"What's the difference? I'd say a 'social butterfly' is about socialization, while 'the life of the party' describes someone who is entertaining, like a clown.","highlights":["the life of the party"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/096021-096634.webm","at":960.4,"dur":6.13},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/099618-100874.webm","at":996.4,"dur":12.56}]},{"speaker":"A","text":"Right, but 'clown' can have a negative connotation. I mean a funny person everyone loves. You actually heard 'the life of the party' yesterday with ChatGPT!","highlights":["negative connotation"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/102198-102715.webm","at":1022.1,"dur":5.17},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/104806-105661.webm","at":1048.2,"dur":8.55}]},{"speaker":"B","text":"It is cool! I love learning related words because our brains build fields. It's easier to remember words like 'outgoing' or 'easygoing' when they're grouped together.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/108183-109411.webm","at":1081.9,"dur":12.28}]},{"speaker":"A","text":"I know an AI that speaks much better than ChatGPT. It's called Sesame. They built an AI that feels like a real human being.","highlights":["real human being"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/112990-113707.webm","at":1130.1,"dur":7.17},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/117684-118246.webm","at":1176.9,"dur":5.62}]},{"speaker":"B","text":"You should really try it. It has natural pauses and intonations, so it can actually hold an interesting conversation.","highlights":["hold an interesting conversation"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/119178-119544.webm","at":1192.0,"dur":3.66},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/120342-120629.webm","at":1203.5,"dur":2.87}]},{"speaker":"A","text":"I'll give it a try. But I never thought of you as an extroverted person. Aren't you more of a homebody?","highlights":["extroverted person"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/121140-122234.webm","at":1211.6,"dur":10.94}]},{"speaker":"B","text":"I'm an easygoing person, but I'm not sure how it works. If I have a deal...","highlights":["easygoing person"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/122986-123691.webm","at":1230.0,"dur":7.05}]}],"time":808.0,"topic":1},{"title":"Introversion, Extroversion, and Social Energy","lines":[{"speaker":"A","text":"I have a lot of friends. I'm not sure how to say it, but I have many of them.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/124986-125836.webm","at":1250.1,"dur":8.5}]},{"speaker":"B","text":"You should say 'many friends' instead of a 'good deal.' A deal is for business.","highlights":["good deal"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/125840-126473.webm","at":1258.6,"dur":6.33},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/131300-131658.webm","at":1313.1,"dur":3.58}]},{"speaker":"A","text":"Right. I meant that when a friend asks me to go for a walk, I accept their offer.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/128424-129851.webm","at":1284.4,"dur":14.27}]},{"speaker":"B","text":"Exactly, it's an offer. You sound like Trump when you talk about making a 'very good deal.'","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/131130-132566.webm","at":1311.4,"dur":14.36}]},{"speaker":"A","text":"I'm not shy. People think I'm an extrovert because I enjoy company, but I'm actually an introvert.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/136076-136483.webm","at":1361.0,"dur":4.07},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/137466-138755.webm","at":1374.9,"dur":12.89}]},{"speaker":"B","text":"You need an article, like 'an introvert' or 'an extrovert.' The main difference is where you relax.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/144410-145569.webm","at":1444.2,"dur":11.59}]},{"speaker":"A","text":"Exactly. Introverts aren't always depressed or stuck at home. They can be funny and active in a group.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/148654-149943.webm","at":1486.6,"dur":12.89},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/150098-151331.webm","at":1501.2,"dur":12.33}]},{"speaker":"B","text":"So, you're not relaxed in a group, but you don't mind spending that energy? It doesn't weigh on you?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/156832-158115.webm","at":1568.5,"dur":12.83},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/158410-159134.webm","at":1584.3,"dur":7.24}]},{"speaker":"A","text":"I can spend energy on people, but I need to go home to recharge.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/159522-160660.webm","at":1595.3,"dur":11.38}]},{"speaker":"B","text":"Like if someone gives you an offer to go to the forest? Tell me about that time your friend called you at 9 PM.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/161254-161706.webm","at":1612.7,"dur":4.52},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/162998-164568.webm","at":1630.1,"dur":15.7}]},{"speaker":"A","text":"Yeah, I went to her house at 9 PM. I'm even going first.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/166583-167377.webm","at":1666.0,"dur":7.94}]},{"speaker":"B","text":"Tell me the story of what happened this weekend in the right way.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/167610-168951.webm","at":1676.3,"dur":13.41}]}],"time":1250.1,"topic":2},{"title":"Correcting English mistakes using AI","lines":[{"speaker":"A","text":"I want you to watch closely for mistakes. What happened this weekend? Your friend called you at 9 PM to spend time with her, right?","highlights":["spend time"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/169874-170719.webm","at":1698.9,"dur":8.45},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/172564-174016.webm","at":1725.8,"dur":14.52}]},{"speaker":"B","text":"I was sick over the weekend.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/175786-176208.webm","at":1758.1,"dur":4.22}]},{"speaker":"A","text":"Actually, 'sick' is a state or a condition; you can't use it as a verb. It shows you understand the grammar rules well, even if you slip up when speaking automatically.","highlights":["slip up"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/177370-177816.webm","at":1773.8,"dur":4.46}]},{"speaker":"A","text":"Making mistakes is just the price we pay for being fluent. Either we speak with mistakes or we stay silent and never improve.","highlights":["price we pay"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/184464-185863.webm","at":1844.7,"dur":13.99}]},{"speaker":"B","text":"I've been using ChatGPT to work on my mistakes, especially in the speaking section. How do you actually know where you went wrong during a conversation?","highlights":["went wrong"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/188256-189374.webm","at":1882.7,"dur":11.18}]},{"speaker":"A","text":"My method is even better because it points out the mistake and lets you replay exactly how you said it so you can hear it again.","highlights":["points out"]},{"speaker":"B","text":"Oh my god, I just remembered a terrible story from my English exam. I made a huge mistake while telling a story in the past tense.","highlights":["past tense"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/200048-200921.webm","at":2000.7,"dur":8.73},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/201310-202517.webm","at":2013.3,"dur":12.07}]},{"speaker":"B","text":"I said 'any bad' instead of 'any pets' and then I tried to correct myself.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/206368-207201.webm","at":2063.8,"dur":8.33},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/207448-208849.webm","at":2074.7,"dur":14.01}]}],"time":1698.9,"topic":2},{"title":"Correcting grammar and checking exercises","lines":[{"speaker":"A","text":"I really struggled to say 'any pets' correctly. I kept repeating it, but it just wouldn't come out right.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/209796-210646.webm","at":2098.2,"dur":8.5},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/211652-212199.webm","at":2116.7,"dur":5.47}]},{"speaker":"B","text":"It's like a little glitch in your brain. Sometimes I look at the transcript and I can't believe I actually made those mistakes.","highlights":["glitch in your brain"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/218721-218880.webm","at":2187.4,"dur":1.59},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/219846-220910.webm","at":2198.6,"dur":10.64}]},{"speaker":"A","text":"Regarding the conditionals, I mostly see the third conditional in these exercises, which feels a bit strange to me.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/223779-225248.webm","at":2237.9,"dur":14.69}]},{"speaker":"B","text":"Did you check the answers after you finished the exercise? Every exercise usually comes with an answer key.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/228355-229219.webm","at":2283.7,"dur":8.64}]},{"speaker":"A","text":"I didn't see them. I'm surprised! I didn't realize there were answers provided.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/229776-230483.webm","at":2298.0,"dur":7.07}]},{"speaker":"B","text":"On the website, there's a button to check your answer. It shows you if it's correct and provides the right answer.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/233674-234888.webm","at":2336.8,"dur":12.14}]},{"speaker":"A","text":"Oh, I see. It's a PDF, so I can't scroll properly. I've only seen the third conditional in this specific list.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/242532-243924.webm","at":2425.4,"dur":13.92}]},{"speaker":"B","text":"It's a very good habit to double-check your answers with ChatGPT. Even if there's an answer key, the key might be wrong or incomplete.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/244462-245243.webm","at":2444.7,"dur":7.81},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/246958-247577.webm","at":2469.7,"dur":6.19}]},{"speaker":"A","text":"That makes sense. Let me reload the page. Can you still hear me clearly?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/250500-250701.webm","at":2505.2,"dur":2.01},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/251374-251615.webm","at":2513.9,"dur":2.41}]},{"speaker":"B","text":"Yes, that's better. Let me read one of the exercises for you. It says, 'It's too bad Helen isn't here.'","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/251814-252881.webm","at":2518.2,"dur":10.67},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/253472-254131.webm","at":2534.9,"dur":6.59}]}],"time":2098.2,"topic":2},{"title":"Understanding Conditional Sentences","lines":[{"speaker":"A","text":"Since Helen isn't here, she's not able to tell us what to do. Is this a third conditional situation because she's currently absent?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/254628-256089.webm","at":2546.5,"dur":14.61}]},{"speaker":"B","text":"Actually, the third conditional is only for past situations. If you say, 'If she had been there, she would have known what to do,' you're talking about the past.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/259704-260749.webm","at":2597.1,"dur":10.45}]},{"speaker":"A","text":"Right. So how should we say it? I think it's the first conditional because it's a possible situation; she could be here.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/261198-261897.webm","at":2612.2,"dur":6.99},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/263016-263587.webm","at":2630.4,"dur":5.71}]},{"speaker":"B","text":"Let's look at the rules. The zero and first conditionals are for things that are certain or very likely to happen. The second and third are for things that aren't real.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/269334-270794.webm","at":2693.4,"dur":14.6}]},{"speaker":"B","text":"The second conditional is for unreal things in the present. For example, 'If I had a million dollars, I would be on Tahiti now.'","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/271720-272743.webm","at":2717.3,"dur":10.23}]},{"speaker":"A","text":"So, in the case of Helen, is the situation happening in the present or the past? Since she's not here now, it's the present.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/275014-276507.webm","at":2750.3,"dur":14.93}]},{"speaker":"B","text":"If we use the zero conditional, 'If she's here, she knows,' it's like an obvious fact. But it's a bit strange to use 'if' for facts; 'when' would be more logical.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/281214-282106.webm","at":2812.3,"dur":8.92}]},{"speaker":"B","text":"More natural sentences start with the first conditional. If we say, 'If she is here, she will know what to do,' it covers both the present and the future.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/285398-285961.webm","at":2854.1,"dur":5.63}]},{"speaker":"A","text":"But she's not here at all. It's not a realistic situation. So, if we say, 'If she was here, she would know,' we are imagining something that cannot happen.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/290412-291717.webm","at":2904.2,"dur":13.05}]},{"speaker":"B","text":"Exactly. It's like saying, 'If I were a woman, I would buy cosmetics.' If you use the first conditional there, it sounds like you're planning on getting surgery next month!","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/294050-294864.webm","at":2940.6,"dur":8.14}]}],"time":2546.5,"topic":3},{"title":"Mastering Conditional Sentences","lines":[{"speaker":"A","text":"So, when I become a woman, I will buy cosmetics. That's a future condition, while the second type is about the present and the third is always about the past.","highlights":["about the past"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/294882-295243.webm","at":2949.0,"dur":3.61},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/295530-296919.webm","at":2955.5,"dur":13.89}]},{"speaker":"B","text":"Exactly. Like Barney: he failed the test because he didn't study. But if he had studied for the test, he would have passed it.","highlights":["would have passed"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/297120-297999.webm","at":2971.3,"dur":8.79},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/298310-299833.webm","at":2983.3,"dur":15.23}]},{"speaker":"A","text":"Right. If you use the first type, it sounds like he's preparing for a retake now. But if he was preparing in the past, he would have given up.","highlights":["preparing for a retake"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/303960-304899.webm","at":3039.8,"dur":9.39}]},{"speaker":"B","text":"And what about: 'If I had my camera with me yesterday, I would take a picture of Alex'? Since it's yesterday, we know he didn't have a camera.","highlights":["take a picture"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/306448-307921.webm","at":3064.7,"dur":14.73}]},{"speaker":"A","text":"Let's try using this in real speech. Have you had breakfast today? I'm just making conversation, not using a conditional yet.","highlights":["making conversation"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/310614-310783.webm","at":3106.3,"dur":1.69},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/311304-311822.webm","at":3113.2,"dur":5.18}]},{"speaker":"B","text":"I have. But what would have happened if you hadn't had breakfast? Would you have felt well? I would have been hungry.","highlights":["what would have happened"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/314342-315808.webm","at":3143.6,"dur":14.66},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/317518-318105.webm","at":3175.4,"dur":5.87}]},{"speaker":"A","text":"To say that correctly, you need to use the past perfect: 'If I hadn't had breakfast.' The first 'hadn't' is part of the construction, and the second 'had' is the main verb.","highlights":["part of the construction"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/319756-321269.webm","at":3197.8,"dur":15.13}]},{"speaker":"B","text":"So, 'If I hadn't had breakfast, I would have been hungry.' Since 'would' is a modal verb, the following verb must be in the basic infinitive.","highlights":["basic infinitive"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/331985-333135.webm","at":3320.0,"dur":11.5},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/333414-334801.webm","at":3334.3,"dur":13.87}]},{"speaker":"A","text":"It is tricky! But we've covered modal verbs before. The list is small: should, can, must, will, and might.","highlights":["covered modal verbs"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/336476-337821.webm","at":3365.0,"dur":13.45},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/337986-338740.webm","at":3380.1,"dur":7.54}]},{"speaker":"B","text":"And 'ought' is there, but it's practically not used by anyone anymore, so we won't consider it.","highlights":["practically not used"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/339306-340141.webm","at":3393.3,"dur":8.35}]}],"time":2949.0,"topic":3},{"title":"Understanding Infinitives and Modal Verbs","lines":[{"speaker":"A","text":"I'm trying to understand why we use 'to' before 'drink' in the sentence 'I want to drink.'","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/341136-341605.webm","at":3411.5,"dur":4.69}]},{"speaker":"B","text":"That's a great observation. You can think of 'to' as indicating a direction of movement, like saying 'I'm going to Paris.'","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/343405-344107.webm","at":3434.2,"dur":7.02}]},{"speaker":"A","text":"So, the logic is that I want to move in the direction of drinking?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/344308-344903.webm","at":3443.3,"dur":5.95}]},{"speaker":"B","text":"Exactly, but we also need to look at the category of the infinitive. An infinitive is a verb form that doesn't tell you the time.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/345674-346918.webm","at":3456.8,"dur":12.44}]},{"speaker":"A","text":"In Russian, an infinitive like 'to walk' doesn't provide any information about who is walking or when it's happening.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/347751-348867.webm","at":3477.7,"dur":11.16}]},{"speaker":"B","text":"Right. In English, there isn't a specific ending like in Russian, but conceptually, an infinitive is a verb that doesn't show tense. It's usually defined by 'to.'","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/353148-354609.webm","at":3531.7,"dur":14.61}]},{"speaker":"A","text":"Are there any exceptions to this rule?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/355504-355797.webm","at":3555.1,"dur":2.93}]},{"speaker":"B","text":"Yes, the modal group. Modal verbs don't take an infinitive. For example, if you say 'I don't want to drink,' the 'want' changes, but the modal group remains the same.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/355872-356985.webm","at":3558.9,"dur":11.13}]},{"speaker":"A","text":"So, how would I say 'I wanted to drink' in the past tense?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/362208-362455.webm","at":3622.3,"dur":2.47}]},{"speaker":"B","text":"You would say 'I wanted to drink.' Unlike regular verbs, modal verbs are their own masters. You don't use 'to' before the infinitive with them.","highlights":["their own masters"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/362208-362455.webm","at":3622.3,"dur":2.47},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/371308-372069.webm","at":3713.2,"dur":7.61}]},{"speaker":"A","text":"So, for a question, I would just say, 'Should I drink?'","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/372426-373073.webm","at":3724.5,"dur":6.47}]},{"speaker":"B","text":"That's correct. To summarize, there are three rules: they don't need auxiliary verbs for questions, they don't use 'to' before the infinitive, and many don't have a simple form.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/374114-374437.webm","at":3741.3,"dur":3.23},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/379856-380289.webm","at":3798.8,"dur":4.33}]}],"time":3411.5,"topic":3},{"title":"Mastering Modal Verbs and Perfect Aspects","lines":[{"speaker":"A","text":"It's a common misconception that all verbs have a past tense. While some do, modal verbs like 'can' or 'must' follow different rules.","highlights":["common misconception"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/380340-381001.webm","at":3803.6,"dur":6.61}]},{"speaker":"B","text":"Right, and for those modals, the only way to form the past is by using 'have' after the modal verb.","highlights":["form the past"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/383644-384279.webm","at":3836.6,"dur":6.35}]},{"speaker":"A","text":"Exactly. When you use 'have', the following verb follows the rules of the perfect aspect, meaning it must be in the past participle form.","highlights":["perfect aspect"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/386032-387413.webm","at":3860.4,"dur":13.81}]},{"speaker":"B","text":"So, in 'I should have drunk,' 'drunk' is the third form of the verb because it follows 'have'.","highlights":["third form"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/387508-388305.webm","at":3875.3,"dur":7.97},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/388730-390129.webm","at":3887.5,"dur":13.99}]},{"speaker":"A","text":"And for negatives, the main verb is the first one. For example, 'shouldn't have' follows its own logic where the main verb is pulled behind.","highlights":["follows its own logic"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/397874-399020.webm","at":3978.8,"dur":11.46}]},{"speaker":"B","text":"Let's look at the future. 'Will' is just an ordinary modal verb. How would you say 'I will come'?","highlights":["ordinary modal verb"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/401172-401894.webm","at":4011.9,"dur":7.22}]},{"speaker":"A","text":"To make it past tense, you change 'will' to 'would' and then add 'have' plus the past participle, like 'I would have come.'","highlights":["past participle"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/411860-413043.webm","at":4118.8,"dur":11.83}]},{"speaker":"B","text":"And we only use 'I would have come' when there is a specific condition, like 'I would have come if you called me.'","highlights":["specific condition"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/417206-418247.webm","at":4172.3,"dur":10.41}]},{"speaker":"A","text":"Correct. We can put the condition at the end. Usually, you use the simple past for the condition itself.","highlights":["simple past"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/420569-420759.webm","at":4205.9,"dur":1.9},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/423016-424616.webm","at":4230.3,"dur":16.0}]}],"time":3803.6,"topic":4},{"title":"Understanding Unrealistic Conditionals in English","lines":[{"speaker":"A","text":"So, the simple past is used to describe an unrealistic scenario in the present. For example, saying 'if I were a woman' or 'if I had more money.'","highlights":["unrealistic scenario"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/424656-425481.webm","at":4246.7,"dur":8.25},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/425674-426153.webm","at":4256.9,"dur":4.79}]},{"speaker":"B","text":"Exactly. In the speaker's mind, it's simple: if you use the past tense, you're showing something that isn't true right now.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/430354-431471.webm","at":4303.7,"dur":11.17}]},{"speaker":"A","text":"Right. And if you want to describe an unrealistic scenario in the past, you need to use the past perfect.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/432684-434224.webm","at":4327.0,"dur":15.4}]},{"speaker":"B","text":"It can be hard to grasp, but it's logical. We should start with modal verbs as a fundamental category before tackling these conditions.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/436864-437885.webm","at":4368.8,"dur":10.21}]},{"speaker":"A","text":"True. The zero and first conditionals are feasible, so they use the present. But as soon as we hit unrealistic scenarios, the language uses the past tense.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/440592-440915.webm","at":4406.1,"dur":3.23},{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/441116-442468.webm","at":4411.4,"dur":13.52}]},{"speaker":"B","text":"In Russian, the past tense also shows unrealisticity. However, English uses the perfect aspect to distinguish between different types of conditions.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/443320-444319.webm","at":4433.4,"dur":9.99}]},{"speaker":"A","text":"Exactly. The perfect aspect describes a situation that happened at a specific point. For the third conditional, we use the past perfect.","highlights":["at a specific point"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/450210-452012.webm","at":4502.3,"dur":18.02}]},{"speaker":"B","text":"I'll give you a prompt to put into ChatGPT. It will generate a test for all these conditions so you can deconstruct how they work.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/454810-455248.webm","at":4548.2,"dur":4.38}]},{"speaker":"A","text":"Got it. Are we starting on Friday? No? Okay, then I'll see you next week.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/456955-457647.webm","at":4569.7,"dur":6.92}]},{"speaker":"B","text":"Yep. Make sure to check out CISME and my review of the mistakes.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_14-16-35/457722-458387.webm","at":4577.4,"dur":6.65}]}],"time":4246.7,"topic":5}]};

            const PLACEHOLDERS = new Set(['someone', 'somebody', 'something', 'sb', 'sth', 'one', "one's", "someone's", 'oneself', 'yourself', 'my', 'your', 'his', 'her', 'its', 'our', 'their', 'a', 'an', 'the']);

            'be:am,is,are,was,were,been|have:has,had|do:does,did,done|go:goes,went,gone|take:took,taken|make:made|get:got,gotten|give:gave,given|come:came|see:saw,seen|know:knew,known|think:thought|tell:told|find:found|grow:grew,grown|keep:kept|leave:left|bring:brought|buy:bought|catch:caught|choose:chose,chosen|drive:drove,driven|eat:ate,eaten|fall:fell,fallen|feel:felt|fight:fought|fly:flew,flown|forget:forgot,forgotten|hear:heard|hold:held|lay:laid|lead:led|lose:lost|meet:met|pay:paid|say:said|sell:sold|send:sent|sit:sat|sleep:slept|speak:spoke,spoken|spend:spent|stand:stood|stick:stuck|teach:taught|throw:threw,thrown|understand:understood|wear:wore,worn|win:won|write:wrote,written|wind:wound|light:lit|run:ran|begin:began,begun|break:broke,broken|build:built|mean:meant|ride:rode,ridden|rise:rose,risen'
                .split('|').forEach(entry => {
                    const [base, forms] = entry.split(':');
                    IRREGULAR[base] = base;
                    forms.split(',').forEach(form => { IRREGULAR[form] = base; });
                });

            const icons = {
                play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
                bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg>',
                clipPlay: '<svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19.5 12z" fill="currentColor"/></svg>',
                clipPause: '<svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z" fill="currentColor"/></svg>',
                back3: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 8.6A8 8 0 1 1 4 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4.4 4.2v4.9h4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="12.6" y="16" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor" font-family="system-ui, sans-serif">3</text></svg>',
                forward3: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.8 8.6A8 8 0 1 0 20 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19.6 4.2v4.9h-4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="11.4" y="16" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor" font-family="system-ui, sans-serif">3</text></svg>',
                backArrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
                goBack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>'
            };

            // A section's symbol (drawn once at the top of the page).
            const symbol = section => `<svg class="sym" aria-hidden="true" focusable="false"><use href="#sym-${section}"/></svg>`;

            const lesson = LESSON || {};
            const meta = lesson.meta || {};
            const mistakes = lesson.mistakes || [];
            // Graded lessons: every card has a grade 1-7 (a card without one
            // gets the grade nearest its old level); otherwise the old levels.
            const hasGrade = card => Number.isInteger(card.grade) && card.grade >= 1 && card.grade <= 7;
            const graded = mistakes.some(hasGrade);
            const gradeOf = card => hasGrade(card) ? card.grade : ({ high: 4, medium: 5, low: 6 }[card.severity] || 5);
            const vocabulary = lesson.vocabulary || [];
            const dialogues = lesson.dialogues || [];

            // --------------------------------------------------------- helpers
            function esc(value) {
                return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
            }

            function norm(word) {
                return word.toLowerCase().replace(/’/g, "'").replace(/[^\p{L}\p{N}']/gu, '');
            }

            function stem(word) {
                let w = norm(word).replace(/'s$/, '');
                if (IRREGULAR[w]) return IRREGULAR[w];
                for (const suffix of ['ing', 'ied', 'ies', 'ed', 'es', 's', 'ly']) {
                    if (w.endsWith(suffix) && w.length - suffix.length >= 3) { w = w.slice(0, -suffix.length); break; }
                }
                return w.replace(/e+$/, '');
            }

            function playButton(text, label) {
                return `<button class="play" type="button" data-say="${esc(text)}" aria-label="${esc(label || 'Listen')}" data-no-speech>${icons.play}</button>`;
            }

            // A clip of the lesson recording: a pill with the time it was said,
            // which opens into a small player when tapped.
            function clipHtml(clip, label) {
                if (!clip || !clip.src) return '';
                const at = clock(clip.at);
                return `<span class="clip" data-src="${esc(clip.src)}" data-no-speech>`
                    + `<button class="clip-main" type="button" title="${esc(label)}" aria-label="${esc(label)}, ${at}">${icons.clipPlay}${icons.clipPause}<span>${at}</span></button>`
                    + '<span class="clip-more">'
                    + `<button class="clip-skip" type="button" data-skip="-3" title="Back 3 seconds" aria-label="Back 3 seconds">${icons.back3}</button>`
                    + '<span class="clip-bar" role="slider" tabindex="0" aria-label="Position in the clip" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="clip-fill"></span></span>'
                    + `<button class="clip-skip" type="button" data-skip="3" title="Forward 3 seconds" aria-label="Forward 3 seconds">${icons.forward3}</button>`
                    + '</span></span>';
            }

            // Word diff (longest common subsequence) between what was said and the fix.
            function diff(before, after) {
                const a = before.split(/\s+/).filter(Boolean);
                const b = after.split(/\s+/).filter(Boolean);
                const n = a.length, m = b.length;
                const table = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
                for (let i = n - 1; i >= 0; i--) {
                    for (let j = m - 1; j >= 0; j--) {
                        table[i][j] = norm(a[i]) === norm(b[j]) ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
                    }
                }
                const left = [], right = [];
                let i = 0, j = 0;
                while (i < n || j < m) {
                    if (i < n && j < m && norm(a[i]) === norm(b[j])) {
                        left.push({ word: a[i++], kind: 'same' });
                        right.push({ word: b[j++], kind: 'same' });
                    } else if (j >= m || (i < n && table[i + 1][j] >= table[i][j + 1])) {
                        const word = a[i];
                        const previous = i > 0 ? norm(a[i - 1]) : '';
                        const noise = FILLERS.has(norm(word)) || norm(word) === previous || !norm(word);
                        left.push({ word, kind: noise ? 'same' : 'del' });
                        i++;
                    } else {
                        // Mark where a missing word belongs, unless a deletion already shows the spot.
                        const last = left[left.length - 1];
                        if (!last || (last.kind !== 'del' && last.kind !== 'gap')) left.push({ kind: 'gap' });
                        right.push({ word: b[j++], kind: 'ins' });
                    }
                }
                const render = (tokens, tag) => tokens.map(t => {
                    if (t.kind === 'gap') return '<span class="gap" aria-hidden="true"></span>';
                    return t.kind === 'same' ? esc(t.word) : `<${tag} class="w">${esc(t.word)}</${tag}>`;
                }).join(' ').replace(/<\/(del|ins)> <\1 class="w">/g, ' ');
                return { said: render(left, 'del'), fixed: render(right, 'ins') };
            }

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {
                    if (!hit[index] && functional.has(norm(part))) {
                        const near = [index - 2, index + 2].some(k => hit[k]);
                        if (near) hit[index] = true;
                    }
                });
                return parts.map((part, index) => {
                    if (!hit[index]) return esc(part);
                    // Underline the word itself, not quotes or punctuation stuck to it.
                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                    return `${esc(before)}<b class="hl">${esc(core)}</b>${esc(after)}`;
                }).join('');
            }

            // link(phrase): the vocabulary entry of a highlighted phrase, or -1.
            function highlightPhrases(text, phrases, link) {
                const lower = text.toLowerCase();
                const ranges = [];
                (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length, phrase]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end, phrase]) => {
                    const word = link ? link(phrase) : -1;
                    const opens = word >= 0 ? ` data-vocab="${word}" title="${esc(`See “${vocabulary[word].term}” in Vocabulary`)}"` : '';
                    html += esc(text.slice(cursor, start)) + `<mark class="expr"${opens}>${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {
                    if (value === undefined) return window.localStorage.getItem(key);
                    window.localStorage.setItem(key, value);
                } catch (_error) {
                    return null;
                }
                return null;
            }

            // ---------------------------------------------------------- header
            document.getElementById('title').textContent = meta.title || 'Lesson review';

            // The lesson time in Moscow time (meta.start_utc: when the lesson
            // began, in seconds since 1970). A tap shows it in the reader's own
            // time zone instead, remembered on the phone. Older pages have no
            // start_utc: the date and time as recorded, with no zone.
            const eyebrow = document.getElementById('eyebrow');
            const lessonStart = typeof meta.start_utc === 'number' && isFinite(meta.start_utc) ? new Date(meta.start_utc * 1000) : null;
            let lessonTimes = null;
            let ownZone = storage('lesson-time-zone') === 'own';

            function zoneTime(zone) {
                const date = { day: 'numeric', month: 'long', year: 'numeric' };
                const time = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
                if (zone) { date.timeZone = zone; time.timeZone = zone; }
                return {
                    date: new Intl.DateTimeFormat('en-GB', date).format(lessonStart),
                    time: new Intl.DateTimeFormat('en-GB', time).format(lessonStart)
                };
            }

            function offsetName(minutes) {
                const size = Math.abs(minutes);
                if (!size) return 'GMT';
                return 'GMT' + (minutes < 0 ? '-' : '+') + Math.floor(size / 60) + (size % 60 ? ':' + String(size % 60).padStart(2, '0') : '');
            }

            if (lessonStart) {
                try {
                    const moscow = zoneTime('Europe/Moscow');
                    const own = zoneTime(null);
                    lessonTimes = {
                        moscow: Object.assign(moscow, { zone: 'MSK', name: 'Moscow time' }),
                        own: Object.assign(own, { zone: offsetName(-lessonStart.getTimezoneOffset()), name: 'your time' }),
                        differ: moscow.date !== own.date || moscow.time !== own.time
                    };
                } catch (_error) {
                    lessonTimes = null;  // no time zones in this browser: the time as recorded
                }
            }

            function showLessonTime() {
                let date = meta.date;
                if (!lessonTimes) {
                    eyebrow.textContent = ['English lesson', meta.date, meta.time].filter(Boolean).join(' · ');
                } else {
                    const shown = lessonTimes.differ && ownZone ? lessonTimes.own : lessonTimes.moscow;
                    const other = shown === lessonTimes.own ? lessonTimes.moscow : lessonTimes.own;
                    const time = `${esc(shown.time)} <span class="tz">${esc(shown.zone)}</span>`;
                    date = shown.date;
                    eyebrow.innerHTML = `English lesson · ${esc(shown.date)} · `
                        + (lessonTimes.differ
                            ? `<button class="tz-btn" type="button" title="Show ${esc(other.name)} (${esc(other.zone)})" aria-label="${esc(`${shown.time} ${shown.name}. Show ${other.name}, ${other.zone}`)}">${time}</button>`
                            : `<span class="tz-time">${time}</span>`);
                }
                document.title = (meta.title ? meta.title + ' · ' : '') + 'English lesson' + (date ? ' · ' + date : '');
            }
            showLessonTime();
            eyebrow.addEventListener('click', event => {
                if (!event.target.closest('.tz-btn')) return;
                ownZone = !ownZone;
                storage('lesson-time-zone', ownZone ? 'own' : 'moscow');
                showLessonTime();
                const button = eyebrow.querySelector('.tz-btn');
                if (button && event.detail === 0) button.focus();  // kept for the keyboard
            });

            document.getElementById('count-mistakes').textContent = mistakes.length;
            document.getElementById('count-vocabulary').textContent = vocabulary.length;
            document.getElementById('count-dialogues').textContent = dialogues.length;

            // -------------------------------------------------------- mistakes
            const topics = lesson.topics || [];
            // Each mistake example, word and dialogue line can be found by the timeline.
            const exampleIds = new Map();
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => exampleIds.set(example, `m-${c}-${e}`)));
            let showAllMistakes = () => {};
            let vocabularyToWords = () => {};
            // What "Go back" needs to put a section back as it was.
            let mistakeFilter = () => 'all';
            let setMistakeFilter = () => {};
            let vocabularyView = () => 'words';
            let setVocabularyView = () => {};

            function clock(seconds) {
                if (seconds === null || seconds === undefined) return '';
                const total = Math.max(0, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const rest = String(total % 60).padStart(2, '0');
                return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
            }

            function plain(text) {
                return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
            }

            // One example: when it was said, the full sentence(s) as said and
            // corrected, and (where it adds something) its own explanation.
            function exampleHtml(example, options) {
                const before = example.context || example.quote;
                const after = example.context_fix || example.fix;
                const d = diff(before, after);
                // The clip pill needs no separator: it stays apart from the topic when the line wraps.
                const pill = clipHtml(example.clip, 'Hear what was said');
                // The letters beside the time open the same moment in the other sections.
                const jumps = jumpsHtml('mistakes', example.clip ? example.clip.at : example.time);
                const facts = [];
                if (!pill && example.time !== null && example.time !== undefined) facts.push(`<span class="clock">${clock(example.time)}</span>${jumps}`);
                if (options.showTopic && topics[example.topic]) facts.push(`<span>${esc(topics[example.topic].title)}</span>`);
                let html = `<div class="pair" data-item="${exampleIds.get(example) || ''}"${options.hidden ? ' hidden' : ''}>`;
                const separator = jumps && !pill ? '' : '<span class="sep">·</span>';
                if (pill || facts.length) html += `<div class="ex-meta" data-no-speech>${pill}${pill ? jumps : ''}${facts.join(separator)}</div>`;
                html += `<div class="said"><span class="mark-icon" aria-label="What was said" data-no-speech>✗</span><span class="txt">${d.said}</span></div>`;
                html += `<div class="fixed"><span class="mark-icon" aria-label="Better" data-no-speech>✓</span><span class="txt">${d.fixed}</span>${playButton(after, 'Listen to the correct version')}</div>`;
                if (options.why) html += `<p class="ex-why">${esc(options.why)}</p>`;
                return html + '</div>';
            }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
                    html += items.map(item => `<li><span class="meaning">${esc(item.meaning)}</span><span class="m-ex">${highlightTerm(item.example, entry.term)}`
                        + (item.lesson ? ' <span class="from-lesson" data-no-speech>from the lesson</span>' : '') + '</span></li>').join('');
                    return html + '</ol></div>';
                };
                return '<div class="forms">'
                    + column('Countable', 'a / an, plural', entry.countable || [])
                    + column('Uncountable', 'no a / an, no plural', entry.uncountable || [])
                    + '</div>';
            }

            function relatedHtml(entry) {
                const row = (title, words) => (words || []).length
                    ? `<div class="rel"><p class="part-title" data-no-speech>${title}</p><span class="rel-words">${words.map(w => `<span class="rel-word">${esc(w)}</span>`).join('<span class="sep" data-no-speech> · </span>')}</span></div>`
                    : '';
                return row('Synonyms', entry.synonyms) + row('Antonyms', entry.antonyms);
            }

            // Visible: when it was said, the word, the meaning, the lesson's own
            // words and at least three examples. The rest opens on request.
            function wordCardHtml(entry, index) {
                const term = entry.term || '';
                let html = `<article class="card word" id="word-${index}"><div class="w-head">`;
                if (entry.clip) html += clipHtml(entry.clip, 'Hear it in the lesson');
                else if (entry.time !== null && entry.time !== undefined) html += `<span class="clock" data-no-speech>${clock(entry.time)}</span>`;
                html += jumpsHtml('vocabulary', entry.clip ? entry.clip.at : entry.time);
                // The word, its kind and its speaker stay together (a new row when
                // they do not fit); the kind and the speaker never part.
                html += `<div class="w-title"><h3 class="w-term">${esc(term)}</h3><span class="w-side">`;
                if (entry.pos) html += `<span class="w-pos" data-no-speech>${esc(entry.pos)}</span>`;
                html += playButton(term, 'Listen to ' + term) + '</span></div></div>';
                if (entry.definition) html += `<p class="def">${esc(entry.definition)}</p>`;
                const passage = entry.lesson || entry.lesson_example;
                if (passage) {
                    html += `<div class="lesson-ex"><div class="txt"><span class="src" data-no-speech>From the lesson</span>${highlightTerm(passage, term)}</div>${playButton(passage, 'Listen')}</div>`;
                }
                const examples = exampleItems(entry);
                if (examples.length) {
                    html += '<ul class="examples">' + examples.map(example => '<li>'
                        + (example.pattern ? `<span class="pat" data-no-speech>${esc(example.pattern)}</span> ` : '')
                        + highlightTerm(example.sentence, term) + '</li>').join('') + '</ul>';
                }
                if (entry.note) html += `<p class="note">${icons.bulb}<span>${esc(entry.note)}</span></p>`;

                const parts = [];
                if ((entry.countable || []).length || (entry.uncountable || []).length) parts.push(['forms', 'Countable / uncountable', formsHtml(entry)]);
                if ((entry.more_examples || []).length) {
                    parts.push(['more', 'More examples', '<p class="part-title" data-no-speech>More examples</p><ul class="examples">'
                        + entry.more_examples.map(s => `<li>${highlightTerm(s, term)}</li>`).join('') + '</ul>']);
                }
                const related = relatedHtml(entry);
                if (related) parts.push(['related', 'Synonyms & antonyms', related]);
                if (parts.length) {
                    html += '<div class="more-bar" data-no-speech>'
                        + parts.map(([id, name]) => `<button class="more-btn" type="button" data-part="${id}" aria-expanded="false">${name}</button>`).join('')
                        + '<button class="more-btn more-hide" type="button">Hide</button></div>';
                    html += parts.map(([id, , body]) => `<div class="more-part" data-part="${id}" hidden>${body}</div>`).join('');
                }
                return html + '</article>';
            }

            // Matching pairs: all the words, shuffled into rounds of about six;
            // the meanings are shuffled separately.
            function renderMatch(game) {
                const pool = shuffled(matchable);
                const roundCount = Math.ceil(pool.length / 6);
                const rounds = [];
                for (let r = 0, cursor = 0; r < roundCount; r++) {
                    const size = Math.floor(pool.length / roundCount) + (r < pool.length % roundCount ? 1 : 0);
                    rounds.push(pool.slice(cursor, cursor + size));
                    cursor += size;
                }
                let round = 0, misses = 0, picked = null;
                const missText = () => misses === 1 ? '1 mistake' : `${misses} mistakes`;

                function draw() {
                    const ids = rounds[round];
                    let html = `<div class="game-head" data-no-speech><span>Round ${round + 1} of ${rounds.length}</span><span class="game-score">${missText()}</span></div>`;
                    html += '<p class="game-hint" data-no-speech>Tap a word, then its meaning.</p>';
                    html += '<div class="match-board" data-no-speech><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile term" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].term)}</button>`).join('');
                    html += '</div><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile meaning" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].definition)}</button>`).join('');
                    html += '</div></div><div class="game-foot" data-no-speech></div>';
                    game.innerHTML = html;
                    picked = null;
                }

                function roundDone() {
                    const foot = game.querySelector('.game-foot');
                    if (round + 1 < rounds.length) {
                        foot.innerHTML = `<p>Round complete!</p><button class="game-btn" type="button" data-action="next-round">Next round</button>`;
                    } else {
                        foot.innerHTML = `<div class="summary"><p class="big">All ${pool.length} words matched</p><p>${missText()}</p>`
                            + '<button class="game-btn" type="button" data-action="restart">Play again</button></div>';
                    }
                    foot.querySelector('button').focus({ preventScroll: true });
                }

                game.addEventListener('click', event => {
                    const tile = event.target.closest('.tile');
                    if (tile && !tile.disabled) {
                        const side = tile.classList.contains('term') ? 'term' : 'meaning';
                        if (picked === tile) {
                            tile.setAttribute('aria-pressed', 'false');
                            picked = null;
                        } else if (!picked || picked.classList.contains(side)) {
                            if (picked) picked.setAttribute('aria-pressed', 'false');
                            picked = tile;
                            tile.setAttribute('aria-pressed', 'true');
                        } else {
                            const other = picked;
                            picked = null;
                            other.setAttribute('aria-pressed', 'false');
                            if (other.dataset.id === tile.dataset.id) {
                                [other, tile].forEach(t => { t.classList.add('done'); t.disabled = true; });
                                speak(vocabulary[Number(tile.dataset.id)].term);
                                if (!game.querySelector('.tile:not(.done)')) roundDone();
                            } else {
                                misses++;
                                game.querySelector('.game-score').textContent = missText();
                                [other, tile].forEach(t => {
                                    t.classList.remove('wrong');
                                    void t.offsetWidth; // restart the shake
                                    t.classList.add('wrong');
                                    setTimeout(() => t.classList.remove('wrong'), 450);
                                });
                            }
                        }
                        return;
                    }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next-round') { round++; draw(); }
                    if (action.dataset.action === 'restart') renderMatch(freshGame());
                });
                draw();
            }

            // Fill the gap: a new sentence, the word hidden, four options.
            function renderGap(game) {
                const order = shuffled(gapItems);
                let position = 0, score = 0;
                const missed = [];

                function draw() {
                    const { entry } = order[position];
                    const [before, after] = entry.gap.sentence.split(/_{3,}/);
                    let html = `<div class="game-head" data-no-speech><span>${position + 1} of ${order.length}</span><span class="game-score">${score} correct</span></div>`;
                    html += `<div class="card"><p class="gap-sentence">${esc(before)}<span class="blank" data-no-speech>&nbsp;</span>${esc(after || '')}</p>`;
                    html += '<div class="options" data-no-speech>'
