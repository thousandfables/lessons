<html lang="en">

<head>

    <title>Lesson Parts</title>
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h2 {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            color: #444;
            background: linear-gradient(145deg, #eaeaea, #ffffff);
            padding: 12px 20px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.15),
                -6px -6px 12px rgba(255, 255, 255, 0.8),
                inset 2px 2px 4px rgba(0, 0, 0, 0.05),
                inset -2px -2px 4px rgba(255, 255, 255, 0.4);
            text-transform: capitalize;
            letter-spacing: 0.5px;
        }

        h3 {
            font-size: 50px;
            font-weight: bold;
        }



        #left {
            width: 100%;
            padding: 20px;
            border-right: 2px solid #ccc;
        }

        #right {
            display: none background-color: #f4f4f4;
        }

        .part-buttons,
        .content-buttons {
            margin-bottom: 10px;
        }

        .part-buttons button,
        .content-buttons button {
            margin-right: 5px;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .part-buttons button.active {
            background-color: #007bff;
            color: white;
        }

        .content-buttons button.loading {
            animation: flash 0.5s infinite alternate;
        }

        .content-buttons button.active {
            background-color: #007bff;
            color: white;
        }

        @keyframes flash {
            0% {
                background-color: #ffd700;
            }

            100% {
                background-color: #ffa500;
            }
        }

        .hidden {
            display: none;
        }

        .section-content {
            margin-top: 1px;
            padding: 30px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }

        /* Vocabulary Entry */
        .entry-box {
            font-weight: bold;
            font-size: 1.4em;
            display: inline-block;
            border-bottom: 2px solid #2980b9;
            padding-bottom: 2px;
            margin-top: 25px;
            margin-bottom: 5px;
        }

        /* Definition Box */
        .definition-box {
            background-color: #f4f4f4;
            padding: 8px 12px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            margin: 5px 0;
            max-width: 400px;
            text-align: left;
        }

        /* Word Styling */
        .word {
            font-weight: bold;
            color: #000000;
            font-size: 1.2em;
        }

        .example {
            margin-left: 20px;
            font-style: italic;
        }

        /* Fact Box */
        .fact-box {
            background-color: rgba(142, 68, 173, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            box-shadow: 2px 2px 5px rgba(142, 68, 173, 0.15);
            max-width: 500px;
        }

        .section-title {
            font-size: 1.8em;
            font-weight: bold;
            padding: 8px 12px;
            display: inline-block;
            border-left: 6px solid rgba(0, 0, 0, 0.2);
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.2);
            margin-top: 30px;
            margin-bottom: 10px;
            color: white;
        }

        /* Section Colors */
        .purple-section {
            background-color: #8e44ad;
            border-left-color: #6a1b9a;
            box-shadow: 3px 3px 8px rgba(142, 68, 173, 0.3);
        }

        .joke-box {
            background-color: rgba(52, 152, 219, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            box-shadow: 2px 2px 5px rgba(52, 152, 219, 0.15);
            max-width: 500px;
        }


        /* Text Formatting */
        .fact {
            color: black;
        }

        /* Joke Text */
        .joke {
            color: #6d1b9a;
            /* Deeper purple for better readability */
            font-size: 1.1em;
            line-height: 1.4;
        }

        /* Joke Question Styling */
        .joke-question {
            font-weight: bold;
            font-size: 1.2em;
            font-style: italic;
            color: #2c3e50;
            /* Dark gray-blue for a classy contrast */
            margin-bottom: 5px;
        }

        /* Enhanced Typography */
        .bold {
            font-weight: 600;
            color: #000000;
            /* Darker shade for better contrast */
        }

        .italic {
            font-style: italic;
            color: #000000;
            /* Slightly darker gray for better readability */
        }

        .bold-italic {
            font-weight: 600;
            font-style: italic;
            color: #222;
            /* More emphasis on bold-italic text */
        }

        /* Joke Box - Adds a soft neumorphic effect */
        .joke-box {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1),
                -5px -5px 10px rgba(255, 255, 255, 0.5);
            max-width: 550px;
            transition: all 0.3s ease-in-out;
        }

        /* Joke Box Hover Effect */
        .joke-box:hover {
            transform: translateY(-3px);
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.15),
                -6px -6px 12px rgba(255, 255, 255, 0.6);
        }

        /* Dialogue Container - Left Centered */
        /* Dialogue Container - Auto Width Based on Content */
        .dialogue-container {
            display: inline-block;
            /* Shrinks width to fit content */
            max-width: 800px;
            /* Prevents it from becoming too wide */
            margin: 20px 0;
            /* Aligns it to the left with some spacing */
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }



        /* Individual Dialogue Lines */
        .line {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.1);
            font-size: 1.1em;
            line-height: 1.4;
        }

        /* Styling for Different Speakers */
        .person-1 {
            background: linear-gradient(145deg, #dde5ed, #c9d6e2);
            text-align: left;
            color: #2c3e50;
        }

        .person-2 {
            background: linear-gradient(145deg, #d1e8ff, #b9dfff);
            text-align: left;
            color: #1d3557;
        }

        /* Speaker Name Styling */
        .speaker {
            font-weight: bold;
            margin-bottom: 5px;

            font-size: 1.1em;
            color: #000;

/* Static, phone-first voice controls. Injected into each generated lesson. */
:root {
    color-scheme: light;
    --sv-blue: #155eef;
    --sv-blue-dark: #0b46b8;
    --sv-ink: #172033;
    --sv-muted: #5d687a;
    --sv-border: #dce2ea;
    --sv-danger: #c9372c;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: #eef2f7;
    -webkit-text-size-adjust: 100%;
}

body {
    display: block;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    height: auto;
    margin: 0;
    overflow-x: hidden;
    color: var(--sv-ink);
    background: linear-gradient(180deg, #eef3fa 0, #f8fafc 260px, #f8fafc 100%);
    line-height: 1.55;
}

body.static-voice-tray-visible {
    padding-bottom: 245px;
}

#left {
    width: min(100%, 1120px);
    min-height: 100vh;
    margin: 0 auto;
    padding: 20px clamp(14px, 3vw, 32px) 48px;
    border-right: 0;
}

#right {
    display: none;
}

h2,
h3,
p {
    overflow-wrap: anywhere;
}

h3 {
    font-size: clamp(2rem, 7vw, 3.125rem);
    line-height: 1.1;
}

button,
select {
    min-height: 44px;
    font: inherit;
}

.part-buttons,
.content-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
}

.part-buttons button,
.content-buttons button {
    min-width: 92px;
    margin: 0;
    padding: 10px 16px;
    border: 1px solid #bcc7d6;
    border-radius: 10px;
    background: #fff;
    color: #1f2937;
    font-weight: 700;
    touch-action: manipulation;
}

.part-buttons button.active,
.content-buttons button.active {
    border-color: var(--sv-blue);
    background: var(--sv-blue);
    color: #fff;
}

.section-content {
    margin-top: 12px;
    padding: clamp(18px, 4vw, 30px);
    border: 1px solid var(--sv-border);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 12px 30px rgba(30, 51, 84, 0.08);
    user-select: text;
    -webkit-user-select: text;
}

.definition-box,
.fact-box,
.joke-box,
.dialogue-container {
    max-width: 100%;
}

::selection {
    background: #b9d2ff;
    color: #0d2146;
}

[data-no-speech] {
    user-select: none;
    -webkit-user-select: none;
}

.static-voice-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 12px;
    padding: 12px 14px;
    border: 1px solid rgba(21, 94, 239, 0.18);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 8px 24px rgba(30, 51, 84, 0.08);
}

.static-voice-title {
    display: block;
    color: var(--sv-ink);
    font-size: 1rem;
}

.static-voice-ready {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 2px;
    color: var(--sv-muted);
    font-size: 0.84rem;
}

.static-voice-ready::before {
    width: 9px;
    height: 9px;
    content: "";
    border-radius: 50%;
    background: #18794e;
    box-shadow: 0 0 0 4px rgba(24, 121, 78, 0.14);
}

.static-voice-hint {
    margin: 0 0 18px;
    padding: 10px 14px;
    border-left: 4px solid var(--sv-blue);
    border-radius: 8px;
    background: #eaf1ff;
    color: #24416f;
    font-size: 0.94rem;
}

.static-voice-tray {
    position: fixed;
    z-index: 1000;
    left: 50%;
    bottom: 14px;
    width: min(720px, calc(100% - 24px));
    padding: 14px;
    transform: translateX(-50%);
    border: 1px solid rgba(17, 36, 68, 0.14);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.98);
    box-shadow: 0 18px 50px rgba(20, 35, 60, 0.24);
    backdrop-filter: blur(14px);
}

.static-voice-tray[hidden] {
    display: none;
}

.static-voice-tray-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
}

.static-voice-selection-label {
    margin-bottom: 2px;
    color: var(--sv-blue-dark);
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}

.static-voice-selection-preview {
    display: -webkit-box;
    margin: 0;
    overflow: hidden;
    color: #28354a;
    font-size: 0.94rem;
    line-height: 1.35;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
}

.static-voice-close,
.static-voice-replay,
.static-voice-stop {
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
}

.static-voice-close {
    width: 44px;
    flex: 0 0 44px;
    padding: 0;
    border: 1px solid #d4dbe5;
    background: #f7f9fc;
    color: #334056;
    font-size: 1.15rem;
}

.static-voice-control-grid {
    display: grid;
    grid-template-columns: minmax(150px, 1.25fr) minmax(100px, 0.75fr) 1fr auto;
    gap: 9px;
    align-items: end;
}

.static-voice-field {
    display: grid;
    gap: 4px;
    min-width: 0;
    color: var(--sv-muted);
    font-size: 0.77rem;
    font-weight: 700;
}

.static-voice-field select {
    width: 100%;
    padding: 8px 30px 8px 10px;
    border: 1px solid #bdc8d7;
    border-radius: 10px;
    background: #fff;
    color: #202b3c;
}

.static-voice-field select:disabled {
    color: #202b3c;
    opacity: 1;
}

.static-voice-replay {
    min-width: 126px;
    padding: 9px 16px;
    border: 1px solid var(--sv-blue);
    background: var(--sv-blue);
    color: #fff;
}

.static-voice-stop {
    width: 48px;
    padding: 9px 0;
    border: 1px solid #e1a29d;
    background: #fff3f2;
    color: #a52920;
}

.static-voice-replay:disabled,
.static-voice-stop:disabled {
    cursor: not-allowed;
    opacity: 0.52;
}

.static-voice-progress {
    min-height: 20px;
    margin-top: 8px;
    color: var(--sv-muted);
    font-size: 0.82rem;
}

.static-voice-progress.error {
    color: var(--sv-danger);
    font-weight: 700;
}

@media (max-width: 700px) {
    body.static-voice-tray-visible {
        padding-bottom: 325px;
    }

    #left {
        padding: 12px 12px 40px;
    }

    h2 {
        width: 100%;
        margin: 8px 0 14px;
        font-size: 1.45rem;
    }

    .static-voice-banner {
        position: sticky;
        z-index: 20;
        top: 0;
        margin: -12px -12px 12px;
        padding: max(10px, env(safe-area-inset-top)) 12px 10px;
        border-width: 0 0 1px;
        border-radius: 0;
    }

    .part-buttons,
    .content-buttons {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .part-buttons button,
    .content-buttons button {
        min-width: 0;
        padding-inline: 6px;
        font-size: 0.9rem;
    }

    .section-content {
        padding: 16px;
        border-radius: 13px;
    }

    .dialogue-container {
        display: block;
        margin: 12px 0;
        padding: 10px;
    }

    .line {
        padding: 10px 11px;
        font-size: 1rem;
    }

    .static-voice-tray {
        bottom: 0;
        width: 100%;
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
        border-width: 1px 0 0;
        border-radius: 18px 18px 0 0;
    }

    .static-voice-control-grid {
        grid-template-columns: minmax(0, 1fr) minmax(0, 0.72fr);
    }

    .static-voice-replay,
    .static-voice-stop {
        width: 100%;
        min-width: 0;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}

    </style>
</head>

<body>

        // References to sections
        const partsSection = document.getElementById('partsSection');
        const contentSection = document.getElementById('contentSection');
        const displaySection = document.getElementById('displaySection');

        let activePart = null; // Track the active part

        // Function to create Part buttons
        function createPartButtons() {
            for (let i = 1; i <= parts_number; i++) {
                let button = document.createElement("button");
                button.textContent = "Part " + i;
                button.onclick = () => showContentButtons(i, button);
                partsSection.appendChild(button);
            }
        }

        // Function to show Mistakes, Vocabulary, and Dialogue buttons
        function showContentButtons(part, button) {
            // Reset previous part selection
            document.querySelectorAll(".part-buttons button").forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");

            // Clear previous content buttons and displayed content
            contentSection.innerHTML = "";
            contentSection.classList.remove("hidden");
            displaySection.innerHTML = "";

            activePart = part; // Update active part

            let sections = ["Mistakes", "Vocabulary", "Dialogue"];
            sections.forEach(section => {
                let secButton = document.createElement("button");
                secButton.textContent = section;
                secButton.onclick = () => {
                    secButton.classList.add("loading"); // Add flashing effect
                    displayContent(section, part, secButton);
                };
                contentSection.appendChild(secButton);
            });
        }

        // Function to display selected content
        function displayContent(type, part, button) {
            let dataKey = type.toLowerCase(); // "mistakes", "vocabulary", "dialogue"
            let partKey = dataKey + "_" + part; // e.g., "mistakes_1"

            if (json_content[dataKey] && json_content[dataKey][partKey]) {
                let contentData = json_content[dataKey][partKey];

                if (dataKey === "mistakes") {
                    appendContent(displayMistakes(contentData), part, type, button);
                } else if (dataKey === "vocabulary") {
                    appendContent(displayVocabulary(contentData), part, type, button);
                } else if (dataKey === "dialogue") {
                    appendContent(displayDialogue(contentData), part, type, button);
                }
            }
        }

        // Append content while keeping existing sections
        function appendContent(html, part, type, button) {
            let sectionID = `part${part}-${type}`;
            let existingSection = document.getElementById(sectionID);

            if (!existingSection) {
                let newSection = document.createElement("div");
                newSection.id = sectionID;
                newSection.classList.add("section-content");
                newSection.innerHTML = html;
                displaySection.appendChild(newSection);

                // Remove animation, keep the button highlighted
                button.classList.remove("loading");
                button.classList.add("active");
            }
        }

        // Function to display Mistakes content
        function displayMistakes(data) {
            let html = "<h3>Mistakes</h3>";
            data.mistakes_list.forEach(mistake => {
                html += `<p><b>Original:</b> ${mistake.original}</p>`;
                html += `<p><b>Corrected:</b> <b> ${mistake.corrected}</b></p>`;
                html += `<p><b>Explanation:</b> ${mistake.explanation}</p>`;
                html += `<p><b>Context:</b> <i> ${mistake.context}</i></p>`;
                html += `<hr><br>`; /* Adds an extra blank line */
            });
            return html;
        }





        // Function to display Vocabulary content
        function displayVocabulary(data) {
            let html = "<h3>Vocabulary</h3>";

            // Helper function: Preserve case in context replacement
            function formatContextSentence(sentence, word) {
                const regex = new RegExp(`\\b${word}\\b`, "gi"); // Case-insensitive exact word match
                return sentence.replace(regex, (match) => {
                    return `<span class="bold-italic">${match}</span>`; // Keeps match's case
                });
            }

            // Vocabulary Section
            data.vocabulary_list.forEach((entry, index) => {
                // Word Entry
                html += `<p class="entry-box"> <span class="word">${index + 1}. ${entry.word}</span></p>`;

                // Definition Box
                html += `<div class="definition-box"><span class="bold">Definition:</span> ${entry.definition}</div>`;

                // Context Sentences
                html += "<p>";
                Object.values(entry.context).forEach((sentence, i) => {
                    const formattedSentence = formatContextSentence(sentence, entry.word);
                    html += `<br><span class="bold">Context ${i + 1}:</span> <span class="italic">${formattedSentence}</span>`;
                });
                html += "</p>";
            });

            // Funny Facts Section
            if (data.funny_facts.length > 0) {
                html += `<div class="section-title purple-section">Funny Facts</div>`;
                data.funny_facts.forEach((fact, index) => {
                    html += `<div class="fact-box">
                <p class="fact"><span class="bold">${index + 1}. ${fact.word}:</span> ${fact.fact}</p>
             </div>`;
                });
            }

            // Jokes Section
            if (data.jokes.length > 0) {
                html += `<div class="section-title purple-section">Jokes</div>`;
                data.jokes.forEach((joke, index) => {
                    html += `<div class="joke-box">
                <p class="joke-question">${index + 1}. ${joke.question}</p>
                <p class="italic joke">${joke.answer}</p>
             </div>`;
                });
            }

            return html; // Returning the generated HTML instead of inserting it directly
        }

        function displayDialogue(data) {
            let html = `<div class="dialogue-container">`;
            html += "<h3>Dialogue</h3>";

            data.dialogue_list.forEach(entry => {
                const speaker = Object.keys(entry)[0];
                const line = entry[speaker];

                html += `<div class="line ${speaker === "Person 1" ? 'person-1' : 'person-2'}">
                    <span class="speaker">${speaker}:</span> ${line}
                 </div>`;
            });

            html += `</div>`;
            return html;
        }





        // Initialize part buttons
        createPartButtons();
    </script>

(() => {
    'use strict';

    const manifest = window.STATIC_VOICE_MANIFEST || {};
    const tray = document.getElementById('staticVoiceTray');
    const closeButton = document.getElementById('staticVoiceClose');
    const selectionLabel = document.getElementById('staticVoiceSelectionLabel');
    const selectionPreview = document.getElementById('staticVoiceSelectionPreview');
    const speedChoice = document.getElementById('staticVoiceSpeed');
    const replayButton = document.getElementById('staticVoiceReplay');
    const stopButton = document.getElementById('staticVoiceStop');
    const progress = document.getElementById('staticVoiceProgress');

    if (!tray || !replayButton || !stopButton || !speedChoice) return;

    const state = {
        selectedText: '',
        lastCapturedSelection: '',
        audioContext: null,
        currentSource: null,
        bufferCache: new Map(),
        session: 0,
        speaking: false,
        selectionTimer: null,
        pointerActive: false,
        pauseTimer: null,
        pauseResolve: null
    };

    function normalizeKey(value) {
        return value
            .normalize('NFKC')
            .replace(/’/g, "'")
            .toLocaleLowerCase('en-US');
    }

    function normalizeSelectedText(value) {
        return value
            .replace(/\u00a0/g, ' ')
            .replace(/\r/g, '')
            .split(/\n+/)
            .map(line => line.replace(/[ \t]+/g, ' ').trim())
            .filter(Boolean)
            .join('\n')
            .trim();
    }

    function nodeInsideControls(node) {
        if (!node) return false;
        const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
        return Boolean(element && element.closest('[data-no-speech]'));
    }

    function tokenize(text) {
        const expression = /[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu;
        const matches = Array.from(text.matchAll(expression));

        return matches.map((match, index) => {
            const end = match.index + match[0].length;
            const nextStart = index + 1 < matches.length ? matches[index + 1].index : text.length;
            return {
                key: normalizeKey(match[0]),
                display: match[0],
                after: text.slice(end, nextStart)
            };
        });
    }

    function showTray(text) {
        const words = tokenize(text);
        const preview = text.length > 180 ? `${text.slice(0, 177)}…` : text;
        selectionLabel.textContent = `${words.length} ${words.length === 1 ? 'word' : 'words'} selected`;
        selectionPreview.textContent = preview;
        tray.hidden = false;
        document.body.classList.add('static-voice-tray-visible');
    }

    function setProgress(message, isError = false) {
        progress.textContent = message;
        progress.classList.toggle('error', isError);
    }

    function setPlaybackControls(speaking) {
        state.speaking = speaking;
        replayButton.disabled = speaking;
        stopButton.disabled = !speaking;
        replayButton.textContent = speaking ? 'Playing…' : 'Replay selection';
    }

    function getAudioContext() {
        if (!state.audioContext) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) throw new Error('This browser cannot play lesson audio.');
            state.audioContext = new AudioContextClass();
        }
        return state.audioContext;
    }

    function resolvePendingPause() {
        if (state.pauseTimer) window.clearTimeout(state.pauseTimer);
        state.pauseTimer = null;
        if (state.pauseResolve) state.pauseResolve();
        state.pauseResolve = null;
    }

    function cancelPlayback(announce = true) {
        state.session += 1;
        resolvePendingPause();
        if (state.currentSource) {
            try {
                state.currentSource.stop();
            } catch (_error) {
                // The word may have ended between the check and stop call.
            }
            state.currentSource = null;
        }
        setPlaybackControls(false);
        if (announce) setProgress('Playback stopped.');
    }

    async function loadBuffer(path) {
        if (state.bufferCache.has(path)) return state.bufferCache.get(path);

        const promise = (async () => {
            const response = await fetch(path, { cache: 'force-cache' });
            if (!response.ok) throw new Error(`An audio word could not be loaded (${response.status}).`);
            const data = await response.arrayBuffer();
            return getAudioContext().decodeAudioData(data.slice(0));
        })();

        state.bufferCache.set(path, promise);
        try {
            return await promise;
        } catch (error) {
            state.bufferCache.delete(path);
            throw error;
        }
    }

        return new Promise((resolve, reject) => {
            if (session !== state.session) {
                resolve();
                return;
            }

            const source = getAudioContext().createBufferSource();
            source.buffer = buffer;
            source.playbackRate.value = speed;
            source.connect(state.audioContext.destination);
            state.currentSource = source;
            source.onended = () => {
                if (state.currentSource === source) state.currentSource = null;
                resolve();
            };

            try {
                source.start(0);
            } catch (error) {
                reject(error);
            }
        });
    }

    function punctuationPause(text) {
        if (/[.!?]/.test(text)) return 230;
        if (/[;:]/.test(text)) return 145;
        if (/,/.test(text)) return 105;
        if (/\n/.test(text)) return 170;
        return 28;

            if (session !== state.session || milliseconds <= 0) {

                return;
            }

            state.pauseTimer = window.setTimeout(() => {
                state.pauseTimer = null;
                state.pauseResolve = null;
                resolve();
            }, milliseconds);
        });
    }

        if (!state.selectedText) {
            setProgress('Select some lesson text first.', true);
            return;
        }

        try {
            const audioContext = getAudioContext();
            const resumePromise = audioContext.resume();
            cancelPlayback(false);
            const session = state.session;
            const speed = Number(speedChoice.value) || 1;
            const tokens = tokenize(state.selectedText);

            const missingCount = tokens.length - playable.length;

                setProgress('No pre-rendered audio was found for this selection.', true);
                return;
            }

            setPlaybackControls(true);
            await resumePromise;
            setProgress(`Loading 1 of ${playable.length}…`);

                    if (item) loadBuffer(manifest[item.key]).catch(() => {});
                }

            for (let index = 0; index < playable.length; index += 1) {

                const buffer = await loadBuffer(manifest[token.key]);
                if (session !== state.session) return;
                setProgress(`Playing ${index + 1} of ${playable.length}…`);
                await playBuffer(buffer, session, speed);
                await waitForPause(punctuationPause(token.after) / speed, session);
            }

            if (session === state.session) {
                setPlaybackControls(false);
                const suffix = missingCount ? ` ${missingCount} unavailable ${missingCount === 1 ? 'word was' : 'words were'} skipped.` : '';
                setProgress(`Finished.${suffix} Tap Replay selection to hear it again.`);
            }
        } catch (error) {
            setPlaybackControls(false);
            setProgress(error.message || 'Lesson audio could not be played.', true);
        }
    }

    function captureSelection(autoPlay = true) {
        window.clearTimeout(state.selectionTimer);
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
            state.lastCapturedSelection = '';
            return false;
        }

        state.lastCapturedSelection = text;
        showTray(text);

            setProgress('Starting automatically…');
            speakSelectedText();
        }
        return true;
    }

        const selection = window.getSelection();
        if (!selection || selection.isCollapsed) return;
        try {
            getAudioContext().resume();
        } catch (_error) {
            // Playback reports a useful browser error if needed.
        }
    }

    function hideTray() {
        cancelPlayback(false);
        state.lastCapturedSelection = '';
        tray.hidden = true;
        document.body.classList.remove('static-voice-tray-visible');
        window.getSelection()?.removeAllRanges();
    }

        window.clearTimeout(state.selectionTimer);
        if (state.pointerActive) return;
        state.selectionTimer = window.setTimeout(() => captureSelection(true), 350);
    });
    document.addEventListener('pointerdown', event => {
        if (nodeInsideControls(event.target)) return;
        state.pointerActive = true;
        window.clearTimeout(state.selectionTimer);
    });
    document.addEventListener('pointerup', event => {
        state.pointerActive = false;
        if (nodeInsideControls(event.target)) return;
        primeAudio();
        window.setTimeout(() => captureSelection(true), 40);
    });
    document.addEventListener('pointercancel', () => {
        state.pointerActive = false;
    });
    document.addEventListener('touchstart', event => {
        if (nodeInsideControls(event.target)) return;
        state.pointerActive = true;
        window.clearTimeout(state.selectionTimer);
    }, { passive: true });
    document.addEventListener('touchend', event => {
        state.pointerActive = false;
        if (nodeInsideControls(event.target)) return;
        primeAudio();
        window.setTimeout(() => captureSelection(true), 70);
    }, { passive: true });
    document.addEventListener('keyup', event => {
        if (event.key === 'Shift' || event.shiftKey) captureSelection(true);
    });

    replayButton.addEventListener('click', speakSelectedText);
    stopButton.addEventListener('click', () => cancelPlayback(true));
    closeButton.addEventListener('click', hideTray);
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && state.speaking) cancelPlayback(true);
    });

    try {
        const savedSpeed = localStorage.getItem('staticLessonVoiceSpeed');
        if (savedSpeed && Array.from(speedChoice.options).some(option => option.value === savedSpeed)) {
            speedChoice.value = savedSpeed;
        }
        speedChoice.addEventListener('change', () => {
            localStorage.setItem('staticLessonVoiceSpeed', speedChoice.value);
        });
    } catch (_error) {
        // The player also works when private browsing disables storage.
    }
})();
