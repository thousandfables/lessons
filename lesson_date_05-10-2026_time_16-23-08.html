vity correlate with your overall well-being?","The company's profits don't always correlate with the number of employees.","The survey results correlate with the feedback we received from customers."],"synonyms":["be linked to","be associated with","match","correspond to","be related to"],"antonyms":["be unrelated to","be disconnected from","contradict","be inconsistent with"],"gap":{"sentence":"The company's profits often _____ the amount of money they spend on advertising campaigns.","answer":"correlate with","options":["correlate with","ignore","oppose","disregard"]},"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/335178-335539.webm","at":3351.9,"dur":3.61}},{"term":"subject","pos":"noun","definition":"The person or thing that performs an action in a sentence.","time":3428.0,"lesson":"What is the difference between a subject and an object? A subject is someone who does the action, while an object is something or someone on which the action is being done.","examples":[{"sentence":"The subject of the sentence is the person performing the verb.","pattern":"The subject + is + [description]"},{"sentence":"In the sentence 'The chef prepares the meal,' the chef is the subject.","pattern":"Identify the subject"},{"sentence":"Who is the subject of this sentence?","pattern":"Who is the subject?"}],"countable":[{"meaning":"The person or thing that performs an action in a sentence.","example":"A subject is someone who does the action, while an object is something or someone on which the action is being done.","lesson":true},{"meaning":"A branch of knowledge studied in school or university","example":"Math is my favorite subject at school."},{"meaning":"A person who is part of a study or experiment","example":"The subjects of the experiment were asked to complete a survey."}],"uncountable":[{"meaning":"The topic or matter being discussed or dealt with","example":"The subject of the meeting was the new budget."}],"more_examples":[],"synonyms":["agent"],"antonyms":["object"],"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/342810-343157.webm","at":3428.3,"dur":3.47}},{"term":"object","pos":"noun","definition":"A person or thing that receives the action of a verb.","time":3445.0,"lesson":"A subject is someone who does the action, while an object is something or someone on which the action is being done. For example, in the sentence 'I drink tea,' I am the subject and the tea is the object.","examples":[{"sentence":"The police are looking for the object of the theft.","pattern":"object of + [noun]"},{"sentence":"In the sentence 'She kicked the ball,' the ball is the direct object.","pattern":"direct object"},{"sentence":"The company is the object of the investigation.","pattern":""}],"countable":[{"meaning":"A person or thing that receives the action of a verb.","example":"A subject is someone who does the action, while an object is something or someone on which the action is being done.","lesson":true},{"meaning":"A material thing that can be seen and touched","example":"There was a mysterious object left on the table."}],"uncountable":[],"more_examples":["He was the object of her affection for many years.","The new law is the object of much criticism."],"synonyms":["recipient","target"],"antonyms":[],"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/344540-345081.webm","at":3445.6,"dur":5.41}},{"term":"phrase something differently","pos":"expression","definition":"To express the same idea using different words or a different sentence structure.","time":3534.0,"lesson":"The instructions and the title phrase the idea differently. In the title, children are the subject, whereas in this body paragraph, the focus is on the parents.","examples":[{"sentence":"Could you phrase that differently? I want to make sure I understand your point.","pattern":"Could you phrase [something] differently?"},{"sentence":"The author phrases the argument differently in the second chapter to emphasize the risks.","pattern":""},{"sentence":"The news report phrased the situation differently than the official statement did.","pattern":"phrased [something] differently"}],"more_examples":["I'm sorry, I didn't mean to sound rude; let me try to phrase that differently.","If you're struggling to explain the technical details, try phrasing it differently for a general audience.","The lawyer advised his client to phrase the testimony differently to avoid any legal complications."],"synonyms":["reword","put it another way","express it differently","word it differently","restate","paraphrase","frame it differently"],"antonyms":["repeat exactly","quote verbatim","state as is"],"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/353430-354272.webm","at":3534.5,"dur":8.42}},{"term":"acquire knowledge","pos":"expression","definition":"To learn or gain new information, skills, or understanding through study or experience.","time":3598.2,"lesson":"How can they do that? How can control lead to acquiring knowledge or studying English?","examples":[{"sentence":"Students can acquire knowledge more effectively by practicing the language every day.","pattern":"acquire knowledge + adverb"},{"sentence":"Reading books is one of the best ways to acquire knowledge about history.","pattern":""},{"sentence":"The school provides various resources for children to acquire knowledge independently.","pattern":"for (someone) to acquire"}],"more_examples":["Traveling to different countries is a great way to acquire knowledge about diverse cultures.","The internship allowed her to acquire knowledge about how a real business operates.","Online courses make it easier for people to acquire knowledge from home."],"synonyms":["gain knowledge","learn","gather information","obtain information","absorb information","attain knowledge"],"antonyms":["forget","lose knowledge"],"gap":{"sentence":"Traveling to different countries is a fantastic way to _____ about various cultures and traditions firsthand.","answer":"acquire knowledge","options":["acquire knowledge","make mistakes","lose weight","save money"]},"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/360000-360377.webm","at":3600.2,"dur":3.77}},{"term":"keep in mind","pos":"expression","definition":"To remember or consider a specific piece of information while doing something.","time":3731.7,"lesson":"If you are not sure, you need to always keep in mind that your essay is a piece of argumentative writing. You should imagine how a person who disagrees with your opinion would respond.","examples":[{"sentence":"Please keep in mind that the deadline for the project is this Friday.","pattern":"keep in mind + that + clause"},{"sentence":"You should keep the safety rules in mind at all times.","pattern":"keep [something] in mind"},{"sentence":"Keep in mind that prices may change without notice.","pattern":"Keep in mind + that (short clause)"},{"sentence":"I'll keep that in mind for the next time we plan a trip.","pattern":""}],"more_examples":["Keep in mind that the restaurant is closed on Mondays.","When you're choosing a laptop, keep in mind how much storage you need.","Please keep in mind that we are still in the trial period."],"synonyms":["bear in mind","remember","take into account","consider","note","don't forget","be aware","take into consideration"],"antonyms":["forget","ignore","overlook","disregard"],"gap":{"sentence":"When you are cooking the soup, make sure to _____ that the spice level increases as it simmers.","answer":"keep in mind","options":["keep in mind","look at","finish up","turn off"]},"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/373324-373875.webm","at":3733.4,"dur":5.51}},{"term":"valid argument","pos":"noun phrase","definition":"A logical, reasonable, and relevant point used to support a specific opinion or position.","time":3819.0,"lesson":"They will say that children can think for themselves and decide what is good or bad. That is a valid argument, and you can write a body paragraph developing this point.","examples":[{"sentence":"While I disagree with your conclusion, I admit that you made a valid argument regarding the costs.","pattern":"make a valid argument"},{"sentence":"The judge dismissed the case because the lawyer failed to present a valid argument.","pattern":"present a valid argument"},{"sentence":"Is there any valid argument for why we should delay the project until next year?","pattern":"valid argument for + [noun/gerund]"},{"sentence":"She presented a very valid argument, which convinced the committee to change their minds.","pattern":"very valid argument"}],"countable":[{"meaning":"A logical, reasonable, and relevant point used to support a specific opinion or position.","example":"That is a valid argument, and you can write a body paragraph developing this point.","lesson":true},{"meaning":"A legal reason or justification for a specific action","example":"The police had no valid argument for searching the house without a warrant."}],"uncountable":[],"more_examples":["I understand your point of view, but I don't think that's a valid argument for staying home.","The company provided a valid argument for why they needed to increase the budget.","Does anyone have a valid argument against the new recycling policy?"],"synonyms":["sound reasoning","logical point","compelling reason","cogent point","justifiable reason","strong point"],"antonyms":["fallacy","flawed logic","invalid point","weak argument","baseless claim"],"gap":{"sentence":"Even though I didn't agree with his plan, I had to admit he made a _____ about the potential risks.","answer":"valid argument","options":["valid argument","vague idea","simple request","wrong opinion"]},"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/381978-382399.webm","at":3819.9,"dur":4.21}},{"term":"relevant","pos":"adjective","definition":"closely connected or appropriate to the matter being discussed or the topic at hand.","time":3833.0,"lesson":"Is that even relevant? Will the person agree that this is relevant information that really helps you make your point?","examples":[{"sentence":"The judge told the lawyer to only present evidence that was relevant to the case.","pattern":"relevant to [something]"},{"sentence":"I'm sorry, but your comment isn't really relevant to our current conversation.","pattern":"not relevant to [something]"},{"sentence":"The interviewer asked several relevant questions about my previous work experience.","pattern":"relevant questions"},{"sentence":"Is this information still relevant, or is it outdated?","pattern":"still relevant"}],"more_examples":["The company is looking for candidates with relevant skills in digital marketing.","Please make sure your essay stays relevant to the main theme of the prompt.","I don't think that's a relevant point to bring up during a job interview."],"synonyms":["applicable","pertinent","related","appropriate","germane","apposite","material"],"antonyms":["irrelevant","unrelated","inapplicable","immaterial","extraneous"],"gap":{"sentence":"Please make sure to include only _____ information in your report so that the manager can focus on the main issue.","answer":"relevant","options":["relevant","confusing","unnecessary","hidden"]},"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/383476-383814.webm","at":3835.0,"dur":3.38}},{"term":"make your point","pos":"expression","definition":"To provide information or arguments that support and clarify your main idea or opinion.","time":3836.0,"lesson":"Will the person agree that this is relevant information that really helps you make your point? They might ask how it relates to the discussion about children using the internet on their own.","examples":[{"sentence":"I'm just trying to make my point about the importance of safety.","pattern":"make one's point about + noun"},{"sentence":"You can interrupt me, but please let me finish making my point first.","pattern":""},{"sentence":"She used a series of statistics to make her point more effectively.","pattern":"make one's point + adverb"}],"more_examples":["He kept repeating the same facts just to make his point clear.","It's hard to make your point when everyone is talking at the same time."],"synonyms":["get your point across","clarify your position","explain your view","illustrate your argument","elaborate on your idea"],"antonyms":[],"gap":{"sentence":"I understand your frustration, but I need you to provide some evidence to _____ clear.","answer":"make your point","options":["make your point","give your opinion","show your face","take your time"]},"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/383986-384413.webm","at":3840.0,"dur":4.27}},{"term":"take a look","pos":"expression","definition":"To examine or review something, often to provide feedback or check for mistakes.","time":3922.0,"lesson":"When you change the plan for the second idea and rewrite your first body paragraph, send them to me. I will take a look and tell you if your ideas are good.","examples":[{"sentence":"Could you take a look at my resume and tell me what you think?","pattern":"take a look at + [something]"},{"sentence":"I'll take a look at the report as soon as I get into the office.","pattern":"I'll take a look (future intention)"},{"sentence":"The manager needs to take a look at the budget before we can proceed.","pattern":"need to + take a look"},{"sentence":"Take a look at this photo; it's from my trip to Japan.","pattern":"Imperative: Take a look at"}],"more_examples":["Could you take a look at this contract and see if anything is missing?","I need you to take a look at the website's layout before we go live.","Can you take a look at my presentation slides and give me some feedback?"],"synonyms":["check","review","examine","have a look","inspect","go over"],"antonyms":["ignore","overlook","disregard"],"gap":{"sentence":"I'm not sure if this email sounds professional enough, so could you _____ and see if I should change anything?","answer":"take a look","options":["take a look","make a choice","have a dream","make a plan"]},"clip":{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/392214-392550.webm","at":3922.3,"dur":3.36}}],"dialogues":[{"title":"Smartwatches and thinking in English","lines":[{"speaker":"A","text":"That's a pretty fancy watch you're wearing on your wrist.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/000706-001181.webm","at":7.3,"dur":4.75}]},{"speaker":"B","text":"Thanks, but it's actually dead. I haven't charged it for about a month.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/001536-003023.webm","at":15.6,"dur":14.87}]},{"speaker":"A","text":"So it's just sitting there dead? Why didn't you want to use it?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/003023-003305.webm","at":30.4,"dur":2.82},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/003460-004864.webm","at":34.8,"dur":14.04}]},{"speaker":"B","text":"It's a Samsung Galaxy S7. A lot of features are blocked, like NFC Pay, Telegram, and many websites.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/004878-005984.webm","at":49.0,"dur":11.06},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/009734-011311.webm","at":97.5,"dur":15.77}]},{"speaker":"A","text":"Can you at least install a VPN on it to get around that?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/011324-011846.webm","at":113.4,"dur":5.22}]},{"speaker":"B","text":"I don't think so, and I don't really want to go through the hassle of trying to fix it.","highlights":["go through the hassle"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/011636-012685.webm","at":117.3,"dur":10.49}]},{"speaker":"A","text":"You bought it yourself, right? Why did you get it if you didn't end up needing it?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/017030-018281.webm","at":170.5,"dur":12.51}]},{"speaker":"B","text":"I bought it about a year ago to help me cheat during my lessons.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/027506-028219.webm","at":275.3,"dur":7.13}]},{"speaker":"A","text":"You don't even go to school anymore! You can cheat as much as you want now.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/028766-029342.webm","at":287.9,"dur":5.76}]},{"speaker":"A","text":"When learning a language, it's hard for the brain to keep track of two systems at once.","highlights":["keep track of"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/036366-037023.webm","at":363.9,"dur":6.57},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/039194-039644.webm","at":392.1,"dur":4.5}]},{"speaker":"A","text":"You have to embrace your English personality and stop relying on Russian to process the world.","highlights":["relying on"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/040130-041415.webm","at":401.5,"dur":12.85}]},{"speaker":"A","text":"The goal is to reach the level where you suddenly realize you don't need the other language anymore.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/044090-045203.webm","at":441.0,"dur":11.13}]}],"time":7.3,"topic":0},{"title":"Using AI to learn English vocabulary","lines":[{"speaker":"A","text":"What should I do if I don't know the specific name for something? How can I explain it?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/048620-049486.webm","at":486.4,"dur":8.66}]},{"speaker":"B","text":"You can just explain it to an AI. Who needs native speakers when you have ChatGPT right in your pocket?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/054054-054879.webm","at":540.7,"dur":8.25}]},{"speaker":"A","text":"I'd prefer using the dictate button because I want to see the written answer rather than just listening to it.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/056394-057744.webm","at":564.0,"dur":13.5}]},{"speaker":"A","text":"For example, I could describe a rounded, stretchy object used to style messy hair into a bun.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/058618-060189.webm","at":586.4,"dur":15.71}]},{"speaker":"B","text":"You're describing a hair tie, or a hair elastic. You can even ask the AI for the difference between the two.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/061556-061805.webm","at":615.8,"dur":2.49},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/062386-063337.webm","at":624.1,"dur":9.51}]},{"speaker":"B","text":"The beauty of this approach is that it trains your brain to think and explain things in English, which makes you more comfortable.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/071744-072726.webm","at":717.6,"dur":9.82},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/074064-075063.webm","at":740.7,"dur":9.99}]},{"speaker":"A","text":"It's very satisfying to finally get the word you were looking for. I should do this more often.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/075182-076087.webm","at":752.0,"dur":9.05},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/076448-076915.webm","at":764.7,"dur":4.67}]},{"speaker":"B","text":"You can use me like ChatGPT now. Try explaining an idea, and I'll give you some suggestions.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/077128-078335.webm","at":771.5,"dur":12.07}]},{"speaker":"A","text":"Okay, let's talk about my class. I bought this watch last year, around November or December.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/079114-080237.webm","at":791.5,"dur":11.23}]}],"time":486.4,"topic":0},{"title":"Tracking sleep and academic honesty","lines":[{"speaker":"A","text":"I felt like I really needed a watch at the end of ninth grade, but over the summer, I realized I didn't actually need it anymore.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/084778-086240.webm","at":847.9,"dur":14.62}]},{"speaker":"B","text":"Did you actually use it during the school year? In ninth grade?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/087270-087860.webm","at":872.9,"dur":5.9}]},{"speaker":"A","text":"Yeah, maybe a couple of times. I guess I have a bit of a history of cheating.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/088614-089131.webm","at":886.3,"dur":5.17}]},{"speaker":"B","text":"I actually bought a Google watch a year ago specifically to track my sleep. It's the coolest feature a watch can have.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/092538-093777.webm","at":925.5,"dur":12.39}]},{"speaker":"A","text":"Do you use it for that? My score today is 70 percent. Why was it so low?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/094479-096080.webm","at":945.0,"dur":16.01}]},{"speaker":"B","text":"I think it's because I went to bed so late, at 2 a.m., and only slept for two hours. I need to fix my schedule.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/097396-098724.webm","at":974.2,"dur":13.28}]},{"speaker":"A","text":"You had to wake up early for the gym, right? It's the worst when you have to work out in the morning and don't feel refreshed.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/100160-101597.webm","at":1001.7,"dur":14.37}]},{"speaker":"B","text":"I felt fresh, though. I think I got enough sleep. But when was the last time you scored over 90?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/101714-103170.webm","at":1017.3,"dur":14.56}]},{"speaker":"A","text":"It was 84 back in September. How does it make you feel when you see a high score in the morning?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/108558-110141.webm","at":1085.7,"dur":15.83}]},{"speaker":"B","text":"I feel a sense of satisfaction, like when you finally get a piece of code to work.","highlights":["sense of satisfaction"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/112430-112933.webm","at":1124.5,"dur":5.03},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/113156-114039.webm","at":1131.8,"dur":8.83}]},{"speaker":"A","text":"It's more about your sleep schedule than the amount of sleep. If you go to bed at 10, you should stick to that.","highlights":["stick to that"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/120874-122188.webm","at":1208.9,"dur":13.14}]},{"speaker":"B","text":"I'm just too lazy to charge the watch. It only takes about an hour every two days.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/124598-126125.webm","at":1246.2,"dur":15.27}]},{"speaker":"A","text":"Come on, you bought it for cheating in the first place. You don't have to cheat anymore!","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/128734-129522.webm","at":1287.5,"dur":7.88}]}],"time":847.9,"topic":1},{"title":"Smartwatches, late nights, and gardening","lines":[{"speaker":"A","text":"The watch can still be of service to you by tracking your workouts.","highlights":["be of service"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/129438-130845.webm","at":1294.5,"dur":14.07}]},{"speaker":"B","text":"I couldn't find the workout function today. Is it blocked?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/131245-132165.webm","at":1312.6,"dur":9.2}]},{"speaker":"A","text":"I don't think so, but you should look for a tutorial online. It's the most useful thing you can do with a watch.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/132296-133413.webm","at":1323.2,"dur":11.17},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/133634-134089.webm","at":1336.5,"dur":4.55}]},{"speaker":"B","text":"What else do you need a watch for? You have Mirror Pay on your phone.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/134902-135477.webm","at":1349.2,"dur":5.75}]},{"speaker":"A","text":"I use it, but I guess I just use it for fun. It's not a big deal.","highlights":["not a big deal"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/135514-136661.webm","at":1355.3,"dur":11.47}]},{"speaker":"B","text":"When was the last time you went somewhere without your phone? You're basically nothing without it.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/137180-137635.webm","at":1372.0,"dur":4.55},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/138328-138715.webm","at":1383.5,"dur":3.87}]},{"speaker":"A","text":"Why did you stay up until 2 a.m. yesterday? You said you had a free day to enjoy yourself.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/139116-140177.webm","at":1391.3,"dur":10.61}]},{"speaker":"B","text":"I spent a lot of time scrolling. I even listened to music for about 20 minutes while brushing my teeth.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/143213-143835.webm","at":1432.3,"dur":6.22},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/144196-145060.webm","at":1442.2,"dur":8.64}]},{"speaker":"A","text":"You should have started your bedtime routine at 1 a.m. instead of scrolling in bed.","highlights":["bedtime routine"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/147972-148881.webm","at":1479.8,"dur":9.09},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/149306-149661.webm","at":1493.2,"dur":3.55}]},{"speaker":"B","text":"Why didn't you code during your free time? I realized after going to the bathhouse that I didn't want to.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/151598-152261.webm","at":1516.2,"dur":6.63},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/155410-156119.webm","at":1554.2,"dur":7.09}]},{"speaker":"A","text":"You live in the countryside, so you don't need a country house. Your room looks like a city apartment.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/159273-159796.webm","at":1592.9,"dur":5.23},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/160513-160970.webm","at":1605.3,"dur":4.57}]},{"speaker":"B","text":"I can show you my yard. It's big, but I'd rather live in an apartment because I hate working in the backyard.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/165818-166133.webm","at":1658.4,"dur":3.15},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/167654-169054.webm","at":1676.7,"dur":14.0}]},{"speaker":"A","text":"You don't like to mow the lawn or pull out the weeds?","highlights":["pull out"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/169236-170573.webm","at":1692.6,"dur":13.37}]},{"speaker":"B","text":"It's not my cup of tea. I have to do it alone every month.","highlights":["not my cup of tea"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/177468-178620.webm","at":1774.8,"dur":11.52}]}],"time":1294.5,"topic":1},{"title":"Discussing siblings and essay writing","lines":[{"speaker":"A","text":"My sisters don't help me at all, which is honestly so embarrassing.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/179097-179517.webm","at":1791.2,"dur":4.2}]},{"speaker":"B","text":"Do you have an older or younger sister?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/179574-179839.webm","at":1795.9,"dur":2.65}]},{"speaker":"A","text":"I have an older sister who's 22. She lives right next to my room.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/180036-181202.webm","at":1800.6,"dur":11.66}]},{"speaker":"B","text":"Your backyard looks really neat. I imagine your mother takes great care of the garden, keeping the grass mowed and pulling out the weeds.","highlights":["takes great care of"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/183477-184456.webm","at":1834.9,"dur":9.79}]},{"speaker":"A","text":"She can be annoying sometimes. I've never had an older sibling, so it's hard for me to relate to that.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/185882-186269.webm","at":1859.0,"dur":3.87},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/187866-188058.webm","at":1878.9,"dur":1.92}]},{"speaker":"B","text":"I see you've written an essay about children using the internet without supervision. Let's open the Google Doc.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/190404-191735.webm","at":1904.2,"dur":13.31}]},{"speaker":"A","text":"What's the purpose of the first sentence in the introduction?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/196946-197357.webm","at":1969.7,"dur":4.11}]},{"speaker":"B","text":"It's to paraphrase the question and introduce the reader to the problem. However, you basically just copied it.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/197734-198493.webm","at":1977.5,"dur":7.59},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/199434-199713.webm","at":1994.5,"dur":2.79}]},{"speaker":"A","text":"Can I use 'kids' as a synonym for 'children'?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/199994-200833.webm","at":2000.1,"dur":8.39}]},{"speaker":"B","text":"'Kids' is a bit informal. Since we're writing a formal essay, 'minors' or 'people under 18' would be better.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/200750-201433.webm","at":2007.7,"dur":6.83},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/201962-202349.webm","at":2019.8,"dur":3.87}]},{"speaker":"A","text":"How about 'should not be online' for the internet part?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/212570-213325.webm","at":2125.9,"dur":7.55}]},{"speaker":"B","text":"We could also say 'without their parents' control' to express the idea of supervision.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/218114-218325.webm","at":2181.3,"dur":2.11},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/222130-222387.webm","at":2221.5,"dur":2.57}]},{"speaker":"A","text":"Is it okay to use the words 'children', 'adult', and 'internet'?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/223268-224522.webm","at":2232.9,"dur":12.54}]},{"speaker":"B","text":"They are fine, but not in the first sentence. You need to make a good first impression on the examiner to show you know how to paraphrase.","highlights":["make a good first impression"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/224520-226044.webm","at":2245.3,"dur":15.24}]}],"time":1791.2,"topic":2},{"title":"Improving essay structure and specific examples","lines":[{"speaker":"A","text":"In the first body paragraph, you're discussing harmful information, and in the second, you're covering useless information.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/228868-229658.webm","at":2288.8,"dur":7.9}]},{"speaker":"B","text":"I see your point, but I can't see it clearly because there are multiple ideas here that aren't well-developed.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/235030-235315.webm","at":2350.5,"dur":2.85},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/235492-236722.webm","at":2355.1,"dur":12.3}]},{"speaker":"A","text":"For instance, you mention 'harmful' and then immediately switch to 'dangerous.' They aren't always the same thing.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/236764-237467.webm","at":2367.8,"dur":7.03}]},{"speaker":"B","text":"Scrolling through TikTok can be harmful to your mental health, but calling it 'dangerous' might be an exaggeration.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/238204-239220.webm","at":2382.1,"dur":10.16}]},{"speaker":"A","text":"When an examiner hears about internet trends, they usually think of harmless content. You need to provide a specific, dangerous example.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/241480-243084.webm","at":2414.9,"dur":16.04}]},{"speaker":"B","text":"You're talking about addiction and negative impacts, but you haven't specified what kind of content you mean.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/245668-247085.webm","at":2456.9,"dur":14.17}]},{"speaker":"A","text":"It's better to start with a specific example first. You started with general ideas and then tried to fit an example in, but it lacks detail.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/249100-250934.webm","at":2491.1,"dur":18.34}]},{"speaker":"B","text":"To fix this, we need a specific example. For instance, why did you spend so much time scrolling yesterday?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/252756-253355.webm","at":2527.8,"dur":5.99},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/268766-269023.webm","at":2687.9,"dur":2.57}]},{"speaker":"A","text":"You were scrolling through TikTok and Instagram Reels because you were trying to rest and couldn't decide what to do.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/269302-270774.webm","at":2693.1,"dur":14.72}]},{"speaker":"B","text":"Do you agree that watching those videos was useless? Or was it harmful because of the negative impact on your free time and your brain?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/275564-276661.webm","at":2755.8,"dur":10.97},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/276834-277877.webm","at":2768.5,"dur":10.43}]}],"time":2288.8,"topic":3},{"title":"Short content and attention spans","lines":[{"speaker":"A","text":"What kind of negative effect does watching TikTok have on the brain? I find it hard to concentrate on anything for a long time after using it.","highlights":["concentrate on"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/278460-279965.webm","at":2784.8,"dur":15.05}]},{"speaker":"B","text":"It's difficult to switch to a complex task that requires deliberate thinking, like coding, because your brain is used to getting rewards without any effort.","highlights":["deliberate thinking"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/282316-283460.webm","at":2823.3,"dur":11.44},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/282338-284089.webm","at":2828.0,"dur":17.51}]},{"speaker":"A","text":"How can we make this more representative? Does this apply to a larger group of people?","highlights":["more representative"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/286478-287481.webm","at":2865.0,"dur":10.03}]},{"speaker":"B","text":"We need to narrow it down to children who are addicted to short videos. It's more specific than just saying 'people addicted to short content.'","highlights":["narrow it down"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/292938-294228.webm","at":2929.5,"dur":12.9}]},{"speaker":"A","text":"Our example is more about teenagers. Many teenagers around the world face this problem with short attention spans.","highlights":["short attention spans"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/297972-298271.webm","at":2979.9,"dur":2.99},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/303700-304260.webm","at":3037.2,"dur":5.6}]},{"speaker":"B","text":"I felt that today. I tried to work on a sophisticated script for a logistics algorithm, but I kept losing focus because of constant interruptions.","highlights":["losing focus"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/309140-309544.webm","at":3091.5,"dur":4.04},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/310158-310631.webm","at":3101.7,"dur":4.73}]},{"speaker":"A","text":"So our example will focus on losing attention. We also need to mention what role parents play and how they can control screen time using specific apps.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/314980-315681.webm","at":3150.0,"dur":7.01},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/323496-324192.webm","at":3235.1,"dur":6.96}]}],"time":2784.8,"topic":4},{"title":"Analyzing children's internet usage and parental control","lines":[{"speaker":"A","text":"I feel like children might start crying if there are too many limits, so some parents just leave them with unrestricted phone access.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/326288-327746.webm","at":3263.1,"dur":14.58}]},{"speaker":"B","text":"That's true. Kids can actually use emotional manipulation to control their parents when they feel restricted.","highlights":["emotional manipulation"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/328236-328936.webm","at":3282.5,"dur":7.0}]},{"speaker":"A","text":"Exactly. That's why some parents don't install monitoring apps. However, your example about teenagers scrolling on TikTok and losing concentration doesn't really address safety.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/328980-329159.webm","at":3289.9,"dur":1.79},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/329710-330727.webm","at":3297.2,"dur":10.17}]},{"speaker":"B","text":"I see your point. You're talking about safety, but safety usually implies things like kidnapping or strangers texting you on Instagram.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/332504-333215.webm","at":3325.2,"dur":7.11},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/333484-334274.webm","at":3335.0,"dur":7.9}]},{"speaker":"A","text":"Right, so that example doesn't correlate with safety. Now, let's look at your second body paragraph. Is it more about the parents or the children?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/335542-336653.webm","at":3355.6,"dur":11.11},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/339612-340721.webm","at":3396.3,"dur":11.09}]},{"speaker":"B","text":"I think it's about the children because of their future.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/341216-342221.webm","at":3412.4,"dur":10.05}]},{"speaker":"A","text":"Actually, in this paragraph, children are the objects. You're describing parents doing something to them; the children are just a tool in your argument.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/350018-350309.webm","at":3500.4,"dur":2.91},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/350776-352361.webm","at":3508.0,"dur":15.85}]},{"speaker":"B","text":"I see. So the title frames it differently, focusing on what children can do online without adults.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/354146-355539.webm","at":3541.8,"dur":13.93}]},{"speaker":"A","text":"Exactly. You need to explain how parental control leads to acquiring knowledge. If a parent restricts your TikTok, will you suddenly start studying German?","highlights":["acquiring knowledge"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/360000-361505.webm","at":3600.2,"dur":15.05}]},{"speaker":"B","text":"No, I wouldn't. They can sit close to you and help you learn English, but that's different from the topic we're discussing.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/364072-365605.webm","at":3640.8,"dur":15.33}]},{"speaker":"A","text":"Correct. If the topic were 'the Internet as a source of knowledge,' we could discuss useful cases. But this specific prompt is formulated differently.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/367332-368079.webm","at":3673.4,"dur":7.47},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/371348-371863.webm","at":3713.7,"dur":5.15}]},{"speaker":"B","text":"I get it now. It's a bit hard to explain, but I understand the distinction.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/372558-373034.webm","at":3725.7,"dur":4.76}]}],"time":3261.4,"topic":4},{"title":"Essay structure and scheduling","lines":[{"speaker":"A","text":"You need to keep in mind that your essay is essentially a debate. When you have an opinion, imagine someone who disagrees with you.","highlights":["keep in mind"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/373076-374497.webm","at":3730.9,"dur":14.21}]},{"speaker":"B","text":"Right. If I agree with the statement, what would the opposing side say? They might argue that children can think for themselves.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/375782-377165.webm","at":3757.9,"dur":13.83}]},{"speaker":"A","text":"That's a valid argument to develop into a body paragraph. But is it actually relevant to our specific discussion about children using the internet alone?","highlights":["valid argument"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/381234-382399.webm","at":3812.4,"dur":11.65}]},{"speaker":"B","text":"Exactly. They'd ask how it relates to the core issue. We are talking about children using the internet on their own, not just parents recommending things.","highlights":["core issue"],"clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/384842-386307.webm","at":3848.5,"dur":14.65}]},{"speaker":"A","text":"You can use ChatGPT to see if your ideas are relevant. Paste your essay and ask it to check your points rather than just giving you a score.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/387674-389181.webm","at":3876.9,"dur":15.07}]},{"speaker":"B","text":"I'll try that. I'll ask it to rewrite the first body paragraph so I know what to write there.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/389684-390274.webm","at":3897.0,"dur":5.9}]},{"speaker":"A","text":"For the second body paragraph, you can just change your plan. Send me both the new plan and the rewritten first paragraph, and I'll take a look.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/390366-391023.webm","at":3903.9,"dur":6.57},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/391192-392210.webm","at":3912.1,"dur":10.18}]},{"speaker":"B","text":"Should I write the whole first paragraph now, or just the plan for the second one?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/392304-393893.webm","at":3923.1,"dur":15.89}]},{"speaker":"A","text":"Rewrite the first body paragraph completely. For the second one, just write the plan. Is that clear?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/397368-398259.webm","at":3973.9,"dur":8.91},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/401905-402470.webm","at":4007.2,"dur":5.65}]},{"speaker":"B","text":"Yes, that's clear. What about our schedule for this week?","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/402398-403903.webm","at":4024.2,"dur":15.05}]},{"speaker":"A","text":"We'll meet on Friday and Sunday. Since it's very late in Moscow on Wednesday, those days work best. See you on Friday.","clips":[{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/404290-404769.webm","at":4043.0,"dur":4.79},{"src":"lesson_audio/lesson_date_05-10-2026_time_16-23-08/405072-406617.webm","at":4050.9,"dur":15.45}]}],"time":3730.9,"topic":4}]};

            // Newer lessons grade each mistake by how clear the meaning stayed (1 = gravest).
            // The page shows the short hint (one line on a phone); the full one is its tooltip.
            const GRADES = [null,
                { name: 'Misleading', hint: 'heard as something else', full: 'a listener would understand something different' },
                { name: 'Meaning lost', hint: "listener can't tell what you meant", full: "a listener couldn't tell what you meant" },
                { name: 'Hard to follow', hint: 'listener has to guess', full: 'a listener would have to guess' },
                { name: 'Slows the listener down', hint: 'understood after a moment', full: 'understood, but only after a moment' },
                { name: 'Clear, but an obvious error', hint: 'breaks a basic rule', full: 'breaks a basic rule anyone would notice' },
                { name: 'Clear, but not natural', hint: 'not how natives say it', full: 'not how a native speaker would say it' },
                { name: 'Clear, a small slip', hint: "most wouldn't notice", full: "most listeners wouldn't notice" }
            ];
            const FILLERS = new Set(['uh', 'um', 'like', 'yeah', 'okay', 'ok', 'so', 'well', 'just', 'actually', 'really', 'right', 'oh']);
            const FUNCTION_WORDS = new Set(['a', 'an', 'the', 'to', 'of', 'for', 'in', 'on', 'at', 'up', 'out', 'off', 'with', 'by', 'about', 'into', 'over', 'down', 'away', 'back']);
            const PLACEHOLDERS = new Set(['someone', 'somebody', 'something', 'sb', 'sth', 'one', "one's", "someone's", 'oneself', 'yourself', 'my', 'your', 'his', 'her', 'its', 'our', 'their', 'a', 'an', 'the']);
            const IRREGULAR = {};
            'be:am,is,are,was,were,been|have:has,had|do:does,did,done|go:goes,went,gone|take:took,taken|make:made|get:got,gotten|give:gave,given|come:came|see:saw,seen|know:knew,known|think:thought|tell:told|find:found|grow:grew,grown|keep:kept|leave:left|bring:brought|buy:bought|catch:caught|choose:chose,chosen|drive:drove,driven|eat:ate,eaten|fall:fell,fallen|feel:felt|fight:fought|fly:flew,flown|forget:forgot,forgotten|hear:heard|hold:held|lay:laid|lead:led|lose:lost|meet:met|pay:paid|say:said|sell:sold|send:sent|sit:sat|sleep:slept|speak:spoke,spoken|spend:spent|stand:stood|stick:stuck|teach:taught|throw:threw,thrown|understand:understood|wear:wore,worn|win:won|write:wrote,written|wind:wound|light:lit|run:ran|begin:began,begun|break:broke,broken|build:built|mean:meant|ride:rode,ridden|rise:rose,risen'
                .split('|').forEach(entry => {
                    const [base, forms] = entry.split(':');
                    IRREGULAR[base] = base;
                    forms.split(',').forEach(form => { IRREGULAR[form] = base; });
                });

            const icons = {
                play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
                bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg>',
                clipPlay: '<svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19.5 12z" fill="currentColor"/></svg>',
                clipPause: '<svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z" fill="currentColor"/></svg>',
                back3: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 8.6A8 8 0 1 1 4 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4.4 4.2v4.9h4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="12.6" y="16" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor" font-family="system-ui, sans-serif">3</text></svg>',
                forward3: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.8 8.6A8 8 0 1 0 20 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19.6 4.2v4.9h-4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="11.4" y="16" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor" font-family="system-ui, sans-serif">3</text></svg>',
                backArrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
                goBack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>'
            };

            // A section's symbol (drawn once at the top of the page).
            const symbol = section => `<svg class="sym" aria-hidden="true" focusable="false"><use href="#sym-${section}"/></svg>`;

            const lesson = LESSON || {};
            const meta = lesson.meta || {};
            const mistakes = lesson.mistakes || [];
            // Graded lessons: every card has a grade 1-7 (a card without one
            // gets the grade nearest its old level); otherwise the old levels.
            const hasGrade = card => Number.isInteger(card.grade) && card.grade >= 1 && card.grade <= 7;
            const graded = mistakes.some(hasGrade);
            const gradeOf = card => hasGrade(card) ? card.grade : ({ high: 4, medium: 5, low: 6 }[card.severity] || 5);
            const vocabulary = lesson.vocabulary || [];
            const dialogues = lesson.dialogues || [];

            // --------------------------------------------------------- helpers
            function esc(value) {
                return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
            }

            function norm(word) {
                return word.toLowerCase().replace(/’/g, "'").replace(/[^\p{L}\p{N}']/gu, '');
            }

            function stem(word) {
                let w = norm(word).replace(/'s$/, '');
                if (IRREGULAR[w]) return IRREGULAR[w];
                for (const suffix of ['ing', 'ied', 'ies', 'ed', 'es', 's', 'ly']) {
                    if (w.endsWith(suffix) && w.length - suffix.length >= 3) { w = w.slice(0, -suffix.length); break; }
                }
                return w.replace(/e+$/, '');
            }

            function playButton(text, label) {
                return `<button class="play" type="button" data-say="${esc(text)}" aria-label="${esc(label || 'Listen')}" data-no-speech>${icons.play}</button>`;
            }

            // A clip of the lesson recording: a pill with the time it was said,
            // which opens into a small player when tapped.
            function clipHtml(clip, label) {
                if (!clip || !clip.src) return '';
                const at = clock(clip.at);
                return `<span class="clip" data-src="${esc(clip.src)}" data-no-speech>`
                    + `<button class="clip-main" type="button" title="${esc(label)}" aria-label="${esc(label)}, ${at}">${icons.clipPlay}${icons.clipPause}<span>${at}</span></button>`
                    + '<span class="clip-more">'
                    + `<button class="clip-skip" type="button" data-skip="-3" title="Back 3 seconds" aria-label="Back 3 seconds">${icons.back3}</button>`
                    + '<span class="clip-bar" role="slider" tabindex="0" aria-label="Position in the clip" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="clip-fill"></span></span>'
                    + `<button class="clip-skip" type="button" data-skip="3" title="Forward 3 seconds" aria-label="Forward 3 seconds">${icons.forward3}</button>`
                    + '</span></span>';
            }

            // Word diff (longest common subsequence) between what was said and the fix.
            function diff(before, after) {
                const a = before.split(/\s+/).filter(Boolean);
                const b = after.split(/\s+/).filter(Boolean);
                const n = a.length, m = b.length;
                const table = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
                for (let i = n - 1; i >= 0; i--) {
                    for (let j = m - 1; j >= 0; j--) {
                        table[i][j] = norm(a[i]) === norm(b[j]) ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
                    }
                }
                const left = [], right = [];
                let i = 0, j = 0;
                while (i < n || j < m) {
                    if (i < n && j < m && norm(a[i]) === norm(b[j])) {
                        left.push({ word: a[i++], kind: 'same' });
                        right.push({ word: b[j++], kind: 'same' });
                    } else if (j >= m || (i < n && table[i + 1][j] >= table[i][j + 1])) {
                        const word = a[i];
                        const previous = i > 0 ? norm(a[i - 1]) : '';
                        const noise = FILLERS.has(norm(word)) || norm(word) === previous || !norm(word);
                        left.push({ word, kind: noise ? 'same' : 'del' });
                        i++;
                    } else {
                        // Mark where a missing word belongs, unless a deletion already shows the spot.
                        const last = left[left.length - 1];
                        if (!last || (last.kind !== 'del' && last.kind !== 'gap')) left.push({ kind: 'gap' });
                        right.push({ word: b[j++], kind: 'ins' });
                    }
                }
                const render = (tokens, tag) => tokens.map(t => {
                    if (t.kind === 'gap') return '<span class="gap" aria-hidden="true"></span>';
                    return t.kind === 'same' ? esc(t.word) : `<${tag} class="w">${esc(t.word)}</${tag}>`;
                }).join(' ').replace(/<\/(del|ins)> <\1 class="w">/g, ' ');
                return { said: render(left, 'del'), fixed: render(right, 'ins') };
            }

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {
                    if (!hit[index] && functional.has(norm(part))) {
                        const near = [index - 2, index + 2].some(k => hit[k]);
                        if (near) hit[index] = true;
                    }
                });
                return parts.map((part, index) => {
                    if (!hit[index]) return esc(part);
                    // Underline the word itself, not quotes or punctuation stuck to it.
                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                    return `${esc(before)}<b class="hl">${esc(core)}</b>${esc(after)}`;
                }).join('');
            }

            // link(phrase): the vocabulary entry of a highlighted phrase, or -1.
            function highlightPhrases(text, phrases, link) {
                const lower = text.toLowerCase();
                const ranges = [];
                (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length, phrase]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end, phrase]) => {
                    const word = link ? link(phrase) : -1;
                    const opens = word >= 0 ? ` data-vocab="${word}" title="${esc(`See “${vocabulary[word].term}” in Vocabulary`)}"` : '';
                    html += esc(text.slice(cursor, start)) + `<mark class="expr"${opens}>${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {
                    if (value === undefined) return window.localStorage.getItem(key);
                    window.localStorage.setItem(key, value);
                } catch (_error) {
                    return null;
                }
                return null;
            }

            // ---------------------------------------------------------- header
            document.getElementById('title').textContent = meta.title || 'Lesson review';

            // The lesson time in Moscow time (meta.start_utc: when the lesson
            // began, in seconds since 1970). A tap shows it in the reader's own
            // time zone instead, remembered on the phone. Older pages have no
            // start_utc: the date and time as recorded, with no zone.
            const eyebrow = document.getElementById('eyebrow');
            const lessonStart = typeof meta.start_utc === 'number' && isFinite(meta.start_utc) ? new Date(meta.start_utc * 1000) : null;
            let lessonTimes = null;
            let ownZone = storage('lesson-time-zone') === 'own';

            function zoneTime(zone) {
                const date = { day: 'numeric', month: 'long', year: 'numeric' };
                const time = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
                if (zone) { date.timeZone = zone; time.timeZone = zone; }
                return {
                    date: new Intl.DateTimeFormat('en-GB', date).format(lessonStart),
                    time: new Intl.DateTimeFormat('en-GB', time).format(lessonStart)
                };
            }

            function offsetName(minutes) {
                const size = Math.abs(minutes);
                if (!size) return 'GMT';
                return 'GMT' + (minutes < 0 ? '-' : '+') + Math.floor(size / 60) + (size % 60 ? ':' + String(size % 60).padStart(2, '0') : '');
            }

            if (lessonStart) {
                try {
                    const moscow = zoneTime('Europe/Moscow');
                    const own = zoneTime(null);
                    lessonTimes = {
                        moscow: Object.assign(moscow, { zone: 'MSK', name: 'Moscow time' }),
                        own: Object.assign(own, { zone: offsetName(-lessonStart.getTimezoneOffset()), name: 'your time' }),
                        differ: moscow.date !== own.date || moscow.time !== own.time
                    };
                } catch (_error) {
                    lessonTimes = null;  // no time zones in this browser: the time as recorded
                }
            }

            function showLessonTime() {
                let date = meta.date;
                if (!lessonTimes) {
                    eyebrow.textContent = ['English lesson', meta.date, meta.time].filter(Boolean).join(' · ');
                } else {
                    const shown = lessonTimes.differ && ownZone ? lessonTimes.own : lessonTimes.moscow;
                    const other = shown === lessonTimes.own ? lessonTimes.moscow : lessonTimes.own;
                    const time = `${esc(shown.time)} <span class="tz">${esc(shown.zone)}</span>`;
                    date = shown.date;
                    eyebrow.innerHTML = `English lesson · ${esc(shown.date)} · `
                        + (lessonTimes.differ
                            ? `<button class="tz-btn" type="button" title="Show ${esc(other.name)} (${esc(other.zone)})" aria-label="${esc(`${shown.time} ${shown.name}. Show ${other.name}, ${other.zone}`)}">${time}</button>`
                            : `<span class="tz-time">${time}</span>`);
                }
                document.title = (meta.title ? meta.title + ' · ' : '') + 'English lesson' + (date ? ' · ' + date : '');
            }
            showLessonTime();
            eyebrow.addEventListener('click', event => {
                if (!event.target.closest('.tz-btn')) return;
                ownZone = !ownZone;
                storage('lesson-time-zone', ownZone ? 'own' : 'moscow');
                showLessonTime();
                const button = eyebrow.querySelector('.tz-btn');
                if (button && event.detail === 0) button.focus();  // kept for the keyboard
            });

            document.getElementById('count-mistakes').textContent = mistakes.length;
            document.getElementById('count-vocabulary').textContent = vocabulary.length;
            document.getElementById('count-dialogues').textContent = dialogues.length;

            // -------------------------------------------------------- mistakes
            const topics = lesson.topics || [];
            // Each mistake example, word and dialogue line can be found by the timeline.
            const exampleIds = new Map();
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => exampleIds.set(example, `m-${c}-${e}`)));
            let showAllMistakes = () => {};
            let vocabularyToWords = () => {};
            // What "Go back" needs to put a section back as it was.
            let mistakeFilter = () => 'all';
            let setMistakeFilter = () => {};
            let vocabularyView = () => 'words';
            let setVocabularyView = () => {};

            function clock(seconds) {
                if (seconds === null || seconds === undefined) return '';
                const total = Math.max(0, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const rest = String(total % 60).padStart(2, '0');
                return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
            }

            function plain(text) {
                return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
            }

            // One example: when it was said, the full sentence(s) as said and
            // corrected, and (where it adds something) its own explanation.
            function exampleHtml(example, options) {
                const before = example.context || example.quote;
                const after = example.context_fix || example.fix;
                const d = diff(before, after);
                // The clip pill needs no separator: it stays apart from the topic when the line wraps.
                const pill = clipHtml(example.clip, 'Hear what was said');
                // The letters beside the time open the same moment in the other sections.
                const jumps = jumpsHtml('mistakes', example.clip ? example.clip.at : example.time);
                const facts = [];
                if (!pill && example.time !== null && example.time !== undefined) facts.push(`<span class="clock">${clock(example.time)}</span>${jumps}`);
                if (options.showTopic && topics[example.topic]) facts.push(`<span>${esc(topics[example.topic].title)}</span>`);
                let html = `<div class="pair" data-item="${exampleIds.get(example) || ''}"${options.hidden ? ' hidden' : ''}>`;
                const separator = jumps && !pill ? '' : '<span class="sep">·</span>';
                if (pill || facts.length) html += `<div class="ex-meta" data-no-speech>${pill}${pill ? jumps : ''}${facts.join(separator)}</div>`;
                html += `<div class="said"><span class="mark-icon" aria-label="What was said" data-no-speech>✗</span><span class="txt">${d.said}</span></div>`;
                html += `<div class="fixed"><span class="mark-icon" aria-label="Better" data-no-speech>✓</span><span class="txt">${d.fixed}</span>${playButton(after, 'Listen to the correct version')}</div>`;
                if (options.why) html += `<p class="ex-why">${esc(options.why)}</p>`;
                return html + '</div>';
            }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
                    html += items.map(item => `<li><span class="meaning">${esc(item.meaning)}</span><span class="m-ex">${highlightTerm(item.example, entry.term)}`
                        + (item.lesson ? ' <span class="from-lesson" data-no-speech>from the lesson</span>' : '') + '</span></li>').join('');
                    return html + '</ol></div>';
                };
                return '<div class="forms">'
                    + column('Countable', 'a / an, plural', entry.countable || [])
                    + column('Uncountable', 'no a / an, no plural', entry.uncountable || [])
                    + '</div>';
            }

            function relatedHtml(entry) {
                const row = (title, words) => (words || []).length
                    ? `<div class="rel"><p class="part-title" data-no-speech>${title}</p><span class="rel-words">${words.map(w => `<span class="rel-word">${esc(w)}</span>`).join('<span class="sep" data-no-speech> · </span>')}</span></div>`
                    : '';
                return row('Synonyms', entry.synonyms) + row('Antonyms', entry.antonyms);
            }

            // Visible: when it was said, the word, the meaning, the lesson's own
            // words and at least three examples. The rest opens on request.
            function wordCardHtml(entry, index) {
                const term = entry.term || '';
                let html = `<article class="card word" id="word-${index}"><div class="w-head">`;
                if (entry.clip) html += clipHtml(entry.clip, 'Hear it in the lesson');
                else if (entry.time !== null && entry.time !== undefined) html += `<span class="clock" data-no-speech>${clock(entry.time)}</span>`;
                html += jumpsHtml('vocabulary', entry.clip ? entry.clip.at : entry.time);
                // The word, its kind and its speaker stay together (a new row when
                // they do not fit); the kind and the speaker never part.
                html += `<div class="w-title"><h3 class="w-term">${esc(term)}</h3><span class="w-side">`;
                if (entry.pos) html += `<span class="w-pos" data-no-speech>${esc(entry.pos)}</span>`;
                html += playButton(term, 'Listen to ' + term) + '</span></div></div>';
                if (entry.definition) html += `<p class="def">${esc(entry.definition)}</p>`;
                const passage = entry.lesson || entry.lesson_example;
                if (passage) {
                    html += `<div class="lesson-ex"><div class="txt"><span class="src" data-no-speech>From the lesson</span>${highlightTerm(passage, term)}</div>${playButton(passage, 'Listen')}</div>`;
                }
                const examples = exampleItems(entry);
                if (examples.length) {
                    html += '<ul class="examples">' + examples.map(example => '<li>'
