{"term":"get someone invested in","pos":"expression","definition":"To make someone feel deeply involved, interested, or emotionally connected to something.","time":2939.6,"lesson":"The new book isn't very interesting, but once you get people invested in your story, they are willing to read anything.","examples":[{"sentence":"The director knows how to get the audience invested in the characters' lives.","pattern":"get + object + invested in"},{"sentence":"It's hard to get people invested in a project if there is no clear goal.","pattern":""},{"sentence":"Once you get them invested in the idea, they will support your plan.","pattern":""}],"more_examples":["The marketing team needs to get the customers invested in the brand's mission.","It's much easier to manage a team once you get them invested in the company's vision.","A good teacher knows how to get students invested in the subject matter."],"synonyms":["engage someone in","involve someone in","hook someone into","draw someone into","capture someone's interest"],"antonyms":["disengage someone from","alienate someone from","detach someone from","make someone indifferent to"],"gap":{"sentence":"The teacher used a real-life mystery to _____ the history lesson.","answer":"get the students invested in","options":["get the students invested in","get the students bored with","get the students annoyed by","get the students confused about"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/293736-294315.webm","at":2937.6,"dur":5.79}},{"term":"all it takes is","pos":"expression","definition":"the only thing that is necessary to achieve a result or make something happen.","time":2954.1,"lesson":"I noticed that sometimes all it takes is just one interesting idea or one interesting method. For example, a show could be based entirely on that one concept.","examples":[{"sentence":"All it takes is a little bit of practice to master this skill.","pattern":"all it takes is + [noun phrase]"},{"sentence":"You don't need a lot of money; all it takes is a good plan.","pattern":"all it takes is + [noun phrase] (contrastive)"},{"sentence":"All it takes is one mistake for the entire project to fail.","pattern":"all it takes is + [countable noun]"},{"sentence":"Sometimes all it takes is a simple conversation to clear up a misunderstanding.","pattern":"Sometimes all it takes is"}],"more_examples":["All it takes is a bit of courage to start a new business.","You don't need a specialized degree; all it takes is a passion for learning.","All it takes is a few minutes of stretching to feel much better."],"synonyms":["you only need","it only requires","it just takes","all you need is"],"antonyms":[],"gap":{"sentence":"You don't need to be a professional chef; _____ a basic recipe to cook a delicious meal.","answer":"all it takes is","options":["all it takes is","all it needs is","all it wants is","all it shows is"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/295396-295937.webm","at":2954.2,"dur":5.41}},{"term":"pick up on","pos":"phrasal verb","definition":"To notice, detect, or identify something, especially something that is not obvious.","time":3126.3,"lesson":"The mistake section is much more interesting because I removed all the noise. Before, the system picked up on a lot of made-up mistakes instead of real ones.","examples":[{"sentence":"The software is designed to pick up on subtle changes in the user's behavior.","pattern":"pick up on + noun"},{"sentence":"She was very sensitive and quickly picked up on his feelings of disappointment.","pattern":"pick up on + abstract noun"},{"sentence":"The security system can pick up on unauthorized access attempts in real-time.","pattern":"can + pick up on"},{"sentence":"I'm glad you picked up on that small detail; it makes a big difference.","pattern":"pick up on + specific detail"}],"more_examples":["I'm not sure if I picked up on any sarcasm in his voice.","The detective was trained to pick up on tiny inconsistencies in a suspect's story.","Good teachers can pick up on a student's frustration even when they don't say anything."],"synonyms":["notice","detect","sense","perceive","spot","identify","catch on to","observe","discern","recognize"],"antonyms":["overlook","ignore","miss","disregard","neglect"],"gap":{"sentence":"The manager didn't say anything, but she seemed to _____ the fact that the team was unhappy with the new schedule.","answer":"pick up on","options":["pick up on","discuss","explain","announce"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/312794-313053.webm","at":3128.1,"dur":2.59}},{"term":"made up","pos":"adjective","definition":"Invented or created by imagination rather than being real or based on facts.","time":3127.6,"lesson":"I removed all the noise from the system. Before, it picked up a lot of made up mistakes that weren't actually real.","examples":[{"sentence":"He didn't have an excuse, so he just made up a story about his car breaking down.","pattern":"make up + noun"},{"sentence":"I don't want to hear any made up excuses for why the project is late.","pattern":"made up + noun"},{"sentence":"The characters in the movie were entirely made up by the screenwriter.","pattern":"be + made up"},{"sentence":"She told a made-up story to entertain the children.","pattern":"made-up (hyphenated adjective) + noun"}],"more_examples":["I'm not looking for a made-up solution; I need a plan that actually works.","The news report was based on made-up information from an unreliable source.","He tried to pass the test using made-up answers for the questions he didn't know."],"synonyms":["fictional","imaginary","fabricated","false","invented","mythical"],"antonyms":["real","factual","true","authentic","genuine","actual"],"gap":{"sentence":"The news report was completely _____, which is why the police couldn't find any evidence to support the claims.","answer":"made up","options":["made up","true","official","accurate"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/312576-313753.webm","at":3126.0,"dur":11.77}},{"term":"ai-driven","pos":"adjective","definition":"powered or controlled by artificial intelligence technologies.","time":3234.0,"lesson":"There is no way out, and it costs a lot of money to make a really good ai-driven application. It requires a lot of tokens.","examples":[{"sentence":"The company is developing an ai-driven tool to automate customer service.","pattern":"ai-driven + noun"},{"sentence":"Many modern logistics companies use ai-driven systems to optimize delivery routes.","pattern":"use + ai-driven + systems"},{"sentence":"Is this software ai-driven, or does it rely on manual data entry?","pattern":"Is [subject] ai-driven...?"},{"sentence":"The shift toward ai-driven healthcare is changing how patients receive diagnoses.","pattern":"ai-driven + [noun phrase]"}],"more_examples":["The bank uses an ai-driven algorithm to detect fraudulent transactions.","Many artists are exploring how ai-driven tools can enhance their creative process.","The school is implementing ai-driven tutoring programs to help students with personalized learning."],"synonyms":["AI-powered","machine-learning-based","algorithm-based"],"antonyms":["manual","human-operated","traditional","non-automated"],"gap":{"sentence":"The company launched an _____ chatbot to handle thousands of customer inquiries instantly without any human intervention.","answer":"ai-driven","options":["ai-driven","manual","human-led","slow"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/323198-323684.webm","at":3232.1,"dur":4.86}},{"term":"nevertheless","pos":"adverb","definition":"In spite of that; used to introduce a statement that contrasts with what was just said.","time":3322.8,"lesson":"I am not sure how much longer the GPU will stay functional. Nevertheless, I highly recommend that you check it out.","examples":[{"sentence":"The team faced many challenges; nevertheless, they finished the project on time.","pattern":"Sentence; nevertheless, sentence"},{"sentence":"It was a very difficult exam, but he passed it nevertheless.","pattern":"verb + object + nevertheless"},{"sentence":"The weather was terrible; nevertheless, we decided to go for a hike.","pattern":""},{"sentence":"The instructions are complicated; nevertheless, you should try to follow them step by step.","pattern":"Nevertheless + subject + verb"}],"more_examples":["The company is facing a financial crisis; nevertheless, it plans to expand into new markets.","I knew the movie would be long; nevertheless, I enjoyed every minute of it.","He has a very busy schedule; nevertheless, he finds time to exercise every morning."],"synonyms":["however","still","nonetheless","all the same","even so","despite that","in spite of that"],"antonyms":["therefore","consequently","as a result","thus","so","accordingly","hence"],"gap":{"sentence":"The hotel room was quite small and old; _____, we enjoyed our stay because it was very clean.","answer":"nevertheless","options":["nevertheless","consequently","similarly","instead"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/332364-332706.webm","at":3323.8,"dur":3.42}},{"term":"feeling of closure","pos":"noun phrase","definition":"A sense of satisfaction or completion after finishing a task or reaching a goal.","time":3352.0,"lesson":"The app has quizzes now. You get this feeling of closure when you have completed about 50 vocabulary entries.","examples":[{"sentence":"I finally finished the last chapter of the book and felt a great sense of closure.","pattern":"feel a sense of closure"},{"sentence":"Completing the project gave her the feeling of closure she needed to move on.","pattern":"give someone the feeling of closure"},{"sentence":"Checking off every item on my to-do list gives me a real feeling of closure.","pattern":""}],"countable":[],"uncountable":[{"meaning":"A sense of satisfaction or completion after finishing a task or reaching a goal.","example":"You get this feeling of closure when you have completed about 50 vocabulary entries.","lesson":true}],"more_examples":["After years of legal battles, the settlement provided a much-needed feeling of closure.","The final whistle of the game brought a profound feeling of closure to the season."],"synonyms":["sense of completion","sense of finality","sense of accomplishment","resolution","sense of fulfillment"],"antonyms":["sense of incompleteness","unfinished business","lingering uncertainty","feeling of suspension"],"gap":{"sentence":"After years of working on the renovation, finally seeing the finished house gave him a real _____.","answer":"feeling of closure","options":["feeling of closure","feeling of confusion","feeling of anxiety","feeling of boredom"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/335104-335596.webm","at":3351.2,"dur":4.92}},{"term":"most of these words","pos":"noun phrase","definition":"the majority of the specific vocabulary items previously identified or discussed during the lesson","time":3422.2,"lesson":"You used to turn on auto-captions to look up new vocabulary. Now, most of these words are going to be in the review section so you can check them there.","examples":[{"sentence":"I've highlighted several new terms, so most of these words should appear in your homework.","pattern":"most of these [plural noun] + [verb]"},{"sentence":"You don't need to memorize everything; most of these words are common in daily conversation.","pattern":"most of these [plural noun] + are + [adjective]"},{"sentence":"Most of these words are quite difficult to pronounce at first.","pattern":""},{"sentence":"I'm going to put most of these words into a flashcard app for you.","pattern":""}],"countable":[{"meaning":"the majority of the specific vocabulary items previously identified or discussed during the lesson","example":"Now, most of these words are going to be in the review section so you can check them there.","lesson":true}],"uncountable":[],"more_examples":["I think most of these words will be useful for your upcoming trip.","Most of these words are related to the topic of environmental issues.","You should try to use most of these words in your next essay."],"synonyms":["most of the vocabulary","most of these terms","most of these expressions"],"antonyms":["few of these words","none of these words"],"gap":{"sentence":"I have listed several new terms on the board, but you only need to learn _____ for the test.","answer":"most of these words","options":["most of these words","all of these words","none of these words","both of these words"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/342066-342440.webm","at":3420.9,"dur":3.74}},{"term":"can't get over","pos":"idiom","definition":"To be very shocked, surprised, or unable to stop thinking about something.","time":3595.3,"lesson":"I can't get over the fact that now I will imagine Jesus Christ being fat and hairy. Every time I see Jesus Christ, I will imagine how he resembles your husband.","examples":[{"sentence":"I can't get over how much your daughter has grown since last summer.","pattern":"can't get over + how"},{"sentence":"I still can't get over the news that they are moving to another country.","pattern":"can't get over + the fact that"},{"sentence":"She just can't get over her ex-boyfriend's behavior.","pattern":"can't get over + [noun phrase]"},{"sentence":"I can't get over how delicious this cake is!","pattern":"can't get over + [clause]"}],"more_examples":["I can't get over how much the city has changed in just five years.","I still can't get over the fact that we actually won the championship.","I can't get over how complicated the instructions for this furniture are."],"synonyms":["be shocked by","be stunned by","be amazed by","be surprised by","be taken aback by","be blown away by"],"antonyms":["get used to","accept","ignore"],"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/359464-359999.webm","at":3594.7,"dur":5.35}},{"term":"resemble","pos":"verb","definition":"to look like or be similar to someone or something else in appearance.","time":3608.9,"lesson":"I can't get over the fact that now I will imagine Jesus Christ being fat and hairy. Every time I see him, I will imagine how he resembles your husband.","examples":[{"sentence":"The son resembles his father more and more as he gets older.","pattern":"subject + resemble + object"},{"sentence":"The two sisters resemble each other closely.","pattern":"resemble + each other"},{"sentence":"Does your new car resemble the one you had before?","pattern":""},{"sentence":"The sculpture resembles a bird in flight.","pattern":"resemble + inanimate object"}],"more_examples":["The new hotel building resembles the classic architecture of the old town.","The clouds in the sky resemble giant cotton balls.","Her handwriting resembles her mother's so much that I can't tell them apart."],"synonyms":["look like","bear a resemblance to","be similar to"],"antonyms":["differ from","contrast with","be unlike"],"gap":{"sentence":"The twin brothers are so similar that they _____ each other perfectly in every photograph.","answer":"resemble","options":["resemble","prefer","require","remain"]},"clip":{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/361006-361259.webm","at":3610.3,"dur":2.53}}],"dialogues":[{"title":"Perfume shopping and local development","lines":[{"speaker":"A","text":"Do I seem to be speaking smoothly, or do I freeze up at times?","highlights":["freeze up"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/000144-000559.webm","at":1.6,"dur":4.15}]},{"speaker":"B","text":"I'm running some stuff on my laptop right now. I bought a lot of perfume testers because it's autumn and I'm ready to buy something.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/002031-003055.webm","at":20.4,"dur":10.24},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/005128-006463.webm","at":51.5,"dur":13.35}]},{"speaker":"A","text":"What kind of perfumes did you get?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/006706-006949.webm","at":67.2,"dur":2.43}]},{"speaker":"B","text":"They are women's perfumes. I prefer the small ones, like 'Juliet has a gun'. They were made by the grandson of Nina Ricci.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/007208-008507.webm","at":72.2,"dur":12.99},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/008770-009333.webm","at":87.9,"dur":5.63}]},{"speaker":"A","text":"Who was Nina Ricci? Was she the first woman to start producing perfume?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/009554-010958.webm","at":95.7,"dur":14.04},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/012532-013113.webm","at":125.5,"dur":5.81}]},{"speaker":"B","text":"No, she wasn't the first, but she was a very popular perfumer. Her grandson made more unisex scents, but mostly for women. One is for a funeral of your ex.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/013148-014430.webm","at":131.7,"dur":12.82}]},{"speaker":"A","text":"My husband told me that perfume is 'bitchy'. What does that mean?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/019304-020349.webm","at":193.1,"dur":10.45}]},{"speaker":"B","text":"No, it's not 'bitchy'. The word you're looking for is 'slutty'. The scent is salt, vanilla, and citrus.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/021008-021293.webm","at":210.3,"dur":2.85},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/022324-023788.webm","at":223.4,"dur":14.64}]},{"speaker":"A","text":"I've redesigned the review section and I'm running it locally on a model called Gemma. It's taking up 70 percent of my CPU and 100 percent of my GPU.","highlights":["taking up"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/038108-039571.webm","at":381.3,"dur":14.63}]},{"speaker":"B","text":"I ordered the testers from a company in Paris rather than a reseller. It's cheaper than trying to find them in Stockmann.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/046862-048310.webm","at":468.7,"dur":14.48}]},{"speaker":"A","text":"What is Stockmann? What do they sell there?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/058402-058789.webm","at":584.2,"dur":3.87}]}],"time":1.6,"topic":0},{"title":"Shopping for perfumes and Halloween prep","lines":[{"speaker":"A","text":"Stockmann is the biggest mall with the most expensive products. What kind of things do they sell there?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/058789-060071.webm","at":588.0,"dur":12.82}]},{"speaker":"B","text":"I tried to find some interesting scents for my husband as a gift. I gave him one and he said it was really cool.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/061658-062539.webm","at":616.7,"dur":8.81},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/062996-064582.webm","at":630.2,"dur":15.86}]},{"speaker":"A","text":"He really loves perfumes, but I'm not a big fan. I've used the same one or two bottles my whole life. Isn't that boring?","highlights":["big fan"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/066482-067677.webm","at":664.9,"dur":11.95}]},{"speaker":"B","text":"I bought a lot of testers. If I like one, I'll buy a bigger bottle. For example, I upgraded from a 1.5ml tester to a 5ml one.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/068916-069487.webm","at":689.4,"dur":5.71},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/070200-071667.webm","at":702.1,"dur":14.67}]},{"speaker":"A","text":"Your husband uses perfume much more often than you do. Why did you take him to Stockmann, but then you ordered a perfume from Paris?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/072578-073341.webm","at":726.0,"dur":7.63},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/073882-074974.webm","at":739.0,"dur":10.92}]},{"speaker":"B","text":"We just went to the cafe in that supermarket. I needed to buy cutlets for my son, and I wanted to smell everything because we don't have these scents in Latvia.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/075334-076884.webm","at":753.5,"dur":15.5},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/077838-078912.webm","at":778.6,"dur":10.74}]},{"speaker":"A","text":"You have such a vivid imagination! You'll smell like Paris in Riga. My husband says you have a negative vision, but I'm just joking.","highlights":["vivid imagination"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/080222-080619.webm","at":802.3,"dur":3.97},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/081722-082663.webm","at":817.4,"dur":9.41}]},{"speaker":"B","text":"I love the vanilla wipes. They have cozy summer vibes. It's not a hardcore super sweet vanilla, just a little bit.","highlights":["cozy summer vibes"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/085790-086903.webm","at":858.1,"dur":11.13},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/087354-088576.webm","at":873.7,"dur":12.22}]},{"speaker":"A","text":"I see you're already preparing for Halloween with that cup. Wouldn't a steel mug be a better choice for your son?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/089116-089601.webm","at":891.4,"dur":4.85},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/089818-091119.webm","at":898.4,"dur":13.01}]},{"speaker":"B","text":"He usually uses glass, and that's fine. I noticed some perfumes are marked as unisex, like 'Wood'.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/092810-093581.webm","at":928.2,"dur":7.71},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/097630-099165.webm","at":976.5,"dur":15.35}]},{"speaker":"A","text":"What is 'Wood'? I'll be back in a minute. Oh, this one smells like an old dead horse!","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/101164-101671.webm","at":1011.8,"dur":5.07},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/113612-115003.webm","at":1136.3,"dur":13.91}]},{"speaker":"B","text":"What did your developer want from you? I asked him to add the user's browser language to the settings, and he asked why we needed that.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/117240-118779.webm","at":1172.5,"dur":15.39}]}],"time":588.0,"topic":0},{"title":"Discussing perfumes and clothing vocabulary","lines":[{"speaker":"A","text":"I heard they're working on transmitting smells over the internet. They're actually very close to making it happen.","highlights":["very close to"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/123818-125016.webm","at":1238.3,"dur":11.98}]},{"speaker":"B","text":"That sounds like science fiction to me. I'm not sure I buy that.","highlights":["science fiction"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/125226-126265.webm","at":1252.5,"dur":10.39}]},{"speaker":"A","text":"I'm looking for a brand called Bold Collection. It's a really cool title, similar to Juliet has a Gun.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/127166-127667.webm","at":1271.8,"dur":5.01},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/128774-129274.webm","at":1287.9,"dur":5.0}]},{"speaker":"B","text":"When we talk about scents, we have great words. For example, we can use 'pungent' for a very strong or unpleasant smell.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/134903-135890.webm","at":1349.2,"dur":9.87}]},{"speaker":"A","text":"If someone wears a perfume and leaves a scent behind them everywhere they walk, that's called a pervasive smell.","highlights":["pervasive smell"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/136288-137829.webm","at":1363.0,"dur":15.41}]},{"speaker":"B","text":"I'm curious about the word 'bold.' In a dictionary, it means brave or having a strong presence, but for a developer like me, it just means fat.","highlights":["strong presence"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/140752-141079.webm","at":1407.7,"dur":3.27},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/141874-142477.webm","at":1418.9,"dur":6.03}]},{"speaker":"A","text":"They delivered my package this morning. They're also sending me a faux fur bucket hat after our lesson.","highlights":["faux fur"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/148062-148582.webm","at":1480.8,"dur":5.2},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/149502-150637.webm","at":1495.1,"dur":11.35}]},{"speaker":"B","text":"I used a translator to find the term 'bucket hat.' I thought it was a Panama hat, but it's actually a bucket hat.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/155774-157142.webm","at":1557.8,"dur":13.68}]},{"speaker":"A","text":"The best scent in their collection is 'Oud.' It's a specific word associated with Middle Eastern or North African music.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/161470-162199.webm","at":1614.9,"dur":7.29},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/165170-165940.webm","at":1651.9,"dur":7.7}]},{"speaker":"B","text":"The names like 'Moscow Mule' are so random. I don't understand the naming convention at all.","highlights":["naming convention"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/169490-170468.webm","at":1695.0,"dur":9.78}]},{"speaker":"A","text":"How do you ensure your sense of smell is still sharp after trying so many different perfumes?","highlights":["sense of smell"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/171800-172780.webm","at":1718.2,"dur":9.8}]}],"time":1238.3,"topic":0},{"title":"Translating apps with AI and vectors","lines":[{"speaker":"A","text":"I'm curious about how you plan to translate your app into multiple languages using AI, since AI often lacks the context for specific button names.","highlights":["lacks the context"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/177736-179289.webm","at":1777.5,"dur":15.53}]},{"speaker":"B","text":"Exactly. But for words, we don't use a standard translator; we use vector search to find the right terms.","highlights":["standard translator"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/181288-182437.webm","at":1813.0,"dur":11.49}]},{"speaker":"A","text":"So, if you have a vector for 'man' and 'power,' they combine to form 'king.' How do you find the word for 'queen' then?","highlights":["combine to form"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/183960-185422.webm","at":1839.7,"dur":14.62}]},{"speaker":"B","text":"You'd take 'king' minus 'gender' plus 'woman.' I actually moved away from RAG because it was too complex for my needs.","highlights":["moved away from"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/192524-193331.webm","at":1925.3,"dur":8.07},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/196182-197185.webm","at":1962.0,"dur":10.03}]},{"speaker":"A","text":"Did you stop working with RAG entirely at some point?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/201146-201569.webm","at":2012.0,"dur":4.23},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/202724-203162.webm","at":2027.4,"dur":4.38}]},{"speaker":"B","text":"I switched to event keys because I'm searching for the latest news, which doesn't require searching through thousands of keys.","highlights":["switched to"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/197200-198009.webm","at":1972.2,"dur":8.09},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/198336-199497.webm","at":1983.6,"dur":11.61}]},{"speaker":"A","text":"I don't really like perfumes that smell like flowers. I'm not the type of person who loves that scent.","highlights":["the type of person"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/206598-207726.webm","at":2066.1,"dur":11.28}]},{"speaker":"B","text":"I like natural flower scents, but only when they aren't too overpowering. My favorite is the Protea, which looks like a big cabbage.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/209128-210566.webm","at":2091.4,"dur":14.38}]},{"speaker":"A","text":"I'll look that up. I also like flowers from a bush; they are very beautiful to draw.","highlights":["look that up"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/212196-213585.webm","at":2122.1,"dur":13.89}]},{"speaker":"B","text":"So, how are you going to handle the translation setup for that then?","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/217684-218245.webm","at":2177.0,"dur":5.61}]}],"time":1777.5,"topic":1},{"title":"AI localization and the psychology of scents","lines":[{"speaker":"A","text":"You can just feed your project into an AI to handle the localization based on the user's browser language.","highlights":["handle the localization"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/218850-220208.webm","at":2188.7,"dur":13.58}]},{"speaker":"B","text":"I see, but how are you going to translate it into Spanish? You need to give the AI the entire project to understand the context.","highlights":["understand the context"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/220836-221145.webm","at":2208.5,"dur":3.09},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/223796-224358.webm","at":2238.2,"dur":5.62}]},{"speaker":"A","text":"Since it's routine work, the AI can easily generate files for Russian, English, and Spanish. You just need to link the keys in your front-end files.","highlights":["routine work"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/227358-228709.webm","at":2273.7,"dur":13.51},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/229602-229932.webm","at":2296.2,"dur":3.3}]},{"speaker":"B","text":"It sounds simple. Instead of hiring a developer, why not just use Claude? Why do you need a person to deal with?","highlights":["hiring a developer"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/233942-234814.webm","at":2339.5,"dur":8.72}]},{"speaker":"A","text":"Well, my husband actually hired a guy and spent a lot of money and time to protect him from mobilization because the company would die without him.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/235532-236825.webm","at":2355.4,"dur":12.93}]},{"speaker":"B","text":"Imagine if they just used AI to translate those fancy French names. They might lose their charm and end up sounding like cheap banana bubble gum.","highlights":["lose their charm"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/243690-244294.webm","at":2437.0,"dur":6.04},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/246598-247575.webm","at":2466.1,"dur":9.77}]},{"speaker":"A","text":"Exactly. Women's perfumes often smell like a cheap flower shop. I think men's fragrances are better because they don't smell so infantile.","highlights":["smell like"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/249228-250833.webm","at":2492.4,"dur":16.05}]},{"speaker":"B","text":"I've never thought much about smells, but maybe they play an important role in our lives. Maybe some scents act as aphrodisiacs?","highlights":["play an important role"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/253938-254286.webm","at":2539.5,"dur":3.48},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/256854-257867.webm","at":2568.7,"dur":10.13}]},{"speaker":"A","text":"It's a bit of a myth, but it's true that certain smells are perceived by our brains as more attractive.","highlights":["a bit of a myth"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/258862-259916.webm","at":2588.8,"dur":10.54}]},{"speaker":"B","text":"I personally don't like girlish scents. This company has a very distinct fragrance, not just a standard perfume.","highlights":["distinct fragrance"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/261240-262121.webm","at":2612.5,"dur":8.81},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/262392-263025.webm","at":2624.0,"dur":6.33}]}],"time":2188.7,"topic":2},{"title":"Perfumes, Books, and Creative Projects","lines":[{"speaker":"A","text":"That perfume is really popular. It's described as a clean, unusual scent, and it's a must-try for any perfume maniac.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/264968-266448.webm","at":2649.9,"dur":14.8}]},{"speaker":"B","text":"I'm not sure if it's actually that interesting. I don't know how to describe it, but some people love it and others hate it.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/267704-268306.webm","at":2677.1,"dur":6.02},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/271844-272485.webm","at":2718.5,"dur":6.41}]},{"speaker":"A","text":"My son is a bit of a book maniac now. He doesn't read by himself, but he constantly asks me to read books to him.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/278906-280036.webm","at":2789.2,"dur":11.3}]},{"speaker":"B","text":"I'd love to read, but I'm swamped. I just finished one project and I have to start another one involving period planning apps.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/282954-284335.webm","at":2829.7,"dur":13.81}]},{"speaker":"A","text":"You need to take some time for yourself. I need to sniff out some scents, but I hate going to crowded places like Stockmann's where sales staff flock at you.","highlights":["sniff out","flock at"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/286206-287716.webm","at":2862.2,"dur":15.1}]},{"speaker":"B","text":"After the period app, I need to finish my project about selling elven books. I have a lot of readers who want more of that series.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/290606-291927.webm","at":2906.2,"dur":13.21}]},{"speaker":"A","text":"Once you get people invested in your story, they'll read anything. Sometimes all it takes is one interesting idea or method.","highlights":["all it takes"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/293918-294484.webm","at":2939.3,"dur":5.66},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/295396-296708.webm","at":2954.2,"dur":13.12}]},{"speaker":"B","text":"I remember watching shitty shows as a kid just because they had one great idea, like vampires. People will watch anything if it has a hook.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/297190-298202.webm","at":2972.0,"dur":10.12}]},{"speaker":"A","text":"People are tired of fantasy stereotypes like orcs and goblins. They want something new and interesting.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/300832-302158.webm","at":3008.4,"dur":13.26}]},{"speaker":"B","text":"I'm trying to generate things at a very high pace. I actually spent all day yesterday redesigning the review section, and it looks really cool now.","highlights":["high pace"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/309094-309400.webm","at":3091.0,"dur":3.06},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/311028-311638.webm","at":3110.5,"dur":6.1}]}],"time":2649.9,"topic":3},{"title":"AI language learning and perfume stories","lines":[{"speaker":"A","text":"The mistake section is much more interesting now because I've removed all the noise. It doesn't pick up made-up mistakes anymore since I'm running it locally.","highlights":["pick up"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/312002-312523.webm","at":3120.2,"dur":5.21}]},{"speaker":"B","text":"If you're building an English learning app, you have to use AI because people want high levels of personalization.","highlights":["high levels of"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/314706-315726.webm","at":3147.2,"dur":10.2}]},{"speaker":"A","text":"That's the problem. You have to pay for the server and the API calls. It's incredibly expensive to run an AI-driven application for multiple users.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/316308-317528.webm","at":3163.2,"dur":12.2}]},{"speaker":"B","text":"I noticed that too. Even though the quality improved, the number of AI calls skyrocketed from 50 to 1,500 because the system has to check every small detail.","clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/318006-319231.webm","at":3180.2,"dur":12.25}]},{"speaker":"A","text":"I can generate a class on my computer, but my GPU has to run at full capacity for about seven hours. I'm not sure how much longer it can stay functional.","highlights":["full capacity"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/329260-330497.webm","at":3292.7,"dur":12.37},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/330720-331021.webm","at":3307.4,"dur":3.01}]},{"speaker":"B","text":"You should still check it out. It lists more mistakes, has a larger vocabulary, and the dialogue section is much cooler with quizzes and matching pairs.","highlights":["check it out"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/332364-333496.webm","at":3323.8,"dur":11.32}]},{"speaker":"A","text":"The best part is the dialogue. You can hear the exact piece of dialogue where you made a specific mistake. It's a very cool feature.","highlights":["best part"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/339436-340467.webm","at":3394.6,"dur":10.31}]},{"speaker":"B","text":"You can also listen to every word in the transcript just by selecting it. Also, you often use the 'I'm' pattern for the past tense, like saying 'I'm heard'.","highlights":["past tense"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/343112-344213.webm","at":3431.3,"dur":11.01},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/348042-348648.webm","at":3480.5,"dur":6.06}]},{"speaker":"A","text":"My husband bought a really expensive unisex perfume. It has a heavy scent that suits me, but it makes my husband smell like old soap.","highlights":["heavy scent"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/351850-352720.webm","at":3518.6,"dur":8.7},{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/355326-356726.webm","at":3553.4,"dur":14.0}]},{"speaker":"B","text":"I can't get over the fact that I now imagine Jesus Christ as fat and hairy, resembling your husband!","highlights":["get over"],"clips":[{"src":"lesson_audio/lesson_date_30-09-2026_time_16-02-18/359374-360830.webm","at":3593.9,"dur":14.56}]}],"time":3120.2,"topic":4}]};

            const symbol = section => `<svg class="sym" aria-hidden="true" focusable="false"><use href="#sym-${section}"/></svg>`;

            const lesson = LESSON || {};
            const meta = lesson.meta || {};
            const mistakes = lesson.mistakes || [];
            // Graded lessons: every card has a grade 1-7 (a card without one
            // gets the grade nearest its old level); otherwise the old levels.
            const hasGrade = card => Number.isInteger(card.grade) && card.grade >= 1 && card.grade <= 7;
            const graded = mistakes.some(hasGrade);
            const gradeOf = card => hasGrade(card) ? card.grade : ({ high: 4, medium: 5, low: 6 }[card.severity] || 5);
            const vocabulary = lesson.vocabulary || [];
            const dialogues = lesson.dialogues || [];

            // --------------------------------------------------------- helpers
            function esc(value) {
                return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
            }

            function norm(word) {
                return word.toLowerCase().replace(/’/g, "'").replace(/[^\p{L}\p{N}']/gu, '');
            }

            function stem(word) {
                let w = norm(word).replace(/'s$/, '');
                if (IRREGULAR[w]) return IRREGULAR[w];
                for (const suffix of ['ing', 'ied', 'ies', 'ed', 'es', 's', 'ly']) {
                    if (w.endsWith(suffix) && w.length - suffix.length >= 3) { w = w.slice(0, -suffix.length); break; }
                }
                return w.replace(/e+$/, '');
            }

            function playButton(text, label) {
                return `<button class="play" type="button" data-say="${esc(text)}" aria-label="${esc(label || 'Listen')}" data-no-speech>${icons.play}</button>`;
            }

            // A clip of the lesson recording: a pill with the time it was said,
            // which opens into a small player when tapped.
            function clipHtml(clip, label) {
                if (!clip || !clip.src) return '';
                const at = clock(clip.at);
                return `<span class="clip" data-src="${esc(clip.src)}" data-no-speech>`
                    + `<button class="clip-main" type="button" title="${esc(label)}" aria-label="${esc(label)}, ${at}">${icons.clipPlay}${icons.clipPause}<span>${at}</span></button>`
                    + '<span class="clip-more">'
                    + `<button class="clip-skip" type="button" data-skip="-3" title="Back 3 seconds" aria-label="Back 3 seconds">${icons.back3}</button>`
                    + '<span class="clip-bar" role="slider" tabindex="0" aria-label="Position in the clip" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="clip-fill"></span></span>'
                    + `<button class="clip-skip" type="button" data-skip="3" title="Forward 3 seconds" aria-label="Forward 3 seconds">${icons.forward3}</button>`
                    + '</span></span>';
            }

            // Word diff (longest common subsequence) between what was said and the fix.
            function diff(before, after) {
                const a = before.split(/\s+/).filter(Boolean);
                const b = after.split(/\s+/).filter(Boolean);
                const n = a.length, m = b.length;
                const table = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
                for (let i = n - 1; i >= 0; i--) {
                    for (let j = m - 1; j >= 0; j--) {
                        table[i][j] = norm(a[i]) === norm(b[j]) ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
                    }
                }
                const left = [], right = [];
                let i = 0, j = 0;
                while (i < n || j < m) {
                    if (i < n && j < m && norm(a[i]) === norm(b[j])) {
                        left.push({ word: a[i++], kind: 'same' });
                        right.push({ word: b[j++], kind: 'same' });
                    } else if (j >= m || (i < n && table[i + 1][j] >= table[i][j + 1])) {
                        const word = a[i];
                        const previous = i > 0 ? norm(a[i - 1]) : '';
                        const noise = FILLERS.has(norm(word)) || norm(word) === previous || !norm(word);
                        left.push({ word, kind: noise ? 'same' : 'del' });
                        i++;
                    } else {
                        // Mark where a missing word belongs, unless a deletion already shows the spot.
                        const last = left[left.length - 1];
                        if (!last || (last.kind !== 'del' && last.kind !== 'gap')) left.push({ kind: 'gap' });
                        right.push({ word: b[j++], kind: 'ins' });
                    }
                }
                const render = (tokens, tag) => tokens.map(t => {
                    if (t.kind === 'gap') return '<span class="gap" aria-hidden="true"></span>';
                    return t.kind === 'same' ? esc(t.word) : `<${tag} class="w">${esc(t.word)}</${tag}>`;
                }).join(' ').replace(/<\/(del|ins)> <\1 class="w">/g, ' ');
                return { said: render(left, 'del'), fixed: render(right, 'ins') };
            }

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {
                    if (!hit[index] && functional.has(norm(part))) {
                        const near = [index - 2, index + 2].some(k => hit[k]);
                        if (near) hit[index] = true;
                    }
                });
                return parts.map((part, index) => {
                    if (!hit[index]) return esc(part);
                    // Underline the word itself, not quotes or punctuation stuck to it.
                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                    return `${esc(before)}<b class="hl">${esc(core)}</b>${esc(after)}`;
                }).join('');
            }

            // link(phrase): the vocabulary entry of a highlighted phrase, or -1.
            function highlightPhrases(text, phrases, link) {
                const lower = text.toLowerCase();
                const ranges = [];
                (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length, phrase]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end, phrase]) => {
                    const word = link ? link(phrase) : -1;
                    const opens = word >= 0 ? ` data-vocab="${word}" title="${esc(`See “${vocabulary[word].term}” in Vocabulary`)}"` : '';
                    html += esc(text.slice(cursor, start)) + `<mark class="expr"${opens}>${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {
                    if (value === undefined) return window.localStorage.getItem(key);
                    window.localStorage.setItem(key, value);
                } catch (_error) {
                    return null;
                }
                return null;
            }

            // ---------------------------------------------------------- header
            document.getElementById('title').textContent = meta.title || 'Lesson review';

            // The lesson time in Moscow time (meta.start_utc: when the lesson
            // began, in seconds since 1970). A tap shows it in the reader's own
            // time zone instead, remembered on the phone. Older pages have no
            // start_utc: the date and time as recorded, with no zone.
            const eyebrow = document.getElementById('eyebrow');
            const lessonStart = typeof meta.start_utc === 'number' && isFinite(meta.start_utc) ? new Date(meta.start_utc * 1000) : null;
            let lessonTimes = null;
            let ownZone = storage('lesson-time-zone') === 'own';

            function zoneTime(zone) {
                const date = { day: 'numeric', month: 'long', year: 'numeric' };
                const time = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
                if (zone) { date.timeZone = zone; time.timeZone = zone; }
                return {
                    date: new Intl.DateTimeFormat('en-GB', date).format(lessonStart),
                    time: new Intl.DateTimeFormat('en-GB', time).format(lessonStart)
                };
            }

            function offsetName(minutes) {
                const size = Math.abs(minutes);
                if (!size) return 'GMT';
                return 'GMT' + (minutes < 0 ? '-' : '+') + Math.floor(size / 60) + (size % 60 ? ':' + String(size % 60).padStart(2, '0') : '');
            }

            if (lessonStart) {
                try {
                    const moscow = zoneTime('Europe/Moscow');
                    const own = zoneTime(null);
                    lessonTimes = {
                        moscow: Object.assign(moscow, { zone: 'MSK', name: 'Moscow time' }),
                        own: Object.assign(own, { zone: offsetName(-lessonStart.getTimezoneOffset()), name: 'your time' }),
                        differ: moscow.date !== own.date || moscow.time !== own.time
                    };
                } catch (_error) {
                    lessonTimes = null;  // no time zones in this browser: the time as recorded
                }
            }

            function showLessonTime() {
                let date = meta.date;
                if (!lessonTimes) {
                    eyebrow.textContent = ['English lesson', meta.date, meta.time].filter(Boolean).join(' · ');
                } else {
                    const shown = lessonTimes.differ && ownZone ? lessonTimes.own : lessonTimes.moscow;
                    const other = shown === lessonTimes.own ? lessonTimes.moscow : lessonTimes.own;
                    const time = `${esc(shown.time)} <span class="tz">${esc(shown.zone)}</span>`;
                    date = shown.date;
                    eyebrow.innerHTML = `English lesson · ${esc(shown.date)} · `
                        + (lessonTimes.differ
                            ? `<button class="tz-btn" type="button" title="Show ${esc(other.name)} (${esc(other.zone)})" aria-label="${esc(`${shown.time} ${shown.name}. Show ${other.name}, ${other.zone}`)}">${time}</button>`
                            : `<span class="tz-time">${time}</span>`);
                }
                document.title = (meta.title ? meta.title + ' · ' : '') + 'English lesson' + (date ? ' · ' + date : '');
            }
            showLessonTime();
            eyebrow.addEventListener('click', event => {
                if (!event.target.closest('.tz-btn')) return;
                ownZone = !ownZone;
                storage('lesson-time-zone', ownZone ? 'own' : 'moscow');
                showLessonTime();
                const button = eyebrow.querySelector('.tz-btn');
                if (button && event.detail === 0) button.focus();  // kept for the keyboard
            });

            document.getElementById('count-mistakes').textContent = mistakes.length;
            document.getElementById('count-vocabulary').textContent = vocabulary.length;
            document.getElementById('count-dialogues').textContent = dialogues.length;

            // -------------------------------------------------------- mistakes
            const topics = lesson.topics || [];
            // Each mistake example, word and dialogue line can be found by the timeline.
            const exampleIds = new Map();
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => exampleIds.set(example, `m-${c}-${e}`)));
            let showAllMistakes = () => {};
            let vocabularyToWords = () => {};
            // What "Go back" needs to put a section back as it was.
            let mistakeFilter = () => 'all';
            let setMistakeFilter = () => {};
            let vocabularyView = () => 'words';
            let setVocabularyView = () => {};

            function clock(seconds) {
                if (seconds === null || seconds === undefined) return '';
                const total = Math.max(0, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const rest = String(total % 60).padStart(2, '0');
                return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
            }

            function plain(text) {
                return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
            }

            // One example: when it was said, the full sentence(s) as said and
            // corrected, and (where it adds something) its own explanation.
            function exampleHtml(example, options) {
                const before = example.context || example.quote;
                const after = example.context_fix || example.fix;
                const d = diff(before, after);
                // The clip pill needs no separator: it stays apart from the topic when the line wraps.
                const pill = clipHtml(example.clip, 'Hear what was said');
                // The letters beside the time open the same moment in the other sections.
                const jumps = jumpsHtml('mistakes', example.clip ? example.clip.at : example.time);
                const facts = [];
                if (!pill && example.time !== null && example.time !== undefined) facts.push(`<span class="clock">${clock(example.time)}</span>${jumps}`);
                if (options.showTopic && topics[example.topic]) facts.push(`<span>${esc(topics[example.topic].title)}</span>`);
                let html = `<div class="pair" data-item="${exampleIds.get(example) || ''}"${options.hidden ? ' hidden' : ''}>`;
                const separator = jumps && !pill ? '' : '<span class="sep">·</span>';
                if (pill || facts.length) html += `<div class="ex-meta" data-no-speech>${pill}${pill ? jumps : ''}${facts.join(separator)}</div>`;
                html += `<div class="said"><span class="mark-icon" aria-label="What was said" data-no-speech>✗</span><span class="txt">${d.said}</span></div>`;
                html += `<div class="fixed"><span class="mark-icon" aria-label="Better" data-no-speech>✓</span><span class="txt">${d.fixed}</span>${playButton(after, 'Listen to the correct version')}</div>`;
                if (options.why) html += `<p class="ex-why">${esc(options.why)}</p>`;
                return html + '</div>';
            }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
                    html += items.map(item => `<li><span class="meaning">${esc(item.meaning)}</span><span class="m-ex">${highlightTerm(item.example, entry.term)}`
                        + (item.lesson ? ' <span class="from-lesson" data-no-speech>from the lesson</span>' : '') + '</span></li>').join('');
                    return html + '</ol></div>';
                };
                return '<div class="forms">'
                    + column('Countable', 'a / an, plural', entry.countable || [])
                    + column('Uncountable', 'no a / an, no plural', entry.uncountable || [])
                    + '</div>';
            }

            function relatedHtml(entry) {
                const row = (title, words) => (words || []).length
                    ? `<div class="rel"><p class="part-title" data-no-speech>${title}</p><span class="rel-words">${words.map(w => `<span class="rel-word">${esc(w)}</span>`).join('<span class="sep" data-no-speech> · </span>')}</span></div>`
                    : '';
                return row('Synonyms', entry.synonyms) + row('Antonyms', entry.antonyms);
            }

            // Visible: when it was said, the word, the meaning, the lesson's own
            // words and at least three examples. The rest opens on request.
            function wordCardHtml(entry, index) {
                const term = entry.term || '';
                let html = `<article class="card word" id="word-${index}"><div class="w-head">`;
                if (entry.clip) html += clipHtml(entry.clip, 'Hear it in the lesson');
                else if (entry.time !== null && entry.time !== undefined) html += `<span class="clock" data-no-speech>${clock(entry.time)}</span>`;
                html += jumpsHtml('vocabulary', entry.clip ? entry.clip.at : entry.time);
                // The word, its kind and its speaker stay together (a new row when
                // they do not fit); the kind and the speaker never part.
                html += `<div class="w-title"><h3 class="w-term">${esc(term)}</h3><span class="w-side">`;
                if (entry.pos) html += `<span class="w-pos" data-no-speech>${esc(entry.pos)}</span>`;
                html += playButton(term, 'Listen to ' + term) + '</span></div></div>';
                if (entry.definition) html += `<p class="def">${esc(entry.definition)}</p>`;
                const passage = entry.lesson || entry.lesson_example;
                if (passage) {
                    html += `<div class="lesson-ex"><div class="txt"><span class="src" data-no-speech>From the lesson</span>${highlightTerm(passage, term)}</div>${playButton(passage, 'Listen')}</div>`;
                }
                const examples = exampleItems(entry);
                if (examples.length) {
                    html += '<ul class="examples">' + examples.map(example => '<li>'
                        + (example.pattern ? `<span class="pat" data-no-speech>${esc(example.pattern)}</span> ` : '')
                        + highlightTerm(example.sentence, term) + '</li>').join('') + '</ul>';
                }
                if (entry.note) html += `<p class="note">${icons.bulb}<span>${esc(entry.note)}</span></p>`;

                const parts = [];
                if ((entry.countable || []).length || (entry.uncountable || []).length) parts.push(['forms', 'Countable / uncountable', formsHtml(entry)]);
                if ((entry.more_examples || []).length) {
                    parts.push(['more', 'More examples', '<p class="part-title" data-no-speech>More examples</p><ul class="examples">'
                        + entry.more_examples.map(s => `<li>${highlightTerm(s, term)}</li>`).join('') + '</ul>']);
                }
                const related = relatedHtml(entry);
                if (related) parts.push(['related', 'Synonyms & antonyms', related]);
                if (parts.length) {
                    html += '<div class="more-bar" data-no-speech>'
                        + parts.map(([id, name]) => `<button class="more-btn" type="button" data-part="${id}" aria-expanded="false">${name}</button>`).join('')
                        + '<button class="more-btn more-hide" type="button">Hide</button></div>';
                    html += parts.map(([id, , body]) => `<div class="more-part" data-part="${id}" hidden>${body}</div>`).join('');
                }
                return html + '</article>';
            }

            // Matching pairs: all the words, shuffled into rounds of about six;
            // the meanings are shuffled separately.
            function renderMatch(game) {
                const pool = shuffled(matchable);
                const roundCount = Math.ceil(pool.length / 6);
                const rounds = [];
                for (let r = 0, cursor = 0; r < roundCount; r++) {
                    const size = Math.floor(pool.length / roundCount) + (r < pool.length % roundCount ? 1 : 0);
                    rounds.push(pool.slice(cursor, cursor + size));
                    cursor += size;
                }
                let round = 0, misses = 0, picked = null;
                const missText = () => misses === 1 ? '1 mistake' : `${misses} mistakes`;

                function draw() {
                    const ids = rounds[round];
                    let html = `<div class="game-head" data-no-speech><span>Round ${round + 1} of ${rounds.length}</span><span class="game-score">${missText()}</span></div>`;
                    html += '<p class="game-hint" data-no-speech>Tap a word, then its meaning.</p>';
                    html += '<div class="match-board" data-no-speech><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile term" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].term)}</button>`).join('');
                    html += '</div><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile meaning" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].definition)}</button>`).join('');
                    html += '</div></div><div class="game-foot" data-no-speech></div>';
                    game.innerHTML = html;
                    picked = null;
                }

                function roundDone() {
                    const foot = game.querySelector('.game-foot');
                    if (round + 1 < rounds.length) {
                        foot.innerHTML = `<p>Round complete!</p><button class="game-btn" type="button" data-action="next-round">Next round</button>`;
                    } else {
                        foot.innerHTML = `<div class="summary"><p class="big">All ${pool.length} words matched</p><p>${missText()}</p>`
                            + '<button class="game-btn" type="button" data-action="restart">Play again</button></div>';
                    }
                    foot.querySelector('button').focus({ preventScroll: true });
                }

                game.addEventListener('click', event => {
                    const tile = event.target.closest('.tile');
                    if (tile && !tile.disabled) {
                        const side = tile.classList.contains('term') ? 'term' : 'meaning';
                        if (picked === tile) {
                            tile.setAttribute('aria-pressed', 'false');
                            picked = null;
                        } else if (!picked || picked.classList.contains(side)) {
                            if (picked) picked.setAttribute('aria-pressed', 'false');
                            picked = tile;
                            tile.setAttribute('aria-pressed', 'true');
                        } else {
                            const other = picked;
                            picked = null;
                            other.setAttribute('aria-pressed', 'false');
                            if (other.dataset.id === tile.dataset.id) {
                                [other, tile].forEach(t => { t.classList.add('done'); t.disabled = true; });
                                speak(vocabulary[Number(tile.dataset.id)].term);
                                if (!game.querySelector('.tile:not(.done)')) roundDone();
                            } else {
                                misses++;
                                game.querySelector('.game-score').textContent = missText();
                                [other, tile].forEach(t => {
                                    t.classList.remove('wrong');
                                    void t.offsetWidth; // restart the shake
                                    t.classList.add('wrong');
                                    setTimeout(() => t.classList.remove('wrong'), 450);
                                });
                            }
                        }
                        return;
                    }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next-round') { round++; draw(); }
                    if (action.dataset.action === 'restart') renderMatch(freshGame());
                });
                draw();
            }

            // Fill the gap: a new sentence, the word hidden, four options.
            function renderGap(game) {
                const order = shuffled(gapItems);
                let position = 0, score = 0;
                const missed = [];

                function draw() {
                    const { entry } = order[position];
                    const [before, after] = entry.gap.sentence.split(/_{3,}/);
                    let html = `<div class="game-head" data-no-speech><span>${position + 1} of ${order.length}</span><span class="game-score">${score} correct</span></div>`;
                    html += `<div class="card"><p class="gap-sentence">${esc(before)}<span class="blank" data-no-speech>&nbsp;</span>${esc(after || '')}</p>`;
                    html += '<div class="options" data-no-speech>'
                        + shuffled(entry.gap.options).map(o => `<button class="option" type="button" data-option="${esc(o)}">${esc(o)}</button>`).join('')
                        + '</div><div class="gap-result" hidden></div></div>';
                    game.innerHTML = html;
                }

                function answer(button) {
                    const { entry, index } = order[position];
                    const right = button.dataset.option === entry.gap.answer;
                    game.querySelectorAll('.option').forEach(b => {
                        b.disabled = true;
                        if (b.dataset.option === entry.gap.answer) b.classList.add('right');
                    });
                    if (right) score++;
                    else { button.classList.add('wrong'); missed.push(index); }
                    game.querySelector('.game-score').textContent = `${score} correct`;
                    const blank = game.querySelector('.blank');
                    blank.textContent = entry.gap.answer;
                    blank.classList.add('filled');
                    blank.removeAttribute('data-no-speech');
                    const full = entry.gap.sentence.replace(/_{3,}/, entry.gap.answer);
                    const last = position + 1 >= order.length;
                    const result = game.querySelector('.gap-result');
                    result.innerHTML = `<p class="verdict ${right ? 'ok' : 'no'}" data-no-speech>${right ? '✓ Correct' : `✗ The answer is “${esc(entry.gap.answer)}”`}</p>`
                        + `<p class="gap-def"><b>${esc(entry.term)}</b>: ${esc(entry.definition)}</p>`
                        + `<div class="gap-actions" data-no-speech>${playButton(full, 'Listen to the sentence')}`
                        + `<button class="game-btn secondary" type="button" data-word="${index}">See the word</button>`
                        + `<button class="game-btn" type="button" data-action="${last ? 'finish' : 'next'}">${last ? 'Finish' : 'Next'}</button></div>`;
                    result.hidden = false;
                    result.querySelector('[data-action]').focus({ preventScroll: true });
                }

                function finish() {
