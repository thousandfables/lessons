<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        /* Mistake grades, 1 (gravest) to 7: warm colours where the listener
           had trouble understanding (1-4), cool ones where the meaning was
           clear (5-7). The grade's number is always shown with its colour. */
        :root, :root[data-theme="light"], :root[data-theme="sepia"], :root[data-theme="mint"] {
            --g1: #b3261e; --g2: #d9480f; --g3: #c56200; --g4: #a67c00; --g5: #2a62a8; --g6: #5b7fa6; --g7: #5f6673;
        }

        @media (prefers-color-scheme: dark) {
            :root { --g1: #ff6b6b; --g2: #ff8547; --g3: #ffa23a; --g4: #f2c14e; --g5: #6ea8ff; --g6: #9bb3d4; --g7: #a3aabb; }
        }

        :root[data-theme="dark"], :root[data-theme="black"] {
            --g1: #ff6b6b; --g2: #ff8547; --g3: #ffa23a; --g4: #f2c14e; --g5: #6ea8ff; --g6: #9bb3d4; --g7: #a3aabb;
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        /* The section's symbol before its name, in the section's colour. */
        .tab-sym { flex: none; width: 16px; height: 16px; margin-right: -1px; color: var(--lane); }

        .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ---------------------------------------------------- mistake grades */
        .gr1 { --grade: var(--g1); } .gr2 { --grade: var(--g2); } .gr3 { --grade: var(--g3); } .gr4 { --grade: var(--g4); }
        .gr5 { --grade: var(--g5); } .gr6 { --grade: var(--g6); } .gr7 { --grade: var(--g7); }

        /* Marks (numbers, stripes) use the grade's colour; its words use a
           deeper "ink" of it, mixed toward the theme's text so they stay readable. */
        .gr {
            --grade-soft: color-mix(in srgb, var(--grade) 14%, var(--surface));
            --grade-ink: color-mix(in srgb, var(--grade) 66%, var(--text));
        }

        .mistake.gr { --sev: var(--grade); }

        /* The grade's number on its colour. */
        .grade-num {
            display: inline-grid;
            flex: none;
            place-items: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--grade);
            color: var(--surface);
            font-size: 0.7rem;
            font-style: normal;
            font-weight: 800;
            line-height: 1;
        }

        .absent .grade-num, .grade-num.absent { background: transparent; box-shadow: inset 0 0 0 1.5px var(--grade); color: var(--grade); }

        /* On a card: the number and the grade's name, in its colour. */
        .grade-badge {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            padding: 1px 9px 1px 2px;
            border-radius: 999px;
            background: var(--grade-soft);
            color: var(--grade-ink);
            font-size: 0.8rem;
            font-weight: 750;
            line-height: 1.35;
        }

        /* The scale, at the top of the section: every grade (the ones this
           lesson does not have are faded); "Hide" keeps only the numbers. */
        .grades { margin: -6px 0 14px; padding: 0 0 8px; border-bottom: 1px solid var(--border); }

        .grades-head { display: flex; gap: 8px; align-items: center; min-height: 28px; }

        .grades-title { color: var(--muted); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }

        .grades-short, .grades.closed .grades-long { display: none; }

        .grades.closed .grades-short { display: inline; }

        .grades-strip { display: none; flex-wrap: wrap; gap: 3px; }

        .grades.closed .grades-strip { display: inline-flex; }

        .grades-toggle { margin: -4px -4px -4px auto; padding: 4px 6px; border: 0; background: none; color: var(--accent); font: inherit; font-size: 0.8rem; font-weight: 650; cursor: pointer; }

        .grades-list { margin: 2px 0 0; padding: 0; list-style: none; }

        .grades.closed .grades-list, .grades.closed .grades-note { display: none; }

        .grades.closed { padding-bottom: 6px; }

        .grade-row { display: grid; grid-template-columns: 18px 1fr; gap: 7px; align-items: start; margin: 0 0 3px; color: var(--muted); font-size: 0.76rem; line-height: 1.4; }

        .grade-row .grade-num { margin-top: 0.5px; }

        .grade-row span b { color: var(--grade-ink); font-weight: 750; }

        .grade-row.absent { opacity: 0.55; }

        .grades-note { margin: 2px 0 2px 26px; color: var(--faint); font-size: 0.74rem; }

        /* Filters: All, then one chip per grade the lesson has (number and count). */
        .grade-chip { gap: 5px; padding-left: 6px; }

        .grade-chip[aria-pressed="true"] { border-color: var(--grade); background: var(--grade-soft); color: var(--text); }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .w-title { display: flex; flex: 1 1 auto; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-width: 0; }

        .w-side { display: flex; flex: 1 0 auto; gap: 8px; align-items: center; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;
            font-weight: 650;
            cursor: pointer;
        }

        .orig-toggle:hover { color: var(--accent); }

        .orig { margin: 6px 0 0; padding: 6px 9px; border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 0.88rem; font-style: italic; }

        .dialogue-tools { margin: 0 0 14px; }

        /* ------------------------------------------ mistake views and times */
        .viewbar { display: inline-flex; flex-wrap: wrap; gap: 2px; margin: 0 0 12px; padding: 3px; border-radius: 12px; background: var(--surface-2); }

        .view { min-height: 34px; padding: 4px 14px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-size: 0.88rem; font-weight: 650; cursor: pointer; }

        .view[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .ex-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 5px; color: var(--muted); font-size: 0.8rem; font-weight: 600; }

        .clock { padding: 0 6px; border-radius: 5px; background: var(--surface); color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }

        .sep { color: var(--faint); }

        .ex-why { margin: 6px 0 0 24px; color: var(--muted); font-size: 0.9rem; }

        .topic-head { display: flex; gap: 8px; align-items: center; margin: 24px 0 10px; font-size: 1.02rem; }

        .topic-head .clock { background: var(--surface-2); }

        .topic-count { margin-left: auto; color: var(--faint); font-size: 0.8rem; }

        /* ---------------------------------------------------- lesson audio */
        /* A clip of the recording: a small "▶ 4:02" pill that opens into a
           one-row player (pause, back 3 s, position, forward 3 s). */
        .clip {
            display: inline-flex;
            flex: none;
            align-items: center;
            max-width: 100%;
            height: 30px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            vertical-align: middle;
        }

        .clip button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 30px;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .clip button:hover { background: var(--accent-hover); }

        .clip button:focus-visible, .clip-bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

        .clip .clip-main { gap: 5px; padding: 0 10px 0 9px; font-size: 0.8rem; font-weight: 750; font-variant-numeric: tabular-nums; }

        .clip-main svg { width: 12px; height: 12px; }

        .clip .i-pause, .clip.playing .i-play { display: none; }

        .clip.playing .i-pause { display: block; }

        .clip-more { display: none; align-items: center; padding-right: 3px; }

        .clip.open .clip-more { display: inline-flex; }

        .clip .clip-skip { width: 30px; }

        .clip-skip svg { width: 20px; height: 20px; }

        .clip-bar { position: relative; flex: none; width: 76px; height: 30px; margin: 0 3px; cursor: pointer; touch-action: none; }

        .clip-bar::before, .clip-fill { content: ""; position: absolute; top: 13px; left: 0; height: 4px; border-radius: 2px; }

        .clip-bar::before { right: 0; background: var(--accent); opacity: 0.22; }

        .clip-fill { width: 0; background: var(--accent); }

        .clip-fill::after { content: ""; position: absolute; top: -3px; right: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

        .clip.failed { opacity: 0.45; }

        .clip-note {
            position: fixed;
            right: 16px;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            z-index: 9;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--text);
            color: var(--bg);
            font-size: 0.88rem;
            box-shadow: 0 6px 22px rgba(20, 28, 51, 0.3);
        }

        .clip-note[hidden] { display: none; }

        .line-tools { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 6px 0 0; }

        .d-head { margin: 0 0 12px; }

        .dialogue .d-head h3 { margin: 0 0 4px; }

        .d-head .ex-meta { margin: 0; }

        .d-head .clock { background: var(--surface-2); }

        .back-to-quiz {
            position: fixed;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            z-index: 6;
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 44px;
            padding: 8px 18px 8px 14px;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: var(--on-accent);
            box-shadow: 0 6px 22px rgba(20, 28, 51, 0.28);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            transform: translateX(-50%);
            cursor: pointer;
        }

        .back-to-quiz[hidden] { display: none; }

        .back-to-quiz svg { width: 18px; height: 18px; }

        /* Double-tap selects a word (below), so it must not zoom the page. */
        body { touch-action: manipulation; }

        /* ---------------------------------------------------------- themes */
        .hero-top { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin: 0 0 6px; }

        .hero-top .eyebrow { margin: 0; }

        .theme-btn {
            display: inline-flex;
            flex: none;
            gap: 5px;
            align-items: center;
            min-height: 30px;
            padding: 3px 10px 3px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.78rem;
            font-weight: 650;
            cursor: pointer;
        }

        .theme-btn svg { width: 15px; height: 15px; }

        .theme-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }

        .themes { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }

        .themes[hidden] { display: none; }

        .theme {
            display: inline-flex;
            gap: 7px;
            align-items: center;
            min-height: 34px;
            padding: 3px 11px 3px 5px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .theme[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }

        .swatch { position: relative; width: 22px; height: 22px; border-radius: 50%; background: var(--sw-bg); box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.35); }

        .swatch::after { content: ""; position: absolute; right: 1px; bottom: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--sw-accent); }

        /* ------------------------------------------------- word-card parts */
        .more-part { scroll-margin-top: 84px; }

        .more-bar.open .more-btn::after { content: none; }

        .more-hide { display: none; }

        .more-bar.open .more-hide { display: inline-flex; align-items: center; color: var(--muted); }

        .more-bar.open .more-hide::after { content: " \25B4"; }

        .tl-flash { animation: flash 1.4s ease-out; border-radius: 10px; }

        /* A card keeps its own rounded corners while it lights up. */
        .card.tl-flash { border-radius: var(--radius); }

        /* ----------------------------------------------------- word cards */
        /* Each word starts with a tinted title bar, the word itself the
           largest text on the card; cards stand clearly apart. */
        #panel-vocabulary .word {
            --card-side: 16px;
            margin-bottom: 18px;
            padding-top: 0;
            padding-right: var(--card-side);
            padding-left: var(--card-side);
            overflow: hidden;
            border-color: var(--border);
            border-color: color-mix(in srgb, var(--border) 65%, var(--accent) 35%);
        }

        #panel-vocabulary .word .w-head {
            margin: 0 calc(-1 * var(--card-side)) 12px;
            padding: 10px var(--card-side);
            border-bottom: 1px solid var(--border);
            background: var(--accent-soft);
        }

        #panel-vocabulary .w-term { color: var(--accent); font-size: 1.32rem; font-weight: 800; letter-spacing: -0.005em; }

        #panel-vocabulary .w-head .clip { background: var(--surface); }

        @media (max-width: 520px) {
            #panel-vocabulary .word { --card-side: 10px; margin-bottom: 16px; }
            #panel-vocabulary .word .w-head { margin-bottom: 10px; padding-top: 9px; padding-bottom: 9px; }
            #panel-vocabulary .w-term { font-size: 1.24rem; }
        }

        /* ------------------------------------------------------- timeline */
        /* A thin bar a little in from the right edge (phone screens curve at
           the edge): the lesson's time from top to bottom. It starts under
           the section names (the page sets --tl-top to follow the tabs) and
           ends above "Go back" while that is shown. */
        .timeline { --tl-top: 72px; --tl-bottom: 14px; --tl-inset: 10px; }

        .timeline.has-back { --tl-bottom: 54px; }

        [data-lane="mistakes"] { --lane: var(--major); }
        [data-lane="vocabulary"] { --lane: var(--accent); }
        [data-lane="dialogues"] { --lane: var(--ins-text); }

        .tl-rail {
            position: fixed;
            top: var(--tl-top);
            right: var(--tl-inset);
            bottom: calc(var(--tl-bottom) + env(safe-area-inset-bottom, 0px));
            z-index: 8;
            width: 30px;
            cursor: ns-resize;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .tl-axis { position: absolute; top: 32px; bottom: 10px; left: 50%; width: 10px; margin-left: -5px; }

        .tl-axis::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; border-radius: 1px; background: var(--border); }

        .tl-ticks i { position: absolute; left: 1px; width: 8px; height: 2px; margin-top: -1px; border-radius: 1px; background: var(--lane, var(--faint)); opacity: 0.6; }

        .tl-here { position: absolute; left: 0; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }

        .tl-here[hidden] { display: none; }

        /* Held: one narrow bar per section, the open section on the right, under the finger. */
        .tl-panel {
            position: fixed;
            top: var(--tl-top);
            right: calc(var(--tl-inset) - 5px);
            bottom: calc(var(--tl-bottom) + env(safe-area-inset-bottom, 0px));
            z-index: 7;
            display: flex;
            gap: 1px;
            width: 120px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--border);
            box-shadow: -8px 0 26px rgba(20, 28, 51, 0.18);
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .tl-panel[hidden] { display: none; }

        .tl-lane { position: relative; flex: 1 1 0; min-width: 0; border-radius: 13px; background: var(--surface); }

        .tl-lane.target { background: var(--accent-soft); }

        .tl-name { position: absolute; top: 7px; left: 50%; display: grid; place-items: center; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--lane); color: var(--surface); font-size: 0.66rem; font-weight: 800; }

        .tl-name .sym { width: 12px; height: 12px; }

        .tl-mark { position: absolute; left: -2px; width: 14px; height: 14px; margin-top: -7px; border: 2px solid var(--surface); border-radius: 50%; background: var(--lane); box-shadow: 0 1px 4px rgba(20, 28, 51, 0.3); }

        .tl-mark[hidden] { display: none; }

        /* Over the bars (their flex order also sets the order they are painted in). */
        .tl-guide, .tl-thumb, .tl-time { z-index: 2; }

        .tl-guide { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed var(--accent); opacity: 0.6; }

        .tl-thumb { position: absolute; width: 22px; height: 22px; border: 3px solid var(--surface); border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(20, 28, 51, 0.35); }

        /* The time under the finger, just above the fingertip. */
        .tl-time {
            position: absolute;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--on-accent);
            font-size: 0.8rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            box-shadow: 0 3px 10px rgba(20, 28, 51, 0.3);
        }

        /* While the panel is held, the section narrows to fit beside it. */
        html.tl-open main { padding-right: var(--tl-room, 0px); }

        .tl-rail, .tl-panel { transition: bottom 0.18s ease-out; }

        /* ------------------------------------------------------- go back */
        /* Under the timeline's end, in the same lane: back to the section
           (and the exact place) the reader came from. Its small badge is
           the section it goes back to. */
        .go-back {
            position: fixed;
            right: calc(var(--tl-inset, 10px) - 1px);
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            z-index: 8;
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--surface);
            color: var(--accent);
            box-shadow: 0 2px 10px rgba(20, 28, 51, 0.22);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .go-back[hidden] { display: none; }

        .go-back svg { width: 18px; height: 18px; }

        .go-back::before { content: ""; position: absolute; inset: -4px -6px -8px -10px; }

        .go-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .go-to {
            position: absolute;
            top: -7px;
            left: -8px;
            display: grid;
            place-items: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--lane, var(--accent));
            color: var(--surface);
            box-shadow: 0 0 0 2px var(--bg);
        }

        .go-to .sym { width: 11px; height: 11px; }

        /* ------------------------------------------ jumps between sections */
        /* Beside a time: the same moment in the other two sections, marked
           with their symbols and colours (as on the tabs and the held
           timeline), the section's letter small in a corner. */
        .jump-set { display: inline-flex; flex: none; gap: 9px; align-items: center; margin-left: 2px; vertical-align: middle; }

        .jump-btn .sym { width: 15px; height: 15px; }

        .jump-letter {
            position: absolute;
            right: -5px;
            bottom: -4px;
            min-width: 11px;
            height: 11px;
            padding: 0 2px;
            border-radius: 4px;
            background: var(--surface);
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--lane) 45%, transparent);
            color: var(--lane);
            font-size: 7.5px;
            font-weight: 800;
            line-height: 11px;
            text-align: center;
        }

        .jump-btn {
            position: relative;
            display: inline-grid;
            place-items: center;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1.5px solid var(--lane);
            border-color: color-mix(in srgb, var(--lane) 55%, transparent);
            border-radius: 50%;
            background: var(--surface);
            color: var(--lane);
            font: inherit;
            font-size: 0.7rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .jump-btn::before { content: ""; position: absolute; inset: -4px -3px; }

        .jump-btn:hover { background: color-mix(in srgb, var(--lane) 12%, var(--surface)); }

        .jump-btn:focus-visible { outline: 2px solid var(--lane); outline-offset: 1px; }

        /* A highlighted phrase that has its own word card: tap to open it. */
        mark.expr[data-vocab] {
            cursor: pointer;
            text-decoration-line: underline;
            text-decoration-style: dotted;
            text-decoration-color: var(--accent);
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
            -webkit-tap-highlight-color: transparent;
        }

        mark.expr.pressing { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }

        /* The lesson time in the header: a tap switches Moscow time / own time. */
        .tz-btn {
            display: inline-block;
            margin: -1px 0;
            padding: 0 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: inherit;
            font: inherit;
            letter-spacing: inherit;
            text-transform: inherit;
            line-height: 1.45;
            white-space: nowrap;
            cursor: pointer;
        }

        .tz-btn .tz { color: var(--accent); }

        .tz-time { white-space: nowrap; }

        /* A lane on the right for the timeline, so it never covers the page. */
        @media (max-width: 860px) {
            .page { padding-right: 48px; }
        }

        /* Phones: less space lost on the left, where nothing needs it. */
        @media (max-width: 520px) {
            .page { padding-left: 8px; }
            .tabs { margin: 14px -48px 0 -8px; padding: 10px 8px; }
            .card { padding: 12px 10px; }
            .mistake { border-left-width: 3px; }
            .pair { padding: 8px; }
            .said, .fixed { gap: 5px; }
            .mark-icon { width: 13px; }
            .ex-why { margin-left: 18px; }
            .word { padding: 12px 10px; }
        }

        @media (max-width: 520px) {
            body { font-size: 16px; }
            .card { padding: 14px; }
            #panel-vocabulary { font-size: 15px; }
            .word { padding: 12px; }
            .w-term { font-size: 1.08rem; }
            .bubble { max-width: 94%; }
            .tab { font-size: 0.88rem; }
        }

        /* Phones: the three tabs, with their symbols and counts, stay in one
           row inside the screen (a wider row makes the phone zoom the page out). */

    <script>
        const LESSON = {"version":4,"meta":{"title":"From Rip Currents to Essay Structure","topics":["Technical issues and internet connection","Drowning experience and rip currents","Essay writing and vocabulary","Writing plans and structure","Improving the Michael Jackson example"],"date":"4 October 2026","time":"13:46","start_utc":1791096373},"topics":[{"title":"Technical issues and internet connection","at":0,"time":0.0},{"title":"Drowning experience and rip currents","at":858,"time":403.7},{"title":"Essay writing and vocabulary","at":3204,"time":1320.7},{"title":"Writing plans and structure","at":4785,"time":2228.9},{"title":"Improving the Michael Jackson example","at":6214,"time":2884.9}],"mistakes":[{"grade":3,"severity":"high","label":"Word choice","rule":"Use 'surrounded' to describe being enclosed or encircled by people. 'Around by' is not a standard English expression.","examples":[{"quote":"we were always around by people","fix":"we were surrounded by people","context":"We didn't even realize when we got there. I felt that we were always around by people at the same place.","context_fix":"We didn't even realize when we got there. I felt that we were surrounded by people at the same place.","why":"Use 'surrounded' to describe being enclosed or encircled by people. 'Around by' is not a standard English expression.","time":843.9,"at":2021,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/083938-084688.webm","at":839.6,"dur":7.5}}]},{"grade":3,"severity":"high","label":"Verb form","rule":"The past participle of 'spin' is 'spun'. We also use 'in' to describe being inside the moving water.","examples":[{"quote":"was spinned on the fucking it","fix":"was spun around in it","context":"I went under the wave and I was spinned on the fucking it with the sand and everything else.","context_fix":"I went under the wave and I was spun around in it with the sand and everything else.","why":"The past participle of 'spin' is 'spun'. We also use 'in' to describe being inside the moving water.","time":962.0,"at":2359,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/095910-096864.webm","at":959.2,"dur":9.54}}]},{"grade":3,"severity":"high","label":"Sentence structure","rule":"The original phrase lacks a subject. In this context, 'they' refers to the bloggers being discussed.","examples":[{"quote":"when just causing no emotions","fix":"when they just cause no emotions","context":"Hatred is a very strong emotion. It's much worse than when just causing no emotions.","context_fix":"Hatred is a very strong emotion. It's much worse than when they just cause no emotions.","why":"The original phrase lacks a subject. In this context, 'they' refers to the bloggers being discussed.","time":2690.2,"at":5813,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/267879-269395.webm","at":2678.9,"dur":15.16}}]},{"grade":3,"severity":"high","label":"Word choice","rule":"The word 'obsessed' is an adjective. You need the noun 'obsession' to follow the article 'an'.","examples":[{"quote":"obsessed","fix":"obsession","context":"My pronouns are USA. Michael Jackson had an obsessed. If you already used a comma to separate it, you should use a second comma as well.","context_fix":"My pronouns are USA. Michael Jackson had an obsession. If you already used a comma to separate it, you should use a second comma as well.","why":"The word 'obsessed' is an adjective. You need the noun 'obsession' to follow the article 'an'.","time":2888.6,"at":6219,"topic":4,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/288402-290601.webm","at":2884.1,"dur":21.99}}]},{"grade":4,"severity":"high","label":"Preposition","rule":"We use the possessive 's' for people. 'In my house of my grandparents' is grammatically incorrect and unnatural.","examples":[{"quote":"in my house of my grandparents","fix":"in my grandparents' house","context":"I think I overslept. First, it was some Ukrainian military in the fields and the forests in my house of my grandparents and I was hiding inside the house.","context_fix":"I think I overslept. First, it was some Ukrainian military in the fields and the forests in my grandparents' house and I was hiding inside the house.","why":"We use the possessive 's' for people. 'In my house of my grandparents' is grammatically incorrect and unnatural.","time":368.7,"at":781,"topic":0,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/035592-037452.webm","at":356.1,"dur":18.6}}]},{"grade":4,"severity":"high","label":"Pronoun","rule":"Since 'waves' is plural, you should use the plural pronoun 'them' instead of 'it'.","examples":[{"quote":"the more powerful ones more time between it","fix":"the more time between them","context":"The water has more time to accumulate energy and create bigger waves. The more powerful ones, the more powerful ones more time between it.","context_fix":"The water has more time to accumulate energy and create bigger waves. The more powerful ones, the more time between them.","why":"Since 'waves' is plural, you should use the plural pronoun 'them' instead of 'it'.","time":543.2,"at":1161,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/053490-054802.webm","at":535.0,"dur":13.12}}]},{"grade":4,"severity":"high","label":"Word order","rule":"You don't need 'it' when using 'that' as the subject. 'Is that wrong?' is the correct way to ask this.","examples":[{"quote":"but is it that's wrong","fix":"but is that wrong","context":"I think I was in the rip current, but is it that's wrong? I mean I was not in it yet but I was very close to it.","context_fix":"I think I was in the rip current, but is that wrong? I mean I was not in it yet but I was very close to it.","why":"You don't need 'it' when using 'that' as the subject. 'Is that wrong?' is the correct way to ask this.","time":692.1,"at":1585,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/069084-070200.webm","at":690.9,"dur":11.16}}]},{"grade":4,"severity":"high","label":"Sentence structure","rule":"When 'first' is used as an adverb meaning 'at first,' it needs a subject like 'you' to follow it.","examples":[{"quote":"the first hate someone","fix":"you first hate someone","context":"Every true love starts with hatred; only when the first hate someone can you love him really with all your heart.","context_fix":"Every true love starts with hatred; only when you first hate someone can you love him really with all your heart.","why":"When 'first' is used as an adverb meaning 'at first,' it needs a subject like 'you' to follow it.","time":2650.0,"at":5715,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/264224-265690.webm","at":2642.3,"dur":14.66}}]},{"grade":4,"severity":"high","label":"Preposition","rule":"Use 'among' when referring to a group of three or more. 'Between' is typically used for only two items.","examples":[{"quote":"between them like those are popular bloggers","fix":"Among them, those are popular bloggers","context":"There are bloggers that everybody loves and they're also fine. Between them like those are popular bloggers, but those are the top one percent.","context_fix":"There are bloggers that everybody loves and they're also fine. Among them, those are popular bloggers, but those are the top one percent.","why":"Use 'among' when referring to a group of three or more. 'Between' is typically used for only two items.","time":2712.2,"at":5866,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/271088-271764.webm","at":2711.0,"dur":6.76}}]},{"grade":5,"severity":"medium","label":"Tense","rule":"Use the past tense when describing completed actions or past experiences.","examples":[{"quote":"you're just in the water","fix":"I was just in the water","context":"It felt like a tsunami, I swear to God. It felt like you're just in the water and you see a wave and it's like a meter above you.","context_fix":"It felt like a tsunami, I swear to God. It felt like I was just in the water and you see a wave and it's like a meter above you.","why":"Since you are describing a past experience (a tsunami), use the past tense 'I was' instead of 'you're'.","time":568.9,"at":1224,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/056558-057436.webm","at":565.7,"dur":8.78}},{"quote":"still like change the direction","fix":"still trying to change the direction","context":"I was trying to get there and still like change the direction. I was losing so much energy because you didn't know that you weren't supposed to go straight back.","context_fix":"I was trying to get there and still trying to change the direction. I was losing so much energy because you didn't know that you weren't supposed to go straight back.","why":"Since you are describing a continuous action in the past, 'still trying' is needed to show the ongoing effort.","time":742.1,"at":1725,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/073972-075362.webm","at":739.8,"dur":13.9}},{"quote":"need","fix":"needed","context":"Before coming to Bali, I had done the research and I knew I need to swim parallel to the seashore.","context_fix":"Before coming to Bali, I had done the research and I knew I needed to swim parallel to the seashore.","why":"Since you are describing a past experience (before coming to Bali), use the past tense 'needed' instead of 'need'.","time":766.7,"at":1802,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/076244-077082.webm","at":762.5,"dur":8.38}},{"quote":"who is in the worst current","fix":"who was in the worst current","context":"There was no one behind me who is in the worst current except for my boyfriend. He was there, trying to get out of it.","context_fix":"There was no one behind me who was in the worst current except for my boyfriend. He was there, trying to get out of it.","why":"Since you are describing a past event, use 'was' instead of 'is' to maintain tense consistency.","time":815.1,"at":1952,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/081394-082437.webm","at":814.0,"dur":10.43}}]},{"grade":5,"severity":"medium","label":"Sentence structure","rule":"Match the verb's number with the subject's singular or plural form.","examples":[{"quote":"there are nobody","fix":"there is nobody","context":"I just jog to the sea and there are nobody there at that point and I gotta be aware of things.","context_fix":"I just jog to the sea and there is nobody there at that point and I gotta be aware of things.","why":"The word 'nobody' is a singular pronoun, so it should be paired with the singular verb 'is' instead of 'are'.","time":1206.8,"at":2956,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/120326-121250.webm","at":1203.4,"dur":9.24}},{"quote":"is","fix":"are","context":"You should spend most of your time writing body paragraphs. Body paragraphs is what make your essay really good, what makes it shine.","context_fix":"You should spend most of your time writing body paragraphs. Body paragraphs are what make your essay really good, what makes it shine.","why":"Since 'body paragraphs' is a plural subject, you should use the plural verb 'are' instead of 'is'.","time":2182.2,"at":4667,"topic":2,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/217848-218848.webm","at":2178.6,"dur":10.0}},{"quote":"overview paragraph overview that are kind of like","fix":"overview paragraph that is kind of like","context":"In reports, there are also body paragraphs with detailed description of data and an overview paragraph overview that are kind of like in a nutshell introduces the trends in general.","context_fix":"In reports, there are also body paragraphs with detailed description of data and an overview paragraph that is kind of like in a nutshell introduces the trends in general.","why":"The subject is 'overview paragraph' (singular), so the verb should be 'is' instead of 'are'.","time":2358.2,"at":5097,"topic":3,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/235230-236396.webm","at":2352.4,"dur":11.66}},{"quote":"which is very telling","fix":"which are very telling","context":"I like your examples, which is very telling. You actually came up with pretty solid examples.","context_fix":"I like your examples, which are very telling. You actually came up with pretty solid examples.","why":"Since \"examples\" is plural, you should use \"are\" instead of \"is\" when referring back to them.","time":3557.8,"at":7193,"topic":4,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/355622-356483.webm","at":3556.3,"dur":8.61}}]},{"grade":5,"severity":"medium","label":"Article","rule":"Use the indefinite article 'a' before singular countable nouns.","examples":[{"quote":"I'm not professional","fix":"I'm not a professional","context":"I can swim like a dog and swim like this, but I'm not professional. Of course, but in the sea I think I'm a good swimmer.","context_fix":"I can swim like a dog and swim like this, but I'm not a professional. Of course, but in the sea I think I'm a good swimmer.","why":"When using 'professional' as a noun to describe a person, you need the indefinite article 'a'.","time":604.2,"at":1330,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/060002-060974.webm","at":600.1,"dur":9.72}},{"quote":"there is shark","fix":"there is a shark","context":"I went into the sea, and it's like you know, going into the sea and then there is shark and the shark almost takes your life.","context_fix":"I went into the sea, and it's like you know, going into the sea and then there is a shark and the shark almost takes your life.","why":"Since you are referring to a single animal in a general sense, you need the indefinite article 'a' before 'shark'.","time":903.9,"at":2187,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/089844-090775.webm","at":898.5,"dur":9.31}}]},{"grade":5,"severity":"medium","label":"Sentence structure","rule":"Use 'I've been distracted' to describe your state of mind. 'Distracting' would mean you are bothering someone else.","examples":[{"quote":"distracting","fix":"distracted","context":"I've been writing it for the last 80 minutes. I've been distracting. I asked GPT what's the best way to write it.","context_fix":"I've been writing it for the last 80 minutes. I've been distracted. I asked GPT what's the best way to write it.","why":"Use 'I've been distracted' to describe your state of mind. 'Distracting' would mean you are bothering someone else.","time":252.5,"at":476,"topic":0,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/025050-025792.webm","at":250.7,"dur":7.42}}]},{"grade":5,"severity":"medium","label":"Comparison","rule":"You are comparing the strength of the current, not the people. Use 'it' to refer back to 'the current'.","examples":[{"quote":"not so hard as them","fix":"not as hard as it was for them","context":"I was almost in the current. It was already sucking me in but not so hard as them. I think they were fine.","context_fix":"I was almost in the current. It was already sucking me in but not as hard as it was for them. I think they were fine.","why":"You are comparing the strength of the current, not the people. Use 'it' to refer back to 'the current'.","time":806.5,"at":1922,"topic":1,"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/080216-081100.webm","at":802.3,"dur":8.84}}]},{"grade":6,"severity":"low","label":"Word choice","rule":"After linking verbs like 'stay' or 'be', use the adjective 'stable' to describe the subject, not the adverb 'stably'.","examples":[{"quote":"just can't stay stably","fix":"just isn't stable","context":"I've been in a lot of places where on paper Wi-Fi is like 500 megabit per second, but it's not stable; it just can't stay stably.","context_fix":"I've been in a lot of places wher ":["The instructions were so clunky that I had to read them three times to understand.","I'm trying to simplify this email to remove any clunky phrasing.","The transition between the two scenes felt clunky and disrupted the pacing."],"synonyms":["wordy","cumbersome","convoluted","awkward","verbose","unwieldy","cluttered"],"antonyms":["concise","fluid","seamless","streamlined","succinct","elegant"],"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/190252-190634.webm","at":1902.6,"dur":3.82}},{"term":"reserve (something) for later","pos":"expression","definition":"To save a word, idea, or action to be used at a later time.","time":1917.8,"lesson":"Why are you using the word 'fame' again? You can reserve it for later and instead explain the reasons behind your opinion.","examples":[{"sentence":"I'm not going to tell you the secret yet; I'll reserve it for later.","pattern":"reserve + [noun] + for later"},{"sentence":"We should reserve some of the budget for later in the project.","pattern":"reserve + [something] + for [time period]"},{"sentence":"Can we reserve this table for later this evening?","pattern":"reserve + [object] + for [time]"}],"more_examples":["I'm feeling a bit tired, so let's reserve the heavy workout for later.","You don't have to give your full feedback now; you can reserve some comments for later.","We have a lot to cover, so I'll reserve the final summary for later in the meeting."],"synonyms":["save for later","hold back","keep for later","set aside"],"antonyms":["use now","reveal immediately","disclose now"],"gap":{"sentence":"I have a few more jokes to tell, but I'll _____ so I don't spoil the ending of the story.","answer":"reserve them for later","options":["reserve them for later","explain them for later","cancel them for later","forget them for later"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/191706-192083.webm","at":1917.2,"dur":3.77}},{"term":"well-being","pos":"noun","definition":"The state of being
