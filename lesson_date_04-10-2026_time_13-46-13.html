ich a person or animal acts or conducts themselves.","time":2767.6,"lesson":"If you are using American English, you should use American spelling. For example, 'behavior' is the American spelling, while there is a British version.","examples":[{"sentence":"The teacher praised the students for their excellent behavior during the field trip.","pattern":"excellent behavior"},{"sentence":"The company is monitoring the behavior of its users to improve the app.","pattern":"monitor the behavior of"},{"sentence":"His aggressive behavior towards his colleagues caused a lot of tension in the office.","pattern":"aggressive behavior"},{"sentence":"The children were rewarded with stickers for good behavior.","pattern":"rewarded for good behavior"}],"countable":[],"uncountable":[{"meaning":"The way in which a person or animal acts or conducts themselves.","example":"For example, 'behavior' is the American spelling, while there is a British version.","lesson":true},{"meaning":"The way a person or animal acts or conducts themselves","example":"The dog's behavior improved significantly after the training sessions."},{"meaning":"The manner in which something functions or operates","example":"The software's behavior is unpredictable when it encounters a bug."}],"more_examples":["The police are investigating the suspicious behavior of the man near the bank.","It is important to maintain professional behavior during business meetings.","The toddler's behavior became more manageable once he started preschool."],"synonyms":["conduct","actions","manner","demeanor","deportment","bearing"],"antonyms":[],"gap":{"sentence":"The dog's aggressive _____ made it very difficult for the owner to take it for a walk in the park.","answer":"behavior","options":["behavior","height","color","speed"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/276982-277315.webm","at":2769.9,"dur":3.33}},{"term":"recognize","pos":"verb","definition":"To identify something from previous knowledge or experience, often used in American English spelling.","time":2835.3,"lesson":"In British English, this is spelled 'recognise', while 'recognize' is the American spelling. I didn't know that; I always spelled it with an 's'.","examples":[{"sentence":"I didn't recognize you with your hair cut so short!","pattern":"recognize + object"},{"sentence":"The company was recognized for its contribution to the community.","pattern":"be recognized for"},{"sentence":"Do you recognize this song from the radio?","pattern":""},{"sentence":"He finally recognized the importance of regular exercise.","pattern":"recognize + noun phrase"}],"more_examples":["I didn't recognize your voice on the phone because you had a cold.","Do you recognize that landmark? It's a very famous building in the city.","It took me a few minutes to recognize the smell of baking bread."],"synonyms":["identify","place","pick out","spot","discern","distinguish"],"antonyms":["misidentify","fail to notice"],"gap":{"sentence":"The face was so familiar that I could _____ him immediately, even though we hadn't met in years.","answer":"recognize","options":["recognize","predict","ignore","invent"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/283254-283999.webm","at":2832.6,"dur":7.45}},{"term":"quirk","pos":"noun","definition":"A peculiar or unexpected habit, behavior, or characteristic, especially one that is minor.","time":2847.5,"lesson":"I didn't know that; I always spelled it with an 's'. This is one of the quirks of British and American English.","examples":[{"sentence":"One of his little quirks is that he always has to tap the doorframe before entering a room.","pattern":"one of his/her/their [plural noun] quirks"},{"sentence":"The house has several charming quirks, like the squeaky floorboard in the hallway.","pattern":"have [adjective] quirks"},{"sentence":"It's just a personality quirk; she just likes to organize her pens by color.","pattern":"personality quirk"},{"sentence":"The software has a few quirks that you need to get used to.","pattern":"have a few quirks"}],"countable":[{"meaning":"A peculiar or unexpected habit, behavior, or characteristic, especially one that is minor.","example":"This is one of the quirks of British and American English.","lesson":true},{"meaning":"A sudden twist or unexpected turn in a story or plot","example":"The movie's plot had a strange quirk in the final act."}],"uncountable":[],"more_examples":["His tendency to hum while he works is a harmless little quirk.","The old car has its quirks, but it still runs perfectly well.","I've noticed a strange quirk in how he reacts whenever someone mentions the ocean."],"synonyms":["peculiarity","eccentricity","idiosyncrasy","oddity","mannerism","eccentric habit"],"antonyms":["normality","regularity","conformity","standard","commonality"],"gap":{"sentence":"It is just a harmless _____ of his that he always hums while he is making coffee.","answer":"quirk","options":["quirk","rule","skill","talent"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/284658-285367.webm","at":2846.7,"dur":7.09}},{"term":"keep that in mind","pos":"expression","definition":"To remember a specific piece of information or a fact for future use.","time":2882.2,"lesson":"In America, soccer and football are different sports. You should also keep that in mind.","examples":[{"sentence":"The roads can be very slippery when it rains, so keep that in mind.","pattern":"keep that in mind + [reason]"},{"sentence":"Please keep in mind that the office is closed on holidays.","pattern":"keep in mind that + [clause]"},{"sentence":"I'll keep that in mind for the next time we plan a trip.","pattern":"keep that in mind for [time/occasion]"}],"more_examples":["The deadline is very strict, so keep that in mind when scheduling your tasks.","Keep that in mind if you decide to book a flight during the peak season.","I'm trying to eat healthier, so I'll keep that in mind when ordering dinner."],"synonyms":["bear in mind","take into account","remember","don't forget","note that","consider"],"antonyms":["forget","ignore","overlook","disregard"],"gap":{"sentence":"The restaurant is very popular on weekends, so you should _____ if you want a table.","answer":"keep that in mind","options":["keep that in mind","ignore that","forget that","overlook that"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/288254-288655.webm","at":2882.6,"dur":4.01}},{"term":"obsession","pos":"noun","definition":"A state where someone thinks about something or someone constantly to an extreme degree.","time":2888.6,"lesson":"Michael Jackson had an obsession. If you have already used a comma to separate a clause, you should use a second comma before and after the clause.","examples":[{"sentence":"She has a strange obsession with collecting vintage stamps.","pattern":"have an obsession with + noun"},{"sentence":"His obsession with fitness led him to train for four hours every day.","pattern":"obsession with + noun"},{"sentence":"I'm sorry, I have an obsession with being on time.","pattern":"I have an obsession with"},{"sentence":"The movie explores the protagonist's growing obsession with fame.","pattern":"obsession with + abstract noun"}],"countable":[{"meaning":"A state where someone thinks about something or someone constantly to an extreme degree.","example":"Michael Jackson had an obsession.","lesson":true},{"meaning":"A persistent, often irrational, preoccupation with an idea or project","example":"Her obsession with the project kept her awake until dawn."},{"meaning":"A state of being haunted by a specific thought or desire","example":"He lived in a state of constant obsession with his past mistakes."}],"uncountable":[],"more_examples":["He has a total obsession with finding the perfect cup of coffee.","Her obsession with social media makes it hard for her to disconnect.","The documentary shows his obsession with achieving world records."],"synonyms":["fixation","preoccupation","compulsion","mania","infatuation","passion"],"antonyms":["indifference","disinterest","apathy","disregard"],"gap":{"sentence":"His constant _____ with checking his phone meant he barely noticed anything happening around him during dinner.","answer":"obsession","options":["obsession","interest","habit","skill"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/288254-289301.webm","at":2882.6,"dur":10.47}},{"term":"pertain to","pos":"verb","definition":"To be relevant to or relate to a specific person, thing, or situation.","time":2947.1,"lesson":"One person doesn't work as a representative example. We can use this example, but we should also mention that it pertains to many more people, such as other singers.","examples":[{"sentence":"The new rules pertain to all employees, including part-time staff.","pattern":"pertain to + noun phrase"},{"sentence":"Does this specific clause pertain to my contract?","pattern":""},{"sentence":"The instructions pertain to how to handle the equipment safely.","pattern":"pertain to + how clause"},{"sentence":"These issues do not pertain to the current project.","pattern":""}],"more_examples":["The judge ruled that the evidence did not pertain to the crime in question.","Which department does this request pertain to?","The scholarship only pertains to students who maintain a high GPA."],"synonyms":["relate to","apply to","concern","have to do with","be relevant to","be applicable to","be connected to"],"antonyms":["be unrelated to","be irrelevant to"],"gap":{"sentence":"The manager clarified that the new safety guidelines _____ everyone working in the warehouse, not just the supervisors.","answer":"pertain to","options":["pertain to","remain in","differ from","respond to"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/294956-295481.webm","at":2949.8,"dur":5.25}},{"term":"creep out","pos":"phrasal verb","definition":"To make someone feel nervous, uncomfortable, or frightened in a strange way.","time":3048.0,"lesson":"She had an obsessed follower who copied everything she did, from her outfits to the way she spoke. Ariana Grande was creeped out because of that.","examples":[{"sentence":"That abandoned house really creeps me out.","pattern":"creep (someone) out"},{"sentence":"I don't want to go into the basement; it creeps me out.","pattern":"subject + creep + object + out"},{"sentence":"He was creeped out by the stranger's constant staring.","pattern":"be creeped out by"},{"sentence":"The way he follows me around is starting to creep me out.","pattern":"start + to creep out"}],"more_examples":["That horror movie had a scene that totally creeped me out.","The way the cat sits perfectly still in the corner creeps me out."],"synonyms":["unsettle","give the creeps","make someone uneasy","spook","make someone uncomfortable","give someone the chills"],"antonyms":["comfort","reassure","soothe","put at ease"],"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/304824-305406.webm","at":3048.3,"dur":5.82}},{"term":"report a case","pos":"expression","definition":"To inform the authorities or a relevant organization about a specific instance of a crime or problem.","time":3129.4,"lesson":"Some people have reported similar cases of stalking. Can you report a case? It sounds a little bit like they have reported those cases to the police.","examples":[{"sentence":"The victim decided to report the case of identity theft to the local police.","pattern":"report the case of [crime]"},{"sentence":"You should report any case of harassment to your supervisor immediately.","pattern":"report any case of [problem]"},{"sentence":"The police are currently investigating several reported cases of burglary.","pattern":"reported cases of [crime]"},{"sentence":"Did you report the case to the authorities yet?","pattern":"report the case to [organization]"}],"more_examples":["The company has a policy requiring employees to report a case of workplace discrimination.","She felt obligated to report the case of vandalism to the neighborhood watch group."],"synonyms":["file a report","notify the authorities","report an incident","lodge a complaint","report a crime","alert the police","report a violation"],"antonyms":["conceal a crime","hide the truth","keep it quiet","ignore the incident"],"gap":{"sentence":"Since the neighbor's dog has been barking all night, I think it is time to _____ of noise pollution to the council.","answer":"report a case","options":["report a case","ignore a case","cancel a case","win a case"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/312544-313659.webm","at":3125.6,"dur":11.15}},{"term":"such as","pos":"expression","definition":"Used to introduce specific examples of a category or group.","time":3320.1,"lesson":"I want to talk about celebrities, such as George Clooney. 'Such as' is a formal way of saying 'like'.","examples":[{"sentence":"I enjoy outdoor activities, such as hiking and swimming.","pattern":"such as + [noun/gerund]"},{"sentence":"The shop sells various types of fruit, such as apples, oranges, and bananas.","pattern":""},{"sentence":"Do you have any experience with programming languages such as Python or Java?","pattern":"such as + [proper nouns]"},{"sentence":"Many countries, such as Japan and Brazil, have unique cultural traditions.","pattern":"such as + [plural nouns]"}],"more_examples":["You should include all necessary documents, such as your passport and visa.","The company offers several benefits, such as health insurance and remote work options.","Many household items, such as chairs and tables, can be found at this store."],"synonyms":["like","for example","including","e.g","for instance"],"antonyms":[],"gap":{"sentence":"You should try some low-impact exercises, _____ yoga or pilates, to improve your flexibility without straining your joints.","answer":"such as","options":["such as","because","although","despite"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/331832-332222.webm","at":3318.5,"dur":3.9}},{"term":"take something seriously","pos":"expression","definition":"To give something serious attention or importance; to care about something deeply.","time":3411.1,"lesson":"This fact shows how seriously the stars take their children's privacy. It shows how much they care about protecting their children.","examples":[{"sentence":"You need to take your studies seriously if you want to pass the exam.","pattern":"take + object + seriously"},{"sentence":"I don't think he takes my warnings seriously.","pattern":"negative form: don't take... seriously"},{"sentence":"The government doesn't seem to take the climate crisis seriously enough.","pattern":"take + [noun phrase] + seriously"},{"sentence":"Stop joking and take this situation seriously for a moment.","pattern":"imperative: take... seriously"}],"more_examples":["You have to take your health seriously if you want to live a long life.","I'm starting to take my hobby seriously and want to join a competition.","The boss expects everyone to take the new safety regulations seriously."],"synonyms":["treat with importance","give weight to","pay attention to","take to heart"],"antonyms":["take lightly","dismiss","ignore","brush off","underestimate"],"gap":{"sentence":"If you want to get a promotion, you really need to _____ and meet every deadline.","answer":"take your responsibilities seriously","options":["take your responsibilities seriously","ignore your responsibilities","forget your responsibilities","avoid your responsibilities"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/341096-341523.webm","at":3411.1,"dur":4.27}},{"term":"lack of privacy","pos":"noun phrase","definition":"A situation where a person's personal life is exposed or monitored by others.","time":3522.2,"lesson":"You mentioned stalking and paparazzi, which are clear examples of a lack of privacy. The word 'peaceful' also hints at this theme.","examples":[{"sentence":"Living in a small apartment often means a lack of privacy.","pattern":""},{"sentence":"The celebrity complained about the lack of privacy since the news broke.","pattern":""},{"sentence":"I'm worried about a lack of privacy when using public Wi-Fi.","pattern":""},{"sentence":"The lack of privacy made him feel very uncomfortable during the interview.","pattern":"Subject + lack of privacy + verb"}],"countable":[{"meaning":"A situation where a person's personal life is exposed or monitored by others.","example":"You mentioned stalking and paparazzi, which are clear examples of a lack of privacy.","lesson":true}],"uncountable":[],"more_examples":["I find it hard to focus on my work due to the lack of privacy in this open-plan office.","The students complained about the lack of privacy in the shared dormitory bathrooms."],"synonyms":["invasion of privacy","exposure","surveillance","intrusion","lack of anonymity"],"antonyms":["privacy","anonymity","confidentiality","solitude","seclusion"],"gap":{"sentence":"I feel very uncomfortable working in an open-plan office because the _____ makes it hard to focus.","answer":"lack of privacy","options":["lack of privacy","lack of noise","lack of time","lack of effort"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/352158-352817.webm","at":3521.7,"dur":6.59}},{"term":"hint at","pos":"phrasal verb","definition":"To suggest something indirectly without saying it directly.","time":3531.0,"lesson":"The word 'peaceful' kind of hints at stillness. It is not a bad way to go.","examples":[{"sentence":"The report hints at a possible increase in prices next year.","pattern":"hint at + noun"},{"sentence":"She didn't say she was quitting, but her behavior hinted at it.","pattern":""},{"sentence":"The mysterious stranger only hinted at his past during the interview.","pattern":"only hint at"}],"more_examples":["The way he avoided my questions hinted at some kind of trouble.","The clouds on the horizon hint at a storm coming later today.","Her smile seemed to hint at a secret she wasn't ready to share."],"synonyms":["imply","allude to","suggest","intimate","signal","point to"],"antonyms":["state clearly","declare"],"gap":{"sentence":"He didn't say he was unhappy with his job, but his constant sighing _____ his frustration.","answer":"hinted at","options":["hinted at","denied","ignored","argued"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/353228-354203.webm","at":3532.5,"dur":9.75}},{"term":"come up with","pos":"phrasal verb","definition":"To produce, create, or suggest a new idea, plan, or example.","time":3561.1,"lesson":"I like your examples, which are very telling. You actually came up with some pretty solid examples.","examples":[{"sentence":"We need to come up with a name for our new business.","pattern":"come up with + noun"},{"sentence":"Can you think of a way to solve this problem? I need you to come up with a solution.","pattern":"come up with + a solution"},{"sentence":"She came up with the idea of hosting a charity auction.","pattern":"Subject + came up with + the idea of + -ing"},{"sentence":"The team struggled to come up with anything original during the brainstorming session.","pattern":"struggle to come up with"}],"more_examples":["I'm trying to come up with a few more reasons why we should delay the launch.","How did you come up with such a clever excuse for being late?","The marketing department needs to come up with a new campaign by Friday."],"synonyms":["think of","devise","generate","propose","formulate","dream up","conceive","invent","create"],"antonyms":[],"gap":{"sentence":"I need you to _____ a creative way to decorate the office for the holiday party by Friday.","answer":"come up with","options":["come up with","go over","get away","take over"]},"clip":{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/356086-356483.webm","at":3561.1,"dur":3.97}}],"dialogues":[{"title":"Technical issues and writing frustrations","lines":[{"speaker":"A","text":"Can you hear and see me clearly? You're a bit frozen. Let me close some tabs; I have a lot of things running at once.","highlights":["at once"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/001876-003316.webm","at":18.9,"dur":14.4}]},{"speaker":"B","text":"That makes sense. Are you running four Excel sheets, a ChatGPT window, a Google Doc, and a Cloudflare dashboard all at the same time?","highlights":["at the same time"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/009164-009999.webm","at":91.7,"dur":8.35}]},{"speaker":"A","text":"Yes, plus some old IELTS tests. I'll close those. Also, the Wi-Fi in my apartment is pretty shitty. My boyfriend might be using it too.","highlights":["pretty shitty"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/010738-012156.webm","at":107.5,"dur":14.18}]},{"speaker":"B","text":"A pro tip for digital nomads is to always carry a LAN cable. It's much more stable than Wi-Fi.","highlights":["pro tip"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/014932-015727.webm","at":149.5,"dur":7.95}]},{"speaker":"A","text":"I didn't know that hack! I'll try it. Though I'm moving soon, and the new place has good Wi-Fi on paper, but it might not be stable.","highlights":["on paper"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/017224-018081.webm","at":172.3,"dur":8.57}]},{"speaker":"B","text":"Exactly. Even if it says 500 megabits, it often isn't the case. A cable is tenfold better.","highlights":["tenfold better"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/018404-018967.webm","at":184.1,"dur":5.63},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/021286-021865.webm","at":213.0,"dur":5.79}]},{"speaker":"A","text":"Anyway, I'm exhausted. I've been struggling with the second part of my essay for 80 minutes. I'm so frustrated with the feedback.","highlights":["struggling with"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/023548-024889.webm","at":235.6,"dur":13.41}]},{"speaker":"B","text":"I feel the same. I spend so much energy on five sentences, and then ChatGPT gives me ten reasons why it's terrible. It's maddening.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/026676-028128.webm","at":266.9,"dur":14.52}]},{"speaker":"A","text":"You're right. Creators shouldn't read the comments. Even if most are positive, one mean comment can really put you off.","highlights":["put you off"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/030414-031404.webm","at":304.2,"dur":9.9}]},{"speaker":"B","text":"I'm definitely not prepared for those comments. And I'm so sleepy because I slept 10 hours and had all sorts of nightmares.","highlights":["all sorts of"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/033292-034816.webm","at":333.1,"dur":15.24}]}],"time":18.9,"topic":0},{"title":"A scary experience with a rip current","lines":[{"speaker":"A","text":"I think I overslept. I had a dream about Ukrainian soldiers in the fields and forests near my grandparents' house.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/035592-037088.webm","at":356.1,"dur":14.96}]},{"speaker":"B","text":"You had a good nap! That's definitely a sign that you slept well.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/038656-039592.webm","at":386.8,"dur":9.36}]},{"speaker":"A","text":"Do you think my bad dreams are connected to what happened yesterday? I almost died.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/040356-041733.webm","at":403.7,"dur":13.77}]},{"speaker":"B","text":"I don't think it's connected. I didn't actually die; I just almost drowned or lost control of the situation.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/042156-043474.webm","at":421.7,"dur":13.18}]},{"speaker":"A","text":"Can you breathe underwater? I feel like drowning is synonymous with ultimate death.","highlights":["synonymous with"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/043632-045096.webm","at":436.4,"dur":14.64}]},{"speaker":"B","text":"My boyfriend said I was making a big deal out of it, but I was trying to swim out for about ten minutes.","highlights":["making a big deal out of it"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/045858-047092.webm","at":458.7,"dur":12.34}]},{"speaker":"A","text":"The waves were supposed to be between 1.5 and 2.3 meters. The longer the period between waves, the more powerful they get.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/049830-050236.webm","at":498.4,"dur":4.06},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/052522-053420.webm","at":525.3,"dur":8.98}]},{"speaker":"B","text":"I swear it felt like a tsunami. You see a wave a meter above sea level and you're just stuck.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/056558-057436.webm","at":565.7,"dur":8.78}]},{"speaker":"A","text":"I'm a standard swimmer, but I can stay afloat. I started drifting away from the group toward the side.","highlights":["stay afloat"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/060990-062282.webm","at":610.0,"dur":12.92}]},{"speaker":"B","text":"I think it was a rip current. You should google it to see what it is.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/065096-065232.webm","at":651.1,"dur":1.36},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/065896-066414.webm","at":659.1,"dur":5.18}]}],"time":356.1,"topic":0},{"title":"Surviving a rip current in Bali","lines":[{"speaker":"A","text":"A rip current is like an underwater flow that pulls you out to sea. You can't fight against it; you have to swim parallel to the shore.","highlights":["parallel to the shore"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/067802-069018.webm","at":678.1,"dur":12.16}]},{"speaker":"B","text":"I think I was in one. I knew I had to swim parallel to the beach, but I was getting nervous and losing so much energy.","highlights":["losing so much energy"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/076438-077256.webm","at":764.5,"dur":8.18}]},{"speaker":"A","text":"You were close to people, but they weren't caught in the current. Your boyfriend was right behind you, just trying to survive.","highlights":["caught in the current"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/081632-082736.webm","at":816.4,"dur":11.04}]},{"speaker":"B","text":"We didn't even realize how far we'd drifted until we saw our clothes on the beach. We were about 10 meters away from where we started.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/084442-085286.webm","at":844.5,"dur":8.44}]},{"speaker":"A","text":"After you got out, you were exhausted. You just needed to lie down and catch your breath.","highlights":["catch your breath"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/086340-087070.webm","at":863.5,"dur":7.3}]},{"speaker":"B","text":"I actually thought about going back in to swim more, but I was terrified of being dragged away by the deadly current.","highlights":["dragged away"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/087120-087456.webm","at":871.3,"dur":3.36},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/088230-088857.webm","at":882.4,"dur":6.27}]},{"speaker":"A","text":"I'm just going to chill for a bit. I'm not going into deep water where the sharks are.","highlights":["chill for a bit"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/089126-089782.webm","at":891.5,"dur":6.56},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/090342-090886.webm","at":903.5,"dur":5.44}]},{"speaker":"B","text":"My boyfriend wanted to go back in again, but he claimed he wasn't tired anymore!","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/092278-092652.webm","at":922.9,"dur":3.74}]}],"time":678.1,"topic":1},{"title":"Surviving a dangerous rip current","lines":[{"speaker":"A","text":"I tried to get under the wave, but it had already broken. The rule is if you see the foam, it's better to stand still and cover your head.","highlights":["stand still"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/093320-094144.webm","at":933.3,"dur":8.24}]},{"speaker":"A","text":"I got caught in it and it spun me around like a washing machine. I couldn't control anything, and my nose and throat were full of salt water.","highlights":["spun me around"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/095910-097012.webm","at":959.2,"dur":11.02}]},{"speaker":"B","text":"That sounds terrifying. You did so many things wrong, but at least you learned from your mistakes. You did your research and now you know how to behave.","highlights":["learned from your mistakes"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/105276-106698.webm","at":1053.0,"dur":14.22}]},{"speaker":"B","text":"I've heard stories about rip currents. They are scientifically proven, but since I've never experienced it, it sounds deadly. People aren't supposed to swim where that happens.","highlights":["scientifically proven"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/108788-110061.webm","at":1088.1,"dur":12.73}]},{"speaker":"A","text":"The beach actually had a sign saying swimming is prohibited because the waves are very strong and unpredictable, but nobody listens. People just want a free source of adrenaline.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/114756-116188.webm","at":1147.7,"dur":14.32}]},{"speaker":"B","text":"I hope that never happens to you. I go to the sea alone at 6:30 in the morning to jog and swim, so I have to stay aware of these dangers.","highlights":["stay aware of"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/118682-119814.webm","at":1186.9,"dur":11.32}]}],"time":933.3,"topic":1},{"title":"Discussing the sea and essay revisions","lines":[{"speaker":"A","text":"The sea in this area is unique because of the underwater cliffs and thousands of tiny islands.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/122736-123717.webm","at":1227.5,"dur":9.81}]},{"speaker":"B","text":"Exactly! The cliffs absorb the waves, which is why the water is so still. It's very picturesque.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/126268-127551.webm","at":1262.8,"dur":12.83}]},{"speaker":"A","text":"Now that we're safe, it's high time we studied art. It's the only thing that makes you feel truly alive.","highlights":["high time"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/129202-130147.webm","at":1292.2,"dur":9.45}]},{"speaker":"B","text":"I agree. Art really makes you value life. Let's look at your essay about celebrities.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/130462-131997.webm","at":1304.7,"dur":15.35}]},{"speaker":"A","text":"Is this the final version? It's around 300 words, right?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/134076-135157.webm","at":1340.9,"dur":10.81}]},{"speaker":"B","text":"The word 'sports' is interesting. Here, it's used as an adjective, which is a bit unusual.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/136874-137539.webm","at":1368.9,"dur":6.65},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/138198-138840.webm","at":1382.2,"dur":6.42}]},{"speaker":"A","text":"Why did you start with the public debate? It doesn't seem to be mentioned in the rest of the topic.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/143868-144865.webm","at":1438.9,"dur":9.97}]},{"speaker":"B","text":"In English, commas are much more logical. You don't need one before 'rather'.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/149138-150500.webm","at":1491.6,"dur":13.62}]},{"speaker":"A","text":"Regarding 'pros and cons', those terms are a bit too conversational. We should use 'advantages and disadvantages'.","highlights":["too conversational"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/152068-152968.webm","at":1520.8,"dur":9.0},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/152318-154068.webm","at":1528.8,"dur":17.5}]},{"speaker":"B","text":"I strongly believe that fame has more negative than positive sides. We should use 'benefits' instead of 'positive signs'.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/159404-160147.webm","at":1594.2,"dur":7.43},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/160598-161015.webm","at":1606.2,"dur":4.17}]},{"speaker":"A","text":"The word 'kids' is too informal for this essay. We should also try to keep our synonyms for later.","highlights":["too informal"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/161036-161879.webm","at":1610.6,"dur":8.43},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/167194-167766.webm","at":1672.1,"dur":5.72}]}],"time":1227.5,"topic":1},{"title":"Improving essay clarity and conciseness","lines":[{"speaker":"A","text":"I'm honestly so sleepy right now, but I know I should probably just power through it.","highlights":["power through"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/170906-171396.webm","at":1709.2,"dur":4.9}]},{"speaker":"B","text":"You should just take a nap. It's your day off, after all.","highlights":["day off"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/171404-172520.webm","at":1714.1,"dur":11.16}]},{"speaker":"A","text":"I've already slept for ten hours! Honestly, taking a nap feels like a waste of time right now.","highlights":["waste of time"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/172766-173208.webm","at":1727.8,"dur":4.42}]},{"speaker":"B","text":"I've noticed a pattern in your writing where you include a lot of redundant information.","highlights":["redundant information"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/176054-177118.webm","at":1760.6,"dur":10.64}]},{"speaker":"A","text":"I know. I tend to beat around the bush instead of getting straight to the point in my essays.","highlights":["beat around the bush","straight to the point"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/178456-179972.webm","at":1784.8,"dur":15.16}]},{"speaker":"B","text":"Try to express complex ideas in just two sentences. You can start with four and then analyze what's actually important.","highlights":["complex ideas"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/181166-182509.webm","at":1811.8,"dur":13.43}]},{"speaker":"A","text":"I often say random stuff in the first paragraph because I'm not really sure what I need to say.","highlights":["random stuff"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/186072-186696.webm","at":1860.8,"dur":6.24}]},{"speaker":"B","text":"This sentence is very clunky. You're repeating words like 'famous' and 'positive' unnecessarily.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/190252-191524.webm","at":1902.6,"dur":12.72}]},{"speaker":"A","text":"I strongly agree with this statement because being popular can affect your physical and mental state, as well as your privacy.","highlights":["mental state"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/198726-199922.webm","at":1987.4,"dur":11.96}]},{"speaker":"B","text":"That sounds much better. In an introduction, the first sentence must introduce the problem so the reader knows what to expect.","highlights":["what to expect"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/203174-207554.webm","at":2031.8,"dur":43.8}]}],"time":1709.2,"topic":2},{"title":"Writing effective essay introductions and plans","lines":[{"speaker":"A","text":"When the prompt asks for your opinion, you should state it clearly, say you strongly agree, and then provide brief prototypes for your body paragraphs.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/208596-210089.webm","at":2086.2,"dur":14.93}]},{"speaker":"B","text":"Actually, this is a pretty good introduction already, but we should add a statement about how being popular affects your physical and mental state.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/211494-213133.webm","at":2115.0,"dur":16.39}]},{"speaker":"A","text":"The main thing to understand is that an introduction is simply for introducing ideas; it doesn't need complex structures.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/216026-217554.webm","at":2160.5,"dur":15.28}]},{"speaker":"A","text":"You should spend most of your time on the body paragraphs, as that is what makes your essay really shine.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/217848-218848.webm","at":2178.6,"dur":10.0}]},{"speaker":"B","text":"I tend to overthink the examples while writing my plan. I spend so much time on it as if I'm going to copy and paste the essay.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/219388-221093.webm","at":2194.0,"dur":17.05}]},{"speaker":"A","text":"You need to simplify it. The whole idea of a plan is to pitch ideas and combine them like you're assembling a Lego castle.","highlights":["pitch ideas"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/222838-224360.webm","at":2228.5,"dur":15.22}]},{"speaker":"B","text":"I see. So the connection between the ideas, like the disadvantages to children, only needs to be slightly related.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/227010-228464.webm","at":2270.2,"dur":14.54}]},{"speaker":"A","text":"Exactly. The introduction just follows the body paragraphs. Its only purpose is to communicate your position and a short version of what you'll discuss.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/231990-233452.webm","at":2320.0,"dur":14.62}]},{"speaker":"A","text":"Think of it like a boss who has 20 reports to read. He only wants to see your position in the introduction before deciding whether to read the rest.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/237754-239210.webm","at":2377.6,"dur":14.56}]},{"speaker":"B","text":"That's interesting. I'll start with how fame can endanger your safety and privacy, but I'll keep it short and concise.","highlights":["short and concise"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/241902-243211.webm","at":2419.2,"dur":13.09}]}],"time":2086.2,"topic":2},{"title":"Improving writing and debating emotions","lines":[{"speaker":"A","text":"This body paragraph is okay in length, but this one is at least one sentence short. We need another sentence to explain it.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/244006-245369.webm","at":2440.2,"dur":13.63}]},{"speaker":"B","text":"I honestly hate writing. I need to start being curious about it to make progress.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/245766-247818.webm","at":2464.4,"dur":20.52}]},{"speaker":"A","text":"That's a great topic. I usually work by writing a good essay, getting a band nine, and then suddenly loving writing.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/248094-249552.webm","at":2481.0,"dur":14.58}]},{"speaker":"B","text":"To get better, I need to strike it once and get feedback from you, Claude, and GPT.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/250872-251898.webm","at":2508.8,"dur":10.26}]},{"speaker":"A","text":"Wait, that's three entities, not two. Why do you need both ChatGPT and Claude?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/251878-253155.webm","at":2518.9,"dur":12.77},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/253522-254402.webm","at":2535.4,"dur":8.8}]},{"speaker":"B","text":"I need diverse opinions. I've noticed that Claude is very precise and often gets the band score right.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/255036-256442.webm","at":2550.5,"dur":14.06}]},{"speaker":"A","text":"I'd be interested in giving Claude an essay that looks bad but is actually a band nine to see what it says.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/259548-260891.webm","at":2595.7,"dur":13.43}]},{"speaker":"B","text":"For example, Michael Jackson had an obsessed stalker. Every true love starts with hatred; you can only love someone with all your heart after hating them.","highlights":["with all your heart"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/261704-262289.webm","at":2617.2,"dur":5.85},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/263114-264775.webm","at":2631.2,"dur":16.61}]},{"speaker":"A","text":"I don't believe that, but anything that invokes strong emotion has the potential to be loved. Hatred is a much stronger emotion than being boring.","highlights":["invokes strong emotion"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/266554-268003.webm","at":2665.6,"dur":14.49}]},{"speaker":"B","text":"Exactly. Some bloggers are popular because they stir something in people, while others are just okay and nobody really cares about them.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/268384-269824.webm","at":2683.9,"dur":14.4}]},{"speaker":"A","text":"By the way, are you using American or British English? You should use American spelling for words like 'behavior'.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/275030-276556.webm","at":2750.4,"dur":15.26}]}],"time":2440.2,"topic":3},{"title":"Spelling differences and refining a sentence","lines":[{"speaker":"A","text":"I noticed some words looked unfamiliar, but my Google Doc wasn't highlighting them as errors.","highlights":["highlighting them"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/279354-280746.webm","at":2793.7,"dur":13.92}]},{"speaker":"B","text":"Your settings might be set to British English. For example, 'recognise' is the British spelling, while 'recognize' is American.","highlights":["British spelling"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/281942-282323.webm","at":2819.5,"dur":3.81},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/283254-283999.webm","at":2832.6,"dur":7.45}]},{"speaker":"A","text":"I always spelled it with an 's'. I didn't realize that was a quirk.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/284256-284916.webm","at":2842.8,"dur":6.6}]},{"speaker":"B","text":"There are also specific words. People in the US say 'apartment' instead of 'flat', and 'soccer' instead of 'football'.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/286662-287582.webm","at":2866.7,"dur":9.2}]},{"speaker":"A","text":"Regarding the sentence about Michael Jackson, I'm worried it's not representative since it only mentions one person.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/291364-292243.webm","at":2913.8,"dur":8.79}]},{"speaker":"B","text":"We can just mention that many famous pop singers have dealt with obsessed stalkers.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/296002-297186.webm","at":2960.2,"dur":11.84}]},{"speaker":"A","text":"I wanted to use Ariana Grande as an example because she had a stalker who copied everything she did.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/302690-304002.webm","at":3027.1,"dur":13.12}]},{"speaker":"B","text":"You can just say that Ariana Grande, along with many other pop stars, has reported similar cases.","highlights":["reported similar cases"],"clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/305582-306509.webm","at":3055.9,"dur":9.27}]},{"speaker":"A","text":"Does 'reported a case' sound like they called the police?","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/313076-314035.webm","at":3131.0,"dur":9.59}]},{"speaker":"B","text":"It sounds like they shared that they've experienced the same problem. You're overcomplicating a simple idea.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/314128-314539.webm","at":3141.5,"dur":4.11},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/318792-319167.webm","at":3188.1,"dur":3.75}]},{"speaker":"A","text":"I know, I was just trying to rephrase it for so long!","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/322970-323244.webm","at":3229.9,"dur":2.74}]}],"time":2793.7,"topic":3},{"title":"Discussing celebrity privacy and essay improvements","lines":[{"speaker":"A","text":"I've lost track of how celebrities handle their children's privacy and their complicated lifestyles.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/325420-325737.webm","at":3254.4,"dur":3.17},{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/326720-327089.webm","at":3267.4,"dur":3.69}]},{"speaker":"B","text":"You should split those ideas into separate sentences instead of trying to cram everything into one.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/329010-329374.webm","at":3290.2,"dur":3.64}]},{"speaker":"A","text":"I'm trying to use 'such as' for examples, like mentioning George Clooney.","clips":[{"src":"lesson_audio/lesson_date_04-10-2026_time_13-46-13/331428-332222.webm","at":3314.4,"dur":7.94}]},{"speaker":"B","text":"Actually, 'such as' is quite formal. Also, this fact shows how seriously the stars treat their children's privacy.","clips":[{"src":"lesson_audio/lesson_dat
