very important pieces of information.","lesson":true}],"uncountable":[],"more_examples":["The police are looking for any piece of information regarding the suspect's location.","I'm still waiting for a piece of information about the flight delay.","Could you provide a piece of information to confirm your identity?"],"synonyms":["detail","fact","point","item of data","bit of information"],"antonyms":[],"gap":{"sentence":"I couldn't complete the registration because I was missing one crucial _____ from the user.","answer":"piece of information","options":["piece of information","piece of furniture","piece of luggage","piece of jewelry"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/421608-421999.webm","at":4216.2,"dur":3.91}},{"term":"never rely on","pos":"expression","definition":"Do not trust or depend on something because it may be inaccurate or unreliable.","time":4277.0,"lesson":"Never rely on the answers that a person who made the exercise gives because the answer may be incorrect. Sometimes multiple answers are possible, so you should always check your results using AI.","examples":[{"sentence":"You should never rely on rumors when making such an important decision.","pattern":"never rely on + noun"},{"sentence":"I never rely on my memory for dates; I always write them down in a calendar.","pattern":""},{"sentence":"He is a great friend, but I would never rely on him for financial advice.","pattern":"would never rely on"}],"more_examples":["You should never rely on a GPS in areas with poor cell service.","Never rely on the weather forecast to plan an outdoor wedding."],"synonyms":["don't trust","don't depend on","don't bank on","don't count on","don't lean on"],"antonyms":["always trust"],"gap":{"sentence":"The GPS signal is often very weak in this area, so you should _____ it for directions.","answer":"never rely on","options":["never rely on","always trust","constantly follow","strictly obey"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/427726-428435.webm","at":4277.5,"dur":7.09}},{"term":"review","pos":"verb","definition":"To examine or check something again, often with the help of another tool or person.","time":4311.0,"lesson":"Some of the exercises I give you may be incorrect or incomplete. They are there for you to think about and then review some of those cases with ChatGPT or another AI.","examples":[{"sentence":"I need to review my notes before the exam starts.","pattern":"review + noun"},{"sentence":"Could you please review my essay and give me some feedback?","pattern":"review + object + and + verb"},{"sentence":"The manager will review your application next week.","pattern":"will + review"},{"sentence":"Let's review what we learned in the last session.","pattern":"review + what-clause"}],"more_examples":["The legal team needs to review the contract before we sign it.","I'm going to review the footage from the security camera.","Can you review these figures to make sure there are no errors?"],"synonyms":["go over","check","examine","inspect","re-examine","evaluate","scrutinize","audit"],"antonyms":["ignore","overlook","disregard"],"gap":{"sentence":"The architect asked the engineer to _____ the blueprints to ensure there were no structural errors before construction began.","answer":"review","options":["review","ignore","build","paint"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/431516-431935.webm","at":4315.3,"dur":4.19}}],"dialogues":[{"title":"Gym routines and family dynamics","lines":[{"speaker":"A","text":"Is the connection working now? It should be working from your phone, even if it's a bit less convenient than using a PC.","highlights":["less convenient"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/004576-005619.webm","at":46.0,"dur":10.43},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/005982-006639.webm","at":60.0,"dur":6.57}]},{"speaker":"B","text":"Yeah, I'm connected. It's actually quite comfortable because I can hear you through my phone while typing on my computer keyboard.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/015028-016119.webm","at":150.4,"dur":10.91}]},{"speaker":"A","text":"Are you still using your headphones? You should hold your microphone a bit further away from your mouth; it's hurting my ears.","highlights":["further away"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/016422-016868.webm","at":164.3,"dur":4.46},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/018245-019294.webm","at":182.6,"dur":10.49}]},{"speaker":"B","text":"I'm a gamer, but I usually don't use a mic for single-player games. When I play multiplayer, I use this one.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/021400-022865.webm","at":214.2,"dur":14.65},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/023108-023625.webm","at":231.3,"dur":5.17}]},{"speaker":"A","text":"So, how are you doing today? What have you been up to?","highlights":["been up to"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/025978-027208.webm","at":260.0,"dur":12.3}]},{"speaker":"B","text":"I just got back from the gym after having lunch. Not much has happened since I woke up.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/028900-030272.webm","at":289.2,"dur":13.72}]},{"speaker":"A","text":"You woke up at 9 a.m. and went straight to the gym? How do you commute to the city?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/035016-036110.webm","at":350.4,"dur":10.94}]},{"speaker":"B","text":"My parents drive me there because they go to the gym in the morning too. My mom goes less often than my dad.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/047484-048968.webm","at":474.9,"dur":14.84},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/049606-050961.webm","at":496.2,"dur":13.55}]},{"speaker":"A","text":"Your father must be jacked! Do you know what that means? It means he's very muscular and has a six-pack.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/051651-052939.webm","at":516.6,"dur":12.88}]},{"speaker":"B","text":"I think he's more of a big guy. He was fed a lot of food as a child, so he has some extra weight he wants to lose.","highlights":["extra weight"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/053174-054115.webm","at":531.9,"dur":9.41},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/054448-056223.webm","at":544.7,"dur":17.75}]},{"speaker":"A","text":"And you probably want the opposite since you look quite skinny.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/058146-059449.webm","at":582.0,"dur":13.03}]},{"speaker":"B","text":"My parents fed me well, but they always gave me healthy food, never any junk food.","highlights":["junk food"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/060091-060862.webm","at":601.1,"dur":7.71},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/061448-062907.webm","at":614.7,"dur":14.59}]}],"time":44.0,"topic":0},{"title":"Fitness goals and school life","lines":[{"speaker":"A","text":"I used to be fed pretty well until about seventh grade, but then I just started losing weight over the summer.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/067036-068491.webm","at":670.6,"dur":14.55}]},{"speaker":"B","text":"You lost about eight kilograms in just one summer? Looking at you, it's hard to imagine how you could have done that.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/070881-071911.webm","at":708.9,"dur":10.3}]},{"speaker":"A","text":"I'm about one meter eighty-six or eighty-seven. I guess it's just extra weight, but I'm not sure.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/072756-073559.webm","at":727.7,"dur":8.03},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/073866-074888.webm","at":738.9,"dur":10.22}]},{"speaker":"B","text":"What's the word for weight that someone isn't happy about? I think 'excess weight' fits best.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/074862-076132.webm","at":748.8,"dur":12.7}]},{"speaker":"A","text":"I can imagine you grew a lot over the summer. Your body probably used all its resources for that growth spurt.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/080334-081637.webm","at":803.5,"dur":13.03}]},{"speaker":"B","text":"Being skinny is much better than being overweight, so you're in a good position. Has being thin ever bothered you?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/082226-083492.webm","at":823.6,"dur":12.66}]},{"speaker":"A","text":"It doesn't bother me much, but I want to gain some muscle and improve my English.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/086820-088277.webm","at":868.4,"dur":14.57}]},{"speaker":"B","text":"That's a solid plan. Most people who hit the gym don't do anything else, but you're balancing multiple activities.","highlights":["hit the gym"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/089306-090876.webm","at":893.3,"dur":15.7}]},{"speaker":"A","text":"I need to pass the IELTS exam to study abroad, but I also want muscles to look good and attract girls.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/091376-092994.webm","at":914.0,"dur":16.18}]},{"speaker":"B","text":"So, since you don't have to go to school anymore, do you enjoy the freedom?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/098138-098947.webm","at":981.6,"dur":8.09}]},{"speaker":"A","text":"I love not wearing a uniform and avoiding those annoying people who used to embarrass me.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/101046-102582.webm","at":1010.6,"dur":15.36}]},{"speaker":"B","text":"Did you have any friends you liked hanging out with back then?","highlights":["hanging out with"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/106506-107041.webm","at":1065.3,"dur":5.35}]},{"speaker":"A","text":"I had some, but now that ninth grade is over, I'm focusing more on my hobbies like coding and English.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/107162-108723.webm","at":1071.8,"dur":15.61}]}],"time":670.6,"topic":1},{"title":"Overcoming procrastination and managing mistakes","lines":[{"speaker":"A","text":"Do you feel like you're being productive lately?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/111910-112095.webm","at":1119.2,"dur":1.85}]},{"speaker":"B","text":"Sometimes I feel like I'm not doing as much as I could. I don't get enough tasks done, and it makes me feel uncomfortable.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/112252-113517.webm","at":1122.7,"dur":12.65}]},{"speaker":"A","text":"Do you ever find yourself procrastinating? Like, having a class on Friday and waiting until Thursday evening to start your essay?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/116094-117552.webm","at":1161.0,"dur":14.58}]},{"speaker":"B","text":"I'm trying to get things done before the deadline now. In 9th grade, I used to leave everything until the night before, but I'm trying to change that.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/118456-119881.webm","at":1184.7,"dur":14.25}]},{"speaker":"A","text":"Usually, if you're constantly putting things off, it means you're not interested. Maybe your body was just sabotaging your learning because you didn't like math.","highlights":["putting things off"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/122616-124169.webm","at":1226.8,"dur":15.53}]},{"speaker":"B","text":"I think I just had a bad teacher who gave us way too much homework—like six or seven full exams in a week. It was so boring and demanding.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/124124-125773.webm","at":1243.0,"dur":16.49}]},{"speaker":"A","text":"You seem more aware of your mistakes now. Are you trying to monitor yourself more while speaking English?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/130546-132117.webm","at":1305.9,"dur":15.71}]},{"speaker":"B","text":"I guess I am monitoring a bit. I want to speak without mistakes, but when I talk to an AI, I'm much more fluent because I don't think about it.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/133284-134849.webm","at":1332.9,"dur":15.65}]},{"speaker":"A","text":"The review takes a lot of processing power because it runs on my local computer using about 1,500 AI requests. It's a heavy job, but it highlights the mistakes we make.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/142914-144347.webm","at":1429.2,"dur":14.33}]},{"speaker":"A","text":"Don't let these mistakes bother you. If you think too hard about them, you'll end up making more. Making mistakes is inevitable, and progress means making slightly fewer of them each time.","highlights":["end up"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/147500-149006.webm","at":1475.1,"dur":15.06}]}],"time":1119.2,"topic":1},{"title":"Language learning strategies and essay feedback","lines":[{"speaker":"A","text":"Even if you only improve on one mistake today, that's still progress. Small, gradual improvements are fundamental to learning English.","highlights":["small, gradual improvements"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/155520-156063.webm","at":1555.4,"dur":5.43},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/158318-159096.webm","at":1583.4,"dur":7.78}]},{"speaker":"B","text":"I'll focus on my past tense today. I'll make sure I use 'had' instead of 'have' and 'bought' instead of 'buy.'","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/156338-156595.webm","at":1563.5,"dur":2.57},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/157420-157739.webm","at":1574.4,"dur":3.19}]},{"speaker":"A","text":"The goal is to make every essay slightly better without it being mentally draining. You should be able to relax and enjoy the process, even if you make mistakes.","highlights":["mentally draining"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/159808-160750.webm","at":1598.2,"dur":9.42}]},{"speaker":"B","text":"I can't remember any new words from the review right now.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/163370-164507.webm","at":1633.8,"dur":11.37}]},{"speaker":"A","text":"You can check the vocabulary section. Specifically, the 'fill the gap' and 'match' subsections are worth your while to test your understanding.","highlights":["worth your while"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/166670-167302.webm","at":1666.9,"dur":6.32},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/168288-168725.webm","at":1683.1,"dur":4.37}]},{"speaker":"A","text":"You don't need to read every entry. Just focus on the three or four words you didn't know during the quiz.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/171952-172550.webm","at":1719.6,"dur":5.98}]},{"speaker":"B","text":"I used AI to correct some mistakes, but I was trying to describe a low-quality speaking practice app and couldn't find the words.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/182250-182643.webm","at":1822.6,"dur":3.93},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/184544-185439.webm","at":1845.6,"dur":8.95}]},{"speaker":"A","text":"You can use AI to list mistakes, but never copy-paste its sentences into your document. You have to correct them yourself.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/185562-185982.webm","at":1855.8,"dur":4.2},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/188210-188563.webm","at":1882.2,"dur":3.53}]},{"speaker":"A","text":"Your example is good in a nutshell, but it lacks details. You did better in the actual essay by adding YouTube.","highlights":["in a nutshell"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/189140-189805.webm","at":1891.5,"dur":6.65},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/190324-190607.webm","at":1903.3,"dur":2.83}]},{"speaker":"A","text":"Let's look at the second idea. If you click my avatar, you can follow my cursor. It's a little life hack.","highlights":["life hack"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/192068-193059.webm","at":1920.8,"dur":9.91}]},{"speaker":"A","text":"The idea about Zara and YouTube is clear. However, when you write examples, you must imagine you are a reader seeing it for the first time.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/194468-195495.webm","at":1944.8,"dur":10.27},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/200096-200657.webm","at":2001.1,"dur":5.61}]}],"time":1555.4,"topic":2},{"title":"Improving IELTS writing logic and grammar","lines":[{"speaker":"A","text":"Since the examiner is reading your essay for the first time, everything needs to be crystal clear. It should answer the questions without raising new ones.","highlights":["crystal clear"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/200698-202111.webm","at":2007.2,"dur":14.13}]},{"speaker":"B","text":"I see. So, every sentence in my draft actually raises new questions and makes it hard to understand the context.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/202322-203347.webm","at":2023.4,"dur":10.25}]},{"speaker":"A","text":"Exactly. For example, when you say many adults were looking for an online clothing store, I need more details. When? Why? On what platform?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/203500-204933.webm","at":2035.2,"dur":14.33}]},{"speaker":"A","text":"You have to help the reader. Don't think of the examiner as a strict judge; think of them as a reader who needs you to convey your ideas clearly.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/207296-208847.webm","at":2073.1,"dur":15.51}]},{"speaker":"B","text":"Should I include more people to make the example bigger, or just tell you what I imagined in my head?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/217904-219545.webm","at":2179.1,"dur":16.41}]},{"speaker":"A","text":"Just tell me what you were thinking. You imagined that if someone wants clothes, YouTube might recommend Zara, and they save time because it's a great website.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/220306-222386.webm","at":2203.2,"dur":20.8}]},{"speaker":"A","text":"However, your grammar needs to convey that message. If this happens on a regular basis, why did you use the past continuous tense?","highlights":["on a regular basis"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/222438-224854.webm","at":2227.6,"dur":24.16}]},{"speaker":"A","text":"The continuous aspect, like 'I am looking,' describes a process happening right now. Your sentence makes it sound like a very specific story that happened yesterday at 2 p.m.","highlights":["right now"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/226033-227516.webm","at":2260.5,"dur":14.83}]},{"speaker":"A","text":"To state a general fact, we should say 'many adults look for an online clothing store.' How often do they do that? Every day?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/231734-233115.webm","at":2317.4,"dur":13.81},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/234442-235397.webm","at":2344.6,"dur":9.55}]},{"speaker":"A","text":"Great! Adding those details about frequency helps the reader understand much better. It's a win-win because improving your grammar actually improves your logic.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/235304-235693.webm","at":2353.2,"dur":3.89},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/249080-249483.webm","at":2491.0,"dur":4.03}]},{"speaker":"B","text":"Can you explain why we use the gerund here and here?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/251430-253142.webm","at":2520.5,"dur":17.12}]}],"time":2007.2,"topic":2},{"title":"Gerunds, Repetition, and Essay Structure","lines":[{"speaker":"A","text":"What word tells us that we need to use a gerund here?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/254238-254555.webm","at":2542.5,"dur":3.17}]},{"speaker":"B","text":"It's the word 'without'. Certain words, like 'without' or 'of', require a gerund, such as 'without living' or 'the process of writing'.","highlights":["require a gerund"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/256570-257049.webm","at":2565.9,"dur":4.79},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/257202-258639.webm","at":2572.2,"dur":14.37}]},{"speaker":"A","text":"I see. So for every word like 'without', we can learn the specific forms that follow it.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/259046-259803.webm","at":2590.7,"dur":7.57}]},{"speaker":"B","text":"Exactly. However, 'trying gloves on' doesn't really fit the context here. It's not very natural for a native speaker.","highlights":["fit the context"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/260438-262001.webm","at":2604.6,"dur":15.63},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/261338-262332.webm","at":2618.7,"dur":9.94}]},{"speaker":"A","text":"If we end the sentence here, would we lose anything? Is this part significant enough to keep?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/264716-265567.webm","at":2647.4,"dur":8.51},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/267456-267857.webm","at":2674.8,"dur":4.01}]},{"speaker":"B","text":"Not really. If we remove it, nothing changes. It's a great way to fix repetition by simply cutting out unnecessary parts.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/268182-270264.webm","at":2681.9,"dur":20.82}]},{"speaker":"A","text":"For instance, if you keep saying 'some people also believe,' you don't need synonyms for every word; you can just paraphrase the entire sentence.","highlights":["paraphrase the entire sentence"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/270244-271595.webm","at":2702.5,"dur":13.51},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/272588-273328.webm","at":2726.1,"dur":7.4}]},{"speaker":"B","text":"Right. Since 'people' and 'believe' are insignificant here, we can express the general idea better without focusing on individuals.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/276990-278358.webm","at":2770.1,"dur":13.68}]},{"speaker":"A","text":"I'm not even sure if 'believed' is the right word. Using 'trust' feels like a stretch; it's completely unnecessary.","highlights":["feels like a stretch"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/280818-282121.webm","at":2808.4,"dur":13.03}]},{"speaker":"B","text":"We can now use a better phrase, like 'saving time by avoiding a trip to the store.' That makes total sense.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/283160-283877.webm","at":2831.8,"dur":7.17},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/285770-286647.webm","at":2857.9,"dur":8.77}]},{"speaker":"A","text":"In our plan, we have three parts: the idea in a nutshell, the explanation, and the example. I mentioned that examples are vital.","highlights":["in a nutshell"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/287346-288798.webm","at":2873.7,"dur":14.52}]},{"speaker":"B","text":"That's true, but we shouldn't ignore the explanation. That's where you describe how the idea works in general, like how algorithms benefit companies.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/289376-290838.webm","at":2894.0,"dur":14.62}]},{"speaker":"A","text":"Is it only about speed? What if the store is in your basement? Would you rather go there or order from Zara?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/295962-296487.webm","at":2959.7,"dur":5.25},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/296880-297711.webm","at":2969.0,"dur":8.31}]},{"speaker":"B","text":"I'd go to the basement because it's faster than waiting for a delivery. But there are other factors, like why someone would choose a big brand over a local market.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/298405-299857.webm","at":2984.2,"dur":14.52},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/300024-300885.webm","at":3000.4,"dur":8.61}]}],"time":2542.5,"topic":2},{"title":"Advantages of online shopping and marketing","lines":[{"speaker":"A","text":"Online stores often struggle with product quality, but some websites offer much better quality and faster shipping.","highlights":["struggle with"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/302140-303522.webm","at":3021.6,"dur":13.82}]},{"speaker":"B","text":"From a company's perspective, the main advantage is being able to reach more customers in a shorter amount of time.","highlights":["shorter amount of time"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/303848-304989.webm","at":3038.7,"dur":11.41}]},{"speaker":"A","text":"Let's think of another reason for companies. For instance, why would Zara use YouTube ads or a delivery service if they already have many physical stores?","highlights":["For instance"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/306130-306867.webm","at":3061.4,"dur":7.37},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/308827-310014.webm","at":3088.4,"dur":11.87}]},{"speaker":"B","text":"They do it to reach more people and increase brand awareness. They could also use it to get people to design new clothes.","highlights":["brand awareness"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/315162-315915.webm","at":3151.8,"dur":7.53},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/316530-317941.webm","at":3165.5,"dur":14.11}]},{"speaker":"A","text":"Actually, Mercedes doesn't advertise on YouTube, yet they have plenty of creative people designing their cars. That's a bad example.","highlights":["bad example"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/319160-320561.webm","at":3191.8,"dur":14.01}]},{"speaker":"B","text":"Online stores remove physical limitations like limited floor space, fitting rooms, or long queues to pay.","highlights":["floor space"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/322250-323021.webm","at":3222.7,"dur":7.71},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/323390-324815.webm","at":3234.1,"dur":14.25}]},{"speaker":"A","text":"Exactly. If you live in Ufa and a specific size is sold out locally, it's much more convenient to order it online.","highlights":["sold out"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/327552-328846.webm","at":3275.7,"dur":12.94}]},{"speaker":"B","text":"You can also store everything in one big warehouse instead of shipping small portions all over the country.","highlights":["all over the country"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/329206-330389.webm","at":3292.2,"dur":11.83}]},{"speaker":"A","text":"We should just mention the third point. Since our example is mostly about customers, there's no point in listing too many reasons for companies.","highlights":["there's no point"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/332048-333693.webm","at":3320.7,"dur":16.45}]},{"speaker":"B","text":"Let's write: 'It's faster to buy high-quality clothes without leaving home on one website.'","highlights":["without leaving home"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/339686-340151.webm","at":3397.1,"dur":4.65},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/362714-363147.webm","at":3627.3,"dur":4.33}]},{"speaker":"A","text":"I almost confused 'in one place' with 'in one piece,' which means surviving something without getting hurt.","highlights":["in one piece"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/364586-365551.webm","at":3646.1,"dur":9.65}]},{"speaker":"B","text":"I'm really happy with this body paragraph. It's very satisfying.","highlights":["body paragraph"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/368478-369131.webm","at":3685.0,"dur":6.53}]},{"speaker":"A","text":"In recent years, recommendation algorithms have dramatically saved us time when searching.","highlights":["recommendation algorithms"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/369708-370681.webm","at":3697.2,"dur":9.73},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/371640-371946.webm","at":3716.6,"dur":3.06}]}],"time":3021.0,"topic":3},{"title":"Mastering English Articles and Countability","lines":[{"speaker":"A","text":"In your example about TikTok, you mention over-reliance on algorithms. It feels like it lacks a few specific details and a clear timeframe.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/375112-376415.webm","at":3751.3,"dur":13.03}]},{"speaker":"B","text":"I see what you mean. People often get these apps recommended while scrolling through TikTok, and then they end up disappointed with the quality.","highlights":["end up"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/379834-380839.webm","at":3798.5,"dur":10.05}]},{"speaker":"A","text":"Exactly. It's a general pattern. By the way, I noticed you used the past tense there. Why did you switch to the past tense?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/391062-391325.webm","at":3910.8,"dur":2.63},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/392276-393721.webm","at":3923.0,"dur":14.45}]},{"speaker":"B","text":"I'll keep an eye on my articles. I know I sometimes forget to use them when I speak, so I'll work on that.","highlights":["keep an eye on"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/402908-403650.webm","at":4029.3,"dur":7.42}]},{"speaker":"A","text":"To use articles correctly, we need to understand countability. For instance, 'cup' is countable, but 'water' is uncountable.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/406782-407951.webm","at":4068.0,"dur":11.69},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/408174-408655.webm","at":4081.9,"dur":4.81}]},{"speaker":"B","text":"Right. And some words are tricky. In Russian, 'advice' is countable, but in English, it's treated like 'information'.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/415128-415705.webm","at":4151.5,"dur":5.77},{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/416606-417116.webm","at":4166.3,"dur":5.1}]},{"speaker":"A","text":"Exactly. You can't say 'three informations.' You have to say 'pieces of advice' if you want to count them.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/419240-420861.webm","at":4192.6,"dur":16.21}]},{"speaker":"B","text":"I'll do the exercises you send. If I'm ever confused by an answer, I'll check it with an AI to see why my choice was wrong.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/432870-433623.webm","at":4328.8,"dur":7.53}]},{"speaker":"A","text":"That's a good plan. Never rely solely on the answer key, as they aren't always perfect. See you on Sunday!","highlights":["rely solely on"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/427726-429369.webm","at":4277.5,"dur":16.43}]},{"speaker":"B","text":"See you! Enjoy your weekend.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_16-15-06/434106-434559.webm","at":4341.3,"dur":4.53}]}],"time":3751.3,"topic":3}]};

            // --------------------------------------------------------- helpers
            function esc(value) {
                return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
            }

            function norm(word) {
                return word.toLowerCase().replace(/’/g, "'").replace(/[^\p{L}\p{N}']/gu, '');
            }

            function stem(word) {
                let w = norm(word).replace(/'s$/, '');
                if (IRREGULAR[w]) return IRREGULAR[w];
                for (const suffix of ['ing', 'ied', 'ies', 'ed', 'es', 's', 'ly']) {
                    if (w.endsWith(suffix) && w.length - suffix.length >= 3) { w = w.slice(0, -suffix.length); break; }
                }
                return w.replace(/e+$/, '');
            }

            function playButton(text, label) {
                return `<button class="play" type="button" data-say="${esc(text)}" aria-label="${esc(label || 'Listen')}" data-no-speech>${icons.play}</button>`;
            }

            // A clip of the lesson recording: a pill with the time it was said,
            // which opens into a small player when tapped.
            function clipHtml(clip, label) {
                if (!clip || !clip.src) return '';
                const at = clock(clip.at);
                return `<span class="clip" data-src="${esc(clip.src)}" data-no-speech>`
                    + `<button class="clip-main" type="button" title="${esc(label)}" aria-label="${esc(label)}, ${at}">${icons.clipPlay}${icons.clipPause}<span>${at}</span></button>`
                    + '<span class="clip-more">'
                    + `<button class="clip-skip" type="button" data-skip="-3" title="Back 3 seconds" aria-label="Back 3 seconds">${icons.back3}</button>`
                    + '<span class="clip-bar" role="slider" tabindex="0" aria-label="Position in the clip" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="clip-fill"></span></span>'
                    + `<button class="clip-skip" type="button" data-skip="3" title="Forward 3 seconds" aria-label="Forward 3 seconds">${icons.forward3}</button>`
                    + '</span></span>';
            }

            // Word diff (longest common subsequence) between what was said and the fix.
            function diff(before, after) {
                const a = before.split(/\s+/).filter(Boolean);
                const b = after.split(/\s+/).filter(Boolean);
                const n = a.length, m = b.length;
                const table = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
                for (let i = n - 1; i >= 0; i--) {
                    for (let j = m - 1; j >= 0; j--) {
                        table[i][j] = norm(a[i]) === norm(b[j]) ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
                    }
                }
                const left = [], right = [];
                let i = 0, j = 0;
                while (i < n || j < m) {
                    if (i < n && j < m && norm(a[i]) === norm(b[j])) {
                        left.push({ word: a[i++], kind: 'same' });
                        right.push({ word: b[j++], kind: 'same' });
                    } else if (j >= m || (i < n && table[i + 1][j] >= table[i][j + 1])) {
                        const word = a[i];
                        const previous = i > 0 ? norm(a[i - 1]) : '';
                        const noise = FILLERS.has(norm(word)) || norm(word) === previous || !norm(word);
                        left.push({ word, kind: noise ? 'same' : 'del' });
                        i++;
                    } else {
                        // Mark where a missing word belongs, unless a deletion already shows the spot.
                        const last = left[left.length - 1];
                        if (!last || (last.kind !== 'del' && last.kind !== 'gap')) left.push({ kind: 'gap' });
                        right.push({ word: b[j++], kind: 'ins' });
                    }
                }
                const render = (tokens, tag) => tokens.map(t => {
                    if (t.kind === 'gap') return '<span class="gap" aria-hidden="true"></span>';
                    return t.kind === 'same' ? esc(t.word) : `<${tag} class="w">${esc(t.word)}</${tag}>`;
                }).join(' ').replace(/<\/(del|ins)> <\1 class="w">/g, ' ');
                return { said: render(left, 'del'), fixed: render(right, 'ins') };
            }

            function highlightTerm(sentence, term) {
                const wanted = term.split(/\s+/).map(norm).filter(w => w && !PLACEHOLDERS.has(w));
                const content = new Set(wanted.filter(w => !FUNCTION_WORDS.has(w)).map(stem));
                const functional = new Set(wanted.filter(w => FUNCTION_WORDS.has(w)));
                const parts = sentence.split(/(\s+)/);
                const hit = parts.map(part => part.trim() && content.has(stem(part)));
                parts.forEach((part, index) => {
                    if (!hit[index] && functional.has(norm(part))) {
                        const near = [index - 2, index + 2].some(k => hit[k]);
                        if (near) hit[index] = true;
                    }
                });
                return parts.map((part, index) => {
                    if (!hit[index]) return esc(part);
                    // Underline the word itself, not quotes or punctuation stuck to it.
                    const [, before, core, after] = part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                    return `${esc(before)}<b class="hl">${esc(core)}</b>${esc(after)}`;
                }).join('');
            }

            // link(phrase): the vocabulary entry of a highlighted phrase, or -1.
            function highlightPhrases(text, phrases, link) {
                const lower = text.toLowerCase();
                const ranges = [];
                (phrases || []).forEach(phrase => {
                    const at = lower.indexOf(phrase.toLowerCase());
                    if (at >= 0 && !ranges.some(r => at < r[1] && at + phrase.length > r[0])) ranges.push([at, at + phrase.length, phrase]);
                });
                ranges.sort((x, y) => x[0] - y[0]);
                let html = '', cursor = 0;
                ranges.forEach(([start, end, phrase]) => {
                    const word = link ? link(phrase) : -1;
                    const opens = word >= 0 ? ` data-vocab="${word}" title="${esc(`See “${vocabulary[word].term}” in Vocabulary`)}"` : '';
                    html += esc(text.slice(cursor, start)) + `<mark class="expr"${opens}>${esc(text.slice(start, end))}</mark>`;
                    cursor = end;
                });
                return html + esc(text.slice(cursor));
            }

            function storage(key, value) {
                try {
                    if (value === undefined) return window.localStorage.getItem(key);
                    window.localStorage.setItem(key, value);
                } catch (_error) {
                    return null;
                }
                return null;
            }

            // ---------------------------------------------------------- header
            document.getElementById('title').textContent = meta.title || 'Lesson review';

            // The lesson time in Moscow time (meta.start_utc: when the lesson
            // began, in seconds since 1970). A tap shows it in the reader's own
            // time zone instead, remembered on the phone. Older pages have no
            // start_utc: the date and time as recorded, with no zone.
            const eyebrow = document.getElementById('eyebrow');
            const lessonStart = typeof meta.start_utc === 'number' && isFinite(meta.start_utc) ? new Date(meta.start_utc * 1000) : null;
            let lessonTimes = null;
            let ownZone = storage('lesson-time-zone') === 'own';

            function zoneTime(zone) {
                const date = { day: 'numeric', month: 'long', year: 'numeric' };
                const time = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
                if (zone) { date.timeZone = zone; time.timeZone = zone; }
                return {
                    date: new Intl.DateTimeFormat('en-GB', date).format(lessonStart),
                    time: new Intl.DateTimeFormat('en-GB', time).format(lessonStart)
                };
            }

            function offsetName(minutes) {
                const size = Math.abs(minutes);
                if (!size) return 'GMT';
                return 'GMT' + (minutes < 0 ? '-' : '+') + Math.floor(size / 60) + (size % 60 ? ':' + String(size % 60).padStart(2, '0') : '');
            }

            if (lessonStart) {
                try {
                    const moscow = zoneTime('Europe/Moscow');
                    const own = zoneTime(null);
                    lessonTimes = {
                        moscow: Object.assign(moscow, { zone: 'MSK', name: 'Moscow time' }),
                        own: Object.assign(own, { zone: offsetName(-lessonStart.getTimezoneOffset()), name: 'your time' }),
                        differ: moscow.date !== own.date || moscow.time !== own.time
                    };
                } catch (_error) {
                    lessonTimes = null;  // no time zones in this browser: the time as recorded
                }
            }

            function showLessonTime() {
                let date = meta.date;
                if (!lessonTimes) {
                    eyebrow.textContent = ['English lesson', meta.date, meta.time].filter(Boolean).join(' · ');
                } else {
                    const shown = lessonTimes.differ && ownZone ? lessonTimes.own : lessonTimes.moscow;
                    const other = shown === lessonTimes.own ? lessonTimes.moscow : lessonTimes.own;
                    const time = `${esc(shown.time)} <span class="tz">${esc(shown.zone)}</span>`;
                    date = shown.date;
                    eyebrow.innerHTML = `English lesson · ${esc(shown.date)} · `
                        + (lessonTimes.differ
                            ? `<button class="tz-btn" type="button" title="Show ${esc(other.name)} (${esc(other.zone)})" aria-label="${esc(`${shown.time} ${shown.name}. Show ${other.name}, ${other.zone}`)}">${time}</button>`
                            : `<span class="tz-time">${time}</span>`);
                }
                document.title = (meta.title ? meta.title + ' · ' : '') + 'English lesson' + (date ? ' · ' + date : '');
            }
            showLessonTime();
            eyebrow.addEventListener('click', event => {
                if (!event.target.closest('.tz-btn')) return;
                ownZone = !ownZone;
                storage('lesson-time-zone', ownZone ? 'own' : 'moscow');
                showLessonTime();
                const button = eyebrow.querySelector('.tz-btn');
                if (button && event.detail === 0) button.focus();  // kept for the keyboard
            });

            document.getElementById('count-mistakes').textContent = mistakes.length;
            document.getElementById('count-vocabulary').textContent = vocabulary.length;
            document.getElementById('count-dialogues').textContent = dialogues.length;

            // -------------------------------------------------------- mistakes
            const topics = lesson.topics || [];
            // Each mistake example, word and dialogue line can be found by the timeline.
            const exampleIds = new Map();
            mistakes.forEach((card, c) => (card.examples || []).forEach((example, e) => exampleIds.set(example, `m-${c}-${e}`)));
            let showAllMistakes = () => {};
            let vocabularyToWords = () => {};
            // What "Go back" needs to put a section back as it was.
            let mistakeFilter = () => 'all';
            let setMistakeFilter = () => {};
            let vocabularyView = () => 'words';
            let setVocabularyView = () => {};

            function clock(seconds) {
                if (seconds === null || seconds === undefined) return '';
                const total = Math.max(0, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const rest = String(total % 60).padStart(2, '0');
                return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
            }

            function plain(text) {
                return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
            }

            // One example: when it was said, the full sentence(s) as said and
            // corrected, and (where it adds something) its own explanation.
            function exampleHtml(example, options) {
                const before = example.context || example.quote;
                const after = example.context_fix || example.fix;
                const d = diff(before, after);
                // The clip pill needs no separator: it stays apart from the topic when the line wraps.
                const pill = clipHtml(example.clip, 'Hear what was said');
                // The letters beside the time open the same moment in the other sections.
                const jumps = jumpsHtml('mistakes', example.clip ? example.clip.at : example.time);
                const facts = [];
                if (!pill && example.time !== null && example.time !== undefined) facts.push(`<span class="clock">${clock(example.time)}</span>${jumps}`);
                if (options.showTopic && topics[example.topic]) facts.push(`<span>${esc(topics[example.topic].title)}</span>`);
                let html = `<div class="pair" data-item="${exampleIds.get(example) || ''}"${options.hidden ? ' hidden' : ''}>`;
                const separator = jumps && !pill ? '' : '<span class="sep">·</span>';
                if (pill || facts.length) html += `<div class="ex-meta" data-no-speech>${pill}${pill ? jumps : ''}${facts.join(separator)}</div>`;
                html += `<div class="said"><span class="mark-icon" aria-label="What was said" data-no-speech>✗</span><span class="txt">${d.said}</span></div>`;
                html += `<div class="fixed"><span class="mark-icon" aria-label="Better" data-no-speech>✓</span><span class="txt">${d.fixed}</span>${playButton(after, 'Listen to the correct version')}</div>`;
                if (options.why) html += `<p class="ex-why">${esc(options.why)}</p>`;
                return html + '</div>';
            }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
                    html += items.map(item => `<li><span class="meaning">${esc(item.meaning)}</span><span class="m-ex">${highlightTerm(item.example, entry.term)}`
                        + (item.lesson ? ' <span class="from-lesson" data-no-speech>from the lesson</span>' : '') + '</span></li>').join('');
                    return html + '</ol></div>';
                };
                return '<div class="forms">'
                    + column('Countable', 'a / an, plural', entry.countable || [])
                    + column('Uncountable', 'no a / an, no plural', entry.uncountable || [])
                    + '</div>';
            }

            function relatedHtml(entry) {
                const row = (title, words) => (words || []).length
                    ? `<div class="rel"><p class="part-title" data-no-speech>${title}</p><span class="rel-words">${words.map(w => `<span class="rel-word">${esc(w)}</span>`).join('<span class="sep" data-no-speech> · </span>')}</span></div>`
                    : '';
                return row('Synonyms', entry.synonyms) + row('Antonyms', entry.antonyms);
            }

            // Visible: when it was said, the word, the meaning, the lesson's own
            // words and at least three examples. The rest opens on request.
            function wordCardHtml(entry, index) {
                const term = entry.term || '';
                let html = `<article class="card word" id="word-${index}"><div class="w-head">`;
                if (entry.clip) html += clipHtml(entry.clip, 'Hear it in the lesson');
                else if (entry.time !== null && entry.time !== undefined) html += `<span class="clock" data-no-speech>${clock(entry.time)}</span>`;
                html += jumpsHtml('vocabulary', entry.clip ? entry.clip.at : entry.time);
                // The word, its kind and its speaker stay together (a new row when
                // they do not fit); the kind and the speaker never part.
                html += `<div class="w-title"><h3 class="w-term">${esc(term)}</h3><span class="w-side">`;
                if (entry.pos) html += `<span class="w-pos" data-no-speech>${esc(entry.pos)}</span>`;
                html += playButton(term, 'Listen to ' + term) + '</span></div></div>';
                if (entry.definition) html += `<p class="def">${esc(entry.definition)}</p>`;
                const passage = entry.lesson || entry.lesson_example;
                if (passage) {
                    html += `<div class="lesson-ex"><div class="txt"><span class="src" data-no-speech>From the lesson</span>${highlightTerm(passage, term)}</div>${playButton(passage, 'Listen')}</div>`;
                }
                const examples = exampleItems(entry);
                if (examples.length) {
                    html += '<ul class="examples">' + examples.map(example => '<li>'
                        + (example.pattern ? `<span class="pat" data-no-speech>${esc(example.pattern)}</span> ` : '')
                        + highlightTerm(example.sentence, term) + '</li>').join('') + '</ul>';
                }
                if (entry.note) html += `<p class="note">${icons.bulb}<span>${esc(entry.note)}</span></p>`;

                const parts = [];
                if ((entry.countable || []).length || (entry.uncountable || []).length) parts.push(['forms', 'Countable / uncountable', formsHtml(entry)]);
                if ((entry.more_examples || []).length) {
                    parts.push(['more', 'More examples', '<p class="part-title" data-no-speech>More examples</p><ul class="examples">'
                        + entry.more_examples.map(s => `<li>${highlightTerm(s, term)}</li>`).join('') + '</ul>']);
                }
                const related = relatedHtml(entry);
                if (related) parts.push(['related', 'Synonyms & antonyms', related]);
                if (parts.length) {
                    html += '<div class="more-bar" data-no-speech>'
                        + parts.map(([id, name]) => `<button class="more-btn" type="button" data-part="${id}" aria-expanded="false">${name}</button>`).join('')
                        + '<button class="more-btn more-hide" type="button">Hide</button></div>';
                    html += parts.map(([id, , body]) => `<div class="more-part" data-part="${id}" hidden>${body}</div>`).join('');
                }
                return html + '</article>';
            }

            // Matching pairs: all the words, shuffled into rounds of about six;
            // the meanings are shuffled separately.
            function renderMatch(game) {
                const pool = shuffled(matchable);
                const roundCount = Math.ceil(pool.length / 6);
                const rounds = [];
                for (let r = 0, cursor = 0; r < roundCount; r++) {
                    const size = Math.floor(pool.length / roundCount) + (r < pool.length % roundCount ? 1 : 0);
                    rounds.push(pool.slice(cursor, cursor + size));
                    cursor += size;
                }
                let round = 0, misses = 0, picked = null;
                const missText = () => misses === 1 ? '1 mistake' : `${misses} mistakes`;

                function draw() {
                    const ids = rounds[round];
                    let html = `<div class="game-head" data-no-speech><span>Round ${round + 1} of ${rounds.length}</span><span class="game-score">${missText()}</span></div>`;
                    html += '<p class="game-hint" data-no-speech>Tap a word, then its meaning.</p>';
                    html += '<div class="match-board" data-no-speech><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile term" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].term)}</button>`).join('');
                    html += '</div><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile meaning" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].definition)}</button>`).join('');
                    html += '</div></div><div class="game-foot" data-no-speech></div>';
                    game.innerHTML = html;
                    picked = null;
                }

                function roundDone() {
                    const foot = game.querySelector('.game-foot');
                    if (round + 1 < rounds.length) {
                        foot.innerHTML = `<p>Round complete!</p><button class="game-btn" type="button" data-action="next-round">Next round</button>`;
                    } else {
                        foot.innerHTML = `<div class="summary"><p class="big">All ${pool.length} words matched</p><p>${missText()}</p>`
                            + '<button class="game-btn" type="button" data-action="restart">Play again</button></div>';
                    }
                    foot.querySelector('button').focus({ preventScroll: true });
                }

                game.addEventListener('click', event => {
                    const tile = event.target.closest('.tile');
                    if (tile && !tile.disabled) {
                        const side = tile.classList.contains('term') ? 'term' : 'meaning';
                        if (picked === tile) {
                            tile.setAttribute('aria-pressed', 'false');
                            picked = null;
                        } else if (!picked || picked.classList.contains(side)) {
                            if (picked) picked.setAttribute('aria-pressed', 'false');
                            picked = tile;
                            tile.setAttribute('aria-pressed', 'true');
                        } else {
                            const other = picked;
                            picked = null;
                            other.setAttribute('aria-pressed', 'false');
                            if (other.dataset.id === tile.dataset.id) {
                                [other, tile].forEach(t => { t.classList.add('done'); t.disabled = true; });
                                speak(vocabulary[Number(tile.dataset.id)].term);
                                if (!game.querySelector('.tile:not(.done)')) roundDone();
                            } else {
                                misses++;
                                game.querySelector('.game-score').textContent = missText();
                                [other, tile].forEach(t => {
                                    t.classList.remove('wrong');
                                    void t.offsetWidth; // restart the shake
                                    t.classList.add('wrong');
                                    setTimeout(() => t.classList.remove('wrong'), 450);
                                });
                            }
                        }
                        return;
                    }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next-round') { round++; draw(); }
                    if (action.dataset.action === 'restart') renderMatch(freshGame());
                });
                draw();
            }

            // Fill the gap: a new sentence, the word hidden, four options.
            function renderGap(game) {
                const order = shuffled(gapItems);
                let position = 0, score = 0;
                const missed = [];

                function draw() {
                    const { entry } = order[position];
                    const [before, after] = entry.gap.sentence.split(/_{3,}/);
                    let html = `<div class="game-head" data-no-speech><span>${position + 1} of ${order.length}</span><span class="game-score">${score} correct</span></div>`;
                    html += `<div class="card"><p class="gap-sentence">${esc(before)}<span class="blank" data-no-speech>&nbsp;</span>${esc(after || '')}</p>`;
                    html += '<div class="options" data-no-speech>'
                        + shuffled(entry.gap.options).map(o => `<button class="option" type="button" data-option="${esc(o)}">${esc(o)}</button>`).join('')
                        + '</div><div class="gap-result" hidden></div></div>';
                    game.innerHTML = html;
                }

                function answer(button) {
                    const { entry, index } = order[position];
                    const right = button.dataset.option === entry.gap.answer;
                    game.querySelectorAll('.option').forEach(b => {
                        b.disabled = true;
                        if (b.dataset.option === entry.gap.answer) b.classList.add('right');
                    });
                    if (right) score++;
                    else { button.classList.add('wrong'); missed.push(index); }
                    game.querySelector('.game-score').textContent = `${score} correct`;
                    const blank = game.querySelector('.blank');
                    blank.textContent = entry.gap.answer;
                    blank.classList.add('filled');
                    blank.removeAttribute('data-no-speech');
                    const full = entry.gap.sentence.replace(/_{3,}/, entry.gap.answer);
                    const last = position + 1 >= order.length;
                    const result = game.querySelector('.gap-result');
                    result.innerHTML = `<p class="verdict ${right ? 'ok' : 'no'}" data-no-speech>${right ? '✓ Correct' : `✗ The answer is “${esc(entry.gap.answer)}”`}</p>`
                        + `<p class="gap-def"><b>${esc(entry.term)}</b>: ${esc(entry.definition)}</p>`
                        + `<div class="gap-actions" data-no-speech>${playButton(full, 'Listen to the sentence')}`
                        + `<button class="game-btn secondary" type="button" data-word="${index}">See the word</button>`
                        + `<button class="game-btn" type="button" data-action="${last ? 'finish' : 'next'}">${last ? 'Finish' : 'Next'}</button></div>`;
                    result.hidden = false;
                    result.querySelector('[data-action]').focus({ preventScroll: true });
                }

                function finish() {
                    let html = `<div class="card summary"><p class="big">${score} of ${order.length}</p><p>${score === order.length ? 'Perfect!' : 'Words to review:'}</p>`;
                    if (missed.length) {
                        html += '<div class="missed" data-no-speech>' + missed.map(i => `<button class="chip" type="button" data-word="${i}">${esc(vocabulary[i].term)}</button>`).join('') + '</div>';
                    }
                    html += '<button class="game-btn" type="button" data-action="restart">Try again</button></div>';
                    game.innerHTML = html;
                }

                game.addEventListener('click', event => {
                    const option = event.target.closest('.option');
                    if (option && !option.disabled) { answer(option); return; }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next') { position++; draw(); }
                    if (action.dataset.action === 'finish') finish();
                    if (action.dataset.action === 'restart') renderGap(freshGame());
                });
                draw();
            }

            let freshGame = () => null;

            function renderVocabulary() {
                const panel = document.getElementById('panel-vocabulary');
                if (!vocabulary.length) {
                    panel.innerHTML = '<p class="empty">No new vocabulary in this lesson.</p>';
                    return;
                }
                const views = [['words', 'Words']];
                if (matchable.length >= 3) views.push(['match', 'Match']);
                if (gapItems.length) views.push(['gap', 'Fill the gap']);
                let html = '';
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Study or practise" data-no-speech>'
                        + views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('')
                        + '</div>';
                }
                html += '<div id="vocab-view"></div>';
                html += `<button class="back-to-quiz" type="button" hidden data-no-speech>${icons.backArrow}Back to the quiz</button>`;
                panel.innerHTML = html;
                const host = document.getElementById('vocab-view');
                const backButton = panel.querySelector('.back-to-quiz');
                // "See the word" leaves the quiz as it is (same question, same
                // score); the button brings it back where the reader left it.
                let current = 'words';
                let paused = null;
                const leaveQuiz = () => {
                    paused = null;
                    backButton.hidden = true;
                };
                // Each game gets a new element, so its listeners go away with it.
                freshGame = () => {
                    host.innerHTML = '<div class="game"></div>';
                    return host.firstChild;
                };

                const show = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'words';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    if (view === 'gap' && paused) {
                        const { game, scroll } = paused;
                        leaveQuiz();
                        host.replaceChildren(game);
                        window.scrollTo({ top: scroll });
                        const next = game.querySelector('[data-action]');
                        if (next) next.focus({ preventScroll: true });
                    } else if (view === 'match') { leaveQuiz(); renderMatch(freshGame()); }
                    else if (view === 'gap') renderGap(freshGame());
                    else host.innerHTML = vocabulary.map(wordCardHtml).join('');
                    current = view;
                    if (remember) storage('lesson-vocab-view', view);
                };
                backButton.addEventListener('click', () => show('gap', false));
                // The timeline opens the word list the way "See the word" does:
                // a quiz in progress waits behind "Back to the quiz".
                vocabularyToWords = () => {
                    if (current === 'words') return;
                    const game = current === 'gap' ? host.querySelector('.game') : null;
                    const scroll = window.scrollY;
                    show('words', false);
                    if (game) {
                        paused = { game, scroll };
                        backButton.hidden = false;
                    }
                };
                // "Go back" to a quiz resumes it where it was (a paused one).
                vocabularyView = () => current;
                setVocabularyView = view => {
                    if (view === current) return;
                    if (view === 'words') vocabularyToWords();
                    else show(view, false);
                };

                panel.addEventListener('click', event => {
                    const view = event.target.closest('.view');
                    if (view) { show(view.dataset.view, true); return; }
                    // Any of the buttons opens all the parts in place (always in
                    // the same order; the page does not move, its own part lights
                    // up briefly); "Hide" closes them again.
                    const more = event.target.closest('.more-btn');
                    if (more) {
                        const word = more.closest('.word');
                        const open = !more.classList.contains('more-hide');
                        word.querySelector('.more-bar').classList.toggle('open', open);
                        word.querySelectorAll('.more-btn:not(.more-hide)').forEach(button => button.setAttribute('aria-expanded', String(open)));
                        word.querySelectorAll('.more-part').forEach(part => { part.hidden = !open; });
                        if (open) flashItem(word.querySelector(`.more-part[data-part="${more.dataset.part}"]`));
                        return;
                    }
                    const jump = event.target.closest('[data-word]');
                    if (jump) {
                        const game = current === 'gap' ? host.querySelector('.game') : null;
                        const scroll = window.scrollY;
                        show('words', false);
                        if (game) {
                            paused = { game, scroll };
                            backButton.hidden = false;
                        }
                        const card = document.getElementById('word-' + jump.dataset.word);
                        if (card) {
                            glideToCenter(card);
                            card.classList.add('flash');
                            setTimeout(() => card.classList.remove('flash'), 1500);
                        }
                    }
                });
                show(storage('lesson-vocab-view') || 'words', false);
            }

            // ------------------------------------------------------- dialogues
            const inTime = (x, y) => (x.dialogue.time ?? x.number) - (y.dialogue.time ?? y.number);
            const dialogueItems = dialogues.map((dialogue, number) => ({ dialogue, number })).sort(inTime);

            // A highlighted phrase opens its word card when the vocabulary has
