<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>English lesson</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f2f7;
            --text: #1b1f2a;
            --muted: #5d6477;
            --faint: #8a91a3;
            --border: #e2e5ee;
            --accent: #3b5bdb;
            --accent-soft: #e8edff;
            --major: #d0342c;
            --major-soft: #fdeceb;
            --moderate: #c77c02;
            --moderate-soft: #fdf3e1;
            --minor: #2b77c8;
            --minor-soft: #e7f1fb;
            --del-bg: #fde4e2;
            --del-text: #b42318;
            --ins-bg: #dcf5e7;
            --ins-text: #05683f;
            --mark-bg: #fff1b8;
            --a-bubble: #eef1f8;
            --b-bubble: #e7f3ec;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --on-accent: #ffffff;
            --sel-bg: #b9ccff;
            --sel-text: #0d2146;
            --accent-hover: rgba(59, 91, 219, 0.12);
            --radius: 14px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1116;
                --surface: #171a21;
                --surface-2: #1f232c;
                --text: #e8eaf0;
                --muted: #a3aabb;
                --faint: #7d8497;
                --border: #2a2f3b;
                --accent: #8ea2ff;
                --accent-soft: #232a45;
                --major: #ff7a70;
                --major-soft: #3a1e1d;
                --moderate: #f2b544;
                --moderate-soft: #372a14;
                --minor: #72b0f3;
                --minor-soft: #172a3d;
                --del-bg: #4a2320;
                --del-text: #ffb4ab;
                --ins-bg: #173a2a;
                --ins-text: #8fe3b5;
                --mark-bg: #4d4214;
                --a-bubble: #212633;
                --b-bubble: #1b2d25;
                --shadow: none;
                --on-accent: #0f1116;
                --sel-bg: #34437a;
                --sel-text: #ffffff;
                --accent-hover: rgba(142, 162, 255, 0.16);
            }
        }

        /* Themes the reader can pick (Auto follows the phone's light/dark setting). */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --text: #1b1f2a; --muted: #5d6477; --faint: #8a91a3;
            --border: #e2e5ee; --accent: #3b5bdb; --accent-soft: #e8edff; --major: #d0342c; --major-soft: #fdeceb;
            --moderate: #c77c02; --moderate-soft: #fdf3e1; --minor: #2b77c8; --minor-soft: #e7f1fb;
            --del-bg: #fde4e2; --del-text: #b42318; --ins-bg: #dcf5e7; --ins-text: #05683f; --mark-bg: #fff1b8;
            --a-bubble: #eef1f8; --b-bubble: #e7f3ec; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(20, 28, 51, 0.05), 0 6px 18px rgba(20, 28, 51, 0.05);
            --sel-bg: #b9ccff; --sel-text: #0d2146; --accent-hover: rgba(59, 91, 219, 0.12);
        }

        :root[data-theme="sepia"] {
            color-scheme: light;
            --bg: #f3ead6; --surface: #fbf6ea; --surface-2: #efe4cb; --text: #3a2e1d; --muted: #6c5b43; --faint: #998669;
            --border: #e3d5b5; --accent: #9a5b13; --accent-soft: #f2e0bf; --major: #b3261e; --major-soft: #f6dcd3;
            --moderate: #99620a; --moderate-soft: #f3e2c0; --minor: #2f6690; --minor-soft: #dfe8ec;
            --del-bg: #f5d6cc; --del-text: #9f2a1c; --ins-bg: #dde9cd; --ins-text: #2e6a2a; --mark-bg: #f5e09c;
            --a-bubble: #efe5cf; --b-bubble: #e4ead3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(58, 46, 29, 0.06), 0 6px 18px rgba(58, 46, 29, 0.06);
            --sel-bg: #ebd197; --sel-text: #3a2e1d; --accent-hover: rgba(154, 91, 19, 0.12);
        }

        :root[data-theme="mint"] {
            color-scheme: light;
            --bg: #e9f5ef; --surface: #ffffff; --surface-2: #e1f0e8; --text: #15302a; --muted: #4c6a61; --faint: #7d978e;
            --border: #d0e5db; --accent: #0f7a5c; --accent-soft: #d5efe4; --major: #c43d32; --major-soft: #fbe5e2;
            --moderate: #a86500; --moderate-soft: #fbedd6; --minor: #1f6fb2; --minor-soft: #e0ecf8;
            --del-bg: #fbe0dc; --del-text: #b0281c; --ins-bg: #cfeedd; --ins-text: #0b6446; --mark-bg: #fbeea8;
            --a-bubble: #e6f1ec; --b-bubble: #d8eee3; --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(21, 48, 42, 0.05), 0 6px 18px rgba(21, 48, 42, 0.05);
            --sel-bg: #b3e4cf; --sel-text: #0b2a22; --accent-hover: rgba(15, 122, 92, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1116; --surface: #171a21; --surface-2: #1f232c; --text: #e8eaf0; --muted: #a3aabb; --faint: #7d8497;
            --border: #2a2f3b; --accent: #8ea2ff; --accent-soft: #232a45; --major: #ff7a70; --major-soft: #3a1e1d;
            --moderate: #f2b544; --moderate-soft: #372a14; --minor: #72b0f3; --minor-soft: #172a3d;
            --del-bg: #4a2320; --del-text: #ffb4ab; --ins-bg: #173a2a; --ins-text: #8fe3b5; --mark-bg: #4d4214;
            --a-bubble: #212633; --b-bubble: #1b2d25; --on-accent: #0f1116; --shadow: none;
            --sel-bg: #34437a; --sel-text: #ffffff; --accent-hover: rgba(142, 162, 255, 0.16);
        }

        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0c0c0e; --surface-2: #17171b; --text: #ececf1; --muted: #a5a5b0; --faint: #74747f;
            --border: #24242a; --accent: #8fb3ff; --accent-soft: #15203a; --major: #ff7a70; --major-soft: #2e1413;
            --moderate: #f2b544; --moderate-soft: #2b2110; --minor: #72b0f3; --minor-soft: #0f2032;
            --del-bg: #3a1a18; --del-text: #ffb4ab; --ins-bg: #10301f; --ins-text: #8fe3b5; --mark-bg: #45390f;
            --a-bubble: #16161b; --b-bubble: #102219; --on-accent: #000000; --shadow: none;
            --sel-bg: #2c3f73; --sel-text: #ffffff; --accent-hover: rgba(143, 179, 255, 0.16);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.55;
        }

        ::selection { background: var(--sel-bg); color: var(--sel-text); }

        [data-no-speech] { user-select: none; -webkit-user-select: none; }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* ---------------------------------------------------------- header */
        .hero { padding: 28px 0 14px; }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 5.5vw, 2.3rem);
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }



        .hint {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hint svg { flex: none; width: 18px; height: 18px; color: var(--accent); }

        /* ------------------------------------------------------------ tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 14px -16px 0;
            padding: 10px 16px;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 6px 8px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.95rem;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover { background: var(--surface-2); }

        .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        .tab .count {
            min-width: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 20px;
        }

        .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

        .panel { padding-top: 18px; }

        .panel[hidden] { display: none; }

        .panel-intro { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }

        .empty {
            padding: 28px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }

        /* ---------------------------------------------------------- shared */
        .card {
            margin: 0 0 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }

        .chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

        .dot.high { color: var(--major); }
        .dot.medium { color: var(--moderate); }
        .dot.low { color: var(--minor); }

        .play {
            display: none;
            flex: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
        }

        .voice-ready .play { display: inline-grid; place-items: center; }

        .play:hover { background: var(--surface-2); color: var(--accent); }

        .play svg { width: 18px; height: 18px; }

        /* -------------------------------------------------------- mistakes */
        .mistake { border-left: 4px solid var(--sev); }

        .mistake.high { --sev: var(--major); --sev-soft: var(--major-soft); }
        .mistake.medium { --sev: var(--moderate); --sev-soft: var(--moderate-soft); }
        .mistake.low { --sev: var(--minor); --sev-soft: var(--minor-soft); }

        .m-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }

        .sev {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--sev-soft);
            color: var(--sev);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .tag {
            padding: 1px 9px;
            border-radius: 6px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .times { margin-left: auto; color: var(--muted); font-size: 0.82rem; font-weight: 700; }

        .rule { margin: 0 0 10px; font-weight: 600; }

        .pair { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }

        .pair:last-child { margin-bottom: 0; }

        .said, .fixed { display: flex; gap: 8px; align-items: baseline; }

        .said { color: var(--muted); }

        .said + .fixed { margin-top: 4px; }

        .mark-icon { flex: none; width: 16px; font-weight: 800; text-align: center; }

        .said .mark-icon { color: var(--del-text); }
        .fixed .mark-icon { color: var(--ins-text); }

        .said .txt, .fixed .txt { flex: 1; }

        .fixed .play { align-self: center; margin: -6px -4px -6px 0; }

        del.w { padding: 0 2px; border-radius: 4px; background: var(--del-bg); color: var(--del-text); text-decoration: line-through; text-decoration-thickness: 1.5px; }

        ins.w { padding: 0 2px; border-radius: 4px; background: var(--ins-bg); color: var(--ins-text); font-weight: 650; text-decoration: none; }

        .gap { display: inline-block; width: 3px; height: 1.05em; margin: 0 -1px; border-radius: 2px; background: var(--del-text); vertical-align: -0.18em; }

        .more-toggle {
            margin: 4px 0 0;
            padding: 4px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 650;
            cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: -4px 0 16px; color: var(--muted); font-size: 0.84rem; }

        .legend > span { display: inline-flex; gap: 6px; align-items: center; }

        /* ------------------------------------------------------ vocabulary */
        .word { padding: 14px 16px; scroll-margin-top: 76px; }

        .word.flash { animation: flash 1.4s ease-out; }

        @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }

        .w-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

        .w-head .clock { background: var(--surface-2); font-size: 0.78rem; }

        .w-term { margin: 0; font-size: 1.15rem; line-height: 1.25; }

        .w-pos { color: var(--muted); font-size: 0.82rem; font-style: italic; }

        .w-head .play { margin-left: auto; }

        .def { margin: 4px 0 10px; }

        .lesson-ex {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--accent-soft);
            font-size: 0.95rem;
        }

        .lesson-ex .txt { flex: 1; }

        .src {
            display: block;
            margin: 0 0 2px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples { margin: 0; padding: 0; list-style: none; font-size: 0.95rem; }

        .examples li { position: relative; margin: 0 0 4px; padding-left: 16px; }

        .examples li::before { content: ""; position: absolute; top: 0.68em; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

        .pat {
            display: inline-block;
            margin-right: 2px;
            padding: 0 6px;
            border-radius: 5px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.5;
            vertical-align: 0.08em;
        }

        b.hl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .note { display: flex; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

        .note svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--moderate); }

        .more-bar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

        .more-btn {
            min-height: 28px;
            padding: 1px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.74rem;
            font-weight: 650;
            cursor: pointer;
        }

        .more-btn::after { content: " \25BE"; }

        .more-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .more-btn[aria-expanded="true"]::after { content: " \25B4"; }

        .more-part { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--border); font-size: 0.93rem; }

        .part-title { margin: 0 0 6px; color: var(--muted); font-size: 0.74rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }

        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }

        .form-col .part-title span { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }

        .meanings { margin: 0; padding-left: 18px; }

        .meanings li { margin: 0 0 6px; }

        .meaning { display: block; font-weight: 600; }

        .m-ex { display: block; color: var(--muted); }

        .from-lesson { padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        .rel { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px; }

        .rel:last-child { margin-bottom: 0; }

        .rel .part-title { flex: none; width: 74px; margin: 0; }

        .rel-words { flex: 1; }

        .rel-word { white-space: nowrap; }

        /* -------------------------------------------------- vocabulary games */
        .game-head { display: flex; gap: 8px; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }

        .game-hint { margin: 0 0 10px; color: var(--muted); font-size: 0.86rem; }

        .match-board { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; }

        .match-col { display: flex; flex-direction: column; gap: 8px; }

        .tile, .option {
            min-height: 46px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
        }

        .tile.term { font-weight: 700; }

        .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

        .tile.done { border-color: transparent; background: var(--ins-bg); box-shadow: none; color: var(--ins-text); opacity: 0.6; cursor: default; }

        .tile.wrong { border-color: var(--major); animation: shake 0.35s; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .game-foot { margin: 14px 0 0; text-align: center; }

        .game-foot p { margin: 0 0 10px; }

        .game-btn {
            min-height: 40px;
            padding: 6px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        .game-btn.secondary { background: var(--surface-2); color: var(--text); }

        .gap-sentence { margin: 2px 0 14px; font-size: 1.05rem; line-height: 1.7; }

        .blank { display: inline-block; min-width: 4.5em; padding: 0 4px; border-bottom: 2px solid var(--accent); text-align: center; }

        .blank.filled { border-color: var(--ins-text); color: var(--ins-text); font-weight: 700; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .option { text-align: center; font-weight: 650; }

        .option.right { border-color: var(--ins-text); background: var(--ins-bg); color: var(--ins-text); }

        .option.wrong { border-color: var(--del-text); background: var(--del-bg); color: var(--del-text); }

        .option:disabled { cursor: default; }

        .gap-result { margin: 12px 0 0; }

        .verdict { margin: 0 0 4px; font-weight: 750; }

        .verdict.ok { color: var(--ins-text); }

        .verdict.no { color: var(--del-text); }

        .gap-def { margin: 0; color: var(--muted); font-size: 0.93rem; }

        .gap-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 12px 0 0; }

        .gap-actions .play { margin-right: auto; }

        .summary { text-align: center; }

        .summary .big { margin: 4px 0 6px; font-size: 1.4rem; font-weight: 750; }

        .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 14px; }

        /* ------------------------------------------------------- dialogues */
        .dialogue h3 { margin: 0 0 12px; font-size: 1.1rem; }

        .line { display: flex; flex-direction: column; margin: 0 0 10px; }

        .line.B { align-items: flex-end; }

        .who { margin: 0 4px 2px; color: var(--faint); font-size: 0.72rem; font-weight: 750; letter-spacing: 0.05em; }

        .bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; background: var(--a-bubble); }

        .line.A .bubble { border-top-left-radius: 5px; }

        .line.B .bubble { border-top-right-radius: 5px; background: var(--b-bubble); }

        mark.expr { padding: 0 2px; border-radius: 4px; background: var(--mark-bg); color: inherit; font-weight: 650; }

        .orig-toggle {
            display: block;
            margin: 4px 0 0;
            padding: 0;
            border: 0;
            background: none;
            color: var(--faint);
            font: inherit;
            font-size: 0.78rem;

ap":{"sentence":"I can't hear the music very well, so could you please _____ the speakers?","answer":"turn on","options":["turn on","turn off","turn over","turn into"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/098598-098938.webm","at":986.1,"dur":3.4}},{"term":"take long","pos":"expression","definition":"To require a large amount of time to complete a process or action.","time":1224.2,"lesson":"I hear you, but I don't know. Did it take long to connect?","examples":[{"sentence":"It doesn't take long to learn the basics of this software.","pattern":"It doesn't take long + to + verb"},{"sentence":"How long does it take to get to the airport from here?","pattern":"How long does it take + to + verb"},{"sentence":"I'm sorry, it took a long time to get a response from the company.","pattern":"take a long time"},{"sentence":"Will it take long for the doctor to see us?","pattern":"Will it take long for [someone] to [do something]"}],"more_examples":["I don't want to take long, I just have one quick question.","It won't take long to fix the leak in the sink.","Do you think it will take long for the package to arrive?"],"synonyms":["take a while","be time-consuming","take forever"],"antonyms":["be instantaneous","take no time"],"gap":{"sentence":"I'm afraid the renovation won't _____ because the workers have already finished most of the heavy lifting.","answer":"take long","options":["take long","take effort","take courage","take interest"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/122772-123093.webm","at":1227.8,"dur":3.21}},{"term":"take someone's temperature","pos":"expression","definition":"To measure how hot or cold someone's body is using a thermometer.","time":1370.2,"lesson":"I had a temperature. I thought about it, but didn't you take your temperature?","examples":[{"sentence":"The nurse will take your temperature before the examination.","pattern":""},{"sentence":"Can you take my temperature? I feel like I'm coming down with a fever.","pattern":""},{"sentence":"The mother took her child's temperature every few hours during the night.","pattern":""},{"sentence":"I need to take my temperature to see if my fever is getting worse.","pattern":""}],"more_examples":["The doctor asked to take my temperature as soon as I walked in.","Could you please take the baby's temperature and let me know the reading?","It's important to take your temperature regularly if you have a persistent cough."],"synonyms":["check someone's temperature","measure someone's temperature"],"antonyms":[],"gap":{"sentence":"Since the toddler is shivering and looks very cold, the mother decided to _____ immediately.","answer":"take his temperature","options":["take his temperature","take his height","take his weight","take his blood pressure"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/136852-137405.webm","at":1368.6,"dur":5.53}},{"term":"function properly","pos":"verb phrase","definition":"To be able to do your normal daily activities or work effectively without feeling ill.","time":1458.0,"lesson":"It is a standard expression used when you feel slightly unwell. You might feel like you can't function properly because something feels slightly off.","examples":[{"sentence":"I'm feeling a bit under the weather today and can't function properly.","pattern":"can't function properly"},{"sentence":"The machine isn't functioning properly because it hasn't been serviced lately.","pattern":"functioning properly"},{"sentence":"I need to get some rest so that my body can function properly again.","pattern":""},{"sentence":"Are you sure the software is functioning properly after the update?","pattern":""}],"more_examples":["I've had such a long night of no sleep that I don't think I can function properly at work today.","When I have a migraine, it's almost impossible to function properly.","She's struggling to function properly after the surgery, so she's taking it easy."],"synonyms":["operate normally","work effectively","perform normally"],"antonyms":["malfunction","be incapacitated","be unable to cope"],"gap":{"sentence":"I had such a terrible headache all night that I couldn't _____ at my desk this morning.","answer":"function properly","options":["function properly","sleep soundly","dance gracefully","drive safely"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/145808-146250.webm","at":1458.2,"dur":4.42}},{"term":"hypothetical situation","pos":"noun phrase","definition":"A situation that is imagined, possible, or not real at the moment.","time":1715.3,"lesson":"We are talking about the first, second, and third conditionals. We are talking about hypothetical situations and the gradation of how likely they are to happen.","examples":[{"sentence":"In a hypothetical situation where you won the lottery, what would you do first?","pattern":"In a hypothetical situation where"},{"sentence":"The philosopher presented a hypothetical situation to test the students' logic.","pattern":"presented a hypothetical situation"},{"sentence":"We need to prepare for a hypothetical situation, such as a sudden power outage.","pattern":"prepare for a hypothetical situation"},{"sentence":"If we consider a hypothetical situation, the consequences could be quite serious.","pattern":"consider a hypothetical situation"}],"countable":[{"meaning":"A situation that is imagined, possible, or not real at the moment.","example":"We are talking about hypothetical situations and the gradation of how likely they are to happen.","lesson":true},{"meaning":"A scenario used for training or practice","example":"The fire department trained on a hypothetical situation involving a high-rise building."}],"uncountable":[],"more_examples":["Let's explore a hypothetical situation where the company loses its biggest client.","The debate focused on a hypothetical situation involving extraterrestrial life.","I don't want to get into a hypothetical situation about what might happen next year."],"synonyms":["supposed scenario","theoretical situation","imaginary scenario","hypothetical case","what-if scenario"],"antonyms":["real-life situation","actual occurrence","factual event"],"gap":{"sentence":"The teacher asked us to imagine a _____ to see how we would react to an emergency.","answer":"hypothetical situation","options":["hypothetical situation","actual situation","personal opinion","permanent record"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/171556-171973.webm","at":1715.7,"dur":4.17}},{"term":"gradation","pos":"noun","definition":"A scale or sequence showing a change from one state or level to another.","time":1721.9,"lesson":"When we talk about the first, second, and third conditionals, we are discussing hypothetical situations. There is a gradation where we start from situations that are very likely and move toward situations that are very unlikely.","examples":[{"sentence":"The painting shows a beautiful gradation from deep blue to pale white.","pattern":"gradation from [A] to [B]"},{"sentence":"The teacher explained the gradation of difficulty in the exam questions.","pattern":"gradation of [noun]"},{"sentence":"The colors on the sunset showed a smooth gradation.","pattern":"show a gradation"}],"countable":[{"meaning":"A scale or sequence showing a change from one state or level to another.","example":"There is a gradation where we start from situations that are very likely and move toward situations that are very unlikely.","lesson":true},{"meaning":"The process of becoming more or less intense","example":"The gradual gradation of the music's volume created a peaceful atmosphere."},{"meaning":"A step-by-step progression or series of stages","example":"The training program is designed in a logical gradation of intensity."}],"uncountable":[{"meaning":"The quality of being arranged in degrees","example":"The gradation of colors in the fabric was very subtle."}],"more_examples":["The designer chose a subtle gradation of grey for the office walls.","The workout plan follows a clear gradation of physical intensity.","You can see a beautiful gradation of light and shadow in the photograph."],"synonyms":["gradient","transition","progression","sequence","scale","spectrum"],"antonyms":[],"gap":{"sentence":"The designer chose a subtle _____ of grey to ensure the background didn't look too harsh or flat.","answer":"gradation","options":["gradation","material","shape","volume"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/172430-172510.webm","at":1724.5,"dur":0.8}},{"term":"schematically","pos":"adverb","definition":"In a simplified way, focusing on the basic structure or outline rather than small details.","time":1870.6,"lesson":"Please open the document. Let's imagine it schematically in our heads when we are discussing conditionals. I want you to first understand the idea intuitively.","examples":[{"sentence":"The architect explained the building's layout schematically before showing the detailed blueprints.","pattern":"explain something schematically"},{"sentence":"We can represent the workflow schematically using a simple flowchart.","pattern":"represent something schematically"},{"sentence":"The presentation was organized schematically, making it very easy to follow.","pattern":"organized schematically"},{"sentence":"Think about the process schematically first, then we will fill in the specifics.","pattern":"Think about [something] schematically"}],"more_examples":["The project manager asked the team to map out the timeline schematically during the kickoff meeting.","Instead of writing a long essay, she sketched out her main arguments schematically on the whiteboard.","You don't need to worry about the colors yet; just plan the room layout schematically."],"synonyms":["simply","outline-wise","conceptually","broadly","abstractly","in outline"],"antonyms":["specifically","exhaustively","minutely","precisely"],"gap":{"sentence":"Since we only have five minutes, could you explain the project plan _____ instead of going into every minor detail?","answer":"schematically","options":["schematically","meticulously","exhaustively","complexly"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/187112-187446.webm","at":1871.2,"dur":3.34}},{"term":"intuitively","pos":"adverb","definition":"To understand or feel something naturally without needing a detailed logical explanation.","time":1886.6,"lesson":"When we are discussing conditionals, I want you to first understand the idea and feel it intuitively. We need to understand three fundamental things that govern conditionals.","examples":[{"sentence":"She just knew what to do intuitively, without having any specific training.","pattern":"know + something + intuitively"},{"sentence":"The new software is designed to be used intuitively by the customers.","pattern":"be used intuitively"},{"sentence":"He has an intuitive sense of how the market will change.","pattern":"have an intuitive sense"},{"sentence":"You don't need to memorize the rules; you should try to feel the grammar intuitively.","pattern":"feel + [something] + intuitively"}],"more_examples":["Even though she hadn't studied the map, she navigated the city intuitively.","He could intuitively tell that something was wrong as soon as he entered the room.","The app's interface is so well-designed that users can navigate it intuitively."],"synonyms":["instinctively","by instinct","naturally"],"antonyms":["logically","rationally","analytically","consciously"],"gap":{"sentence":"Even though she hadn't read the manual, she managed to navigate the complex app _____.","answer":"intuitively","options":["intuitively","loudly","formally","strictly"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/190490-190729.webm","at":1905.0,"dur":2.39}},{"term":"govern","pos":"verb","definition":"To control, regulate, or determine the rules and structure of something.","time":1911.7,"lesson":"When we talk about conditionals, we need to understand three fundamental things that govern conditionals. The first rule is that conditionals move from likely things to unlikely things.","examples":[{"sentence":"The laws of physics govern how the universe behaves.","pattern":"govern + noun (abstract concept)"},{"sentence":"The company is governed by a board of directors.","pattern":"be governed by (passive voice)"},{"sentence":"The same rules govern both the local and national elections.","pattern":"the same [noun] govern"},{"sentence":"The price of goods is governed by supply and demand.","pattern":"be governed by (cause and effect)"}],"more_examples":["The same set of rules governs the behavior of all students in the school.","The way a country is governed often depends on its historical traditions.","The internal logic of the software governs how data is processed."],"synonyms":["regulate","control","direct","manage","rule","administer","supervise","dictate","oversee"],"antonyms":[],"gap":{"sentence":"The specific rules _____ the competition ensure that every athlete has a fair chance to win.","answer":"governing","options":["governing","competing","winning","watching"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/191056-191944.webm","at":1910.7,"dur":8.88}},{"term":"communicate intention","pos":"expression","definition":"To express or show a plan or a desire to do something.","time":2312.2,"lesson":"Will is the same modal verb as can or must; it simply communicates intention. When you say 'I will go,' it means you have the intention to go.","examples":[{"sentence":"I need to communicate my intention to leave the company clearly to my manager.","pattern":"communicate intention to [verb]"},{"sentence":"The company's official statement was meant to communicate its intention to expand into new markets.","pattern":"communicate its intention"},{"sentence":"He didn't communicate his intention to move house, so I was surprised by the news.","pattern":"communicate [someone's] intention"},{"sentence":"By saying 'I will help you,' you are communicating your intention to provide support.","pattern":"communicating intention"}],"more_examples":["The diplomat's goal was to communicate his intention to negotiate a peace treaty.","Before starting the renovation, the contractor must communicate his intention to the neighbors.","She used a series of gestures to communicate her intention to join the game."],"synonyms":["express an intent","signal an intention","state a plan","convey a purpose","indicate a desire","make one's intentions clear","declare an aim"],"antonyms":["conceal intentions","hide a plan","keep one's plans secret","withhold information"],"gap":{"sentence":"Before the meeting starts, I need to _____ to resign so the team can prepare for the transition.","answer":"communicate my intention","options":["communicate my intention","describe my feelings","explain my problem","share my opinion"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/231192-232043.webm","at":2312.1,"dur":8.51}},{"term":"technically speaking","pos":"expression","definition":"Used to describe something based on strict facts or rules, even if it is not common.","time":2334.2,"lesson":"Furthermore, 'will'—as in 'I will go'—is technically speaking like the present tense because 'will' is in its present form.","examples":[{"sentence":"Technically speaking, a tomato is a fruit, not a vegetable.","pattern":"Technically speaking, [fact]"},{"sentence":"Is this legal? Well, technically speaking, it is, but it's very risky.","pattern":""},{"sentence":"Technically speaking, the project is finished, but we still need to do some minor polishing.","pattern":"Technically speaking, [clause]"}],"more_examples":["Technically speaking, you can't enter the building without a security badge.","I know it feels like a long weekend, but technically speaking, it's only two days.","Technically speaking, the deadline hasn't passed yet, but we are running very late."],"synonyms":["strictly speaking","in theory","by definition","in a literal sense","formally"],"antonyms":["practically speaking","in reality","essentially","effectively"],"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/233360-234001.webm","at":2333.7,"dur":6.41}},{"term":"vague","pos":"adjective","definition":"Not clear, distinct, or specific; lacking detail or precision.","time":2415.2,"lesson":"That is why, for a native speaker, the difference between the future and the present is very vague. Will is often used for sudden decisions or general intentions.","examples":[{"sentence":"I have a vague memory of meeting him at a party years ago.","pattern":"have a vague memory"},{"sentence":"The instructions he gave were so vague that I didn't know what to do.","pattern":"vague + that-clause"},{"sentence":"She gave a vague answer when I asked about her future plans.","pattern":"give a vague answer"},{"sentence":"The shape in the fog was vague and hard to identify.","pattern":"vague + adjective"}],"more_examples":["The company's plans for expansion remain quite vague at this stage.","I'm sorry, I can't give you a specific date; my schedule is still vague.","The painting was intentionally vague, leaving the subject open to interpretation."],"synonyms":["unclear","indistinct","fuzzy","ambiguous","hazy","undefined","imprecise","non-specific"],"antonyms":["clear","specific","precise","distinct","definite","explicit","clear-cut"],"gap":{"sentence":"The directions to the hotel were so _____ that we ended up getting lost in the middle of the city.","answer":"vague","options":["vague","clear","precise","helpful"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/241896-242511.webm","at":2419.2,"dur":6.15}},{"term":"sudden decision","pos":"noun phrase","definition":"An action or choice made instantly without prior planning or preparation.","time":2445.2,"lesson":"Will is kind of a sudden decision. It is easier to use 'will' when making a sudden decision.","examples":[{"sentence":"I didn't plan to go out, but it was a sudden decision made at the last minute.","pattern":"make a sudden decision"},{"sentence":"Buying the car was a sudden decision that I later regretted.","pattern":"sudden decision + that clause"},{"sentence":"Sometimes the best opportunities come from a sudden decision to change your life.","pattern":"from a sudden decision"},{"sentence":"He made a sudden decision to quit his job and travel the world.","pattern":"sudden decision + to + verb"}],"countable":[{"meaning":"An action or choice made instantly without prior planning or preparation.","example":"It is easier to use 'will' when making a sudden decision.","lesson":true}],"uncountable":[],"more_examples":["I saw a beautiful dress in the window and made a sudden decision to buy it.","She made a sudden decision to turn around and head back home.","The team's sudden decision to change tactics surprised the opposing players."],"synonyms":["impulsive choice","spur-of-the-moment decision","snap judgment"],"antonyms":["premeditated plan","deliberate choice","planned action","calculated move"],"gap":{"sentence":"I hadn't planned to go to the party, but it was a _____ made when I saw my friends laughing.","answer":"sudden decision","options":["sudden decision","planned activity","long process","careful study"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/244556-244976.webm","at":2445.8,"dur":4.2}},{"term":"degree of confidence","pos":"noun phrase","definition":"The level of certainty or conviction someone has about a statement or future event.","time":2510.3,"lesson":"When you say 'I'm having a party,' it represents the maximum degree of confidence. You are speaking as if the event is a fixed fact in the present.","examples":[{"sentence":"The researchers expressed a high degree of confidence in the new results.","pattern":"express a [high/low] degree of confidence"},{"sentence":"I have a high degree of confidence that we will finish the project on time.","pattern":"have a degree of confidence that + clause"},{"sentence":"The survey results showed a varying degree of confidence among the participants.","pattern":"varying degree of confidence"}],"countable":[{"meaning":"The level of certainty or conviction someone has about a statement or future event.","example":"When you say 'I'm having a party,' it represents the maximum degree of confidence.","lesson":true}],"uncountable":[],"more_examples":["The investors have a low degree of confidence in the startup's long-term viability.","She spoke with a high degree of confidence during the presentation."],"synonyms":["level of certainty","level of assurance","certainty","conviction","assurance"],"antonyms":["uncertainty","doubt","skepticism"],"gap":{"sentence":"Because the weather forecast is so unpredictable, the team has a low _____ regarding the outdoor event.","answer":"degree of confidence","options":["degree of confidence","amount of effort","speed of progress","quality of service"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/250934-251135.webm","at":2509.4,"dur":2.01}},{"term":"take into account","pos":"expression","definition":"To consider or include a specific fact or piece of information when making a decision.","time":2544.2,"lesson":"People no longer see the difference between 'will' and 'I'm going to.' This fact we take into account.","examples":[{"sentence":"You need to take into account the weather when planning your hike.","pattern":"take into account + noun"},{"sentence":"We must take his experience into account before hiring him.","pattern":"take [something] into account"},{"sentence":"When choosing a car, you should take the fuel costs into account.","pattern":""},{"sentence":"The judge took the defendant's age into account during sentencing.","pattern":"take into account (past tense)"}],"more_examples":["When booking a hotel, you should take into account the distance from the city center.","The company failed to take into account the potential risks of the new investment.","You have to take into account the fact that she is still learning the language."],"synonyms":["consider","bear in mind","keep in mind","allow for","factor in","take into consideration","think about"],"antonyms":["ignore","disregard","overlook","neglect"],"gap":{"sentence":"When planning the budget for the wedding, we need to _____ the rising costs of catering and flowers.","answer":"take into account","options":["take into account","give into","put into","set into"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/254376-254695.webm","at":2544.0,"dur":3.19}},{"term":"evaporate","pos":"verb","definition":"To change from a liquid into a gas or vapor when heated.","time":2621.2,"lesson":"If you boil water, it evaporates.","examples":[{"sentence":"The puddle of water evaporated quickly under the hot sun.","pattern":"subject + evaporated"},{"sentence":"Alcohol evaporates much faster than water.","pattern":"comparative + evaporates"},{"sentence":"The moisture in the air evaporated as the temperature dropped.","pattern":"noun phrase + evaporated"},{"sentence":"If you leave the lid off the pot, the soup will evaporate.","pattern":"will + evaporate"}],"more_examples":["The sweat evaporated from his skin as he stepped into the breeze.","Make sure to keep the container sealed so the chemicals don't evaporate.","The rain on the pavement evaporated within minutes of the storm ending."],"synonyms":["dry up","vaporize","dissipate"],"antonyms":["condense","liquefy"],"gap":{"sentence":"If you leave the puddle of water in the middle of the road, it will eventually _____ because of the intense heat.","answer":"evaporate","options":["evaporate","freeze","solidify","melt"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/262596-262789.webm","at":2626.2,"dur":1.93}},{"term":"mythical","pos":"adjective","definition":"Relating to things that are not real or are extremely unlikely to happen.","time":2702.2,"lesson":"The past tense in the English language is used to express non-existent, very unlikely, and practically mythical scenarios.","examples":[{"sentence":"The unicorn is a mythical creature that appears in many folk tales.","pattern":"mythical + noun"},{"sentence":"He spoke about a mythical city where everyone lives in perfect harmony.","pattern":"mythical city"},{"sentence":"The idea of a perfect, stress-free life is almost mythical.","pattern":"is + mythical"},{"sentence":"Some people believe in mythical stories, while others prefer scientific facts.","pattern":"believe in + mythical stories"}],"more_examples":["The company's claims about their revolutionary technology sounded more mythical than realistic.","He spent his childhood reading books about mythical heroes and dragons.","For many people, the concept of a balanced work-life schedule is almost mythical."],"synonyms":["fictional","imaginary","legendary","illusory","fanciful","unreal"],"antonyms":["real","factual","actual","realistic","tangible","concrete"],"gap":{"sentence":"The company's promise of a 100% success rate for every project is practically _____, given the unpredictable nature of the market.","answer":"mythical","options":["mythical","guaranteed","standard","common"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/270692-271433.webm","at":2707.1,"dur":7.41}},{"term":"unrealistic","pos":"adjective","definition":"Not practical or likely to happen; describing scenarios that are imaginary or mythical.","time":2719.2,"lesson":"The past tense in English is often used to express non-existent or very unlikely scenarios. These are unrealistic things.","examples":[{"sentence":"It is unrealistic to expect the project to be finished by tomorrow.","pattern":"It is unrealistic to + verb"},{"sentence":"The movie's plot was full of unrealistic events that couldn't happen in real life.","pattern":"unrealistic + noun"},{"sentence":"Setting such a high goal without a clear plan is somewhat unrealistic.","pattern":"somewhat unrealistic"},{"sentence":"She had an unrealistic idea of how much the renovation would cost.","pattern":"unrealistic idea"}],"more_examples":["The advertisement showed an unrealistic version of what life would be like.","I don't want to set unrealistic expectations for the new interns.","It's unrealistic to think we can travel across the country in one day."],"synonyms":["impractical","unfeasible","implausible","far-fetched","idealistic","unachievable","unworkable"],"antonyms":["realistic","practical","feasible","achievable","plausible"],"gap":{"sentence":"The company's plan to double its profits in one month is completely _____ given the current market conditions.","answer":"unrealistic","options":["unrealistic","consistent","reliable","probable"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/273150-273365.webm","at":2731.7,"dur":2.15}},{"term":"unreality","pos":"noun","definition":"The state of being imaginary or impossible in the current situation.","time":3091.2,"lesson":"In order to show unreality, or the impossibility of a scenario even in the present, we use the past tense. For example, if I had a million dollars now, I wouldn't teach English.","examples":[{"sentence":"The unreality of the dream made it hard to accept when I woke up.","pattern":"The unreality of + noun"},{"sentence":"He spoke about the unreality of the situation with a serious face.","pattern":"unreality of the situation"},{"sentence":"The movie captures the unreality of living in a digital world.","pattern":"capture the unreality"},{"sentence":"She felt a sense of unreality as she stood on the stage.","pattern":"a sense of unreality"}],"countable":[],"uncountable":[{"meaning":"The state of being imaginary or impossible in the current situation.","example":"In order to show unreality, or the impossibility of a scenario even in the present, we use the past tense.","lesson":true},{"meaning":"The quality of being not real or not actual","example":"The sheer unreality of the landscape left the hikers speechless."}],"more_examples":["The unreality of the news report made everyone question what was true.","He struggled to cope with the unreality of his sudden fame.","The surreal colors of the sunset created a strange sense of unreality."],"synonyms":["fictionality","imaginary nature","surreality","artificiality","illusion","fantasy"],"antonyms":["reality","actuality","fact","tangibility"],"gap":{"sentence":"The _____ of the news was so shocking that I had to check the source twice to believe it.","answer":"unreality","options":["unreality","importance","speed","clarity"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/309230-309627.webm","at":3092.5,"dur":3.97}},{"term":"spend a ton of money","pos":"expression","definition":"To spend a very large amount of money on something.","time":3221.2,"lesson":"If I were a woman, I would have to spend a ton of money on cosmetics.","examples":[{"sentence":"They spent a ton of money on their wedding decorations.","pattern":"spend a ton of money on [something]"},{"sentence":"You don't need to spend a ton of money to have a great vacation.","pattern":""},{"sentence":"The company spent a ton of money on research and development.","pattern":"past tense: spent a ton of money"},{"sentence":"I'm considering whether I should spend a ton of money on a new car.","pattern":""}],"more_examples":["I don't want to spend a ton of money on a designer handbag.","They spent a ton of money renovating their kitchen last summer.","You can get a really high-quality camera without spending a ton of money."],"synonyms":["spend a fortune","break the bank"],"antonyms":["save money","scrimp and save","spend very little","be frugal"],"gap":{"sentence":"I really want to renovate my kitchen, but I'm worried I'll have to _____ to get it done.","answer":"spend a ton of money","options":["spend a ton of money","earn a small amount","waste a tiny bit","borrow a few coins"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/322556-322835.webm","at":3225.7,"dur":2.79}},{"term":"bring (something) up","pos":"phrasal verb","definition":"To mention a specific topic or start talking about a particular subject in a conversation.","time":3485.2,"lesson":"This is already such an advanced construction. You might say, 'Well, yes, I didn't want to bring this up.'","examples":[{"sentence":"I'm not sure if I should bring up the budget issues during the meeting.","pattern":"bring up + noun"},{"sentence":"Why did you have to bring that up right now?","pattern":"bring + object + up"},{"sentence":"She brought up several interesting points during the presentation.","pattern":"bring up + several + plural nouns"},{"sentence":"I'd rather not bring it up again; it's a very sensitive topic.","pattern":"bring it up"}],"more_examples":["I'm sorry to bring this up, but we need to discuss your performance.","He didn't bring up the fact that he was planning to quit.","Could you bring up the issue of parking during the next call?"],"synonyms":["mention","raise","introduce","touch on","bring to attention","broach"],"antonyms":["ignore","avoid","keep quiet about"],"gap":{"sentence":"I was planning to tell him about the broken window later, but he _____ first during dinner.","answer":"brought it up","options":["brought it up","sold it","bought it","hid it"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/348576-348843.webm","at":3485.9,"dur":2.67}},{"term":"come to","pos":"phrasal verb","definition":"to reach a particular point, conclusion, or situation in a conversation or process.","time":3487.2,"lesson":"I didn't want to bring this up. Well, that is what we came to.","examples":[{"sentence":"After a long discussion, we finally came to an agreement.","pattern":"come to + an agreement"},{"sentence":"We didn't want to argue, but that's what we came to.","pattern":"that's what we came to"},{"sentence":"The conversation eventually came to a halt.","pattern":"come to a halt"},{"sentence":"I'm sorry, I didn't mean for us to come to this point.","pattern":"come to + [point/situation]"}],"more_examples":["After hours of deliberation, the committee finally came to a decision.","The investigation eventually came to a conclusion after months of research."],"synonyms":["reach","arrive at","end up at","conclude"],"antonyms":[],"gap":{"sentence":"After debating the budget for hours, the committee finally _____ a decision regarding the new project.","answer":"came to","options":["came to","went to","made to","gave to"]},"clip":{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/348860-348987.webm","at":3488.8,"dur":1.27}}],"dialogues":[{"title":"Weather and winter in Moscow","lines":[{"speaker":"A","text":"Can you see me clearly? I might need to turn off my VPN.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/000602-001287.webm","at":6.2,"dur":6.85}]},{"speaker":"B","text":"I can see you, but it's quite dark outside. It's only 10 a.m. and it feels like winter already.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/004914-006452.webm","at":49.3,"dur":15.38}]},{"speaker":"A","text":"It's dark because of the clouds, not because it's night. It's autumn, but it looks like winter.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/006828-007343.webm","at":68.4,"dur":5.15},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/008048-008590.webm","at":80.6,"dur":5.42}]},{"speaker":"B","text":"I definitely hate winter. I don't mind autumn, though. In Moscow, autumn is very cool.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/010310-010970.webm","at":103.3,"dur":6.6},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/011458-012052.webm","at":114.7,"dur":5.94}]},{"speaker":"A","text":"I'm neutral about autumn. I don't really like it, but I don't hate it either.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/015918-017105.webm","at":159.4,"dur":11.87}]},{"speaker":"B","text":"I hate winter because it's so cold and dark. I can't stand waking up in a dark room.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/023900-025039.webm","at":239.2,"dur":11.39}]},{"speaker":"A","text":"I totally understand. People usually head to warmer countries when it's winter in Russia.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/041400-042821.webm","at":414.1,"dur":14.21}]},{"speaker":"B","text":"Do you go anywhere in the winter? I sometimes think about going somewhere to go skiing.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/043402-043751.webm","at":434.1,"dur":3.49},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/045276-046397.webm","at":452.9,"dur":11.21}]},{"speaker":"A","text":"Do you mean skiing in the snow or ice skating?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/047440-048459.webm","at":474.5,"dur":10.19},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/048862-049661.webm","at":488.8,"dur":7.99}]},{"speaker":"B","text":"I'm not sure what you mean by skiing. Is it about ice or snow?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/053000-053143.webm","at":530.2,"dur":1.43}]}],"time":6.2,"topic":0},{"title":"Sports, sickness, and technical issues","lines":[{"speaker":"A","text":"I see the skis and the skates on your screen. So, when you talk about ice, you mean ice skating, and mountains mean skiing.","highlights":["ice skating"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/054700-056154.webm","at":547.1,"dur":14.54}]},{"speaker":"B","text":"In Moscow, there are plenty of places to go ice skating. I'd love to go, but I'm always busy with my studies.","highlights":["busy with"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/057930-058270.webm","at":579.4,"dur":3.4}]},{"speaker":"A","text":"You have a few hours a week. Why don't you just go to an ice rink?","highlights":["ice rink"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/060508-061863.webm","at":605.2,"dur":13.55}]},{"speaker":"B","text":"I want to, but I just can't seem to make it happen. Do you have any free time today?","highlights":["make it happen"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/062786-063347.webm","at":628.0,"dur":5.61}]},{"speaker":"B","text":"I'm going to an online art school, but I'll do my homework tomorrow because I'm not feeling very well.","highlights":["not feeling very well"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/068590-070133.webm","at":686.0,"dur":15.43}]},{"speaker":"A","text":"What kind of sickness did you have? Did you have a high temperature?","highlights":["high temperature"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/072054-072574.webm","at":720.7,"dur":5.2}]},{"speaker":"B","text":"I had a fever and a sore throat. My temperature was 38 yesterday, and I also had a stomach ache.","highlights":["sore throat","stomach ache"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/072844-073599.webm","at":728.6,"dur":7.55},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/078614-079596.webm","at":786.3,"dur":9.82}]},{"speaker":"A","text":"Did you feel bad because of the weather? Maybe the gloomy weather put you in a bad mood.","highlights":["bad mood"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/090870-091522.webm","at":908.8,"dur":6.52}]},{"speaker":"B","text":"It started with a headache and a bad mood. I ended up sleeping all day long.","highlights":["all day long"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/090278-091112.webm","at":902.9,"dur":8.34},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/094066-094638.webm","at":940.8,"dur":5.72}]},{"speaker":"A","text":"Is your internet working fine in Moscow? I have an idea—please turn your VPN back on so we can switch to Google Meet.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/098156-098960.webm","at":981.7,"dur":8.04}]}],"time":547.1,"topic":1},{"title":"Discussing illness and conditional sentences","lines":[{"speaker":"A","text":"Are we back online now? I hope the connection stays stable this time.","highlights":["stays stable"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/123986-124834.webm","at":1240.0,"dur":8.48}]},{"speaker":"B","text":"I felt pretty bad, but I didn't call a doctor or anything. I just had a fever for about three days.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/125300-125760.webm","at":1253.1,"dur":4.6},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/135250-135794.webm","at":1352.6,"dur":5.44}]},{"speaker":"A","text":"Did you actually measure your temperature? You should have had a reason to think you were sick.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/138762-139609.webm","at":1387.8,"dur":8.47}]},{"speaker":"B","text":"I didn't have a clear reason. I just felt like something was off, but I couldn't put my finger on it.","highlights":["put my finger on"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/139736-141112.webm","at":1397.5,"dur":13.76}]},{"speaker":"A","text":"You could have just been tired. In English, we call that feeling 'under the weather' when you aren't fully sick but can't function properly.","highlights":["under the weather"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/144490-145410.webm","at":1445.0,"dur":9.2}]},{"speaker":"B","text":"I thought if I had taken pills on the first day, I wouldn't have gotten any sicker.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/155132-156511.webm","at":1551.5,"dur":13.79}]},{"speaker":"A","text":"That's a third conditional! You're talking about a hypothetical situation in the past.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/155826-157243.webm","at":1558.4,"dur":14.17}]},{"speaker":"B","text":"I remember the zero and first conditionals, but the third one is really confusing for me.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/158160-159391.webm","at":1581.7,"dur":12.31}]},{"speaker":"A","text":"The first conditional is for likely situations, while the third is for things that are very unlikely or impossible now.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/173048-174104.webm","at":1730.6,"dur":10.56}]},{"speaker":"B","text":"I still don't quite understand how to use them correctly.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/174790-175208.webm","at":1748.1,"dur":4.18}]}],"time":1240.0,"topic":2},{"title":"Understanding English Conditionals","lines":[{"speaker":"A","text":"The classic example of a zero conditional is heating water. If you heat water to a hundred degrees, it boils.","highlights":["classic example"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/175402-175965.webm","at":1754.1,"dur":5.63}]},{"speaker":"B","text":"Exactly. It doesn't depend on any specific conditions; it's just a fact. Like, if there is a nuclear war, everyone dies.","highlights":["depend on"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/176620-178184.webm","at":1766.3,"dur":15.64}]},{"speaker":"A","text":"Right, those are zero conditionals. We use the present simple in both the if-clause and the result clause.","highlights":["result clause"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/179748-180514.webm","at":1797.6,"dur":7.66}]},{"speaker":"B","text":"I understand the zero and first conditionals, but the third conditional is so difficult for me. I can't remember the formula.","highlights":["third conditional"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/194696-195602.webm","at":1947.1,"dur":9.06}]},{"speaker":"A","text":"You need to understand it intuitively. The rule is that we move from likely scenarios to unlikely ones.","highlights":["move from"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/191842-192395.webm","at":1918.5,"dur":5.53}]},{"speaker":"B","text":"So, the third conditional is for a scenario that didn't happen in the past? Like, if I had started preparing for the exam yesterday, I would have passed today?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/204036-204850.webm","at":2040.5,"dur":8.14}]},{"speaker":"A","text":"Yes, that's it. The third conditional is for things that already happened in a wrong way.","highlights":["wrong way"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/207862-208187.webm","at":2078.7,"dur":3.25}]},{"speaker":"B","text":"What about the first conditional? Is that for something very likely to happen in the future, but not a fact yet?","highlights":["likely to happen"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/210858-211554.webm","at":2108.7,"dur":6.96}]},{"speaker":"A","text":"Correct. And the second conditional is for unreal situations in the present, like 'If I had wings, I could fly.'","highlights":["unreal situations"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/217010-218003.webm","at":2170.3,"dur":9.93},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/218284-218719.webm","at":2183.0,"dur":4.35}]},{"speaker":"B","text":"I find it confusing that English doesn't have a specific future tense form like some other languages do.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/219918-220561.webm","at":2199.4,"dur":6.43},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/221978-222463.webm","at":2220.0,"dur":4.85}]},{"speaker":"A","text":"Exactly. You don't have a single word for 'I will go.' You just add 'will' to the verb to indicate the future.","highlights":["indicate the future"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/229502-230049.webm","at":2295.2,"dur":5.47}]}],"time":1754.1,"topic":2},{"title":"Understanding Future Tenses and Conditionals","lines":[{"speaker":"A","text":"Think of 'will' as a modal verb, just like 'can' or 'should.' It's really about communicating your intention to do something.","highlights":["think of"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/230496-232043.webm","at":2305.1,"dur":15.47}]},{"speaker":"B","text":"So, in a native speaker's mind, there isn't really a specific future tense? It's more about the intent behind the action.","highlights":["native speaker"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/232862-234001.webm","at":2328.8,"dur":11.39}]},{"speaker":"A","text":"Exactly. In English, there isn't a single verb for the future. It's logical because even in Russian, 'I will go' is translated as a statement of intent.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/235276-236541.webm","at":2353.0,"dur":12.65}]},{"speaker":"B","text":"I see. So when you say 'I will go,' you're basically saying you have a very serious intention to go.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/240704-241460.webm","at":2407.2,"dur":7.56}]},{"speaker":"A","text":"Right, and for native speakers, the line between the present and the future is very blurry. We often use 'going to' for planned events.","highlights":["very blurry"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/241464-243019.webm","at":2414.8,"dur":15.55}]},{"speaker":"B","text":"Textbooks usually separate 'will,' 'going to,' and the present continuous. For example, 'I'm having a party on Sunday.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/246360-247440.webm","at":2463.7,"dur":10.8}]},{"speaker":"A","text":"Don't sweat the small stuff. In real life, the differences are subtle. 'Will' implies certainty, 'going to' is less confident, and present continuous is the highest level of certainty.","highlights":["don't sweat the small stuff"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/247658-248417.webm","at":2476.8,"dur":7.59},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/248626-249622.webm","at":2486.5,"dur":9.96}]},{"speaker":"B","text":"In America, 'I'm gonna' is extremely common. People don't really notice the difference between 'will' and 'going to' anymore.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/252431-253898.webm","at":2524.5,"dur":14.67}]},{"speaker":"A","text":"Let's look at the zero conditional for common facts. For example, 'If you heat ice, it melts.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/254695-255997.webm","at":2547.1,"dur":13.02},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/256160-256946.webm","at":2561.8,"dur":7.86}]},{"speaker":"B","text":"That's simple. Another one would be: 'If you boil water, it evaporates.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/260676-261093.webm","at":2606.9,"dur":4.17},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/262050-263316.webm","at":2620.7,"dur":12.66}]},{"speaker":"A","text":"Now, for less likely situations, like, 'If I earn 100,000, I will fly to Thailand.' But we can also use the second conditional: 'If I were a woman, I would not work there.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/264087-265678.webm","at":2641.0,"dur":15.91}]}],"time":2305.1,"topic":3},{"title":"Understanding Conditional Sentences and Past Tense","lines":[{"speaker":"A","text":"Imagine a situation where you believe something might happen, like making money and flying to Thailand. How do we express that in English?","highlights":["might happen"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/266694-267389.webm","at":2667.1,"dur":6.95}]},{"speaker":"B","text":"We use the 'if' clause. But you don't actually need to use the past tense here.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/268080-269610.webm","at":2680.9,"dur":15.3}]},{"speaker":"A","text":"Exactly. In English, the past tense is often used to express unrealistic or practically mythical scenarios.","highlights":["practically mythical"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/270394-271433.webm","at":2704.0,"dur":10.39},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/271776-273135.webm","at":2718.0,"dur":13.59}]},{"speaker":"B","text":"Like when we say, 'Could you tell me where the stadium is?' Why do we use 'could' there?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/273816-275127.webm","at":2738.4,"dur":13.11}]},{"speaker":"A","text":"It's a polite form. It's like asking someone to make an impossible situation possible, like asking a king to pass the salt.","highlights":["polite form"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/275771-277036.webm","at":2757.9,"dur":12.65},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/278282-279010.webm","at":2783.0,"dur":7.28}]},{"speaker":"B","text":"So, in the first conditional, we don't need the past tense because it's not an unrealistic scenario.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/282794-284069.webm","at":2828.1,"dur":12.75}]},{"speaker":"A","text":"Right. Even though we use a modal verb for the result, both parts are understood as the present.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/285888-287165.webm","at":2859.1,"dur":12.77}]},{"speaker":"B","text":"In Russian, we use the future tense for both parts, but English treats the condition as a present possibility.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/287758-289261.webm","at":2877.7,"dur":15.03}]},{"speaker":"A","text":"Let's look at your life. If you say, 'If I learn Korean, I will come to Korea,' it sounds a bit ambiguous.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/293510-294609.webm","at":2935.3,"dur":10.99},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/294754-296271.webm","at":2947.7,"dur":15.17}]},{"speaker":"B","text":"So, should I say, 'If I know Korean well, I will go to Korea'?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/300344-301233.webm","at":3003.6,"dur":8.89},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/301438-301856.webm","at":3014.6,"dur":4.18}]},{"speaker":"A","text":"Yes, that works. We are talking about unrealistic situations, and it's very important to understand that distinction.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/303435-304853.webm","at":3034.5,"dur":14.18}]}],"time":2667.1,"topic":3},{"title":"Mastering Conditionals and Past Perfect","lines":[{"speaker":"A","text":"If I had a million dollars, I wouldn't be teaching English right now. We use the past tense to show that a scenario is unrealistic in the present.","highlights":["right now"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/305836-306397.webm","at":3058.5,"dur":5.61},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/309230-309951.webm","at":3092.5,"dur":7.21}]},{"speaker":"B","text":"I see. So, what would you do if you had a million dollars?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/314078-314445.webm","at":3141.0,"dur":3.67}]},{"speaker":"A","text":"I would get an investor visa in Korea.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/315102-315852.webm","at":3151.2,"dur":7.5}]},{"speaker":"B","text":"That's a solid plan. What would you do if you were an airman?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/314078-317187.webm","at":3141.0,"dur":31.09},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/317652-318087.webm","at":3176.7,"dur":4.35}]},{"speaker":"A","text":"I'd probably just walk around at night.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/320050-320636.webm","at":3200.7,"dur":5.86}]},{"speaker":"B","text":"And what about you? If you were a woman, what would you do?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/321612-322835.webm","at":3216.2,"dur":12.23}]},{"speaker":"A","text":"I'd have to spend a lot on cosmetics. Now, let's look at the past perfect. We use it for incredible scenarios that happened even further back in the past.","highlights":["further back"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/321612-322835.webm","at":3216.2,"dur":12.23},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/325162-325513.webm","at":3251.7,"dur":3.51}]},{"speaker":"B","text":"So, instead of saying 'I have done my homework' in the present perfect, we use the past perfect for a point even earlier in the past?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/329072-329447.webm","at":3290.9,"dur":3.75},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/338486-339294.webm","at":3385.1,"dur":8.08}]},{"speaker":"A","text":"Exactly. It's common in books. For example, 'By the time he was 40, he had already given birth to two children.'","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/341234-341784.webm","at":3412.5,"dur":5.5}]},{"speaker":"B","text":"And how do we handle modal verbs in this structure?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/344840-345691.webm","at":3448.5,"dur":8.51}]},{"speaker":"A","text":"You use the modal verb plus 'have'. The main verb then belongs to the 'have' part of the structure.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/349804-350562.webm","at":3498.1,"dur":7.58}]}],"time":3058.5,"topic":4},{"title":"Mastering the Third Conditional","lines":[{"speaker":"A","text":"So, here we have the usual past perfect. It’s nothing new or particularly cool, but it's important.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/353107-353546.webm","at":3531.3,"dur":4.39}]},{"speaker":"B","text":"Right. For example, if we hadn't gotten sick and if I'd had a high temperature, what would have happened?","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/353684-354467.webm","at":3536.9,"dur":7.83}]},{"speaker":"A","text":"Well, if I had taken the pills earlier, my temperature wouldn't have risen to 38.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/355060-355595.webm","at":3550.7,"dur":5.35}]},{"speaker":"B","text":"I remember the structure exists, but I honestly didn't know how to use it.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/362452-363371.webm","at":3624.7,"dur":9.19}]},{"speaker":"A","text":"It is a bit complicated, but it's really necessary. Schools teach millions of things that aren't useful, like the difference between 'will' and the present continuous.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/363412-363728.webm","at":3634.3,"dur":3.16},{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/365444-365881.webm","at":3654.6,"dur":4.37}]},{"speaker":"B","text":"I remember where the first, second, and zero conditionals are used, but I forgot how the third one is built.","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/368148-369312.webm","at":3681.7,"dur":11.64}]},{"speaker":"A","text":"Just think about it; it's logical. I advise you to focus on three fundamental rules to start feeling how it works.","highlights":["focus on"],"clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/369610-370318.webm","at":3696.3,"dur":7.08}]},{"speaker":"B","text":"Got it. See you on Wednesday. Get better!","clips":[{"src":"lesson_audio/lesson_date_28-09-2026_time_14-11-31/371332-371548.webm","at":3713.4,"dur":2.16}]}],"time":3531.3,"topic":5}]};
