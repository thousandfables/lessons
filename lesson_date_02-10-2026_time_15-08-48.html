 me from seeing her.","pattern":""},{"sentence":"He was blocked by his own friends when he tried to date her.","pattern":"be blocked by someone"},{"sentence":"My parents are trying to block me from dating anyone under 25.","pattern":""}],"more_examples":["She tried to block him from getting close to his coworkers.","The school counselor warned that his friends were trying to block him from seeing his crush."],"synonyms":["keep someone away from","prevent someone from seeing","stop someone from"],"antonyms":["encourage","support","help","facilitate","approve"],"gap":{"sentence":"After he saw her dating his best friend, he decided to _____ to stop her from contacting him again.","answer":"block her","options":["block her","invite her","trust her","help her"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/338570-339097.webm","at":3385.9,"dur":5.27},"match_definition":"Get in the way of somebody's attempt to get romantically close to another person."},{"term":"approach something strategically","pos":"expression","definition":"To deal with a task by making a careful, organized plan to achieve a specific goal.","time":3490.0,"lesson":"Just using words can be kind of boring. However, if you approach it strategically—by memorizing word lists and laying them out in a deliberate way—it actually becomes interesting.","examples":[{"sentence":"If we approach the marketing campaign strategically, we can reach our target audience more effectively.","pattern":"approach + [object] + strategically"},{"sentence":"We need to approach this problem strategically rather than just reacting to every small issue.","pattern":"approach + [object] + rather than"},{"sentence":"The company decided to approach the merger strategically to minimize financial risks.","pattern":"decide to + approach + [object] + strategically"},{"sentence":"How should we approach the negotiations strategically to ensure we get the best deal?","pattern":"How should we + approach + [object] + strategically?"}],"more_examples":["To succeed in the competitive tech industry, you have to approach your product development strategically.","The coach advised the team to approach the final game strategically to ensure a win.","If you want to save for a house, you should approach your budget strategically."],"synonyms":["plan strategically","tackle systematically","handle methodically","take a calculated approach","execute a deliberate plan","manage purposefully"],"antonyms":["react impulsively","act haphazardly","tackle randomly","act without a plan","improvise"],"gap":{"sentence":"Instead of trying to finish the entire project in one night, we should _____ to ensure every detail is perfect.","answer":"approach the task strategically","options":["approach the task strategically","finish the task quickly","ignore the task completely","do the task randomly"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/348984-349584.webm","at":3490.0,"dur":6.0},"match_definition":"Tackle a task with a considered plan aimed at the result you want."},{"term":"lay out","pos":"phrasal verb","definition":"To arrange or organize something in a clear, deliberate, or systematic way.","time":3496.5,"lesson":"If you approach it strategically, like I have to memorize the list of words and lay them out in a very deliberate way, then it actually becomes interesting.","examples":[{"sentence":"The architect will lay out the plans for the new community center next week.","pattern":"lay out + noun"},{"sentence":"You need to lay out your ideas clearly before starting the presentation.","pattern":"lay out + object"},{"sentence":"The instructions lay out the steps you need to follow to assemble the chair.","pattern":"lay out + steps/instructions"},{"sentence":"She laid out the food on the table for the guests to enjoy.","pattern":"past tense: laid out"}],"more_examples":["The interior designer will lay out the furniture to maximize the use of space.","Before we begin the meeting, I'd like to lay out the main objectives for the project.","The brochure lays out all the different tour options available for the summer."],"synonyms":["organize","arrange","structure","outline","plan","set out","map out","systematize"],"antonyms":["disorganize","jumble","mess up","clutter"],"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/349530-349911.webm","at":3495.4,"dur":3.81},"match_definition":"Set things in a planned arrangement so their organization is easy to follow."},{"term":"to the best of one's ability","pos":"expression","definition":"doing something as well as you possibly can given your skills or circumstances.","time":3513.6,"lesson":"I will try to incorporate the pronunciation checker into the review of the best of my ability. Please check it out in the final version.","examples":[{"sentence":"I will complete the project to the best of my ability by Friday.","pattern":"will + [verb] + to the best of my ability"},{"sentence":"She performed the piano concerto to the best of her ability.","pattern":"subject + [verb] + to the best of her ability"},{"sentence":"He tried to explain the complex rules to the best of his ability.","pattern":"try + to [verb] + to the best of his ability"},{"sentence":"To the best of my ability, I have organized all the files into folders.","pattern":"To the best of my ability, [main clause]"}],"more_examples":["The paramedics did everything they could to the best of their ability to stabilize the patient.","I'm not a professional chef, but I cooked the three-course meal to the best of my ability.","The volunteers worked to the best of their ability to clear the debris after the storm."],"synonyms":["as well as possible"],"antonyms":["half-heartedly","carelessly","negligently","without trying"],"gap":{"sentence":"Even though I have never cooked before, I will prepare the three-course meal _____.","answer":"to the best of my ability","options":["to the best of my ability","to the worst of my ability","to the quickest of my ability","to the easiest of my ability"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/351988-352407.webm","at":3520.1,"dur":4.19},"match_definition":"Giving a task the best performance you are capable of."},{"term":"incorporate the pronunciation checker","pos":"noun phrase","definition":"to include a tool that checks how correctly words are spoken into a study routine.","time":3521.6,"lesson":"I will try to do the best I can to incorporate the pronunciation checker into the review. You can check it out in the final version.","examples":[{"sentence":"I plan to incorporate the pronunciation checker into my daily vocabulary practice.","pattern":"incorporate [something] into [something]"},{"sentence":"Could you incorporate the pronunciation checker into the next software update?","pattern":"incorporate [something] into [a project/update]"},{"sentence":"It is helpful to incorporate the pronunciation checker whenever you learn new phrases.","pattern":"It is [adjective] to incorporate"},{"sentence":"We should incorporate the pronunciation checker to help students improve their speaking skills.","pattern":"incorporate [something] to [verb/purpose]"}],"countable":[],"uncountable":[{"meaning":"to include a tool that checks how correctly words are spoken into a study routine.","example":"I will try to do the best I can to incorporate the pronunciation checker into the review.","lesson":true}],"more_examples":[],"synonyms":[],"antonyms":[],"gap":{"sentence":"Since I often struggle with my accent, I decided to _____ into my daily study routine to ensure I'm speaking clearly.","answer":"incorporate the pronunciation checker","options":["incorporate the pronunciation checker","record the voice message","ignore the grammar rules","delete the study notes"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/351988-352407.webm","at":3520.1,"dur":4.19},"match_definition":"Make a speech-assessment tool part of the way you study."},{"term":"consonant","pos":"noun","definition":"A speech sound produced by blocking or restricting the flow of air through the mouth.","time":3592.3,"lesson":"I'm sorry, those were vowels. Consonants are easier to fix, while vowels are harder because many do not exist in Russian.","examples":[{"sentence":"The letter 'B' is a consonant, while 'A' is a vowel.","pattern":""},{"sentence":"He struggled to pronounce the 'th' consonant clearly.","pattern":""},{"sentence":"English has many consonant clusters that can be difficult for learners.","pattern":"consonant clusters"},{"sentence":"Try to focus on the consonant sounds at the beginning of the word.","pattern":""}],"countable":[{"meaning":"A speech sound produced by blocking or restricting the flow of air through the mouth.","example":"Consonants are easier to fix, while vowels are harder because many do not exist in Russian.","lesson":true},{"meaning":"A letter of the alphabet that is not a vowel","example":"The word 'cat' starts with a consonant."}],"uncountable":[],"more_examples":["The teacher asked the students to identify the consonant sounds in the word 'strength'.","You need to place your tongue against your teeth to produce that consonant.","Some consonants are produced using only the lips, like 'p' and 'm'."],"synonyms":[],"antonyms":[],"gap":{"sentence":"The speech therapist explained that a _____ is formed by briefly blocking the airflow, unlike a vowel.","answer":"consonant","options":["consonant","vowel","accent","intonation"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/359210-359751.webm","at":3592.2,"dur":5.41},"match_definition":"A speech sound made with the airflow partly or completely obstructed."},{"term":"chill","pos":"verb","definition":"To spend time in a relaxed way, usually doing nothing special or just socializing.","time":3669.6,"lesson":"My brother is on the road to the village right now. He is going to have a party with his friends, have a few drinks, and just chill there.","examples":[{"sentence":"We're just going to chill at home and watch some movies tonight.","pattern":"just chill"},{"sentence":"After a long week of work, I really need to chill out for a while.","pattern":"chill out"},{"sentence":"Are you doing anything special this weekend, or are you just chilling?","pattern":"just chilling"},{"sentence":"The music was very chill, which made it perfect for a relaxing evening.","pattern":"chill (adjective usage)"}],"more_examples":["I’m not doing much today, I think I’ll just chill by the pool.","We don't have any plans for the holidays, we're just going to chill.","Why don't we just chill for a bit before we head out to dinner?"],"synonyms":["relax","hang out","take it easy","kick back","loosen up","unwind","mellow out","veg out"],"antonyms":["work","stress out","hurry"],"gap":{"sentence":"I don't want to go to a loud party tonight; I'd rather just _____ at home with a book.","answer":"chill","options":["chill","train","compete","perform"]},"clip":{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/367184-367578.webm","at":3671.9,"dur":3.94},"match_definition":"Unwind or hang out casually without doing anything demanding."}],"dialogues":[{"title":"Lighting setups and Zhirinovsky's humor","lines":[{"speaker":"A","text":"I'm trying to warm up my jaw, but my microphone is so loud that it's actually hurting my ears.","highlights":["hurting my ears"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/000388-000996.webm","at":4.0,"dur":6.08},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/001440-002131.webm","at":14.5,"dur":6.91}]},{"speaker":"B","text":"It's not that easy to find the settings to lower the volume, but I've already ordered a new one.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/004210-004892.webm","at":42.2,"dur":6.82}]},{"speaker":"A","text":"Regarding the lighting, I think working with daylight is much better than any artificial light.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/010700-011605.webm","at":107.1,"dur":9.05}]},{"speaker":"B","text":"Daylight is hard to control, especially when it's cloudy. You really need special lamps to fix the picture.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/012896-013912.webm","at":129.1,"dur":10.16}]},{"speaker":"A","text":"For the background, most people use magenta because research shows it's the most relaxing color.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/017846-018264.webm","at":178.7,"dur":4.18},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/020826-021604.webm","at":208.4,"dur":7.78}]},{"speaker":"A","text":"I remember a story about Zhirinovsky being in a gay club in New York back in 1992.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/025698-026737.webm","at":257.2,"dur":10.39}]},{"speaker":"B","text":"He said something hilarious about dodging splashes. I've always been surprised by how flexible his Russian was.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/030914-031775.webm","at":309.3,"dur":8.61},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/035180-035876.webm","at":351.9,"dur":6.96}]},{"speaker":"A","text":"Exactly. He had a very interesting combination of casual, everyday words mixed with very sophisticated terms.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/038526-039162.webm","at":385.4,"dur":6.36},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/040402-041044.webm","at":404.1,"dur":6.42}]}],"time":4.0,"topic":0},{"title":"Political personas and propaganda tactics","lines":[{"speaker":"A","text":"I think he was smart because he knew how to appeal to people who aren't particularly bright. They really respected him.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/041160-042098.webm","at":411.7,"dur":9.38}]},{"speaker":"B","text":"True, but he was just doing his job. All those Russian propagandists are professionals at what they do, just like Goebbels.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/043510-044878.webm","at":435.2,"dur":13.68}]},{"speaker":"A","text":"They might not be as skilled as the old generation, but they're starting to target kids in kindergarten now.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/047184-048068.webm","at":472.0,"dur":8.84},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/048816-049359.webm","at":488.3,"dur":5.43}]},{"speaker":"B","text":"That's their job. Honestly, he was such an effective politician that he could have won in a democratic society.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/051584-052642.webm","at":515.9,"dur":10.58}]},{"speaker":"A","text":"Exactly. People chose him because they liked his personality. He was a great debater, and it's hard to counter his methods.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/053604-054418.webm","at":536.1,"dur":8.14},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/056314-056817.webm","at":563.2,"dur":5.03}]},{"speaker":"B","text":"I remember his interview where he made her cry. He knew exactly where to strike, but he really overdid it.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/062932-063701.webm","at":629.4,"dur":7.69}]},{"speaker":"A","text":"He was a greedy bastard. He had the ambition to start his own party during the USSR era.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/067376-067962.webm","at":673.9,"dur":5.86},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/069196-069699.webm","at":692.1,"dur":5.03}]},{"speaker":"B","text":"He just accepted the role of a clown to distract people. If he'd had more ambition, he could have united the allied groups.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/071078-072013.webm","at":710.9,"dur":9.35},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/074188-074450.webm","at":742.0,"dur":2.62}]},{"speaker":"A","text":"He was happy to play the clown for a huge salary. He probably had millions in his bank account and didn't care.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/075514-076828.webm","at":755.2,"dur":13.14}]},{"speaker":"B","text":"He always dresses up as an ordinary guy, like a retired old man.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/077568-078313.webm","at":775.8,"dur":7.45}]}],"time":411.7,"topic":1},{"title":"Political power, conformists, and AI tools","lines":[{"speaker":"A","text":"In that interview before he died, he stood in a car park filled with dozens of trucks. It felt like he had all those resources at his disposal.","highlights":["at his disposal"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/079622-080838.webm","at":796.3,"dur":12.16}]},{"speaker":"B","text":"Exactly. It makes you wonder how many houses belonging to the party were actually used for private use instead of for some official purpose.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/080824-082048.webm","at":808.3,"dur":12.24}]},{"speaker":"A","text":"Do you think anyone actually wants that much power? It seems much easier to stay in the shadows and just earn enough money to live comfortably.","highlights":["stay in the shadows"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/085240-086621.webm","at":852.5,"dur":13.81}]},{"speaker":"B","text":"It really comes down to your soul. If someone is obsessed with owning a luxury apartment by the sea, they'll do anything to get it.","highlights":["comes down to"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/090286-091747.webm","at":903.0,"dur":14.61}]},{"speaker":"A","text":"That guy was a smart person, but at his core, he was a conformist. He was perfectly fine with the status quo.","highlights":["at his core"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/097506-098934.webm","at":975.2,"dur":14.28}]},{"speaker":"B","text":"That might be why the country is the way it is today. Even if people are against it now, the elites still support the system.","highlights":["the way it is"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/099490-100912.webm","at":995.0,"dur":14.22}]},{"speaker":"A","text":"Speaking of systems, I was playing around with a pronunciation checker this morning. It can spot mistakes, but they're still pretty unreliable.","highlights":["playing around with"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/105302-106951.webm","at":1053.1,"dur":16.49}]},{"speaker":"B","text":"Pronunciation is tough. Is it an app or just a website? I'm trying to figure out if it's a standalone application or something else.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/108634-110024.webm","at":1086.5,"dur":13.9}]},{"speaker":"A","text":"It's more of a website. It's generating in the background and is supposed to detect our new lessons automatically. I'm just curating it a bit.","highlights":["in the background"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/112166-113630.webm","at":1121.9,"dur":14.64}]},{"speaker":"B","text":"Well, we started on a very high note and then suddenly jumped straight to reviewing.","highlights":["on a very high note"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/114298-115068.webm","at":1143.2,"dur":7.7}]}],"time":796.3,"topic":1},{"title":"Money vs. Ideas as Motivation","lines":[{"speaker":"A","text":"I've been thinking a lot about politics lately. I've concluded that when a system is built around people who are easily satisfied by money, it eventually degrades.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/115210-116222.webm","at":1152.2,"dur":10.12}]},{"speaker":"B","text":"That's true. Money is only one motivation, but there are much more powerful drivers that create better systems, like leaving a footprint on history.","highlights":["footprint on history"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/118802-119950.webm","at":1188.1,"dur":11.48}]},{"speaker":"A","text":"Exactly. Take Elon Musk; he's driven by the idea of colonizing Mars. The best results come from people driven by ideas, not just short-term gains.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/121476-122711.webm","at":1214.9,"dur":12.35}]},{"speaker":"B","text":"People often start out with morals, but as they get older and get a taste of success, they just completely submit to the system.","highlights":["get a taste of"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/126436-127380.webm","at":1264.5,"dur":9.44}]},{"speaker":"A","text":"In the long run, having a lot of money can actually be boring. You can only buy so many Claude Code subscriptions.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/130402-131796.webm","at":1304.1,"dur":13.94}]},{"speaker":"B","text":"Right. If someone says they're accumulating wealth just to build an AI, it's rarely how it works. They often don't know what to do with all that money.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/138674-139393.webm","at":1386.8,"dur":7.19}]},{"speaker":"A","text":"It's like Scrooge McDuck. They just want more money for the sake of having more money, and they've built a cult around it.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/140078-141363.webm","at":1400.9,"dur":12.85}]},{"speaker":"B","text":"I also hate the propaganda telling 25-year-olds they're losers if they don't own an apartment. It's nearly impossible with current prices.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/143934-145404.webm","at":1439.5,"dur":14.7}]},{"speaker":"A","text":"You'd have to work since you were 16 and invest heavily, and even then, you'd still need help from someone else to buy a house.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/146606-148162.webm","at":1466.2,"dur":15.56}]},{"speaker":"B","text":"And what about the dating market? I've heard from many sources that dating marketers are in crisis right now.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/148162-149542.webm","at":1481.7,"dur":13.8}]}],"time":1152.2,"topic":1},{"title":"Social Media Influence and AI Correction","lines":[{"speaker":"A","text":"People cite so many different reasons for feeling like a loser, but I'm trying to see the clear picture of what's actually happening.","highlights":["clear picture"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/149856-151015.webm","at":1498.7,"dur":11.59}]},{"speaker":"B","text":"It's the Instagram propaganda. You see 20-year-olds driving Ferraris and Lamborghinis, and it makes people feel inadequate about their own lives.","highlights":["feel inadequate"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/151524-152624.webm","at":1515.3,"dur":11.0}]},{"speaker":"A","text":"Exactly. People see someone learn English in two years and think they're a genius, while they ignore the fact that those 'successful' profiles might just be using credit money.","highlights":["ignore the fact"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/155962-157589.webm","at":1559.8,"dur":16.27}]},{"speaker":"B","text":"The algorithm picks the top 1% of wealthy or attractive people to create that impression because it generates more views.","highlights":["create that impression"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/160944-162499.webm","at":1609.5,"dur":15.55}]},{"speaker":"A","text":"Evolution should work differently. If everyone has such high expectations, it just creates a cycle where people feel they aren't good enough.","highlights":["high expectations"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/162896-164532.webm","at":1629.1,"dur":16.36}]},{"speaker":"B","text":"True, but expectations usually lower over time once you find someone. Even at 35, it's still perfectly fine to start a family in modern society.","highlights":["perfectly fine"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/166332-167753.webm","at":1663.4,"dur":14.21}]},{"speaker":"A","text":"I've implemented the changes we discussed in the new version to the best of my abilities.","highlights":["to the best of my abilities"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/170758-171939.webm","at":1707.7,"dur":11.81}]},{"speaker":"B","text":"That's great. I noticed it caught the mistake regarding how to acquire knowledge.","highlights":["acquire knowledge"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/172370-173859.webm","at":1723.8,"dur":14.89}]},{"speaker":"A","text":"I haven't checked the full version yet, but it depends on how precisely you type the reference in the prompt.","highlights":["depends on"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/177484-178302.webm","at":1774.9,"dur":8.18}]},{"speaker":"B","text":"The AI sometimes confuses a level six problem with a level four one, but it's not a big deal.","highlights":["not a big deal"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/178172-179495.webm","at":1781.8,"dur":13.23}]},{"speaker":"A","text":"The navigation pane is handy because you can jump straight to the vocabulary section with just two buttons.","highlights":["jump straight to"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/184512-185887.webm","at":1845.3,"dur":13.75}]}],"time":1498.7,"topic":3},{"title":"App navigation and AI features","lines":[{"speaker":"A","text":"The navigation is really cool. I love that the back button stays in the same place.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/187040-187786.webm","at":1870.5,"dur":7.46}]},{"speaker":"B","text":"Exactly. I hate how iPhone developers put the back button in different places in every new app.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/189154-190140.webm","at":1891.6,"dur":9.86}]},{"speaker":"A","text":"I just want one consistent button to go back to the previous page.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/190902-191328.webm","at":1909.1,"dur":4.26}]},{"speaker":"B","text":"By the way, did you finish the vocabulary match quiz this morning?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/191818-193209.webm","at":1918.4,"dur":13.91}]},{"speaker":"A","text":"I did a bit, but I honestly forgot about it. I need to make a list of features so people actually find them.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/193914-195053.webm","at":1939.3,"dur":11.39}]},{"speaker":"B","text":"The app is growing, so we need a guide with links to help users navigate.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/195926-196432.webm","at":1959.4,"dur":5.06}]},{"speaker":"A","text":"The fill-in-the-blanks tests are interesting. Sometimes a word seems self-explanatory until you have to actually think about it.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/197856-199116.webm","at":1978.8,"dur":12.6}]},{"speaker":"B","text":"I'm thinking of a feature where you can look up random words or ask AI to explain grammar concepts on the spot.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/203630-204642.webm","at":2036.4,"dur":10.12}]},{"speaker":"A","text":"That would drain a lot of tokens. Cheap models lack the flexibility to explain nuanced preposition or article usage.","highlights":["drain a lot of"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/207550-207909.webm","at":2075.6,"dur":3.59},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/208594-209108.webm","at":2086.0,"dur":5.14}]},{"speaker":"B","text":"I'm considering a subscription model, but heavy users will drain the usage very quickly.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/214848-215998.webm","at":2148.6,"dur":11.5}]},{"speaker":"A","text":"It's a marketing and sales strategy challenge. What did the other students say about your update?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/219594-221102.webm","at":2196.0,"dur":15.08}]}],"time":1870.5,"topic":4},{"title":"Distinguishing between bend and curl","lines":[{"speaker":"A","text":"It would be an interesting metric to see how much time people actually spend browsing through a review.","highlights":["interesting metric"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/221850-222875.webm","at":2218.6,"dur":10.25}]},{"speaker":"B","text":"Definitely. People might say a script is good but never actually use it, which might mean the script is boring or the user is just being lazy.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/223338-224989.webm","at":2233.5,"dur":16.51}]},{"speaker":"A","text":"I spent about two hours reading through all the mistakes and vocabulary last time, but I still didn't feel like I'd mastered the material.","highlights":["mastered the material"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/226796-228180.webm","at":2268.1,"dur":13.84}]},{"speaker":"B","text":"You really do need to read the documentation for your features. Maybe an animated guide would help, like a dog that points things out.","highlights":["points things out"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/229562-231021.webm","at":2295.7,"dur":14.59}]},{"speaker":"A","text":"I'm talking about things like paper clips. Is it a metal curling thing used to pin documents, or is it a paper clip?","highlights":["paper clip"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/232498-233315.webm","at":2325.1,"dur":8.17},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/233628-234898.webm","at":2336.5,"dur":12.7}]},{"speaker":"B","text":"It's a paper clip. You can bend it, but 'bend' and 'curl' seem similar at first. You need a model to explain the difference.","highlights":["seem similar"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/236772-238390.webm","at":2367.8,"dur":16.18}]},{"speaker":"A","text":"In my head, 'bend' implies a moving part moving in one direction, like when you bend over. The lower half of your body stays fixed.","highlights":["bend over"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/240368-241764.webm","at":2403.8,"dur":13.96}]},{"speaker":"B","text":"Whereas 'curl' happens along the entire length of an object. A paper clip bends at specific angles, but a wire curls in its entirety.","highlights":["entire length"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/242192-242679.webm","at":2422.0,"dur":4.87},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/242954-244414.webm","at":2429.7,"dur":14.6}]},{"speaker":"A","text":"I rarely use the word 'bend' outside of work, except when people say 'bend over.' What would ChatGPT say about that?","highlights":["outside of work"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/251786-252787.webm","at":2518.0,"dur":10.01},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/253236-253753.webm","at":2532.6,"dur":5.17}]},{"speaker":"B","text":"Usually, it involves a spiral shape. If we go that deep, there are at least ten different ways these words could be described.","highlights":["spiral shape"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/255938-257463.webm","at":2559.6,"dur":15.25}]}],"time":2218.6,"topic":5},{"title":"Exploring the depth of English synonyms","lines":[{"speaker":"A","text":"There are so many synonyms for words like flex, curve, and fold, but each one has its own specific usage.","highlights":["specific usage"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/258836-259619.webm","at":2588.5,"dur":7.83}]},{"speaker":"B","text":"Exactly. Even for a word like cold, you can find at least ten synonyms and antonyms, like crisp or brisk.","highlights":["at least"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/262582-263231.webm","at":2625.9,"dur":6.49},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/264846-265415.webm","at":2648.7,"dur":5.69}]},{"speaker":"A","text":"Brisk is such a literary word. It's great for describing the weather at the beginning of spring.","highlights":["at the beginning of"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/266952-267475.webm","at":2669.6,"dur":5.23}]},{"speaker":"B","text":"Adjectives are so rich. For instance, cordial is more on the friendly spectrum than just being polite.","highlights":["on the friendly spectrum"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/269198-270065.webm","at":2692.2,"dur":8.67},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/271030-271798.webm","at":2710.5,"dur":7.68}]},{"speaker":"A","text":"I've never even heard the word amiable before. It's so annoying when you have to constantly switch between words like affable or congenial.","highlights":["constantly switch"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/275774-277353.webm","at":2757.9,"dur":15.79}]},{"speaker":"B","text":"I love using the Cambridge Dictionary because it lists words like jovial and chummy, which I'm seeing for the first time.","highlights":["for the first time"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/278928-280009.webm","at":2789.4,"dur":10.81}]},{"speaker":"A","text":"Then there's frisky, which is a very literal way of saying someone is in high spirits.","highlights":["in high spirits"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/287406-288439.webm","at":2874.3,"dur":10.33}]},{"speaker":"B","text":"And frolic! I always associate that word with a picture of happy children jumping around and being happy.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/288558-289457.webm","at":2885.7,"dur":8.99},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/289996-291386.webm","at":2900.2,"dur":13.9}]},{"speaker":"A","text":"It's such a rabbit hole. You start diving into the thesaurus and it's a never-ending cycle of rare words like romp.","highlights":["rabbit hole","never-ending cycle"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/294440-295845.webm","at":2944.5,"dur":14.05},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/296042-296565.webm","at":2960.6,"dur":5.23}]},{"speaker":"B","text":"Right, and some words have sexual connotations, like romp. Then you have expressions like 'razz' for soft bullying or laughing at someone.","highlights":["sexual connotation"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/297238-297909.webm","at":2972.5,"dur":6.71},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/301420-303123.webm","at":3014.3,"dur":17.03}]},{"speaker":"A","text":"English is so rich. I just found out the phrase 'phony baloney' the other day. It sounded like abracadabra at first!","highlights":["the other day"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/304650-306378.webm","at":3046.6,"dur":17.28}]}],"time":2588.5,"topic":6},{"title":"Professional Scrabble Strategy and Tactics","lines":[{"speaker":"A","text":"When you say something is completely fake, you could use the word 'phony' or even 'baloney.'","highlights":["completely fake"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/307970-308517.webm","at":3079.8,"dur":5.47}]},{"speaker":"B","text":"Speaking of words, do you know the game Scrabble?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/308882-309668.webm","at":3089.0,"dur":7.86}]},{"speaker":"A","text":"I actually watch a guy on YouTube who plays Scrabble in English. He has a really weird haircut and a beard.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/309840-310698.webm","at":3098.5,"dur":8.58}]},{"speaker":"B","text":"I saw a video about the Scrabble champion who won several world championships without actually knowing French. How is that even possible?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/313438-314567.webm","at":3134.5,"dur":11.29},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/314872-315322.webm","at":3148.9,"dur":4.5}]},{"speaker":"A","text":"It's because the game is played in a very interesting way. At a professional level, there's a computer program containing every possible word, including rare dialects and outdated forms.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/315272-315677.webm","at":3152.8,"dur":4.05},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/317704-318234.webm","at":3177.2,"dur":5.3}]},{"speaker":"B","text":"So if you challenge a word and the computer says it's valid, you lose a point. If it's invalid, your opponent loses the point.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/319860-321360.webm","at":3198.7,"dur":15.0}]},{"speaker":"A","text":"Exactly. They memorize huge amounts of vocabulary, and the game becomes like chess. It's all about strategy and predicting what your opponent might lay on the board.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/322900-323940.webm","at":3229.1,"dur":10.4}]},{"speaker":"B","text":"It's like cards; you have to guess what's in their hand and block them from getting high points. It's all about blocking your opponent.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/325584-326370.webm","at":3255.9,"dur":7.86},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/329086-329621.webm","at":3291.1,"dur":5.35}]},{"speaker":"A","text":"I was thinking about the term 'card blocked.' It's a slang term for when someone prevents you from getting romantic access to someone.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/336100-337397.webm","at":3361.2,"dur":12.97},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/337800-338339.webm","at":3378.2,"dur":5.39}]},{"speaker":"B","text":"Right, and the whole point of Scrabble is card blocking your opponent to make it difficult for them to construct high-scoring words.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/338802-339972.webm","at":3388.1,"dur":11.7}]},{"speaker":"A","text":"It's just like chess. They try to prevent a draw, and there are mechanics like 'bingo.' Currently, humans can actually outplay the engines.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/340732-342136.webm","at":3407.4,"dur":14.04}]},{"speaker":"B","text":"I was amazed by the tactics involved. There are full world tournaments where professionals play with these deep strategies.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/344186-344820.webm","at":3442.0,"dur":6.34}]}],"time":3079.8,"topic":6},{"title":"Vocabulary games and pronunciation practice","lines":[{"speaker":"A","text":"To be honest, I didn't really enjoy playing games like that. I tried some, but I found them a bit boring.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/346344-346703.webm","at":3463.5,"dur":3.59},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/347988-348262.webm","at":3480.0,"dur":2.74}]},{"speaker":"B","text":"I get that. However, if you approach it strategically and treat it like a sport to win tournaments, it actually becomes quite interesting.","highlights":["approach it strategically"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/349120-349636.webm","at":3491.3,"dur":5.16},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/350372-350544.webm","at":3503.8,"dur":1.72}]},{"speaker":"A","text":"I'll do my best to incorporate the pronunciation checker into the review. You can check it out in the final version.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/351596-352565.webm","at":3516.2,"dur":9.69}]},{"speaker":"B","text":"That would be great. It'll help me understand how to pronounce words better. What did you find out about the results?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/353080-354643.webm","at":3530.9,"dur":15.63}]},{"speaker":"A","text":"The tool tests every sound against the transcript. For example, it shows that you often say 'together' instead of 'brother'.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/355498-356869.webm","at":3555.1,"dur":13.71}]},{"speaker":"B","text":"Those are consonants, right? Consonants are easier to fix. Vowels are much harder because there are many that don't exist in Russian.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/358592-359751.webm","at":3586.0,"dur":11.59}]},{"speaker":"A","text":"Exactly. I actually tripped up on the word 'air' a couple of times because the sounds are so similar.","highlights":["tripped up on"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/361360-362066.webm","at":3613.7,"dur":7.06}]},{"speaker":"B","text":"They do sound similar, especially with a low-quality microphone. The software might struggle to capture your vowels clearly.","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/362910-363665.webm","at":3629.2,"dur":7.55},{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/364098-364555.webm","at":3641.1,"dur":4.57}]},{"speaker":"A","text":"Are you heading to the countryside today? Are you going to the village?","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/365206-365576.webm","at":3652.2,"dur":3.7}]},{"speaker":"B","text":"No, not me. My brother is on the road to the village right now. He's going to have a party and just chill with his friends.","highlights":["on the road"],"clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/365570-366836.webm","at":3655.8,"dur":12.66}]},{"speaker":"A","text":"Well, you'll have a lot of fun checking your pronunciation with the reviewer next week. Have a great weekend!","clips":[{"src":"lesson_audio/lesson_date_02-10-2026_time_15-08-48/367812-368931.webm","at":3678.2,"dur":11.19}]}],"time":3463.5,"topic":7}],"dialogue_gaps":[{"term":"dodge","definition":"Move quickly aside to avoid being hit by something.","dialogue_index":0,"line_index":6,"quote":"dodging","gap":{"sentence":"The boxer stepped aside to _____ the punch rather than let it hit him.","answer":"dodge","options":["dodge","deliver","measure","prolong"]}},{"term":"propagandist","definition":"Someone who spreads carefully chosen or misleading messages to promote a political cause.","dialogue_index":1,"line_index":1,"quote":"propagandists","gap":{"sentence":"The regime's _____ spread misleading stories designed to make the public support its policies.","answer":"propagandists","options":["propagandists","critics","opponents","auditors"]}},{"term":"counter","definition":"Respond to something with an opposing argument or action.","dialogue_index":1,"line_index":4,"quote":"counter","gap":{"sentence":"Her evidence showed the treatment worked, helping her _____ the claim that it had no effect.","answer":"counter","options":["counter","confirm","endorse","reinforce"]}},{"term":"status quo","definition":"The existing state of affairs, especially when people resist changing it.","dialogue_index":2,"line_index":4,"quote":"status quo","gap":{"sentence":"The committee opposed every proposed reform because its members wanted to preserve the _____.","answer":"status quo","options":["status quo","final straw","chain reaction","false alarm"]}},{"term":"come down to","definition":"Have one particular factor as the essential issue or deciding consideration.","dialogue_index":2,"line_index":3,"quote":"comes down to","gap":{"sentence":"With both candidates equally qualified, the final decision may _____ who can start on Monday.","answer":"come down to","options":["come down to","run away from","catch up with","break out of"]}},{"term":"curate","definition":"Carefully select, organize, and oversee material so it forms a useful collection or presentation.","dialogue_index":2,"line_index":8,"quote":"curating","gap":{"sentence":"Museums employ experts to _____ exhibitions, carefully choosing which objects to display and how to present them.","answer":"curate","options":["curate","demolish","postpone","conceal"]}},{"term":"standalone","definition":"Able to function independently rather than as a component of something larger.","dialogue_index":2,"line_index":7,"quote":"standalone","gap":{"sentence":"The tool runs as a _____ application, rather than as a component inside a larger program.","answer":"standalone","options":["standalone","built-in","embedded","integrated"]}},{"term":"degrade","definition":"Become worse in quality or cause something to lose quality.","dialogue_index":3,"line_index":0,"quote":"degrades","gap":{"sentence":"Repeated copying can _____ an image's quality, making it blurrier each time.","answer":"degrade","options":["degrade","improve","preserve","restore"]}},{"term":"inadequate","definition":"Not good enough or not sufficient for what is needed.","dialogue_index":4,"line_index":1,"quote":"inadequate","gap":{"sentence":"A single bottle of water was _____ for ten hikers on an all-day walk.","answer":"inadequate","options":["inadequate","sufficient","plentiful","excessive"]}},{"term":"drain","definition":"Use up a supply of energy or resources, leaving little or none.","dialogue_index":5,"line_index":8,"quote":"drain","gap":{"sentence":"Running the screen at maximum brightness will _____ the battery, leaving the phone             }

            function cardHtml(card, examples, options) {
                let html;
                if (graded) {
                    const grade = gradeOf(card);
                    html = `<article class="card mistake gr gr${grade}" data-level="g${grade}" data-search-card="m-${mistakes.indexOf(card)}">`;
                    html += `<div class="m-head" data-no-speech><span class="grade-badge"><b class="grade-num">${grade}</b>${GRADES[grade].name}</span><span class="tag">${esc(card.label)}</span>`;
                } else {
                    const level = SEVERITY[card.severity] ? card.severity : 'medium';
                    html = `<article class="card mistake ${level}" data-level="${level}" data-search-card="m-${mistakes.indexOf(card)}">`;
                    html += `<div class="m-head" data-no-speech><span class="sev">${SEVERITY[level].name}</span><span class="tag">${esc(card.label)}</span>`;
                }
                if (options.grouped && examples.length > 1) html += `<span class="times">× ${examples.length}</span>`;
                html += '</div>';
                const rule = options.grouped ? card.rule : (examples[0].why || card.rule);
                if (rule) html += `<p class="rule">${esc(rule)}</p>`;
                examples.forEach((example, index) => {
                    const ownWhy = options.grouped && examples.length > 1 && example.why && plain(example.why) !== plain(card.rule);
                    html += exampleHtml(example, {
                        showTopic: options.showTopic,
                        hidden: options.grouped && index >= 3,
                        why: ownWhy ? example.why : '',
                    });
                });
                if (options.grouped && examples.length > 3) html += `<button class="more-toggle" type="button" data-no-speech>Show ${examples.length - 3} more</button>`;
                return html + '</article>';
            }

            const everyExample = [];
            mistakes.forEach(card => (card.examples || []).forEach(example => everyExample.push({ card, example })));
            const inLessonOrder = (x, y) => (x.example.at ?? x.example.time ?? 0) - (y.example.at ?? y.example.time ?? 0);
            const hasOrder = everyExample.some(item => item.example.at !== undefined || item.example.time !== undefined);

            // "Most important": the gravest grade first, then the mistakes made
            // most often, then the earliest. Older lessons keep their own order.
            const firstSaid = card => Math.min(Infinity, ...(card.examples || []).map(e => (e.clip ? e.clip.at : e.time) ?? Infinity));
            const byImportance = graded
                ? mistakes.slice().sort((x, y) => gradeOf(x) - gradeOf(y)
                    || (y.examples || []).length - (x.examples || []).length
                    || firstSaid(x) - firstSaid(y))
                : mistakes;

            function listHtml(view) {
                if (view === 'time') {
                    return everyExample.slice().sort(inLessonOrder)
                        .map(item => cardHtml(item.card, [item.example], { showTopic: true })).join('');
                }
                if (view === 'topic') {
                    return topics.map((topic, number) => {
                        const items = everyExample.filter(item => item.example.topic === number).sort(inLessonOrder);
                        if (!items.length) return '';
                        let html = `<section class="topic-group"><h3 class="topic-head" data-no-speech>`;
                        if (topic.time !== null && topic.time !== undefined) html += `<span class="clock">${clock(topic.time)}</span>`;
                        html += `<span>${esc(topic.title)}</span><span class="topic-count">${items.length}</span></h3>`;
                        html += items.map(item => cardHtml(item.card, [item.example], {})).join('');
                        return html + '</section>';
                    }).join('');
                }
                return byImportance.map(card => cardHtml(card, card.examples || [], { grouped: true, showTopic: true })).join('');
            }

            function renderMistakes() {
                const panel = document.getElementById('panel-mistakes');
                if (!mistakes.length) {
                    panel.innerHTML = '<p class="empty">No mistakes worth mentioning in this lesson. Great job!</p>';
                    return;
                }
                const views = [['importance', 'Most important']];
                if (hasOrder) views.push(['time', 'By time']);
                if (topics.length > 1) views.push(['topic', 'By topic']);
                const counts = graded ? {} : { high: 0, medium: 0, low: 0 };
                mistakes.forEach(m => {
                    const level = graded ? gradeOf(m) : m.severity;
                    counts[level] = (counts[level] || 0) + 1;
                });
                const scale = [1, 2, 3, 4, 5, 6, 7];

                let html = '';
                if (graded) {
                    // The whole scale first, the same in every lesson; the grades
                    // this lesson does not have are faded.
                    const open = storage('lesson-grades') !== 'closed';
                    const absent = grade => counts[grade] ? '' : ' absent';
                    html += `<section class="grades${open ? '' : ' closed'}" aria-label="Grades" data-no-speech><div class="grades-head">`
                        + '<span class="grades-title"><span class="grades-long">How clear your meaning was</span><span class="grades-short">Grades</span></span>'
                        + `<span class="grades-strip" aria-hidden="true">${scale.map(g => `<b class="grade-num gr gr${g}${absent(g)}">${g}</b>`).join('')}</span>`
                        + `<button class="grades-toggle" type="button" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>`
                        + '<ol class="grades-list">'
                        + scale.map(g => `<li class="grade-row gr gr${g}${absent(g)}" title="${GRADES[g].name}: ${GRADES[g].full}"><b class="grade-num">${g}</b><span><b>${GRADES[g].name}</b> – ${GRADES[g].hint}</span></li>`).join('')
                        + '</ol>'
                        + (scale.some(g => !counts[g]) ? '<p class="grades-note">Faded: none in this lesson.</p>' : '')
                        + '</section>';
                }
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Order of the mistakes" data-no-speech>';
                    html += views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('');
                    html += '</div>';
                }
                html += '<div class="chips" data-no-speech>';
                html += `<button class="chip" type="button" data-filter="all" aria-pressed="true">All ${mistakes.length}</button>`;
                if (graded) {
                    scale.forEach(g => {
                        if (counts[g]) html += `<button class="chip grade-chip gr gr${g}" type="button" data-filter="g${g}" aria-pressed="false" title="${GRADES[g].name}" aria-label="Grade ${g}, ${GRADES[g].name}: ${counts[g]}"><b class="grade-num">${g}</b>${counts[g]}</button>`;
                    });
                    html += '</div>';
                } else {
                    ['high', 'medium', 'low'].forEach(level => {
                        if (counts[level]) html += `<button class="chip" type="button" data-filter="${level}" aria-pressed="false"><i class="dot ${level}"></i>${SEVERITY[level].name} ${counts[level]}</button>`;
                    });
                    html += '</div><p class="legend" data-no-speech>';
                    html += ['high', 'medium', 'low'].map(level => `<span><i class="dot ${level}"></i><span><b>${SEVERITY[level].name}</b>: ${SEVERITY[level].hint}</span></span>`).join('');
                    html += '</p>';
                }
                html += '<div id="mistake-list"></div>';
                panel.innerHTML = html;

                const list = document.getElementById('mistake-list');
                let filter = 'all';
                const applyFilter = () => {
                    list.querySelectorAll('.mistake').forEach(card => {
                        card.hidden = filter !== 'all' && card.dataset.level !== filter;
                    });
                    list.querySelectorAll('.topic-group').forEach(group => {
                        group.hidden = !group.querySelector('.mistake:not([hidden])');
                    });
                };
                const showView = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'importance';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
                    stopClip();
                    list.innerHTML = listHtml(view);
                    applyFilter();
                    if (remember) storage('lesson-mistake-view', view);
                };
                showAllMistakes = () => {
                    if (filter === 'all') return;
                    filter = 'all';
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === 'all')));
                    applyFilter();
                };
                showMistakeSearchView = () => showView('importance', false);
                mistakeFilter = () => filter;
                setMistakeFilter = wanted => {
                    if (!panel.querySelector(`.chip[data-filter="${wanted}"]`)) wanted = 'all';
                    if (filter === wanted) return;
                    filter = wanted;
                    panel.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter)));
                    applyFilter();
                };
                showView(storage('lesson-mistake-view') || 'importance', false);

                panel.addEventListener('click', event => {
                    const toggle = event.target.closest('.grades-toggle');
                    if (toggle) {
                        const grades = toggle.closest('.grades');
                        const open = grades.classList.toggle('closed') === false;
                        toggle.setAttribute('aria-expanded', String(open));
                        toggle.textContent = open ? 'Hide' : 'Show';
                        storage('lesson-grades', open ? 'open' : 'closed');
                        return;
                    }
                    const view = event.target.closest('.view');
                    if (view) showView(view.dataset.view, true);
                    const chip = event.target.closest('.chip');
                    if (chip) {
                        panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                        filter = chip.dataset.filter;
                        applyFilter();
                    }
                    const more = event.target.closest('.more-toggle');
                    if (more) {
                        more.closest('.mistake').querySelectorAll('.pair[hidden]').forEach(p => { p.hidden = false; });
                        more.remove();
                    }
                });
            }

            // ------------------------------------------------------ vocabulary
            const gapItems = vocabulary
                .map((entry, index) => ({ entry, index }))
                .filter(item => item.entry.gap && item.entry.gap.answer && (item.entry.gap.options || []).length >= 2);
            const matchable = vocabulary.map((entry, index) => index).filter(index => vocabulary[index].definition);
            const matchable2 = matchable.filter(i => vocabulary[i].match_definition
                && vocabulary[i].match_definition.trim().toLowerCase() !== vocabulary[i].definition.trim().toLowerCase());
            const dialogueGapItems = (LESSON.dialogue_gaps || [])
                .filter(entry => entry.gap?.answer && entry.gap?.options?.includes(entry.gap.answer)
                    && entry.gap.options.length >= 2 && dialogues[entry.dialogue_index]?.lines?.[entry.line_index])
                .map((entry, index) => ({ entry, index }));

            function shuffled(items) {
                const copy = items.slice();
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function speak(text) {
                if (window.lessonVoice && text) window.lessonVoice.speak(text);
            }

            // Older lessons stored examples as plain strings.
            function exampleItems(entry) {
                return (entry.examples || [])
                    .map(example => typeof example === 'string' ? { sentence: example, pattern: '' } : example)
                    .filter(example => example && example.sentence);
            }

            function formsHtml(entry) {
                const column = (title, hint, items) => {
                    if (!items.length) return '';
                    let html = `<div class="form-col"><p class="part-title" data-no-speech>${title} <span>${hint}</span></p><ol class="meanings">`;
                    html += items.map(item => `<li><span class="meaning">${esc(item.meaning)}</span><span class="m-ex">${highlightTerm(item.example, entry.term)}`
                        + (item.lesson ? ' <span class="from-lesson" data-no-speech>from the lesson</span>' : '') + '</span></li>').join('');
                    return html + '</ol></div>';
                };
                return '<div class="forms">'
                    + column('Countable', 'a / an, plural', entry.countable || [])
                    + column('Uncountable', 'no a / an, no plural', entry.uncountable || [])
                    + '</div>';
            }

            function relatedHtml(entry) {
                const row = (title, words) => (words || []).length
                    ? `<div class="rel"><p class="part-title" data-no-speech>${title}</p><span class="rel-words">${words.map(w => `<span class="rel-word">${esc(w)}</span>`).join('<span class="sep" data-no-speech> · </span>')}</span></div>`
                    : '';
                return row('Synonyms', entry.synonyms) + row('Antonyms', entry.antonyms);
            }

            // Visible: when it was said, the word, the meaning, the lesson's own
            // words and at least three examples. The rest opens on request.
            function wordCardHtml(entry, index) {
                const term = entry.term || '';
                let html = `<article class="card word" id="word-${index}" data-search-card="word-${index}"><div class="w-head">`;
                if (entry.clip) html += clipHtml(entry.clip, 'Hear it in the lesson');
                else if (entry.time !== null && entry.time !== undefined) html += `<span class="clock" data-no-speech>${clock(entry.time)}</span>`;
                html += jumpsHtml('vocabulary', entry.clip ? entry.clip.at : entry.time);
                // The word, its kind and its speaker stay together (a new row when
                // they do not fit); the kind and the speaker never part.
                html += `<div class="w-title"><h3 class="w-term">${esc(term)}</h3><span class="w-side">`;
                if (entry.pos) html += `<span class="w-pos" data-no-speech>${esc(entry.pos)}</span>`;
                html += playButton(term, 'Listen to ' + term) + '</span></div></div>';
                if (entry.definition) html += `<p class="def">${esc(entry.definition)}</p>`;
                const passage = entry.lesson || entry.lesson_example;
                if (passage) {
                    html += `<div class="lesson-ex"><div class="txt"><span class="src" data-no-speech>From the lesson</span>${highlightTerm(passage, term)}</div>${playButton(passage, 'Listen')}</div>`;
                }
                const examples = exampleItems(entry);
                if (examples.length) {
                    html += '<ul class="examples">' + examples.map(example => '<li>'
                        + (example.pattern ? `<span class="pat" data-no-speech>${esc(example.pattern)}</span> ` : '')
                        + highlightTerm(example.sentence, term) + '</li>').join('') + '</ul>';
                }
                if (entry.note) html += `<p class="note">${icons.bulb}<span>${esc(entry.note)}</span></p>`;

                const parts = [];
                if ((entry.countable || []).length || (entry.uncountable || []).length) parts.push(['forms', 'Countable / uncountable', formsHtml(entry)]);
                if ((entry.more_examples || []).length) {
                    parts.push(['more', 'More examples', '<p class="part-title" data-no-speech>More examples</p><ul class="examples">'
                        + entry.more_examples.map(s => `<li>${highlightTerm(s, term)}</li>`).join('') + '</ul>']);
                }
                const related = relatedHtml(entry);
                if (related) parts.push(['related', 'Synonyms & antonyms', related]);
                if (parts.length) {
                    html += '<div class="more-bar" data-no-speech>'
                        + parts.map(([id, name]) => `<button class="more-btn" type="button" data-part="${id}" aria-expanded="false">${name}</button>`).join('')
                        + '<button class="more-btn more-hide" type="button">Hide</button></div>';
                    html += parts.map(([id, , body]) => `<div class="more-part" data-part="${id}" hidden>${body}</div>`).join('');
                }
                return html + '</article>';
            }

            // Matching pairs: all the words, shuffled into rounds of about six;
            // the meanings are shuffled separately.
            function renderMatch(game, level = 1) {
                const pool = shuffled(level === 2 ? matchable2 : matchable);
                const meaning = i => level === 2 ? vocabulary[i].match_definition : vocabulary[i].definition;
                const roundCount = Math.ceil(pool.length / 6);
                const rounds = [];
                for (let r = 0, cursor = 0; r < roundCount; r++) {
                    const size = Math.floor(pool.length / roundCount) + (r < pool.length % roundCount ? 1 : 0);
                    rounds.push(pool.slice(cursor, cursor + size));
                    cursor += size;
                }
                let round = 0, misses = 0, picked = null;
                const missText = () => misses === 1 ? '1 mistake' : `${misses} mistakes`;

                function draw() {
                    const ids = rounds[round];
                    let html = `<div class="game-head" data-no-speech><span>Round ${round + 1} of ${rounds.length}</span><span class="game-score">${missText()}</span></div>`;
                    html += '<p class="game-hint" data-no-speech>Tap a word, then its meaning.</p>';
                    html += '<div class="match-board" data-no-speech><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile term" type="button" data-id="${i}" aria-pressed="false">${esc(vocabulary[i].term)}</button>`).join('');
                    html += '</div><div class="match-col">';
                    html += shuffled(ids).map(i => `<button class="tile meaning" type="button" data-id="${i}" aria-pressed="false">${esc(meaning(i))}</button>`).join('');
                    html += '</div></div><div class="game-foot" data-no-speech></div>';
                    game.innerHTML = html;
                    picked = null;
                }

                function roundDone() {
                    window.reviewActivity?.record('quiz_round_complete', { game: 'match', level, round: round + 1, rounds: rounds.length, mistakes: misses, words: rounds[round].map(i => vocabulary[i].term), complete: round + 1 === rounds.length }, 'vocabulary');
                    const foot = game.querySelector('.game-foot');
                    if (round + 1 < rounds.length) {
                        foot.innerHTML = `<p>Round complete!</p><button class="game-btn" type="button" data-action="next-round">Next round</button>`;
                    } else {
                        foot.innerHTML = `<div class="summary"><p class="big">All ${pool.length} words matched</p><p>${missText()}</p>`
                            + '<button class="game-btn" type="button" data-action="restart">Play again</button></div>';
                    }
                    foot.querySelector('button').focus({ preventScroll: true });
                }

                game.addEventListener('click', event => {
                    const tile = event.target.closest('.tile');
                    if (tile && !tile.disabled) {
                        const side = tile.classList.contains('term') ? 'term' : 'meaning';
                        if (picked === tile) {
                            tile.setAttribute('aria-pressed', 'false');
                            picked = null;
                        } else if (!picked || picked.classList.contains(side)) {
                            if (picked) picked.setAttribute('aria-pressed', 'false');
                            picked = tile;
                            tile.setAttribute('aria-pressed', 'true');
                        } else {
                            const other = picked;
                            picked = null;
                            other.setAttribute('aria-pressed', 'false');
                            window.reviewActivity?.record('quiz_answer', { game: 'match', level, round: round + 1, term: vocabulary[Number((tile.classList.contains('term') ? tile : other).dataset.id)].term, selected_meaning: meaning(Number((tile.classList.contains('meaning') ? tile : other).dataset.id)), correct: other.dataset.id === tile.dataset.id }, 'vocabulary');
                            if (other.dataset.id === tile.dataset.id) {
                                [other, tile].forEach(t => { t.classList.add('done'); t.disabled = true; });
                                speak(vocabulary[Number(tile.dataset.id)].term);
                                if (!game.querySelector('.tile:not(.done)')) roundDone();
                            } else {
                                misses++;
                                game.querySelector('.game-score').textContent = missText();
                                [other, tile].forEach(t => {
                                    t.classList.remove('wrong');
                                    void t.offsetWidth; // restart the shake
                                    t.classList.add('wrong');
                                    setTimeout(() => t.classList.remove('wrong'), 450);
                                });
                            }
                        }
                        return;
                    }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next-round') { round++; draw(); }
                    if (action.dataset.action === 'restart') renderMatch(freshGame('match', level), level);
                });
                draw();
            }

            // Fill the gap: a new sentence, the word hidden, four options.
            function dialogueSource(entry) {
                const dialogue = dialogues[entry.dialogue_index];
                const line = dialogue?.lines?.[entry.line_index];
                if (!line) return '';
                const quote = entry.quote || entry.gap?.answer || entry.term;
                const start = line.text.indexOf(quote);
                const index = dialogueGapItems.findIndex(item => item.entry === entry);
                const reference = quote && start >= 0 && index >= 0
                    ? esc(line.text.slice(0, start))
                        + `<a class="quiz-source-link" href="#panel-dialogues" data-no-speech data-quiz-source="${index}" aria-label="Go to ${esc(quote)} in Dialogues" title="Go to this word in Dialogues"><mark class="expr">${esc(line.text.slice(start, start + quote.length))}</mark></a>`
                        + esc(line.text.slice(start + quote.length))
                    : esc(line.text);
                return `<details class="quiz-source"><summary data-no-speech>See it in the dialogue</summary>`
                    + `<p class="quiz-source-title">${esc(dialogue.title)}</p><blockquote>${reference}</blockquote></details>`;
            }

            function renderGap(game, level = 1) {
                const order = shuffled(level === 2 ? dialogueGapItems : gapItems);
                let position = 0, score = 0;
                const missed = [];

                function draw() {
                    const { entry } = order[position];
                    const [before, after] = entry.gap.sentence.split(/_{3,}/);
                    let html = `<div class="game-head" data-no-speech><span>${position + 1} of ${order.length}</span><span class="game-score">${score} correct</span></div>`;
                    html += `<div class="card"><p class="gap-sentence">${esc(before)}<span class="blank" data-no-speech>&nbsp;</span>${esc(after || '')}</p>`;
                    html += '<div class="options" data-no-speech>'
                        + shuffled(entry.gap.options).map(o => `<button class="option" type="button" data-option="${esc(o)}">${esc(o)}</button>`).join('')
                        + '</div><div class="gap-result" hidden></div></div>';
                    game.innerHTML = html;
                }

                function answer(button) {
                    const { entry, index } = order[position];
                    const right = button.dataset.option === entry.gap.answer;
                    window.reviewActivity?.record('quiz_answer', { game: 'gap', level, question: position + 1, term: entry.term, sentence: entry.gap.sentence, selected: button.dataset.option, answer: entry.gap.answer, correct: right }, 'vocabulary');
                    game.querySelectorAll('.option').forEach(b => {
                        b.disabled = true;
                        if (b.dataset.option === entry.gap.answer) b.classList.add('right');
                    });
                    if (right) score++;
                    else { button.classList.add('wrong'); missed.push({ entry, index }); }
                    game.querySelector('.game-score').textContent = `${score} correct`;
                    const blank = game.querySelector('.blank');
                    blank.textContent = entry.gap.answer;
                    blank.classList.add('filled');
                    blank.removeAttribute('data-no-speech');
                    const full = entry.gap.sentence.replace(/_{3,}/, entry.gap.answer);
                    const last = position + 1 >= order.length;
                    const result = game.querySelector('.gap-result');
                    result.innerHTML = `<p class="verdict ${right ? 'ok' : 'no'}" data-no-speech>${right ? '✓ Correct' : `✗ The answer is “${esc(entry.gap.answer)}”`}</p>`
                        + `<p class="gap-def"><b>${esc(entry.term)}</b>: ${esc(entry.definition)}</p>`
                        + (level === 2 ? dialogueSource(entry) : '')
                        + `<div class="gap-actions" data-no-speech>${playButton(full, 'Listen to the sentence')}`
                        + (level === 1 ? `<button class="game-btn secondary" type="button" data-word="${index}">See the word</button>` : '')
                        + `<button class="game-btn" type="button" data-action="${last ? 'finish' : 'next'}">${last ? 'Finish' : 'Next'}</button></div>`;
                    result.hidden = false;
                    result.querySelector('[data-action]').focus({ preventScroll: true });
                }

                function finish() {
                    window.reviewActivity?.record('quiz_complete', { game: 'gap', level, score, total: order.length, missed: missed.map(item => item.entry.term) }, 'vocabulary');
                    let html = `<div class="card summary"><p class="big">${score} of ${order.length}</p><p>${score === order.length ? 'Perfect!' : 'Words to review:'}</p>`;
                    if (missed.length) {
                        html += level === 1
                            ? '<div class="missed" data-no-speech>' + missed.map(({ entry, index }) => `<button class="chip" type="button" data-word="${index}">${esc(entry.term)}</button>`).join('') + '</div>'
                            : missed.map(({ entry }) => `<div class="quiz-review-item"><p class="gap-def"><b>${esc(entry.term)}</b>: ${esc(entry.definition)}</p>${dialogueSource(entry)}</div>`).join('');
                    }
                    html += '<button class="game-btn" type="button" data-action="restart">Try again</button></div>';
                    game.innerHTML = html;
                }

                game.addEventListener('click', event => {
                    const option = event.target.closest('.option');
                    if (option && !option.disabled) { answer(option); return; }
                    const action = event.target.closest('[data-action]');
                    if (!action) return;
                    if (action.dataset.action === 'next') { position++; draw(); }
                    if (action.dataset.action === 'finish') finish();
                    if (action.dataset.action === 'restart') renderGap(freshGame('gap', level), level);
                });
                draw();
            }

            let freshGame = () => null;

            function renderVocabulary() {
                const panel = document.getElementById('panel-vocabulary');
                if (!vocabulary.length && !dialogueGapItems.length) {
                    panel.innerHTML = '<p class="empty">No new vocabulary in this lesson.</p>';
                    return;
                }
                const views = [['words', 'Words']];
                if (matchable.length >= 3) views.push(['match', 'Match']);
                if (gapItems.length || dialogueGapItems.length) views.push(['gap', 'Fill the gap']);
                let html = '';
                if (views.length > 1) {
                    html += '<div class="viewbar" role="group" aria-label="Study or practise" data-no-speech>'
                        + views.map(([id, name]) => `<button class="view" type="button" data-view="${id}" aria-pressed="false">${name}</button>`).join('')
                        + '</div>';
                }
                html += '<div id="vocab-view"></div>';
                html += `<button class="back-to-quiz" type="button" hidden data-no-speech>${icons.backArrow}Back to the quiz</button>`;
                panel.innerHTML = html;
                const host = document.getElementById('vocab-view');
                const backButton = panel.querySelector('.back-to-quiz');
                // "See the word" leaves the quiz as it is (same question, same
                // score); the button brings it back where the reader left it.
                let current = 'words';
                let paused = null;
                const levels = { match: 1, gap: gapItems.length ? 1 : 2 };
                const sessions = new Map();
                const availableLevels = view => view === 'match'
                    ? (matchable2.length >= 3 ? [1, 2] : [1])
                    : [gapItems.length ? 1 : null, dialogueGapItems.length ? 2 : null].filter(Boolean);
                const leaveQuiz = () => {
                    paused = null;
                    backButton.hidden = true;
                };
                // Each game gets a new element, so its listeners go away with it.
                freshGame = (view, level) => {
                    levels[view] = level;
                    const description = view === 'match'
                        ? (level === 2 ? '<strong>Meaning challenge.</strong> Match familiar words to paraphrased definitions.'
                            : '<strong>Vocabulary practice.</strong> Match words to the definitions on their vocabulary cards.')
                        : (level === 2 ? '<strong>Dialogue challenge.</strong> Less common words and expressions from the dialogues, beyond the vocabulary list.'
                            : '<strong>Vocabulary practice.</strong> Complete sentences using words from the vocabulary list.');
                    host.innerHTML = `<div class="quiz-session" data-game="${view}" data-level="${level}">`
                        + '<div class="quiz-levels" data-no-speech><div class="quiz-level-row"><span class="quiz-level-label">Difficulty</span>'
                        + `<div class="quiz-level-buttons" role="group" aria-label="${view === 'match' ? 'Match' : 'Fill the gap'} difficulty">`
                        + availableLevels(view).map(n => `<button class="quiz-level" type="button" data-quiz-level="${n}" aria-pressed="${n === level}">Level ${n}</button>`).join('')
                        + `</div></div><p class="quiz-description">${description}</p></div><div class="game"></div></div>`;
                    sessions.set(`${view}-${level}`, host.firstChild);
                    return host.querySelector('.game');
                };

                const show = (view, remember) => {
                    if (!views.some(([id]) => id === view)) view = 'words';
                    panel.querySelectorAll('.view').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
